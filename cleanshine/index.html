	stageLine(o, late) {
		const list = o.sex ? [['tasdiq', 'Tasdiq'], ['yolda', 'Yo‘lda'], ['sexda', 'Olib ketildi']] : [['tasdiq', 'Tasdiq'], ['yolda', 'Yo‘lda'], ['ish', 'Ishlayapti'], ['tugadi', 'Tugadi']];
		const at = list.findIndex(([k]) => k === o.holat), cur = at < 0 ? list.length - 1 : at;
		return `<span class="steps">${list.map(([, t], i) => `<span class="step ${i < cur ? 'done' : i === cur ? 'cur' + (late ? ' late' : '') : ''}">${t}</span>`).join('')}</span>`;
	},
	brigCard(b) {
		const now = Time.now(), { active, next, list } = Calc.current(b.id), names = b.a.map(m => F.short(Data.userById(m.uid).ism)).join(', ');
		const doneN = list.filter(j => j.kind === 'ish' ? Calc.done(j.o) || j.o.holat === 'sexda' : j.o.holat === 'qaytarildi').length;
		let body;
		if (active) {
			const o = active.o, late = active.kind === 'ish' && Calc.late(o, now);
			body = `<button class="brg-j" data-act="openOrder" data-id="${o.id}"><span class="t">${UI.esc(Data.client(o).ism)} · ${active.kind === 'qaytar' ? 'qaytarish' : UI.esc(F.rowsShort(o))}</span>
				<span class="m">${UI.esc(F.addr(o.manzil))} · ${F.span(active.t, active.dav)}</span>${active.kind === 'ish' ? Views.stageLine(o, late) : ''}${late ? UI.flag(`${late} daqiqa kechikyapti`) : ''}</button>`;
		} else body = `<div class="brg-j idle"><span>${list.length && doneN === list.length ? 'Bugungi ishlar tugadi' : next ? 'Bo‘sh, keyingi ishni kutmoqda' : 'Bugun ish yo‘q'}</span></div>`;
		return `<section class="card brg"><div class="brg-h"><h2>${b.nom}<small>${list.length ? `${doneN}/${list.length} ish` : ''}</small></h2>${UI.call(Data.lead(b).tel)}</div>
			<div class="brg-m">${UI.esc(names)}${b.usta ? ' · avto salon, sex' : ''}</div>${body}
			<div class="brg-n">${next ? `Keyingi: <b>${Time.hm(next.t)}</b> · ${next.kind === 'qaytar' ? 'qaytarish' : UI.esc(F.rowsShort(next.o))} · ${UI.esc(F.addr(next.o.manzil))}` : 'Bugun boshqa ish yo‘q'}</div></section>`;
	},
	feed() {
		const today = db.events.filter(e => Time.dayOf(e.t) === Time.today).slice().reverse(), list = ui.feedAll ? today : today.slice(0, 8);
		const row = e => {
			const o = e.oid && Data.order(e.oid), k = e.kid && Data.contract(e.kid);
			return `<div class="item ev"><span class="ev-t">${Time.hm(e.t)}</span><span class="ti ${EVENTS[e.tur].c}">${UI.icon(EVENTS[e.tur].icon)}</span><span class="x">
				<span class="t">${UI.esc(Views.actor(e))}: ${UI.esc(e.m)}</span><span class="m">${o ? `${UI.esc(Views.orderLine(o))} · ${Views.oid(o)}` : k ? UI.esc(Data.client(k.cid).ism) : ''}</span></span></div>`;
		};
		return UI.card('Hodisalar lentasi', `<div class="rows">${list.length ? list.map(row).join('') : UI.empty('Bugun hali hodisa yo‘q', 'history')}</div>
			${today.length > 8 ? `<div class="more-row"><button class="link sm" data-act="showFeed">${ui.feedAll ? 'Qisqartirish' : `Hammasi (${today.length})`}</button></div>` : ''}`, { id: 'feed' });
	},

	/* --- Buyurtmalar --- */
	orders() {
		const f = ui.orderFilter, list = FILTERS.map(([k, t, fn]) => [k, t, db.orders.filter(fn).length]);
		return `${UI.mobile() && can('submitOrder') ? UI.head('', `<button class="btn pri" data-act="go" data-p="yangi">${UI.icon('plus')}Yangi buyurtma</button>`) : ''}
			<div class="toolbar">${UI.filter('filterOrders', f.st, list)}<span class="grow"></span>${UI.search('orderFilter', f.q, 'Ism, telefon yoki manzil')}</div>
			<section class="card" id="list">${Views.ordersList()}</section>`;
	},
	orderRows() {
		const f = ui.orderFilter, fn = FILTERS.find(x => x[0] === f.st)[2], q = f.q.trim().toLowerCase(), digits = q.replace(/\D/g, '');
		const hit = o => { if (!q) return true; const c = Data.client(o); return c.ism.toLowerCase().includes(q) || o.manzil.toLowerCase().includes(q) || String(o.id).includes(q) || (digits.length >= 3 && F.telDigits(c.tel).includes(digits)); };
		const rows = db.orders.filter(o => fn(o) && hit(o));
		const back = f.st === 'tugadi' || f.st === 'bekor';
		return rows.sort((a, b) => back ? b.t - a.t : ((b.holat === 'sorov') - (a.holat === 'sorov')) || a.t - b.t);
	},
	ordersList() {
		const rows = Views.orderRows(), shown = rows.slice(0, ui.orderLimit);
		const cols = [
			['Vaqt', 'm-hide nowrap', o => `${F.day(o.t)}, ${Time.hm(o.t)}`],
			['Mijoz', 'c-main', o => `${UI.esc(Data.client(o).ism)}<span class="sub">${KANAL[o.kanal]} · ${Views.oid(o)}</span>`],
			['Summa', 'c-aside num', o => F.num(Calc.total(o))],
			['', 'c-sub d-hide', o => `${F.day(o.t)}, ${Time.hm(o.t)} · ${UI.esc(F.addr(o.manzil))}`],
			['Manzil', 'm-hide', o => UI.esc(F.addr(o.manzil))],
			['Xizmatlar', 'c-sub', o => UI.esc(F.rowsShort(o))],
			['Brigada', '', o => o.bid ? Data.brig(o.bid).nom : '<span class="muted">biriktirilmagan</span>'],
			['Holat', '', o => Calc.late(o) ? UI.chip(`${Calc.late(o)} daq kechikyapti`, 'red') : UI.sd(o)],
			['To‘lov', '', o => Views.payFlag(o)]
		];
		// Summa ustuni noutbukda Xizmatlardan keyin turishi uchun tartib alohida
		const foot = ['', 'c-sub c-foot', o => `${cols[7][2](o)}<span class="muted">${o.bid ? Data.brig(o.bid).nom : 'brigadasiz'}</span>${Calc.done(o) && !o.kid ? Views.payFlag(o) : ''}`];
		const desk = UI.mobile() ? [cols[1], cols[2], cols[3], cols[5], foot] : [cols[0], cols[1], cols[4], cols[5], cols[2], cols[6], cols[7], cols[8]];
		return UI.table(desk, shown, { open: o => ['openOrder', o.id], empty: 'Bu bo‘limda buyurtma yo‘q', icon: 'list' })
			+ (rows.length > shown.length ? `<div class="more-row"><button class="link sm" data-act="moreOrders">Yana ${Math.min(40, rows.length - shown.length)} ta (jami ${rows.length})</button></div>` : '');
	},

	chain(o) {
		const first = db.events.find(e => e.oid === o.id), conf = db.events.find(e => e.oid === o.id && ['qabul', 'tasdiq'].includes(e.tur));
		const t0 = first ? first.t : null, t1 = o.holat === 'sorov' ? null : conf ? conf.t : t0;
		const list = o.sex
			? [['So‘rov', t0], ['Tasdiqlandi', t1], ['Yo‘lda', o.ts.yolda], ['Olib ketildi', o.ts.olindi], ['Sexda tayyor', o.ts.tayyor], ['Qaytarildi', o.ts.qaytarildi]]
			: [['So‘rov', t0], ['Tasdiqlandi', t1], ['Yo‘lda', o.ts.yolda], ['Ishlayapti', o.ts.ish], ['Tugadi', o.ts.tugadi]];
		if (o.kid) list.splice(0, 2, ['Shartnoma bo‘yicha', o.t - DAY]);
		let cur = list.map(x => !!x[1]).lastIndexOf(true);
		const late = Calc.late(o);
		const items = list.map(([k, t], i) => `<li class="${i <= cur ? (i === cur && !Calc.done(o) ? 'cur' : 'done') : ''}${late && i === cur + 1 ? ' bad' : ''}"><span class="k">${k}</span><span class="v">${t ? F.when(t) : late && i === cur + 1 ? `${late} daqiqa kechikyapti` : ''}</span></li>`);
		if (o.holat === 'bekor') { cur = -1; items.push(`<li class="bad"><span class="k">Bekor qilindi</span><span class="v">${UI.esc(o.sabab)}</span></li>`); }
		return `<ol class="chain">${items.join('')}</ol>`;
	},
	priceTable(o) {
		if (o.kid) {
			const k = Data.contract(o.kid);
			return `<table class="calc"><tr><td>Ofis tozalash<span class="sub">${F.som(k.summa)} oyiga ÷ ${k.tashrif} tashrif</span></td><td>${F.num(Calc.visit(k))}</td></tr>
				<tr class="tot"><td>Tashrif summasi</td><td>${F.som(Calc.visit(k))}</td></tr></table>${UI.rule('Tashrif summasi = oylik summa ÷ tashriflar soni')}`;
		}
		const p = Calc.price(o.rows, o.ust, o.cheg);
		return `<table class="calc">${p.lines.map(l => `<tr><td>${UI.esc(Data.svc(l.s).nom)}<span class="sub">${F.qty(l.h, l.s)} × ${F.num(l.tarif)}</span></td><td>${F.num(l.sum)}</td></tr>`).join('')}
			${p.ustSum ? `<tr class="x"><td>Ustama ${o.ust} % (murakkab ish)</td><td>+${F.num(p.ustSum)}</td></tr>` : ''}
			${p.cheg ? `<tr class="x"><td>Chegirma</td><td>−${F.num(p.cheg)}</td></tr>` : ''}
			${p.minUp ? `<tr class="x"><td>Minimal buyurtmagacha ko‘tarildi</td><td>${F.num(db.set.min)}</td></tr>` : ''}
			<tr class="tot"><td>Jami</td><td>${F.som(p.total)}</td></tr></table>${UI.rule('Narx = hajm × tarif, ustama va chegirma bilan; minimal buyurtma ' + F.som(db.set.min))}`;
	},
	photos(o) {
		const box = (k, t) => {
			const ids = o.foto[k] || [], src = ids.map(Data.photo).filter(Boolean);
			return `<div class="pbox"><span>${t}</span>${src.length ? `<img class="pimg" src="${src[0]}" alt="${t} surati">${src.length > 1 ? `<div class="pth">${src.slice(1).map(s => `<img src="${s}" alt="">`).join('')}</div>` : ''}`
				: `<div class="pnone">${UI.icon('camera')}Surat yo‘q</div>`}</div>`;
		};
		return `<div class="photos">${box('oldin', 'Oldin')}${box('keyin', 'Keyin')}</div><p class="hint mt8">Suratni brigadir ish joyida telefon kamerasidan qo‘shadi.</p>`;
	},
	orderCard(id) {
		const o = Data.order(id);
		if (!o) return Views.drawerHead('Buyurtma topilmadi') + `<div class="dbody">${UI.empty('Bu buyurtma o‘chirilgan yoki namuna qayta yaratilgan', 'list')}</div>`;
		const c = Data.client(o), b = o.bid && Data.brig(o.bid), total = Calc.total(o), paid = Calc.paid(o), debt = Calc.debt(o), late = Calc.late(o);
		const pays = db.pays.filter(p => p.oid === o.id), hist = db.events.filter(e => e.oid === o.id).slice().reverse();
		const shares = Calc.memberShares(o);
		const acts = [];
		if (o.holat === 'sorov' && can('openRequest')) acts.push(`<button class="btn pri" data-act="openRequest" data-id="${o.id}">${UI.icon('check')}Tasdiqlash</button>`);
		if (['tasdiq', 'yolda'].includes(o.holat) && can('openAssign')) acts.push(`<button class="btn${o.bid ? '' : ' pri'}" data-act="openAssign" data-id="${o.id}">${o.bid ? 'Brigada / vaqtni o‘zgartirish' : 'Brigada biriktirish'}</button>`);
		if (o.holat === 'sexda' && !o.ts.tayyor && can('markReady')) acts.push(`<button class="btn" data-act="markReady" data-id="${o.id}">Sexda tayyor</button>`);
		if (o.holat === 'sexda' && o.ts.tayyor && can('openReturn')) acts.push(`<button class="btn${o.qaytar ? '' : ' pri'}" data-act="openReturn" data-id="${o.id}">${o.qaytar ? 'Qaytarish vaqtini o‘zgartirish' : 'Qaytarishni belgilash'}</button>`);
		if (!o.kid && o.holat !== 'bekor' && o.holat !== 'sorov' && total - paid > 0 && can('openPayment')) acts.push(`<button class="btn${debt ? ' pri' : ''}" data-act="openPayment" data-id="${o.id}">${UI.icon('coin')}To‘lov qo‘shish</button>`);
		const cancel = !Calc.done(o) && o.holat !== 'bekor' && can('openCancel') ? `<button class="btn ghost dng" data-act="openCancel" data-id="${o.id}">Bekor qilish</button>` : '';
		return Views.drawerHead(`${Views.oid(o)} ${UI.status(o)}`, UI.esc(F.rowsShort(o)))
			+ `<div class="dbody">
				${late ? `<div class="note warn"><b>${b.nom} ${late} daqiqa kechikyapti.</b> Ish ${Time.hm(o.t)} da boshlanishi kerak edi. ${UI.call(Data.lead(b).tel, 'Brigadirga')}</div>` : ''}
				${UI.dl([
					['Mijoz', `<button class="link" data-act="openClient" data-id="${c.id}">${UI.esc(c.ism)}</button>${c.kontakt ? `<span class="sub muted"> · ${UI.esc(c.kontakt)}</span>` : ''}`],
					['Telefon', `${UI.esc(c.tel)} ${UI.call(c.tel)}`],
					['Manzil', UI.esc(o.manzil)],
					['Vaqt', `${F.day(o.t)}, ${F.span(o.t, o.dav)} <span class="muted">(${F.dur(o.dav)})</span>`],
					['Brigada', b ? `${b.nom} · ${UI.esc(Data.lead(b).ism)}` : '<span class="muted">biriktirilmagan</span>'],
					o.qaytar && ['Qaytarish', `${F.when(o.qaytar.t)} · ${Data.brig(o.qaytar.bid).nom}`],
					['Kanal', KANAL[o.kanal]],
					o.izoh && ['Izoh', UI.esc(o.izoh)]
				])}
				<div class="dsec"><h3>Holat</h3>${Views.chain(o)}</div>
				<div class="dsec"><h3>Xizmatlar va narx</h3>${Views.priceTable(o)}</div>
				${shares.length ? `<div class="dsec"><h3>Brigada ulushi · ${Data.brig(o.bid).foiz} %</h3><table class="calc">${shares.map(s => `<tr class="x"><td>${UI.esc(Data.userById(s.uid).ism)}</td><td>${F.num(s.sum)}</td></tr>`).join('')}<tr class="tot"><td>Jami ulush</td><td>${F.som(Calc.share(o))}</td></tr></table></div>` : ''}
				${o.kid ? '' : `<div class="dsec"><h3>Oldin va keyin</h3>${Views.photos(o)}</div>`}
				${o.kid ? '' : `<div class="dsec"><h3>To‘lovlar</h3>${pays.length ? `<table class="calc">${pays.map(p => `<tr class="x"><td>${F.when(p.t)} · ${USUL[p.usul]}${p.uid ? ` <span class="muted">(${UI.esc(F.short(Data.userById(p.uid).ism))})</span>` : ''}</td><td>${F.num(p.sum)}</td></tr>`).join('')}</table>` : '<p class="muted sm">To‘lov yo‘q</p>'}
					<p class="kv mt8"><span>${debt ? 'Qarz' : Calc.done(o) ? 'To‘langan' : 'Qoldi'}</span><b class="${debt ? 'red-t' : ''}">${F.som(debt || (Calc.done(o) ? paid : Math.max(0, total - paid)))}</b></p></div>`}
				<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}<small>${UI.esc(Views.actor(e))}</small></span></li>`).join('')}</ul></div>
			</div>${acts.length || cancel ? `<div class="dfoot">${cancel}<span class="grow"></span>${acts.join('')}</div>` : ''}`;
	},

	clientCard(id) {
		const c = Data.client(id), s = Calc.clientStats(c), ks = db.contracts.filter(k => k.cid === c.id);
		const histRow = o => `<tr class="ck"><td class="c-main"><button class="rowlink" data-act="openOrder" data-id="${o.id}">${F.date(o.t)}</button></td><td class="c-aside num">${F.num(Calc.total(o))}</td>
			<td class="c-sub">${UI.esc(F.rowsShort(o))}${Calc.debt(o) ? ` · <span class="red-t">qarz ${F.num(Calc.debt(o))}</span>` : ''}</td><td>${o.bid ? Data.brig(o.bid).nom : '—'}</td><td>${UI.sd(o)}</td></tr>`;
		return Views.drawerHead(UI.esc(c.ism), c.tur === 'ofis' ? 'Ofis mijozi' : 'Uy mijozi')
			+ `<div class="dbody cl2"><div>
				${UI.dl([['Telefon', `${UI.esc(c.tel)} ${UI.call(c.tel)}`], c.kontakt && ['Mas’ul', UI.esc(c.kontakt)], ['Manzil', c.manzil.map(UI.esc).join('<br>')],
					['Buyurtmalar', `${s.n} ta bajarilgan`], ['Jami', F.som(s.sum)], ['Qarz', s.debt ? `<b class="red-t">${F.som(s.debt)}</b>` : 'yo‘q'], s.last && ['Oxirgi xizmat', F.dateLong(s.last)]])}
				${ks.map(k => `<div class="dsec"><h3>Shartnoma</h3>${UI.dl([['Oylik summa', F.som(k.summa)], ['Tashrif', `${k.tashrif} ta / oy · ${Data.brig(k.bid).nom}`], ['Qoldiq', F.som(Calc.contractDebt(k))]])}</div>`).join('')}
				${c.tur === 'uy' && can('newFromClient') ? `<button class="btn pri mt16" data-act="newFromClient" data-id="${c.id}">${UI.icon('plus')}Yangi buyurtma</button>` : ''}</div>
				<div><h3>Buyurtmalar tarixi</h3>${s.list.length ? `<div class="tw"><table class="tbl cards hist-t"><thead><tr><th>Sana</th><th class="num">Summa</th><th>Xizmat</th><th>Brigada</th><th>Holat</th></tr></thead><tbody>${s.list.slice(0, 25).map(histRow).join('')}</tbody></table></div>` : '<p class="muted sm">Buyurtma yo‘q</p>'}</div>
`;
	}
};

/* ===== Views — yangi buyurtma, jadval, brigada ekrani (manba: c2.js) ===== */

const SLOTS = [...Array(24)].map((_, i) => { const h = 8 + Math.floor(i / 2), m = i % 2 ? 30 : 0; return Time.p2(h) + ':' + Time.p2(m); });

Object.assign(Views, {
	/* --- Yangi buyurtma --- */
	noTime(f = ui.f.no) { const [h, m] = f.vaqt.split(':').map(Number); return Time.at(h, m, +f.kun); },
	newOrder() {
		const f = ui.f.no || Steps.newForm(), kunlar = [[0, 'Bugun'], [1, 'Ertaga'], [2, F.date(Time.add(2))]];
		const from = f.fromId && Data.order(f.fromId);
		return `<form data-form="newOrder" autocomplete="off" novalidate>
			${from ? UI.note(`<b>${KANAL[from.kanal]}dan kelgan so‘rov · ${Views.oid(from)}.</b> Ma’lumotlar to‘ldirildi — vaqt va brigadani tanlab tasdiqlang.${from.izoh ? '<br>' + UI.esc(from.izoh) : ''}`, 'info') + '<div class="mt16"></div>' : ''}
			<div class="split">
			<div class="stack">
				${UI.card('Mijoz', `<div class="cb">
					${UI.mobile() ? UI.field('Kanal', UI.select('no.kanal', Object.entries(KANAL).filter(([k]) => k !== 'ofis'))) : UI.field('Kanal', UI.seg('setKanal', f.kanal, Object.entries(KANAL).filter(([k]) => k !== 'ofis').map(([k, t]) => [k, k === 'qayta' ? 'Doimiy' : t])), { group: true })}
					<div class="grid2 mt16">
						${UI.field('Telefon', UI.input('no.tel', 'type="tel" inputmode="tel" data-tel placeholder="+998"'), { key: 'no.tel' })}
						${UI.field('Ism', UI.input('no.ism'), { key: 'no.ism' })}
						${UI.field('Manzil', UI.input('no.manzil', 'placeholder="Mahalla yoki mikrorayon, uy, xonadon"'), { key: 'no.manzil', cls: 'full' })}
					</div><div id="no-hit">${Views.noHit()}</div></div>`)}
				${UI.card('Xizmatlar', `<div class="cb"><div id="no-rows">${Views.noRows()}</div>
					<button type="button" class="btn s mt8" data-act="addRow">${UI.icon('plus')}Xizmat qo‘shish</button><small class="ferr" data-err="no.rows"></small>
					<div class="grid2 duo mt16">
						${UI.field('Ustama, murakkab ish uchun', UI.unit(UI.num('no.ust', 'max="100"'), '%'), { key: 'no.ust' })}
						${UI.field('Chegirma', UI.unit(UI.num('no.cheg', 'step="1000"'), 'so‘m'), { key: 'no.cheg' })}
					</div></div>`)}
				${UI.card('Vaqt va brigada', `<div class="cb">
					<div class="grid3">
						${UI.field('Kun', UI.seg('setKun', f.kun, kunlar), { group: true })}
						${UI.field('Boshlanish', UI.select('no.vaqt', SLOTS.map(s => [s, s])))}
						${UI.field('Davomiylik', UI.unit(UI.num('no.dav', 'step="10"'), 'daq'), { key: 'no.dav', hint: f.davManual ? `<button type="button" class="link" data-act="resetDav">Taxminga qaytarish (${F.dur(Calc.dur(f.rows))})</button>` : 'hajm × me’yor, o‘zgartirsa bo‘ladi' })}
					</div>
					<h3 class="mt16">Brigada</h3><div id="no-brig">${Views.noBrigades()}</div>
					${UI.field('Izoh brigadaga', `<textarea class="in" data-f="no.izoh" rows="2" placeholder="Kalit, domofon, mijoz iltimosi">${UI.esc(f.izoh)}</textarea>`, { cls: 'mt16' })}</div>`)}
			</div>
			<div class="sticky"><section class="card pad" id="no-sum">${Views.noSummary()}</section></div>
			</div><div class="nobar" id="no-bar">${Views.noBar()}</div></form>`;
	},
	noBar() {
		const f = ui.f.no, p = Calc.price(f.rows.map(r => ({ ...r, tarif: Data.svc(r.s).tarif })), f.ust, f.cheg);
		return `<span><small>Jami${p.minUp ? ' (minimal)' : ''}</small><b>${F.som(p.total)}</b></span><button class="btn pri" type="submit">${f.fromId ? 'Tasdiqlash' : 'Saqlash'}</button>`;
	},
	noHit() {
		const f = ui.f.no, c = Data.findClient(f.tel);
		if (!c) return F.tel(f.tel) ? '<p class="hint mt8">Yangi mijoz — saqlanganda ro‘yxatga qo‘shiladi.</p>' : '';
		const s = Calc.clientStats(c);
		return `<div class="hit">${UI.icon('user')}<span class="x"><span>Mavjud mijoz: <b>${UI.esc(c.ism)}</b></span><span class="m">${s.n} ta buyurtma${s.last ? ', oxirgisi ' + F.dateLong(s.last) : ''} · ${s.debt ? `qarz ${F.som(s.debt)}` : 'qarzi yo‘q'}</span></span>${c.manzil.length > 1 ? `<select class="in" style="width:auto" data-f="no.manzil" aria-label="Manzil">${UI.options(c.manzil.map(m => [m, F.addr(m)]), f.manzil)}</select>` : ''}</div>`;
	},
	noRows() {
		const f = ui.f.no, opts = db.svc.map(s => [s.k, s.nom]);
		return f.rows.map((r, i) => {
			const s = Data.svc(r.s);
			return `<div class="srow"><select class="in" data-row="${i}" data-k="s" aria-label="Xizmat">${UI.options(opts, r.s)}</select>
				${UI.unit(`<input class="in" data-row="${i}" data-k="h" type="number" inputmode="decimal" min="0" value="${UI.esc(r.h)}" aria-label="Hajm">`, s.bir)}
				<span class="sum" id="rs-${i}">${Views.rowSum(r)}</span>
				<button type="button" class="btn ic ghost" data-act="delRow" data-v="${i}" aria-label="Qatorni o‘chirish"${f.rows.length < 2 ? ' disabled' : ''}>${UI.icon('x')}</button></div>`;
		}).join('') + (f.rows.some(r => Data.svc(r.s).sex) ? `<p class="hint mt8">${UI.icon('truck')} Gilam va parda sexga olib ketiladi: joyida faqat olib ketish vaqti hisoblanadi.</p>` : '');
	},
	rowSum: r => { const s = Data.svc(r.s); return +r.h > 0 ? `${F.num(r.h * s.tarif)}<small>${F.num(s.tarif)} × ${F.num(+r.h, 1)}</small>` : `<small>${F.num(s.tarif)} / ${s.bir}</small>`; },
	noBrigades() {
		const f = ui.f.no, t = Views.noTime(f), list = Calc.free(t, +f.dav || 60, f.fromId);
		return `<div class="bpick">${list.map(({ b, busy }) => `<button type="button" class="bp${busy.length ? ' busy' : ''}" data-act="pickBrig" data-v="${b.id}" aria-pressed="${f.bid === b.id}">
			<span class="n">${b.nom}</span><span class="s">${busy.length ? 'Band ' + busy.map(j => F.span(j.t, j.dav)).join(', ') : 'Bo‘sh'}</span></button>`).join('')}</div>
			<p class="hint mt8">${F.day(t)}, ${F.span(t, +f.dav || 60)}. Yo‘l uchun ${db.set.yol} daqiqa oraliq hisobga olingan.</p>`;
	},
	noSummary() {
		const f = ui.f.no, rows = f.rows.map(r => ({ ...r, tarif: Data.svc(r.s).tarif })), p = Calc.price(rows, f.ust, f.cheg), t = Views.noTime(f);
		const b = f.bid && Data.brig(f.bid), busy = b ? Calc.conflicts(b.id, t, +f.dav || 60, f.fromId) : [];
		return `<h2>Narx</h2>
			<table class="calc mt8">${p.lines.length ? p.lines.map(l => `<tr><td>${UI.esc(Data.svc(l.s).nom)}<span class="sub">${F.qty(l.h, l.s)} × ${F.num(l.tarif)}</span></td><td>${F.num(l.sum)}</td></tr>`).join('') : '<tr><td class="muted">Xizmat va hajmni kiriting</td><td></td></tr>'}
			${p.ustSum ? `<tr class="x"><td>Ustama ${f.ust} %</td><td>+${F.num(p.ustSum)}</td></tr>` : ''}${p.cheg ? `<tr class="x"><td>Chegirma</td><td>−${F.num(p.cheg)}</td></tr>` : ''}
			${p.minUp ? `<tr class="x"><td>Minimal buyurtma</td><td>${F.num(db.set.min)}</td></tr>` : ''}</table>
			<div class="total"><span>Jami</span><b>${F.som(p.total)}</b></div>
			${p.minUp ? `<p class="hint">Summa ${F.som(p.raw)} — minimal buyurtmagacha ko‘tarildi.</p>` : ''}
			<div class="kv mt16"><span>Vaqt</span><b>${F.day(t)}, ${F.span(t, +f.dav || 60)}</b></div>
			<div class="kv mt8"><span>Brigada</span><b>${b ? b.nom : '—'}</b></div>
			${busy.length ? `<p class="flag amb mt8">Ustma-ust: ${b.nom} ${busy.map(j => F.span(j.t, j.dav)).join(', ')} band</p>` : ''}
			<button class="btn pri mt16" type="submit" style="width:100%">${f.fromId ? 'Tasdiqlash' : 'Buyurtmani saqlash'}</button>
			<div class="mt8">${UI.rule('Narx = Σ(hajm × tarif) × (1 + ustama) − chegirma')}</div>`;
	},

	/* --- Jadval (kun) --- */
	schedule() {
		const iso = Time.add(ui.day), now = Time.now(), d0 = Time.day0(iso), span = (DAY_END - DAY_START) * HOUR;
		const pos = t => Math.max(0, Math.min(100, (t - d0 - DAY_START * HOUR) / span * 100));
		const hours = [...Array(DAY_END - DAY_START + 1)].map((_, i) => DAY_START + i);
		const lines = hours.slice(1, -1).map(h => `<s style="left:${pos(d0 + h * HOUR).toFixed(3)}%"></s>`).join('');
		const nowLine = iso === Time.today ? `<i class="now" style="left:${pos(now).toFixed(3)}%"></i>` : '';
		const block = j => {
			const o = j.o, late = j.kind === 'ish' && Calc.late(o, now), end = j.t + j.dav * MIN;
			const cls = j.kind === 'qaytar' ? (o.holat === 'qaytarildi' ? 'done' : 'sex') : Calc.done(o) || o.holat === 'sexda' ? 'done' : o.holat;
			const road = `<i class="road" style="left:${pos(j.t - db.set.yol * MIN).toFixed(3)}%;width:${(pos(j.t) - pos(j.t - db.set.yol * MIN)).toFixed(3)}%"></i>`;
			const narrow = j.dav < 75;
			return road + `<button class="blk ${cls}${late ? ' late' : ''}${narrow ? ' nar' : ''}" style="left:${pos(j.t).toFixed(3)}%;width:${(pos(end) - pos(j.t)).toFixed(3)}%" data-act="openOrder" data-id="${o.id}" title="${UI.esc(`${F.span(j.t, j.dav)} · ${Data.client(o).ism} · ${F.rowsShort(o)}`)}">
				${narrow ? `<b>${Time.hm(j.t)}</b>` : `<b>${Time.hm(j.t)} ${UI.esc(F.short(Data.client(o).ism))}</b><span>${j.kind === 'qaytar' ? 'Qaytarish · ' : ''}${UI.esc(F.addr(o.manzil).split(',')[0])}</span>`}</button>`;
		};
		const rows = db.brigades.map(b => {
			const jobs = Calc.jobs(b.id, iso), busy = Calc.sum(jobs, j => j.dav), pct = Math.min(100, busy / ((DAY_END - DAY_START) * 60) * 100);
			return `<div class="sch-r"><div class="sch-n">${b.nom}<small><span class="m-hide">${b.a.length} kishi · </span>${F.num(busy / 60, 1)} / ${DAY_END - DAY_START} soat</small><span class="ld"><i style="width:${pct.toFixed(1)}%"></i></span></div><div class="sch-t">${lines}${jobs.map(block).join('')}${nowLine}</div></div>`;
		}).join('');
		const reqs = db.orders.filter(o => o.holat === 'sorov' || (Calc.live(o) && !o.bid && !Calc.done(o)));
		const dayReqs = reqs.filter(o => Time.dayOf(o.t) === iso);
		const unRow = `<div class="sch-r un"><div class="sch-n">Biriktirilmagan<small>${dayReqs.length ? dayReqs.length + ' ta so‘rov' : 'yo‘q'}</small></div><div class="sch-t">${lines}${dayReqs.map(o => `<button class="blk req" style="left:${pos(o.t).toFixed(3)}%;width:${(pos(o.t + o.dav * MIN) - pos(o.t)).toFixed(3)}%" data-act="openOrder" data-id="${o.id}"><b>${Time.hm(o.t)} ${UI.esc(F.short(Data.client(o).ism))}</b><span>${KANAL[o.kanal]} · ${UI.esc(F.rowsShort(o))}</span></button>`).join('')}${nowLine}</div></div>`;
		const dayName = `${F.dateLong(iso)}, ${WEEKDAYS[Time.date(iso).getDay()]}`;
		const leg = [['tasdiq', 'Tasdiqlangan', 'background:var(--sf);box-shadow:inset 0 0 0 1px var(--tx4)'], ['yolda', 'Yo‘lda', 'background:var(--blut);box-shadow:inset 0 0 0 1px var(--blu)'], ['ish', 'Ishlayapti', 'background:var(--br)'],
			['done', 'Tugadi', 'background:var(--grnt);box-shadow:inset 0 0 0 1px var(--grn)'], ['sex', 'Sexdan qaytarish', 'background:var(--mct)'], ['late', 'Kechikyapti', 'box-shadow:inset 0 0 0 2px var(--red)']];
		return `<div class="toolbar">${UI.seg('setDay', ui.day, [[-1, 'Kecha'], [0, 'Bugun'], [1, 'Ertaga']])}<span class="muted">${dayName}</span></div>
			<section class="card"><div class="sch-w"><div class="sch">
				<div class="sch-r sch-x"><div class="sch-n"></div><div class="sch-t">${hours.map(h => `<span style="left:${pos(d0 + h * HOUR).toFixed(3)}%">${Time.p2(h)}:00</span>`).join('')}</div></div>
				${rows}${unRow}</div></div>
				<div class="sch-leg">${leg.map(([, t, st]) => `<span><i style="${st}"></i>${t}</span>`).join('')}<span><i style="border-top:1px dashed var(--tx4);height:0;border-radius:0"></i>Yo‘l, ${db.set.yol} daq</span></div></section>
			${reqs.length ? `<section class="card mt16">${UI.sec(`So‘rovlar va biriktirilmaganlar — hamma kunlar<span class="c">${reqs.length}</span>`)}<div class="rows">${reqs.map(o => `<button class="row-b" data-act="openOrder" data-id="${o.id}"><span class="ti amb">${UI.icon('inbox')}</span><span class="x"><span class="t">${UI.esc(Data.client(o).ism)} · ${UI.esc(F.rowsShort(o))}</span><span class="m">${KANAL[o.kanal]} · istagan vaqti ${F.when(o.t)} · ${UI.esc(F.addr(o.manzil))}</span></span>${UI.icon('chev')}</button>`).join('')}</div></section>` : ''}`;
	},

	/* --- Brigada ekrani (telefon birinchi) --- */
	// Brigadir harakat qilishi kerak bo‘lgan ish: holat tugmasi yoki to‘lov savoli
	needs(j) {
		const o = j.o;
		if (j.kind === 'qaytar') return o.holat === 'sexda' || (o.holat === 'qaytarildi' && !o.pay && Calc.debt(o) > 0);
		if (['tasdiq', 'yolda', 'ish'].includes(o.holat)) return true;
		return o.holat === 'tugadi' && !o.kid && !o.pay && Calc.debt(o) > 0;
	},
	brigade() {
		const u = Data.user(), b = Data.brig(u.bid), jobs = Calc.jobs(b.id, Time.today);
		const focus = jobs.find(j => j.o.id === ui.job && j.kind === (ui.jobKind || j.kind)) || jobs.find(Views.needs);
		const head = `<div class="bw-h"><h2>${F.dateLong(Time.today)}, ${WEEKDAYS[Time.date(Time.today).getDay()]}</h2><span class="sub">${jobs.length} ta ish · ${UI.esc(F.short(u.ism))}</span></div>`;
		const mini = j => {
			const o = j.o, c = Data.client(o), fin = !Views.needs(j) && (Calc.done(o) || o.holat === 'sexda');
			return `<button class="card job mini${fin ? ' done' : ''}" data-act="openJob" data-id="${o.id}" data-k="${j.kind}"><span class="tm">${Time.hm(j.t)}</span><span class="x"><span class="t">${UI.esc(c.ism)}</span><span class="m">${j.kind === 'qaytar' ? 'Qaytarish · ' : ''}${UI.esc(F.rowsShort(o))} · ${UI.esc(F.addr(o.manzil))}</span></span>${fin ? UI.flag('Bajarildi', 'grn') : UI.sd(o)}</button>`;
		};
		const cash = Calc.hands(u.id);
		return `<div class="bw">${head}
			${focus ? Views.jobCard(focus) : UI.card('', UI.empty('Bugungi ishlar tugadi. Rahmat!', 'check'), { cls: 'job' })}
			${jobs.filter(j => j !== focus).map(mini).join('')}
			<div class="cash"><span>Qo‘lingizdagi naqd</span><b>${F.som(cash)}</b></div>
			${cash ? '<p class="hint mt8">Kechqurun ofisga topshiring — administrator qabul qilganini belgilaydi.</p>' : ''}</div>`;
	},
	jobCard(j) {
		const o = j.o, c = Data.client(o), late = j.kind === 'ish' && Calc.late(o), debt = Calc.debt(o), map = 'https://yandex.uz/maps/?text=' + encodeURIComponent('Buxoro, ' + o.manzil);
		let action = '';
		if (j.kind === 'qaytar' && o.holat === 'sexda') action = `<button class="btn pri cta" data-act="jobStep" data-id="${o.id}" data-s="qaytar">${UI.icon('house')}Qaytarib berdim</button>`;
		else if (o.holat === 'tasdiq') action = `<button class="btn pri cta" data-act="jobStep" data-id="${o.id}" data-s="yol">${UI.icon('car')}Yo‘ldaman</button>`;
		else if (o.holat === 'yolda') action = o.sex ? `<button class="btn pri cta" data-act="jobStep" data-id="${o.id}" data-s="olib">${UI.icon('truck')}Olib ketdim</button>` : `<button class="btn pri cta" data-act="jobStep" data-id="${o.id}" data-s="boshla">${UI.icon('brush')}Boshladim</button>`;
		else if (o.holat === 'ish') action = `<button class="btn pri cta" data-act="jobStep" data-id="${o.id}" data-s="tugat">${UI.icon('check')}Tugatdim</button>`;
		else if (Views.needs(j)) action = `<div class="pay-q"><span class="l">Mijozdan olinadigan summa</span><div class="v">${F.som(debt)}</div></div>
			<button class="btn pri cta" data-act="jobPay" data-id="${o.id}" data-v="naqd">${UI.icon('coin')}Pul olindi — naqd</button>
			<button class="btn cta sec" data-act="jobPay" data-id="${o.id}" data-v="karta">Pul olindi — karta</button>
			<div class="jbtns"><button class="btn" data-act="jobNoPay" data-id="${o.id}">Olinmadi</button><button class="btn" data-act="jobOther" data-id="${o.id}">Boshqa summa</button></div>`;
		else if (o.holat === 'sexda') action = `<div class="done-l">${UI.icon('given')}Sexga topshirildi. Tayyor bo‘lgach qaytarish ishi shu yerga tushadi.</div>`;
		else if (Calc.done(o)) action = `<div class="done-l">${UI.icon('check')}Ish yakunlandi${o.kid ? '' : o.pay === 'olinmadi' ? ' · pul olinmadi' : debt ? '' : ' · pul olingan'}</div>`;
		const lastAct = db.events.filter(e => e.oid === o.id && ['yol', 'boshla', 'tugat', 'sex', 'qaytar', 'tolov', 'tolanmadi'].includes(e.tur)).pop();
		const showPhotos = !o.kid && j.kind === 'ish' && ['ish', 'tugadi'].includes(o.holat);
		const shot = (k, t) => { const id = (o.foto[k] || []).slice(-1)[0], src = id && Data.photo(id); return `<label class="shot${src ? ' has' : ''}">${src ? `<img src="${src}" alt="">` : UI.icon('camera')}<span>${src ? t + ' · yana' : t + ' surati'}</span><input type="file" accept="image/*" capture="environment" data-photo="${k}" data-id="${o.id}"></label>`; };
		return `<section class="card job">
			${o.izoh ? `<div class="jnote">${UI.icon('info')}<span><b>Boshlashdan oldin o‘qing</b>${UI.esc(o.izoh)}</span></div>` : ''}
			<div class="jt"><span>${j.kind === 'qaytar' ? 'Qaytarish · ' : ''}${F.span(j.t, j.dav)}</span>${late ? UI.chip(`${late} daqiqa kechikyapsiz`, 'red') : UI.sd(o)}</div>
			<div class="jn">${UI.esc(c.ism)}</div><a class="ja" href="${map}" target="_blank" rel="noopener">${UI.icon('pin')}<span>${UI.esc(o.manzil)}</span></a>
			<ul class="jlist">${o.kid ? `<li><span>Ofis tozalash (shartnoma)</span><span>${F.dur(o.dav)}</span></li>` : o.rows.map(r => `<li><span>${UI.esc(Data.svc(r.s).nom)}</span><span>${F.qty(r.h, r.s)}</span></li>`).join('')}</ul>
			<div class="jbtns"><a class="btn" href="${F.telHref(c.tel)}">${UI.icon('phone')}Mijozga qo‘ng‘iroq</a><a class="btn" href="${map}" target="_blank" rel="noopener">${UI.icon('pin')}Xaritada</a></div>
			${showPhotos ? `<div class="jph">${shot('oldin', 'Oldin')}${shot('keyin', 'Keyin')}</div>` : ''}
			<div class="jact">${action}${lastAct ? `<p class="last">${UI.esc(lastAct.m)} · ${Time.hm(lastAct.t)}</p>` : ''}</div></section>`;
	}
});

/* ===== Views — pul, mijozlar, hisobot va sozlamalar, mijoz sahifasi (manba: c3.js) ===== */

Object.assign(Views, {
	/* --- Pul: to‘lanmagan ishlar, ofis shartnomalari, naqd va kassa --- */
	money() {
		const home = Calc.homeDebts(), hands = Calc.handsList(), rev = Calc.revenue();
		const sums = `<section class="card sums">
			<div><span class="l">Jami qarz</span><b class="red">${F.som(Calc.totalDebt())}</b><small>uy ${F.num(Calc.homeDebt())} + ofis ${F.num(Calc.officeDebt())}</small></div>
			<div><span class="l">Xodimlar qo‘lida</span><b>${F.som(Calc.handsTotal())}</b><small>${hands.length} kishida</small></div>
			<div><span class="l">Bugun tushdi</span><b>${F.som(rev.total)}</b><small>${rev.n} ta to‘lov</small></div></section>`;
		const tabs = UI.tabs('setPulTab', ui.pulTab, [['qarz', 'To‘lanmagan ishlar', home.length, 'Qarzlar'], ['ofis', 'Ofis shartnomalari', db.contracts.length, 'Ofislar'], ['naqd', 'Naqd va kassa', hands.length, 'Naqd']]);
		return sums + tabs + ({ qarz: Views.moneyDebts, ofis: Views.moneyOffices, naqd: Views.moneyCash }[ui.pulTab] || Views.moneyDebts)();
	},
	moneyDebts() {
		const list = Calc.homeDebts();
		const cols = [
			['Mijoz', 'c-main', o => `${UI.esc(Data.client(o).ism)}<span class="sub">${UI.esc(F.rowsShort(o))} · ${Views.oid(o)}</span>`],
			['Qarz', 'c-aside num', o => `<b class="red-t">${F.num(Calc.debt(o))}</b>`],
			['Ish kuni', 'nowrap', o => F.date(Calc.endOf(o))],
			['O‘tdi', 'nowrap', o => { const d = Calc.daysOver(o); return d ? UI.flag(`${d} kun`, d >= 3 ? 'red' : 'amb') : UI.flag('bugun', 'amb'); }],
			['Summa', 'num m-hide', o => F.num(Calc.total(o))],
			['To‘langan', 'num m-hide', o => F.num(Calc.paid(o))],
			['', 'c-acts', o => `<span class="cell-acts">${UI.call(Data.client(o).tel)}${can('openPayment') ? `<button class="btn s" data-act="openPayment" data-id="${o.id}">To‘lov</button>` : ''}</span>`]
		];
		return `<section class="card">${UI.table(cols, list, { open: o => ['openOrder', o.id], empty: 'To‘lanmagan ish yo‘q', icon: 'check',
			foot: list.length ? `<tfoot class="m-hide"><tr><td>Jami</td><td class="num">${F.num(Calc.homeDebt())}</td><td colspan="5"></td></tr></tfoot>` : '' })}</section>`;
	},
	moneyOffices() {
		return `<p class="note info mb16">${UI.icon('info')}<span>Shartnoma summasi <b>har oy boshida (1-sanada) hisoblanadi</b>, to‘lov shu oy ichida kutiladi. O‘tgan oydan qolgan qarz — muddati o‘tgan. Namuna qoidasi, sozlanadi.</span></p>` + db.contracts.map(k => {
			const c = Data.client(k.cid), led = Calc.ledger(k), rest = Calc.contractDebt(k), over = Calc.contractOverdue(k);
			const right = `<span class="acts">${UI.call(c.tel)}${can('openContractPay') ? `<button class="btn s" data-act="openContractPay" data-id="${k.id}">To‘lov qo‘shish</button>` : ''}</span>`;
			const cols = [
				['Oy', 'c-main', r => F.month(r.m)],
				['Qoldiq', 'c-aside num', r => `<b>${r.rest < 0 ? 'avans ' + F.num(-r.rest) : F.num(r.rest)}</b>`],
				['', 'c-sub', r => `${F.num(r.prev)} + ${F.num(r.charge)} − ${F.num(r.paid)}`],
				['Oldingi qoldiq', 'num', r => F.num(r.prev)],
				['+ Hisoblandi', 'num', r => F.num(r.charge)],
				['− To‘landi', 'num', r => F.num(r.paid)]
			];
			const desk = UI.mobile() ? cols.slice(0, 3) : [cols[0], cols[3], cols[4], cols[5], ['= Qoldiq', 'num', cols[1][2]]];
			const tot = led.reduce((s, r) => ({ ch: s.ch + r.charge, pd: s.pd + r.paid }), { ch: 0, pd: 0 });
			return `<section class="card ofis"><div class="sec-h"><h2>${UI.esc(c.ism)}<small>${F.som(k.summa)} oyiga, oy boshida hisoblanadi · ${k.tashrif} tashrif (bittasi ${F.num(Calc.visit(k))}) · ${Data.brig(k.bid).nom}</small></h2>${right}</div>
				${UI.table(desk, led, { cls: 'led', foot: UI.mobile() ? '' : `<tfoot><tr><td>Jami</td><td class="num">${F.num(led[0].prev)}</td><td class="num">${F.num(tot.ch)}</td><td class="num">${F.num(tot.pd)}</td><td class="num">${F.num(rest)}</td></tr></tfoot>` })}
				<div class="cf2">${over ? UI.flag(`Muddati o‘tgan: ${F.som(over)}`) + ' · ' : ''}${rest > 0 ? `Hozirgi qarz ${F.som(rest)}` : rest < 0 ? `Avans ${F.som(-rest)}` : 'Qarz yo‘q'} · har oy 1-sanada ${F.som(k.summa)} hisoblanadi.</div></section>`;
		}).join('');
	},
	moneyCash() {
		const hands = Calc.handsList(), limit = db.set.naqd;
		const rows = hands.length ? hands.map(({ u, sum, old }) => `<div class="item"><span class="ti ${old || sum > limit ? 'red' : ''}">${UI.icon('wallet')}</span><span class="x"><span class="t">${UI.esc(u.ism)} · ${Data.brig(u.bid).nom}</span>
			<span class="m">${old ? `${F.som(old)} kecha olingan` : 'bugun olingan'}${sum > limit ? ` · ${F.som(limit)} chegaradan ko‘p` : ''}</span></span>
			<b class="num${old || sum > limit ? ' red-t' : ''}">${F.som(sum)}</b><span class="item-a">${UI.call(u.tel)}${can('openCash') ? `<button class="btn s" data-act="openCash" data-id="${u.id}">Naqd qabul qildim</button>` : ''}</span></div>`).join('')
			: UI.empty('Hamma naqd kassaga topshirilgan', 'check');
		const book = [...db.kassa.map(k => ({ t: k.t, who: `${F.short(Data.userById(k.uid).ism)} topshirdi`, by: Data.userById(k.by).ism, sum: k.sum })),
			...db.pays.filter(p => p.usul === 'naqd' && !p.uid).map(p => ({ t: p.t, who: `${p.sum < 0 ? 'Mijozga qaytarildi' : 'Ofisda to‘lov'} · ${p.oid ? Data.client(Data.order(p.oid)).ism : ''}`, by: p.by ? Data.userById(p.by).ism : '', sum: p.sum }))].sort((a, b) => b.t - a.t).slice(0, 14);
		const cols = [['Vaqt', 'c-main nowrap', x => F.when(x.t)], ['Summa', 'c-aside num', x => F.num(x.sum)], ['Kimdan', 'c-sub', x => UI.esc(x.who)], ['Qabul qildi', 'm-hide', x => UI.esc(x.by)]];
		return `${UI.card('Xodimlar qo‘lidagi naqd', `<div class="rows">${rows}</div><div class="cf2">Qo‘lidagi naqd = oldingi qoldiq + olgan naqd − kassaga topshirgani. ${F.som(limit)} dan oshsa — qizil. Namuna qoidasi, sozlanadi.</div>`)}
			${UI.card('Kassa daftari', UI.table(cols, book, { empty: 'Yozuv yo‘q' }), { cls: 'mt16' })}`;
	},

	/* --- Mijozlar --- */
	clients() {
		const re = Calc.reoffer();
		return `${UI.tabs('setClientTab', ui.clientTab, [['hammasi', 'Hammasi', db.clients.length], ['qayta', 'Qayta taklif vaqti', re.length, 'Qayta taklif']])}
			${ui.clientTab === 'qayta' ? Views.reofferList(re) : `<div class="toolbar">${UI.search('clientQ', ui.clientQ, 'Ism, telefon yoki manzil')}</div><section class="card" id="clist">${Views.clientsList()}</section>`}`;
	},
	clientsList() {
		const q = ui.clientQ.trim().toLowerCase(), digits = q.replace(/\D/g, '');
		const list = db.clients.filter(c => !q || c.ism.toLowerCase().includes(q) || c.manzil.some(m => m.toLowerCase().includes(q)) || (digits.length >= 3 && F.telDigits(c.tel).includes(digits)))
			.map(c => ({ c, s: Calc.clientStats(c) })).sort((a, b) => (b.s.last || 0) - (a.s.last || 0));
		const cols = [
			['Mijoz', 'c-main', x => `${UI.esc(x.c.ism)}<span class="sub">${UI.esc(x.c.tel)}</span>`],

	/* --- Hisobot va sozlamalar (faqat direktor) --- */
	report() {
		const m0 = Time.month(Time.today), m1 = Time.month(Time.monthStart(-1));
		return `<div class="toolbar">${UI.seg('setReport', ui.report, [['30', 'Oxirgi 30 kun'], [m0, F.month(m0 + '-01')], [m1, F.month(m1 + '-01')]])}</div>
			<div id="rep-body">${Views.reportBody()}</div>
			<h2 class="mt16" style="margin-top:32px">Sozlamalar</h2><p class="hint mt8">O‘zgarish darhol hisoblarga ta’sir qiladi: yangi buyurtma narxi, mijoz sahifasidagi kalkulyator, ulushlar.</p>
			${Views.settings()}`;
	},
	reportBody() {
		const R = Calc.report(ui.report), max = Math.max(1, ...R.byDay.map(d => d.sum)), n = R.byDay.length, w = 100 / n;
		const top = Math.ceil(max / 1e6) * 1e6 || 1e6;
		const chart = `<svg class="chart" viewBox="0 0 640 160" preserveAspectRatio="none" role="img" aria-label="Kunlar bo‘yicha tushum">
			${[0.5, 1].map(f => `<line class="g" x1="40" x2="640" y1="${(140 - f * 120).toFixed(1)}" y2="${(140 - f * 120).toFixed(1)}"/><text x="0" y="${(144 - f * 120).toFixed(1)}">${F.num(top * f / 1e6, 1)} mln</text>`).join('')}
			${R.byDay.map((d, i) => { const h = d.sum / top * 120, x = 40 + i * (600 / n); return `<rect class="b${d.d === Time.today ? ' hi' : ''}" x="${(x + 1).toFixed(1)}" y="${(140 - h).toFixed(1)}" width="${Math.max(1, 600 / n - 2).toFixed(1)}" height="${h.toFixed(1)}"><title>${F.date(d.d)}: ${F.som(d.sum)}</title></rect>`; }).join('')}
			${R.byDay.map((d, i) => i % Math.ceil(n / 6) === 0 ? `<text x="${(40 + i * (600 / n)).toFixed(1)}" y="158">${F.date(d.d)}</text>` : '').join('')}
			<line x1="40" x2="640" y1="140" y2="140" stroke="var(--line)"/></svg>`;
		void w;
		const tones = ['br', 'br3', 'brm', 'blu', 'mc', 'amb', 'grn', 'tx4', 'tx3', 'line', 'red'];
		const shareBlock = (title, list, val, label) => {
			const tot = Calc.sum(list, val) || 1;
			return `<div class="shr"><div class="kv"><span class="strong">${title}</span></div>${UI.share(list.map((x, i) => [label(x), val(x), tones[i % tones.length]]))}
				<div class="legend">${list.map((x, i) => `<span>${UI.dot(tones[i % tones.length])}${UI.esc(label(x))} <b>${F.pct(val(x) / tot * 100)}</b></span>`).join('')}</div></div>`;
		};
		const rows = [];
		R.brig.forEach(x => {
			rows.push({ grp: true, t: `${x.b.nom} · ${x.b.foiz} %`, n: x.n, sum: x.sum, share: x.share });
			x.members.forEach(m => rows.push({ t: Data.userById(m.uid).ism, ul: m.ul, share: m.share }));
		});
		const cols = [['Brigada / xodim', '', r => UI.esc(r.t) + (r.ul != null ? ` <span class="muted">${r.ul} %</span>` : '')], ['Ishlar', 'num', r => r.grp ? r.n : ''], ['Summa', 'num', r => r.grp ? F.num(r.sum) : ''], ['Ulush', 'num', r => F.num(r.share)]];
		const totShare = Calc.sum(R.brig, x => x.share);
		return `<section class="card sums">
				<div><span class="l">Tushum (to‘lovlar)</span><b>${F.som(R.revenue)}</b></div>
				<div><span class="l">Bajarilgan ishlar</span><b>${R.n}</b><small>shundan uy ${R.homeN}, ofis ${R.n - R.homeN}</small></div>
				<div><span class="l">O‘rtacha chek (uy)</span><b>${F.som(R.avg)}</b></div>
				<div><span class="l">Brigadalar ulushi</span><b>${F.som(totShare)}</b></div></section>
			<div class="cols">
				${UI.card('Tushum kunlar bo‘yicha', `<div class="cb">${chart}</div>`)}
				${UI.card('Ulushlar', `<div class="cb">${shareBlock('Xizmatlar (summa)', R.bySvc, x => x.sum, x => x.nom)}${shareBlock('Kanallar (ishlar soni)', R.byKanal, x => x.n, x => KANAL[x.k])}</div>`)}
			</div>
			${UI.card('Brigada va xodimlar ulushi — oy oxiridagi hisob', UI.table(cols, rows, { rowCls: r => r.grp ? 'grp' : 'mem',
				foot: `<tfoot><tr><td>Jami</td><td class="num">${R.n}</td><td class="num"></td><td class="num">${F.num(totShare)}</td></tr></tfoot>` })
				+ `<div class="cf2">Ulush = buyurtma summasi (chegirmadan keyin) × brigada foizi; brigada ichida — a’zolarning belgilangan ulushi. Bekor qilingan ishga ulush yo‘q. Namuna qoidasi, sozlanadi.</div>`, { cls: 'mt16' })}`;
	},
	settings() {
		const edit = can('setReport');
		const inp = (key, v, unit, attrs = '') => edit ? UI.unit(`<input class="in" type="number" inputmode="decimal" min="0" data-set="${key}" value="${v}" aria-label="${unit}" ${attrs}>`, unit) : `${F.num(v, 1)} ${unit}`;
		const svcRows = db.svc.map(s => `<tr><td>${UI.esc(s.nom)}${s.sex ? ' <span class="muted sm">· sex</span>' : ''}</td><td class="m-hide">${s.bir}</td><td class="num">${inp(`svc.${s.k}.tarif`, s.tarif, 'so‘m', 'step="1000"')}</td><td class="num">${inp(`svc.${s.k}.me`, s.me, 'daq')}</td></tr>`).join('');

		return `<div class="cols mt16">
			${UI.card('Narxlar', `<div class="tw"><table class="tbl set-t"><thead><tr><th>Xizmat</th><th class="m-hide">Birlik</th><th class="num">Tarif</th><th class="num">Me’yor / birlik</th></tr></thead><tbody>${svcRows}</tbody></table></div>
				<div class="cb">${UI.field('Minimal buyurtma', inp('set.min', db.set.min, 'so‘m', 'step="10000"'))}<div class="grid2 duo mt8">${UI.field('Yo‘l oralig‘i', inp('set.yol', db.set.yol, 'daq'))}${UI.field('Kechikish chegarasi', inp('set.kech', db.set.kech, 'daq'))}</div>
				<div class="grid2 duo mt8">${UI.field('Qayta taklif', inp('set.qayta', db.set.qayta, 'kun'))}${UI.field('Naqd chegarasi', inp('set.naqd', db.set.naqd, 'so‘m', 'step="100000"'))}</div>
				<p class="rule mt8">Namuna narxlari — sozlanadi.</p></div>`)}
			<div>${UI.card('Brigadalar va ulush', `<div class="tw"><table class="tbl set-t"><thead><tr><th>Brigada / a’zo</th><th class="num">Foiz / ichki ulush</th></tr></thead><tbody>${brigRows}</tbody></table></div>
				<div class="cf2">Brigada ichidagi ulushlar yig‘indisi 100 % bo‘lishi kerak.</div>`)}
				${UI.card('Namuna', `<div class="cb"><p class="note">Hamma o‘zgarishlarni o‘chirib, namunani boshlang‘ich holatga qaytaradi (bugun 11:40).</p><button class="btn mt8" data-act="resetData">${UI.icon('refresh')}Namunani boshidan boshlash</button></div>`, { cls: 'mt16' })}</div>
		</div>`;
	},

/* ===== Views — oynalar: brigada biriktirish, to‘lov, naqd, bekor qilish, qaytarish (manba: c4.js) =====
	 Oyna ichi ui.modalForm dagi funksiya; maydonlar ui.f.<forma> ga bog‘langan. */

const KUN_OPTS = () => [[0, 'Bugun'], [1, 'Ertaga'], [2, F.dateLong(Time.add(2))]];

Object.assign(Views, {
	assignForm() {
		const f = ui.f.as, o = Data.order(f.id), [h, m] = f.vaqt.split(':').map(Number), t = Time.at(h, m, +f.kun);
		const busy = f.bid ? Calc.conflicts(f.bid, t, o.dav, o.id) : [];
		return `<p class="note">${UI.esc(Data.client(o).ism)} · ${UI.esc(F.rowsShort(o))} · ${F.dur(o.dav)}</p>
			<div class="grid3">${UI.field('Brigada', UI.select('as.bid', db.brigades.map(b => [b.id, b.nom])))}${UI.field('Kun', UI.select('as.kun', KUN_OPTS()))}${UI.field('Boshlanish', UI.select('as.vaqt', SLOTS.map(s => [s, s])))}</div>
			${busy.length ? `<p class="note warn">Ustma-ust: ${Data.brig(f.bid).nom} ${busy.map(j => F.span(j.t, j.dav)).join(', ')} band. Saqlash mumkin, lekin brigadir bilan kelishing.</p>` : `<p class="flag grn">${F.span(t, o.dav)} oralig‘ida bo‘sh</p>`}`;
	},
	returnForm() {
		const f = ui.f.ret, o = Data.order(f.id);
		return `<p class="note">${UI.esc(Data.client(o).ism)} · ${UI.esc(F.rows(o))} · ${UI.esc(F.addr(o.manzil))}</p>
			<div class="grid3">${UI.field('Brigada', UI.select('ret.bid', db.brigades.map(b => [b.id, b.nom])))}${UI.field('Kun', UI.select('ret.kun', KUN_OPTS()))}${UI.field('Vaqt', UI.select('ret.vaqt', SLOTS.map(s => [s, s])))}</div>
			<p class="hint">Mijoz bilan vaqtni kelishib oling. Qaytarish ishi brigadir telefoniga tushadi.</p>`;
	},
	payForm() {
		const f = ui.f.pay, o = Data.order(f.id), rest = Calc.total(o) - Calc.paid(o), b = o.bid && Data.brig(o.bid);
		const who = [['ofis', 'Ofisda (kassaga)'], ...(b ? b.a.map(m => [m.uid, Data.userById(m.uid).ism]) : [])];
		return `<p class="note">${UI.esc(Data.client(o).ism)} · qoldiq <b>${F.som(rest)}</b></p>
			<div class="grid2">${UI.field('Summa', UI.unit(UI.num('pay.sum', 'step="1000" autofocus'), 'so‘m'), { key: 'pay.sum' })}${UI.field('Usul', UI.select('pay.usul', Object.entries(USUL)))}
			${f.usul === 'naqd' ? UI.field('Pulni kim oldi', UI.select('pay.kim', who), { cls: 'full', hint: 'Xodim olgan bo‘lsa — uning qo‘lidagi naqdga qo‘shiladi' }) : ''}</div>`;
	},
	cashForm() {
		const f = ui.f.cash, u = Data.userById(f.uid);
		return `<p class="note">${UI.esc(u.ism)} qo‘lida <b>${F.som(Calc.hands(u.id))}</b></p>
			${UI.field('Kassaga qabul qilingan summa', UI.unit(UI.num('cash.sum', 'step="1000" autofocus'), 'so‘m'), { key: 'cash.sum', hint: 'Standart — qo‘lidagi hammasi' })}`;
	},
	kpayForm() {
		const f = ui.f.kpay, k = Data.contract(f.kid), c = Data.client(k.cid);
		return `<p class="note">${UI.esc(c.ism)} · hozirgi qoldiq <b>${F.som(Calc.contractDebt(k))}</b></p>
			<div class="grid2">${UI.field('Summa', UI.unit(UI.num('kpay.sum', 'step="1000" autofocus'), 'so‘m'), { key: 'kpay.sum' })}${UI.field('Usul', UI.select('kpay.usul', Object.entries(USUL)))}</div>
			<div id="kpay-note">${Views.kpayNote()}</div>`;
	},
	// Ofisda oldindan to‘lov mumkin: qarzdan ortig‘i keyingi oyga avans bo‘lib o‘tadi
	kpayNote() {
		const f = ui.f.kpay, debt = Math.max(0, Calc.contractDebt(Data.contract(f.kid))), over = (+f.sum || 0) - debt;
		return over > 0 ? `<p class="note warn">${F.som(over)} avansga o‘tadi — keyingi oy hisobidan yechiladi.</p>` : '';
	},
	cancelForm() {
		const f = ui.f.cancel, o = Data.order(f.id);

			${UI.field('Sabab', `<textarea class="in" data-f="cancel.sabab" rows="2" autofocus placeholder="Masalan: mijoz boshqa kunga ko‘chirdi">${UI.esc(f.sabab)}</textarea>`, { key: 'cancel.sabab' })}
			${f.paid ? `<div class="note warn"><b>Mijoz ${F.som(f.paid)} to‘lagan.</b> Bekor qilishdan oldin pul qaytariladi: kassadan, usul bo‘yicha (naqd — kassa naqdidan). Bugungi tushumdan ayriladi va kassa daftarida ko‘rinadi.</div>
				<label class="radio"><input type="checkbox" class="cbx" data-f="cancel.qaytar"${f.qaytar ? ' checked' : ''}> Pul mijozga qaytarildi — ${F.som(f.paid)}</label><small class="ferr" data-err="cancel.qaytar"></small>` : ''}`;
	},
	jpayForm() {
		const o = Data.order(ui.f.jpay.id);
		return `<p class="note">Kerakli summa: <b>${F.som(Calc.debt(o))}</b></p>
			<div class="grid2">${UI.field('Olingan summa', UI.unit(UI.num('jpay.sum', 'step="1000"'), 'so‘m'), { key: 'jpay.sum' })}${UI.field('Usul', UI.select('jpay.usul', [['naqd', 'Naqd'], ['karta', 'Karta']]))}</div>`;
	}
});

/* ===== Steps — amallar ichida qayta ishlatiladigan qadamlar (manba: d.js) ===== */
const Steps = {
	newForm(x = {}) {
		ui.f.no = { fromId: null, kanal: 'tel', tel: '', ism: '', manzil: '', rows: [{ s: 'kv', h: '' }], ust: 0, cheg: 0, kun: 0, vaqt: '15:00', dav: 60, davManual: false, bid: null, izoh: '', ...x };
		if (!ui.f.no.davManual) ui.f.no.dav = Calc.dur(ui.f.no.rows);
		return ui.f.no;
	},
	newSite() { ui.site = ui.f.site = { s: 'kv', h: 60, ism: '', tel: '', manzil: '', vaqt: 'Ertaga ertalab', sent: false }; return ui.site; },
	closePops() {
		const open = ui.bell || ui.gs.q || ui.gs.open;
		Object.assign(ui, { bell: false, gs: { q: '', open: false } });
		return !!open;
	},
	drawer(type, id) {
		if (Steps.closePops()) Views.render();
		ui.drawer = { type, id, enter: true };
		UI.refresh('layer');
		ui.drawer.enter = false;
		Router.sync();
	},
	// Yangi buyurtma yoki so‘rovni tasdiqlash
	saveOrder() {
		const f = ui.f.no;
		let c = Data.findClient(f.tel);
		if (!c) c = Data.addClient(f);
		else if (f.manzil.trim() && !c.manzil.includes(f.manzil.trim())) c.manzil.push(f.manzil.trim());
		const rows = f.rows.filter(r => r.s && +r.h > 0).map(r => ({ s: r.s, h: +r.h, tarif: Data.svc(r.s).tarif }));
		const fields = { cid: c.id, kanal: f.kanal, manzil: f.manzil.trim(), t: Views.noTime(f), dav: +f.dav, bid: f.bid, rows, ust: +f.ust || 0, cheg: +f.cheg || 0, izoh: f.izoh.trim() };
		let o;
		if (f.fromId) {
			o = Data.order(f.fromId);
			Object.assign(o, fields, { sex: rows.some(r => Data.svc(r.s).sex), holat: 'tasdiq' });
			Data.log(o, `So‘rov tasdiqlandi: ${F.som(Calc.total(o))}, ${F.when(o.t)}`, 'tasdiq');
		} else {
			o = Data.newOrder({ ...fields, holat: 'tasdiq' });
			Data.log(o, `Buyurtma ochildi: ${F.som(Calc.total(o))}, ${F.when(o.t)}`, 'qabul');
		}
		if (o.bid) Data.log(o, `${Data.brig(o.bid).nom} biriktirildi`, 'biriktir');
		Data.save();
		ui.f.no = null;
		Object.assign(ui, { page: 'buyurtmalar', orderFilter: { st: 'faol', q: '' } });
		Views.render();
		Steps.drawer('order', o.id);
		UI.toast(f.fromId ? 'So‘rov tasdiqlandi' : 'Buyurtma saqlandi');
	},
	addPay(o, sum, usul, uid, m) {
		db.pays.push({ oid: o.id, t: Time.now(), sum, usul, uid: usul === 'naqd' ? uid : null });
		Data.log(o, m || `To‘lov: ${USUL[usul].toLowerCase()}, ${F.som(sum)}`, 'tolov');
	},
	// Brigadir o‘z brigadasining ishinigina o‘zgartira oladi
	mine(o) { const u = Data.user(); return o && (o.bid === u.bid || (o.qaytar && o.qaytar.bid === u.bid)); },
	// Ikki marta bosishdan himoya
	guard() { const now = Date.now(); if (now - (Steps.last || 0) < 700) return false; Steps.last = now; return true; },
	photo(o, kind, data) {
		const id = Data.putPhoto(data);
		if (!id) { UI.toast('Telefon xotirasida joy qolmadi — surat saqlanmadi. Namunani boshidan boshlasangiz, eski suratlar o‘chadi.', 4000); return; }
		o.foto[kind].push(id);
		Data.log(o, kind === 'oldin' ? 'Oldin surati qo‘shildi' : 'Keyin surati qo‘shildi', 'surat');
		Data.save(); Views.render();
	}
};

/* ===== Actions — foydalanuvchi amallari (manba: d.js) =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */
const Actions = {
	/* navigatsiya */
	go(d) {

	toggleMenu() { ui.menu = !ui.menu; ui.bell = false; Views.render(); },
	toggleBell() {
		ui.bell = !ui.bell; ui.menu = false;

	toggleSearch() { ui.gs.open = !ui.gs.open; ui.gs.q = ''; Views.render(); if (ui.gs.open) $('[data-gsearch]').focus(); },
	closePops() { if (Steps.closePops()) Views.render(); },

	pickRole(d) { session = { pick: d.r }; Views.render(); },

	saveCancel() {
		if (!Forms.valid('cancel')) return;
		const f = ui.f.cancel, o = Data.order(f.id);
		// Qaytarish qoidasi (namuna): pul kassadan, to‘langan usul bo‘yicha manfiy yozuv bilan qaytariladi — shu kun tushumidan ayriladi,
		// xodimlar qo‘lidagi naqdga tegmaydi, kassa daftarida «Mijozga qaytarildi» bo‘lib ko‘rinadi.
		if (f.paid) {
			const by = {};
			db.pays.filter(p => p.oid === o.id).forEach(p => { by[p.usul] = (by[p.usul] || 0) + p.sum; });
			Object.entries(by).filter(([, v]) => v > 0).forEach(([usul, v]) => db.pays.push({ oid: o.id, t: Time.now(), sum: -v, usul, uid: null, by: session.user, qaytar: true }));

	jobStep(d) {
		const o = Data.order(d.id), now = Time.now();
		if (!Steps.mine(o)) return UI.toast('Bu ish sizning brigadangizga biriktirilmagan');
		if (!Steps.guard()) return;
		const step = {
			yol: ['tasdiq', 'yolda', 'yolda', 'yol', 'Yo‘lga chiqdi'],
			boshla: ['yolda', 'ish', 'ish', 'boshla', 'Ishni boshladi'],
			tugat: ['ish', 'tugadi', 'tugadi', 'tugat', 'Ishni tugatdi'],
			olib: ['yolda', 'sexda', 'olindi', 'sex', 'Sexga olib ketdi'],
			qaytar: ['sexda', 'qaytarildi', 'qaytarildi', 'qaytar', 'Qaytarib berdi']
		}[d.s];
		if (!step || o.holat !== step[0]) return Views.render();
		const late = d.s === 'boshla' ? Calc.late(o, now) : 0;
		o.holat = step[1]; o.ts[step[2]] = now;
		Data.log(o, step[4] + (late ? ` (${late} daqiqa kech)` : ''), step[3]);

/* ===== Fields — forma maydonlari o‘zgarishi (manba: d.js) =====
	 Maydon o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) — faqat bog‘liq bo‘laklar yangilanadi. */
const Fields = {
	rowsChanged() {
		const f = ui.f.no;
		if (!f.davManual) { f.dav = Calc.dur(f.rows); const el = $('[data-f="no.dav"]'); if (el) el.value = f.dav; }
		UI.refresh('no-sum', 'no-brig', 'no-bar');
	},
	live: {
		no(k) {
			const f = ui.f.no;
			if (k === 'tel') {
				const c = Data.findClient(f.tel);
				if (c) ['ism', 'manzil'].forEach(x => { if (!f[x].trim()) { f[x] = x === 'ism' ? c.ism : c.manzil[0]; $(`[data-f="no.${x}"]`).value = f[x]; Forms.show('no.' + x); } });
				UI.refresh('no-hit');
			}
			if (k === 'dav') f.davManual = true;
			if (['vaqt', 'dav'].includes(k)) UI.refresh('no-brig');
			if (['ust', 'cheg', 'vaqt', 'dav'].includes(k)) UI.refresh('no-sum', 'no-bar');
		},
		site(k) { if (k === 's') Views.render(); else if (k === 'h') UI.refresh('site-est'); },
		as() { UI.refresh('mbody'); },
		pay(k) { if (k === 'usul') UI.refresh('mbody'); },
		kpay(k) { if (k === 'sum') UI.refresh('kpay-note'); }
	},
	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file';
		if (e.type !== (discrete ? 'change' : 'input')) return;
		if (t.id === 'pin') {
			$('#pinerr').textContent = '';
			if (t.value.length === 4) Actions.login();
		} else if (data.f) {
			const [form, k] = data.f.split('.');
			if (!ui.f[form]) return;
			if ('tel' in data && !(e.inputType || '').startsWith('delete') && t.selectionStart === t.value.length) t.value = F.telLive(t.value);
			ui.f[form][k] = t.type === 'checkbox' ? t.checked : 'num' in data && t.value !== '' ? +t.value : t.value;
			Forms.show(data.f);
			if (Fields.live[form]) Fields.live[form](k);
		} else if (data.row) {
			const r = ui.f.no.rows[+data.row];
			r[data.k] = data.k === 'h' ? t.value : t.value;
			if (data.k === 's') UI.refresh('no-rows'); else { const cell = $('#rs-' + data.row); if (cell) cell.innerHTML = Views.rowSum(r); }
			Forms.show('no.rows');
			Fields.rowsChanged();
		} else if (data.filter) {
			if (can(data.filter)) Actions[data.filter]({ v: t.value });
		} else if (data.search) {
			if (data.search === 'orderFilter') { ui.orderFilter.q = t.value; ui.orderLimit = 40; UI.refresh('list'); }
			if (data.search === 'clientQ') { ui.clientQ = t.value; UI.refresh('clist'); }
		} else if ('gsearch' in data) {
			ui.gs.q = t.value;
			UI.refresh('gs-res');
		} else if (data.set) {
			Fields.setting(t);
		} else if (data.photo && t.files && t.files[0]) {
			Fields.photo(t);
		}
	},
	// Sozlamalar: narx, me’yor, brigada foizi, ichki ulush, umumiy qoidalar. Faqat direktor.
	setting(t) {
		if (!SETTINGS_ROLES.includes(session.role)) return UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
		const [kind, a, b] = t.dataset.set.split('.'), v = +t.value;
		if (t.value === '' || !isFinite(v) || v < 0) return t.setAttribute('aria-invalid', '');
		t.removeAttribute('aria-invalid');
		if (kind === 'svc') Data.svc(a)[b] = v;
		else if (kind === 'brig') Data.brig(a).foiz = Math.min(100, v);
		else if (kind === 'mem') Data.brig(a).a[+b].ul = Math.min(100, v);
		else if (kind === 'set') db.set[a] = v;
		Data.save();
		UI.refresh('rep-body');
	},
	// Surat: ≤ 1280 px ga kichraytirilib, JPEG (0,7) ko‘rinishida qurilmada saqlanadi
	photo(t) {
		const o = Data.order(t.dataset.id), kind = t.dataset.photo, file = t.files[0];
		if (!can('jobStep') || !Steps.mine(o)) return;
		const img = new Image(), url = URL.createObjectURL(file);
		img.onload = () => {
			const k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
			cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
			cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
			URL.revokeObjectURL(url);
			Steps.photo(o, kind, cv.toDataURL('image/jpeg', 0.7));
		};
		img.onerror = () => { URL.revokeObjectURL(url); UI.toast('Bu faylni surat sifatida ochib bo‘lmadi'); };
		img.src = url;
	}
};

/* ===== Hodisalar: bosish, yozish, klaviatura (manba: d.js) ===== */

// Har amal ruxsat jadvalidan o‘tadi (CAN): tugma yashirilgani yetarli emas.
const deny = name => {
	if ([...GUEST_ACTIONS, ...BASE_ACTIONS, ...Object.values(CAN).flat()].includes(name)) UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
	else if (['localhost', '127.0.0.1'].includes(location.hostname)) console.debug('Jadvalda yo‘q amal:', name);
};
Object.keys(Actions).forEach(name => {
	const run = Actions[name];
	Actions[name] = d => can(name) ? run(d) : deny(name);
});

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (Actions[name]) Actions[name](el.dataset);
	else deny(name);
});

/* ===== Router — manzil satri (manba: d.js) =====
	 #/sahifa yoki #/sahifa/karta/id. Brauzerning «orqaga» tugmasi sahifa va kartani qaytaradi. */
const Router = {
	hash: () => !ROLES[session.role] ? '' : '#/' + ui.page + (ui.drawer ? `/${ui.drawer.type}/${ui.drawer.id}` : ''),
	sync() {
		const h = Router.hash();
		if (h !== location.hash && (h || location.hash)) history[location.hash ? 'pushState' : 'replaceState'](null, '', h || location.pathname + location.search);
	},
	read() {
		const [page, type, id] = decodeURIComponent(location.hash.slice(2)).split('/'), role = ROLES[session.role];
		if (!role || !pageOk(role, page)) return false;
		ui.page = page;
		if (page === 'yangi' && !ui.f.no) Steps.newForm();
		if (page === 'sayt' && !ui.site) Steps.newSite();
		ui.drawer = !role.tor && ['order', 'client'].includes(type) ? { type, id: type === 'order' ? +id : id } : null;
		return true;
	}
};
window.addEventListener('popstate', () => { UI.closeModal(); Steps.closePops(); ui.menu = false; if (Router.read() || !session.role) Views.render(); else Router.sync(); });
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { pin: Actions.login, newOrder: Actions.submitOrder, site: Actions.siteSubmit }[e.target.dataset.form];
	if (!submit) return;
	e.preventDefault();
	submit();
});
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	if ($('#modal').innerHTML) UI.closeModal();
	else if (ui.bell || ui.gs.q || ui.gs.open) Actions.closePops();
	else if (ui.drawer) Actions.closeDrawer();
	else if (ui.menu) Actions.toggleMenu();
});
matchMedia('(max-width:820px)').addEventListener('change', () => { if (session.role) Views.render(); });
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; if (session.role) Views.render(); }));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; });
// Namuna soati yuradi: daqiqada bir marta kechikish va «hozir» chizig‘i yangilanadi (forma ochiq bo‘lsa — tegilmaydi)
setInterval(() => { if (session.role && !ROLES[session.role].ochiq && ui.page !== 'yangi' && !$('#modal').innerHTML && !ui.bell && !ui.menu && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)) Views.render(); }, 60000);

/* ===== Ishga tushirish (manba: d.js) ===== */

Data.load();
if (session.role === 'mijoz') Steps.newSite();
Router.read();
Views.render();

// Service worker faqat http(s) da; yangi versiya kelsa — yozilayotgan narsa bo‘lmasa bir marta o‘zi yangilanadi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
	const had = !!navigator.serviceWorker.controller;
	const typing = () => !!document.querySelector('.modal') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
	let reloaded = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (!had || reloaded) return;
		if (typing()) { UI.prompt('Yangi versiya bor', 'Yangilash', 'reloadApp'); return; }
		reloaded = true;
		location.reload();
	});
}

/* ===== Sinov rejimi (build.mjs yozadi): manzilda ?sinov bo‘lsa, modullar window ga chiqariladi ===== */
if (new URLSearchParams(location.search).has('sinov')) {
	Object.assign(window, { DAY, HOUR, MIN, MONTHS, WEEKDAYS, DAY_START, DAY_END, DEMO_START, DEMO_END, Time, ROLES, pageOk, STATUS, FILTERS, KANAL, FIRMA_TEL, USUL, SVC_DEFAULT, EVENTS, GUEST_ACTIONS, BASE_ACTIONS, DESK_ACTIONS, ADMIN_WORK, CAN, SETTINGS_ROLES, can, ui, Data, Calc, $, NB, F, LOGO, UI, Forms, PAGES, Views, SLOTS, KUN_OPTS, Steps, Actions, Fields, deny, Router });
	Object.defineProperties(window, {
		db: { get: () => db, set: v => { db = v; } },
		session: { get: () => session, set: v => { session = v; } }
	});
}
})();
</script>
</body>
