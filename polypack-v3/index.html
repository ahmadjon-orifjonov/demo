		if (!ROLES[pick]) {
			return `<div class="login"><div class="lbox">${head}
				<h1>Kim sifatida kirasiz?</h1><p class="lead-t">Har bir xodim faqat o‘z bo‘limlarini ko‘radi.</p>
				<div class="roles">${Object.entries(ROLES).map(([k, r]) => `<button class="role" data-act="pickRole" data-r="${k}"><span class="x"><span class="n">${r.nom}</span><span class="d">${r.izoh}</span></span>${UI.icon('chev')}</button>`).join('')}</div>
			</div></div>`;
		}
		const users = db.users.filter(u => u.rol === pick);
		return `<div class="login"><div class="lbox">${head}
			<h1>${ROLES[pick].nom}</h1><p class="lead-t">${UI.esc(users.map(u => u.ism).join(', '))}</p>
			<form class="pin-box" data-form="pin" autocomplete="off">
				<label class="fld"><span>PIN kod</span><input id="pin" class="in pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-describedby="pinerr"></label>
				<div class="err" id="pinerr" role="alert"></div>
				<button class="btn pri" type="submit">Kirish</button>
				${users.some(u => u.pin === DEFAULT_PIN) ? `<p class="hint center">Namuna uchun PIN: ${DEFAULT_PIN}</p>` : ''}
			</form>
			<div class="center"><button class="link" data-act="pickRole" data-r="">Boshqa rolni tanlash</button></div>
		</div></div>`;
	},

	/* --- Direktor: Bugun --- */

	// «Diqqat talab qiladi»: t — kim yoki nima, m — muammo; go/id — qator bosilganda, btn — o‘ngdagi amal.
	attention(pl) {
		const items = [], short = Calc.matShort(pl), kirim = db.kirim, waiting = {};
		const title = o => `${o.id} · ${Data.client(o).nom}`;
		Calc.active().filter(o => pl.res[o.id].kech > 0).forEach(o => {
			items.push({ c: 'red', t: title(o), m: `Muddatdan ${pl.res[o.id].kech} kun kech tayyor bo‘ladi · ${F.date(pl.res[o.id].tayyor)}`, go: 'openOrder', id: o.id });
		});
		Object.keys(short).forEach(id => {
			const s = short[id][0], m = Data.mat(s.mat);
			items.push({ c: 'amb', t: title(Data.order(id)), m: `${m.nom}: ${F.qty(s.lack, m)} yetmaydi${kirim && kirim.mat === s.mat ? ` · kirim ${F.date(kirim.at)}` : ''}`, go: 'openOrder', id, btn: ['openStock', 'Qoldiqni ko‘rish'] });
		});
		// qarz sabab to‘xtab turgan buyurtmalar mijoz bo‘yicha bitta qatorga yig‘iladi
		db.orders.filter(o => Calc.ready(o) || o.holat === 'yangi').forEach(o => {
			if (Calc.blocked(o)) (waiting[o.cid] = waiting[o.cid] || []).push(o);
			else if (o.holat === 'yangi') items.push({ c: 'blu', t: title(o), m: `Yangi buyurtma · ${F.spec(o)} · ${F.kg(o.kg)}`, go: 'openOrder', id: o.id, btn: ['approve', 'Navbatga qo‘shish'] });
		});
		db.orders.filter(Calc.overAsked).forEach(o => {
			items.push({ c: 'amb', t: title(o), m: `Buyurtmadan ${F.kg(o.sorovKg - o.kg)} ko‘p jo‘natishga ruxsat so‘ralmoqda${o.ruxsatKg ? ` · avvalgi ruxsat ${F.kg(o.ruxsatKg)} gacha` : ''}`, go: 'openOrder', id: o.id, btn: ['permitOver', 'Ruxsat berish'] });
		});
		Object.keys(waiting).forEach(cid => {
			const d = Calc.clientDebt(cid);
			items.push({ c: 'red', t: Data.client(cid).nom, m: `${d.days} kun kechikkan qarz · ${waiting[cid].length} ta buyurtma ruxsat kutmoqda`, go: 'openClient', id: cid, btn: ['openClient', 'Ko‘rib chiqish'] });
		});
		db.mats.filter(m => m.qoldiq < m.min).forEach(m => {
			items.push({ c: 'amb', t: m.nom, m: `Qoldiq ${F.qty(m.qoldiq, m)} — minimal ${F.qty(m.min, m)} dan kam`, go: 'openStock', id: '' });
		});
		return items;
	},

	today() {
		const pl = Calc.plan(), open = db.orders.filter(o => o.holat !== 'jonatildi');
		const risk = Calc.active().filter(o => pl.res[o.id].kech > 0).length;
		const overdue = Calc.sum(db.clients, c => Calc.clientDebt(c.id).overdue);
		const eco = open.map(Calc.economy), kg = Calc.sum(open, o => o.kg);
		const summa = Calc.sum(eco, e => e.summa), tannarx = Calc.sum(eco, e => e.tannarx);
		const items = Views.attention(pl), limit = ui.attAll ? items.length : UI.mobile() ? 4 : 6;
		const row = (x, right) => `<div class="item">${x.c ? UI.dot(x.c) : ''}
			<button class="x" data-act="${x.go}" data-id="${x.id}"><span class="t">${UI.esc(x.t)}</span><span class="m">${UI.esc(x.m)}</span></button>${right}</div>`;
		const att = x => row(x, x.btn ? `<button class="btn s" data-act="${x.btn[0]}" data-id="${x.id}">${x.btn[1]}</button>` : UI.icon('chev'));

		const endOfTomorrow = Time.date(Time.add(2)).getTime();
		const order = (o, m) => row({ go: 'openOrder', id: o.id, t: `${o.id} · ${Data.client(o).nom}`, m }, `<span class="muted sm tn">${F.kg(o.kg - o.jonatKg)}</span>`);
		const group = (title, list, text) => !list.length ? '' : `<h3>${title}</h3>${list.slice(0, 4).map(o => order(o, text(o))).join('')}`;
		const ready = db.orders.filter(Calc.ready);
		const soon = Calc.active().filter(o => pl.res[o.id].tayyor < endOfTomorrow).sort((a, b) => pl.res[a.id].tayyor - pl.res[b.id].tayyor);

		return `${UI.head('Bugun', `${F.dateLong(Time.today)}, ${WEEKDAYS[Time.date(Time.today).getDay()]}`)}
		${UI.facts([risk ? `<button class="link" data-act="showOrders" data-v="xavf">${risk} ta buyurtma kechikish xavfida</button>` : 'Kechikish xavfi yo‘q', overdue >= 1 ? `<button class="link" data-act="go" data-p="qarzlar">${F.mln(overdue)} so‘m muddati o‘tgan qarz</button>` : 'Muddati o‘tgan qarz yo‘q', `Faol ${F.kg(kg)}, ${open.length} ta`, `Bugun ${F.kg(Calc.producedOn(Time.today))}`])}
		${UI.facts(['Faol buyurtmalar bo‘yicha o‘rtacha:', `1 kg tannarx ${F.som(tannarx / (kg || 1))}`, `sotuv narxi ${F.som(summa / (kg || 1))}`, `marja ${F.pct((summa - tannarx) / (summa || 1) * 100)}`, '<button class="link" data-act="showCalc" data-v="cost">Kalkulyatsiya</button>'], 'quiet')}
		<div class="today">
			<section class="sec">
				${UI.sec(`Diqqat talab qiladi<span class="c">${items.length}</span>`)}
				${items.length ? items.slice(0, limit).map(att).join('') : '<div class="empty">Hozircha hammasi joyida</div>'}
				${items.length > limit ? `<button class="link more" data-act="showAllAttention">Yana ${items.length - limit} ta</button>` : ''}
			</section>
			<div>
				<section class="sec">
					${UI.sec('Jo‘natish va tayyor bo‘lish')}
					${group('Jo‘natishga tayyor', ready, o => `Muddat ${F.date(o.muddat)}${o.jonatKg ? ` · ${STATUS.qisman.t}, qoldi ${F.kg(o.kg - o.jonatKg)}` : ''}`) + group('Bugun-ertaga tayyor bo‘ladi', soon, o => `${F.dateTime(pl.res[o.id].tayyor)} · muddat ${F.date(o.muddat)}`)
						|| '<div class="empty">Yaqin ikki kunda tayyor bo‘ladigan buyurtma yo‘q</div>'}
				</section>
				<section class="sec" id="chart">${Views.chart()}</section>
			</div>
		</div>`;
	},

	// 14 kunlik ishlab chiqarish. Ustun bosilsa, shu kun qiymati pastda ko‘rinadi.
	chart() {
		const days = [...Array(14)].map((_, i) => Time.add(i - 13)), kg = days.map(Calc.producedOn);
		const top = Math.ceil(Math.max(...kg, 1) / 4000) * 4000, avg = Calc.sum(kg.slice(0, -1), x => x) / 13;
		const sel = ui.chartDay == null ? 13 : ui.chartDay;
		return `${UI.sec('Ishlab chiqarish, 14 kun', '<span class="muted sm">Ekstruziya</span>')}
		<div class="chart">
			${[0.5, 1].map(f => `<div class="gl" style="bottom:${f * 100}%"><span>${F.num(top * f / 1000)} t</span></div>`).join('')}
			${kg.map((x, i) => `<button class="b${i === sel ? ' now' : ''}" style="height:${Math.max(2, x / top * 100)}%" data-act="pickDay" data-v="${i}" aria-label="${F.date(days[i])}: ${F.kg(x)}"></button>`).join('')}
		</div>
		<div class="cx">${days.map((d, i) => `<span>${i % 2 ? Time.date(d).getDate() : ''}</span>`).join('')}</div>
		<p class="hint mt8"><span class="strong">${F.date(days[sel])}: ${F.kg(kg[sel])}</span> · kuniga o‘rtacha ${F.kg(avg)}</p>`;
	},

	/* --- Buyurtmalar --- */

	orders() {
		const f = ui.orderFilter, pl = Calc.plan();
		const count = st => db.orders.filter(o => o.holat === st).length;
		const list = [['faol', 'Faol', db.orders.length - count('jonatildi')], ...STATUS_ORDER.map(st => [st, STATUS[st].t, count(st)]),
			['xavf', 'Kechikish xavfi', Calc.active().filter(o => pl.res[o.id].kech > 0).length], ['', 'Hammasi', db.orders.length]];
		const add = can('submitOrder') ? `<button class="btn pri" data-act="go" data-p="yangi">${UI.icon('plus')}Yangi buyurtma</button>` : '';
		return `${UI.head('Buyurtmalar', null, add)}
		<div class="toolbar">${UI.filter('filterOrders', f.st, list)}${UI.search('orderFilter', f.q, 'Raqam, mijoz yoki spetsifikatsiya')}</div>
		<div id="list">${Views.ordersTable(pl)}</div>`;
	},
	ordersTable(pl = Calc.plan()) {
		const f = ui.orderFilter, q = f.q.trim().toLowerCase();
		const late = o => (pl.res[o.id] || {}).kech > 0, open = o => o.holat !== 'jonatildi';
		const match = o => f.st === 'faol' ? open(o) : f.st === 'xavf' ? late(o) : !f.st || o.holat === f.st;
		const rows = db.orders
			.filter(o => match(o) && (!q || `${o.id} ${Data.client(o).nom} ${F.spec(o)}`.toLowerCase().includes(q)))
			.sort((a, b) => (open(b) - open(a)) || (late(b) - late(a)) || (open(a) ? a.muddat.localeCompare(b.muddat) : b.jonatSana.localeCompare(a.jonatSana)));
		return UI.table([
			['Raqam', 'm-hide', o => `<span class="id">${o.id}</span>`],
			['Mijoz', 'c-main', o => UI.who(o)],
			['Spetsifikatsiya', 'c-sub', o => `<span class="m-only">${o.id} · </span>${F.spec(o)}<span class="m-only"> · ${F.kg(o.kg)}</span>`],
			['Miqdor', 'num m-hide', o => F.kg(o.kg)],
			['Muddat', 'nowrap', o => F.date(o.muddat) + (late(o) ? ' ' + UI.flag(`+${pl.res[o.id].kech} kun`) : '')],
			['Tayyor sana', 'm-hide nowrap', o => pl.res[o.id] ? F.date(pl.res[o.id].tayyor) : `<span class="muted">${o.tayyorSana ? F.date(o.tayyorSana) : '—'}</span>`],
			['Holat', 'c-aside', o => UI.badge(STATUS, o.holat)]
		], rows, { row: o => `class="ck" data-act="openOrder" data-id="${o.id}" tabindex="0"`, empty: 'Bu filtr bo‘yicha buyurtma topilmadi' });
	},

	orderCard(id) {
		const o = Data.order(id);
		if (!o) return Views.drawerHead('Buyurtma topilmadi');
		const pl = Calc.plan(), r = pl.res[o.id], c = Data.client(o), cd = Calc.clientDebt(o.cid), debt = Calc.orderDebt(o), eco = Calc.economy(o);
		const money = Calc.money(o);
		// «Qisman jo‘natildi» bosqichi faqat shunday buyurtmada ko‘rinadi
		const stages = STATUS_ORDER.filter(st => st !== 'qisman' || o.holat === 'qisman'), at = stages.indexOf(o.holat);
		const boss = can('permit'), blocked = Calc.blocked(o);

		let production;
		if (r) {
			const short = o.faol ? Calc.materialCheck(o) : Calc.matShort(pl)[o.id] || [];
			const route = Calc.route(o).map((s, i) => {
				const name = Data.line(s === 'E' ? o.liniya : s).nom;
				return i < o.etap ? `<span class="muted">${name}</span>` : i === o.etap ? `<span class="strong">${name}${o.faol ? ', ishlanmoqda' : ''}</span>` : name;
			}).join(' → ');
			production = [
				['Marshrut', route],
				['Tayyor bo‘ladi', `${F.dateTime(r.tayyor)} ${r.kech > 0 ? UI.flag(`muddatdan ${r.kech} kun kech`) : `<span class="muted">· ${r.zaxira ? `muddatdan ${r.zaxira} kun oldin` : 'muddat kuni'}</span>`}`],
				o.faol && ['Bajarildi', `${F.kg(o.done)} / ${F.kg(o.kg)}`],
				short.length && ['Material', UI.flag(F.lack(short), 'amb')]
			];
		} else if (o.holat === 'yangi') {
			const best = Calc.bestLine(o);
			production = [['Navbatga qo‘yilsa', `${Data.line(best.lid).nom}, ${F.dateTime(best.r.tayyor)} da tayyor ${best.r.kech > 0 ? UI.flag(`muddatdan ${best.r.kech} kun kech`) : ''}`]];
		} else {
			production = [['Liniya', Data.line(o.liniya).nom], ['Tayyor bo‘ldi', o.tayyorSana ? F.date(o.tayyorSana) : '—'], o.jonatSana && [o.holat === 'qisman' ? 'Oxirgi jo‘natish' : 'Jo‘natildi', F.date(o.jonatSana)],
				(o.ruxsatKg || Calc.overAsked(o)) && ['Ortiqcha jo‘natish', [o.ruxsatKg && `Ruxsat berilgan: ${F.kg(o.ruxsatKg)} gacha`, Calc.overAsked(o) && `So‘ralgan: ${F.kg(o.sorovKg)}`].filter(Boolean).join(' · ')]];
		}

		const inStock = db.rolls.filter(x => x.oid === o.id && x.holat !== 'jonatildi');
		const warning = (o.holat === 'yangi' || Calc.ready(o)) && blocked
			? UI.note(`<b>${UI.esc(c.nom)}da ${cd.days} kun kechikkan ${F.som(cd.overdue)} qarz bor.</b> ${o.holat === 'yangi' ? 'Navbatga qo‘yish' : 'Jo‘natish'} uchun direktor ruxsati kerak.`, 'warn')
			: o.ruxsat ? UI.note(`Direktor ${F.date(o.ruxsat)} kuni qarzga qaramay ruxsat bergan.`) : '';

		const actions = [`<button class="btn" data-act="sendStatus" data-id="${o.id}">Mijozga holatni yuborish</button>`];
		if (money.open > 0 && can('openPayment')) actions.push(`<button class="btn" data-act="openPayment" data-id="${o.id}">To‘lov kiritish</button>`);
		if (o.holat === 'yangi' && can('approve')) actions.push(`<button class="btn pri" data-act="approve" data-id="${o.id}"${blocked && !boss ? ' disabled' : ''}>Navbatga qo‘shish</button>`);
		if (o.faol && can('forceFinish') && Calc.materialCheck(o).length) actions.push(`<button class="btn" data-act="forceFinish" data-id="${o.id}">Baribir tugatish</button>`);
		if (Calc.overAsked(o) && can('permitOver')) actions.push(`<button class="btn pri" data-act="permitOver" data-id="${o.id}">Ortiqcha jo‘natishga ruxsat</button>`);
		if (Calc.ready(o) && boss && blocked) actions.push(`<button class="btn pri" data-act="permit" data-id="${o.id}">Jo‘natishga ruxsat berish</button>`);

		return Views.drawerHead(`<span class="id">${o.id}</span> · ${UI.esc(c.nom)}`, `${F.spec(o)} · ${F.kg(o.kg)}`, UI.badge(STATUS, o.holat)) + `<div class="dbody">
			${warning}
			<div class="steps" aria-label="Bosqichlar">${stages.map((st, i) => `<div class="step${i < at ? ' done' : i === at ? ' cur' : ''}">${STATUS[st].t}</div>`).join('')}</div>
			${o.holat === 'qisman' ? `<p class="hint center">Jo‘natildi ${F.kg(o.jonatKg)}, qoldi ${F.kg(o.kg - o.jonatKg)}</p>` : ''}
			<div class="dsec"><h3>Buyurtma</h3>${UI.dl([
				['Mijoz', `<button class="link" data-act="openClient" data-id="${c.id}">${UI.esc(c.nom)}</button>`],
				['Spetsifikatsiya', `${F.spec(o)}, o‘zak 76 mm`],
				['Miqdor', `${F.kg(o.kg)} · ${Math.ceil(o.kg / Calc.rollKg(o.eni))} rulon`],
				['Muddat', F.dateLong(o.muddat)],
				['Qabul qilingan', F.date(o.sana)]])}</div>
			<div class="dsec"><h3>Ishlab chiqarish</h3>${UI.dl(production)}</div>
			<div class="dsec"><h3>Pul</h3>${UI.dl([
				['Narx', `${F.num(o.narx)} so‘m/kg`],
				['Buyurtma summasi', F.som(money.total)],
				o.jonatKg > 0 && ['Jo‘natilgan', `${F.kg(o.jonatKg)} / ${F.kg(o.kg)} · ${F.som(money.billed)}`],
				boss && ['Tannarx, jami', `<span id="card-cost">${F.som(eco.tannarx)}</span> · ${F.num(eco.tannarx / o.kg)} so‘m/kg`],
				boss && ['Marja', `<span id="card-margin">${F.som(eco.marja)} · ${F.pct(eco.marjaPct)}</span>`],
				['To‘langan', `${F.som(o.tolangan)} · ${F.paid(o)}`],
				money.debt > 0 && ['Qarz', `<span id="card-debt">${F.som(money.debt)}</span>`],
				debt.due && ['To‘lov muddati', `${F.date(debt.due)} ${debt.days ? UI.flag(`${debt.days} kun o‘tgan`) : ''}`]])}</div>
			${inStock.length ? `<div class="dsec"><h3>Rulonlar</h3>${UI.dl([
				['Omborda', `${inStock.length} rulon · ${F.kg(Calc.sum(inStock, x => x.netto))} netto`]])}</div>` : ''}
			<div class="dsec"><h3>Tarix</h3><ul class="hist">${o.tarix.slice().reverse().map(h => `<li><span>${F.date(h.d)}</span><span>${UI.esc(h.m)}</span></li>`).join('')}</ul></div>
		</div><div class="dfoot">${actions.join('')}</div>`;
	},

	clientCard(id) {
		const c = Data.client(id), d = Calc.clientDebt(id);
		const orders = db.orders.filter(o => o.cid === id).sort((a, b) => b.sana.localeCompare(a.sana));
		// direktor qarz sabab to‘xtab turgan buyurtmaga shu yerning o‘zida ruxsat beradi
		const waits = o => (Calc.ready(o) || o.holat === 'yangi') && Calc.blocked(o);
		const item = o => `<div class="item">
			<button class="x" data-act="openOrder" data-id="${o.id}"><span class="t">${o.id} · ${F.spec(o)}</span><span class="m">${F.kg(o.kg)} · ${F.date(o.sana)} · ${STATUS[o.holat].t}${waits(o) ? ' · ruxsat kutmoqda' : ''}</span></button>
			${waits(o) && can('permit') ? `<button class="btn s" data-act="${o.holat === 'yangi' ? 'approve' : 'permit'}" data-id="${o.id}">${o.holat === 'yangi' ? 'Navbatga qo‘shish' : 'Jo‘natishga ruxsat'}</button>` : ''}
			${can('repeatOrder') ? `<button class="btn s" data-act="repeatOrder" data-id="${o.id}">Takroriy buyurtma</button>` : ''}</div>`;
		return Views.drawerHead(UI.esc(c.nom), `${UI.esc(c.soha)} · ${UI.esc(c.shahar)}`) + `<div class="dbody">
			${UI.dl([
				['Aloqa', `${UI.esc(c.kontakt)} · <a class="link" href="tel:${c.tel.replace(/\s/g, '')}">${UI.esc(c.tel)}</a>`],
				['To‘lov sharti', c.tolovKun ? c.tolovKun + ' kun keyin' : '100 % oldindan'],
				['Kredit limiti', F.som(c.limit)],
				['Qarz', `${d.total ? F.som(d.total) : 'Yo‘q'} ${d.overdue ? UI.flag(`${F.mln(d.overdue)} · ${d.days} kun o‘tgan`) : ''}`],
				c.avans > 0 && ['Avans', `${F.som(c.avans)} · keyingi buyurtmaga o‘tadi`]])}
			<div class="dsec"><h3>Buyurtmalar · ${orders.length}</h3>${orders.map(item).join('')}</div>
		</div>${d.total && can('openClientPayment') ? `<div class="dfoot"><button class="btn pri" data-act="openClientPayment" data-id="${id}">To‘lov kiritish</button></div>` : ''}`;
	},

	stockCard() {
		return Views.drawerHead('Xomashyo qoldig‘i') + `<div class="dbody">${Views.materialsTable()}<div class="mt16">${Views.kirimNote(false)}</div></div>`;
	},

	/* --- Sotuv: Yangi buyurtma --- */

	resetNewOrder(from = {}) {
		const cid = from.cid || 'c1', tur = from.tur || 'CPP', qal = from.qal || 30;
		ui.f.no = { cid, tur, qal, eni: from.eni || 1000, kg: from.kg || 3000, muddat: Time.add(10), narx: Calc.suggestPrice(cid, tur, qal).narx, manual: false };
	},
	draftOrder() {
		const f = ui.f.no;
		return { id: 'yangi', cid: f.cid, tur: f.tur, qal: +f.qal, eni: +f.eni || 0, kg: +f.kg || 0, narx: +f.narx || 0, muddat: f.muddat, holat: 'navbat', liniya: 'E1', tartib: 1e6, etap: 0, faol: false, done: 0 };
	},
	priceHint() {
		const f = ui.f.no, s = Calc.suggestPrice(f.cid, f.tur, +f.qal);
		return `Taklif: ${F.num(s.narx)} so‘m/kg — ${s.src}` + (f.manual && +f.narx !== s.narx ? ` · <button type="button" class="link" data-act="useSuggestedPrice">taklifni qo‘yish</button>` : '');
	},
	newOrder() {
		if (!ui.f.no) Views.resetNewOrder();
		const f = ui.f.no, year = +Time.today.slice(0, 4);
		return `${UI.head('Yangi buyurtma')}
		<form class="split" data-form="newOrder" novalidate>
			<div class="grid2">
				${UI.field('Mijoz', UI.select('no.cid', db.clients.map(c => [c.id, c.nom])), { cls: 'full' })}
				${UI.group('Turi', `<div>${UI.seg('setType', f.tur, [['CPP', 'CPP — shaffof'], ['MCPP', 'MCPP — metallangan']])}</div>`, { cls: 'full' })}
				${UI.field('Qalinlik', UI.select('no.qal', THICKNESS.map(x => [x, x + ' mkm'])))}
				${UI.numField('Eni', 'no.eni', 'mm', { attrs: 'min="300" max="1800" step="10"' })}
				${UI.numField('Miqdor', 'no.kg', 'kg', { attrs: 'min="100" step="100"' })}
				${UI.group('Muddat', UI.date('no.muddat', [year, year + 1]), { key: 'no.muddat' })}
				${UI.numField('Narx', 'no.narx', 'so‘m/kg', { attrs: 'min="0" step="100"', hint: `<span id="price-hint">${Views.priceHint()}</span>`, cls: 'full' })}
			</div>
			<div class="chk-p" id="check" aria-live="polite">${Views.orderCheck()}</div>
		</form>`;
	},
	// Buyurtmani qabul qilish mumkinmi: xulosa, muammolar va tugma. Tugma xulosadan keyin turadi.
	orderCheck() {
		const o = Views.draftOrder();
		const button = (label, off) => `<div class="foot"><button class="btn pri" type="submit"${off ? ' disabled' : ''}>${label}</button></div>`;
		if (['no.eni', 'no.kg', 'no.narx', 'no.muddat'].some(Forms.error)) return button('Buyurtmani qabul qilish', true);

		const x = Calc.orderCheck(o), kirim = db.kirim, { short, late, left, debt, eco } = x, n = x.needs;
		const waits = x.supply === 'kutadi', viaKirim = x.supply === 'kirim';
		const problems = short.map(s => {
			const m = Data.mat(s.mat);
			return ['amb', `${m.nom} yetmaydi: ${F.qty(s.lack, m)}`, waits ? `Kirim ${F.dateLong(kirim.at)} kuni kutilmoqda, ish undan keyin boshlanadi.` : 'Navbatdagi buyurtmalar va kutilayotgan kirimdan keyin ham yetmaydi — xarid qilish kerak.'];
		});
		if (late) problems.push(['red', `Muddatga ulgurmaydi: ${late} kun kech`, `Eng erta ${F.dateLong(x.ready)}da tayyor bo‘ladi.`]);
		if (debt.overdue > 0) problems.push(['red', `Mijozda ${debt.days} kun kechikkan qarz: ${F.mln(debt.overdue)} so‘m`, 'Navbatga faqat direktor ruxsati bilan qo‘yiladi.']);
		if (x.overLimit) problems.push(['amb', 'Kredit limitidan oshadi', `Qarz ${F.mln(debt.total)} + bu buyurtma ${F.mln(eco.summa)}, limit ${F.mln(x.limit)} so‘m.`]);
		if (x.lowMargin) problems.push([eco.marja < 0 ? 'red' : 'amb', `Marja past: ${F.pct(eco.marjaPct)}`, `Tannarx ${F.num(eco.tannarx / o.kg)} so‘m/kg.`]);

		const fine = [!short.length && `Material yetadi${viaKirim ? ` (${F.date(kirim.at)} kirimi bilan)` : ''}`, !late && !short.length && (left ? `Muddatdan ${left} kun oldin` : 'Muddat kuni tayyor'), !debt.total && 'Mijozda qarz yo‘q'];
		return `<div class="verdict">${UI.dot(problems.length ? problems[0][0] : 'grn')}${problems.length ? `Qabul qilishdan oldin: ${problems.length} ta masala` : 'Qabul qilish mumkin'}</div>
		${problems.map(([tone, title, text]) => `<div class="chk">${UI.dot(tone)}<div><div class="v">${title}</div><div class="d">${text}</div></div></div>`).join('')}
		${UI.facts(fine, 'quiet mt8')}
		${UI.dl([
			['Tayyor bo‘ladi', `${F.dateLong(x.ready)} · ${Data.line(x.line).nom}`],
			['Xomashyo', `granula ${F.kg(n.granula)}${n.alu ? ` · alyuminiy ${F.kg(n.alu, 1)}` : ''} · o‘zak ${Calc.needs(o.kg, o.tur, o.eni).ozak} dona`],
			['Summa', F.som(eco.summa)],
			['Marja', `${F.pct(eco.marjaPct)} · ${F.mln(eco.marja)} so‘m`]], 'mt16')}
		${button(debt.overdue > 0 ? 'Saqlash — direktor ruxsatini kutadi' : problems.length ? 'Shunga qaramay qabul qilish' : 'Buyurtmani qabul qilish')}`;
	},

	/* --- Sotuv: Mijozlar --- */

	clients() {
		return `${UI.head('Mijozlar')}
		<div class="toolbar"><span></span>${UI.search('clientFilter', ui.clientFilter.q, 'Mijoz nomi')}</div>
		<div id="list">${Views.clientsTable()}</div>`;
	},
	clientsTable() {
		const q = ui.clientFilter.q.trim().toLowerCase();
		const rows = db.clients.filter(c => !q || c.nom.toLowerCase().includes(q)).map(c => {
			const orders = db.orders.filter(o => o.cid === c.id).sort((a, b) => b.sana.localeCompare(a.sana));
			return { c, n: orders.length, last: orders[0], d: Calc.clientDebt(c.id) };
		}).sort((a, b) => (b.last ? b.last.sana : '').localeCompare(a.last ? a.last.sana : ''));
		return UI.table([
			['Mijoz', 'c-main', x => `${UI.esc(x.c.nom)}<span class="sub">${UI.esc(x.c.soha)}</span>`],
			['Shahar', 'm-hide', x => UI.esc(x.c.shahar)],
			['Buyurtmalar', 'num m-hide', x => x.n],
			['Oxirgi buyurtma', '', x => x.last ? `${F.date(x.last.sana)} <span class="muted">· ${F.spec(x.last)}</span>` : '—'],
			['Qarz', 'num', x => x.d.total ? F.som(x.d.total) : '<span class="muted">—</span>'],
			['Muddati o‘tgan', 'num m-hide', x => x.d.overdue ? F.som(x.d.overdue) : '<span class="muted">—</span>'],
			['Kechikish', 'c-aside', x => x.d.days ? UI.flag(`${x.d.days} kun`) : '']
		], rows, { row: x => `class="ck" data-act="openClient" data-id="${x.c.id}" tabindex="0"`, empty: 'Mijoz topilmadi' });
	},

	/* --- Ishlab chiqarish: Navbat --- */

	queue() {
		const pl = Calc.plan(), lid = ui.line, ln = Data.line(lid), rows = pl.q[lid], extrusion = lid !== 'M' && lid !== 'K';
		const short = Calc.matShort(pl), cfg = db.norms;
		const movable = extrusion ? rows.filter(x => x.o.holat === 'navbat' && !x.o.faol).map(x => x.o) : [];

		let hint = '';
		const setupHours = lid === 'M' ? cfg.metSozlash : cfg.kesSozlash;
		if (!extrusion) hint = `Tartib oldingi bosqich tugashiga qarab belgilanadi. Eni o‘zgarsa, ${F.num(setupHours * 60)} daqiqa qayta sozlash qo‘shiladi.`;
		else if (rows.length > 1) {
			const setups = rows.filter(x => x.setup).length, least = new Set(rows.map(x => x.o.qal)).size - 1;
			const saved = (setups - least) * cfg.sozlash;
			hint = !setups ? '' : `Qayta sozlash: ${setups} marta, jami ${F.num(setups * cfg.sozlash, 1)} soat.`
				+ (saved > 0 ? ` Bir xil qalinlikdagi buyurtmalar ketma-ket qo‘yilsa, ${F.num(saved, 1)} soat tejaladi.` : '');
		}

		const body = rows.map((x, i) => {
			const o = x.o, r = pl.res[o.id], here = Calc.stageLine(o) === lid, running = here && o.faol, at = movable.indexOf(o);
			const gap = !x.setup ? '' : `<tr class="gap"><td colspan="6">Qayta sozlash · ${extrusion ? `${F.num(cfg.sozlash, 1)} soat · ${x.from} → ${o.qal} mkm` : `${F.num(setupHours * 60)} daqiqa · eni ${F.num(x.from)} → ${F.num(o.eni)} mm`}</td></tr>`;
			const arrow = (dir, name, label, off) => `<button class="btn s ic" data-act="moveOrder" data-id="${o.id}" data-dir="${dir}"${off ? ' disabled' : ''} aria-label="${label}">${UI.icon(name)}</button>`;
			const move = at < 0 ? '' : arrow(-1, 'up', 'Yuqoriga', at === 0) + arrow(1, 'down', 'Pastga', at === movable.length - 1);
			const action = running ? `<button class="btn s" data-act="finishStage" data-id="${o.id}">Tugatish</button>`
				: `<button class="btn s" data-act="startStage" data-id="${o.id}"${here ? '' : ' disabled'}>Boshlash</button>`;
			// shu bosqichda hozir yetmayotgani birinchi; bo‘lmasa — reja bo‘yicha keyingi bosqichlarda yetmaydigani (bosqich nomi bilan)
			const stageId = extrusion ? 'E' : lid, lacks = short[o.id] || [];
			const lack = (here && Calc.materialCheck(o)[0]) || lacks.find(s => s.stage === stageId) || lacks[0];
			const where = lack && lack.stage !== stageId ? { E: 'Ekstruziyada: ', M: 'Metallizatsiyada: ', K: 'Kesishda: ' }[lack.stage] : '';
			const lackFlag = lack ? UI.flag(`${where}${Data.mat(lack.mat).nom.split(',')[0]} yetmaydi`, 'amb') : '';
			const due = r.kech > 0 ? UI.flag(`${r.kech} kun kech`) : `<span class="muted sm nowrap">${r.zaxira ? `${r.zaxira} kun oldin` : 'Muddat kuni'}</span>`;
			const progress = !running ? '' : ` <span class="nowrap muted"><span class="prog"><i style="width:${Math.min(100, o.done / o.kg * 100)}%"></i></span>${F.kg(o.done)}</span>`;
			return gap + `<tr${ui.changed.includes(o.id) ? ' class="chg"' : ''}>
				<td class="m-hide num muted">${i + 1}</td>
				<td class="c-main nowrap"><span><span class="id">${o.id}</span> · ${UI.who(o)}</span></td>
				<td class="c-sub"><span>${F.spec(o)}<span class="sub">${F.kg(o.kg)}${progress} <span class="m-none">${lackFlag}</span></span></span></td>
				<td class="nowrap tn" data-l="Boshlanish – tugash"><span>${running ? 'hozir' : F.dateTime(x.start)} → ${F.dateTime(x.end)}</span></td>
				<td class="nowrap tn" data-l="Tayyor / muddat"><span>${F.date(r.tayyor)} / ${F.date(o.muddat)}<span class="sub m-none">${due}</span></span></td>
				<td class="c-aside d-none">${r.kech > 0 || !lack ? due : lackFlag}</td>
				<td class="c-acts"><div class="cell-acts">${move}${action}</div></td></tr>`;
		}).join('');

		return `${UI.head('Navbat')}
		${UI.tabs('setLine', lid, db.lines.map(l => [l.id, l.nom, pl.q[l.id].length]))}
		<div class="lhead"><span>${F.num(Calc.rate(lid))} kg/soat${extrusion ? ' · 2 smena' : ''}</span><span class="tn">${rows.length ? `Navbatda ${F.kg(Calc.sum(rows, x => x.o.kg))} · ${F.dateTime(rows[rows.length - 1].end)} gacha band` : ''}</span></div>
		${hint ? UI.note(hint) : ''}
		${rows.length ? `<div class="tw mt16"><table class="tbl cards"><thead><tr><th class="num">№</th><th>Buyurtma</th><th>Spetsifikatsiya</th><th>Boshlanish – tugash</th><th>Tayyor / muddat</th><th></th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">Bu liniyada navbat yo‘q</div>'}`;
	},

	/* --- Ishlab chiqarish: Smena hisoboti --- */

	emptyShift: (base = {}) => ({ sana: Time.today, smena: 1, liniya: 'E1', soat: db.norms.smenaSoat, tur: 'CPP', ...base, ishlab: '', chiqindi: '', granula: '', alu: '', m1: '', izoh: '' }),
	shift() {
		if (!ui.f.sr) ui.f.sr = Views.emptyShift({ m0: Calc.lastMeter('E1') });
		return `${UI.head('Smena hisoboti')}
		<div class="split">
			<form data-form="shift" novalidate id="shift-form">${Views.shiftForm()}</form>
			<div class="chk-p" id="shift-check" aria-live="polite">${Views.shiftCheck()}</div>
		</div>
		<section class="sec">${UI.sec('Oxirgi hisobotlar')}${Views.reports()}</section>`;
	},
	// To‘lov qayerga yozilishi: «PP-1048: 20 000 000 so‘m · avans: 0 so‘m».
	payPlan: plan => plan.parts.map(p => `${p.o.id}:${NB}${F.som(p.som)}`).concat(`avans:${NB}${F.som(plan.avans)}`).join(' · '),
	payPlanLive() {
		const f = ui.f.pay, only = f.id && Data.order(f.id);
		return +f.sum > 0 ? Views.payPlan(Calc.allocate(only ? only.cid : f.cid, +f.sum, only)) : '';
	},
	// Smenada shu liniyada ishlangan buyurtmalar: hozir ishlanayotgani va shu kuni bosqichi tugaganlari.
	shiftOrders(f) {
		return db.orders.filter(o => (f.sana === Time.today && o.faol && Calc.stageLine(o) === f.liniya) || o.yakun.some(y => y.lid === f.liniya && y.d === f.sana));
	},
	// Hisobotga yoziladigan mahsulot bo‘laklari: [{ id, tur, kg }]. Bitta buyurtma — hammasi unga;
	// bir nechta — kiritilgan kg, oxirgisiga qolgani; buyurtma topilmasa — tanlangan mahsulot turi.
	shiftParts(f) {
		const list = Views.shiftOrders(f), made = +f.ishlab || 0;
		if (!list.length) return [{ tur: f.liniya === 'M' ? 'MCPP' : f.tur, kg: made }];
		let rest = made;
		return list.map((o, i) => {
			const kg = i === list.length - 1 ? rest : +f['kg_' + o.id] || 0;
			rest -= kg;
			return { id: o.id, tur: o.tur, kg };
		});
	},
	// Oxirgi buyurtmaga yoziladigan kg qo‘lda kiritilmaydi: jami − qolganlari, faqat o‘qish uchun.
	shiftRest() {
		const f = ui.f.sr, kg = Views.shiftParts(f).pop().kg;
		return !(+f.ishlab > 0) ? 'qolgani — jami kiritilgach hisoblanadi' : kg < 0 ? `qolgani: jami miqdordan ${F.kg(-kg)} ortiq` : `qolgani: <b>${F.kg(kg)}</b>`;
	},
	shiftProduct() {
		const f = ui.f.sr, list = Views.shiftOrders(f), label = o => `${o.id} · ${UI.who(o)} · ${F.spec(o)}`;
		if (!list.length) return f.liniya === 'M' ? '' : UI.field('Mahsulot', UI.select('sr.tur', [['CPP', 'CPP'], ['MCPP', 'MCPP uchun plyonka']]), { cls: 'full', hint: 'Bu smenaga bog‘langan buyurtma topilmadi' });
		if (list.length === 1) return `<div class="fld full"><span>Buyurtma</span><div class="ro">${label(list[0])}</div></div>`;
		return `<div class="fld full"><span>Buyurtmalar — ishlab chiqarilgan kg qanday bo‘linadi</span>${list.map((o, i) => i < list.length - 1
			? UI.numField(label(o), 'sr.kg_' + o.id, 'kg', { attrs: 'min="0" step="10"' })
			: `<div class="ro rest"><span>${label(o)}</span><span id="shift-rest">${Views.shiftRest()}</span></div>`).join('')}<small class="ferr" data-err="sr.parts"></small></div>`;
	},
	shiftForm() {
		const f = ui.f.sr, year = +Time.today.slice(0, 4);
		return `<div class="grid2 duo">
			${UI.group('Sana', UI.date('sr.sana', Time.today.slice(5, 7) === '01' ? [year - 1, year] : [year]), { key: 'sr.sana', cls: 'wide-m' })}
			${UI.field('Smena', UI.select('sr.smena', [[1, '1-smena · 08:00–20:00'], [2, '2-smena · 20:00–08:00']]), { cls: 'wide-m' })}
			${UI.field('Liniya', UI.select('sr.liniya', db.lines.filter(l => l.id !== 'K').map(l => [l.id, l.nom])))}
			${UI.numField('Ishlangan soat', 'sr.soat', 'soat', { attrs: 'min="1" max="12" step="0.5"' })}
			${Views.shiftProduct()}
			${UI.numField('Ishlab chiqarildi', 'sr.ishlab', 'kg', { attrs: 'min="0" step="10"' })}
			${UI.numField('Chiqindi', 'sr.chiqindi', 'kg', { attrs: 'min="0"' })}
			${f.liniya === 'M' ? UI.numField('Sarflangan alyuminiy sim', 'sr.alu', 'kg', { attrs: 'min="0" step="0.1"', cls: 'full' })
				: UI.numField('Sarflangan granula', 'sr.granula', 'kg', { attrs: 'min="0" step="10"', cls: 'full' })}
			${UI.numField('Hisoblagich, boshida', 'sr.m0', 'kVt·soat', { attrs: 'min="0"' })}
			${UI.numField('Hisoblagich, oxirida', 'sr.m1', 'kVt·soat', { attrs: 'min="0"' })}
			${UI.field('Izoh', `<textarea class="in" data-f="sr.izoh" rows="2">${UI.esc(f.izoh)}</textarea>`, { cls: 'full' })}
		</div>
		<div class="foot"><button class="btn pri" type="submit">Hisobotni saqlash</button></div>`;
	},
	delta: (actual, norm) => !actual || !norm ? '' : `<span class="dv ${Calc.tone(actual, norm)}">${F.signed((actual - norm) / norm * 100, 1)} %</span>`,
	shiftCheck() {
		const f = ui.f.sr, c = Calc.cost('CPP'), n = db.norms, metal = f.liniya === 'M';
		const made = +f.ishlab || 0, kwh = (+f.m1 || 0) - (+f.m0 || 0);
		if (!made) return '';
		const row = (key, actual, norm, text, normText) => `<div class="chk">${UI.dot(actual > 0 ? Calc.tone(actual, norm) : 'line')}<div><div class="k">${key}</div><div class="v">${actual > 0 ? `${text} ${Views.delta(actual, norm)}` : '—'}</div><div class="d">me’yor ${normText}</div></div></div>`;
		const kwhT = kwh / made * 1000, kwhNorm = metal ? n.metallKwhT : c.kwhE;
		const out = ['<h2>Me’yorga nisbatan</h2>', row('Elektr, 1 t ga', kwhT, kwhNorm, `${F.num(kwhT)} kVt·soat`, `${F.num(kwhNorm)} kVt·soat/t`)];
		if (metal) {
			const aluT = (+f.alu || 0) / made * 1000;
			out.push(row('Alyuminiy sim, 1 t ga', aluT, n.aluKgT, F.kg(aluT, 1), `${F.kg(n.aluKgT, 1)}/t`));
		} else {
			const waste = (+f.chiqindi || 0) / (made + (+f.chiqindi || 0)) * 100, granT = (+f.granula || 0) / made * 1000;
			out.push(row('Chiqindi', waste, n.chiqindi, F.pct(waste), F.pct(n.chiqindi)), row('Granula, 1 t ga', granT, c.fresh, F.kg(granT), `${F.kg(c.fresh)}/t`));
		}
		return out.join('');
	},
	reports() {
		const rows = db.reports.slice().sort((a, b) => b.sana.localeCompare(a.sana) || b.smena - a.smena || a.liniya.localeCompare(b.liniya)).slice(0, UI.mobile() ? 5 : 15);
		return UI.table([
			['Sana', 'c-main', r => `${F.date(r.sana)}, ${r.smena}-smena`],
			['Liniya', 'c-aside', r => `<span class="muted">${Data.line(r.liniya).nom}</span>`],
			['Mahsulot', 'm-hide', r => (r.parts || []).map(p => `${p.tur}${p.id ? ' · ' + p.id : ''}`).join(', ')],
			['Soat', 'num m-hide', r => F.num(r.soat, r.soat % 1 ? 1 : 0)],
			['Ishlab chiqarildi', 'num', r => F.kg(r.ishlab)],
			['Chiqindi', 'num', r => F.pct(r.chiqindi / (r.ishlab + r.chiqindi) * 100)],
			['Granula, kg/t', 'num m-hide', r => r.granula ? F.num(r.granula / r.ishlab * 1000) : '—'],
			['kVt·soat/t', 'num', r => F.num(r.kwh / r.ishlab * 1000)],
			['Izoh', 'm-hide muted', r => UI.esc(r.izoh)]
		], rows);
	},

	/* --- Ombor: Xomashyo --- */

	// «Navbatga kerak» — navbatdagi buyurtmalar (Navbat ekranidagi belgilar bilan bir hisobdan),
	// «Yangi buyurtmalarga» — hali navbatga qo‘yilmaganlari uchun qo‘shimcha ehtiyoj.
	materialsTable() {
		const need = Calc.queueNeeds(Calc.plan()), more = Calc.newNeeds();
		return UI.table([
			['Material', 'c-main', m => UI.esc(m.nom)],
			['Jurnal boshida', 'num m-hide', m => F.qty(db.opening[m.k], m)],
			['Qoldiq', 'num', m => F.qty(m.qoldiq, m)],
			['Minimal', 'num m-hide', m => F.qty(m.min, m)],
			['Navbatga kerak', 'num', m => F.qty(need[m.k], m)],
			['Yangi buyurtmalarga yana', 'num', m => more[m.k] ? F.qty(more[m.k], m) : '<span class="muted">—</span>'],
			['Holat', 'c-aside', m => { const [tone, text] = Calc.matState(m, need[m.k]); return `<span class="st">${UI.dot(tone)}${text}</span>`; }]
		], db.mats);
	},
	kirimNote(withAction) {
		const k = db.kirim;
		return !k ? '' : UI.facts([`Kutilayotgan kirim: ${Data.mat(k.mat).nom}, ${F.kg(k.kg)}`, UI.esc(k.kim), F.date(k.at), withAction && '<button class="link" data-act="receiveKirim">Keldi, kirim qilish</button>']);
	},
	materials() {
		return `${UI.head('Xomashyo', null, `<button class="btn" data-act="openMove" data-v="chiqim">Chiqim</button><button class="btn pri" data-act="openMove" data-v="kirim">${UI.icon('plus')}Kirim</button>`)}
		${Views.materialsTable()}
		<div class="mt16">${Views.kirimNote(true)}</div>
		<section class="sec">${UI.sec('Harakatlar')}
		${UI.table([
			['Sana', 'm-hide nowrap', x => F.date(x.d)],
			['Material', 'c-main', x => UI.esc(Data.mat(x.k).nom)],
			['Turi', 'c-aside', x => x.tur === 'tuzatish' ? UI.flag('Tuzatish', 'amb') : `<span class="muted">${x.tur === 'kirim' ? 'Kirim' : 'Chiqim'}</span>`],
			['Miqdor', 'num', x => `${x.tur === 'kirim' ? '+' : '−'}${F.qty(x.kg, Data.mat(x.k))}`],
			['Izoh', 'c-sub', x => `<span class="m-only">${F.date(x.d)} · </span>${UI.esc(x.izoh)}`]
		], db.moves.slice(0, UI.mobile() ? 6 : 20))}</section>`;
	},
	moveForm() {
		const f = ui.f.mv, m = Data.mat(f.k), incoming = f.tur === 'kirim';
		return `<div class="grid2">
			${UI.field('Material', UI.select('mv.k', db.mats.map(x => [x.k, x.nom])), { cls: 'full' })}
			${UI.numField('Miqdor', 'mv.kg', m.birlik, { attrs: 'min="0" autofocus', hint: `Qoldiq: ${F.qty(m.qoldiq, m)}`, cls: 'full' })}
			${UI.field(incoming ? 'Yetkazuvchi, partiya' : 'Kimga', UI.input('mv.izoh'), { cls: 'full' })}
		</div>`;
	},

	/* --- Ombor: Tayyor rulonlar --- */

	rolls() {
		const f = ui.rollFilter, count = st => db.rolls.filter(r => !st || r.holat === st).length;
		return `${UI.head('Tayyor rulonlar', null, `<button class="btn pri" data-act="openRoll">${UI.icon('plus')}Rulon kiritish</button>`)}
		<div class="toolbar">${UI.filter('filterRolls', f.st, [...['bosh', 'band', 'jonatildi'].map(st => [st, ROLL_STATUS[st].t, count(st)]), ['', 'Hammasi', count('')]])}${UI.search('rollFilter', f.q, 'Rulon, buyurtma yoki mijoz')}</div>
		<div id="list">${Views.rollsTable()}</div>`;
	},
	rollsTable() {
		const f = ui.rollFilter, q = f.q.trim().toLowerCase(), cap = UI.mobile() ? 20 : 200;
		const owner = r => r.oid ? `${r.oid} · ${Data.client(Data.order(r.oid)).nom}` : 'Zaxira';
		const rows = db.rolls.filter(r => (!f.st || r.holat === f.st) && (!q || `${r.id} ${owner(r)}`.toLowerCase().includes(q)))
			.sort((a, b) => b.sana.localeCompare(a.sana) || b.id.localeCompare(a.id));
		return UI.table([
			['Rulon', 'c-main', r => `<span class="id">${r.id}</span>`],
			['Buyurtma', 'c-sub', r => `${r.oid ? UI.esc(owner(r)) : '<span class="muted">Zaxira</span>'}<span class="m-only"> · ${F.spec(r)}</span>`],
			['Spetsifikatsiya', 'm-hide', r => F.spec(r)],
			['Netto', 'num', r => F.kg(r.netto, 1)],
			['Brutto', 'num m-hide', r => F.kg(r.brutto, 1)],
			['Sana', 'm-hide nowrap', r => F.date(r.sana)],
			['Holat', 'c-aside', r => UI.badge(ROLL_STATUS, r.holat)]
		], rows.slice(0, cap), {
			empty: 'Rulon topilmadi',
			foot: `<tfoot><tr><td class="c-main" colspan="3">Jami: ${rows.length} rulon${rows.length > cap ? `, oxirgi ${cap} tasi ko‘rsatilgan` : ''}</td><td class="num" data-l="Netto">${F.kg(Calc.sum(rows, r => r.netto), 1)}</td><td class="m-hide" colspan="3"></td></tr></tfoot>`
		});
	},
	rollOrders: () => db.orders.filter(o => o.holat === 'ishlab' || Calc.ready(o)),
	rollSpec() {
		const f = ui.f.roll, o = f.oid && Data.order(f.oid);
		return o ? { tur: o.tur, qal: o.qal, eni: o.eni } : { tur: f.tur, qal: +f.qal, eni: +f.eni || 0 };
	},
	rollForm() {
		const f = ui.f.roll, s = Views.rollSpec();
		const manual = f.oid ? `<div class="full hint">${F.spec(s)} · o‘zak 76 mm</div>`
			: UI.field('Turi', UI.select('roll.tur', [['CPP', 'CPP'], ['MCPP', 'MCPP']])) + UI.field('Qalinlik', UI.select('roll.qal', THICKNESS.map(x => [x, x + ' mkm']))) + UI.numField('Eni', 'roll.eni', 'mm', { attrs: 'min="300" step="10"', cls: 'full' });
		return `<div class="grid2">
			${UI.field('Buyurtma', UI.select('roll.oid', [...Views.rollOrders().map(o => [o.id, `${o.id} · ${Data.client(o).nom} · ${F.spec(o)}`]), ['', 'Zaxira (buyurtmasiz)']]), { cls: 'full' })}
			${manual}
			${UI.numField('Brutto, tarozida', 'roll.brutto', 'kg', { attrs: 'min="0" step="0.1" autofocus', cls: 'full' })}
		</div>
		<div id="roll-net" class="mt16">${Views.rollNet()}</div>`;
	},
	rollNet() {
		const s = Views.rollSpec(), core = Calc.coreKg(s.eni), brutto = +ui.f.roll.brutto || 0;
		return `<div class="netto">${brutto > core ? F.num(brutto - core, 1) : '0,0'} <small>kg netto</small></div>
			<div class="hint">brutto − o‘zak ${F.num(core, 2)} kg</div>`;
	},

	/* --- Ombor: Jo‘natish --- */

	readyRolls: oid => db.rolls.filter(r => r.oid === oid && r.holat === 'band'),
	shipForm(o) {
		if (!ui.f.ship || ui.f.ship.oid !== o.id) ui.f.ship = { oid: o.id, pick: Views.readyRolls(o.id).map(r => r.id), mashina: '', haydovchi: '' };
		return ui.f.ship;
	},
	ship() {
		const ready = db.orders.filter(Calc.ready), mobile = UI.mobile();
		const current = ready.find(o => o.id === ui.shipSel) || (mobile ? null : ready[0]);
		const item = o => {
			const rolls = Views.readyRolls(o.id);
			return `<button class="row-b" data-act="selectShipment" data-id="${o.id}" aria-pressed="${o === current}"><span class="x"><span class="t">${o.id} · ${UI.who(o)}</span><span class="m">${rolls.length} rulon · ${F.kg(Calc.sum(rolls, r => r.netto))}</span>${o.jonatKg ? UI.badge(STATUS, 'qisman') : ''}</span>${Calc.blocked(o) ? UI.flag('Qarz') : ''}${UI.icon('chev')}</button>`;
		};
		const list = ready.length ? ready.map(item).join('') : '<div class="empty">Jo‘natishga tayyor buyurtma yo‘q</div>';
		const history = `<section class="sec">${UI.sec('Oxirgi jo‘natmalar')}${UI.table([
			['Hujjat', 'm-hide', s => `<span class="id">${s.id}</span>`],
			['Buyurtma', 'c-main', s => `${s.oid} · ${UI.esc(Data.client(Data.order(s.oid) || {}).nom)}<span class="sub sub-m">${s.id}${s.mashina ? ' · ' + UI.esc(s.mashina) : ''} · ${s.rulon} rulon</span>`],
			['Rulon', 'num m-hide', s => s.rulon],
			['Netto', 'num', s => F.kg(s.kg)],
			['Mashina', 'm-hide', s => UI.esc(s.mashina || '—')],
			['Sana', 'c-aside', s => `<span class="muted">${F.date(s.d)}</span>`]
		], db.ships.slice().sort((a, b) => b.d.localeCompare(a.d)).slice(0, mobile ? 4 : 8))}</section>`;

		if (mobile) {
			return current
				? `<button class="btn s ghost" data-act="selectShipment" data-id="">${UI.icon('back')}Tayyor buyurtmalar</button><div class="mt8">${Views.shipDetail(current)}</div>`
				: UI.head('Jo‘natish') + list + history;
		}
		return UI.head('Jo‘natish') + `<div class="ship"><div class="ship-list">${list}</div><div>${current ? Views.shipDetail(current) : ''}</div></div>` + history;
	},
	// Rulonlar o‘z maydonida aylanadi; jami va tugmalar doim ko‘rinib turadi.
	shipDetail(o) {
		const rolls = Views.readyRolls(o.id), f = Views.shipForm(o), picked = rolls.filter(r => f.pick.includes(r.id)), kg = Calc.sum(picked, r => r.netto);
		const debt = Calc.clientDebt(o.cid), blocked = Calc.blocked(o), name = UI.who(o), open = ui.shipRolls || !UI.mobile();
		const warning = !debt.overdue ? ''
			: blocked ? UI.note(`<b>${name}da ${debt.days} kun kechikkan ${F.som(debt.overdue)} qarz bor.</b> Jo‘natishga faqat direktor ruxsat beradi.`, 'warn')
			: UI.note(`Muddati o‘tgan qarz bor. Direktor ${F.date(o.ruxsat)} kuni jo‘natishga ruxsat bergan.`);
		const rows = rolls.map(r => `<tr>
			<td><input type="checkbox" class="cbx" data-roll="${r.id}"${f.pick.includes(r.id) ? ' checked' : ''} aria-label="${r.id}"></td>
			<td><span class="id">${r.id}</span></td>
			<td class="num">${F.kg(r.netto, 1)}</td>
			<td class="num">${F.kg(r.brutto, 1)}</td></tr>`).join('');
		const check = Calc.shipCheck(o, kg), needsPermit = check.permit === 'ask' || check.permit === 'wait';
		const state = !picked.length ? '' : check.kind === 'partial' ? UI.flag(`Qisman: ${F.kg(o.kg)} dan ${F.kg(check.total)}`, 'amb')
			: check.kind === 'over' ? UI.flag(`Buyurtmadan ${F.kg(check.extraKg)} ko‘p — ${check.permit === 'ok' ? 'direktor ruxsat bergan' : check.permit === 'wait' ? 'ruxsat kutilmoqda' : o.ruxsatKg ? 'yangi ruxsat kerak' : 'direktor ruxsati kerak'}`, 'amb') : '';
		const label = !picked.length ? 'Jo‘natildi' : check.kind === 'partial' ? STATUS.qisman.t : needsPermit ? (check.permit === 'wait' ? 'Ruxsat kutilmoqda' : 'Direktordan ruxsat so‘rash') : 'Jo‘natildi';
		const table = !rolls.length ? '<div class="empty">Omborda bu buyurtmaning ruloni yo‘q. «Tayyor rulonlar» bo‘limida kiriting.</div>'
			: !open ? `<button class="link more" data-act="toggleShipRolls">Rulonlarni ko‘rsatish</button>`
			: `<div class="rolls-box"><table class="tbl"><thead><tr><th><input type="checkbox" class="cbx" data-roll-all${picked.length === rolls.length ? ' checked' : ''} aria-label="Hammasini belgilash"></th><th>Rulon</th><th class="num">Netto</th><th class="num">Brutto</th></tr></thead><tbody>${rows}</tbody></table></div>`;
		return `<h2>${o.id} · ${name}</h2><div class="muted sm">${F.spec(o)} · buyurtma ${F.kg(o.kg)}</div>
		${warning ? `<div class="mt16">${warning}</div>` : ''}
		${UI.facts([`Buyurtma <b>${F.kg(o.kg)}</b>`, o.jonatKg > 0 && `Avval jo‘natilgan <b>${F.kg(o.jonatKg)}</b>`, `Tanlandi <b>${F.kg(kg)}</b> (${picked.length} / ${rolls.length} rulon)`,
			picked.length > 0 && `Farq <b>${F.signed(check.diff, 1)} %</b> (ruxsat ±${F.num(check.tol, check.tol % 1 ? 1 : 0)} %)`, 'Hisob jo‘natilgan kg bo‘yicha', state, o.ruxsatKg && `Ruxsat berilgan: ${F.kg(o.ruxsatKg)} gacha`], 'ship-sum')}
		${table}
		<div class="grid2 mt16">${UI.field('Mashina raqami', UI.input('ship.mashina'))}${UI.field('Haydovchi', UI.input('ship.haydovchi'))}</div>
		<div class="foot">
			<button class="btn" data-act="openPacking" data-id="${o.id}"${picked.length ? '' : ' disabled'}>Packing list</button>
			<button class="btn pri" data-act="ship" data-id="${o.id}"${blocked || !picked.length || check.permit === 'wait' ? ' disabled' : ''}>${label}</button>
			${blocked ? '<span class="hint">Direktor ruxsati kerak</span>' : ''}
		</div>`;
	},
	packing(o) {
		const f = Views.shipForm(o), rolls = db.rolls.filter(r => f.pick.includes(r.id)), c = Data.client(o);
		return `<div class="pl">
			<div class="h">POLYPACK MChJ</div><div>Sirdaryo EIZ</div>
			<div class="h mt16">Packing list № J-${o.id.slice(3)}</div>
			<div class="meta">
				<span>Sana</span><span>${F.dateLong(Time.today)}</span><span>Buyurtma</span><span>${o.id}</span>
				<span>Qabul qiluvchi</span><span>${UI.esc(c.nom)}, ${UI.esc(c.shahar)}</span><span>Mashina</span><span>${UI.esc(f.mashina || '—')}</span>
				<span>Mahsulot</span><span>${F.spec(o)}, o‘zak 76 mm</span><span>Haydovchi</span><span>${UI.esc(f.haydovchi || '—')}</span>
			</div>
			<table><thead><tr><th>№</th><th>Rulon</th><th>Spetsifikatsiya</th><th class="r">Netto, kg</th><th class="r">Brutto, kg</th></tr></thead><tbody>
				${rolls.map((r, i) => `<tr><td>${i + 1}</td><td>${r.id}</td><td>${F.spec(r)}</td><td class="r">${F.num(r.netto, 1)}</td><td class="r">${F.num(r.brutto, 1)}</td></tr>`).join('')}
				<tr><th colspan="3">Jami: ${rolls.length} rulon</th><th class="r">${F.num(Calc.sum(rolls, r => r.netto), 1)}</th><th class="r">${F.num(Calc.sum(rolls, r => r.brutto), 1)}</th></tr>
			</tbody></table>
			<div class="sig"><div>Topshirdi (omborchi)</div><div>Qabul qildi (haydovchi)</div></div>
		</div>`;
	},

	/* --- Direktor: Kalkulyatsiya --- */

	calc() {
		const norms = ui.calcTab === 'norms';
		return `${UI.head('Kalkulyatsiya')}
		<div class="tabs-row${norms ? '' : ' narrow'}">
			${UI.tabs('setCalcTab', ui.calcTab, [['cost', 'Tannarx', null, 'Tannarx'], ['actual', 'Reja va haqiqiy', null, '<span class="vh">Reja va </span>Haqiqiy'], ['order', 'Buyurtma hisobi', null, 'Buyurtma<span class="vh"> hisobi</span>'], ['norms', 'Me’yorlar', null, 'Me’yorlar']])}
			${norms || UI.mobile() ? '' : Views.typeSwitch()}
		</div>
		<div id="calc-body">${Views.part('calc-body')}</div>`;
	},
	typeSwitch: () => UI.seg('setCalcType', ui.calcTur, [['CPP', 'CPP'], ['MCPP', 'MCPP']]),
	// telefonda tanlov bo‘lim sarlavhasining o‘ng tomonida turadi
	typeHead: (title, right = '') => UI.sec(title, UI.mobile() ? Views.typeSwitch() : right),
	// Me’yor o‘zgarganda «avvalgi → yangi» ko‘rinadi.
	calcSummary() {
		const base = ui.normBase;
		return ['CPP', 'MCPP'].map(tur => {
			const c = Calc.cost(tur), was = base && Math.round(base[tur]) !== Math.round(c.perKg) ? `<s>${F.num(base[tur])}</s> → ` : '';
			return `<span>${tur} tannarxi <b>${was}${F.num(c.perKg)}</b> so‘m/kg · marja <b>${F.pct(c.marjaPct)}</b></span>`;
		}).join('');
	},
	costParts: c => [['Xomashyo', c.parts.xom, 'br'], ['Elektr', c.parts.elek, 'br3'], ['Ishchi kuchi', c.parts.ish, 'brm'], ['Boshqa', c.parts.boshqa, 'tx4']],
	// To‘rt guruh bo‘yicha qisqa tarkib: telefonda asosiy ko‘rinish, Me’yorlar bo‘limida jonli natija.
	costGroups(tur, total = 'Jami tannarx') {
		const c = Calc.cost(tur);
		return `<table class="tbl grp4"><tbody>${Views.costParts(c).map(([name, v, tone]) => `<tr><td>${UI.dot(tone)} ${name}</td><td class="num">${F.num(v / 1000)} so‘m/kg</td><td class="num">${F.pct(v / c.jami * 100)}</td></tr>`).join('')}
			<tr class="tot"><td>${total}</td><td class="num">${F.num(c.perKg)} so‘m/kg</td><td class="num">100 %</td></tr></tbody></table>`;
	},
	calcLive: () => ['CPP', 'MCPP'].map(tur => Views.costGroups(tur, `Jami tannarx, ${tur}`)).join(''),
	calcCost() {
		const tur = ui.calcTur, c = Calc.cost(tur), n = db.norms, metal = tur === 'MCPP', mobile = UI.mobile();
		const share = x => F.pct(x / c.jami * 100), parts = Views.costParts(c);
		const row = (name, sub, qty, som) => `<tr><td class="c-main"><span>${name}<span class="sub">${sub}</span></span></td><td class="num" data-l="Miqdor, 1 t ga">${qty}</td><td class="num" data-l="So‘m / t">${F.num(som)}</td><td class="num m-hide">${share(som)}</td></tr>`;
		const mass = (label, kg, cls = '') => `<tr class="${cls}"><td>${label}</td><td class="num">${F.kg(kg, kg < 30 ? 1 : 0)}</td></tr>`;
		const table = `<div class="tw"><table class="tbl cards">
			<thead><tr><th>Modda</th><th class="num">Miqdor, 1 t ga</th><th class="num">So‘m / t</th><th class="num">Ulush</th></tr></thead><tbody id="cost-rows">
			${c.mats.map(m => m.k === 'ozak' ? row(m.nom, `${F.num(m.narx)} so‘m/dona`, `${F.num(m.kg)} dona`, m.som) : row(m.nom, `${F.num(m.narx)} so‘m/kg`, F.kg(m.kg, m.kg < 30 ? 1 : 0), m.som)).join('')}
			${row('Elektr', `Ekstruziya ${F.num(c.kwhE)}${metal ? ` + metallizatsiya ${F.num(c.kwhM)}` : ''} · ${F.num(n.tarif)} so‘m/kVt·soat`, `${F.num(c.kwh)}${NB}kVt·soat`, c.parts.elek)}
			${row('Ishchi kuchi', `1 odam-soat ${F.som(c.rate)}`, `${F.num(c.mh, 1)}${NB}odam-soat`, c.parts.ish)}
			${row('Boshqa xarajatlar', 'amortizatsiya, ta’mir, qadoq, transport', '—', c.parts.boshqa)}
			<tr class="tot"><td class="c-main">Jami tannarx</td><td class="m-hide"></td><td class="num" data-l="So‘m / t" id="cost-total">${F.num(c.jami)}</td><td class="num m-hide">100 %</td></tr>
		</tbody></table></div>`;
		const balance = `<table class="tbl bal"><tbody>
			${mass('Yangi xomashyo (ombordan)', c.fresh)}
			${mass('+ regranulyat qaytadi', c.regran)}
			${mass('Eritiladi', c.melt, 'tot')}
			${mass(`− chiqindi ${F.pct(n.chiqindi)}, shundan ${F.kg(c.scrap - c.regran)} yo‘qotiladi`, c.scrap)}
			${mass(metal ? 'Plyonka, metallizatsiyaga' : 'Tayyor plyonka, netto', c.film, 'tot')}
			${metal ? mass(`− metallizatsiyada yo‘qotish ${F.pct(n.metallChiqindi)}`, c.metalLoss)
				+ mass(`+ alyuminiy qatlami (sim ${F.kg(n.aluKgT, 1)}, shundan ${F.kg(c.aluLost, 1)} o‘tirmaydi)`, c.aluLayer)
				+ mass('Tayyor MCPP, netto', 1000, 'tot') : ''}
		</tbody></table>`;
		return `<div class="narrow">
			${Views.typeHead(`1 tonna tayyor ${tur} ${Views.recipeFlag()}`)}
			<div class="big">
				<div><div class="l">Tannarx</div><div class="v xl">${F.num(c.perKg)}<small>so‘m/kg</small></div></div>
				<div><div class="l">Sotuv narxi</div><div class="v">${F.num(c.price)}<small>so‘m/kg</small></div></div>
				<div><div class="l">Marja</div><div class="v">${F.pct(c.marjaPct)}<small>${F.num(c.marja)} so‘m/kg</small></div></div>
			</div>
			<div class="share" aria-hidden="true">${parts.map(([, v, tone]) => `<i style="width:${v / c.jami * 100}%;--c:var(--${tone})"></i>`).join('')}</div>
			${Views.costGroups(tur)}
			${UI.more('Batafsil', `${table}<h3 class="mt16">Massa balansi</h3>${balance}`, !mobile)}
		</div>`;
	},
	calcActual() {
		const p = Calc.planVsActual(7), tur = ui.calcTur, x = p && (tur === 'MCPP' ? p.mcpp : p.cpp);
		if (!x) return `<div class="narrow">${UI.mobile() ? Views.typeHead('Oxirgi 7 kun') : ''}<div class="empty">${p ? `Oxirgi 7 kunda ${tur} ishlab chiqarilmagan` : 'Oxirgi 7 kunda smena hisoboti yo‘q'}</div></div>`;
		const row = (r, i) => `${i === 4 ? '<tr class="grp"><td colspan="5">Metallizatsiya</td></tr>' : ''}<tr${r.part ? ' class="part"' : ''}><td>${r.name}<span class="sub">${r.unit}</span></td><td class="num m-hide">${F.num(r.norm, r.digits)}</td><td class="num">${F.num(r.actual, r.digits)}</td><td class="num">${Views.delta(r.actual, r.norm)}</td><td class="num">${F.signed(r.cost)}</td></tr>`;
		const worst = x.rows.filter(r => !r.part).sort((a, b) => b.cost - a.cost)[0];
		return `<div class="narrow">
			${Views.typeHead(`Oxirgi 7 kun, ${tur}: ${x.n} ta smena hisoboti`)}
			<div><table class="tbl">
				<thead><tr><th>Ko‘rsatkich</th><th class="num m-hide">Joriy me’yor</th><th class="num">Haqiqiy</th><th class="num">Farq</th><th class="num">1 kg ga, so‘m</th></tr></thead><tbody>
				${x.rows.map(row).join('')}
				<tr class="tot"><td>1 kg ${tur} tannarxi</td><td class="num m-hide">${F.num(x.norm)}</td><td class="num">${F.num(x.actual)}</td><td></td><td class="num">${F.signed(x.over)}</td></tr>
			</tbody></table></div>
			<div class="mt16">${UI.note(x.over > 0
				? `Eng katta farq — <b>${worst.name.toLowerCase()}</b>: 1 kg ga ${F.signed(worst.cost)} so‘m. Oyiga ${F.num(x.monthKg / 1000)} t hajmda me’yordan ortiq xarajat <b>${F.mln(x.over * x.monthKg)} so‘m</b> atrofida.`
				: `Haqiqiy tannarx me’yordan ${F.num(-x.over)} so‘m/kg kam.`)}</div>
			${p.changed ? `<p class="hint mt8">Me’yor ${F.date(p.changed)} kuni o‘zgargan — taqqoslash joriy me’yor bilan.</p>` : ''}
		</div>`;
	},
	calcOrder() {
		if (!ui.f.oc) ui.f.oc = { oid: '', kg: 5000, narx: Calc.listPrice(ui.calcTur) };
		const open = db.orders.filter(o => o.holat !== 'jonatildi');
		return `<div class="narrow">${UI.mobile() ? Views.typeHead(`${ui.calcTur} buyurtmasi`) : ''}<div class="oc-in">
			${UI.field('Buyurtmani tanlash', UI.select('oc.oid', [['', 'Qo‘lda kiritish'], ...open.map(o => [o.id, `${o.id} · ${Data.client(o).nom}`])]))}
			${UI.numField('Miqdor', 'oc.kg', 'kg', { attrs: 'min="0" step="100"' })}

			[o ? `O‘zak 76 mm (${F.num(o.eni)} mm rulon)` : 'O‘zak (me’yor bo‘yicha)', `${n.ozak} dona`],
			['Elektr', `${F.num(n.kwh)}${NB}kVt·soat`], ['Ishchi kuchi', `${F.num(n.mh)}${NB}odam-soat`],
			['Ekstruziya vaqti', `${F.num(n.hours, 1)}${NB}soat`],
			['Tannarx', `<span class="strong" id="oc-cost">${F.som(eco.tannarx)}</span>`], ['Summa', F.som(eco.summa)],
			['Marja', `<span id="oc-margin">${F.som(eco.marja)} · ${F.pct(eco.marjaPct)}</span>`]], 'wide mt16');

	calcNorms() {
		const row = ([k, label, unit]) => `<label class="nrow"><span>${label}</span><input class="in" type="number" inputmode="decimal" step="any" min="0" data-norm="${k}" value="${db.norms[k]}"><em>${unit}</em></label>`;
		return `<div class="calc-sum" id="calc-sum">${Views.calcSummary()}</div>
		<div class="live" id="calc-live">${Views.calcLive()}</div>
		<div class="sec-h mt16"><p class="hint">Me’yorlar namunaviy — o‘z raqamlaringizni kiriting. <span id="recipe-note">${Views.recipeNote()}</span></p><button class="btn s" data-act="resetNorms">Boshlang‘ich qiymatlar</button></div>
		<div class="norms">${NORM_FIELDS.map(([group, rows], i) => UI.mobile()
			? `<details class="ng"${i ? '' : ' open'}><summary>${group}</summary>${rows.map(row).join('')}</details>`
			: `<fieldset class="ng"><legend>${group}</legend>${rows.map(row).join('')}</fieldset>`).join('')}</div>`;
	},
	// Tannarx sarlavhasidagi qisqa belgi: retsept 100 % emasligi natijaga ta’sir qiladi
	recipeFlag() { const total = Calc.recipeSum(); return Math.abs(total - 100) > 0.01 ? UI.flag(`Retsept ${F.num(total, 1)} %`, 'amb') : ''; },
	recipeNote() {
		const total = Calc.recipeSum();
		return Math.abs(total - 100) > 0.01 ? `<span class="flag amb">Retsept yig‘indisi ${F.num(total, 1)} % — hisobda 100 % ga keltirildi.</span>` : '';
	},

				['', 'c-acts', u => `<div class="cell-acts"><button class="btn s" data-act="openUser" data-v="${db.users.indexOf(u)}">PIN ni almashtirish</button></div>`]

		</section>
