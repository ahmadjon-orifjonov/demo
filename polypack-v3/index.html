/* ===== 6. Actions — hodisalar =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */

// Amallar ichida qayta ishlatiladigan qadamlar (foydalanuvchi to‘g‘ridan to‘g‘ri chaqirmaydi).
const Steps = {
	enqueue(o) {
		const lid = Calc.bestLine({ ...o, holat: 'navbat' }).lid;
		const last = Math.max(0, ...db.orders.filter(x => x.liniya === lid && x.holat === 'navbat').map(x => x.tartib));
		Object.assign(o, { holat: 'navbat', liniya: lid, etap: 0, faol: false, done: 0, tartib: last + 1 });
		Data.log(o, `${Data.line(lid).nom} navbatiga qo‘yildi`);
	},
	// To‘lov bitta buyurtmaga (id) yoki mijozga (cid) kiritiladi.
	// Mijozga kiritilsa, avval to‘lov muddati eng eski buyurtmalar yopiladi.
	paymentModal(f, text) {
		ui.f.pay = f;
		UI.modal('To‘lov kiritish', `<p class="cf">${text}</p><div class="mt16">${UI.numField('Summa', 'pay.sum', 'so‘m', { attrs: 'min="0" step="1000" autofocus' })}</div><p class="hint mt8" id="pay-plan">${Views.payPlanLive()}</p>`, UI.buttons('Saqlash', 'savePayment'));
	},
	completeStage(o) {
		const name = Data.line(Calc.stageLine(o)).nom;
		Data.log(o, `${name}: tugadi`);
		Data.consume(o, Calc.stage(o));
		o.yakun.push({ lid: Calc.stageLine(o), d: Time.today }); // smena hisoboti shu buyurtmani topishi uchun
		if (o.etap === 0) Data.line(o.liniya).lastQal = o.qal;
		Object.assign(o, { etap: o.etap + 1, faol: false, done: 0 });
		const finished = o.etap >= Calc.route(o).length;
		if (finished) { Object.assign(o, { holat: 'tayyor', tayyorSana: Time.today }); Data.log(o, 'Tayyor, omborga topshirildi'); }
		Data.save(); Views.render();
		UI.toast(finished ? `${o.id} tayyor, omborga topshirildi` : `${o.id} keyingi bosqichga o‘tdi: ${Data.line(Calc.stageLine(o)).nom}`);
	},
	moveModal(f) {
		ui.f.mv = f;
		ui.modalForm = 'moveForm';
		UI.modal(f.tur === 'kirim' ? 'Kirim' : 'Chiqim', null, UI.buttons('Saqlash', 'saveMove'));
	}
};

const Actions = {
	/* navigatsiya */
	go(d) { Object.assign(ui, { page: d.p, menu: false, drawer: null, attAll: false, normBase: null }); Views.render(); window.scrollTo(0, 0); },
	showOrders(d) { ui.orderFilter = { st: d.v, q: '' }; Actions.go({ p: 'buyurtmalar' }); },
	showCalc(d) { ui.calcTab = d.v; Actions.go({ p: 'kalk' }); },
	toggleMenu() { ui.menu = !ui.menu; Views.render(); },
	pickRole(d) { session = { pick: d.r }; Views.render(); },
	login() {
		const input = $('#pin'), user = db.users.find(u => u.rol === session.pick && u.pin === input.value);
		if (user) {
			session = { role: user.rol, user: user.id };
			Data.saveSession();
			ui.page = null;
			Views.render();
		} else {
			$('#pinerr').textContent = 'PIN noto‘g‘ri';
			input.value = '';
			input.focus();
		}
	},
	logout() { $('#toasts').innerHTML = ''; session = {}; Data.saveSession(); Object.assign(ui, { menu: false, drawer: null, page: null, chartDay: null, f: {} }); Views.render(); },
	// Brauzer o‘rnatish oynasini bermasa (iPhone), qo‘lda o‘rnatish yo‘li ko‘rsatiladi.
	install() {
		ui.menu = false;
		Views.render();
		const steps = (title, a, b) => `<h3>${title}</h3><ol class="steps-l"><li>${a}</li><li>${b}</li></ol>`;
		const manual = () => UI.modal('Telefonga o‘rnatish', steps('iPhone, Safari', '«Ulashish» tugmasi', '«Ekranga qo‘shish»') + steps('Android, Chrome', 'Brauzer menyusi', '«Ilovani o‘rnatish»'), '<button class="btn" data-act="closeModal">Yopish</button>');
		if (!ui.install) return manual();
		ui.install.prompt().catch(manual);
		ui.install = null;
	},
	openOrder(d) { ui.drawer = { type: 'order', id: d.id, enter: true }; UI.refresh('layer'); ui.drawer.enter = false; },
	openClient(d) { ui.drawer = { type: 'client', id: d.id, enter: true }; UI.refresh('layer'); ui.drawer.enter = false; },
	openStock(d) { ui.drawer = { type: 'stock', id: d.id, enter: true }; UI.refresh('layer'); ui.drawer.enter = false; },
	closeDrawer() { ui.drawer = null; UI.refresh('layer'); },
	closeModal() { UI.closeModal(); },
	confirmOk() { const fn = UI.onConfirm; UI.onConfirm = null; UI.closeModal(); if (fn) fn(); },
	showAllAttention() { ui.attAll = true; Views.render(); },
	pickDay(d) { ui.chartDay = +d.v; UI.refresh('chart'); },

	/* buyurtmalar */
	filterOrders(d) { ui.orderFilter.st = d.v; Views.render(); },
	setType(d) { const f = ui.f.no; f.tur = d.v; if (!f.manual) f.narx = Calc.suggestPrice(f.cid, f.tur, +f.qal).narx; Views.render(); },
	useSuggestedPrice() { const f = ui.f.no; f.narx = Calc.suggestPrice(f.cid, f.tur, +f.qal).narx; f.manual = false; Views.render(); },
	repeatOrder(d) {
		Views.resetNewOrder(Data.order(d.id));
		Object.assign(ui, { page: 'yangi', drawer: null });
		Views.render();
		window.scrollTo(0, 0);
	},
	submitOrder() {
		if (!Forms.valid('no')) return;
		const d = Views.draftOrder();
		const o = Data.newOrder({ cid: d.cid, tur: d.tur, qal: d.qal, eni: d.eni, kg: d.kg, narx: d.narx, muddat: d.muddat });
		const blocked = Calc.blocked(o);
		Data.log(o, 'Buyurtma qabul qilindi');
		Data.applyAdvance(o);
		if (blocked) Data.log(o, 'Mijozda muddati o‘tgan qarz — direktor ruxsatini kutmoqda');
		else Steps.enqueue(o);
		db.orders.push(o);
		Data.save();
		Object.assign(ui, { page: 'buyurtmalar', orderFilter: { st: 'faol', q: '' } });
		ui.f.no = null;
		Views.render();
		Actions.openOrder(o);
		UI.toast(blocked ? `${o.id} direktorga yuborildi` : `${o.id} qabul qilindi · ${Data.line(o.liniya).nom}`);
	},
	approve(d) {
		const o = Data.order(d.id), debt = Calc.clientDebt(o.cid);
		if (debt.overdue > 0 && !can('permit')) return UI.toast('Qarzdor mijoz buyurtmasiga faqat direktor ruxsat beradi');
		const run = () => {
			Steps.enqueue(o);
			if (debt.overdue > 0) { o.ruxsat = Time.today; Data.log(o, 'Direktor qarzga qaramay ruxsat berdi: navbat va jo‘natish'); }
			Data.save(); Views.render();
			UI.toast(`${o.id} ${Data.line(o.liniya).nom} navbatiga qo‘yildi`);
		};
		if (debt.overdue > 0) UI.confirm(`${UI.esc(Data.client(o).nom)}da ${debt.days} kun kechikkan ${F.som(debt.overdue)} qarz bor. Baribir navbatga qo‘yilsinmi? Ruxsat jo‘natishga ham tegishli bo‘ladi va tarixga yoziladi.`, 'Navbatga qo‘shish', run);
		else run();
	},
	permit(d) {
		const o = Data.order(d.id);
		UI.confirm(`${o.id} (${UI.esc(Data.client(o).nom)}) qarz to‘lanmagan holda jo‘natilsinmi? Ruxsat tarixga yoziladi va omborchiga ko‘rinadi.`, 'Ruxsat berish', () => {
			o.ruxsat = Time.today;
			Data.log(o, 'Direktor jo‘natishga ruxsat berdi');
			Data.save(); Views.render();
			UI.toast(`${o.id}: jo‘natishga ruxsat berildi`);
		});
	},
	permitOver(d) {
		const o = Data.order(d.id), kg = o.sorovKg;
		if (!Calc.overAsked(o)) return;
		// ruxsat aynan so‘ralgan miqdorga beriladi; keyin ko‘proq tanlansa, yangi so‘rov kerak bo‘ladi
		UI.confirm(`${o.id}: jami ${F.kg(kg)} gacha jo‘natiladi — buyurtmadan ${F.kg(kg - o.kg)} ko‘p, mijozga ${F.som((kg - o.kg) * o.narx)} qo‘shimcha hisoblanadi. Ruxsat berilsinmi?`, 'Ruxsat berish', () => {
			Object.assign(o, { ruxsatKg: kg, sorovKg: null });
			Data.log(o, `Direktor ${F.kg(kg)} gacha jo‘natishga ruxsat berdi`);
			Data.save(); Views.render();
			UI.toast(`${o.id}: ortiqcha jo‘natishga ruxsat berildi`);
		});
	},
	openPayment(d) {
		const o = Data.order(d.id), m = Calc.money(o);
		// qarz bo‘lsa — qarz summasi, bo‘lmasa (hali jo‘natilmagan) — oldindan to‘lov uchun buyurtma qoldig‘i taklif qilinadi
		Steps.paymentModal({ id: o.id, sum: Math.round(m.debt || m.open) }, `${o.id} · ${UI.who(o)}. Qarz: <b id="pay-debt">${F.som(m.debt)}</b>${o.jonatKg ? ` (jo‘natilgan ${F.kg(o.jonatKg)} uchun)` : ''}. Buyurtma summasi ${F.som(m.total)}, to‘langan ${F.som(m.paid)}.`);
	},
	openClientPayment(d) {
		const debt = Calc.clientDebt(d.id);
		Steps.paymentModal({ cid: d.id, sum: Math.round(debt.total) }, `${UI.esc(Data.client(d.id).nom)} · qarz ${F.som(debt.total)}${debt.overdue ? `, shundan muddati o‘tgani ${F.som(debt.overdue)}` : ''}. Avval muddati o‘tgan qarz, keyin boshqa qarz, so‘ng jo‘natilmagan buyurtmalar yopiladi.`);
	},
	savePayment() {
		if (!Forms.valid('pay')) return;
		const f = ui.f.pay, only = f.id && Data.order(f.id), c = Data.client(only || f.cid);
		const plan = Calc.allocate(c.id, +f.sum, only);
		plan.parts.forEach(p => { p.o.tolangan += p.som; Data.log(p.o, `To‘lov qabul qilindi: ${F.som(p.som)}`); });
		// ortib qolgan summa yo‘qolmaydi: mijoz avansiga yoziladi va keyingi buyurtmaga o‘tadi
		c.avans = (c.avans || 0) + plan.avans;
		Data.save(); UI.closeModal(); Views.render();
		UI.toast(Views.payPlan(plan), 5000);
	},
	sendStatus(d) {
		const o = Data.order(d.id), r = Calc.plan().res[o.id], manager = session.role === 'menejer' ? Data.user() : db.users.find(u => u.rol === 'menejer');
		const ready = r ? `Tayyor bo‘lish sanasi — ${F.dateLong(r.tayyor)}.` : '';
		const state = {
			yangi: 'qabul qilindi, navbatga qo‘yilmoqda.',
			navbat: `ishlab chiqarish navbatida. ${ready}`,
			ishlab: `ishlab chiqarilmoqda. ${ready}`,
			tayyor: 'tayyor, omborda. Jo‘natish vaqtini kelishib olsak.',
			qisman: `${F.kg(o.jonatKg)} jo‘natildi, qolgani tayyorlanmoqda.`,
			jonatildi: `${o.jonatSana ? F.dateLong(o.jonatSana) : ''} kuni jo‘natildi.`
		}[o.holat];
		ui.f.msg = { text: `Assalomu alaykum! POLYPACK’dan yozyapmiz.\nBuyurtma ${o.id}: ${F.spec(o)}, ${F.kg(o.kg)} — ${state}\nSavol bo‘lsa: ${manager.ism}, ${manager.tel}` };
		UI.modal('Mijozga holatni yuborish', `<textarea class="in" data-f="msg.text" rows="6" aria-label="Telegram uchun xabar">${UI.esc(ui.f.msg.text)}</textarea>`, UI.buttons('Nusxalash', 'copyMessage', 'Yopish'));
	},
	copyMessage() { UI.copy(ui.f.msg.text); UI.closeModal(); },

	/* navbat */
	setLine(d) { ui.line = d.v; Views.render(); },
	moveOrder(d) {
		const o = Data.order(d.id);
		const list = db.orders.filter(x => x.liniya === o.liniya && x.holat === 'navbat' && x.etap === 0 && !x.faol).sort((a, b) => a.tartib - b.tartib);
		const other = list[list.indexOf(o) + (+d.dir)];
		if (!other) return;
		const before = Calc.plan().res;
		[o.tartib, other.tartib] = [other.tartib, o.tartib];
		const after = Calc.plan().res, ids = Object.keys(after);
		Data.save();
		const late = ids.filter(id => after[id].kech > 0 && !before[id].kech), saved = ids.filter(id => !after[id].kech && before[id].kech > 0);
		ui.changed = ids.filter(id => Math.abs(after[id].tayyor - before[id].tayyor) > 60000);
		Views.render();
		UI.toast(late.length ? `${late.join(', ')} endi muddatdan kech qoladi` : saved.length ? `${saved.join(', ')} endi muddatida tayyor bo‘ladi` : 'Sanalar qayta hisoblandi');
	},
	// Material omborda yetmasa, bosqich boshlanmaydi va tugatilmaydi (Calc.materialCheck).
	startStage(d) {
		const o = Data.order(d.id), lid = Calc.stageLine(o), lack = Calc.materialCheck(o);
		const busy = db.orders.find(x => x !== o && x.faol && x.holat === 'ishlab' && Calc.stageLine(x) === lid);
		if (busy) return UI.toast(`${Data.line(lid).nom}da ${busy.id} ishlanmoqda — avval uni tugating`);
		if (lack.length) return UI.toast(`Boshlab bo‘lmaydi. ${F.lack(lack)}`);
		Object.assign(o, { faol: true, done: 0, holat: 'ishlab' });
		Data.log(o, `${Data.line(lid).nom}: boshlandi`);
		Data.save(); Views.render();
		UI.toast(`${o.id}: ${Data.line(lid).nom} boshlandi`);
	},
	finishStage(d) {
		const o = Data.order(d.id), lack = Calc.materialCheck(o);
		if (lack.length) return UI.toast(`Tugatib bo‘lmaydi. ${F.lack(lack)}. Kirim qiling yoki direktorga murojaat qiling`);
		UI.confirm(`${o.id} (${UI.who(o)}) — ${Data.line(Calc.stageLine(o)).nom} bosqichi tugadimi? Sarflangan material ombordan chiqariladi.`, 'Tugatish', () => Steps.completeStage(o));
	},
	// Faqat direktor: omborda material yetmasa ham bosqichni yopadi, farq jurnalga tuzatish bo‘lib yoziladi.
	forceFinish(d) {
		const o = Data.order(d.id), lack = Calc.materialCheck(o);
		if (!o.faol) return;
		UI.confirm(`${o.id}: ${F.lack(lack)}. Bosqich baribir tugatilsinmi? Yetmagan miqdor harakatlar jurnaliga tuzatish bo‘lib yoziladi.`, 'Baribir tugatish', () => {
			Data.log(o, 'Direktor material yetishmasa ham bosqichni tugatishga ruxsat berdi');
			Steps.completeStage(o);
		});
	},

	/* ombor */
	openMove(d) { Steps.moveModal({ tur: d.v, k: 'homo', kg: '', izoh: '' }); },
	receiveKirim() { const k = db.kirim; Steps.moveModal({ tur: 'kirim', k: k.mat, kg: k.kg, izoh: k.kim, fromKirim: true }); },
	saveMove() {
		if (!Forms.valid('mv')) return;
		const f = ui.f.mv, m = Data.mat(f.k), incoming = f.tur === 'kirim';
		m.qoldiq = +(m.qoldiq + (incoming ? +f.kg : -f.kg)).toFixed(2);
		db.moves.unshift({ d: Time.today, k: f.k, tur: f.tur, kg: +f.kg, izoh: f.izoh.trim() });
		if (f.fromKirim && db.kirim && db.kirim.mat === f.k) db.kirim = null;
		Data.save(); UI.closeModal(); Views.render();
		UI.toast(`${incoming ? 'Kirim' : 'Chiqim'} saqlandi · qoldiq ${F.qty(m.qoldiq, m)}`);
	},
	filterRolls(d) { ui.rollFilter.st = d.v; Views.render(); },
	openRoll() {
		const first = Views.rollOrders()[0];
		ui.f.roll = { oid: first ? first.id : '', tur: 'CPP', qal: 30, eni: 1000, brutto: '' };
		ui.modalForm = 'rollForm';
		UI.modal('Rulon kiritish', null, UI.buttons('Saqlash', 'saveRoll', 'Yopish'));
	},
	// Oyna yopilmaydi: omborchi rulonlarni ketma-ket tortib kiritadi.
	saveRoll() {
		if (!Forms.valid('roll')) return;
		const f = ui.f.roll, s = Views.rollSpec(), brutto = +f.brutto, netto = +(brutto - Calc.coreKg(s.eni)).toFixed(1);
		const id = 'R-' + (Math.max(24100, ...db.rolls.map(r => +r.id.slice(2))) + 1);
		if (!Data.takeCore(f.oid && Data.order(f.oid))) return UI.toast('Omborda o‘zak qolmagan — avval kirim qiling');
		db.rolls.push({ id, oid: f.oid || null, ...s, netto, brutto, holat: f.oid ? 'band' : 'bosh', sana: Time.today });
		Data.save();
		f.brutto = '';
		Views.render();
		UI.refresh('mbody');
		$('[data-f="roll.brutto"]').focus();
		UI.toast(`${id} saqlandi · netto ${F.kg(netto, 1)}`);
	},
	selectShipment(d) { ui.shipSel = d.id || null; ui.shipRolls = false; Views.render(); window.scrollTo(0, 0); },
	toggleShipRolls() { ui.shipRolls = true; Views.render(); },
	openPacking(d) {
		UI.modal('Packing list', Views.packing(Data.order(d.id)), `<button class="btn" data-act="closeModal">Yopish</button><button class="btn pri" data-act="printPacking" data-id="${d.id}">Chop etish</button>`, true);
	},
	printPacking(d) { ui.printId = d.id; UI.refresh('print'); window.print(); },
	// Ortiqcha jo‘natish («Jo‘natish farqi» me’yoridan ko‘p) — faqat direktor ruxsati bilan: omborchi so‘rov yuboradi.
	ship(d) {
		const o = Data.order(d.id), f = Views.shipForm(o), rolls = db.rolls.filter(r => f.pick.includes(r.id)), kg = +Calc.sum(rolls, r => r.netto).toFixed(1);
		if (Calc.blocked(o)) return UI.toast('Mijozda muddati o‘tgan qarz bor — direktor ruxsati kerak');
		if (!rolls.length) return;
		const x = Calc.shipCheck(o, kg), partial = x.kind === 'partial', n = db.ships.filter(s => s.oid === o.id).length;
		const extra = `Buyurtmadan ${F.kg(x.extraKg)} ko‘p — mijozga ${F.som(x.extraSom)} qo‘shimcha hisoblanadi.`;
		if (x.permit === 'wait') return UI.toast('So‘rov yuborilgan — direktor ruxsati kutilmoqda');
		if (x.permit === 'ask') {
			const again = o.ruxsatKg ? ` Avvalgi ruxsat ${F.kg(o.ruxsatKg)} gacha edi.` : '';
			return UI.confirm(`${extra}${again} Buning uchun direktor ruxsati kerak. So‘rov yuborilsinmi?`, 'So‘rov yuborish', () => {
				o.sorovKg = x.total;
				Data.log(o, `Omborchi jami ${F.kg(x.total)} (${F.kg(x.extraKg)} ortiqcha) jo‘natishga ruxsat so‘radi`);
				Data.save(); Views.render();
				UI.toast('So‘rov direktorga yuborildi');
			});
		}
		const text = partial ? `${F.kg(o.kg)} dan ${F.kg(x.total)} jo‘natiladi. Buyurtma «${STATUS.qisman.t}» holatiga o‘tadi, qolgan ${F.kg(o.kg - x.total)} keyin jo‘natiladi. Davom etilsinmi?`
			: x.kind === 'over' ? `${extra} Direktor ${F.kg(o.ruxsatKg)} gacha ruxsat bergan. Jo‘natilsinmi?`
			: `${o.id}: ${rolls.length} rulon, ${F.kg(kg)} netto ${UI.who(o)}ga jo‘natilsinmi?`;
		UI.confirm(text, partial ? STATUS.qisman.t : 'Jo‘natildi', () => {
			rolls.forEach(r => { r.holat = 'jonatildi'; });
			Object.assign(o, { holat: partial ? 'qisman' : 'jonatildi', jonatSana: o.jonatSana || Time.today, jonatKg: x.total, sorovKg: null }); // jo‘natilgach javobsiz so‘rov o‘z kuchini yo‘qotadi
			Data.log(o, `${STATUS[o.holat].t}: ${rolls.length} rulon, ${F.kg(kg)}${f.mashina ? ', ' + f.mashina : ''}`);
			db.ships.push({ id: 'J-' + o.id.slice(3) + (n ? '-' + (n + 1) : ''), oid: o.id, d: Time.today, kg, rulon: rolls.length, mashina: f.mashina });
			ui.shipSel = partial ? o.id : null;
			ui.f.ship = null;
			Data.save(); Views.render();
			UI.toast(partial ? `${o.id}: ${F.kg(x.total)} jo‘natildi, ${F.kg(o.kg - x.total)} qoldi` : `${o.id} jo‘natildi`);
		});
	},
	submitShift() {
		if (!Forms.valid('sr')) return;
		const f = ui.f.sr, metal = f.liniya === 'M';
		const same = db.reports.find(r => r.sana === f.sana && r.smena === +f.smena && r.liniya === f.liniya);
		const store = () => {
			db.reports = db.reports.filter(r => r !== same);
			db.reports.push({ sana: f.sana, smena: +f.smena, liniya: f.liniya, soat: +f.soat, parts: Views.shiftParts(f), ishlab: +f.ishlab, chiqindi: +f.chiqindi || 0, granula: metal ? 0 : +f.granula, alu: metal ? +f.alu : 0, m0: +f.m0, m1: +f.m1, kwh: f.m1 - f.m0, izoh: f.izoh.trim() });
			Data.save();
			ui.f.sr = Views.emptyShift({ sana: f.sana, smena: f.smena, liniya: f.liniya, m0: +f.m1 });
			Views.render();
			UI.toast('Hisobot saqlandi');
		};
		if (same) UI.confirm(`${F.dateLong(f.sana)}, ${f.smena}-smena, ${Data.line(f.liniya).nom} uchun hisobot bor. Almashtirilsinmi?`, 'Almashtirish', store);
		else store();
	},

	/* kalkulyatsiya, qarzlar, sozlamalar */
	setCalcTab(d) {
		ui.calcTab = d.v;
		ui.normBase = d.v === 'norms' ? { CPP: Calc.cost('CPP').perKg, MCPP: Calc.cost('MCPP').perKg } : null;
		Views.render();
	},
	// CPP/MCPP — Tannarx, Reja va haqiqiy, Buyurtma hisobi uchun umumiy tanlov
	setCalcType(d) {
		const f = ui.f.oc;
		if (f) { if (+f.narx === Calc.listPrice(ui.calcTur)) f.narx = Calc.listPrice(d.v); f.oid = ''; }
		ui.calcTur = d.v;
		Views.render();
	},
	// t — me’yor maydoni. Forma qayta chizilmaydi (kursor joyida qoladi), natija yonidagi bo‘laklarda yangilanadi.
	editNorm(t) {
		const k = t.dataset.norm, v = +t.value;
		const bad = t.value === '' || !isFinite(v) || v < 0 || (NORMS_NONZERO.includes(k) && v === 0) || (NORMS_PERCENT.includes(k) && v >= PERCENT_MAX) || (k === 'regranulyat' && v > 100);
		t.toggleAttribute('aria-invalid', bad);
		if (bad) return;
		db.norms[k] = v;
		Data.logNorm(k);
		Data.save();
		UI.refresh('calc-sum', 'calc-live', 'recipe-note');
	},
	resetNorms() {
		UI.confirm('Me’yorlar boshlang‘ich qiymatlarga qaytarilsinmi?', 'Qaytarish', () => { db.norms = { ...NORMS_DEFAULT }; Data.logNorm('*'); Data.save(); Views.render(); UI.toast('Me’yorlar qaytarildi'); });
	},
	// jadval sarlavhasidan (d.k) yoki telefondagi ro‘yxatdan (d.v)
	sortBy(d) { const s = ui.debtSort, k = d.k || d.v; ui.debtSort = { k, dir: d.k && s.k === k ? -s.dir : k === 'nom' ? 1 : -1 }; Views.render(); },
	exportCSV(d) {
		const [name, rows] = Data.exportTable(d.v);
		UI.download(`polypack_${name}_${Time.today}.csv`, UI.csv(rows));
		UI.toast('Fayl yuklab olindi');
	},
	importTemplate() {
		UI.download('polypack_import_namuna.csv', UI.csv([
			['Mijoz', 'Turi', 'Qalinlik (mkm)', 'Eni (mm)', 'Miqdor (kg)', 'Muddat', 'Narx (so‘m/kg)'],
			['Baraka Makaron', 'CPP', 30, 1000, 4000, F.dots(Time.add(14)), 24500],
			['Sharq Laminat', 'MCPP', 25, 800, 3000, F.dots(Time.add(18)), 31000]
		]));
	},
	chooseFile() { $('[data-import]').click(); },
	applyImport() {
		const rows = ui.imp.rows.filter(r => !r.err);
		ui.imported = rows.map(({ v }) => {
			const o = Data.newOrder({ cid: v.cid, tur: v.tur, qal: v.qal, eni: v.eni, kg: v.kg, muddat: v.muddat, narx: v.narx || Calc.suggestPrice(v.cid, v.tur, v.qal).narx, tarix: [{ d: Time.today, m: 'Excel’dan yuklandi' }] });
			Data.applyAdvance(o);
			db.orders.push(o);
			return o.id;
		});
		ui.imp = null;
		Data.save(); Views.render();
		UI.toast(`${rows.length} ta buyurtma qo‘shildi`);
	},
	// Importdan keyin: qarzi yo‘q mijozlarning yangi buyurtmalari bir yo‘la navbatga qo‘yiladi.
	queueImported() {
		const list = ui.imported.map(Data.order).filter(o => o.holat === 'yangi' && !Calc.blocked(o));
		list.forEach(Steps.enqueue);
		ui.imported = null;
		Data.save(); Views.render();
		UI.toast(`${list.length} ta buyurtma navbatga qo‘yildi`);
	},
	cancelImport() { ui.imp = ui.imported = null; Views.render(); },
	resetData() {
		UI.confirm('Barcha o‘zgarishlar o‘chib, namuna ma’lumotlari qaytadi. Davom etilsinmi?', 'Tiklash', () => {
			Data.seed();
			Object.assign(ui, { f: {}, imp: null, imported: null, drawer: null, shipSel: null, chartDay: null });
			Views.render();
			UI.toast('Namuna ma’lumotlari tiklandi');
		});
	},
	// d.v — xodim tartib raqami; −1 bo‘lsa, yangi xodim qo‘shiladi, aks holda faqat PIN almashtiriladi.
	openUser(d) {
		const i = +d.v, u = db.users[i];
		ui.f.user = u ? { i, ism: u.ism, pin: '' } : { i, ism: '', rol: 'menejer', tel: '', pin: '' };
		const pin = UI.field(u ? 'Yangi PIN' : 'PIN', UI.input('user.pin', `type="password" inputmode="numeric" maxlength="4" autocomplete="off"${u ? ' autofocus' : ''}`), { key: 'user.pin', hint: '4 ta raqam' });
		UI.modal(u ? `PIN ni almashtirish · ${UI.esc(u.ism)}` : 'Xodim qo‘shish', u ? pin
			: `<div class="grid2">${UI.field('Ism', UI.input('user.ism', 'autofocus'), { cls: 'full', key: 'user.ism' })}${UI.field('Rol', UI.select('user.rol', Object.entries(ROLES).map(([k, r]) => [k, r.nom])))}${UI.field('Telefon', UI.input('user.tel', 'type="tel"'))}${pin}</div>`, UI.buttons('Saqlash', 'saveUser'));
	},
	saveUser() {
		if (!Forms.valid('user')) return;
		const f = ui.f.user, u = db.users[f.i];
		if (u) u.pin = f.pin;
		else db.users.push({ ism: f.ism.trim(), rol: f.rol, tel: f.tel.trim(), pin: f.pin });
		Data.save(); UI.closeModal(); Views.render();
		UI.toast(u ? 'PIN almashtirildi' : 'Xodim qo‘shildi');
	}
};

const Fields = {
	// Forma maydoni o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) —
	// faqat shu maydonga bog‘liq bo‘lak yangilanadi.
	live: {
		no(k) {
			const f = ui.f.no;
			if (k === 'narx') f.manual = true;
			else if (!f.manual && (k === 'cid' || k === 'qal')) { f.narx = Calc.suggestPrice(f.cid, f.tur, +f.qal).narx; $('[data-f="no.narx"]').value = f.narx; }
			UI.refresh('price-hint', 'check');
		},
		sr(k) {
			if (k === 'liniya') ui.f.sr.m0 = Calc.lastMeter(ui.f.sr.liniya);
			if (k === 'liniya' || k === 'sana') UI.refresh('shift-form'); // shu liniya va kunda ishlangan buyurtmalar o‘zgaradi
			UI.refresh('shift-check', 'shift-rest');
			if (k === 'ishlab' || k.startsWith('kg_')) Forms.show('sr.parts');
		},
		oc(k) {
			const f = ui.f.oc, o = k === 'oid' && Data.order(f.oid);
			if (!o) return UI.refresh('order-result');
			Object.assign(f, { kg: o.kg, narx: o.narx });
			ui.calcTur = o.tur;
			Views.render();
		},
		roll(k) {
			UI.refresh(k === 'oid' || k === 'tur' ? 'mbody' : 'roll-net');
		},
		mv(k) { if (k === 'k') UI.refresh('mbody'); },
		pay() { UI.refresh('pay-plan'); }
	},

	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file';
		if (e.type !== (discrete ? 'change' : 'input')) return;
		const changed = key => { const [form, k] = key.split('.'); Forms.show(key); if (Fields.live[form]) Fields.live[form](k); };

		if (t.id === 'pin') {
			$('#pinerr').textContent = '';
			if (t.value.length === 4) Actions.login();
		} else if (data.f) {
			const [form, k] = data.f.split('.');
			ui.f[form][k] = 'num' in data && t.value !== '' ? +t.value : t.value;
			changed(data.f);
		} else if (data.part) {
			// sana: kun oyga sig‘masa, oyning oxirgi kuniga tushiriladi
			const box = t.closest('[data-date]'), [form, k] = box.dataset.date.split('.');
			const part = p => +$(`[data-part=${p}]`, box).value;
			const y = part('y'), m = part('m'), d = Math.min(part('d'), new Date(y, m, 0).getDate());
			$('[data-part=d]', box).value = d;
			ui.f[form][k] = `${y}-${Time.p2(m)}-${Time.p2(d)}`;
			changed(box.dataset.date);
		} else if (data.norm) {
			Actions.editNorm(t);
		} else if (data.filter) {
			Actions[data.filter]({ v: t.value });
		} else if (data.search) {
			ui[data.search].q = t.value;
			UI.refresh('list');
		} else if (data.roll || 'rollAll' in data) {
			const f = ui.f.ship;
			f.pick = !data.roll ? (t.checked ? Views.readyRolls(f.oid).map(r => r.id) : [])
				: t.checked ? f.pick.concat(data.roll) : f.pick.filter(x => x !== data.roll);
			Views.render();
		} else if ('import' in data && t.files[0]) {
			const reader = new FileReader();
			reader.onload = () => { ui.imp = Data.parseCSV(String(reader.result)) || { bad: true }; UI.refresh('import'); };
			reader.readAsText(t.files[0], 'utf-8');
		}
	}
};

// Har amal ruxsat jadvalidan o‘tadi (qarang: CAN): tugma yashirilgani yetarli emas.
// Jadvalda umuman yo‘q amal bajarilmaydi; ishlab chiqish paytida bu haqda konsolga yoziladi.
const deny = name => {
	if ([...GUEST_ACTIONS, ...OPEN_ACTIONS, ...Object.values(CAN).flat()].includes(name)) UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
	else if (['localhost', '127.0.0.1'].includes(location.hostname)) console.debug('Jadvalda yo‘q amal:', name);
};
Object.keys(Actions).forEach(name => {
	const run = Actions[name];
	Actions[name] = d => can(name) ? run(d) : deny(name);
});

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (can(name) && Actions[name]) Actions[name](el.dataset);
	else deny(name);
});
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { pin: Actions.login, newOrder: Actions.submitOrder, shift: Actions.submitShift }[e.target.dataset.form];
	if (!submit) return;
	e.preventDefault();
	submit();
});
document.addEventListener('keydown', e => {
	if (e.key === 'Escape') {
		if ($('#modal').innerHTML) UI.closeModal();
		else if (ui.drawer) Actions.closeDrawer();
		else if (ui.menu) Actions.toggleMenu();
	} else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) {
		e.preventDefault();
		e.target.click();
	}
});
matchMedia('(max-width:820px)').addEventListener('change', () => { if (session.role) Views.render(); });
window.addEventListener('afterprint', () => { ui.printId = null; UI.refresh('print'); });
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; Views.render(); }));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; });

/* ===== 7. Ishga tushirish ===== */

Data.load();
Views.render();

// Service worker faqat http(s) da ishlaydi; file:// dan ochilganda ro‘yxatdan o‘tkazilmaydi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
}
</script>
