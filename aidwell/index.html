<title>AIDWELL TEX — boshqaruv tizimi (namuna)</title>

/* Shrift: Golos Text (SIL OFL 1.1), fonts\ papkasidan; kirill bo'laklari faqat kirill yozuvida yuklanadi. */
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-ext-wght-normal.woff2) format("woff2");unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
:root{
	--blue:#0b6b63;--blue2:#08544e;--bluet:#e0f2ef;--sky:#58c2b4;
	--night:#0c2b2e;--night2:#123f41;--ink:#14292b;--tx2:#445a5c;--muted:#5a7173;
	--bg:#f2f7f6;--card:#fff;--line:#d7e5e3;--line2:#e7f0ee;
	--grn:#17764a;--grnt:#e2f3ea;--amb:#925600;--ambt:#fcf1dc;--red:#b3261e;--redt:#fbe9e7;--vio:#5b3ea6;--viot:#eee9fa;
	--r:10px;--r2:14px;--sh:0 1px 2px rgba(12,43,46,.06),0 1px 1px rgba(12,43,46,.04);--elev:0 12px 32px rgba(12,43,46,.22);
	--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
	--yon:236px;--tepa:52px;--past:62px;--nam:26px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}

/* Namuna tasmasi */
.namuna{position:fixed;top:0;left:0;right:0;height:var(--nam);z-index:60;background:var(--ambt);color:var(--amb);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid #f0dcb4;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Kirish */
.kirish{min-height:100vh;padding:calc(var(--nam) + 28px) 16px 32px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--night) 0,var(--night2) 300px,var(--bg) 300px)}
.kirish .belgi{color:#fff;text-align:center;margin-bottom:22px}
.belgi b{display:block;font-size:26px;font-weight:800;letter-spacing:.02em}
.belgi span{display:block;color:#bfe6df;font-size:14px;margin-top:2px}
.kirish .quti{width:100%;max-width:460px;background:var(--card);border-radius:var(--r2);box-shadow:var(--elev);padding:22px 20px}
.kirish h1{font-size:19px;font-weight:700;margin-bottom:4px}
.kirish .izoh{color:var(--muted);font-size:14px;margin-bottom:16px}
.rollar{display:grid;gap:10px}
.rol{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px}
.rol:hover{border-color:var(--blue);background:#f6fbfa}
.rol .dum{width:42px;height:42px;border-radius:10px;background:var(--bluet);color:var(--blue);display:grid;place-items:center;flex:none}
.rol .n{font-weight:650;display:block}
.rol .d{color:var(--muted);font-size:13px;display:block}
.rol .pin-t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.pinq{display:grid;gap:12px}
.pinq input{font-size:26px;letter-spacing:.5em;text-align:center;padding:10px 8px 10px calc(8px + .5em);height:56px}
.xato{color:var(--red);font-size:13.5px;min-height:20px}
.kirish .ost{margin-top:18px;text-align:center;color:var(--muted);font-size:13px;max-width:460px}
.til{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin:0 auto 18px}
.til button{background:transparent;border:0;color:#cfe9e4;padding:7px 14px;font-size:13.5px;font-weight:600;min-height:36px}
.til button[aria-pressed=true]{background:#fff;color:var(--night)}

/* Qobiq */
.yon{position:fixed;top:var(--nam);left:0;bottom:0;width:var(--yon);background:var(--night);color:#cfe3e0;display:flex;flex-direction:column;padding:16px 12px;z-index:40}
.yon .belgi{text-align:left;padding:4px 8px 16px}
.yon .belgi b{font-size:19px;color:#fff}
.yon .belgi span{font-size:12.5px}
.yon nav{display:grid;gap:2px}
.yon nav a{display:flex;align-items:center;gap:11px;color:#cfe3e0;padding:10px 10px;border-radius:8px;font-weight:550;font-size:14.5px}
.yon nav a:hover{background:rgba(255,255,255,.07);text-decoration:none}
.yon nav a[aria-current=page]{background:var(--blue);color:#fff}
.yon nav a .son{margin-left:auto;background:#fff;color:var(--night);border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.yon .oxir{margin-top:auto;display:grid;gap:10px;padding:8px}
.yon .kim{font-size:13.5px;line-height:1.3}
.yon .kim b{display:block;color:#fff;font-size:14.5px}
.yon .til{margin:0;justify-self:start}
.yon .chiq{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#cfe3e0;border-radius:8px;padding:8px 10px;font-size:14px}
.tepa,.past{display:none}
.sahifa{margin-left:var(--yon);padding:calc(var(--nam) + 22px) 28px 48px;max-width:1280px}
.bosh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bosh h1{font-size:24px;font-weight:750;line-height:1.2}
.bosh .ost{color:var(--muted);font-size:14px;margin-top:2px}
.bosh .ong{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.orqa{display:inline-flex;align-items:center;gap:4px;font-size:14px;margin-bottom:10px;min-height:32px}

/* Tugma */
.t{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap}
.t:hover{border-color:#b3cdc9;text-decoration:none}
.t.a{background:var(--blue);border-color:var(--blue);color:#fff}
.t.a:hover{background:var(--blue2)}
.t.x{color:var(--red)}
.t.k{min-height:34px;padding:5px 10px;font-size:13.5px}
.t.keng{width:100%;min-height:48px;font-size:16px}
.t[disabled]{opacity:.5;cursor:not-allowed}
.hav{background:none;border:0;padding:0;color:var(--blue);font-weight:600}

/* Karta */
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.k>h2,.k>.kb h2{font-size:16px;font-weight:700}
.kb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kb .ong{margin-left:auto;display:flex;gap:8px;align-items:center}
.kb .ost{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.qator2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.qator2>.k{margin-bottom:0}
.qator2{margin-bottom:16px}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:14px 16px;display:block;color:inherit}
a.kp:hover{border-color:var(--blue);text-decoration:none}
.kp .y{color:var(--muted);font-size:13px;font-weight:550}
.kp .q{font-size:25px;font-weight:750;line-height:1.2;margin-top:4px;white-space:nowrap}
.kp .q small{font-size:14px;font-weight:600;color:var(--tx2)}
.kp .p{font-size:13px;color:var(--tx2);margin-top:4px}
.kp .p.yom{color:var(--red);font-weight:600}
.kp .p.yax{color:var(--grn);font-weight:600}

/* Belgi (badge) */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;background:var(--line2);color:var(--tx2);white-space:nowrap}
.b.ko{background:var(--bluet);color:var(--blue)}
.b.ya{background:var(--grnt);color:var(--grn)}
.b.sa{background:var(--ambt);color:var(--amb)}
.b.qi{background:var(--redt);color:var(--red)}
.b.bi{background:var(--viot);color:var(--vio)}

/* E'tibor ro'yxati */
.et{display:grid}
.et a{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line2);color:inherit}
.et a:first-child{border-top:0}
.et a:hover{text-decoration:none;background:#f6fbfa}
.et .nuq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ambt);color:var(--amb)}
.et .nuq.qi{background:var(--redt);color:var(--red)}
.et .nuq.ko{background:var(--bluet);color:var(--blue)}
.et .nuq svg{width:17px;height:17px}
.et b{display:block;font-weight:650;font-size:14.5px}
.et span{color:var(--tx2);font-size:13.5px}
.et .uq{margin-left:auto;color:var(--muted);align-self:center}

/* Jadval */
.jw{overflow-x:auto;margin:0 -4px}
table.j{width:100%;border-collapse:collapse;font-size:14px}
.j th{font-size:12.5px;font-weight:650;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.j td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.j tr:last-child td{border-bottom:0}
.j .r{text-align:right;white-space:nowrap}
.j .kich{color:var(--muted);font-size:13px;display:block}
.j td b{font-weight:650}
.j tr.bos{cursor:pointer}
.j tr.bos:hover td{background:#f6fbfa}
.j tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.bosh-yoq{color:var(--muted);padding:18px 4px;text-align:center;font-size:14px}

/* Yorliqlar (tabs) */
.yor{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.yor::-webkit-scrollbar{display:none}
.yor a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;min-height:38px;font-weight:600;font-size:14px;color:var(--tx2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.yor a:hover{text-decoration:none;border-color:#b3cdc9}
.yor a[aria-current=true]{background:var(--night);border-color:var(--night);color:#fff}
.yor .son{background:var(--line2);color:var(--tx2);border-radius:999px;font-size:12px;padding:0 6px;font-weight:700}
.yor a[aria-current=true] .son{background:rgba(255,255,255,.2);color:#fff}
.yor .son.qi{background:var(--red);color:#fff}

/* Ro'yxat kartalari */
.ry{display:grid;gap:10px}
.el{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:inherit;box-shadow:var(--sh)}
a.el:hover{border-color:var(--blue);text-decoration:none}
.el .ust{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.el .id{font-weight:700;font-size:13.5px;color:var(--muted)}
.el .nom{font-weight:650;font-size:15.5px}
.el .mat{color:var(--tx2);font-size:14px;margin-top:2px}
.el .pas{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--tx2);align-items:center}
.el .pas .ong{margin-left:auto;font-weight:700;color:var(--ink);font-size:15px}
.el.shosh{border-left:4px solid var(--red)}
.el .amal{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.izl{position:relative;margin-bottom:14px;max-width:420px}
.izl input{width:100%;padding-left:38px}
.izl svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Maydon */
.in,select.in,textarea.in{width:100%;border:1px solid #bfd2cf;background:#fff;border-radius:9px;padding:9px 11px;min-height:42px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--blue);outline:3px solid var(--bluet)}
.may{display:grid;gap:5px;margin-bottom:12px}
.may>span{font-size:13.5px;font-weight:600;color:var(--tx2)}
.may2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yord{font-size:13px;color:var(--muted)}
.tan{display:flex;align-items:center;gap:8px;min-height:40px}
.tan input{width:20px;height:20px}

/* Bosqichlar */
.qadam{display:flex;gap:4px;margin:4px 0 2px;overflow-x:auto}
.qadam span{flex:1;min-width:86px;text-align:center;font-size:12.5px;font-weight:650;padding:7px 6px;background:var(--line2);color:var(--muted);border-radius:6px;white-space:nowrap}
.qadam span.ot{background:var(--grnt);color:var(--grn)}
.qadam span.hoz{background:var(--blue);color:#fff}

/* Ta'rif ro'yxati */
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.tr div>span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.tr div>b{font-weight:600;font-size:15px}
.jami{display:grid;gap:6px;max-width:340px;margin-left:auto;margin-top:12px;font-size:14.5px}
.jami div{display:flex;justify-content:space-between;gap:16px}
.jami .kat{font-weight:750;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.eslat{background:var(--ambt);color:#6b4000;border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.eslat.qi{background:var(--redt);color:#7d1a14}
.eslat.ko{background:var(--bluet);color:var(--blue2)}
.eslat svg{margin-top:1px}
.tarix{display:grid;gap:8px;font-size:13.5px;color:var(--tx2)}
.tarix div{display:flex;gap:10px}
.tarix time{color:var(--muted);white-space:nowrap;min-width:78px}

/* Chiziqlar */
.grafik{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.grafik .oy{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.grafik .juft{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.grafik .juft i{display:block;width:42%;max-width:26px;border-radius:5px 5px 0 0;background:var(--blue);min-height:2px}
.grafik .juft i.x{background:#a9c9c4}
.grafik .oy span{font-size:12px;color:var(--muted);white-space:nowrap}
.grafik .oy.hoz span{color:var(--ink);font-weight:700}
.afs{display:flex;gap:16px;font-size:13px;color:var(--tx2);margin-top:10px;flex-wrap:wrap}
.afs i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin-right:6px}
.afs i.x{background:#a9c9c4}
.gor{display:grid;gap:10px}
.gor .q{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.gor .yol{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.gor .yol i{display:block;height:100%;background:var(--blue);border-radius:999px}
.gor .yol i.qi{background:var(--red)}.gor .yol i.sa{background:#d9951c}.gor .yol i.ya{background:var(--grn)}
.gor .q b{white-space:nowrap;font-weight:650}
.qold{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qold .yol{width:56px;height:6px;background:var(--line2);border-radius:999px;overflow:hidden}
.qold .yol i{display:block;height:100%;background:var(--grn)}
.qold.kam .yol i{background:#d9951c}.qold.yoq .yol i{background:var(--red)}
.qold.kam b,.qold.yoq b{color:var(--red)}

/* Oyna */
.parda{position:fixed;inset:0;background:rgba(12,43,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.oyna{background:#fff;border-radius:var(--r2);box-shadow:var(--elev);width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.oyna header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.oyna header h2{font-size:17px;font-weight:700}
.oyna header button{margin-left:auto;background:none;border:0;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.oyna .ich{padding:16px 18px;overflow-y:auto}
.oyna footer{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xabar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:550;z-index:90;box-shadow:var(--elev);max-width:calc(100vw - 32px);text-align:center}
.pastki{color:var(--muted);font-size:13px;margin-top:26px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}

.usta-sal{background:var(--night);color:#fff;border-radius:var(--r2);padding:16px 18px;margin-bottom:16px}
.usta-sal b{font-size:19px;display:block}
.usta-sal span{color:#bfe6df;font-size:14px}
.yuk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.yuk div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.yuk b{display:block;font-weight:650}
.yuk span{font-size:13px;color:var(--tx2)}

@media (max-width:1100px){.kpi{grid-template-columns:repeat(2,1fr)}.qator2{grid-template-columns:1fr}}
@media (max-width:899px){
	.yon{display:none}
	.tepa{display:flex;position:fixed;top:var(--nam);left:0;right:0;height:var(--tepa);background:var(--night);color:#fff;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:40}
	.tepa b{font-size:16px;font-weight:750;white-space:nowrap}
	.tepa .rolb{font-size:12.5px;color:#bfe6df;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
	.tepa .ong{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
	.tepa .tilb{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;font-size:12.5px;font-weight:650;padding:0 10px;height:32px;white-space:nowrap}
	.tepa .chiq{background:none;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center}

<script>
(() => {
'use strict';
/* ===== yozuv.js ===== */
/* Yozuv: lotin <-> kirill (o'zbekcha). Manba matnlar lotinda, oddiy ' bilan yoziladi.
   Yozuv.kir(s)  — lotin -> kirill;  Yozuv.lot(s) — tipografik lotin (o‘, g‘, ’);
   Yozuv.qid(s)  — qidiruv uchun bir xil ko'rinish (kirill ham lotinga keltiriladi);
   Yozuv.dom(el, til) — tugun ichidagi matn va yorliqlarni tanlangan yozuvga o'tkazadi. */
const Yozuv = (() => {
	// O'zgarmaydigan nomlar (brend, fayl turi)
	const SAQLA = new Set(['AIDWELL', 'TEX', 'Excel', 'CSV']);
	// Yumshatish belgili o'zlashma so'zlar: [lotin o'zak, kirill o'zak, so'z aynan shu bo'lsa qo'shiladigan oxiri]
	const OZAK = [
		['panel', 'панель', ''], ['rol', 'роль', ''], ['filtr', 'фильтр', ''],
		['sentabr', 'сентябр', 'ь'], ['oktabr', 'октябр', 'ь'],
		['noyabr', 'ноябр', 'ь'], ['dekabr', 'декабр', 'ь'], ['fevral', 'феврал', 'ь'], ['aprel', 'апрел', 'ь'],
		['iyun', 'июн', 'ь'], ['iyul', 'июл', 'ь'], ['yanvar', 'январ', 'ь'],
	];
	const BIR = { a: 'а', b: 'б', d: 'д', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ', r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з' };
	const UNLI = 'aeiouAEIOU';
	const TIRNOQ = "'‘’ʻʼ`";
	const tq = c => c !== undefined && c !== '' && TIRNOQ.includes(c);
	const katta = c => c !== c.toLowerCase();
	const kat = (s, asl) => katta(asl) ? s.charAt(0).toUpperCase() + s.slice(1) : s;

	function soz(w) {
		const kich = w.toLowerCase().replace(/[‘’ʻʼ`]/g, "'");
		for (const [l, k, oxir] of OZAK) {
			if (kich.startsWith(l)) {
				const qol = w.slice(l.length);
				const bosh = kat(k, w[0]);
				return qol ? bosh + harf(qol, true) : bosh + oxir;
			}
		}
		return harf(w, false);
	}
	// ichkari=true: so'z o'rtasidan davom (boshidagi «e» qoidasi ishlamaydi)
	function harf(w, ichkari) {
		let out = '';
		for (let i = 0; i < w.length; i++) {
			const c = w[i], n = w[i + 1], n2 = w[i + 2], cl = c.toLowerCase(), nl = n ? n.toLowerCase() : '';
			const oldin = i > 0 ? w[i - 1] : (ichkari ? 'x' : '');
			if ((cl === 'o' || cl === 'g') && tq(n)) { out += kat(cl === 'o' ? 'ў' : 'ғ', c); i++; continue; }
			if (cl === 's' && nl === 'h') { out += kat('ш', c); i++; continue; }
			if (cl === 'c' && nl === 'h') { out += kat('ч', c); i++; continue; }
			if (cl === 'y' && nl === 'o' && !tq(n2)) { out += kat('ё', c); i++; continue; }
			if (cl === 'y' && nl === 'u') { out += kat('ю', c); i++; continue; }
			if (cl === 'y' && nl === 'a') { out += kat('я', c); i++; continue; }
			if (cl === 'y' && nl === 'e') { out += kat('е', c); i++; continue; }
			if (cl === 'e') { out += kat(oldin === '' || UNLI.includes(oldin) ? 'э' : 'е', c); continue; }
			if (tq(c)) { out += 'ъ'; continue; }
			if (BIR[cl]) { out += kat(BIR[cl], c); continue; }
			out += c;
		}
		return out;
	}
	const TOKEN = /[A-Za-z0-9'‘’ʻʼ`]+(?:-[A-Za-z0-9'‘’ʻʼ`]+)*/g;
	// Kod va model nomlari (raqam + katta harf: TY2-PK, S-1042) o'zgarmaydi
	const kodmi = t => /\d/.test(t) && /[A-Z]/.test(t);

	function kir(s) {
		if (!s || !/[A-Za-z]/.test(s)) return s;
		return s.replace(TOKEN, t => {
			if (SAQLA.has(t) || kodmi(t)) return t;
			return t.split('-').map(b => (SAQLA.has(b) ? b : soz(b))).join('-');
		});
	}
	function lot(s) {
		if (!s || s.indexOf("'") < 0) return s;
		return s.replace(/([oOgG])'/g, '$1‘').replace(/'/g, '’');
	}
	const QAYTA = { 'ў': "o'", 'ғ': "g'", 'ш': 'sh', 'ч': 'ch', 'ё': 'yo', 'ю': 'yu', 'я': 'ya', 'э': 'e', 'е': 'e', 'ҳ': 'h', 'қ': 'q', 'х': 'x', 'ж': 'j', 'й': 'y', 'ц': 'ts', 'ъ': '', 'ь': '', 'ы': 'i', 'щ': 'sh' };
	const TESK = {}; for (const k in BIR) TESK[BIR[k]] = k;
	function qid(s) {
		return String(s || '').toLowerCase().replace(/[Ѐ-ӿ]/g, c => QAYTA[c] !== undefined ? QAYTA[c] : (TESK[c] || c)).replace(/['‘’ʻʼ`]/g, '');
	}
	const ATTR = ['placeholder', 'aria-label', 'title', 'data-y'];
	function dom(el, til) {
		if (!el || typeof document === 'undefined') return;
		const f = til === 'kir' ? kir : lot;
		const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
			acceptNode: n => (n.parentElement && n.parentElement.closest('[data-asl],script,style,textarea')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
		});
		const tugun = []; while (w.nextNode()) tugun.push(w.currentNode);
		for (const n of tugun) { const y = f(n.nodeValue); if (y !== n.nodeValue) n.nodeValue = y; }
		const sel = ATTR.map(a => '[' + a + ']').join(',');
		const els = [...el.querySelectorAll(sel)]; if (el.matches && el.matches(sel)) els.push(el);
		for (const e of els) { if (e.closest('[data-asl]')) continue; for (const a of ATTR) { const v = e.getAttribute(a); if (v) { const y = f(v); if (y !== v) e.setAttribute(a, y); } } }
	}
	return { kir, lot, qid, dom };
})();

		yorliq('#/mijozlar', tab, [['', 'Hammasi', hammasi.length], ['kech', 'Muddati o\'tgan', kech.length, true], ['eslat', 'Eslatish kerak', es.length, true]]) + izlash('Mijoz nomi, turi yoki shahar') +
		`<div class="k" data-ry>${r.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Mijoz</th><th class="r">Jo'natilgan</th><th class="r">To'langan</th><th class="r">Qolgan</th><th class="r">Muddati o'tgan</th><th>Holat</th><th></th></tr></thead><tbody>${r.map(qator).join('')}</tbody></table></div>` : bosh_yoq(tab === 'eslat' ? 'Eslatish kerak bo\'lgan mijoz yo\'q.' : 'Mijoz yo\'q.')}</div>`;
}
function vMijoz(id) {

	const bs = db.buyurtmalar.filter(b => b.mijoz === id && (b.holat === 'yangi' || b.holat === 'tasdiq'));
	const jHolat = q => q.qol < 1 ? '<span class="b ya">To\'langan</span>' : q.farq < 0 ? `<span class="b qi">${-q.farq} kun o'tgan</span>` : q.farq === 0 ? '<span class="b sa">Muddati bugun</span>' : `<span class="b">${q.farq} kun qoldi</span>`;
	let ogoh = '';

	else if (h.kech >= 1) ogoh += `<div class="eslat">${ik('soat')}<div>Muddati o'tgan to'lov: <b>${pul(h.kech)}</b>, ${h.kun} kun. ${esc(e.matn)}.</div></div>`;

	return orqa('#/mijozlar', 'Mijozlar') + boshq(esc(c.nom), `${esc(c.tur)} · ${esc(c.joy)}`, `<button class="t" type="button" data-a="yangiBuyurtma" data-c="${c.id}">${ik('qosh')}Buyurtma</button><button class="t" type="button" data-a="eslatma" data-c="${c.id}">${ik('eslat')}Eslatma</button><button class="t a" type="button" data-a="tolov" data-c="${c.id}">${ik('moliya')}To'lov qabul qilish</button>`) + ogoh +
		`<div class="kpi">${kpiPul('Jo\'natilgan', h.jon, `${h.q.length} ta jo'natma`)}${kpiPul('To\'langan', h.tol, h.avans >= 1 ? `Shundan oldindan: ${qisqaPul(h.avans)}` : `${tl.length} ta to'lov`)}${kpiPul('Qolgan', h.qol, h.keyingi ? `Keyingi muddat: ${sana(h.keyingi.j.muddat)}` : (h.qol >= 1 ? '' : 'To\'lanmagan summa yo\'q'), h.qol >= 1 ? '' : 'yax')}${kpiPul('Muddati o\'tgan', h.kech, h.kech >= 1 ? `${h.kun} kundan beri` : 'Yo\'q', h.kech >= 1 ? 'yom' : 'yax')}</div>
<div class="k"><div class="kb"><h2>Ma'lumot</h2>${rahbar ? `<div class="ong"><button class="t k" type="button" data-a="shart" data-c="${c.id}">Shartlarni o'zgartirish</button></div>` : ''}</div><div class="tr"><div><span>Mas'ul shaxs</span><b>${esc(c.masul)}</b></div><div><span>Telefon</span><b data-asl>${esc(c.tel)}</b></div><div><span>Menejer</span><b>${esc(ism(c.menejer))}</b></div><div><span>To'lov sharti</span><b>${c.muddat ? `${c.muddat} kun muddat` : 'Oldindan to\'lov'}</b></div><div><span>Limit</span><b>${c.limit ? qisqaPul(c.limit) : 'Belgilanmagan'}</b></div></div></div>
<div class="k"><div class="kb"><h2>Jo'natmalar va to'lov muddati</h2><div class="ong"><button class="t k" type="button" data-a="csv" data-h="akt:${c.id}">${ik('tush')}<span>Solishtirma dalolatnoma</span></button></div></div>${h.q.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Hujjat</th><th class="r">Summa</th><th class="r">To'langan</th><th class="r">Qolgan</th><th>To'lov muddati</th><th>Holat</th></tr></thead><tbody>${h.q.slice().reverse().map(q => `<tr><td><b>${sana(q.j.sana)}</b></td><td data-y="Hujjat"><a href="#/buyurtma/${q.j.b}">${q.j.id}</a></td><td class="r" data-y="Summa">${pul(q.summa)}</td><td class="r" data-y="To'langan">${pul(q.tolandi)}</td><td class="r" data-y="Qolgan"><b>${pul(q.qol)}</b></td><td data-y="To'lov muddati">${sana(q.j.muddat)}</td><td data-y="Holat">${jHolat(q)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Jami</td><td class="r" data-y="Summa">${pul(h.jon)}</td><td class="r" data-y="To'langan">${pul(h.tol - h.avans)}</td><td class="r" data-y="Qolgan">${pul(h.qol)}</td><td colspan="2"></td></tr></tfoot></table></div>` : bosh_yoq('Hali jo\'natma bo\'lmagan.')}</div>
<div class="qator2"><div class="k"><div class="kb"><h2>Kelgan to'lovlar</h2></div>${tl.length ? `<div class="jw"><table class="j"><thead><tr><th>Sana</th><th>Usul</th><th class="r">Summa</th></tr></thead><tbody>${tl.map(t => `<tr><td><b>${sana(t.sana)}</b></td><td>${esc(t.usul)}</td><td class="r"><b>${pul(t.summa)}</b></td></tr>`).join('')}</tbody></table></div>` : bosh_yoq('To\'lov kelmagan.')}</div>
<div class="k"><div class="kb"><h2>Eslatmalar tarixi</h2></div>${es.length ? `<div class="tarix">${es.map(x => `<div><time>${sana(x.sana)}</time><span><b>${esc(x.usul)}</b> · ${esc(ism(x.kim))}: ${esc(x.matn)}${x.vada ? ` <span class="b ${kunFarq(x.vada) < 0 ? 'qi' : 'ko'}">Va'da: ${sana(x.vada)}</span>` : ''}</span></div>`).join('')}</div>` : bosh_yoq('Hali eslatma yozilmagan.')}</div></div>
<div class="k"><div class="kb"><h2>Ochiq buyurtmalar</h2></div><div class="ry">${bs.map(bKarta).join('') || bosh_yoq('Ochiq buyurtma yo\'q.')}</div></div>`;
}

/* ---------- Ombor ---------- */
function omborJ(r, amal) {
	const rahbar = ui.rol === 'rahbar', partiyaOcha = rahbar || ui.rol === 'ishlab', kirimQila = rahbar || ui.rol === 'ombor';
	const narx = m => m.tur === 'tayyor' ? pulKorar() : rahbar;
	const narxUstun = r.some(narx);
	return `<div class="jw"><table class="j tel"><thead><tr><th>Mahsulot</th><th>Omborda</th><th class="r">Eng kam</th><th class="r">Band</th><th class="r">Kutilmoqda</th>${narxUstun ? '<th class="r">Narx</th>' : ''}${amal ? '<th></th>' : ''}</tr></thead><tbody>${r.map(m => {
		const h = mHolat(m), tay = m.tur === 'tayyor', bn = tay ? band(m.id) : navbatKerak(m.id), kt = tay ? jarayonda(m.id) : yolda(m.id);
		let t = '';
		if (amal && tay && partiyaOcha && (h === 'kam' || h === 'yoq' || m.qoldiq < bn) && kt < m.min + bn - m.qoldiq) t = `<button class="t k a" type="button" data-a="yangiPartiya" data-m="${m.id}" data-n="${Math.max(1, m.min + bn - m.qoldiq - kt)}">Partiya ochish</button>`;
		if (amal && !tay && kirimQila) t = `<button class="t k" type="button" data-a="kirim" data-m="${m.id}">Kirim</button>${(h === 'kam' || h === 'yoq') && !kt ? ` <button class="t k a" type="button" data-a="yBuy" data-m="${m.id}">Buyurtma berish</button>` : ''}`;
		return `<tr data-s="${esc(Yozuv.qid(m.nom + ' ' + m.guruh))}"><td><a href="#/ombor/${m.id}"><b>${esc(m.nom)}</b></a><span class="kich">${esc(m.guruh)}${h === 'yoq' ? ' · <span class="qizil">Tugagan</span>' : h === 'kam' ? ' · <span class="sariq">Kam qoldi</span>' : ''}${tay && m.qoldiq < bn ? ' · <span class="qizil">Buyurtmalarga yetmaydi</span>' : ''}${!tay && m.qoldiq < bn ? ' · <span class="qizil">Navbatdagi partiyalarga yetmaydi</span>' : ''}</span></td><td data-y="Omborda">${qoldiqHTML(m)}</td><td class="r" data-y="Eng kam">${m.buyurtmaga ? '—' : miq(m.min, m.birlik)}</td><td class="r" data-y="${tay ? 'Buyurtmalarga band' : 'Navbatdagi partiyalarga'}">${bn ? miq(bn, m.birlik) : '—'}</td><td class="r" data-y="${tay ? 'Ishlab chiqarishda' : 'Yo\'lda'}">${kt ? miq(kt, m.birlik) : '—'}</td>${narxUstun ? `<td class="r" data-y="Narx">${narx(m) ? pul(m.narx) : '—'}</td>` : ''}${amal ? `<td class="r">${t}</td>` : ''}</tr>`;
	}).join('')}</tbody></table></div><p class="yord" style="margin-top:8px">«Band» — tayyor mahsulotda tasdiqlangan buyurtmalar, xomashyoda navbatdagi partiyalar ehtiyoji. «Kutilmoqda» — tayyor mahsulotda ishlab chiqarishdagi, xomashyoda yo'ldagi miqdor.</p>`;
}
function vOmbor(y) {
	if (y.arg) return vMahsulot(y.arg);
	const amal = ui.rol !== 'sotuv';
	const tablar = ui.rol === 'sotuv' ? ['tayyor'] : ui.rol === 'ishlab' ? ['xom', 'tayyor', 'yolda'] : ['kam', 'tayyor', 'xom', 'yolda', 'jonat', 'jurnal'];
	const tab = tablar.includes(y.tab) ? y.tab : tablar[0];
	const km = kamlar(), jon = db.buyurtmalar.filter(b => b.holat === 'tasdiq').sort((a, b) => (tayyormi(b) ? 1 : 0) - (tayyormi(a) ? 1 : 0) || (a.kerak < b.kerak ? -1 : 1)), yl = db.kirimlar.filter(k => k.holat === 'yolda');
	const tay = db.mahsulotlar.filter(m => m.tur === 'tayyor'), xom = db.mahsulotlar.filter(m => m.tur === 'xom');

	const kirimQila = ui.rol === 'rahbar' || ui.rol === 'ombor';
	let ich;
	if (tab === 'kam') ich = km.length ? `<div class="k">${omborJ(km, amal)}</div>` : bosh_yoq('Hamma mahsulot yetarli.');
	else if (tab === 'tayyor' || tab === 'xom') ich = izlash('Mahsulot nomi') + `<div class="k" data-ry>${omborJ(tab === 'tayyor' ? tay : xom, amal)}</div>`;
	else if (tab === 'yolda') ich = `<div class="ry">${yl.map(k => `<div class="el"><div class="ust"><span class="id">${k.id}</span><span class="b ko">Yo'lda</span><span class="b">${kunFarq(k.kutiladi) < 0 ? `${-kunFarq(k.kutiladi)} kun kechikdi` : 'Kutilmoqda: ' + nisbiy(k.kutiladi)}</span></div><div class="nom">${esc(k.kim)}</div><div class="mat">${k.qatorlar.map(q => `${esc(topM(q.m).nom)} — ${miq(q.soni, topM(q.m).birlik)}`).join('; ')}</div>${kirimQila ? `<div class="amal"><button class="t k a" type="button" data-a="kQabul" data-id="${k.id}">${ik('tush')}Omborga qabul qilish</button></div>` : ''}</div>`).join('') || bosh_yoq('Yo\'lda xomashyo yo\'q.')}</div>`;

	return boshq(ui.rol === 'ishlab' ? 'Xomashyo va ombor' : 'Ombor', ui.rol === 'rahbar' ? `Tayyor mahsulot: ${qisqaPul(jamiT)} (sotuv narxida) · kam qolgan ${km.length} ta` : ui.rol === 'sotuv' ? 'Tayyor mahsulot qoldig\'i: omborda, buyurtmalarga band va ishlab chiqarishdagi miqdor' : 'Qoldiq, kam qolganlar, yo\'ldagi xomashyo, jo\'natish', kirimQila ? `<button class="t" type="button" data-a="yBuy">${ik('qosh')}Xomashyo buyurtmasi</button>` : '') +
		(tablar.length > 1 ? yorliq('#/ombor', tab, tablar.map(k => [k, NOM[k][0], NOM[k][1], NOM[k][2]])) : '') + ich;
}
function harakatJ(r, nomli) {
	return r.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Sana</th>${nomli ? '<th>Mahsulot</th>' : ''}<th class="r">Miqdor</th><th>Sabab</th><th>Kim</th></tr></thead><tbody>${r.map(h => { const m = topM(h.m); return `<tr><td><b>${sana(h.sana)}</b></td>${nomli ? `<td data-y="Mahsulot">${esc(m.nom)}</td>` : ''}<td class="r" data-y="Miqdor"><b class="${h.soni > 0 ? 'yashil' : ''}">${h.soni > 0 ? '+' : '−'}${miq(Math.abs(h.soni), m.birlik)}</b></td><td data-y="Sabab">${esc(h.sabab)}</td><td data-y="Kim">${esc(ism(h.kim))}</td></tr>`; }).join('')}</tbody></table></div>` : bosh_yoq('Harakat yo\'q.');
}
function vMahsulot(id) {
	const m = topM(id);
	if (!m || (ui.rol === 'sotuv' && m.tur !== 'tayyor')) return orqa('#/ombor', 'Ombor') + bosh_yoq('Mahsulot topilmadi.');
	const tay = m.tur === 'tayyor', h = mHolat(m), rahbar = ui.rol === 'rahbar';
	const hr = db.harakatlar.filter(x => x.m === id).slice(0, 20);
	const holat = h === 'yoq' ? '<span class="b qi">Tugagan</span>' : h === 'kam' ? '<span class="b sa">Kam qoldi</span>' : h === 'buyurtmaga' ? '<span class="b">Buyurtma asosida</span>' : '<span class="b ya">Yetarli</span>';
	let ich;
	if (tay) {

		ich = `<div class="kpi">${kpi('Omborda', miq(m.qoldiq), m.birlik, `Eng kam: ${miq(m.min, m.birlik)}`, h === 'kam' || h === 'yoq' ? 'yom' : '')}${kpi('Buyurtmalarga band', miq(bn), m.birlik, `${bs.length} ta buyurtma`)}${kpi('Erkin qoldiq', miq(m.qoldiq - bn), m.birlik, m.qoldiq < bn ? 'Buyurtmalarga yetmaydi' : 'Yangi buyurtmaga berish mumkin', m.qoldiq < bn ? 'yom' : 'yax')}${kpi('Ishlab chiqarishda', miq(jr), m.birlik, `${ps.length} ta partiya`)}</div>

<div class="k"><div class="kb"><h2>Band qilgan buyurtmalar</h2></div>${bs.length ? `<div class="tarix">${bs.map(b => `<div><time>${ui.rol === 'rahbar' || (ui.rol === 'sotuv' && mening(b)) ? `<a href="#/buyurtma/${b.id}">${b.id}</a>` : b.id}</time><span>${esc(topC(b.mijoz).nom)} — <b>${miq(yig(b.qatorlar.filter(q => q.m === id), q => q.soni), m.birlik)}</b>, kerak ${nisbiy(b.kerak)}</span></div>`).join('')}</div>` : bosh_yoq('Band qilingan miqdor yo\'q.')}

	} else {
		const nk = navbatKerak(id), yl = yolda(id);
		ich = `<div class="kpi">${kpi('Omborda', miq(m.qoldiq), m.birlik, `Eng kam: ${miq(m.min, m.birlik)}`, h === 'kam' || h === 'yoq' ? 'yom' : '')}${kpi('Navbatdagi partiyalarga', miq(nk), m.birlik, m.qoldiq < nk ? 'Yetmaydi' : 'Yetadi', m.qoldiq < nk ? 'yom' : 'yax')}${kpi('Yo\'lda', miq(yl), m.birlik, yl ? db.kirimlar.filter(k => k.holat === 'yolda' && k.qatorlar.some(q => q.m === id)).map(k => `${k.id}: ${nisbiy(k.kutiladi)}`).join(', ') : 'Buyurtma berilmagan')}${rahbar ? kpiPul('Qoldiq qiymati', m.qoldiq * m.narx, `${pul(m.narx)} / ${m.birlik}`) : kpi('Guruh', esc(m.guruh), '', '')}</div>`;

/* ---------- Hisobotlar ---------- */
function hisobMalumot() {
	const mah = {}, tur = {};
	for (const j of db.jonatmalar) {
		const c = topC(j.mijoz), t = tur[c.tur] || (tur[c.tur] = { soni: new Set(), jon: 0, qol: 0, kech: 0 });
		t.soni.add(c.id); t.jon += jSumma(j);
		for (const q of j.qatorlar) { const x = mah[q.m] || (mah[q.m] = { soni: 0, summa: 0 }); x.soni += q.soni; x.summa += q.soni * q.narx; }
	}
	for (const c of db.mijozlar) { const h = mHisob(c.id); if (tur[c.tur]) { tur[c.tur].qol += h.qol; tur[c.tur].kech += h.kech; } }
	const tug = db.partiyalar.filter(p => p.bosqich === 'tayyor'), guruh = {};
	for (const p of tug) { const g = guruh[p.m] || (guruh[p.m] = { soni: 0, chiqdi: 0, brak: 0 }); g.soni++; g.chiqdi += p.chiqdi; g.brak += p.brak; }
	return { mah: Object.entries(mah).sort((a, b) => b[1].summa - a[1].summa), tur: Object.entries(tur).sort((a, b) => b[1].jon - a[1].jon), partiya: Object.entries(guruh).sort((a, b) => b[1].chiqdi * topM(b[0]).narx - a[1].chiqdi * topM(a[0]).narx) };
}
const foiz = (a, b) => String(Math.round(a / Math.max(1, b) * 1000) / 10).replace('.', ',') + '%';
function tolovJadval() {
	return db.mijozlar.map(c => ({ c, h: mHisob(c.id) })).filter(x => x.h.jon > 0).sort((a, b) => (b.h.kun - a.h.kun) || (b.h.qol - a.h.qol));
}
function vHisobot() {
	const h = hisobMalumot();
	const csv = k => `<div class="ong"><button class="t k" type="button" data-a="csv" data-h="${k}">${ik('tush')}<span data-asl>Excel (CSV)</span></button></div>`;
	return boshq('Hisobotlar', 'Har bir jadvalni Excel uchun yuklab olish mumkin') +
		`<div class="qator2"><div class="k"><div class="kb"><h2>Oylar bo'yicha tushum va xarajat</h2>${csv('oylik')}</div>${ustunHTML()}</div>
<div class="k"><div class="kb"><h2>Mahsulotlar bo'yicha sotuv</h2>${csv('mahsulot')}</div>${gor(h.mah.map(([id, v]) => [esc(topM(id).nom.split(',')[0]), v.summa]), qisqaPul)}<p class="yord" style="margin-top:10px">Namunadagi barcha jo'natmalar bo'yicha (so'nggi 100 kun).</p></div></div>
<div class="k"><div class="kb"><h2>To'lov holati — mijozlar bo'yicha</h2>${csv('tolov')}</div><div class="jw"><table class="j tel"><thead><tr><th>Mijoz</th><th class="r">Jo'natilgan</th><th class="r">To'langan</th><th class="r">Qolgan</th>${YOSH.map(n => `<th class="r">${n}</th>`).join('')}<th class="r">Eng eski (kun)</th></tr></thead><tbody>${tolovJadval().map(({ c, h: x }) => `<tr><td><a href="#/mijozlar/${c.id}"><b>${esc(c.nom)}</b></a></td><td class="r" data-y="Jo'natilgan">${qisqaPul(x.jon)}</td><td class="r" data-y="To'langan">${qisqaPul(x.tol)}</td><td class="r" data-y="Qolgan"><b>${qisqaPul(x.qol)}</b></td>${x.yosh.map((v, i) => `<td class="r" data-y="${YOSH[i]}">${v >= 1 ? (i ? `<span class="qizil">${qisqaPul(v)}</span>` : qisqaPul(v)) : '—'}</td>`).join('')}<td class="r" data-y="Eng eski (kun)">${x.kun || '—'}</td></tr>`).join('')}</tbody></table></div></div>
<div class="k"><div class="kb"><h2>Mijoz turlari bo'yicha</h2>${csv('tur')}</div><div class="jw"><table class="j tel"><thead><tr><th>Mijoz turi</th><th class="r">Mijozlar</th><th class="r">Jo'natilgan</th><th class="r">To'lanmagan</th><th class="r">Muddati o'tgan</th></tr></thead><tbody>${h.tur.map(([n, v]) => `<tr><td><b>${esc(n)}</b></td><td class="r" data-y="Mijozlar">${v.soni.size}</td><td class="r" data-y="Jo'natilgan">${qisqaPul(v.jon)}</td><td class="r" data-y="To'lanmagan">${v.qol >= 1 ? qisqaPul(v.qol) : '—'}</td><td class="r" data-y="Muddati o'tgan">${v.kech >= 1 ? `<span class="qizil">${qisqaPul(v.kech)}</span>` : '—'}</td></tr>`).join('')}</tbody></table></div></div>
<div class="k"><div class="kb"><h2>Menejerlar</h2>${csv('menejer')}</div>${menejerlarJ()}</div>
<div class="k"><div class="kb"><h2>Ishlab chiqarish: tugagan partiyalar</h2>${csv('partiya')}</div><div class="jw"><table class="j tel"><thead><tr><th>Mahsulot</th><th class="r">Partiyalar</th><th class="r">Chiqdi</th><th class="r">Yaroqsiz</th><th class="r">Yaroqsiz ulushi</th></tr></thead><tbody>${h.partiya.map(([id, v]) => { const m = topM(id); return `<tr><td><b>${esc(m.nom)}</b></td><td class="r" data-y="Partiyalar">${v.soni}</td><td class="r" data-y="Chiqdi">${miq(v.chiqdi, m.birlik)}</td><td class="r" data-y="Yaroqsiz">${miq(v.brak, m.birlik)}</td><td class="r" data-y="Yaroqsiz ulushi">${foiz(v.brak, v.chiqdi + v.brak)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}
function csvQatorlar(k) {
	const h = hisobMalumot();
	if (k === 'oylik') return [['Davr', 'Tushum (mln so\'m)', 'Xarajat (mln so\'m)'], ...oylik().map(o => [o.n, o.t, o.x])];
	if (k === 'mahsulot') return [['Mahsulot', 'Birlik', 'Miqdor', 'Summa (so\'m)'], ...h.mah.map(([id, v]) => [topM(id).nom, topM(id).birlik, v.soni, v.summa])];
	if (k === 'tolov') return [['Mijoz', 'Turi', 'Menejer', 'Jo\'natilgan', 'To\'langan', 'Qolgan', ...YOSH, 'Eng eski (kun)'], ...tolovJadval().map(({ c, h: x }) => [c.nom, c.tur, ism(c.menejer), x.jon, x.tol, x.qol, ...x.yosh, x.kun])];
	if (k === 'tur') return [['Mijoz turi', 'Mijozlar', 'Jo\'natilgan', 'To\'lanmagan', 'Muddati o\'tgan'], ...h.tur.map(([n, v]) => [n, v.soni.size, v.jon, v.qol, v.kech])];
	if (k === 'menejer') return [['Menejer', 'Mijozlar', 'Ochiq buyurtma', 'Jo\'natildi (30 kun)', 'Yig\'ildi (30 kun)', 'To\'lanmagan', 'Muddati o\'tgan', 'Eslatish kerak'], ...db.xodimlar.filter(x => x.rol === 'sotuv').map(x => { const s = menejerStat(x.id); return [x.ism, s.mijoz, s.ochiq, s.jon30, s.yig30, s.qol, s.kech, s.eslat]; })];
	if (k === 'partiya') return [['Mahsulot', 'Partiyalar', 'Chiqdi', 'Yaroqsiz', 'Yaroqsiz ulushi'], ...h.partiya.map(([id, v]) => [topM(id).nom, v.soni, v.chiqdi, v.brak, foiz(v.brak, v.chiqdi + v.brak)])];
	if (k.startsWith('akt:')) { // solishtirma dalolatnoma: jo'natma va to'lovlar sana tartibida, qoldiq bilan
		const cid = k.slice(4), c = topC(cid), q = [];
		for (const j of db.jonatmalar.filter(j => j.mijoz === cid)) q.push({ s: j.sana, n: `Jo'natma ${j.id}`, j: jSumma(j), t: 0 });
		for (const t of db.tolovlar.filter(t => t.mijoz === cid)) q.push({ s: t.sana, n: `To'lov (${t.usul})`, j: 0, t: t.summa });
		q.sort((a, b) => a.s < b.s ? -1 : a.s > b.s ? 1 : b.j - a.j);
		let qol = 0;
		return [[`Solishtirma dalolatnoma: ${c.nom}`, '', '', '', ''], ['Sana', 'Hujjat', 'Jo\'natilgan', 'To\'langan', 'Qoldiq'], ...q.map(x => { qol += x.j - x.t; return [sana(x.s), x.n, x.j, x.t, qol]; })];
	}
	return [];
}

/* 3-qism: oynalar, amallar (holatni o'zgartiradi), chizish va ishga tushirish. */

function xabar(m) {
	const el = $('#xabar'); el.innerHTML = `<div class="xabar" role="status">${esc(m)}</div>`; Yozuv.dom(el, ui.til);
	clearTimeout(xabar.t); xabar.t = setTimeout(() => { el.innerHTML = ''; }, 3600);
}
function oyna(sarlavha, ich, o) {
	o = o || {};
	const el = $('#oyna');
	el.innerHTML = `<div class="parda"><form class="oyna" role="dialog" aria-modal="true" aria-label="${esc(sarlavha)}" ${o.forma ? `data-f="${o.forma}"` : 'data-bosh'}><header><h2>${esc(sarlavha)}</h2><button type="button" data-a="yop" aria-label="Yopish">${ik('yop')}</button></header><div class="ich">${ich}</div>${o.forma ? `<footer><button type="button" class="t" data-a="yop">Bekor qilish</button><button class="t a" type="submit">${o.tugma || 'Saqlash'}</button></footer>` : ''}</form></div>`;
	Yozuv.dom(el, ui.til);
	const b = el.querySelector('.ich input:not([type=hidden]),.ich select,.ich textarea,.ich a'); if (b) b.focus();
}
const yop = () => { $('#oyna').innerHTML = ''; };
function yangila(m) { saqla(); yop(); chiz(); if (m) xabar(m); }
const borish = h => { if (location.hash === h) chiz(); else location.hash = h; };
const son = v => { const n = parseInt(String(v || '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? 0 : n; };
const may = (yorliq, ich, yord) => `<label class="may"><span>${yorliq}</span>${ich}${yord ? `<span class="yord">${yord}</span>` : ''}</label>`;
const tanla = (nom, opt, joriy, qosh) => `<select class="in" name="${nom}" ${qosh || ''}>${opt.map(([v, n]) => `<option value="${esc(v)}" ${String(v) === String(joriy) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
const tayyorOpt = () => db.mahsulotlar.filter(m => m.tur === 'tayyor').map(m => [m.id, `${m.nom} — omborda ${miq(m.qoldiq, m.birlik)}`]);
// Eslatma uchun tayyor matn: muddati o'tgan jo'natmalar ro'yxati bilan
function eslatmaMatni(c, h) {
	const q = h.q.filter(x => x.qol >= 1 && x.farq < 0);
	return `Assalomu alaykum, ${c.masul}. AIDWELL TEX'dan eslatma: ${q.map(x => `${x.j.id} (${sana(x.j.sana)}) bo'yicha ${pul(x.qol)}, muddati ${sana(x.j.muddat)} da o'tgan`).join('; ')}. Jami: ${pul(h.kech)}. Iltimos, to'lov sanasini ma'lum qiling.`;
}

/* ---------- Tugma amallari ---------- */
const AMAL = {
	til(d) { ui.til = d.t; saqla(); yop(); chiz(); },
	rolTanla(d) { ui.tanlov = d.r; ui.pinXato = false; chiz(); },
	rolOrqa() { ui.tanlov = null; ui.pinXato = false; chiz(); },
	chiqish() { ui.rol = null; ui.kim = null; ui.tanlov = null; ui.oxirgiYol = ''; saqla(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* fayldan ochilganda */ } yop(); chiz(); window.scrollTo(0, 0); },
	qayta() { oyna('Namunani boshidan boshlash', `<p>Namunada kiritilgan o'zgarishlar o'chadi va hammasi dastlabki holatiga qaytadi.</p>`, { forma: 'qayta', tugma: 'Boshidan boshlash' }); },
	yop() { yop(); },
	yana() { oyna('Bo\'limlar', `<nav class="et">${NAV[ui.rol].slice(4).map(k => { const b = BOLIM[k]; return `<a href="${b.h}"><span class="nuq ko">${ik(b.i)}</span><span><b>${b.n}</b></span><span class="uq">${ik('ong')}</span></a>`; }).join('')}</nav>`); },

	/* Buyurtma */
	yangiBuyurtma(d) {
		const ms = db.mijozlar.filter(meningC).map(c => [c.id, `${c.nom} — ${c.joy}`]), opt = [['', '— tanlang —'], ...tayyorOpt()];
		let q = '';
		for (let i = 0; i < 4; i++) q += `<div class="may2" style="grid-template-columns:1fr 104px;margin-bottom:8px">${tanla('m' + i, opt, '', `aria-label="${i + 1}-mahsulot"`)}<input class="in" name="n${i}" type="text" inputmode="numeric" placeholder="Miqdor" aria-label="${i + 1}-mahsulot miqdori"></div>`;
		oyna('Yangi buyurtma', may('Mijoz', tanla('mijoz', ms, d.c || ms[0][0])) + `<div class="may"><span>Mahsulotlar</span></div>${q}<p class="yord" style="margin-bottom:12px">Narx katalogdan olinadi. Bo'sh qatorlar hisobga olinmaydi.</p>` +
			`<div class="may2">${may('Qachonga kerak', `<input class="in" name="kerak" type="date" min="${db.bugun}" value="${kunQosh(db.bugun, 5)}" required>`)}${may('Izoh', `<input class="in" name="izoh" type="text" placeholder="Masalan: maxsus o'lcham">`)}</div>`, { forma: 'buyurtma', tugma: 'Buyurtmani saqlash' });
	},
	bTasdiq(d) { const b = topB(d.id); b.holat = 'tasdiq'; const yt = yetishmas(b), t = toxta(b); yangila(`${b.id} tasdiqlandi. ${yt.length ? 'Omborda yetarli emas — ishlab chiqarish mas\'uliga ko\'rinadi.' : t ? 'Jo\'natish uchun rahbar ruxsati kerak.' : 'Omborchiga jo\'natish uchun ko\'rinadi.'}`); },
	bBekor(d) { const b = topB(d.id); b.holat = 'bekor'; saqla(); xabar(`${b.id} bekor qilindi.`); borish('#/buyurtma'); },
	bRuxsat(d) { if (ui.rol !== 'rahbar') return; const b = topB(d.id); b.ruxsat = true; yangila(`${b.id}: jo'natishga ruxsat berildi.`); },
	jonat(d) {
		const b = topB(d.id), c = topC(b.mijoz);
		if (b.holat !== 'tasdiq' || (ui.rol !== 'rahbar' && ui.rol !== 'ombor')) return;
		if (yetishmas(b).length) { xabar('Omborda yetarli emas — jo\'natib bo\'lmaydi.'); return; }
		if (toxta(b)) { xabar('Jo\'natish to\'xtatilgan — rahbar ruxsati kerak.'); return; }
		const j = { id: yangiId('YX'), b: b.id, mijoz: c.id, sana: db.bugun, muddat: kunQosh(db.bugun, c.muddat), qatorlar: [] };
		for (const q of b.qatorlar) { const lot = lotOl(q.m, q.soni); harakat(q.m, -q.soni, `Jo'natildi: ${j.id}, ${c.nom}`); j.qatorlar.push({ m: q.m, soni: q.soni, narx: q.narx, lot }); }
		db.jonatmalar.push(j); b.holat = 'jonatildi';
		yangila(`${b.id} jo'natildi (${j.id}). Qoldiq kamaydi, ${c.muddat ? `to'lov muddati — ${sana(j.muddat)}` : 'oldindan to\'lov hisobidan yopildi'}.`);
	},

	/* Mijoz */
	tolov(d) {
		const c = topC(d.c), h = mHisob(c.id), taklif = h.kech >= 1 ? h.kech : h.keyingi ? h.keyingi.qol : 0;
		oyna('To\'lov qabul qilish', `<input type="hidden" name="c" value="${c.id}"><div class="eslat ko">${ik('moliya')}<div>${esc(c.nom)} · to'lanmagan <b>${pul(h.qol)}</b>${h.kech >= 1 ? ` · shundan ${pul(h.kech)} muddati o'tgan` : ''}</div></div>` +
			may('Summa (so\'m)', `<input class="in" name="summa" type="text" inputmode="numeric" value="${taklif ? guruhla(taklif) : ''}" required>`, 'To\'lov eng eski jo\'natmadan boshlab hisobga olinadi. Ortig\'i oldindan to\'lov bo\'lib turadi.') +
			may('To\'lov usuli', tanla('usul', [['Pul o\'tkazmasi', 'Pul o\'tkazmasi'], ['Naqd', 'Naqd'], ['Karta', 'Karta']], 'Pul o\'tkazmasi')), { forma: 'tolov', tugma: 'To\'lovni saqlash' });
	},
	eslatma(d) {
		const c = topC(d.c), h = mHisob(c.id);
		oyna(`Eslatma: ${c.nom}`, `<input type="hidden" name="c" value="${c.id}">` + (h.kech >= 1 ? `<div class="may"><span>Yuboriladigan matn</span></div><div class="xat">${esc(eslatmaMatni(c, h))}</div>` : `<div class="eslat ko">${ik('ha')}<div>Bu mijozda muddati o'tgan to'lov yo'q.</div></div>`) +
			`<div class="may2">${may('Qanday eslatildi', tanla('usul', [['Telefon', 'Telefon'], ['Telegram', 'Telegram'], ['Xat', 'Xat']], 'Telefon'))}${may('To\'lashga va\'da qilingan sana', `<input class="in" name="vada" type="date" min="${db.bugun}">`)}</div>` +
			may('Mijoz javobi', `<textarea class="in" name="matn" required placeholder="Masalan: juma kuni yarmini o'tkazadi"></textarea>`, 'Eslatma mijoz tarixida saqlanadi. Va\'da qilingan sana o\'tsa, tizim qayta eslatadi.'), { forma: 'eslatma', tugma: 'Eslatmani saqlash' });
	},
	shart(d) {
		const c = topC(d.c);
		oyna(`Shartlar: ${c.nom}`, `<input type="hidden" name="c" value="${c.id}"><div class="may2">${may('To\'lov muddati (kun)', `<input class="in" name="muddat" type="number" min="0" max="180" value="${c.muddat}" inputmode="numeric" required>`, '0 — oldindan to\'lov')}${may('Limit (mln so\'m)', `<input class="in" name="limit" type="number" min="0" max="100000" value="${Math.round(c.limit / 1e6)}" inputmode="numeric" required>`, '0 — limit belgilanmagan')}</div><p class="yord">Yangi muddat keyingi jo'natmalarga qo'llanadi. To'lanmagan summa limitdan oshsa, jo'natish rahbar ruxsatigacha to'xtaydi.</p>`, { forma: 'shart' });
	},
	yangiMijoz() {
		oyna('Yangi mijoz', may('Nomi', `<input class="in" name="nom" type="text" required placeholder="Masalan: «Namuna farm» MChJ">`) +
			`<div class="may2">${may('Turi', tanla('tur', MTUR.map(x => [x, x]), MTUR[0]))}${may('Shahar yoki viloyat', `<input class="in" name="joy" type="text" required>`)}</div><div class="may2">${may('Mas\'ul shaxs', `<input class="in" name="masul" type="text" required>`)}${may('To\'lov muddati (kun)', `<input class="in" name="muddat" type="number" min="0" max="180" value="30" inputmode="numeric" required>`, '0 — oldindan to\'lov')}</div>`, { forma: 'mijoz', tugma: 'Mijozni saqlash' });
	},

	/* Ishlab chiqarish */
	yangiPartiya(d) {
		const opt = db.mahsulotlar.filter(m => m.tur === 'tayyor').map(m => [m.id, m.nom]);
		oyna('Yangi partiya', (d.b ? `<input type="hidden" name="b" value="${d.b}"><div class="eslat ko">${ik('sotuv')}<div>Buyurtma ${d.b} uchun — ${esc(topC(topB(d.b).mijoz).nom)}</div></div>` : '') +
			may('Mahsulot', tanla('m', opt, d.m || opt[0][0])) +
			`<div class="may2">${may('Reja miqdori', `<input class="in" name="reja" type="text" inputmode="numeric" value="${d.n ? guruhla(d.n) : ''}" required>`)}${may('Muddat', `<input class="in" name="muddat" type="date" min="${db.bugun}" value="${kunQosh(db.bugun, 7)}" required>`)}</div><p class="yord">Saqlangach partiya navbatga tushadi; xomashyo yetarliligi partiya sahifasida ko'rinadi.</p>`, { forma: 'partiya', tugma: 'Navbatga qo\'shish' });
	},
	pBoshla(d) {
		const p = topP(d.id), m = topM(p.m);
		if (p.bosqich !== 'navbat') return;
		const xk = xomKerak(m, p.reja);
		if (xk.some(x => !x.yetar)) { xabar('Xomashyo yetmaydi — partiyani boshlab bo\'lmaydi.'); return; }
		p.sarf = xk.map(x => ({ m: x.x.id, soni: x.kerak }));
		for (const s of p.sarf) harakat(s.m, -s.soni, `Partiya ${p.id} uchun sarf`);
		p.bosqich = pTartib(m)[1]; p.boshlandi = db.bugun;
		const kam = p.sarf.map(s => topM(s.m)).filter(x => x.qoldiq < x.min);
		yangila(`${p.id} boshlandi: xomashyo ombordan olindi.${kam.length ? ` Kam qoldi: ${kam.map(x => x.nom).join(', ')}.` : ''}`);
	},
	pKeyingi(d) {
		const p = topP(d.id), t = pTartib(topM(p.m)), i = t.indexOf(p.bosqich);
		if (i < 1 || t[i + 1] === 'tayyor' || !t[i + 1]) return;
		p.bosqich = t[i + 1]; yangila(`${p.id}: ${PBOS[p.bosqich]} bosqichiga o'tdi.`);
	},
	pQabul(d) {
		const p = topP(d.id), m = topM(p.m);
		oyna(`Omborga topshirish: ${p.id}`, `<input type="hidden" name="id" value="${p.id}"><p style="margin-bottom:10px"><b>${esc(m.nom)}</b><br><span class="yord">Reja: ${miq(p.reja, m.birlik)}</span></p><div class="may2">${may(`Yaroqli chiqdi (${m.birlik})`, `<input class="in" name="chiqdi" type="text" inputmode="numeric" value="${guruhla(p.reja)}" required>`)}${may(`Yaroqsiz (${m.birlik})`, `<input class="in" name="brak" type="text" inputmode="numeric" value="0">`)}</div><p class="yord">Yaroqli miqdor shu partiya raqami bilan ombor qoldig'iga qo'shiladi.</p>`, { forma: 'qabul', tugma: 'Omborga qabul qilish' });
	},

	/* Ombor */
	kirim(d) {
		const m = topM(d.m);
		oyna('Kirim', `<input type="hidden" name="m" value="${m.id}"><p style="margin-bottom:10px"><b>${esc(m.nom)}</b><br><span class="yord">Hozir omborda ${miq(m.qoldiq, m.birlik)}</span></p>` + may(`Miqdor (${m.birlik})`, `<input class="in" name="soni" type="text" inputmode="numeric" required>`) + may('Izoh', `<input class="in" name="izoh" type="text" placeholder="Masalan: yuk xati raqami">`), { forma: 'kirim', tugma: 'Kirim qilish' });
	},
	kQabul(d) {
		const k = db.kirimlar.find(x => x.id === d.id);
		for (const q of k.qatorlar) harakat(q.m, q.soni, `Kirim: ${k.id}`);
		k.holat = 'qabul'; yangila(`${k.id} omborga qabul qilindi, qoldiq yangilandi.`);
	},
	yBuy(d) {
		const xom = db.mahsulotlar.filter(m => m.tur === 'xom'), m = d.m ? topM(d.m) : xom[0];
		oyna('Xomashyo buyurtmasi', may('Yetkazib beruvchi', `<input class="in" name="kim" type="text" required placeholder="Masalan: ip ta'minotchisi">`) +
			may('Xomashyo', tanla('m', xom.map(x => [x.id, `${x.nom} — omborda ${miq(x.qoldiq, x.birlik)}`]), m.id)) +
			`<div class="may2">${may('Miqdor', `<input class="in" name="soni" type="text" inputmode="numeric" value="${guruhla(Math.max(1, Math.ceil(m.min * 2 + navbatKerak(m.id) - m.qoldiq)))}" required>`)}${may('Necha kunda keladi', `<input class="in" name="kun" type="number" min="1" max="120" value="5" inputmode="numeric" required>`)}</div>`, { forma: 'ybuy', tugma: 'Buyurtmani saqlash' });
	},
	xarajat() {
		oyna('Xarajat', may('Turi', tanla('tur', XTUR.map(x => [x, x]), XTUR[0])) + may('Summa (so\'m)', `<input class="in" name="summa" type="text" inputmode="numeric" required>`) + may('Izoh', `<input class="in" name="izoh" type="text">`), { forma: 'xarajat', tugma: 'Xarajatni saqlash' });
	},
	csv(d) {
		const f = ui.til === 'kir' ? Yozuv.kir : Yozuv.lot;
		const q = csvQatorlar(d.h).map(r => r.map(c => { const s = typeof c === 'number' ? String(Math.round(c * 10) / 10).replace('.', ',') : f(String(c)); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
		try {
			const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + q], { type: 'text/csv;charset=utf-8' })); a.download = 'aidwell-' + d.h.replace(':', '-') + '.csv';
			document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
			xabar('Jadval Excel uchun yuklab olindi.');
		} catch (e) { xabar('Bu brauzerda yuklab olish ishlamadi.'); }
	},
};

/* ---------- Forma saqlash ---------- */
const FORMA = {
	pin(d) {
		const x = topX(KIMLAR[ui.tanlov]);
		if (d.pin !== x.pin) { ui.pinXato = true; chiz(); return; }
		ui.rol = ui.tanlov; ui.kim = x.id; ui.tanlov = null; ui.pinXato = false; ui.oxirgiYol = ''; saqla(); borish(boshSahifa());
	},
	qayta() { db = Malumot.urug(new Date()); saqla(); yop(); if (ui.rol) borish(boshSahifa()); else chiz(); xabar('Namuna dastlabki holatiga qaytdi.'); },
	buyurtma(d) {
		const q = [];
		for (let i = 0; i < 4; i++) { const m = d['m' + i], n = son(d['n' + i]); if (!m || n < 1) continue; const bor = q.find(x => x.m === m); if (bor) bor.soni += n; else q.push({ m, soni: n, narx: topM(m).narx }); }
		if (!q.length) { xabar('Kamida bitta mahsulot va miqdorini kiriting.'); return; }
		const c = topC(d.mijoz);
		if (!c || !meningC(c)) { xabar('Mijozni tanlang.'); return; }
		const b = { id: yangiId('B'), mijoz: c.id, holat: 'yangi', sana: db.bugun, kerak: d.kerak || kunQosh(db.bugun, 5), izoh: (d.izoh || '').trim(), qatorlar: q };
		db.buyurtmalar.unshift(b); saqla(); yop(); xabar(`Buyurtma saqlandi: ${b.id}, ${qisqaPul(bJami(b))}.`); borish('#/buyurtma/' + b.id);
	},
	tolov(d) {
		const c = topC(d.c), s = son(d.summa);
		if (s < 1) { xabar('Summani kiriting.'); return; }
		db.tolovlar.push({ id: 't' + (++db.sanoq.t), mijoz: c.id, sana: db.bugun, summa: s, usul: d.usul });
		const h = mHisob(c.id);
		yangila(`${pul(s)} qabul qilindi. ${h.qol >= 1 ? `Qoldi: ${pul(h.qol)}${h.kech >= 1 ? `, shundan muddati o'tgani ${pul(h.kech)}` : ''}.` : h.avans >= 1 ? `To'lanmagan summa yo'q, oldindan to'lov: ${pul(h.avans)}.` : 'To\'lanmagan summa qolmadi.'}`);
	},
	eslatma(d) {
		const c = topC(d.c), matn = (d.matn || '').trim();
		if (!matn) { xabar('Mijoz javobini yozing.'); return; }
		db.eslatmalar.push({ mijoz: c.id, sana: db.bugun, kim: ui.kim, usul: d.usul, matn, vada: d.vada || null });
		yangila(`Eslatma saqlandi.${d.vada ? ` Va'da qilingan sana: ${sana(d.vada)}.` : ''}`);
	},
	shart(d) {
		if (ui.rol !== 'rahbar') return;
		const c = topC(d.c); c.muddat = Math.min(180, son(d.muddat)); c.limit = son(d.limit) * 1e6;
		yangila(`Shartlar saqlandi: ${c.muddat ? c.muddat + ' kun muddat' : 'oldindan to\'lov'}, limit ${c.limit ? qisqaPul(c.limit) : 'belgilanmagan'}.`);
	},
	mijoz(d) {
		const c = { id: 'c' + (++db.sanoq.c), nom: d.nom.trim(), tur: d.tur, joy: d.joy.trim(), masul: d.masul.trim(), tel: '—', muddat: Math.min(180, son(d.muddat)), limit: 0, menejer: ui.rol === 'sotuv' ? ui.kim : 's1' };
		db.mijozlar.push(c); saqla(); yop(); xabar('Mijoz qo\'shildi.'); borish('#/mijozlar/' + c.id);
	},
	partiya(d) {
		const n = son(d.reja), m = topM(d.m);
		if (n < 1) { xabar('Reja miqdorini kiriting.'); return; }
		const p = { id: yangiId('P'), m: m.id, reja: n, bosqich: 'navbat', ochildi: db.bugun, boshlandi: null, muddat: d.muddat || kunQosh(db.bugun, 7), tugadi: null, chiqdi: 0, brak: 0, b: d.b || null, sarf: [] };
		db.partiyalar.unshift(p); saqla(); yop();
		xabar(`${p.id} navbatga qo'shildi.${pXomYoq(p).length ? ' Diqqat: xomashyo yetmaydi.' : ''}`); borish('#/ishlab/' + p.id);
	},
	qabul(d) {
		const p = topP(d.id), m = topM(p.m), n = son(d.chiqdi), br = son(d.brak);
		if (p.bosqich !== 'sifat') return;
		if (n < 1) { xabar('Chiqqan miqdorni kiriting.'); return; }
		p.chiqdi = n; p.brak = br; p.bosqich = 'tayyor'; p.tugadi = db.bugun;
		db.lotlar.push({ p: p.id, m: m.id, q: n, sana: db.bugun });
		harakat(m.id, n, `Partiya ${p.id} omborga qabul qilindi`);
		const och = db.buyurtmalar.filter(b => b.holat === 'tasdiq' && b.qatorlar.some(q => q.m === m.id) && !yetishmas(b).length);
		yangila(`${p.id} omborga qabul qilindi: +${miq(n, m.birlik)}.${och.length ? ` Endi jo'natish mumkin: ${och.map(b => b.id).join(', ')}.` : ''}`);
	},
	kirim(d) {
		const m = topM(d.m), n = son(d.soni);
		if (n < 1) { xabar('Miqdorni kiriting.'); return; }
		harakat(m.id, n, 'Kirim' + (d.izoh && d.izoh.trim() ? ': ' + d.izoh.trim() : ''));
		yangila(`${m.nom}: +${miq(n, m.birlik)}. Omborda ${miq(m.qoldiq, m.birlik)}.`);
	},
	ybuy(d) {
		const n = son(d.soni), kun = Math.max(1, son(d.kun) || 5);
		if (n < 1) { xabar('Miqdorni kiriting.'); return; }
		const k = { id: yangiId('K'), kim: d.kim.trim(), kutiladi: kunQosh(db.bugun, kun), holat: 'yolda', qatorlar: [{ m: d.m, soni: n }] };
		db.kirimlar.push(k); saqla(); yop(); xabar(`Buyurtma saqlandi: ${k.id}. «Yo'lda» ro'yxatida ko'rinadi.`); borish('#/ombor?yolda');
	},
	xarajat(d) {
		const s = son(d.summa); if (s < 1) { xabar('Summani kiriting.'); return; }
		db.xarajatlar.push({ id: 'h' + (++db.sanoq.h), sana: db.bugun, tur: d.tur, summa: s, izoh: (d.izoh || '').trim() });
		yangila(`Xarajat saqlandi: ${pul(s)}.`);
	},
};

/* ---------- Chizish ---------- */
function chiz() {
	const root = $('#ilova');
	document.documentElement.lang = ui.til === 'kir' ? 'uz-Cyrl' : 'uz';
	const nomla = s => { document.title = (ui.til === 'kir' ? Yozuv.kir : Yozuv.lot)('AIDWELL TEX — ' + s); };
	if (!ui.rol) { root.innerHTML = kirishHTML(); Yozuv.dom(root, ui.til); nomla('boshqaruv tizimi (namuna)'); const p = $('#pin'); if (p) p.focus(); return; }
	const y = yol();
	if (!RUXSAT[ui.rol].includes(y.bol)) { if (location.hash !== boshSahifa()) { location.replace(boshSahifa()); return; } }
	let ich = '';
	switch (y.bol) {
		case 'panel': ich = vPanel(); break;
		case 'ishim': ich = vIshim(); break;
		case 'buyurtma': ich = y.arg ? vBuyurtma(y.arg) : vBuyurtmalar(y); break;
		case 'mijozlar': ich = y.arg ? vMijoz(y.arg) : vMijozlar(y); break;
		case 'ombor': ich = vOmbor(y); break;
		case 'ishlab': ich = y.arg ? vPartiya(y.arg) : vIshlab(y); break;
		case 'moliya': ich = vMoliya(y); break;
		case 'hisobot': ich = vHisobot(); break;
		default: ich = bosh_yoq('Sahifa topilmadi.');
	}
	root.innerHTML = qobiq(ich, y); Yozuv.dom(root, ui.til);
	nomla((BOLIM[y.bol] ? BOLIM[y.bol].n : 'namuna') + ' (namuna)');
	if (location.hash !== ui.oxirgiYol) { window.scrollTo(0, 0); ui.oxirgiYol = location.hash; }
	// Telefonda tanlangan yorliq ko'rinadigan joyga suriladi
	const yr = root.querySelector('.yor'), fy = yr && yr.querySelector('[aria-current=true]');
	if (fy && fy.getBoundingClientRect) yr.scrollLeft += fy.getBoundingClientRect().left - yr.getBoundingClientRect().left - 12;
}

/* ---------- Hodisalar ---------- */
document.addEventListener('click', e => {
	const t = e.target.closest('[data-a]');
	if (t) { if (t.disabled) return; const f = AMAL[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset, t); } return; }
	if (e.target.classList && e.target.classList.contains('parda')) { yop(); return; }
	const tr = e.target.closest('tr[data-h]');
	if (tr && !e.target.closest('a,button,input,select')) location.hash = tr.dataset.h;
});
document.addEventListener('submit', e => {
	const f = e.target.closest('form');
	if (!f) return; e.preventDefault();
	if (!f.dataset.f) return;
	const d = {}; new FormData(f).forEach((v, k) => { d[k] = v; });
	const fn = FORMA[f.dataset.f]; if (fn) fn(d, f);
});
document.addEventListener('input', e => {
	const t = e.target;
	if (t.id === 'pin' && /^\d{4}$/.test(t.value) && t.form) { if (t.form.requestSubmit) t.form.requestSubmit(); return; }
	if (!t.matches || !t.matches('[data-q]')) return;
	const q = Yozuv.qid(t.value.trim()), ry = document.querySelector('[data-ry]'); if (!ry) return;
	let bor = 0;
	ry.querySelectorAll('[data-s]').forEach(el => { const k = !q || el.dataset.s.includes(q); el.hidden = !k; if (k) bor++; });
	let yoq = ry.querySelector('[data-yoq]');
	if (!bor && !yoq) { yoq = document.createElement('div'); yoq.className = 'bosh-yoq'; yoq.dataset.yoq = '1'; yoq.textContent = 'Hech narsa topilmadi.'; ry.appendChild(yoq); Yozuv.dom(yoq, ui.til); }
	if (yoq) yoq.hidden = bor > 0;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#oyna').firstChild) yop(); });
window.addEventListener('hashchange', () => { yop(); chiz(); });
yukla();
chiz();

})();
</script>
