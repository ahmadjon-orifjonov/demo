	/* yangi ariza */
	newAriza(d) {
		const cid = d && d.id && /^c\d+$/.test(d.id) ? d.id : '';
		ui.f.ar = { cid, cq: cid ? Data.client(cid).nom : '', rk: '', yuk: 'mayiz', tonna: 20, sana: Time.add(2), stavka: '', xarajat: '', ustama: '', fraxt: '', from: 'Farg‘ona', to: '', km: '', tb: 'avto:tent', davlat: 'RU' };
		ui.menu = false;
		if (ui.f.ar.cid) Fields.arClient();
		Steps.drawer('ariza', 'new');
	},
	arizaCopy() { UI.copy(Views.offerText(ui.f.ar)); },
	arPickClient(d) { const f = ui.f.ar, c = Data.client(d.v); f.cid = c.id; f.cq = c.nom; Fields.arClient(); UI.refresh('layer'); },
	saveAriza() {
		if (!Forms.valid('ar')) return;
		const f = ui.f.ar, needs = Views.arizaNeeds(f), R = session.role === 'rahbar', q = Calc.quote(f.stavka, f.xarajat, f.fraxt);
		const rk = f.rk === 'other' ? Data.addRoute(f).k : f.rk;
		const l = Data.newLoad({ cid: f.cid, rk, yuk: f.yuk, tonna: +f.tonna, fraxt: Math.round(+f.fraxt), stavka: Math.round(+f.stavka), xarajat: [{ t: 'Broker va boshqa', sum: Math.round(+f.xarajat || 0) }], yukT: Time.day0(f.sana) + 8 * HOUR, logist: R ? 'u2' : session.user });
		l.joy = '';
		Data.log(l, `Ariza ochildi: ${F.route(l)}, fraxt ${F.usd(l.fraxt)}, marja ${F.pct(q.marja)}`, 'ariza');
		if (R && q.low) Data.log(l, `Past marja (${F.pct(q.marja)}) — rahbar o‘zi tasdiqladi`, 'tasdiq');
		needs.forEach(k => {
			l.tasdiq.push({ k, h: 'kutilmoqda', t: Time.now(), by: session.user, izoh: k === 'qarz' ? 'Mijozning muddati o‘tgan qarzi bor' : '' });
			Data.log(l, k === 'marja' ? `Past marja (${F.pct(q.marja)}) — rahbar tasdig‘i so‘raldi` : 'Muddati o‘tgan qarzli mijoz — rahbar tasdig‘i so‘raldi', 'tasdiq');
		});
		Data.save();
		ui.f.ar = null;
		Object.assign(ui, { page: 'yuklar', yf: { mode: 'all', holat: 'ochiq', prob: false, q: '' } });
		Views.render();
		Steps.drawer('yuk', l.id);
		if (needs.length) UI.toast('Ariza saqlandi va rahbar tasdig‘iga yuborildi');
		else Actions.openAssign({ id: l.id });
	},

	/* tashuvchi biriktirish */
	openAssign(d) {
		const l = Data.yuk(d.id);
		if (l.tasdiq.some(t => t.h === 'kutilmoqda')) return UI.toast('Avval rahbar tasdig‘i kerak');
		ui.f.as = { id: l.id, mode: l.mode, crid: '', drv: '', tel: '', mashina: '', tirkama: '', unit: '', stavka: l.stavka };
		ui.modalForm = 'assignForm';
		UI.modal('Tashuvchi biriktirish', null, `<div class="as-st">${UI.field('Stavka', UI.unit(UI.num('as.stavka', 'step="10"'), '$'), { key: 'as.stavka' })}<small class="hint">arizada ${F.usd(l.stavka)}</small></div><span class="grow"></span>${UI.buttons('Biriktirish', 'saveAssign')}`, true);
	},
	pickCarrier(d) {
		const f = ui.f.as, k = Data.carrier(d.v), l = Data.yuk(f.id);
		Object.assign(f, { crid: k.id, drv: k.drv[0] || '', tel: k.drv.length ? k.tel : '', mashina: k.mash[0] || '', tirkama: k.mash.length ? '40 ' + (3000 + k.mash[0].length * 311) + ' TR' : '',
			unit: l.mode === 'temir' ? (l.body === 'vagon' ? '6' + String(l.id * 7349).padStart(7, '1').slice(0, 7) : 'ATGU' + String(400000 + l.id * 37) + '5') : l.mode === 'havo' ? '250-' + String(4100 + l.id) + ' ' + String(7000 + l.id * 3) : '' });
		UI.refresh('mbody');
	},
	saveAssign() {
		if (!Forms.valid('as')) return;
		const f = ui.f.as, l = Data.yuk(f.id), k = Data.carrier(f.crid), was = l.stavka;
		l.crid = k.id; l.stavka = Math.round(+f.stavka);
		if (l.mode === 'avto') { l.drv = { ism: f.drv.trim(), tel: f.tel.trim() || k.tel }; l.mashina = f.mashina.trim(); l.tirkama = f.tirkama.trim(); }
		else if (l.mode === 'temir') { if (l.body === 'vagon') l.vagon = f.unit.trim(); else l.kont = f.unit.trim(); }
		else l.awb = f.unit.trim();
		Data.log(l, `Tashuvchi biriktirildi: ${k.nom}, stavka ${F.usd(l.stavka)}${was !== l.stavka ? ` (arizada ${F.usd(was)})` : ''}`, 'tashuvchi');
		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
		UI.toast(l.mode === 'avto' ? 'Biriktirildi. Haydovchiga bot havolasi yuboriladi' : 'Tashuvchi biriktirildi');
	},

	/* bosqichlar (logist qo‘lda) */
	markStage(d) {
		const l = Data.yuk(d.id), i = Calc.done(l);
		if (i >= 6 || !Steps.guard()) return;
		Steps.stage(l, i, 'logist');
		Data.save(); Views.render(); UI.refresh('layer');
		UI.toast(`Belgilandi: ${Calc.stage(l, i)}`);
	},
	undoStage(d) { ui.f.undo = { id: +d.id, sabab: '' }; ui.modalForm = 'undoForm'; UI.modal('Bosqichni bekor qilish', null, UI.buttons('Bekor qilish', 'saveUndo', 'Orqaga')); },
	saveUndo() {
		if (!Forms.valid('undo')) return;
		const l = Data.yuk(ui.f.undo.id), i = Calc.done(l) - 1;
		if (i < 0) return UI.closeModal();
		const nm = Calc.stage(l, i);
		l.st[i] = null;
		Data.log(l, `Bosqich bekor qilindi: ${nm} — ${ui.f.undo.sabab.trim()}`, 'bosqich');
		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
	},

	/* prostoy: logist so‘raydi → rahbar tasdiqlaydi (rahbar o‘zi qo‘ysa — darhol) */
	openProstoy(d) {
		const l = Data.yuk(d.id), b = Calc.border(l);
		if (!b) return;
		ui.f.pro = { id: l.id, kun: Math.max(1, b.pk), tarif: db.set.tarif, tsum: '' };
		ui.modalForm = 'prostoyForm';
		UI.modal('Prostoyni mijozga qo‘yish', null, UI.buttons(session.role === 'rahbar' ? 'Mijozga qo‘yish' : 'Tasdiqqa yuborish', 'saveProstoy'));
	},
	saveProstoy() {
		if (!Forms.valid('pro')) return;
		const f = ui.f.pro, l = Data.yuk(f.id), R = session.role === 'rahbar', sum = Math.round(+f.kun * +f.tarif), now = Time.now();
		l.extras.push({ k: 'prostoy', kun: +f.kun, sum, holat: R ? 'tasdiq' : 'sorov', t: now, tt: R ? now : null, by: session.user, ok: R ? session.user : null });
		Data.log(l, R ? `Prostoy ${f.kun} kun × ${F.usd(+f.tarif)} = ${F.usd(sum)} mijoz hisobiga qo‘shildi` : `Prostoy ${F.usd(sum)} mijozga — rahbar tasdig‘i so‘raldi`, 'prostoy');
		if (+f.tsum > 0) { l.cpro.push({ sum: Math.round(+f.tsum), t: now, izoh: `chegarada ${Calc.border(l).kun} kun` }); Data.log(l, `Tashuvchi prostoyi: ${F.usd(+f.tsum)} — xarajatga yozildi`, 'xarajat'); }
		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
		UI.toast(R ? `Mijoz hisobiga qo‘shildi: ${F.usd(sum)}` : 'Rahbar tasdig‘iga yuborildi');
	},
	approve(d) {
		const [id, k] = String(d.id).split(':'), l = Data.yuk(id), now = Time.now();
		if (k === 'p') {
			const e = l.extras.find(x => x.holat === 'sorov');
			if (!e) return;
			Object.assign(e, { holat: 'tasdiq', tt: now, ok: session.user });
			Data.log(l, `Prostoy ${F.usd(e.sum)} tasdiqlandi — mijoz hisobiga qo‘shildi`, 'prostoy');
		} else {
			l.tasdiq.filter(t => t.h === 'kutilmoqda').forEach(t => { Object.assign(t, { h: 'tasdiq', ok: session.user, tt: now }); });
			Data.log(l, `Narx tasdiqlandi (marja ${F.pct(Calc.marja(l))}) — tashuvchi biriktirish mumkin`, 'tasdiq');
		}
		Data.save(); Views.render(); UI.refresh('layer');
		UI.toast('Tasdiqlandi');
	},
	reject(d) {
		const [id, k] = String(d.id).split(':'), l = Data.yuk(id);
		UI.confirm(k === 'p' ? 'Prostoy mijozga qo‘yilmaydi. Logist xabardor bo‘ladi.' : 'Narx rad etiladi — logist mijoz bilan qayta kelishadi.', 'Rad etish', () => {
			if (k === 'p') { const e = l.extras.find(x => x.holat === 'sorov'); if (e) e.holat = 'rad'; Data.log(l, 'Prostoy so‘rovi rad etildi', 'prostoy'); }
			else { l.tasdiq.filter(t => t.h === 'kutilmoqda').forEach(t => { t.h = 'rad'; }); l.tasdiq.push({ k: 'marja', h: 'kutilmoqda', t: Time.now(), by: l.logist, izoh: 'Rad etildi — narx qayta kelishilishi kerak' }); Data.log(l, 'Narx rad etildi — qayta kelishish kerak', 'tasdiq'); }
			Data.save(); Views.render(); UI.refresh('layer');
		});
	},
	openCost(d) { ui.f.cost = { id: +d.id, t: 'Broker', sum: '' }; ui.modalForm = 'costForm'; UI.modal('Xarajat qo‘shish', null, UI.buttons('Qo‘shish', 'saveCost')); },
	costT(d) { ui.f.cost.t = d.v; UI.refresh('mbody'); },
	saveCost() {

		l.xarajat.push({ t: f.t, sum: Math.round(+f.sum) });

		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
	},

	/* to‘lovlar */
	openPay(d) {
		const c = Data.client(d.id);

		if (!Forms.valid('cpay')) return;

	openRemind(d) { ui.f.rem = { cid: d.id }; ui.modalForm = 'remindForm'; UI.modal('Eslatma matni', null, `<button class="btn" data-act="closeModal">Yopish</button><button class="btn pri" data-act="copyText" data-v="rem">${UI.icon('copy')}Nusxa olish</button>`); },
	openTrack(d) { ui.f.trk = { id: +d.id }; ui.modalForm = 'trackForm'; UI.modal('Mijozga kuzatuv havolasi', null); },
	openAkt(d) { ui.akt = { from: Time.monthStart(-2), to: Time.today }; Steps.drawer('akt', d.id); },
	setAkt(d) {
		const p = { oy: [Time.monthStart(0), Time.today], otgan: [Time.monthStart(-1), Time.add(-1, Time.monthStart(0))], '3oy': [Time.monthStart(-2), Time.today], yil: [Time.monthStart(-5), Time.today] }[d.v];
		ui.akt = { from: p[0], to: p[1] }; UI.refresh('layer');
	},
	printAkt() { window.print(); },

	/* hujjatlar */
	openDoc(d) {
		const [id, k] = String(d.id).split(':'), l = Data.yuk(id), x = l.docs[k] || {};
		const st = Calc.docState(l, k);
		ui.f.doc = { lid: l.id, k, h: st === 'bor' || st === 'tekshir' ? st : 'yoq', no: x.no || '', sana: x.sana ? Time.dayOf(x.sana) : Time.today, broker: x.broker || l.broker, rule: false, need: Calc.docNeed(l, k) };
		ui.f.rule = { sabab: '' };
		ui.modalForm = 'docForm';
		UI.modal(`${Calc.docName(l, k)} · ${l.no}`, null, st === 'kerakmas' && !can('openRule') ? '<button class="btn" data-act="closeModal">Yopish</button>' : UI.buttons('Saqlash', 'saveDoc'));
	},
	docState(d) { ui.f.doc.h = d.v; UI.refresh('mbody'); },
	docNeed(d) { ui.f.doc.need = d.v === 'ha'; UI.refresh('mbody'); },
	openRule(d) { ui.f.doc.rule = d.v !== '0'; ui.f.doc.need = !Calc.docNeed(Data.yuk(ui.f.doc.lid), ui.f.doc.k); UI.refresh('mbody'); },
	saveRule() {
		if (!Forms.valid('rule')) return;
		const f = ui.f.doc, l = Data.yuk(f.lid);
		l.rule[f.k] = { need: f.need, sabab: ui.f.rule.sabab.trim(), by: session.user, t: Time.now() };
		Data.log(l, `Qoida: ${Calc.docName(l, f.k)} — ${f.need ? 'kerak' : 'kerak emas'} (${l.rule[f.k].sabab})`, 'qoida');
		f.rule = false; ui.f.rule.sabab = '';
		Data.save(); Views.render(); UI.refresh('layer', 'mbody');
	},
	saveDoc() {
		const f = ui.f.doc, l = Data.yuk(f.lid);
		if (Calc.docState(l, f.k) !== 'kerakmas') {
			const was = Calc.docState(l, f.k), x = l.docs[f.k] || { foto: [] };
			l.docs[f.k] = { ...x, h: f.h, no: f.no.trim(), sana: f.sana ? Time.day0(f.sana) + 12 * HOUR : Time.now(), ...(f.k === 'gtd' ? { broker: f.broker } : {}) };
			if (f.h === 'yoq') delete l.docs[f.k].h;
			if (was !== Calc.docState(l, f.k) || f.no) Data.log(l, `${Calc.docName(l, f.k)}: ${DOC_ST[Calc.docState(l, f.k)].t.toLowerCase()}${f.no ? ' · ' + f.no.trim() : ''}`, 'hujjat');
			if (f.k === 'pod' && f.h === 'bor' && Calc.done(l) === 6 && !l.aslCmr) { l.aslCmr = Time.now(); Data.log(l, `${MODES[l.mode].pod} qaytdi — mijoz to‘lov muddati boshlandi`, 'hujjat'); }
		}
		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
		UI.toast('Saqlandi');
	},
	docSample() { const f = ui.f.doc, l = Data.yuk(f.lid); Steps.docPhoto(l, f.k, Steps.sample(Calc.docName(l, f.k))); },
	cmrBack(d) {
		const l = Data.yuk(d.id);
		if (l.aslCmr || Calc.done(l) < 6) return;
		l.aslCmr = Time.now();
		l.docs.pod = { ...(l.docs.pod || { foto: [] }), h: 'bor', sana: l.aslCmr };
		Data.log(l, `${MODES[l.mode].pod} qaytdi — mijoz to‘lov muddati boshlandi`, 'hujjat');
		Data.save(); UI.closeModal(); Views.render(); UI.refresh('layer');
		UI.toast(`${MODES[l.mode].pod} qaytdi deb belgilandi`);
	},

	/* haydovchi boti */
	botStep(d) {
		const l = Views.driverLoad(), i = +d.v;
		if (!l || !Views.botButtons(l).includes(i) || !Steps.guard()) return;
		Steps.botSay('drv', BOT_BTN[i]);
		if (PHOTO_STEPS.includes(i)) {
			Steps.botSay('bot', i === 5 ? 'Imzolangan CMR suratini yuboring — qabul qiluvchi imzosi va muhri ko‘rinsin.' : 'CMR suratini yuboring.');
			ui.bot.wait = i;
		} else {
			Steps.stage(l, i, 'haydovchi');
			Steps.botSay('bot', Steps.botReply(l, i));
		}
		Data.save(); Views.render(); Steps.chatEnd();
	},
	botSample(d) { Steps.botPhoto(+d.v, Steps.sample('CMR')); },
	botCancel() { ui.bot.wait = null; Steps.botSay('bot', 'Bekor qilindi. Tayyor bo‘lganda tugmani qayta bosing.'); Data.save(); Views.render(); Steps.chatEnd(); }
};

/* ===== Fields — forma maydonlari o‘zgarishi (manba: d.js) =====
	 Maydon o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) — faqat bog‘liq bo‘laklar yangilanadi. */
const Fields = {
	setVal(key, v) { const el = $(`[data-f="${key}"]`); if (el) el.value = v; },
	// Mijoz tanlanganda: uning odatiy yuki va yo‘nalishi taklif qilinadi
	arClient() {
		const f = ui.f.ar, c = Data.client(f.cid);
		if (!c.id) return;
		f.yuk = c.cargo[0];
		if (!f.rk) Fields.arRoute(c.routes[0]);
	},
	arRoute(rk) {
		const f = ui.f.ar, r = Data.route(rk);
		f.rk = rk;
		// Boshqa yo‘nalish: stavka qo‘lda kiritiladi (o‘rtacha narx yo‘q)
		if (rk === 'other') { Object.assign(f, { stavka: '', fraxt: '', ustama: '', xarajat: 100 }); return; }
		if (!r) return;
		f.tonna = r.kg ? 1.5 : r.body === 'vagon' ? 64 : r.body === 'kont' ? 22 : 20;
		if (CARGO[f.yuk].ref && r.body !== 'ref' && !r.kg) f.yuk = (Data.client(f.cid).cargo || []).find(g => !CARGO[g].ref) || 'mayiz';
		Fields.arPrices();
	},
	arPrices() {
		const f = ui.f.ar, r = Data.route(f.rk), kg = r.kg ? (+f.tonna || 0) * 1000 : 1;
		f.stavka = Math.round(r.stavka * kg / 10) * 10;
		f.xarajat = r.mode === 'avto' ? (r.davlat === 'RU' ? 100 : 60) : 90;
		f.fraxt = Math.round(r.fraxt * kg / 10) * 10;
		f.ustama = +Calc.quote(f.stavka, f.xarajat, f.fraxt).ustama.toFixed(1);
	},
	live: {
		ar(k) {
			const f = ui.f.ar;
			if (k === 'cq') { if (f.cid && f.cq !== Data.client(f.cid).nom) f.cid = ''; UI.refresh('ar-cl'); return; }
			if (k === 'rk') { Fields.arRoute(f.rk); UI.refresh('layer'); return; }
			if (k === 'tb') { if (f.rk === 'other') { f.tonna = f.tb.startsWith('havo') ? 1.5 : f.tb.endsWith('vagon') ? 64 : 20; Fields.setVal('ar.tonna', f.tonna); } UI.refresh('layer'); return; }
			if (k === 'tonna' && Data.route(f.rk) && Data.route(f.rk).kg) { Fields.arPrices(); ['stavka', 'xarajat', 'fraxt', 'ustama'].forEach(x => Fields.setVal('ar.' + x, f[x])); }
			if (k === 'ustama') { f.fraxt = Calc.fromUstama(f.stavka, f.xarajat, f.ustama); Fields.setVal('ar.fraxt', f.fraxt); }
			if (['stavka', 'xarajat', 'fraxt'].includes(k)) { f.ustama = +Calc.quote(f.stavka, f.xarajat, f.fraxt).ustama.toFixed(1); Fields.setVal('ar.ustama', f.ustama); }
			UI.refresh('ar-sum', 'ar-offer');
			const btn = $('[data-act=saveAriza]');
			if (btn) btn.textContent = Views.arizaNeeds(f).length ? 'Saqlash va tasdiqqa yuborish' : 'Saqlash va tashuvchi tanlash';
		},
		pro() { const f = ui.f.pro, el = $('#pro-sum'); if (el) el.textContent = F.usd((+f.kun || 0) * (+f.tarif || 0)); },
		pay(k) { const el = $('#pay-eq'), f = ui.f.pay; if (k === 'lid') { f.sum = Views.payMax(f); if (f.val === 'UZS') f.sum *= db.set.kurs; Fields.setVal('pay.sum', f.sum); } if (el) el.textContent = f.val === 'UZS' ? `= ${F.usd(Views.payUsd(f))} (kurs ${F.num(db.set.kurs)})` : `so‘mda ${F.som(Views.payUsd(f) * db.set.kurs)}`; },
		cpay(k) { const f = ui.f.cpay; if (k === 'lid') { f.sum = Views.cpayMax(f); Fields.setVal('cpay.sum', f.sum); } }
	},
	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file' || t.type === 'date';
		if (e.type !== (discrete ? 'change' : 'input')) return;
		if (t.id === 'pin') {
			$('#pinerr').textContent = '';
			if (t.value.length === 4) Actions.login();
		} else if (data.f) {
			const [form, k] = data.f.split('.');
			if (!ui.f[form]) return;
			ui.f[form][k] = t.type === 'checkbox' ? t.checked : 'num' in data && t.value !== '' ? +t.value : t.value;
			Forms.show(data.f);
			if (Fields.live[form]) Fields.live[form](k);
		} else if (data.filter) {
			if (can(data.filter)) Actions[data.filter]({ v: t.value });
		} else if (data.search) {
			if (data.search === 'loads') { ui.yf.q = t.value; ui.limit = 40; UI.refresh('list'); }
			if (data.search === 'clients') { ui.cq = t.value; UI.refresh('clist'); }
		} else if ('gsearch' in data) {
			ui.gs.q = t.value;
			UI.refresh('gs-res');
		} else if (data.set) {
			Fields.setting(t);
		} else if (data.docphoto && t.files && t.files[0]) {
			if (!can('saveDoc')) return;
			const [id, k] = data.docphoto.split(':');
			Fields.photo(t.files[0], url => Steps.docPhoto(Data.yuk(id), k, url));
		} else if (data.botphoto && t.files && t.files[0]) {
			if (!can('botStep')) return;
			Fields.photo(t.files[0], url => Steps.botPhoto(+data.botphoto, url));
		}
	},
	// Sozlamalar: qoidalar, yo‘nalish narxlari, mijoz to‘lov sharti. Faqat rahbar.
	setting(t) {
		if (!SETTINGS_ROLES.includes(session.role)) return UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
		const [kind, a, b] = t.dataset.set.split('.'), v = t.type === 'checkbox' ? t.checked : +t.value;
		if (t.type !== 'checkbox' && (t.value === '' || !isFinite(v) || v < 0)) return t.setAttribute('aria-invalid', '');
		t.removeAttribute('aria-invalid');
		if (kind === 'set') db.set[a] = v;
		else if (kind === 'rt') Data.route(a)[b] = v;
		else if (kind === 'cl') Data.client(a).shart[b] = b === 'avans' ? Math.min(100, v) : v;
		Data.log(null, `Sozlama o‘zgartirildi: ${t.closest('tr').querySelector('td').firstChild.textContent.trim()}`, 'sozlama');
		Data.save();
	},
	// Surat: ≤ 1280 px ga kichraytirilib, JPEG (0,7) ko‘rinishida qurilmada saqlanadi
	photo(file, done) {
		const img = new Image(), url = URL.createObjectURL(file);
		img.onload = () => {
			const k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
			cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
			cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
			URL.revokeObjectURL(url);
			done(cv.toDataURL('image/jpeg', 0.7));
		};
		img.onerror = () => { URL.revokeObjectURL(url); UI.toast('Bu faylni surat sifatida ochib bo‘lmadi'); };
		img.src = url;
	}
};

/* ===== Hodisalar: bosish, yozish, klaviatura (manba: d.js) ===== */

// Har amal ruxsat jadvalidan o‘tadi (CAN): tugma yashirilgani yetarli emas.
const deny = name => {
	if ([...GUEST_ACTIONS, ...BASE_ACTIONS, ...Object.values(CAN).flat()].includes(name)) UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
	else if (['localhost', '127.0.0.1'].includes(location.hostname)) console.debug('Jadvalda yo‘q amal:', name);
};
Object.keys(Actions).forEach(name => {
	const run = Actions[name];
	Actions[name] = d => can(name) ? run(d || {}) : deny(name);
});

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (Actions[name]) Actions[name](el.dataset);
	else deny(name);
});

/* ===== Router — manzil satri (manba: d.js) =====
	 #/sahifa yoki #/sahifa/karta/id; mijoz sahifasi — #/kuzatuv/kod (login’siz). Brauzerning «orqaga» tugmasi sahifa va kartani qaytaradi. */
const Router = {
	hash: () => ui.track ? '#/kuzatuv/' + ui.track : !ROLES[session.role] ? '' : '#/' + ui.page + (ui.drawer ? `/${ui.drawer.type}/${ui.drawer.id}` : ''),
	sync() {
		const h = Router.hash();
		if (h !== location.hash && (h || location.hash)) history[location.hash ? 'pushState' : 'replaceState'](null, '', h || location.pathname + location.search);
	},
	read() {
		const [page, type, id] = decodeURIComponent(location.hash.slice(2)).split('/'), role = ROLES[session.role];
		if (page === 'kuzatuv') { ui.track = type; return true; }
		ui.track = null;
		if (!role || !pageOk(role, page)) return false;
		ui.page = page;
		ui.drawer = !role.tor && ['yuk', 'mijoz', 'tashuvchi'].includes(type) && id ? { type, id: type === 'yuk' ? +id : id } : null;
		if (type === 'akt' && id && money()) { ui.akt = ui.akt || { from: Time.monthStart(-2), to: Time.today }; ui.drawer = { type, id }; }
		return true;
	}
};
window.addEventListener('popstate', () => { UI.closeModal(); Steps.closePops(); ui.menu = false; if (Router.read() || !session.role) Views.render(); else Router.sync(); });
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { pin: Actions.login, ariza: Actions.saveAriza }[e.target.dataset.form];
	if (!submit) return;
	e.preventDefault();
	submit();
});
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	if ($('#modal').innerHTML) UI.closeModal();
	else if (ui.gs.q || ui.gs.open) Actions.closePops();
	else if (ui.drawer) Actions.closeDrawer();
	else if (ui.menu) Actions.toggleMenu();
});
matchMedia('(max-width:820px)').addEventListener('change', () => { if (session.role) Views.render(); });
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; if (session.role) Views.render(); }));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; });
// Namuna soati yuradi: daqiqada bir marta kechikish va prostoy kunlari yangilanadi (forma ochiq bo‘lsa — tegilmaydi)
setInterval(() => { if (session.role && !ui.track && !(ui.drawer && ui.drawer.type === 'ariza') && !$('#modal').innerHTML && !ui.menu && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)) { Views.render(); if (session.role === 'haydovchi') Steps.chatEnd(); } }, 60000);

/* ===== Ishga tushirish (manba: d.js) ===== */

Data.init();
Router.read();
Views.render();
if (session.role === 'haydovchi') Steps.chatEnd();

// Service worker faqat http(s) da; yangi versiya kelsa — yozilayotgan narsa bo‘lmasa bir marta o‘zi yangilanadi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !new URLSearchParams(location.search).has('sinov')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
	const had = !!navigator.serviceWorker.controller;
	const typing = () => !!document.querySelector('.modal') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
	let reloaded = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (!had || reloaded) return;
		if (typing()) { UI.prompt('Yangi versiya bor', 'Yangilash', 'reloadApp'); return; }
		reloaded = true;
		location.reload();
	});
}

/* ===== Sinov rejimi (build.mjs yozadi): manzilda ?sinov bo‘lsa, modullar window ga chiqariladi ===== */
if (new URLSearchParams(location.search).has('sinov')) {
	Object.assign(window, { DAY, HOUR, MIN, MONTHS, DEMO_START, DEMO_END, Time, ROLES, pageOk, money, MODES, BODY, BOT_BTN, CARGO, MDH, DOCS, DOC_ST, HOLAT, BUCKETS, USUL, XARAJAT, EVENTS, GUEST_ACTIONS, BASE_ACTIONS, DESK_ACTIONS, MONEY_VIEW, LOGIST_WORK, CAN, SETTINGS_ROLES, can, ui, Data, Calc, $, NB, F, LOGO, UI, Forms, PAGES, Views, KIND, FIRMA, PHOTO_STEPS, Steps, Actions, Fields, deny, Router });
	Object.defineProperties(window, {
		db: { get: () => db, set: v => { db = v; } },
		session: { get: () => session, set: v => { session = v; } }
	});
}
})();
</script>
