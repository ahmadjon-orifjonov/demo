	/* --- yordamchi satrlar --- */
	who: uid => F.first(Data.userById(uid).ism),
	actor(e) {
		if (e.by === 'haydovchi') { const l = Data.yuk(e.lid); return l && l.drv ? `Haydovchi ${F.short(l.drv.ism)}` : 'Haydovchi'; }
		if (!e.uid) return 'Bot';
		return F.short(Data.userById(e.uid).ism);
	},
	// Keyingi qadam va mas’ul — ro‘yxat va kartada bir xil
	next(l) {
		const h = Calc.holat(l), d = Calc.done(l), lg = Views.who(l.logist);
		if (l.tasdiq.some(t => t.h === 'kutilmoqda')) return { t: 'Rahbar tasdig‘i (marja)', who: 'Akrom' };
		if (l.extras.some(e => e.holat === 'sorov')) return { t: 'Prostoy tasdig‘i', who: 'Akrom' };
		if (Calc.prostoyNeed(l)) return { t: 'Prostoyni mijozga qo‘yish', who: lg };
		if (h === 'ariza') {
			if (!l.crid) return { t: 'Tashuvchi biriktirish', who: lg, m: 'yuklash ' + F.when(l.yukT) };
			const miss = DOCS.filter(x => Calc.docState(l, x.k) === 'yoq');
			if (miss.length) return { t: `${Calc.docName(l, miss[0].k)} tayyorlash`, who: 'Gulnora', m: 'yuklashgacha' };
			return { t: `Yuklash, ${F.when(l.yukT)}`, who: l.mode === 'avto' ? 'haydovchi' : lg };
		}
		if (h === 'faol') return { t: Calc.stage(l, d), who: l.mode === 'avto' ? 'haydovchi (bot)' : lg, m: 'reja ' + F.date(l.plan[d]) };
		if (h === 'topshirildi') {
			if (!l.aslCmr) return { t: `${MODES[l.mode].pod} qaytishi`, who: 'Gulnora', m: `${Math.floor((Time.now() - l.st[5].t) / DAY)} kun` };
			if (Calc.debt(l)) { const due = Calc.dueOf(l); return { t: money() ? `Mijoz to‘lovi ${F.usd(Calc.debt(l))}` : 'Mijoz to‘lovi', who: lg, m: due ? 'muddat ' + F.date(due) : '' }; }
			if (Calc.cdebt(l)) return { t: money() ? `Tashuvchiga ${F.usd(Calc.cdebt(l))}` : 'Tashuvchiga to‘lov', who: lg };
		}
		return { t: h === 'yopildi' ? 'yo‘q — yuk yopilgan, hisob-kitob to‘liq' : '—', who: '' };
	},
	eta(l) {
		const d = Calc.done(l), late = Calc.late(l);
		if (d === 6) return `<span class="muted">${F.date(l.st[5].t)}</span>`;
		if (d === 0) return `<span class="muted">yuklash</span> ${F.date(l.yukT)}`;
		return `${F.date(l.plan[5])}${late ? `<span class="sub red-t">${late} kun kech</span>` : ''}`;
	},
	docsN(l) { const c = Calc.docCount(l); return `<span class="nowrap${c.miss ? ' red-t strong' : ''}">${c.n}/${c.m}</span>`; },

	/* --- Bugun --- */
	// «Diqqat»: muammo → pul ta’siri → mas’ul · muddat → bitta amal. Ustuvorlik bo‘yicha.
	attention() {
		const out = [], R = session.role === 'rahbar', debtLoads = new Set();
		const add = (p, tone, icon, t, m, btn, act, id, extra = {}) => out.push({ p, tone, icon, t, m, btn, act, id, ...extra });
		db.loads.forEach(l => Calc.issues(l).forEach(x => {
			const c = Data.client(l.cid), lg = Views.who(l.logist);
			if (x.k === 'prostoy') add(1, 'red', 'timer', `Chegarada ${x.kun} kun — prostoy ${x.pk} × ${F.usd(db.set.tarif)} = ${F.usd(x.pul)}`, `${l.no} · ${c.nom} · mas’ul ${lg} · bugun`, 'Mijozga qo‘yish', 'openProstoy', l.id, { key: 'p' + l.id });
			if (x.k === 'ptasdiq') add(2, 'amb', 'stamp', `Prostoy ${F.usd(x.e.sum)} mijozga — tasdiq kutmoqda`, `${l.no} · so‘radi ${Views.who(x.e.by)} · ${F.ago(x.e.t)}`, R ? 'Tasdiqlash' : 'Ochish', R ? 'approve' : 'openLoad', R ? `${l.id}:p` : l.id);
			if (x.k === 'tasdiq') add(2, 'amb', 'stamp', `Past marja ${F.pct(Calc.marja(l))} — ekspeditsiya haqi ${F.usd(Calc.haq(l))}`, `${l.no} · ${c.nom} · so‘radi ${Views.who(x.a.by)} · yuklash ${F.day(l.yukT)}`, 'Ko‘rish', 'openLoad', l.id);
			if (x.k === 'tashuvchi') add(3, 'red', 'truck', `${F.day(l.yukT)[0].toUpperCase() + F.day(l.yukT).slice(1)} yuklash, tashuvchi yo‘q — fraxt ${F.usd(l.fraxt)}`, `${l.no} · ${F.route(l)} · mas’ul ${lg} · ${Time.hm(l.yukT)} gacha`, 'Biriktirish', 'openAssign', l.id);
			if (x.k === 'hujjat' && l.yukT - Time.now() < 2 * DAY && Calc.done(l) === 0) add(3, 'red', 'file', `${F.day(l.yukT)[0].toUpperCase() + F.day(l.yukT).slice(1)} ${Time.hm(l.yukT)} yuklash — ${x.list.map(k => Calc.docFull(l, k).replace(/^[A-Z][a-z]/, w => w.toLowerCase())).join(', ')} yo‘q`, `${l.no} · ${CARGO[l.yuk].t.toLowerCase()}, fraxt ${F.usd(l.fraxt)} · mas’ul Gulnora · yuklashgacha`, 'Ochish', 'openLoad', l.id);
			if (x.k === 'kech' && !Calc.prostoyNeed(l)) add(4, 'red', 'clock', `${l.mode === 'temir' ? 'Vagon' : 'Yuk'} ${x.kun} kun kechikmoqda — mijozga yangi ETA kerak`, `${l.no} · ${F.route(l)} · fraxt ${F.usd(l.fraxt)} · mas’ul ${lg}`, 'Kuzatuv havolasi', 'openTrack', l.id);
			if (x.k === 'cmr') add(6, 'amb', 'file', `${MODES[l.mode].pod} ${x.kun} kun qaytmadi — ${F.usd(Calc.debt(l))} to‘lov to‘xtab turibdi`, `${l.no} · ${c.nom} · mas’ul Gulnora`, 'Ochish', 'openLoad', l.id, { lid: l.id });
		}));
		db.clients.forEach(c => {
			const sum = Calc.clientOverdue(c);
			if (!sum) return;
			const ls = Calc.clientLoads(c).filter(l => Calc.overdue(l) > 0), days = Math.max(...ls.map(Calc.maxOver)), why = ls.map(Calc.reason).includes('asl CMR kutilmoqda') ? 'asl CMR kutilmoqda' : 'muddati o‘tgan';
			ls.forEach(l => debtLoads.add(l.id));
			add(5, 'red', 'coin', `${c.nom} qarzi ${F.usd(sum)} — ${days} kun o‘tdi`, `${why} · ${ls.map(l => l.no).join(', ')} · mas’ul ${Views.who(ls[0].logist)}`, 'Eslatma matni', 'openRemind', c.id);
		});
		const miss = Calc.missingLoads();
		if (miss.length) add(7, 'amb', 'file', `Hujjati yetishmaydi — ${miss.length} yuk, ${Calc.sum(miss, l => Calc.docCount(l).miss)} hujjat`, `${miss.slice(0, 3).map(l => `${l.no} ${DOCS.filter(x => Calc.docState(l, x.k) === 'yoq').map(x => Calc.docName(l, x.k)).join(', ')}`).join(' · ')} · mas’ul Gulnora`, 'Matritsa', 'showMissing', '', { key: 'h' });
		return out.filter(a => !(a.lid && debtLoads.has(a.lid))).sort((a, b) => a.p - b.p);
	},
	today() {
		const pr = Calc.problems(), tr = Calc.transit(), ym = Time.month(Time.today), mon = Calc.month(ym);
		const kpi = (act, v, label, value, sub, tone = '') => `<button class="card kpi" data-act="${act}" data-v="${v}"><span class="l">${label}</span><span class="v${tone ? ' ' + tone : ''}">${value}</span><span class="s">${sub}</span></button>`;
		const over = Calc.totalOverdue();
		const kpis = `<div class="kpis">
			${kpi('showLoads', 'prob', 'Muammoli yuklar', F.num(pr.length), `yo‘lda ${tr.length} ta, ${F.t(Calc.sum(tr, l => l.tonna))}`)}
			${kpi('showPay', 'm', 'Mijozlar qarzi', F.usd(Calc.totalDebt()), over ? `muddati o‘tgan: <b class="red-t">${F.usd(over)}</b>` : 'muddati o‘tgani yo‘q')}
			${kpi('showPay', 't', 'Tashuvchilarga qarz', F.usd(Calc.totalCDebt()), `7 kun ichida: ${F.usd(Calc.cdue7())}`)}
			${kpi(can('setReport') && session.role === 'rahbar' ? 'go' : 'showLoads', session.role === 'rahbar' ? 'hisobot' : 'topshirildi', `Ekspeditsiya haqi, ${MONTHS[+ym.slice(5) - 1]}`, F.usd(mon.haq), `1–${+Time.today.slice(8)}-${F.mon(+ym.slice(5) - 1).toLowerCase()} · ${mon.n} yuk · ${MONTHS[(+ym.slice(5) + 10) % 12]}: ${F.usd(Calc.month(Time.month(Time.monthStart(-1))).haq)}`)}
		</div>`;
		const att = Views.attention(), shown = ui.attAll ? att : att.slice(0, 5);
		const attCard = UI.plain(`Diqqat<span class="c">${att.length}</span>`, att.length ? `<div class="rows">${shown.map(a => `<div class="item att">
			<span class="ai ${a.tone}">${UI.icon(a.icon)}</span><span class="x"><span class="t">${UI.esc(a.t)}</span><span class="m">${UI.esc(a.m)}</span></span>
			<button class="btn s" data-act="${a.act}" data-id="${a.id}">${a.btn}</button></div>`).join('')}</div>
			${att.length > 5 ? `<div class="more-row"><button class="link sm" data-act="showAtt">${ui.attAll ? 'Qisqartirish' : `Yana ${att.length - 5} ta`}</button></div>` : ''}` : UI.empty('Hal qilinmagan masala yo‘q', 'check'), { id: 'diqqat' });
		const list = tr.slice().sort((a, b) => Calc.late(b) - Calc.late(a) || a.plan[5] - b.plan[5]);
		const transit = UI.plain(`Yo‘ldagi yuklar<span class="c">${tr.length}</span>`, `<div class="rows">${list.map(l => `<button class="row-b tr" data-act="openLoad" data-id="${l.id}">
			${UI.mode(l)}<span class="x"><span class="t">${UI.esc(F.rshort(l))}</span><span class="m">${l.no} · ${UI.esc(F.cn(Data.client(l.cid)))} · ${UI.esc(F.cargo(l))}</span></span>
			${UI.dots(l, true, false)}<span class="eta">${Calc.late(l) ? UI.flag(`${Calc.late(l)} kun kech`) : `<span class="muted sm">ETA</span> ${F.date(l.plan[5])}`}</span></button>`).join('')}</div>`, { right: `<button class="link sm" data-act="showLoads" data-v="faol">Hammasi</button>` });
		return kpis + `<div class="cols today"><div class="stack">${attCard}${transit}</div><div class="feed-c">${Views.feed()}</div></div>`;
	},
	feed() {
		const all = db.events.filter(e => money() || !/\$/.test(e.m)).slice().reverse(), list = ui.feedAll ? all.slice(0, 40) : all.slice(0, 10);
		const row = e => {
			const l = e.lid && Data.yuk(e.lid), ev = EVENTS[e.tur] || EVENTS.bosqich;
			return `<div class="item ev"><span class="ev-t">${Time.dayOf(e.t) === Time.today ? Time.hm(e.t) : `${F.day(e.t)}<br>${Time.hm(e.t)}`}</span><span class="ai ${ev.c}">${UI.icon(ev.icon)}</span><span class="x">
				<span class="t">${UI.esc(Views.actor(e))}: ${UI.esc(e.m)}</span>${l ? `<button class="m link-m" data-act="openLoad" data-id="${l.id}">${l.no} · ${UI.esc(F.rshort(l))}</button>` : ''}</span></div>`;
		};
		return UI.plain('Hodisalar lentasi', `<div class="rows">${list.length ? list.map(row).join('') : UI.empty('Hali hodisa yo‘q', 'history')}</div>
			${all.length > 10 ? `<div class="more-row"><button class="link sm" data-act="showFeed">${ui.feedAll ? 'Qisqartirish' : 'Yana ko‘rsatish'}</button></div>` : ''}`, { id: 'feed' });
	},

	/* --- Yuklar --- */
	holatList: () => [['ochiq', 'Ochiq'], ['ariza', 'Ariza'], ['faol', 'Yo‘lda'], ['topshirildi', 'Topshirildi'], ['yopildi', 'Yopildi']],
	loadFilter(l, f = ui.yf) {
		const h = Calc.holat(l);
		return (f.mode === 'all' || l.mode === f.mode) && (f.holat === 'ochiq' ? h !== 'yopildi' : h === f.holat) && (!f.prob || Calc.problem(l));
	},
	loads() {
		const f = ui.yf, base = db.loads.filter(l => f.mode === 'all' || l.mode === f.mode);
		const hl = Views.holatList().map(([k, t]) => [k, t, base.filter(l => Views.loadFilter(l, { ...f, holat: k, prob: false })).length]);
		return `${UI.mobile() && can('newAriza') ? UI.head('', `<button class="btn pri" data-act="newAriza">${UI.icon('plus')}Yangi ariza</button>`) : ''}
			<div class="toolbar">${UI.seg('setMode', f.mode, [['all', 'Hammasi'], ['avto', 'Avto'], ['temir', 'Temir yo‘l'], ['havo', 'Havo']], 'tseg')}
				${UI.mobile() ? `<select class="in" data-filter="setHolat" aria-label="Holat">${UI.options(hl.map(([v, t, n]) => [v, `${t} · ${n}`]), f.holat)}</select>` : UI.chips('setHolat', f.holat, hl)}
				<button class="chip prob" data-act="toggleProblem" aria-pressed="${f.prob}">${UI.icon('alert')}Muammoli<b>${base.filter(l => Views.loadFilter(l, { ...f, prob: true })).length}</b></button>
				<span class="grow"></span>${UI.search('loads', f.q, 'Yuk raqami, mijoz, mashina')}</div>
			<section class="card" id="list">${Views.loadsList()}</section>`;
	},
	loadRows() {
		const f = ui.yf, q = f.q.trim().toLowerCase(), qq = q.replace(/\s/g, '');
		const hit = l => !q || l.no.toLowerCase().includes(q) || Data.client(l.cid).nom.toLowerCase().includes(q) || [l.mashina, l.vagon, l.kont, l.awb].some(x => x && x.toLowerCase().replace(/\s/g, '').includes(qq));
		const rank = { faol: 0, ariza: 1, topshirildi: 2, yopildi: 3 };
		return db.loads.filter(l => Views.loadFilter(l) && hit(l)).sort((a, b) => f.holat === 'yopildi' || f.holat === 'topshirildi' ? b.st[5].t - a.st[5].t
			: (Calc.problem(b) - Calc.problem(a)) || rank[Calc.holat(a)] - rank[Calc.holat(b)] || a.yukT - b.yukT);
	},
	loadsList() {
		const rows = Views.loadRows(), shown = rows.slice(0, ui.limit), M = money();
		const nx = l => { const n = Views.next(l); return `${UI.esc(n.t)}<span class="sub">${UI.esc([n.who, n.m].filter(Boolean).join(' · '))}</span>`; };
		const cols = [
			['Yuk', 'c-main', l => `<span class="strong">${l.no}</span><span class="sub cn">${UI.esc(F.cn(Data.client(l.cid)))}</span>`],
			['Yo‘nalish', 'c-sub rt', l => `${UI.mode(l)}<span><span class="nowrap">${UI.esc(F.rshort(l))}</span><span class="sub">${UI.esc(F.cargo(l))} · ${BODY[l.body].toLowerCase()}</span></span>`],
			['Bosqich', 'c-st', l => UI.dots(l)],
			['ETA', 'm-hide nowrap', l => Views.eta(l)],
			['Hujjat', 'm-hide num', l => Views.docsN(l)],
			['Keyingi qadam', 'c-next', nx],
			...(M ? [['Eksp. haqi', 'c-aside num', l => `${F.usd(Calc.haq(l))}<span class="sub">${F.pct(Calc.marja(l))}</span>`]] : [['Holat', 'c-aside', l => UI.holat(l)]])
		];
		return UI.table(cols, shown, { open: l => ['openLoad', l.id], empty: 'Bu filtrda yuk yo‘q', icon: 'yuk', cls: 'loads', rowCls: l => Calc.problem(l) ? 'pr' : '' })
			+ (rows.length > shown.length ? `<div class="more-row"><button class="link sm" data-act="moreLoads">Yana ${Math.min(40, rows.length - shown.length)} ta (jami ${rows.length})</button></div>` : '');
	},

	/* --- Yuk pasporti (o‘ng panel) --- */
	stepper(l) {
		const d = Calc.done(l), late = Calc.late(l), b = Calc.border(l), ci = MODES[l.mode].chegara;
		const items = MODES[l.mode].stages.map((nm, i) => {
			const s = l.st[i], cls = s ? 'done' : i === d ? (late ? 'cur bad' : 'cur') : '';
			const right = s ? `${F.when(s.t)}<small>${s.by === 'haydovchi' ? 'haydovchi (bot)' : UI.esc(Views.who(l.logist))}</small>` : `<span class="muted">reja ${F.date(l.plan[i])}</span>${i === d && late ? `<small class="red-t">${late} kun kechikmoqda</small>` : ''}`;
			const extra = i === ci && b && (b.open || b.kun > 0) ? `<span class="pz${b.open ? ' on' : ''}">${UI.icon('timer')}${b.open ? 'Chegarada' : 'Chegarada turdi'}: ${b.kun} kun${b.pk ? ` · prostoy ${b.pk} kun` : ''}</span>` : '';
			return `<li class="${cls}"><span class="k">${nm}${extra}</span><span class="v">${right}</span></li>`;
		});
		return `<ol class="chain">${items.join('')}</ol>`;
	},
	moneyBlock(l) {
		const c = Data.client(l.cid), k = l.crid && Data.carrier(l.crid), ex = l.extras.filter(e => e.holat === 'tasdiq'), q = Calc.marja(l);
		const row = (t, v, cls = '', sub = '') => `<tr class="${cls}"><td>${t}${sub ? `<span class="sub">${sub}</span>` : ''}</td><td>${v}</td></tr>`;
		const formula = `<table class="calc">
			${row('Mijozdan tushum', F.usd(Calc.rev(l)), 'grp')}
			${row('Fraxt', F.usd(l.fraxt), 'x')}
			${ex.map(e => row(`Prostoy ${e.kun} kun (tasdiqlangan)`, '+' + F.usd(e.sum), 'x')).join('')}
			${row('Tashuvchi stavkasi', '−' + F.usd(l.stavka + Calc.cpro(l)), 'grp', k ? UI.esc(k.nom) : 'tashuvchi biriktirilmagan')}
			${l.cpro.map(x => row(`Tashuvchi prostoyi`, '−' + F.usd(x.sum), 'x', UI.esc(x.izoh))).join('')}
			${row('Boshqa xarajatlar', '−' + F.usd(Calc.costs(l)), 'grp')}
			${l.xarajat.map(x => row(UI.esc(x.t), '−' + F.usd(x.sum), 'x')).join('')}
			<tr class="tot"><td>Ekspeditsiya haqi<span class="sub">marja ${F.pct(q)}</span></td><td>${F.usd(Calc.haq(l))}</td></tr></table>
			${can('openCost') ? `<button class="link sm mt8" data-act="openCost" data-id="${l.id}">${UI.icon('plus')}Xarajat qo‘shish</button>` : ''}`;
		const lines = (list, empty) => list.length ? `<table class="calc lines">${list.map(x => `<tr><td>${x.t2}<span class="sub">${F.date(x.t)}${x.due != null && x.rest ? ` · muddat ${F.date(x.due)}` : ''}</span></td><td>${F.usd(x.sum)}<span class="sub ${x.rest ? (Calc.over(x.due) ? 'red-t' : '') : 'grn-t'}">${x.rest ? (Calc.over(x.due) ? `${Calc.over(x.due)} kun o‘tdi` : `qoldi ${F.usd(x.rest)}`) : 'to‘langan'}</span></td></tr>`).join('')}</table>` : `<p class="muted sm">${empty}</p>`;
		const cl = Calc.lines(l), kl = Calc.clines(l);
		return `${formula}
			<div class="sub-h"><h3>Mijoz hisoblari</h3><span class="muted sm">avans ${c.shart.avans} %, qoldiq ${c.shart.cmr ? 'asl CMR’dan' : 'topshirilgandan'} keyin ${c.shart.kun} kun</span></div>
			${lines(cl, 'Hisob yuklashda ochiladi')}
			<p class="kv mt8"><span>Qarz${Calc.reason(l) ? ` · ${Calc.reason(l)}` : ''}</span><b class="${Calc.overdue(l) ? 'red-t' : ''}">${F.usd(Calc.debt(l))}</b></p>
			${k ? `<div class="sub-h"><h3>Tashuvchiga</h3><span class="muted sm">avans ${k.avans} %, qoldiq topshirilgandan keyin ${k.kun} kun</span></div>
			${lines(kl, 'Hisob yuklashda ochiladi')}<p class="kv mt8"><span>Tashuvchiga qarz</span><b>${F.usd(Calc.cdebt(l))}</b></p>` : ''}`;
	},
	docList(l) {
		return `<div class="dlist">${DOCS.map(x => {
			const st = Calc.docState(l, x.k), d = l.docs[x.k] || {}, rule = l.rule[x.k];
			return `<button class="drow" data-act="openDoc" data-id="${l.id}:${x.k}"><span class="x"><span class="t">${x.k === 'tr' || x.k === 'pod' ? Calc.docName(l, x.k) : x.t}</span><span class="m">${UI.esc([d.no, d.foto && d.foto.length ? `${d.foto.length} surat` : '', rule ? `qoida o‘zgartirilgan: ${rule.sabab}` : ''].filter(Boolean).join(' · '))}</span></span>${UI.doc(st)}</button>`;
		}).join('')}</div>`;
	},
	// Yuk kartasi amallari: kompyuterda pastki qatorda, telefonda — bitta asosiy, qolganlari «Boshqa amallar» oynasida
	cardActs(l) {
		const h = Calc.holat(l), d = Calc.done(l), ap = l.tasdiq.find(t => t.h === 'kutilmoqda');
		const acts = [];
		if (h === 'ariza' && !l.crid && can('openAssign')) acts.push(`<button class="btn${ap ? '' : ' pri'}" data-act="openAssign" data-id="${l.id}"${ap ? ' disabled title="Avval rahbar tasdig‘i"' : ''}>${UI.icon('truck')}Tashuvchi biriktirish</button>`);
		if (d < 6 && l.crid && can('markStage')) acts.push(`<button class="btn${l.mode === 'avto' ? '' : ' pri'}" data-act="markStage" data-id="${l.id}">${UI.icon('check')}${UI.esc(Calc.stage(l, d))}</button>`);
		if (d === 6 && !l.aslCmr && can('cmrBack')) acts.push(`<button class="btn pri" data-act="cmrBack" data-id="${l.id}">${UI.icon('filecheck')}${MODES[l.mode].pod} qaytdi</button>`);
		if (Calc.debt(l) && can('openPay')) acts.push(`<button class="btn${acts.some(x => x.includes(' pri')) ? '' : ' pri'}" data-act="openPay" data-id="${l.cid}" data-l="${l.id}">${UI.icon('coin')}To‘lov kiritish</button>`);
		const trackBtn = can('openTrack') ? `<button class="btn" data-act="openTrack" data-id="${l.id}">${UI.icon('link')}Mijozga kuzatuv havolasi</button>` : '';
		return { acts, trackBtn };
	},
	loadCard(id) {
		const l = Data.yuk(id);
		if (!l) return Views.drawerHead('Yuk topilmadi') + `<div class="dbody">${UI.empty('Bu yuk o‘chirilgan yoki namuna qayta yaratilgan', 'yuk')}</div>`;
		const c = Data.client(l.cid), k = l.crid && Data.carrier(l.crid), h = Calc.holat(l), d = Calc.done(l), M = money(), R = session.role === 'rahbar';
		const nx = Views.next(l), b = Calc.border(l), need = Calc.prostoyNeed(l), pend = l.extras.find(e => e.holat === 'sorov'), ap = l.tasdiq.find(t => t.h === 'kutilmoqda');
		const fig = (label, v, sub, tone = '') => `<div class="fig"><span class="l">${label}</span><b class="${tone}">${v}</b><span class="s">${sub}</span></div>`;
		const dc = Calc.docCount(l);
		const figs = M ? fig('Fraxt (tushum)', F.usd(Calc.rev(l)), Calc.rev(l) > l.fraxt ? `fraxt ${F.usd(l.fraxt)} + prostoy` : 'mijozdan')
				+ fig('Ekspeditsiya haqi', F.usd(Calc.haq(l)), `marja ${F.pct(Calc.marja(l))}`, Calc.marja(l) < db.set.marja ? 'amb-t' : '')
				+ fig('Mijoz qarzi', F.usd(Calc.debt(l)), Calc.reason(l) || (h === 'ariza' ? 'yuklashda ochiladi' : 'qarz yo‘q'), Calc.overdue(l) ? 'red-t' : '')
			: fig('Hujjatlar', `${dc.n}/${dc.m}`, dc.miss ? `${dc.miss} ta yetishmaydi` : 'hammasi joyida', dc.miss ? 'red-t' : '')
				+ fig('Bosqich', `${d}/6`, d ? UI.esc(Calc.stage(l, d - 1)) : 'yuklanmagan')
				+ fig(d === 6 ? 'Topshirildi' : 'ETA', F.date(d === 6 ? l.st[5].t : l.plan[5]), Calc.late(l) ? `${Calc.late(l)} kun kech` : d === 6 ? Time.hm(l.st[5].t) : 'reja');
		const notes = [];
		if (ap) notes.push(`<div class="note warn"><div><b>Past marja: ${M ? F.pct(Calc.marja(l)) : ''} (chegara ${db.set.marja} %) — rahbar tasdig‘i kutilmoqda.</b> ${UI.esc(ap.izoh || '')} <span class="muted">So‘radi ${Views.who(ap.by)}, ${F.when(ap.t)}.</span></div>
			${R ? `<div class="nacts"><button class="btn s" data-act="reject" data-id="${l.id}:m">Rad etish</button><button class="btn s pri" data-act="approve" data-id="${l.id}:m">${UI.icon('check')}Tasdiqlash</button></div>` : ''}</div>`);
		if (b && (b.open || need || pend) && M) {
			const txt = `Chegarada ${b.kun} kun (${F.when(b.from)} dan, bot vaqt belgisi), bepul ${db.set.bepul} kun → ${b.pk} × ${F.usd(db.set.tarif)} = <b>${F.usd(b.pul)}</b>.`;
			if (pend) notes.push(`<div class="note warn"><div><b>Prostoy ${F.usd(pend.sum)} mijozga — rahbar tasdig‘i kutilmoqda.</b> ${txt} <span class="muted">So‘radi ${Views.who(pend.by)}.</span></div>
				${R ? `<div class="nacts"><button class="btn s" data-act="reject" data-id="${l.id}:p">Rad etish</button><button class="btn s pri" data-act="approve" data-id="${l.id}:p">${UI.icon('check')}Tasdiqlash</button></div>` : ''}</div>`);
			else if (need) notes.push(`<div class="note warn"><div>${txt} Mijozga avtomatik yozilmaydi.</div>${can('openProstoy') ? `<div class="nacts"><button class="btn s pri" data-act="openProstoy" data-id="${l.id}">Prostoyni mijozga qo‘yish</button></div>` : ''}</div>`);
			else if (b.open) notes.push(`<div class="note info">${UI.icon('timer')}<div>Chegarada ${b.kun} kun, bepul ${db.set.bepul} kun. ${l.extras.some(e => e.k === 'prostoy' && e.holat === 'tasdiq') ? 'Prostoy mijoz hisobiga qo‘yilgan.' : 'Prostoy hali yo‘q.'}</div></div>`);
		}
		const { acts, trackBtn } = Views.cardActs(l);
		// Telefonda: bitta asosiy tugma ekran kengligida, qolganlari «Boshqa amallar» ichida
		const mob = UI.mobile(), main = acts.find(a => a.includes(' pri')) || acts[0], rest = [...acts.filter(a => a !== main), trackBtn].filter(Boolean);
		const foot = mob ? (main ? `${rest.length ? `<button class="btn ic" data-act="cardMore" data-id="${l.id}" aria-label="Boshqa amallar">${UI.icon('more')}</button>` : ''}${main.replace('class="btn', 'class="btn grow1')}` : trackBtn.replace('class="btn', 'class="btn grow1'))
			: `${trackBtn}<span class="grow"></span>${acts.join('')}`;
		const hist = db.events.filter(e => e.lid === l.id && (M || !/\$/.test(e.m))).slice().reverse();
		const unit = l.mode === 'avto' ? [['Mashina', UI.esc(l.mashina || '—')], ['Tirkama', UI.esc(l.tirkama || '—')]] : l.mode === 'temir' ? [[l.vagon ? 'Vagon' : 'Konteyner', UI.esc(l.vagon || l.kont || '—')]] : [['AWB', UI.esc(l.awb || '—')]];
		return Views.drawerHead(`${UI.mode(l)}${l.no} ${UI.holat(l)}`, `${UI.esc(F.route(l))} · ${UI.esc(c.nom)}`)
			+ `<div class="dbody">
				<div class="figs">${figs}</div>
				<div class="nextq">${UI.icon('arrow')}<span><span class="muted">Keyingi qadam:</span> <b>${UI.esc(nx.t)}</b>${nx.who ? ` — ${UI.esc(nx.who)}` : ''}${nx.m ? `, ${UI.esc(nx.m)}` : ''}</span></div>
				${notes.join('')}
				<div class="dsec"><div class="sub-h"><h3>Bosqichlar · ${MODES[l.mode].t.toLowerCase()}</h3>${d > 0 && h !== 'yopildi' && can('undoStage') ? `<button class="link sm" data-act="undoStage" data-id="${l.id}">Oxirgisini bekor qilish</button>` : ''}</div>${Views.stepper(l)}</div>
				${M ? `<div class="dsec"><h3>Pul</h3>${Views.moneyBlock(l)}</div>` : ''}
				<div class="dsec"><div class="sub-h"><h3>Hujjatlar · ${dc.n}/${dc.m}</h3>${dc.miss ? UI.flag(`${dc.miss} ta yetishmaydi`) : ''}</div>${Views.docList(l)}</div>
				<div class="dsec"><h3>Yuk pasporti</h3>${UI.dl([
					['Jo‘natuvchi', UI.esc(l.jonat)], ['Qabul qiluvchi', UI.esc(l.qabul)], ['Incoterms', l.inco], ['Yuklash', `${UI.esc(l.yukManzil)}<span class="sub">${F.when(l.yukT)}</span>`],
					['Tushirish', UI.esc(l.tushManzil)], ['Yuk', `${UI.esc(F.cargo(l))}${l.joy ? ` · ${UI.esc(l.joy)}` : ''}`], ['Brutto', F.num(l.tonna * 1000 + Math.round(l.tonna * 18)) + ' kg'],
					['Transport', `${MODES[l.mode].t}, ${BODY[l.body].toLowerCase()}`], l.harorat && ['Harorat', l.harorat], ['Plomba', UI.esc(l.plomba || '—')],
					['Chegara', UI.esc(l.chegara)], ['Deklarant', UI.esc(l.broker)]
				], 'two')}</div>
				<div class="dsec"><h3>Tashuvchi</h3>${k ? UI.dl([
					['Tashuvchi', M ? `<button class="link" data-act="openCarrier" data-id="${k.id}">${UI.esc(k.nom)}</button>` : UI.esc(k.nom)], ['Telefon', `${UI.esc(k.tel)} ${UI.call(k.tel)}`],
					l.drv && ['Haydovchi', `${UI.esc(l.drv.ism)} ${UI.call(l.drv.tel)}`], ...unit
				]) : `<p class="muted sm">Tashuvchi biriktirilmagan</p>`}</div>
				<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}<small>${UI.esc(Views.actor(e))}</small></span></li>`).join('')}</ul></div>
			</div>${foot ? `<div class="dfoot">${foot}</div>` : ''}`;
	}
};

/* ===== Views (davomi) — yangi ariza va jonli chek, tashuvchi biriktirish, hujjatlar matritsasi (manba: c2.js) ===== */

Object.assign(Views, {
	/* --- Yangi ariza (o‘ng panel) --- */
	routeName: r => `${r.from} → ${r.to} · ${BODY[r.body].toLowerCase()} · ${r.kun[0]}–${r.kun[1]} kun`,
	arizaForm() {
		const f = ui.f.ar;
		if (!f) return '';
		const routes = db.routes.map(r => [r.k, Views.routeName(r).replace('→', '–')]), r = Views.arRoute(f), other = f.rk === 'other';
		return Views.drawerHead('Yangi ariza', 'Narx hisoblanadi, saqlangach tashuvchi biriktiriladi')
			+ `<form class="dbody ar" data-form="ariza" autocomplete="off"><div class="ar-f">
				<div class="sec-t">Mijoz va yuk</div>
				<div class="grid2">
					${UI.field('Mijoz', `<div class="cb-w">${UI.icon('search')}${UI.input('ar.cq', 'autofocus placeholder="Mijoz nomini yozing" autocomplete="off" role="combobox" aria-controls="ar-cl"')}</div>`, { key: 'ar.cid', cls: 'full' })}
					<div class="full" id="ar-cl">${Views.arizaClient()}</div>
					${UI.field('Yo‘nalish', UI.select('ar.rk', [['', 'Tanlang'], ...routes, ['other', 'Boshqa yo‘nalish (qo‘lda)']]), { key: 'ar.rk', cls: 'full' })}
					${other ? `${UI.field('Qayerdan', UI.input('ar.from'))}${UI.field('Qayerga', UI.input('ar.to', 'placeholder="Masalan: Qozon"'), { key: 'ar.to' })}
						${UI.field('Masofa', UI.unit(UI.num('ar.km', 'step="10"'), 'km'), { key: 'ar.km' })}${UI.field('Davlat', UI.select('ar.davlat', [['RU', 'Rossiya'], ['KZ', 'Qozog‘iston'], ['KG', 'Qirg‘iziston'], ['TR', 'Turkiya'], ['XX', 'Boshqa davlat']]), { hint: 'ST-1 va TIR qoidasi shundan' })}
						${UI.field('Transport', UI.select('ar.tb', [['avto:tent', 'Avto, tent'], ['avto:ref', 'Avto, refrijerator'], ['temir:vagon', 'Temir yo‘l, vagon'], ['temir:kont', 'Temir yo‘l, konteyner'], ['havo:avia', 'Havo, aviayuk']]), { cls: 'full' })}` : ''}
					${UI.field('Yuk turi', UI.select('ar.yuk', Object.entries(CARGO).map(([k, c]) => [k, c.t])))}
					${UI.field(r && r.kg ? 'Vazn (t, aviayuk)' : 'Vazn', UI.unit(UI.num('ar.tonna', 'step="0.1"'), 't'), { key: 'ar.tonna' })}
					${UI.field('Yuklash sanasi', UI.input('ar.sana', `type="date" min="${Time.today}"`), { key: 'ar.sana' })}
					${other ? '' : UI.field('Transport', `<div class="ro">${r ? `${UI.icon(MODES[r.mode].icon)}${MODES[r.mode].t}, ${BODY[r.body].toLowerCase()}` : '<span class="muted">yo‘nalishdan</span>'}</div>`)}
				</div>
				<div class="sec-t">Narx</div>
				<div class="grid2">
					${UI.field('Tashuvchi stavkasi', UI.unit(UI.num('ar.stavka', 'step="10"'), '$'), { key: 'ar.stavka', hint: other ? 'yangi yo‘nalish — tashuvchi narxini qo‘lda kiriting' : r ? `yo‘nalish o‘rtachasi ${F.usd(Views.avgStavka(f))}` : '' })}
					${UI.field('Xarajatlar', UI.unit(UI.num('ar.xarajat', 'step="10"'), '$'), { hint: 'broker, sug‘urta, yo‘l haqi' })}
					${UI.field('Ustama', UI.unit(UI.num('ar.ustama', 'step="0.5"'), '%'), { hint: 'tannarxga nisbatan' })}
					${UI.field('Mijozga fraxt', UI.unit(UI.num('ar.fraxt', 'step="10"'), '$'), { key: 'ar.fraxt' })}
				</div>
				</div>
				<div class="ar-s"><div class="card rc" id="ar-sum">${Views.arizaSum()}</div><div id="ar-offer">${Views.arizaOffer()}</div></div>
			</form>
			<div class="dfoot"><button class="btn" data-act="closeDrawer">Bekor qilish</button><span class="grow"></span><button class="btn pri" data-act="saveAriza">${Views.arizaNeeds(f).length ? 'Saqlash va tasdiqqa yuborish' : 'Saqlash va tashuvchi tanlash'}</button></div>`;
	},
	// Ariza yo‘nalishi: ro‘yxatdan yoki qo‘lda kiritilgani (vaqtinchalik obyekt)
	arRoute(f) {
		if (f.rk !== 'other') return f.rk ? Data.route(f.rk) : null;
		const [mode, body] = f.tb.split(':');
		return { from: f.from || '—', to: f.to || '—', mode, body, kun: mode === 'havo' ? [2, 4] : [Math.max(1, Math.round((+f.km || 0) / 550)), Math.max(2, Math.round((+f.km || 0) / 400))], kg: mode === 'havo', davlat: f.davlat };
	},
	avgStavka(f) { const r = f.rk === 'other' ? null : Data.route(f.rk); return r ? Math.round(r.stavka * (r.kg ? (+f.tonna || 0) * 1000 : 1) / 10) * 10 : 0; },
	arizaClient() {
		const f = ui.f.ar, c = f && f.cid && Data.client(f.cid);
		if (!c) {
			const q = (f && f.cq || '').trim().toLowerCase(), list = db.clients.filter(x => !q || x.nom.toLowerCase().includes(q) || x.tur.toLowerCase().includes(q));
			return `<div class="opts" role="listbox">${list.length ? list.slice(0, 6).map(x => { const d = Calc.clientDebt(x), o = Calc.clientOverdue(x); return `<button type="button" class="opt" role="option" data-act="arPickClient" data-v="${x.id}"><span class="x"><b>${UI.esc(F.cn(x))}</b><small>${UI.esc(x.tur)}</small></span><span class="q${o ? ' red-t' : ''}">${o ? `muddati o‘tgan ${F.usd(o)}` : d ? `qarz ${F.usd(d)}` : 'qarz yo‘q'}</span></button>`; }).join('') : '<p class="hint opt-e">Topilmadi</p>'}</div>`;
		}
		const debt = Calc.clientDebt(c), over = Calc.clientOverdue(c), s = c.shart;
		return `<div class="cl-i${over ? ' bad' : ''}">${UI.icon(over ? 'alert' : 'building')}<span>Qarz <b>${F.usd(debt)}</b> · muddati o‘tgan <b class="${over ? 'red-t' : ''}">${F.usd(over)}</b> · shart: ${s.avans === 100 ? 'oldindan to‘lov' : `avans ${s.avans} %, qoldiq ${s.cmr ? 'asl CMR’dan' : 'topshirilgandan'} keyin ${s.kun} kun`}${over ? '. Yangi yuk uchun rahbar tasdig‘i kerak.' : ''}</span></div>`;
	},
	// Tasdiq kerak bo‘lgan sabablar: past marja, muddati o‘tgan qarz (rahbar o‘zi saqlasa — darhol tasdiqlanadi)
	arizaNeeds(f) {
		const out = [], q = Calc.quote(f.stavka, f.xarajat, f.fraxt);
		if (q.low) out.push('marja');
		if (f.cid && Calc.clientOverdue(Data.client(f.cid)) > 0) out.push('qarz');
		return session.role === 'rahbar' ? [] : out;
	},
	arizaSum() {
		const f = ui.f.ar;
		if (!f) return '';
		const q = Calc.quote(f.stavka, f.xarajat, f.fraxt), needs = Views.arizaNeeds(f);
		const line = (t, v, cls = '') => `<div class="rl ${cls}"><span>${t}</span><b>${v}</b></div>`;
		return `<div class="rc-h">Chek</div>
			${line('Tashuvchi stavkasi', F.usd(+f.stavka || 0))}
			${line('Xarajatlar', F.usd(+f.xarajat || 0))}
			${line('Ekspeditsiya haqi', F.usd(q.haq), q.haq < 0 ? 'neg' : '')}
			<div class="rl tot"><span>Mijozga fraxt</span><b>${F.usd(+f.fraxt || 0)}</b></div>
			<div class="rl mrg ${q.low ? 'low' : ''}"><span>Marja</span><b>${f.fraxt ? F.pct(q.marja) : '—'}</b></div>
			${q.low ? `<p class="rc-w">${UI.icon('alert')}<span>${db.set.marja} % dan past. ${session.role === 'rahbar' ? 'Siz rahbar sifatida saqlaysiz — tasdiq kerak emas.' : 'Saqlansa, rahbar tasdig‘iga yuboriladi.'}</span></p>` : ''}
			${needs.includes('qarz') ? `<p class="rc-w">${UI.icon('alert')}<span>Mijozning muddati o‘tgan qarzi bor — rahbar tasdig‘i kerak.</span></p>` : ''}
			${UI.rule(`Marja chegarasi ${db.set.marja} %`)}`;
	},
	offerText(f) {
		const r = f.rk && Views.arRoute(f), c = f.cid && Data.client(f.cid), u = Data.user();
		if (!r || !c || !f.fraxt) return '';
		const s = c.shart;
		return `Assalomu alaykum! ${c.nom} uchun taklif:\n${r.from} → ${r.to}, ${BODY[r.body].toLowerCase()}, ${CARGO[f.yuk].t.toLowerCase()} ${F.t(+f.tonna || 0)}.\nYuklash: ${f.sana ? F.dateLong(f.sana) : '—'}. Yo‘lda ${r.kun[0]}–${r.kun[1]} kun.\nFraxt: ${F.usd(+f.fraxt)}${r.mode === 'avto' ? `, bepul turish ${db.set.bepul} kun, keyin prostoy ${F.usd(db.set.tarif)}/kun` : ''}.\nTo‘lov: ${s.avans === 100 ? 'oldindan' : `${s.avans} % yuklashda, qoldiq ${s.cmr ? 'asl CMR’dan' : 'topshirilgandan'} keyin ${s.kun} kun`}.\nAGROTRANSGROUP, ${u.ism}, ${u.tel}`;
	},
	arizaOffer() {
		const t = Views.offerText(ui.f.ar || {});
		return `<div class="offer"><div class="sub-h"><h3>Taklif matni</h3>${t ? `<button class="btn s" data-act="arizaCopy">${UI.icon('copy')}Nusxa olish</button>` : ''}</div>
			${t ? `<pre class="otxt">${UI.esc(t)}</pre>` : '<p class="hint">Mijoz, yo‘nalish va fraxt kiritilgach tayyor bo‘ladi — mijozga Telegram’da yuboriladi.</p>'}</div>`;
	},

	/* --- Tashuvchi biriktirish (oyna) --- */
	assignForm() {
		const f = ui.f.as, l = Data.yuk(f.id);
		return `<p class="hint">${l.no} · ${UI.esc(F.route(l))} · ${UI.esc(F.cargo(l))}. Shu yo‘nalishda ishlaganlar tepada, oxirgi narxi bilan.</p>
			<div id="as-list">${Views.assignList()}</div>
			${f.crid ? `<div class="grid2">
				${f.mode === 'avto' ? UI.field('Haydovchi', UI.input('as.drv'), { key: 'as.drv' }) + UI.field('Haydovchi telefoni', UI.input('as.tel', 'inputmode="tel"')) + UI.field('Mashina', UI.input('as.mashina'), { key: 'as.mashina' }) + UI.field('Tirkama', UI.input('as.tirkama'))
					: UI.field(f.mode === 'temir' ? (l.body === 'vagon' ? 'Vagon raqami (8 xona)' : 'Konteyner raqami') : 'AWB raqami', UI.input('as.unit'), { key: 'as.unit', cls: 'full' })}
			</div>` : ''}`;
	},
	assignList() {
		const f = ui.f.as, l = Data.yuk(f.id);
		const fit = k => l.mode === 'avto' ? ['ref', 'tent'].includes(k.kind) && (l.body !== 'ref' || k.kind === 'ref') : k.kind === (l.mode === 'temir' ? 'temir' : 'avia');
		const list = db.carriers.filter(fit).sort((a, b) => (b.routes.includes(l.rk) - a.routes.includes(l.rk)) || Calc.carrierLoads(b).length - Calc.carrierLoads(a).length);
		return `<div class="kpick">${list.map(k => {
			const lp = Calc.lastPrice(k, l.rk), ot = Calc.onTime(k), n = Calc.carrierLoads(k).filter(x => x.rk === l.rk).length;
			return `<button type="button" class="kp" data-act="pickCarrier" data-v="${k.id}" aria-pressed="${f.crid === k.id}"><span class="n">${UI.esc(k.nom)}</span>
				<span class="m">${n ? `shu yo‘nalishda ${n} reys` : 'bu yo‘nalishda ishlamagan'}${ot != null ? ` · o‘z vaqtida ${ot} %` : ''}</span>
				<span class="p">${lp ? `oxirgi narx ${F.usd(lp)}` : '—'}</span></button>`;
		}).join('')}</div>`;
	},

	/* --- Hujjatlar matritsasi --- */
	docs() {
		const all = Calc.matrixLoads(), miss = Calc.missingLoads(), nDocs = Calc.sum(miss, l => Calc.docCount(l).miss);
		return `<div class="toolbar">
				<div class="mx-sum">${miss.length ? `${UI.icon('alert')}<span>Yetishmaydi: <b>${nDocs} hujjat, ${miss.length} yuk</b></span>` : `${UI.icon('check')}<span>Yetishmagan hujjat yo‘q</span>`}</div>
				<button class="chip" data-act="toggleMissing" aria-pressed="${ui.missing}">Faqat yetishmaganlar<b>${miss.length}</b></button>
				<span class="grow"></span>${UI.seg('docMode', ui.docMode, [['all', 'Hammasi'], ['avto', 'Avto'], ['temir', 'Temir yo‘l'], ['havo', 'Havo']], 'tseg')}
			</div>
			<section class="card" id="mx">${Views.matrix()}</section>
			<div class="mx-leg">${['bor', 'tekshir', 'yoq', 'keyin', 'kerakmas'].map(s => UI.doc(s)).join('')}<span class="hint">Qaysi hujjat kerakligi — yo‘nalish va yukdan standart qoida; logist sabab yozib o‘zgartiradi. Katakni bosing.</span></div>`;
	},
	matrix() {
		const rows = Calc.matrixLoads().filter(l => (!ui.missing || Calc.docCount(l).miss) && (ui.docMode === 'all' || l.mode === ui.docMode))
			.sort((a, b) => (Calc.docCount(b).miss > 0) - (Calc.docCount(a).miss > 0) || ({ ariza: 0, faol: 1, topshirildi: 2 }[Calc.holat(a)] - { ariza: 0, faol: 1, topshirildi: 2 }[Calc.holat(b)]) || b.yukT - a.yukT);
		if (!rows.length) return UI.empty('Bu filtrda yuk yo‘q', 'file');
		// Telefon: har yuk — alohida blok, faqat kerakli hujjatlar, yetishmagani tepada
		if (UI.mobile()) {
			const rank = { yoq: 0, keyin: 1, tekshir: 2, bor: 3 };
			return `<div class="dcards">${rows.map(l => {
				const c = Calc.docCount(l), need = DOCS.filter(x => Calc.docNeed(l, x.k)).sort((a, b) => rank[Calc.docState(l, a.k)] - rank[Calc.docState(l, b.k)]), no = DOCS.filter(x => !Calc.docNeed(l, x.k));
				return `<section class="dcard${c.miss ? ' miss' : ''}"><button class="dc-h" data-act="openLoad" data-id="${l.id}"><b>${l.no}</b><span>${UI.esc(F.rshort(l))} · ${MODES[l.mode].t.toLowerCase()}</span><span class="dc-n">${c.n}/${c.m}</span></button>
					${need.filter(x => ['yoq', 'tekshir'].includes(Calc.docState(l, x.k))).map(x => `<button class="dc-r${Calc.docState(l, x.k) === 'yoq' ? ' bad' : ''}" data-act="openDoc" data-id="${l.id}:${x.k}"><span>${UI.esc(Calc.docFull(l, x.k))}</span>${UI.doc(Calc.docState(l, x.k))}</button>`).join('')}
					${['keyin', 'bor'].map(st => { const g = need.filter(x => Calc.docState(l, x.k) === st); return g.length ? `<div class="dc-g">${UI.doc(st)}<span>${g.map(x => `<button class="dc-t" data-act="openDoc" data-id="${l.id}:${x.k}">${Calc.docName(l, x.k)}</button>`).join('')}</span></div>` : ''; }).join('')}
					${no.length ? `<p class="dc-no">Kerak emas: ${no.map(x => Calc.docName(l, x.k)).join(', ')}</p>` : ''}</section>`;
			}).join('')}</div>`;
		}
		const head = ['Ariza', 'CMR / SMGS / AWB', 'Invoys', 'Fito', 'ST-1', 'GTD', 'TIR', 'Asl CMR / POD'];
		return `<div class="mx-w"><table class="mx"><thead><tr><th class="mx-1">Yuk</th>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
			${rows.map(l => { const c = Calc.docCount(l); return `<tr class="${c.miss ? 'miss' : ''}"><th class="mx-1"><button class="mx-l" data-act="openLoad" data-id="${l.id}"><b>${l.no}</b><span>${UI.esc(l.to.split(' ')[0])} · ${MODES[l.mode].doc} · ${c.n}/${c.m}</span></button></th>
				${DOCS.map(x => { const st = Calc.docState(l, x.k); return `<td class="c-${st}"><button data-act="openDoc" data-id="${l.id}:${x.k}" aria-label="${UI.esc(Calc.docName(l, x.k))}: ${DOC_ST[st].t}">${UI.doc(st, true)}</button></td>`; }).join('')}</tr>`; }).join('')}
		</tbody></table></div>`;
	},
	docForm() {
		const f = ui.f.doc, l = Data.yuk(f.lid), k = f.k, st = Calc.docState(l, k), [def, why] = Calc.docRule(l, k), rule = l.rule[k], d = l.docs[k] || {};
		const fotos = (d.foto || []).map(Data.photo).filter(Boolean);
		const ruleTxt = `${rule ? `Qoida o‘zgartirilgan: <b>${rule.need ? 'kerak' : 'kerak emas'}</b> — ${UI.esc(rule.sabab)} <span class="muted">(${Views.who(rule.by)})</span>` : `Standart: <b>${def ? 'kerak' : 'kerak emas'}</b> — ${why}`}`;
		const canRule = can('openRule') && k !== 'ariza' && k !== 'tr';
		return `<div class="note info">${UI.icon('info')}<div>${ruleTxt}${canRule && !f.rule ? ` <button class="link" data-act="openRule">O‘zgartirish</button>` : ''}</div></div>
			${f.rule ? `<div class="rule-box">${UI.field('Bu yuk uchun', UI.seg('docNeed', f.need ? 'ha' : 'yoq', [['ha', 'Kerak'], ['yoq', 'Kerak emas']]), { group: true })}
				${UI.field('Sabab', UI.input('rule.sabab', 'placeholder="Masalan: xaridor ST-1 talab qilmaydi"'), { key: 'rule.sabab' })}
				<div class="acts"><button class="btn s" data-act="openRule" data-v="0">Bekor</button><button class="btn s pri" data-act="saveRule">Qoidani saqlash</button></div></div>` : ''}
			${st === 'kerakmas' ? '' : `
			${UI.field('Holat', UI.seg('docState', f.h, [['bor', 'Bor'], ['tekshir', 'Tekshiruvda'], ['yoq', 'Yo‘q']]), { group: true, hint: st === 'keyin' ? `Muddati: ${Calc.docDue(l, k) ? F.when(Calc.docDue(l, k)) : 'bosqichga qarab'}` : '' })}
			<div class="grid2">${UI.field(k === 'gtd' ? 'GTD raqami' : 'Raqam', UI.input('doc.no', 'placeholder="ixtiyoriy"'))}${k === 'gtd' ? UI.field('Broker', UI.input('doc.broker')) : UI.field('Sana', UI.input('doc.sana', 'type="date"'))}</div>
			<div class="fld"><span>Surat</span><div class="pth">${fotos.map(s => `<img src="${s}" alt="Hujjat surati">`).join('')}
				<label class="shot">${UI.icon('camera')}<span>Surat biriktirish</span><input type="file" accept="image/*" capture="environment" data-docphoto="${l.id}:${k}"></label>
				<button type="button" class="shot" data-act="docSample">${UI.icon('image')}<span>Namuna surat</span></button></div></div>
			${k === 'pod' && Calc.done(l) === 6 && !l.aslCmr && can('cmrBack') ? `<div class="note info">${UI.icon('filecheck')}<div>Asl nusxa ofisga keldimi? Belgilansa, mijozning to‘lov muddati boshlanadi.<div class="mt8"><button class="btn s pri" data-act="cmrBack" data-id="${l.id}">${MODES[l.mode].pod} qaytdi</button></div></div></div>` : ''}`}`;
	}
});

/* ===== Views (davomi) — To‘lovlar, Mijozlar, Tashuvchilar, Hisobot, Sozlamalar, akt-sverka, mijoz kuzatuv sahifasi (manba: c3.js) ===== */

const KIND = { ref: 'Refrijerator', tent: 'Tent', temir: 'Vagon operatori', avia: 'Aviaagent' };
// Akt-sverka va kuzatuv sahifasidagi firma rekvizitlari — namuna; haqiqiylari shu yerda bitta joyda almashtiriladi
const FIRMA = { nom: '«AGROTRANSGROUP» MChJ', manzil: 'Farg‘ona sh., Oq yo‘l ko‘chasi 49G', stir: '2XX XXX XXX', hisob: '2020 8000 X XXXX XXXX XXX', bank: 'namuna bank, MFO XXXXX', tel: '+998 73 000 00 00' };

Object.assign(Views, {
	/* --- To‘lovlar --- */
	agingBar(b, total) {
		const tones = ['br3', 'amb3', 'amb', 'red'];
		return `<div class="aging">${b.map((v, i) => v > 0 ? `<i style="width:${(v / (total || 1) * 100).toFixed(2)}%;--c:var(--${tones[i]})" title="${BUCKETS[i]}"></i>` : '').join('')}</div>
			<div class="ag-leg">${b.map((v, i) => `<span><i style="--c:var(--${tones[i]})"></i>${BUCKETS[i]}<b>${F.usd(v)}</b></span>`).join('')}</div>`;
	},
	pays() {
		const b = Calc.totalAging(), total = Calc.totalDebt(), over = Calc.totalOverdue();
		const cl = db.clients.filter(c => Calc.clientDebt(c) > 0).sort((a, c) => Calc.clientOverdue(c) - Calc.clientOverdue(a) || Calc.clientDebt(c) - Calc.clientDebt(a));
		const why = c => { const r = [...new Set(Calc.clientLoads(c).filter(l => Calc.debt(l)).map(Calc.reason))]; return r.map(x => Calc.clientOverdue(c) && (x === 'asl CMR kutilmoqda' || x === 'muddati o‘tgan') ? `<span class="red-t">${x}</span>` : x).join(', '); };
		const last = c => { const p = Calc.lastPay('m', 'cid', c.id); return p ? `${F.date(p.t)}<span class="sub">${F.usd(p.sum)}</span>` : '—'; };
		const cols = [
			['Mijoz', 'c-main nowrap', c => `${UI.esc(F.cn(c))}<span class="sub">${Calc.clientLoads(c).filter(l => Calc.debt(l)).length} yuk</span>`],
			['Jami', 'c-aside num strong', c => F.usd(Calc.clientDebt(c))],
			...BUCKETS.map((t, i) => [t, 'num' + (i ? ' over' : ''), c => { const v = Calc.clientAging(c)[i]; return v ? `<span class="${i ? 'red-t' : ''}">${F.usd(v)}</span>` : '<span class="muted">—</span>'; }]),
			['Sabab', 'why', why], ['Oxirgi to‘lov', 'm-hide nowrap', last],
			['', 'c-acts', c => `<span class="cell-acts"><button class="btn s" data-act="openRemind" data-id="${c.id}">Eslatma</button><button class="btn s" data-act="openPay" data-id="${c.id}">To‘lov kiritish</button></span>`]
		];
		const kr = db.carriers.filter(k => Calc.carrierDebt(k) > 0).sort((a, k) => (Calc.nextCDue(a) || 0) - (Calc.nextCDue(k) || 0));
		const kcols = [
			['Tashuvchi', 'c-main', k => `${UI.esc(k.nom)}<span class="sub">${Calc.carrierLoads(k).filter(l => Calc.cdebt(l)).map(l => l.no).join(', ')}</span>`],
			['Jami', 'c-aside num strong', k => F.usd(Calc.carrierDebt(k))],
			['Muddati', 'nowrap', k => { const d = Calc.nextCDue(k); return d ? (d < Time.day0() ? `<span class="red-t">${F.date(d)}, o‘tdi</span>` : F.day(d)) : '<span class="muted">topshirilgach</span>'; }],
			['7 kun ichida', 'num', k => { const v = Calc.cdue7(Calc.carrierLoads(k)); return v ? F.usd(v) : '<span class="muted">—</span>'; }],
			['Oxirgi to‘lov', 'm-hide nowrap', k => { const p = Calc.lastPay('t', 'crid', k.id); return p ? F.date(p.t) : '—'; }],
			['', 'c-acts', k => `<span class="cell-acts"><button class="btn s" data-act="openCPay" data-id="${k.id}">To‘lov qilish</button></span>`]
		];
		return `<section class="pay-top"><div class="sums">
				<div><span class="l">Mijozlar qarzi</span><b>${F.usd(total)}</b><small>so‘mda ${F.som(total * db.set.kurs)}</small></div>
				<div><span class="l">Muddati o‘tgan</span><b class="${over ? 'red-t' : ''}">${F.usd(over)}</b><small>${cl.filter(c => Calc.clientOverdue(c)).length} mijoz</small></div>
				<div><span class="l">Tashuvchilarga qarz</span><b>${F.usd(Calc.totalCDebt())}</b><small>7 kun ichida ${F.usd(Calc.cdue7())}</small></div>
			</div>${Views.agingBar(b, total)}</section>
			${UI.card(`Mijozlardan<span class="c">${cl.length}</span>`, UI.table(cols, cl, { open: c => ['openClient', c.id], empty: 'Mijozlar qarzi yo‘q', icon: 'wallet', cls: 'pay-t' }), { right: '<span class="hint m-hide">Qarz — topshirilgan yuk bo‘yicha hisob − to‘lov</span>' })}
			<div class="mt16" id="tash">${UI.card(`Tashuvchilarga<span class="c">${kr.length}</span>`, UI.table(kcols, kr, { open: k => ['openCarrier', k.id], empty: 'Tashuvchilarga qarz yo‘q', icon: 'truck' }))}</div>`;
	},
	payUsd: f => f.val === 'USD' ? +f.sum || 0 : Math.round((+f.sum || 0) / db.set.kurs),
	payMax: f => f.lid ? Calc.debt(Data.yuk(f.lid)) : Calc.clientDebt(Data.client(f.cid)),
	payForm() {
		const f = ui.f.pay, c = Data.client(f.cid), ls = Calc.clientLoads(c).filter(l => Calc.debt(l) > 0);
		return `<p class="note"><b>${UI.esc(c.nom)}</b> · qarz ${F.usd(Calc.clientDebt(c))}</p>
			${UI.field('Qaysi yukka', UI.select('pay.lid', [['', 'Eng eski qarzdan boshlab'], ...ls.map(l => [l.id, `${l.no} · ${F.usd(Calc.debt(l))}${Calc.overdue(l) ? ` · ${Calc.maxOver(l)} kun o‘tdi` : ''}`])]))}
			<div class="grid2 duo">${UI.field('Summa', UI.num('pay.sum', 'autofocus'), { key: 'pay.sum' })}${UI.field('Valyuta', UI.seg('payVal', f.val, [['USD', 'USD'], ['UZS', 'so‘m']]), { group: true })}</div>
			<p class="hint" id="pay-eq">${f.val === 'UZS' ? `= ${F.usd(Views.payUsd(f))} (kurs ${F.num(db.set.kurs)})` : `so‘mda ${F.som(Views.payUsd(f) * db.set.kurs)}`}</p>
			${UI.field('Usul', UI.seg('payUsul', f.usul, Object.entries(USUL)), { group: true })}`;
	},
	cpayMax: f => f.lid ? Calc.cdebt(Data.yuk(f.lid)) : Calc.carrierDebt(Data.carrier(f.crid)),
	cpayForm() {
		const f = ui.f.cpay, k = Data.carrier(f.crid), ls = Calc.carrierLoads(k).filter(l => Calc.cdebt(l) > 0);
		return `<p class="note"><b>${UI.esc(k.nom)}</b> · qarzimiz ${F.usd(Calc.carrierDebt(k))}</p>
			${UI.field('Qaysi reys', UI.select('cpay.lid', [['', 'Muddati yaqinidan boshlab'], ...ls.map(l => [l.id, `${l.no} · ${F.usd(Calc.cdebt(l))}`])]))}
			${UI.field('Summa', UI.unit(UI.num('cpay.sum', 'autofocus'), 'USD'), { key: 'cpay.sum' })}
			${UI.field('Usul', UI.seg('cpayUsul', f.usul, Object.entries(USUL)), { group: true })}`;
	},
	remindText(c) {
		const ls = Calc.clientLoads(c).filter(l => Calc.debt(l) > 0).sort((a, b) => Calc.maxOver(b) - Calc.maxOver(a)), u = Data.user();
		const name = (c.kontakt || '').split(',')[0].split(' ')[0];
		return `Assalomu alaykum${name ? ', ' + name + ' aka' : ''}! AGROTRANSGROUP’dan eslatma.\n${ls.map(l => `${l.no} (${F.route(l)}, ${CARGO[l.yuk].t.toLowerCase()} ${F.t(l.tonna)}): ${F.usd(Calc.debt(l))}${Calc.overdue(l) ? `, muddati ${Calc.maxOver(l)} kun oldin o‘tgan` : ''}${Calc.reason(l) === 'asl CMR kutilmoqda' ? '. Imzolangan CMR surati sizga yuborilgan, asl nusxa yo‘lda' : ''}.`).join('\n')}\nJami: ${F.usd(Calc.clientDebt(c))}. To‘lovni qachon kutaylik?\n${u.ism}, ${u.tel}`;
	},

	/* --- Mijozlar --- */
	clients() {
		return `<div class="toolbar"><span class="hint">${db.clients.length} mijoz · qarzi borlari tepada</span><span class="grow"></span>${UI.search('clients', ui.cq || '', 'Mijoz nomi yoki turi')}</div>
			<section class="card" id="clist">${Views.clientsList()}</section>`;
	},
	clientsList() {
		const q = (ui.cq || '').trim().toLowerCase(), list = db.clients.filter(c => !q || c.nom.toLowerCase().includes(q) || c.tur.toLowerCase().includes(q))
			.sort((a, b) => Calc.clientOverdue(b) - Calc.clientOverdue(a) || Calc.clientDebt(b) - Calc.clientDebt(a));
		const cols = [
			['Mijoz', 'c-main', c => `${UI.esc(c.nom)}<span class="sub">${UI.esc(c.tur)}</span>`],
			['Qarz', 'c-aside num', c => { const d = Calc.clientDebt(c); return d ? F.usd(d) : '<span class="muted">—</span>'; }],
			['Muddati o‘tgan', 'num', c => { const o = Calc.clientOverdue(c); return o ? `<span class="red-t">${F.usd(o)}</span>` : '<span class="muted">—</span>'; }],
			['Yuklar, oy', 'num', c => Calc.clientStats(c).nMonth],
			['Aylanma, 6 oy', 'num', c => F.usd(Calc.clientStats(c).turnover)],
			['Oxirgi yuk', 'nowrap', c => { const s = Calc.clientStats(c); return s.last ? F.date(s.last) : '—'; }]
		];
		return UI.table(cols, list, { open: c => ['openClient', c.id], empty: 'Topilmadi', icon: 'users' });
	},
	loadHist(list, kind) {
		return list.length ? `<div class="tw"><table class="tbl cards hist-t"><thead><tr><th>Yuk</th><th>Yo‘nalish</th><th class="num">${kind === 'm' ? 'Fraxt' : 'Stavka'}</th><th class="num">Qarz</th><th>Holat</th></tr></thead><tbody>
			${list.slice(0, 30).map(l => { const debt = kind === 'm' ? Calc.debt(l) : Calc.cdebt(l); return `<tr class="ck"><td class="c-main"><button class="rowlink" data-act="openLoad" data-id="${l.id}">${l.no}<span class="sub">${F.date(l.yukT)}</span></button></td>
				<td class="c-sub">${UI.esc(F.route(l))}<span class="sub">${UI.esc(F.cargo(l))}</span></td><td class="c-aside num">${F.usd(kind === 'm' ? Calc.rev(l) : l.stavka)}</td>
				<td class="num" data-l="Qarz">${debt ? `<span class="${kind === 'm' && Calc.overdue(l) ? 'red-t' : ''}">${F.usd(debt)}</span>` : '<span class="muted">—</span>'}</td><td data-l="Holat">${UI.holat(l)}</td></tr>`; }).join('')}
			</tbody></table></div>` : '<p class="muted sm">Yuk yo‘q</p>';
	},
	payHist(list) {
		return list.length ? `<table class="calc">${list.slice(0, 12).map(p => `<tr class="x"><td>${F.date(p.t)} · ${USUL[p.usul].toLowerCase()}${p.lid ? ` <span class="muted">${Data.yuk(p.lid).no}</span>` : ''}</td><td>${F.usd(p.sum)}</td></tr>`).join('')}</table>` : '<p class="muted sm">To‘lov yo‘q</p>';
	},
	clientCard(id) {
		const c = Data.client(id), s = Calc.clientStats(c), b = Calc.clientAging(c), pays = db.pays.filter(p => p.kind === 'm' && p.cid === c.id).sort((a, x) => x.t - a.t);
		return Views.drawerHead(UI.esc(c.nom), UI.esc(c.tur))
			+ `<div class="dbody cl2"><div>
				${UI.dl([['Aloqa', UI.esc(c.kontakt)], ['Telefon', `${UI.esc(c.tel)} ${UI.call(c.tel)}`], ['Ombor', UI.esc(c.ombor)],
					['To‘lov sharti', c.shart.avans === 100 ? 'oldindan to‘lov' : `avans ${c.shart.avans} %, qoldiq ${c.shart.cmr ? 'asl CMR’dan' : 'topshirilgandan'} keyin ${c.shart.kun} kun`],
					['Aylanma, 6 oy', F.usd(s.turnover)], ['Qarz', s.debt ? `<b class="${s.overdue ? 'red-t' : ''}">${F.usd(s.debt)}</b>${s.overdue ? `<span class="sub red-t">muddati o‘tgan ${F.usd(s.overdue)}</span>` : ''}` : 'yo‘q']])}
				${s.debt ? `<div class="mt16">${Views.agingBar(b, s.debt)}</div>` : ''}
				<div class="acts mt16">${can('openPay') && s.debt ? `<button class="btn pri" data-act="openPay" data-id="${c.id}">${UI.icon('coin')}To‘lov kiritish</button>` : ''}
					<button class="btn" data-act="openAkt" data-id="m:${c.id}">${UI.icon('printer')}Akt-sverka</button>
					${can('newAriza') ? `<button class="btn" data-act="newAriza" data-id="${c.id}">${UI.icon('plus')}Yangi ariza</button>` : ''}</div>
				<div class="dsec"><h3>To‘lovlar</h3>${Views.payHist(pays)}</div></div>
				<div><h3>Yuklar · ${s.list.length}</h3>${Views.loadHist(s.list, 'm')}</div></div>`;
	},

	/* --- Tashuvchilar --- */
	carriers() {
		const cols = [
			['Tashuvchi', 'c-main', k => `${UI.esc(k.nom)}<span class="sub">${k.tur} · ${KIND[k.kind]}</span>`],
			['Qarzimiz', 'c-aside num', k => { const d = Calc.carrierDebt(k); return d ? F.usd(d) : '<span class="muted">—</span>'; }],
			['Mashinalar', 'm-hide', k => k.mash.length ? `${k.mash.length} ta<span class="sub">${k.mash.slice(0, 2).join(', ')}</span>` : '<span class="muted">—</span>'],
			['Yo‘nalishlar', 'c-sub', k => UI.esc([...new Set(k.routes.map(r => Data.route(r).to.split(' ')[0]))].join(', '))],
			['Reyslar', 'num', k => Calc.carrierLoads(k).length],
			['O‘z vaqtida', 'num', k => { const v = Calc.onTime(k); return v == null ? '—' : `<span class="${v < 80 ? 'amb-t' : ''}">${v} %</span>`; }],
			['Oxirgi narx', 'num', k => { const p = Calc.lastPrice(k); return p ? F.usd(p) : '—'; }]
		];
		const list = db.carriers.slice().sort((a, b) => Calc.carrierLoads(b).length - Calc.carrierLoads(a).length);
		return `<div class="toolbar"><span class="hint">${db.carriers.length} tashuvchi: yollangan avto, temir yo‘l ekspeditori, aviaagent</span></div>
			<section class="card">${UI.table(cols, list, { open: k => ['openCarrier', k.id], icon: 'truck' })}</section>`;
	},
	carrierCard(id) {
		const k = Data.carrier(id), list = Calc.carrierLoads(k).sort((a, b) => b.yukT - a.yukT), debt = Calc.carrierDebt(k), pays = db.pays.filter(p => p.kind === 't' && p.crid === k.id).sort((a, x) => x.t - a.t);
		return Views.drawerHead(UI.esc(k.nom), `${k.tur} · ${KIND[k.kind]}`)
			+ `<div class="dbody cl2"><div>
				${UI.dl([['Telefon', `${UI.esc(k.tel)} ${UI.call(k.tel)}`], k.mash.length && ['Mashinalar', k.mash.join('<br>')], k.drv.length && ['Haydovchilar', k.drv.map(UI.esc).join('<br>')],
					['Yo‘nalishlar', k.routes.map(r => UI.esc(Views.routeName(Data.route(r)))).join('<br>')], ['To‘lov sharti', k.avans === 100 ? 'oldindan to‘lov' : `avans ${k.avans} %, qoldiq topshirilgandan keyin ${k.kun} kun`],
					['Reyslar', `${list.length} ta · o‘z vaqtida ${Calc.onTime(k) == null ? '—' : Calc.onTime(k) + ' %'}`], ['Qarzimiz', debt ? `<b>${F.usd(debt)}</b>` : 'yo‘q']])}
				<div class="acts mt16">${can('openCPay') && debt ? `<button class="btn pri" data-act="openCPay" data-id="${k.id}">${UI.icon('send')}To‘lov qilish</button>` : ''}
					<button class="btn" data-act="openAkt" data-id="t:${k.id}">${UI.icon('printer')}Akt-sverka</button></div>
				<div class="dsec"><h3>To‘lovlar</h3>${Views.payHist(pays)}</div></div>
				<div><h3>Reyslar · ${list.length}</h3>${Views.loadHist(list, 't')}</div></div>`;
	},

	/* --- Akt-sverka: alohida chop etish sahifasi --- */
	aktSheet(id) {
		const [kind, eid] = id.split(':'), side = kind === 'm' ? Data.client(eid) : Data.carrier(eid), a = ui.akt;
		const r = Calc.akt(kind, eid, a.from, a.to), u = Data.user();
		const presets = [['oy', 'Shu oy', Time.monthStart(0), Time.today], ['otgan', 'O‘tgan oy', Time.monthStart(-1), Time.add(-1, Time.monthStart(0))], ['3oy', '3 oy', Time.monthStart(-2), Time.today], ['yil', '6 oy', Time.monthStart(-5), Time.today]];
		const cur = (presets.find(p => p[2] === a.from && p[3] === a.to) || [''])[0];
		const bal = v => v === 0 ? '$0' : kind === 'm' ? `${F.usd(Math.abs(v))} ${v > 0 ? `— ${UI.esc(side.nom)} qarzi` : '— oldindan to‘langan'}` : `${F.usd(Math.abs(v))} ${v > 0 ? '— AGROTRANSGROUP qarzi' : '— ortiqcha to‘langan'}`;
		return `<div class="sheet-w" role="dialog" aria-modal="true" aria-label="Akt-sverka">
			<div class="sheet-bar"><button class="btn ic ghost" data-act="closeDrawer" aria-label="Orqaga">${UI.icon('back')}</button><h2>Akt-sverka</h2><span class="grow"></span>
				${UI.seg('setAkt', cur, presets.map(p => [p[0], p[1]]), 'akt-seg')}<button class="btn pri" data-act="printAkt">${UI.icon('printer')}<span class="m-hide">Chop etish / </span>PDF</button></div>
			<div class="sheet-scroll"><article class="sheet">
				<header class="sh-h"><div class="logo">${LOGO}<span>AGROTRANSGROUP<small>Xalqaro yuk tashish va ekspeditsiya</small></span></div><div class="sh-n">AS-${Time.today.slice(2, 4)}${Time.today.slice(5, 7)}-${eid.slice(1).padStart(3, '0')}<br>${F.dmy(Time.today)}</div></header>
				<h1>Solishtirma dalolatnoma (akt-sverka)</h1>
				<p class="sh-p">Davr: ${F.dmy(a.from)} — ${F.dmy(a.to)}. Valyuta: AQSh dollari.</p>
				<div class="sh-sides"><div><span>1-tomon</span><b>${FIRMA.nom}</b>${FIRMA.manzil}<br>STIR ${FIRMA.stir}<br>h/r ${FIRMA.hisob}, ${FIRMA.bank}</div>
					<div><span>2-tomon</span><b>${UI.esc(side.nom)}</b>${kind === 'm' ? UI.esc(side.ombor) : UI.esc(side.tur)}<br>Tel. ${UI.esc(side.tel)}<br>STIR —</div></div>
				<table class="sh-t"><thead><tr><th>Sana</th><th>Hujjat</th><th class="num">Hisoblangan</th><th class="num">To‘langan</th></tr></thead><tbody>
					<tr class="op"><td>${F.dmy(a.from)}</td><td>Davr boshidagi qoldiq</td><td class="num">${r.open > 0 ? F.usd(r.open) : ''}</td><td class="num">${r.open < 0 ? F.usd(-r.open) : ''}</td></tr>
					${r.rows.map(x => `<tr><td>${F.dmy(x.t)}</td><td>${UI.esc(x.doc)}<span class="sub">${UI.esc(x.sub)}</span></td><td class="num">${x.d ? F.usd(x.d) : ''}</td><td class="num">${x.k ? F.usd(x.k) : ''}</td></tr>`).join('')}
					${r.rows.length ? '' : '<tr><td colspan="4" class="muted">Davrda hisob va to‘lov yo‘q</td></tr>'}
				</tbody><tfoot><tr><td></td><td>Davr aylanmasi</td><td class="num">${F.usd(r.d)}</td><td class="num">${F.usd(r.k)}</td></tr>
					<tr class="cl"><td></td><td colspan="3">${F.dmy(a.to)} holatiga qoldiq: <b>${bal(r.close)}</b></td></tr></tfoot></table>
				<p class="sh-p">Tomonlar yuqoridagi hisob-kitoblarni tasdiqlaydi. Kelishmovchilik bo‘lsa, 5 ish kuni ichida yozma xabar beriladi.</p>
				<div class="sh-sign"><div><span>${FIRMA.nom}</span><i></i><small>${UI.esc(u.ism)}, ${UI.esc(u.lav.toLowerCase())}</small></div><div><span>${UI.esc(side.nom)}</span><i></i><small>imzo, muhr</small></div></div>
				<p class="sh-demo">Namuna: rekvizitlar misol uchun.</p>
			</article></div></div>`;
	},

	/* --- Hisobot --- */
	report() {
		const months = [-5, -4, -3, -2, -1, 0].map(i => Time.month(Time.monthStart(i))), cur = ui.report || months[5];
		return `<div class="toolbar">${UI.seg('setReport', cur, months.map(m => [m, F.mon(+m.slice(5) - 1)]), 'mseg')}<span class="grow"></span><span class="hint">Oy — topshirilgan yuklar bo‘yicha</span></div><div id="rep-body">${Views.reportBody()}</div>`;
	},
	reportBody() {
		const months = [-5, -4, -3, -2, -1, 0].map(i => Time.month(Time.monthStart(i))), ym = ui.report || months[5], R = Calc.report(ym);
		const max = Math.max(1, ...R.months.map(m => m.haq)), H = 120;
		const chart = `<svg class="chart" role="img" aria-label="Oxirgi 6 oy ekspeditsiya haqi">
			${[0.5, 1].map(f => `<line class="g" x1="0" x2="100%" y1="${(16 + H - H * f).toFixed(0)}" y2="${(16 + H - H * f).toFixed(0)}"/>`).join('')}
			${R.months.map((m, i) => { const h = Math.max(2, Math.round(m.haq / max * H)), x = (i + 0.5) / 6 * 100; return `<rect class="b${m.ym === ym ? ' hi' : ''}" x="${(x - 5.5).toFixed(1)}%" width="11%" y="${16 + H - h}" height="${h}" rx="2"/>
				<text x="${x.toFixed(1)}%" y="${10 + H - h}" text-anchor="middle" class="v">${F.usd(m.haq)}</text><text x="${x.toFixed(1)}%" y="${H + 34}" text-anchor="middle">${F.mon(+m.ym.slice(5) - 1)}</text>`; }).join('')}
		</svg>`;
		const rmax = Math.max(1, ...R.routes.map(r => r.haq));
		return `<div class="kpis rep">
				<div class="card kpi"><span class="l">Yuklar</span><span class="v">${R.n}</span><span class="s">${F.t(R.t)}</span></div>
				<div class="card kpi"><span class="l">Tushum</span><span class="v">${F.usd(R.rev)}</span><span class="s">fraxt + prostoy</span></div>
				<div class="card kpi"><span class="l">Ekspeditsiya haqi</span><span class="v">${F.usd(R.haq)}</span><span class="s">${F.month(ym)}</span></div>
				<div class="card kpi"><span class="l">O‘rtacha marja</span><span class="v">${F.pct(R.marja)}</span><span class="s">haq ÷ tushum</span></div></div>
			<div class="cols">
				${UI.card('Yo‘nalishlar', R.routes.length ? `<div class="tw"><table class="tbl rbar"><thead><tr><th>Yo‘nalish</th><th class="num">Yuk</th><th class="num">Tushum</th><th class="num">Eksp. haqi</th></tr></thead><tbody>
					${R.routes.map(r => `<tr><td>${UI.esc(r.key)}<span class="bar"><i style="width:${(r.haq / rmax * 100).toFixed(1)}%"></i></span></td><td class="num">${r.n}</td><td class="num">${F.usd(r.rev)}</td><td class="num strong">${F.usd(r.haq)}</td></tr>`).join('')}
					</tbody></table></div>` : UI.empty('Bu oyda topshirilgan yuk yo‘q', 'chart'))}
				<div class="stack">${UI.card('Oxirgi 6 oy · ekspeditsiya haqi', `<div class="cb">${chart}</div>`)}
				${UI.card('Mijozlar, top-5', R.clients.length ? `<div class="rows">${R.clients.map((x, i) => `<div class="kv tr5"><span>${i + 1}. ${UI.esc(x.c.nom)} <small class="muted">${x.n} yuk</small></span><b>${F.usd(x.rev)}</b></div>`).join('')}</div>` : UI.empty('Ma’lumot yo‘q', 'users'))}</div>
			</div>`;
	},

	/* --- Sozlamalar --- */
	settings() {
		const s = db.set, inp = (key, v, unit, step = 1) => UI.unit(`<input class="in" type="number" inputmode="decimal" min="0" step="${step}" data-set="${key}" value="${v}">`, unit), mob = UI.mobile();
		// Telefonda: yig‘iladigan bo‘limlar (birinchisi ochiq), kompyuterda — ikki ustunli panellar
		const box = (title, body, open) => mob ? `<details class="set-d"${open ? ' open' : ''}><summary>${title}${UI.icon('chevd')}</summary>${body}</details>` : UI.card(title, body);
		const tbl = (rows, head = '') => `<div class="tw"><table class="tbl set-t">${head}<tbody>${rows}</tbody></table></div>`;
		const row = ([t, k, v, u, h]) => `<tr><td>${t}<span class="sub">${h}</span></td><td class="num">${inp(k, v, u)}</td></tr>`;
		const routes = box('Yo‘nalishlar va stavkalar', tbl(db.routes.map(r => `<tr><td>${UI.esc(r.from)} → ${UI.esc(r.to)}<span class="sub">${BODY[r.body].toLowerCase()} · ${r.kun[0]}–${r.kun[1]} kun</span></td><td class="num" data-l="Stavka">${inp('rt.' + r.k + '.stavka', r.stavka, r.kg ? '$/kg' : '$', r.kg ? 0.1 : 50)}</td><td class="num" data-l="Fraxt">${inp('rt.' + r.k + '.fraxt', r.fraxt, r.kg ? '$/kg' : '$', r.kg ? 0.1 : 50)}</td></tr>`).join(''),
			'<thead><tr><th>Yo‘nalish</th><th class="num">Stavka</th><th class="num">Fraxt</th></tr></thead>'), true).replace('class="tbl set-t"', 'class="tbl set-t set-cl set-rt"');
		const marja = box('Marja va prostoy', tbl([['Marja chegarasi', 'set.marja', s.marja, '%', 'pastroq narxga rahbar tasdig‘i kerak'], ['Prostoy tarifi', 'set.tarif', s.tarif, '$/kun', 'mijozga qo‘yiladigan'], ['Bepul turish', 'set.bepul', s.bepul, 'kun', 'chegarada']].map(row).join('')));
		const terms = box('To‘lov shartlari', tbl(db.clients.map(c => `<tr><td>${UI.esc(F.cn(c))}</td><td class="num" data-l="Avans">${inp('cl.' + c.id + '.avans', c.shart.avans, '%')}</td><td class="num" data-l="Qoldiq">${inp('cl.' + c.id + '.kun', c.shart.kun, 'kun')}</td><td><label class="cmr-l"><input type="checkbox" class="cbx" data-set="cl.${c.id}.cmr"${c.shart.cmr ? ' checked' : ''}>${mob ? 'CMR’dan' : '<span class="vh">Asl CMR’dan keyin</span>'}</label></td></tr>`).join(''),
			'<thead><tr><th>Mijoz</th><th class="num">Avans</th><th class="num">Qoldiq</th><th>CMR’dan</th></tr></thead>'), false).replace('class="tbl set-t"', 'class="tbl set-t set-cl"');

/* ===== Views (davomi) — haydovchi boti (Telegram imitatsiyasi) va oynalar (manba: c4.js) ===== */

const PHOTO_STEPS = [1, 5]; // «Yukladim» va «Topshirdim» — CMR surati bilan

Object.assign(Views, {

		const u = Data.user(), mine = db.loads.filter(l => l.drv && l.drv.ism === u.ism).sort((a, b) => b.yukT - a.yukT);
		return mine.find(l => Calc.done(l) < 6) || mine[0];
	},
	botButtons(l) {
		const d = Calc.done(l);
		if (d >= 6) return [];
		return d === 4 ? [4, 5] : [d];
	},
	bot() {
		const l = Views.driverLoad();

		const d = Calc.done(l), w = ui.bot.wait;
		const bubble = m => `<div class="msg ${m.from}"><div class="bb">${m.photo ? Views.chatPhoto(m.photo) : ''}${m.m ? `<p>${UI.esc(m.m)}</p>` : ''}<span class="tm">${F.day(m.t) === 'bugun' ? '' : F.date(m.t) + ', '}${Time.hm(m.t)}</span></div></div>`;
		const kb = w != null
			? `<label class="kbtn pri">${UI.icon('camera')}Surat olish<input type="file" accept="image/*" capture="environment" data-botphoto="${w}"></label>
				 <button class="kbtn" data-act="botSample" data-v="${w}">${UI.icon('image')}Namuna surat yuborish</button>
				 <button class="kbtn ghost" data-act="botCancel">Bekor qilish</button>`
			: Views.botButtons(l).map((i, n) => `<button class="kbtn${n === 0 ? ' pri' : ''}" data-act="botStep" data-v="${i}">${PHOTO_STEPS.includes(i) ? UI.icon('camera') : ''}${BOT_BTN[i]}</button>`).join('')

		return `<div class="bw">

	},

	/* --- Oynalar --- */
	prostoyForm() {
		const f = ui.f.pro, l = Data.yuk(f.id), b = Calc.border(l), R = session.role === 'rahbar', sum = (+f.kun || 0) * (+f.tarif || 0);

			<div class="grid2 duo">${UI.field('Prostoy kunlari', UI.unit(UI.num('pro.kun', 'step="1"'), 'kun'), { key: 'pro.kun' })}${UI.field('Tarif', UI.unit(UI.num('pro.tarif', 'step="5"'), '$/kun'), { key: 'pro.tarif' })}</div>
			<div class="total"><span>Mijoz hisobiga alohida qator</span><b id="pro-sum">${F.usd(sum)}</b></div>
			${UI.field('Tashuvchi ham prostoy so‘radi', UI.unit(UI.num('pro.tsum', 'step="10" placeholder="0"'), 'USD'), { key: 'pro.tsum', hint: 'bo‘lsa — tashuvchiga alohida xarajat qatori' })}

	},
	remindForm() {
		return `<p class="hint">Mijozga Telegram yoki SMS orqali yuboriladi.</p><pre class="otxt">${UI.esc(Views.remindText(Data.client(ui.f.rem.cid)))}</pre>`;

/* ===== Steps — amallar ichida qayta ishlatiladigan qadamlar (manba: d.js) ===== */
const Steps = {
	closePops() {
		const open = ui.gs.q || ui.gs.open;
		ui.gs = { q: '', open: false };
		return !!open;
	},
	drawer(type, id) {
		if (Steps.closePops()) Views.render();
		ui.drawer = { type, id, enter: true };
		UI.refresh('layer');
		ui.drawer.enter = false;
		Router.sync();
	},
	refreshAll() { Views.render(); },
	// Bosqichni belgilash: oraliqda qolgan bosqichlar ham shu vaqt bilan yopiladi. Bosqich orqaga ketmaydi (faqat undoStage).
	stage(l, i, by, photo) {
		const now = Time.now(), yk = MODES[l.mode].yuk, ci = MODES[l.mode].chegara;
		for (let j = Calc.done(l); j <= i; j++) {
			l.st[j] = { t: now, by, izoh: '' };
			const m = by === 'haydovchi' ? `«${BOT_BTN[j]}»` : `${Calc.stage(l, j)} — belgilandi`;
			Data.log(l, j === ci + 1 && Calc.border(l) ? `${m}, chegarada ${Calc.border(l).kun} kun` : m, j === 5 ? 'topshir' : j === ci && l.mode === 'avto' ? 'chegara' : 'bosqich', by === 'haydovchi' ? { by, uid: null } : {});
		}
		if (photo) {
			const k = i === 5 ? 'pod' : i === yk ? 'tr' : null;
			if (k) {
				const d = l.docs[k] || { h: 'tekshir', no: '', sana: now, foto: [] };
				d.foto = [...(d.foto || []), photo];
				if (d.h !== 'bor') d.h = 'tekshir';
				l.docs[k] = d;
				Data.log(l, k === 'pod' ? 'Imzolangan CMR surati keldi — tekshiruvda' : 'CMR surati keldi', 'hujjat', { by: 'haydovchi', uid: null });
			}
		}
	},
	// Mijoz to‘lovi: yuk tanlanmasa — eng eski muddatli qarzdan boshlab taqsimlanadi. Qarzdan ortiq qabul qilinmaydi.
	clientPay(cid, lid, usd, usul, som) {
		const order = lid ? [Data.yuk(lid)] : Calc.clientLoads(Data.client(cid)).filter(l => Calc.debt(l) > 0)
			.sort((a, b) => Math.min(...Calc.lines(a).filter(x => x.rest).map(x => x.due == null ? Infinity : x.due)) - Math.min(...Calc.lines(b).filter(x => x.rest).map(x => x.due == null ? Infinity : x.due)));
		let left = usd;
		order.forEach(l => {
			const s = Math.min(left, Calc.debt(l));
			if (s <= 0) return;
			db.pays.push({ kind: 'm', lid: l.id, cid, t: Time.now(), sum: s, usul, val: som ? 'UZS' : 'USD', ...(som ? { som } : {}) });
			Data.log(l, `Mijoz to‘lovi: ${F.usd(s)} (${USUL[usul].toLowerCase()}${som ? `, ${F.som(som)}` : ''})`, 'tolov');
			left -= s;
		});
	},
	carrierPay(crid, lid, usd, usul) {
		const k = Data.carrier(crid), order = lid ? [Data.yuk(lid)] : Calc.carrierLoads(k).filter(l => Calc.cdebt(l) > 0).sort((a, b) => (Calc.clines(a).find(x => x.rest) || {}).due - (Calc.clines(b).find(x => x.rest) || {}).due);
		let left = usd;
		order.forEach(l => {
			const s = Math.min(left, Calc.cdebt(l));
			if (s <= 0) return;
			db.pays.push({ kind: 't', lid: l.id, crid, t: Time.now(), sum: s, usul, val: 'USD' });
			Data.log(l, `Tashuvchiga to‘landi: ${F.usd(s)}, ${k.nom}`, 'ttolov');
			left -= s;
		});
	},
	// Namuna surat (kamera yo‘q joyda): hujjat ko‘rinishidagi oddiy rasm
	sample(title) {
		const c = document.createElement('canvas'); c.width = 480; c.height = 340;
		const g = c.getContext('2d');
		g.fillStyle = '#eef0f3'; g.fillRect(0, 0, 480, 340);
		g.fillStyle = '#ffffff'; g.fillRect(36, 18, 408, 304);
		g.strokeStyle = '#8a919c'; g.lineWidth = 1;
		for (let y = 70; y < 300; y += 26) { g.beginPath(); g.moveTo(56, y); g.lineTo(y % 52 ? 420 : 300, y); g.stroke(); }
		g.fillStyle = '#181b20'; g.font = '600 22px sans-serif'; g.fillText(title, 56, 52);
		g.strokeStyle = '#24508f'; g.lineWidth = 3; g.beginPath(); g.arc(370, 250, 34, 0, Math.PI * 2); g.stroke();
		return c.toDataURL('image/jpeg', 0.7);
	},
	docPhoto(l, k, data) {
		const id = Data.putPhoto(data);
		if (!id) { UI.toast('Telefon xotirasida joy qolmadi — surat saqlanmadi. Namunani boshidan boshlasangiz, eski suratlar o‘chadi.', 4000); return; }
		const d = l.docs[k] || { h: 'tekshir', no: '', sana: Time.now(), foto: [] };
		d.foto = [...(d.foto || []), id];
		if (d.h !== 'bor') d.h = 'tekshir';
		l.docs[k] = d;
		if (ui.f.doc && ui.f.doc.lid === l.id && ui.f.doc.k === k) ui.f.doc.h = d.h;
		Data.log(l, `${Calc.docName(l, k)}: surat biriktirildi`, 'hujjat');
		Data.save(); Views.render();
		if (ui.modalForm === 'docForm') UI.refresh('mbody');
	},
	botSay(from, m, photo) { db.chat.push({ from, t: Time.now(), m, ...(photo ? { photo } : {}) }); },
	botReply(l, i) {
		const hm = Time.hm(Time.now()), lg = F.first(Data.userById(l.logist).ism), b = Calc.border(l);
		return [
			`Qabul qilindi, ${hm}. Yuklab bo‘lgach «Yukladim» tugmasini bosing va CMR suratini yuboring.`,
			`Qabul qilindi, ${hm}. CMR surati hujjatchiga yuborildi. Oq yo‘l!`,
			`Qabul qilindi, ${hm}. Prostoy hisoblagichi boshlandi: ${l.chegara}. Bepul — ${db.set.bepul} kun. Chegaradan o‘tganingizda tugmani bosing.`,
			`Qabul qilindi, ${hm}. Chegarada ${b ? b.kun : 0} kun turdingiz — vaqt belgilari saqlandi. Logist ${lg} xabardor. Oq yo‘l!`,
			`Qabul qilindi, ${hm}. Tushirib bo‘lgach «Topshirdim» tugmasini bosing va imzolangan CMR suratini yuboring.`,
			`Qabul qilindi, ${hm}. Yuk topshirildi, imzolangan CMR hujjatchiga yuborildi. Logist ${lg} xabardor. Asl CMR’ni ofisga yuboring — mijoz to‘lovi shunga bog‘liq. Rahmat!`
		][i];
	},
	botPhoto(i, data) {
		const l = Views.driverLoad();
		if (!l || !Views.botButtons(l).includes(i)) return Views.render();
		const id = Data.putPhoto(data);
		if (!id) { UI.toast('Telefon xotirasida joy qolmadi — surat saqlanmadi.', 4000); return; }
		Steps.botSay('drv', '', id);
		Steps.stage(l, i, 'haydovchi', id);
		Steps.botSay('bot', Steps.botReply(l, i));
		ui.bot.wait = null;
		Data.save(); Views.render(); Steps.chatEnd();
	},
	chatEnd() { const go = () => { const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; }; go(); requestAnimationFrame(go); setTimeout(go, 120); },
	// Ikki marta bosishdan himoya
	guard() { const now = Date.now(); if (now - (Steps.last || 0) < 600) return false; Steps.last = now; return true; }
};

/* ===== Actions — foydalanuvchi amallari (manba: d.js) =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */
const Actions = {
	/* navigatsiya */
	go(d) {
		Steps.closePops(); UI.closeModal();
		Object.assign(ui, { page: d.p || d.v, menu: false, drawer: null });
		Views.render(); window.scrollTo(0, 0);
	},
	toggleMenu() { ui.menu = !ui.menu; Views.render(); },
	openMore() { ui.menu = false; UI.modal('Bo‘limlar', Views.moreSheet()); },
	cardMore(d) { const { acts, trackBtn } = Views.cardActs(Data.yuk(d.id)), main = acts.find(a => a.includes(' pri')) || acts[0]; UI.modal('Amallar', `<div class="sheet-l acts-l">${[...acts.filter(a => a !== main), trackBtn].join('')}</div>`); },
	toggleSearch() { ui.gs.open = !ui.gs.open; ui.gs.q = ''; Views.render(); if (ui.gs.open) $('[data-gsearch]').focus(); },
	closePops() { if (Steps.closePops()) Views.render(); },
	pickRole(d) { session = { pick: d.r }; Views.render(); },
	login() {
		const input = $('#pin'), user = db.users.find(u => u.id === session.pick && u.pin === input.value);
		if (user) {
			session = { role: user.rol, user: user.id };
			Data.saveSession();
			Object.assign(ui, { page: null, drawer: null, bot: { wait: null } });
			Views.render();
			if (session.role === 'haydovchi') Steps.chatEnd();
		} else {
			$('#pinerr').textContent = 'PIN noto‘g‘ri';
			input.value = '';
			input.focus();
		}
	},
	logout() { $('#toasts').innerHTML = ''; UI.closeModal(); session = {}; Data.saveSession(); Steps.closePops(); Object.assign(ui, { menu: false, drawer: null, page: null, f: {}, bot: { wait: null } }); Views.render(); Router.sync(); window.scrollTo(0, 0); },
	install() {
		ui.menu = false;
		Views.render();
		const steps = (title, a, b) => `<h3>${title}</h3><ol class="hint"><li>${a}</li><li>${b}</li></ol>`;
		const manual = () => UI.modal('Telefonga o‘rnatish', steps('iPhone, Safari', '«Ulashish» tugmasi', '«Ekranga qo‘shish»') + steps('Android, Chrome', 'Brauzer menyusi', '«Ilovani o‘rnatish»'), '<button class="btn" data-act="closeModal">Yopish</button>');
		if (!ui.install) return manual();
		ui.install.prompt().catch(manual);
		ui.install = null;
	},
	reloadApp() { location.reload(); },
	closeModal() { UI.closeModal(); },
	confirmOk() { const fn = UI.onConfirm; UI.onConfirm = null; UI.closeModal(); if (fn) fn(); },
	resetDemo() {
		UI.confirm('Namuna boshlang‘ich holatga qaytadi (bugun 11:40), barcha o‘zgarishlar o‘chadi.', 'Boshidan boshlash', () => { Data.seed(); session = {}; Data.saveSession(); Object.assign(ui, { f: {}, drawer: null, page: null, track: null, bot: { wait: null } }); Views.render(); Router.sync(); UI.toast('Namuna boshidan boshlandi'); });
	},
	resetData() { Actions.resetDemo(); },
	openTrackDemo() { const l = db.loads.find(x => x.drv && x.drv.ism === Data.userById('u5').ism && Calc.done(x) < 6) || db.loads[db.loads.length - 1]; ui.track = l.kod; ui.trackDemo = true; Views.render(); Router.sync(); window.scrollTo(0, 0); },
	trackBack() { ui.track = null; ui.trackDemo = false; Views.render(); Router.sync(); },

	openLoad(d) { if (d.id) Steps.drawer('yuk', +d.id); },

	openCarrier(d) { Steps.drawer('tashuvchi', d.id); },

	showFeed() { ui.feedAll = !ui.feedAll; Views.render(); },
