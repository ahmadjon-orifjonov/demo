				<tr class="tot"><td>Jami savdo</td><td>${F.som(td.sum)}</td></tr><tr class="x"><td>Tushum: naqd</td><td>${F.num(td.naqd)}</td></tr><tr class="x"><td>Tushum: o‘tkazma</td><td>${F.num(td.otkazma)}</td></tr></table>`, 'buyurtmalar', 'Buyurtmalarga o‘tish'];
		}
		const ag = Calc.agingAll();
		return ['To‘lov muddati o‘tgan qarz (har xaridorning to‘lov sharti bo‘yicha).', `<table class="calc"><tr><td>1–7 kun</td><td>${F.num(ag.d7)}</td></tr><tr><td>8–30 kun</td><td>${F.num(ag.d30)}</td></tr><tr><td>30 kundan ko‘p</td><td>${F.num(ag.d90)}</td></tr>
			<tr class="tot"><td>Muddati o‘tgan</td><td>${F.som(ag.over)}</td></tr><tr class="x"><td>Muddati kelmagan</td><td>${F.num(ag.kel)}</td></tr></table>`, 'qarzlar', 'Qarzlarga o‘tish'];
	}
};

/* ===== Views: Partiyalar, partiya kartasi, Ombor (manba: c2.js) ===== */

const LOT_FILTERS = [
	['hammasi', 'Hammasi', () => true],
	['yolda', 'Yo‘lda', p => !p.qabul && Calc.stage(p) <= 2],
	['bojxona', 'Bojxonada', p => !p.qabul && Calc.stage(p) === 3],
	['ombor', 'Omborda', p => !!p.qabul && !Calc.closed(p)],
	['yopilgan', 'Yopiq', p => Calc.closed(p)]
];

Object.assign(Views, {
	// Kamomad da’vosi: summa (kg × xarid narxi), holat, sana, izoh, keyingi holat tugmalari
	claim(p, imp) {
		const q = p.qabul, cl = Calc.claim(p), tone = { yuborilmagan: 'amb', yuborildi: 'br', qoplandi: 'grn', rad: 'red' }[q.dava];
		return `<div class="claim"><div class="kv"><span>Yetkazib beruvchiga da’vo</span>${UI.chip(DAVO[q.dava].replace('da’vo ', ''), tone)}</div>
			<table class="calc"><tr class="x"><td>Jami farq (invoys − tarozi)</td><td>${F.kg(cl.diff)}</td></tr>
				${cl.qtyShort ? `<tr class="x"><td>Yetishmagan quti: ${F.num(cl.qtyShort)} × ${F.num(p.kgInv / p.quti)} kg</td><td>${F.kg(cl.boxes)}</td></tr>` : ''}
				<tr class="x"><td>Tarozi farqi ${F.kg(cl.dW)}, usushka me’yori ${F.num(db.set.usushka, 1)} % = ${F.kg(cl.norm)}</td><td>${cl.over ? F.kg(cl.over) : 'me’yorda'}</td></tr>
				<tr class="tot"><td>Da’vo: ${F.kg(cl.kg)} × ${F.num(p.narx, 2)} ${VAL[p.val]}</td><td>${cl.kg ? `${F.num(cl.val, 2)} ${VAL[p.val]}<span class="sub">${F.som(cl.som)}</span>` : 'da’vo yo‘q'}</td></tr></table>
			${cl.kg ? `<p class="rule">${F.kg(cl.kg)} × ${F.num(p.narx, 2)} ${VAL[p.val]} = ${F.num(cl.val, 2)} ${VAL[p.val]} · partiya kursi ${F.num(p.kurs)} = ${F.som(cl.som)}</p>` : ''}
			${q.davoT ? `<p class="hint">${F.when(q.davoT)}${q.davoIzoh ? ` · ${UI.esc(q.davoIzoh)}` : ''}</p>` : ''}
			${imp && cl.kg && DAVO_NEXT[q.dava].length ? `<div class="acts mt8">${DAVO_NEXT[q.dava].map(k => `<button class="btn s" data-act="setClaim" data-id="${p.id}" data-v="${k}">${DAVO_BTN[k]}</button>`).join('')}</div>` : ''}</div>`;
	},
	/* --- Partiyalar --- */
	lots() {
		const cur = LOT_FILTERS.find(f => f[0] === ui.lotFilter) || LOT_FILTERS[0];
		const list = LOT_FILTERS.map(([k, t, fn]) => [k, t, db.lots.filter(fn).length]);
		const rows = db.lots.filter(cur[2]).sort((a, b) => Calc.closed(a) - Calc.closed(b) || (b.id < a.id ? -1 : 1));
		const pct = p => { const s = Calc.soldPct(p); return `<span class="pbar" title="Sotilgan ${F.pct(s.sot)}, bron ${F.pct(s.bron)}"><i style="width:${(s.sot * 100).toFixed(1)}%"></i><i class="b" style="width:${(s.bron * 100).toFixed(1)}%"></i></span><span class="sub">${F.pct(s.sot)} sotildi${s.bron ? ` · ${F.pct(s.bron)} bron` : ''}</span>`; };
		const tan = p => { const c = Calc.cost(p); return `${c.est ? '<span class="muted">~</span>' : ''}${F.num(c.perKg)}`; };
		const cols = [
			['Partiya', 'c-main', p => `${p.id}${UI.mobile() ? ` · ${Data.prod(p.prod).qisqa}` : `<span class="sub">${UI.esc(Data.sup(p.sup).nom)} · ${Data.sup(p.sup).mam}</span>`}`],
			['Mahsulot', 'm-hide', p => Data.prod(p.prod).qisqa],
			['Kg', 'c-aside num', p => `${F.num(p.qabul ? p.qabul.kg : p.kgInv)}<small class="u m-only"> kg</small>`],
			['', 'c-sub d-hide sm-sub', p => `${UI.esc(Data.sup(p.sup).nom)} · ${Data.sup(p.sup).mam}`],
			['Bosqich', 'c-foot', p => `${UI.lotState(p)}<span class="muted m-only">${Calc.closed(p) ? '' : (Calc.stage(p) < 5 ? 'kelishi ' : 'kelgan ') + F.date(Calc.eta(p))}</span>`],
			['Kelish', 'm-hide nowrap', p => `${F.date(Calc.eta(p))}${Calc.delay(p) ? '<span class="sub">taxmin</span>' : ''}`],
			['1 kg tannarx', 'num m-hide', tan],
			['Sotilgan / bron', 'm-hide', pct]
		];
		return `<div class="toolbar">${UI.filter('setLotFilter', cur[0], list, true)}<span class="grow"></span><span class="hint m-hide">Tannarx so‘mda, «~» — taxminiy (qabulgacha invoys kg bo‘yicha)</span></div>
			<section class="card">${UI.table(cols, rows, { open: p => ['openLot', p.id], empty: 'Bu bo‘limda partiya yo‘q', icon: 'lot', cls: 'lots-t' })}</section>`;
	},

	lotCard(id) {
		const p = Data.lot(id);
		if (!p) return Views.drawerHead('Partiya topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'lot')}</div>`;
		const sup = Data.sup(p.sup), pr = Data.prod(p.prod), i = Calc.stage(p), late = Calc.delay(p), c = Calc.cost(p), s = Calc.stock(p), sp = Calc.soldPct(p), closed = Calc.closed(p);
		const imp = can('openStage'), tone = closed ? '' : late ? 'red' : i === 5 ? 'grn' : i === 4 ? 'amb' : 'br';
		const trio = `<div class="trio"><div><span>${p.qabul ? 'Qabul qilingan' : 'Invoys'}</span><b>${UI.u(F.num(p.qabul ? p.qabul.kg : p.kgInv), 'kg')}</b></div>
			<div><span>1 kg tannarx${c.est ? ', taxminiy' : ''}</span><b>${UI.u(F.num(c.perKg), 'so‘m')}</b></div><div><span>Sotilgan</span><b>${UI.u(F.num(Math.round(sp.sot * 100)), '%')}</b></div></div>`;
		// Vertikal bosqichlar: reja / amalda, kechikish, izoh
		const steps = `<ol class="vst">${p.st.map((x, k) => {
			// kechikish joriy bosqichda ko‘rsatiladi (tovar shu yerda turib qolgan), keyingisi — kutilmoqda
			const done = !!x.fact, curL = k === i && late > 0, lateD = x.fact && x.plan ? Time.between(x.plan, x.fact) : 0;
			return `<li class="${curL ? 'done late' : done ? 'done' : k === i + 1 ? 'next' : ''}"><div class="k">${STAGES[k]}${k === i && !closed && i < 5 ? ` <span class="muted sm">· hozir</span>` : ''}</div>${k === 4 ? '<div class="iz muted">omborimizda, karantinda — tarozidan o‘tgach</div>' : ''}
				<div class="v">${x.plan ? `reja ${F.date(x.plan)}` : ''}${done ? ` · amalda <b>${F.date(x.fact)}</b>${lateD > 0 ? ` <span class="red-t">(+${lateD} kun)</span>` : ''}` : ''}${curL ? ` · <b class="red-t">${late} kun kechikmoqda</b> (${STAGES[k + 1].toLowerCase()} rejasi ${F.date(p.st[k + 1].plan)})` : ''}</div>
				${x.izoh ? `<div class="iz">${UI.esc(x.izoh)}</div>` : ''}</li>`;
		}).join('')}</ol>`;
		const docIcon = { bor: 'filecheck', kut: 'fileclock', yoq: 'fileminus' };
		const docs = `<ul class="docs">${DOCS.map(([k, n]) => `<li class="${p.docs[k]}">${imp ? `<button class="docb" data-act="cycleDoc" data-id="${p.id}" data-v="${k}" title="Holatni almashtirish">` : '<span class="docb">'}${UI.icon(docIcon[p.docs[k]])}<span class="x">${n}</span><span class="dst">${DOC_ST[p.docs[k]]}</span>${imp ? '</button>' : '</span>'}</li>`).join('')}</ul>`;
		const costT = `<table class="calc">${c.rows.map(r => `<tr${r.qosh ? ' class="qo"' : ''}><td>${r.nom}${r.izoh ? `<span class="sub">${UI.esc(r.izoh)}</span>` : ''}</td><td>${F.num(r.sum)}</td></tr>`).join('')}
			<tr class="tot"><td>Jami xarajat</td><td>${F.som(c.sum)}</td></tr>
			<tr class="x"><td>÷ ${c.est ? 'invoys' : 'qabul qilingan'} kg</td><td>${F.num(c.base)}</td></tr>
			<tr class="tot big"><td>1 kg tannarx${c.est ? ' (taxminiy)' : ''}</td><td>${F.som(c.perKg)}</td></tr>
			${db.set.qqsHisob ? `<tr class="x"><td>Import QQS ${F.num(c.qqsP)} % — hisobga olinadi, tannarxga kirmaydi<span class="sub">pul chiqimi QQS bilan: ${F.som(c.cash)}</span></td><td>${F.num(c.qqs)}</td></tr>` : ''}</table>
			${p.qot ? `<p class="rule">Tannarx ${F.dateLong(p.qot.t)} da qotirilgan. Keyingi xarajatlar «qo‘shimcha» bo‘lib qo‘shiladi; oldingi sotuvlar marjasi o‘zgarmaydi.</p>` : `<p class="rule">Partiya kursi: 1 ${VAL[p.val]} = ${F.num(p.kurs)} so‘m (oldindan to‘lov kunida qotgan).</p>`}`;
		const q = p.qabul, rec = q && (() => {
			const dk = q.kg - p.kgInv, pc = dk / p.kgInv, val = Calc.r1000(-dk * c.perKg);
			return `<table class="calc"><tr><td>Invoys</td><td>${F.num(p.quti)} quti · ${F.kg(p.kgInv)}</td></tr><tr><td>Qabul (tarozi)</td><td>${F.num(q.quti)} quti · ${F.kg(q.kg)}</td></tr>
				<tr class="tot"><td>Farq</td><td class="${dk < 0 ? 'red-t' : ''}">${F.diff(q.quti - p.quti, dk)} · ${F.pct(Math.abs(pc), 1)}${dk < 0 ? ` · ${F.mln(val)} so‘m` : ''}</td></tr></table>
				<p class="note mt8">${q.sabab ? `Sabab: <b>${QABUL_SABAB[q.sabab]}</b>` : `Usushka me’yorida (≤ ${F.num(db.set.usushka, 1)} %)`} · ${q.kamera} · ${F.when(q.t)}, ${F.short(Data.userById(q.uid).ism)}</p>
				${q.sabab === 'kamomad' || q.sabab === 'qadoq' ? Views.claim(p, imp) : ''}`;
		})();
		const stockT = q && `<table class="calc"><tr><td>Qabul qilingan</td><td>${F.kg(s.qabul)}</td></tr><tr class="x"><td>Sotilgan (yig‘ilgan)</td><td>${s.sot ? `−${F.num(s.sot)}` : 0}</td></tr>${s.chiq ? `<tr class="x"><td>Hisobdan chiqarilgan</td><td>−${F.num(s.chiq)}</td></tr>` : ''}
			<tr class="tot"><td>Qoldiq${p.kamera ? ` · ${p.kamera}` : ''}</td><td>${F.kg(s.qoldiq)}</td></tr><tr class="x"><td>Bron</td><td>${F.num(s.bron)}</td></tr>${s.karantin ? `<tr class="x"><td>Karantin</td><td>${F.num(s.karantin)}</td></tr>` : ''}${s.muddati ? `<tr class="x"><td class="red-t">Muddati o‘tgan</td><td>${F.num(s.muddati)}</td></tr>` : ''}
			<tr class="x"><td><b>Sotish mumkin</b></td><td><b>${F.num(s.bosh)}</b></td></tr></table>${p.yaroq ? `<p class="rule">Ishlab chiqarilgan ${F.date(p.ishlab)}, yaroqli ${F.dateLong(p.yaroq)} gacha — ${Calc.daysLeft(p)} kun qoldi.</p>` : ''}`;
		const os = Calc.lotOrders(p).sort((a, b) => b.id - a.id), shown = os.slice(0, 10);
		const sales = os.length ? `<table class="calc">${shown.map(o => `<tr><td><button class="link" data-act="openOrder" data-id="${o.id}">${UI.esc(Data.client(o).nom)}</button><span class="sub">${F.oid(o)} · ${F.day(o.sana)} · ${STATUS[o.holat].t}${!p.qabul ? ' · dastlabki bron' : ''}</span></td><td>${F.kg(Calc.oKg(o))}</td></tr>`).join('')}</table>${os.length > 10 ? `<p class="hint mt8">Yana ${os.length - 10} ta buyurtma</p>` : ''}` : '<p class="muted sm">Hali bron va sotuv yo‘q</p>';
		const pf = Calc.profit(p), pfMax = Math.max(pf.exp, pf.now, 1);
		const profit = `<div class="pf"><div class="kv"><span>${closed ? 'Yakuniy' : 'Hozirgacha'} (sotilgan ${F.kg(pf.sold)})</span><b>${F.som(pf.now)}</b></div><div class="share"><i style="width:${Math.max(0, pf.now / pfMax * 100).toFixed(1)}%;--c:var(--grn)"></i><i style="width:${Math.max(0, (pf.exp - pf.now) / pfMax * 100).toFixed(1)}%;--c:var(--grnt)"></i></div>
			<div class="kv"><span>Kutilgan (qolgan ${F.kg(pf.restKg)} × o‘rtacha ${F.num(pf.avg)} so‘m)</span><b>${F.som(pf.exp)}</b></div></div>`;
		const pd = Calc.supDebt(p);
		const supT = `<table class="calc"><tr><td>Xarid summasi</td><td>${F.val(Calc.buy(p), p.val)}</td></tr>${p.tolov.map(t => `<tr class="x"><td>To‘landi ${F.date(t.t)}</td><td>${F.val(t.sum, p.val)}</td></tr>`).join('')}
			<tr class="tot"><td>Qoldiq</td><td>${pd > 0 ? `${F.val(pd, p.val)}${p.qolganTolov ? `<span class="sub">muddati ${F.date(p.qolganTolov)}</span>` : ''}` : 'yo‘q'}</td></tr></table>`;
		const hist = db.events.filter(e => e.lot === p.id).slice().reverse();
		const next = i < 5 && !closed ? (i === 3 ? 'Laboratoriyaga' : ['', 'Yuklandi', 'Chegaraga yetdi', 'Bojxonaga kirdi', '', 'Xulosa olindi — sotuvga'][i + 1]) : '';
		const acts = imp && !closed ? [
			`<button class="btn" data-act="openCost" data-id="${p.id}">${UI.icon('plus')}Xarajat</button>`,
			p.qabul && !p.qot ? `<button class="btn" data-act="fixCost" data-id="${p.id}">Tannarxni qotirish</button>` : '',
			i < 5 ? `<button class="btn${i === 3 ? '' : ' pri'}" data-act="openStage" data-id="${p.id}">${next}</button>` : ''
		].join('') : '';
		return Views.drawerHead(`${p.id} ${UI.chip(Calc.holat(p) + (late ? ` · ${late} kun` : ''), tone)}`, `${UI.esc(sup.nom)} · ${sup.mam} · ${pr.nom}`)
			+ `<div class="dbody">${trio}
				${late ? `<div class="note warn mt16"><b>${STAGES[i]}da ${late} kun kechikmoqda.</b> ${UI.esc(p.st[i].izoh.replace(/.$/, ""))}. Muzlagan pul: <b>${F.som(c.cash)}</b>.</div>` : ''}
				${i === 3 && p.chiqdi ? `<div class="note info mt16">${UI.icon('truck')}<span>Bojxonadan chiqdi, ${F.day(p.st[4].plan)} omborga keladi — omborchi tarozida qabul qiladi.</span></div>` : ''}
				<div class="dsec"><h3>Bosqichlar</h3>${steps}</div>
				<div class="dsec"><h3>Hujjatlar</h3>${docs}</div>
				<div class="dsec"><h3>Xarajatlar va 1 kg tannarx</h3>${costT}</div>
				${rec ? `<div class="dsec"><h3>Qabul natijasi</h3>${rec}</div>` : ''}
				${stockT ? `<div class="dsec"><h3>Qoldiq</h3>${stockT}</div>` : ''}
				<div class="dsec"><h3>Bron va sotuvlar</h3>${sales}</div>
				<div class="dsec"><h3>Foyda</h3>${profit}</div>
				<div class="dsec"><h3>Yetkazib beruvchiga to‘lov</h3>${supT}</div>
				${hist.length ? `<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}<small>${UI.esc(Views.actor(e))}</small></span></li>`).join('')}</ul></div>` : ''}
			</div>${acts ? `<div class="dfoot">${acts}</div>` : ''}`;
	},

	/* --- Ombor (sovutgich) --- */
	stock() {
		const rows = Calc.byProd(), all = Calc.stockAll(), canOff = can('openWriteOff');
		const dl = p => { const d = Calc.daysLeft(p); return `<span class="${d <= 14 ? 'red-t strong' : d <= 30 ? 'amb-t strong' : ''}">${d < 0 ? 'o‘tgan' : d}</span>`; };
		const st = p => { const s = Calc.stock(p); return Calc.stage(p) < 5 ? UI.chip('Karantin', 'amb') : s.muddati ? UI.chip('Muddati o‘tgan', 'red') : UI.chip('Sotish mumkin', 'grn'); };
		const lotLink = p => can('openLot') ? `<button class="link" data-act="openLot" data-id="${p.id}">${p.id}</button>` : p.id;
		const sumLine = `<div class="sums card"><div><span class="l">Jami omborda</span><b>${UI.u(F.num(all.jami), 'kg')}</b></div><div><span class="l">Bron</span><b>${UI.u(F.num(all.bron), 'kg')}</b></div>
			<div><span class="l">Karantin</span><b>${UI.u(F.num(all.karantin), 'kg')}</b></div><div><span class="l">Sotish mumkin</span><b class="grn-t">${UI.u(F.num(all.bosh), 'kg')}</b></div></div>`;
		let body;
		if (UI.mobile()) {
			body = rows.map(r => `<section class="card pcard"><button class="prow" data-act="toggleProd" data-id="${r.pr.k}" aria-expanded="${ui.openProd === r.pr.k}"><span class="x"><span class="t">${r.pr.nom}</span>
				<span class="m">jami ${F.kg(r.jami)} · bron ${F.num(r.bron)}${r.karantin ? ` · karantin ${F.num(r.karantin)}` : ''}</span></span><span class="pv"><span class="muted sm">sotish mumkin</span><b>${F.kg(r.bosh)}</b></span>${UI.icon('down')}</button>
				${r.riskKg ? `<p class="risk">${UI.icon('hourglass')}${F.kg(r.riskKg)} bron qilinmagan — muddati 14 kundan kam${r.riskBron ? ` · shundan tashqari bron ${F.num(r.riskBron)}` : ''}</p>` : ''}
				${ui.openProd === r.pr.k ? `<div class="plots">${r.lots.length ? r.lots.map(p => { const s = Calc.stock(p); return `<div class="plot"><div class="kv"><span>${lotLink(p)} · ${p.kamera}</span>${st(p)}</div>
					<div class="kv"><span>Qoldiq ${F.kg(s.qoldiq)} · bron ${F.num(s.bron)}</span><span>${dl(p)} kun · ${F.date(p.yaroq)}</span></div>${canOff && s.qoldiq - s.bron > 0 ? `<button class="link sm" data-act="openWriteOff" data-id="${p.id}">Hisobdan chiqarish</button>` : ''}</div>`; }).join('') : '<p class="muted sm">Qoldiq yo‘q</p>'}</div>` : ''}</section>`).join('');
		} else {
			body = `<section class="card"><div class="tw"><table class="tbl stock-t"><thead><tr><th>Mahsulot / partiya</th><th>Kamera</th><th>Yaroqlilik</th><th class="num">Qolgan kun</th><th>Holat</th><th class="num">Jami</th><th class="num">Bron</th><th class="num">Karantin</th><th class="num">Sotish mumkin</th></tr></thead><tbody>
				${rows.map(r => `<tr class="grp ck"><td><button class="rowlink" data-act="toggleProd" data-id="${r.pr.k}" aria-expanded="${ui.openProd === r.pr.k}">${UI.icon(ui.openProd === r.pr.k ? 'down' : 'chev')}<span>${r.pr.nom}<span class="sub">${r.lots.length} partiya</span></span></button></td>
					<td>${[...new Set(r.lots.map(p => p.kamera))].join(', ') || '—'}</td><td>${r.near ? F.date(r.near) : '—'}</td><td class="num">${r.lots.length ? dl(r.lots[0]) : ''}</td><td>${r.riskKg ? `<span class="red-t strong">${F.kg(r.riskKg)} ≤14 kun</span><span class="sub">bron qilinmagan${r.riskBron ? ` · bron ${F.num(r.riskBron)}` : ''}</span>` : ''}</td>
					<td class="num">${F.num(r.jami)}</td><td class="num">${F.num(r.bron)}</td><td class="num">${F.num(r.karantin)}</td><td class="num strong">${F.num(r.bosh)}</td></tr>
					${ui.openProd === r.pr.k ? r.lots.map(p => { const s = Calc.stock(p); return `<tr class="mem"><td>${lotLink(p)}${canOff && s.qoldiq - s.bron > 0 ? ` <button class="link sm" data-act="openWriteOff" data-id="${p.id}">chiqarish</button>` : ''}</td><td>${p.kamera}</td><td>${F.date(p.yaroq)}</td><td class="num">${dl(p)}</td><td>${st(p)}</td>
						<td class="num">${F.num(s.qoldiq)}</td><td class="num">${F.num(s.bron)}</td><td class="num">${F.num(s.karantin)}</td><td class="num">${F.num(s.bosh)}</td></tr>`; }).join('') : ''}`).join('')}
				</tbody><tfoot><tr><td>Jami, kg</td><td></td><td></td><td></td><td></td><td class="num">${F.num(all.jami)}</td><td class="num">${F.num(all.bron)}</td><td class="num">${F.num(all.karantin)}</td><td class="num">${F.num(all.bosh)}</td></tr></tfoot></table></div>
				<div class="cf2">Partiyalar FEFO tartibida — muddati eng yaqini tepada. Qolgan kun: 15–30 sariq, 14 va kam — qizil. Tannarx bu yerda ko‘rsatilmaydi — u har partiyada alohida.</div></section>`;
		}
		const tur = { kirim: ['Kirim', '+'], chiqim: ['Chiqim', '−'], qaytish: ['Qaytish', '+'], chiqarish: ['Hisobdan chiqarish', '−'] };
		const moves = db.moves.slice(-14).reverse();
		const mv = UI.table([
			['Vaqt', 'c-aside nowrap', m => F.when(m.t)],
			['Harakat', 'c-main', m => `${tur[m.tur][0]} · ${m.lot}`],
			['Kg', 'num', m => `<span class="${tur[m.tur][1] === '+' ? 'grn-t' : ''}">${tur[m.tur][1]}${F.num(m.kg)}</span>`],
			['Izoh', 'c-sub', m => UI.esc(m.izoh)]
		], moves, { cls: 'mv-t' });
		return `${sumLine}${body}<div class="mt16">${UI.card('Harakatlar', mv)}</div>`;
	}
});

/* ===== Views: Buyurtmalar, yangi buyurtma, Xaridorlar, Qarzlar (manba: c3.js) ===== */

const ORDER_FILTERS = [
	['faol', 'Faol', o => !DONE_ST.includes(o.holat) && o.holat !== 'bekor'],
	['tasdiq', 'Tasdiq kutmoqda', o => o.holat === 'yangi'],
	['bugun', 'Bugun', o => o.sana === Time.today && o.holat !== 'bekor'],
	['topshirildi', 'Topshirilgan', o => DONE_ST.includes(o.holat)],
	['hammasi', 'Hammasi', () => true]
];
const TERMS = [['-1', 'Oldindan to‘lov'], ['0', 'Yetkazganda, naqd'], ['7', '7 kun'], ['10', '10 kun'], ['14', '14 kun'], ['21', '21 kun']];
const termText = sh => sh.oldin ? 'oldindan' : sh.kun ? `${sh.kun} kun` : 'yetkazganda';

Object.assign(Views, {
	/* --- Buyurtmalar --- */
	orders() {
		const f = ui.orderFilter, mine = db.orders.filter(Views.mine), list = ORDER_FILTERS.map(([k, t, fn]) => [k, t, mine.filter(fn).length]);
		return `<div class="toolbar">${UI.filter('setOrderFilter', f.st, list)}<span class="grow"></span>${UI.search('orderFilter', f.q, 'Xaridor yoki raqam')}</div>
			<section class="card" id="list">${Views.ordersList()}</section>`;
	},
	// To‘lov holati: topshirilgan buyurtma FIFO bo‘yicha yopilganmi
	payState(o) {
		if (o.holat === 'bekor') return '';
		if (!DONE_ST.includes(o.holat)) return `<span class="muted">${termText(o.shart)}</span>`;
		const x = Calc.aging(Data.client(o)).list.find(r => r.o.id === o.id);
		if (!x) return UI.flag('To‘langan', 'grn');
		return x.over > 0 ? UI.chip(`${x.over} kun o‘tdi`, 'red') : UI.flag(`muddati ${F.date(Calc.due(o))}`, 'mute');
	},
	ordersList() {
		const f = ui.orderFilter, fn = (ORDER_FILTERS.find(x => x[0] === f.st) || ORDER_FILTERS[0])[2], q = f.q.trim().toLowerCase();
		const rows = db.orders.filter(o => Views.mine(o) && fn(o) && (!q || String(o.id).includes(q) || Data.client(o).nom.toLowerCase().includes(q)))
			.sort((a, b) => (b.holat === 'yangi') - (a.holat === 'yangi') || (f.st === 'faol' ? (a.sana < b.sana ? -1 : a.sana > b.sana ? 1 : a.id - b.id) : b.id - a.id));
		const shown = rows.slice(0, ui.orderLimit);
		const cols = [
			['Xaridor', 'c-main', o => `${UI.esc(Data.client(o).nom)}<span class="sub">${F.oid(o)} · ${F.short(Data.userById(o.mid).ism)}</span>`],
			['Summa', 'c-aside num', o => F.num(Calc.oSum(o))],
			['Mahsulot', 'c-sub', o => `${Data.prod(o.prod).qisqa} · ${F.kg(Calc.oKg(o))}${UI.mobile() ? '' : `<span class="sub">${o.lot}</span>`}`],
			['Yetkazish', 'm-hide nowrap', o => F.day(o.sana)],
			['Holat', 'c-foot', o => `${o.holat === 'yangi' ? UI.chip('Tasdiq kutmoqda', 'amb') : UI.sd(o)}<span class="m-only">${F.day(o.sana)} · ${Views.payState(o)}</span>`],
			['To‘lov', 'm-hide', Views.payState]
		];
		return UI.table(cols, shown, { open: o => ['openOrder', o.id], empty: 'Bu bo‘limda buyurtma yo‘q', icon: 'list' })
			+ (rows.length > shown.length ? `<div class="more-row"><button class="link sm" data-act="moreOrders">Yana ${Math.min(40, rows.length - shown.length)} ta (jami ${rows.length})</button></div>` : '');
	},

	orderCard(id) {
		const o = Data.order(id);
		if (!o) return Views.drawerHead('Buyurtma topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'list')}</div>`;
		const c = Data.client(o), p = Data.lot(o.lot), pr = Data.prod(o.prod), m = Calc.margin(o.narx, o.tan);
		const chainL = [['tasdiq', 'Tasdiqlandi', o.ts.tasdiq || (o.holat !== 'yangi' ? o.t : null)], ['yigildi', 'Yig‘ildi', o.ts.yigildi], ['yolda', 'Yo‘lda', o.ts.yolda], ['topshirildi', 'Topshirildi', o.ts.topshirildi]];
		const order = ['yangi', 'tasdiq', 'yigildi', 'yolda', 'topshirildi'], at = order.indexOf(o.holat === 'muammo' ? 'topshirildi' : o.holat);
		const chain = `<ol class="chain"><li class="done"><span class="k">Buyurtma</span><span class="v">${F.when(o.t)}</span></li>${chainL.map(([k, t, ts]) => {
			const i = order.indexOf(k);
			return `<li class="${i < at || (i === at && k === 'topshirildi') ? 'done' : i === at ? 'cur' : ''}"><span class="k">${t}</span><span class="v">${ts && i <= at ? F.when(ts) : ''}</span></li>`;
		}).join('')}${o.holat === 'bekor' ? `<li class="bad"><span class="k">Bekor qilindi</span><span class="v">${UI.esc(o.sabab)}</span></li>` : ''}</ol>`;
		const kgRow = `${F.kg(o.kg)}${o.kgFakt != null && o.kgFakt !== o.kg ? ` → yig‘ildi ${F.kg(o.kgFakt)}` : ''}${o.qaytdi ? ` · <span class="red-t">qaytdi ${F.kg(o.qaytdi)}</span>` : ''}`;
		const hist = db.events.filter(e => e.oid === o.id).slice().reverse();
		const acts = [];
		if (o.holat === 'yangi' && can('approveOrder')) acts.push(`<button class="btn pri" data-act="approveOrder" data-id="${o.id}">${UI.icon('check')}Tasdiqlash</button>`);
		const cancel = OPEN_ST.includes(o.holat) && can('cancelOrder') && Views.mine(o) ? `<button class="btn ghost dng" data-act="cancelOrder" data-id="${o.id}">Bekor qilish</button>` : '';
		return Views.drawerHead(`${F.oid(o)} ${UI.status(o)}`, `${pr.qisqa}, ${F.kg(Calc.oKg(o))} · ${F.day(o.sana)}`)
			+ `<div class="dbody">
				${o.holat === 'yangi' ? `<div class="note warn"><b>Direktor tasdig‘ida:</b> ${(o => { const i = Calc.needInfo(c, Calc.oSum(o), o.narx, o.prod, o.id); return (i.length ? i.map(x => x.t) : o.need.map(k => NEED[k])).join('; '); })(o)}.${o.izoh ? ` Menejer izohi: «${UI.esc(o.izoh)}»` : ''}</div>` : ''}
				${UI.dl([
					['Xaridor', `<button class="link" data-act="openClient" data-id="${c.id}">${UI.esc(c.nom)}</button>`],
					['Aloqa', `${UI.esc(c.kontakt)} · ${UI.esc(c.tel)} ${UI.call(c.tel)}`],
					['Mahsulot', pr.nom],
					['Partiya', `${can('openLot') ? `<button class="link" data-act="openLot" data-id="${p.id}">${p.id}</button>` : p.id}${p.kamera ? ` · ${p.kamera}` : ''} · ${Calc.holat(p).toLowerCase()}${o.fefo ? `<span class="sub muted"> · FEFO emas: ${UI.esc(o.fefo)}</span>` : ''}`],
					['Kg', kgRow],
					['Narx', `${F.num(o.narx)} so‘m/kg <span class="muted">· ro‘yxat ${F.num(pr.narx[c.narx])}, minimal ${F.num(pr.min)}</span>`],
					['Summa', `<b>${F.som(Calc.oSum(o))}</b>`],
					['To‘lov sharti', termText(o.shart) + (DONE_ST.includes(o.holat) ? ` · ${Views.payState(o)}` : '')],
					['Yetkazish', `${F.dateLong(o.sana)} · ${UI.esc(Data.userById(o.drv).ism)}`],
					['Menejer', UI.esc(Data.userById(o.mid).ism)],
					o.sabab && o.holat !== 'bekor' && ['Qaytish sababi', UI.esc(o.sabab)],
					o.izoh && o.holat !== 'yangi' && ['Izoh', UI.esc(o.izoh)]
				])}
				<div class="dsec"><h3>Partiya tannarxi va marja</h3><table class="calc"><tr><td>Sotuv narxi</td><td>${F.num(o.narx)}</td></tr><tr class="x"><td>Partiya tannarxi (sotuv paytida)</td><td>${F.num(o.tan)}</td></tr>
					<tr class="tot"><td>Marja</td><td class="${m < 0.05 ? 'red-t' : ''}">${F.pct(m, 1)} · ${F.som((o.narx - o.tan) * Calc.oKg(o))}</td></tr></table></div>
				<div class="dsec"><h3>Holat</h3>${chain}</div>
				${hist.length ? `<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}<small>${UI.esc(Views.actor(e))}</small></span></li>`).join('')}</ul></div>` : ''}
			</div>${acts.length || cancel ? `<div class="dfoot">${cancel}<span class="grow"></span>${acts.join('')}</div>` : ''}`;
	},

	/* --- Yangi buyurtma (o‘ng panel) --- */
	noCap(f) {
		const p = f.lot && Data.lot(f.lot);
		if (!p) return Infinity;
		const s = Calc.stock(p);
		return Calc.sellable(p) ? s.bosh : s.cap;
	},
	noFefoBroken: f => { const first = Calc.fefo(f.prod).sell[0], p = Data.lot(f.lot); return !!(first && p && Calc.sellable(p) && first.id !== p.id); },
	noTan: f => f.lot ? Calc.cost(Data.lot(f.lot)).perKg : 0,
	noOrderSum: f => Calc.r1000((+f.kg || 0) * (+f.narx || 0)),
	neworderCard() {
		const f = ui.f.no;
		if (!f) return '';
		const days = [[0, 'Bugun'], [1, 'Ertaga'], [2, F.date(Time.add(2))]];
		return Views.drawerHead('Yangi buyurtma', 'Savdo menejeri')
			+ `<form class="dbody nof" data-form="newOrder" autocomplete="off">
				${UI.field('Xaridor', `<div id="no-hit">${Views.noHit()}</div>`, { key: 'no.cid' })}
				<div class="fld"><span>Mahsulot</span>${UI.seg('pickProd', f.prod, db.prods.map(p => [p.k, p.qisqa]), 'full3')}</div>
				<div class="grid2 duo">${UI.field('Kg', UI.unit(UI.num('no.kg', 'placeholder="0"'), 'kg'), { key: 'no.kg', hint: '20 kg quti' })}
					${UI.field('Narx', UI.unit(UI.num('no.narx'), 'so‘m/kg'), { key: 'no.narx' })}</div>
				<div class="fld"><span>Partiya — FEFO bo‘yicha taklif</span><div id="no-lots">${Views.noLots()}</div><small class="ferr" data-err="no.lot"></small></div>
				<div class="grid2 duo">${UI.field('To‘lov sharti', UI.select('no.kun', TERMS))}${UI.field('Haydovchi', UI.select('no.drv', db.users.filter(u => u.rol === 'haydovchi').map(u => [u.id, u.ism])))}</div>
				<div class="fld"><span>Yetkazish</span>${UI.seg('pickDay', f.day, days, 'full3')}</div>
				${UI.field('Izoh', `<textarea class="in" data-f="no.izoh" rows="2" placeholder="Ixtiyoriy">${UI.esc(f.izoh)}</textarea>`)}
				<div id="no-sum">${Views.noSummary()}</div>
			</form><div class="dfoot" id="no-bar">${Views.noBar()}</div>`;
	},
	noHit() {
		const f = ui.f.no, c = f.cid && Data.client(f.cid);
		if (c) {
			const debt = Calc.debt(c), a = Calc.aging(c);
			return `<div class="hit"><span class="x"><span class="t">${UI.esc(c.nom)}</span><span class="m">${XTUR[c.tur]} · narx: ${NARX_TUR[c.narx].toLowerCase()}</span>
				<span class="m">Qarz <b class="${a.over ? 'red-t' : ''}">${F.mln(debt)}</b>${a.over ? ` (o‘tgan ${F.mln(a.over)})` : ''} · chegara ${F.mln(c.limit)}</span></span>${(mo => `<span class="spk">${UI.spark(mo)}<small>6 oylik xarid, t · oxirgi oy ${F.t(mo[5])}</small></span>`)(Calc.months(c))}
				<button type="button" class="btn s ghost" data-act="clearClient" aria-label="Boshqa xaridor" title="Boshqa xaridor">${UI.icon('x')}<span class="m-hide">O‘zgartirish</span></button></div>`;
		}
		return `<div class="search wide">${UI.icon('search')}<input class="in" data-f="no.q" value="${UI.esc(f.q)}" placeholder="Nomi yoki mas’ul shaxs" autofocus></div><div id="no-picks">${Views.noPicks()}</div>`;
	},
	noPicks() {
		const q = ui.f.no.q.trim().toLowerCase(), list = db.clients.filter(x => Views.mineC(x) && (!q || x.nom.toLowerCase().includes(q) || x.kontakt.toLowerCase().includes(q))).slice(0, q ? 6 : 4);
		return `<div class="picks">${list.map(x => `<button type="button" class="pick" data-act="pickClient" data-id="${x.id}"><span class="t">${UI.esc(x.nom)}</span><span class="m">qarz ${F.mln(Calc.debt(x))} · chegara ${F.mln(x.limit)}</span></button>`).join('') || '<p class="muted sm">Topilmadi</p>'}</div>`;
	},
	noLots() {
		const f = ui.f.no, { sell, wait } = Calc.fefo(f.prod);
		const opt = (p, i, pre) => {
			const s = Calc.stock(p), cap = pre ? s.cap : s.bosh, d = Calc.daysLeft(p);
			return `<button type="button" class="lopt" data-act="pickLot" data-id="${p.id}" aria-pressed="${f.lot === p.id}"><span class="rd"></span><span class="x"><span class="t">${p.id}${!pre && i === 0 ? ' <span class="st br">FEFO</span>' : ''}${pre ? ` <span class="st amb">${p.qabul ? 'karantin' : 'dastlabki bron'}</span>` : ''}</span>
				<span class="m">${pre ? `${Calc.holat(p)} · kelishi ${F.date(p.qabul ? p.st[5].plan : Calc.eta(p))}` : `${p.kamera} · ${d} kun qoldi`}</span></span><span class="cap"><b>${F.num(cap)}</b><span class="m">${pre ? 'bron mumkin' : 'sotish mumkin'}</span></span></button>`;
		};
		return `<div class="lopts">${sell.map((p, i) => opt(p, i, false)).join('')}${wait.map(p => opt(p, 1, true)).join('')}${!sell.length && !wait.length ? '<p class="muted sm">Bu mahsulot omborda ham, yo‘lda ham yo‘q</p>' : ''}</div>
			${Views.noFefoBroken(f) ? UI.field('Nega FEFO emas?', UI.input('no.fefo', 'placeholder="Masalan: xaridor shu partiyani so‘radi"'), { key: 'no.fefo', cls: 'mt8' }) : ''}
			${f.lot && !Calc.sellable(Data.lot(f.lot)) ? `<p class="hint mt8">${Data.lot(f.lot).qabul ? 'Karantindagi partiya — laboratoriya xulosasidan keyin yig‘iladi.' : 'Yo‘ldagi partiya — dastlabki bron. Omborga tarozida qabul qilingach qattiq bronga o‘tadi; kam chiqsa ogohlantiriladi.'}</p>` : ''}`;
	},
	noSummary() {
		const f = ui.f.no, c = f.cid && Data.client(f.cid), pr = Data.prod(f.prod), sum = Views.noOrderSum(f), tan = Views.noTan(f), m = Calc.margin(+f.narx || 0, tan);
		const needs = c && +f.kg > 0 ? Calc.needs(c, sum, +f.narx || 0, f.prod) : [];
		return `<div class="nsum"><table class="calc">
			<tr class="x"><td>Narx ro‘yxati${c ? ` (${NARX_TUR[c.narx].toLowerCase()})` : ''}</td><td>${c ? F.num(pr.narx[c.narx]) : '—'}</td></tr>
			<tr class="x"><td>Minimal narx (menejer o‘zi tushira oladi)</td><td>${F.num(pr.min)}</td></tr>
			${tan ? `<tr class="x"><td>Partiya tannarxi${Calc.cost(Data.lot(f.lot)).est ? ' (taxminiy)' : ''}</td><td>${F.num(tan)}</td></tr><tr class="x"><td>Marja</td><td class="${m < 0.05 ? 'red-t' : ''}">${F.pct(m, 1)}</td></tr>` : ''}
			<tr class="tot"><td>Summa</td><td>${F.som(sum)}</td></tr></table>
			${needs.length ? `<p class="hint mt8">Buyurtma saqlanadi, direktor tasdiqlagach yig‘iladi.</p>` : ''}</div>`;
	},
	noBar() {
		const f = ui.f.no, info = f.cid && +f.kg > 0 ? Calc.needInfo(Data.client(f.cid), Views.noOrderSum(f), +f.narx || 0, f.prod) : [];
		return `${info.length ? `<div class="need-l">${UI.icon('alert')}<span><b>Direktor tasdig‘iga:</b> ${info.map(x => x.t).join('; ')}</span></div>` : ''}
			<span class="grow tot-l">${F.som(Views.noOrderSum(f))}</span><button class="btn m-hide" data-act="closeDrawer">Bekor qilish</button><button class="btn pri" data-act="submitOrder">${info.length ? 'Tasdiqqa yuborish' : 'Saqlash'}</button>`;
	},

	/* --- Xaridorlar --- */
	clients() {
		return `<div class="toolbar">${UI.search('clientQ', ui.clientQ || '', 'Nomi yoki mas’ul shaxs')}<span class="grow"></span><span class="hint m-hide">Hajm — oxirgi 30 kun. 14 kundan ko‘p olmagan xaridor sariq bilan.</span></div>
			<section class="card" id="clist">${Views.clientsList()}</section>`;
	},
	clientsList() {
		const q = (ui.clientQ || '').trim().toLowerCase();
		const rows = db.clients.filter(c => Views.mineC(c) && (!q || c.nom.toLowerCase().includes(q) || c.kontakt.toLowerCase().includes(q))).sort((a, b) => Calc.debt(b) - Calc.debt(a));
		const last = c => { const d = Calc.lastBuy(c), n = d ? Time.between(d, Time.today) : 99; return n >= 14 ? UI.flag(`${n} kundan beri olmagan`, 'amb') : `<span class="muted">${n ? n + ' kun oldin' : 'bugun'}</span>`; };
		const debt = c => { const a = Calc.aging(c), d = Calc.debt(c); return d ? `<span class="${a.over ? 'red-t' : ''}">${F.num(d)}</span>${a.over ? `<span class="sub red-t">o‘tgan ${F.mln(a.over)}</span>` : ''}` : '<span class="muted">—</span>'; };
		return UI.table([
			['Xaridor', 'c-main', c => `${UI.esc(c.nom)}<span class="sub">${XTUR[c.tur]} · ${UI.esc(c.kontakt)}</span>`],
			['Qarz', 'c-aside num', debt],
			['Menejer', 'm-hide', c => F.short(Data.userById(c.mid).ism)],
			['Oylik hajm', 'num', c => F.tn(Calc.monthKg(c))],
			['Chegara', 'num m-hide', c => F.mln(c.limit)],
			['6 oy', 'm-hide', c => UI.spark(Calc.months(c), 72, 20)],
			['Oxirgi xarid', 'c-foot', last]
		], rows, { open: c => ['openClient', c.id], empty: 'Xaridor topilmadi', icon: 'users' });
	},
	clientCard(id) {
		const c = Data.client(id), a = Calc.aging(c), debt = Calc.debt(c), mo = Calc.months(c);
		const os = db.orders.filter(o => o.cid === c.id).sort((x, y) => y.id - x.id), ps = db.pays.filter(p => p.cid === c.id).sort((x, y) => y.t - x.t);
		const histRow = o => `<tr class="ck"><td class="c-main"><button class="rowlink" data-act="openOrder" data-id="${o.id}">${F.date(o.sana)}</button></td><td class="c-aside num">${F.num(Calc.oSum(o))}</td>
			<td class="c-sub">${Data.prod(o.prod).qisqa} · ${F.kg(Calc.oKg(o))}</td><td>${UI.sd(o)}</td></tr>`;
		const btns = [
			can('openNewOrder') ? `<button class="btn pri" data-act="openNewOrder" data-id="${c.id}">${UI.icon('plus')}Buyurtma</button>` : '',
			debt && can('openPayment') ? `<button class="btn" data-act="openPayment" data-id="${c.id}">${UI.icon('coin')}To‘lov</button>` : '',
			debt && can('openRemind') ? `<button class="btn" data-act="openRemind" data-id="${c.id}">${UI.icon('send')}Eslatma</button>` : '',
			`<button class="btn" data-act="openAct" data-id="${c.id}">${UI.icon('file')}Qarz akti</button>`
		].join('');
		return Views.drawerHead(UI.esc(c.nom), `${XTUR[c.tur]} · ${UI.esc(c.manzil)}`)
			+ `<div class="dbody cl2"><div>
				${UI.dl([['Mas’ul', UI.esc(c.kontakt)], ['Telefon', `${UI.esc(c.tel)} ${UI.call(c.tel)}`], ['Manzil', UI.esc(c.manzil)], ['Narx turi', NARX_TUR[c.narx]],
					['Chegara', F.som(c.limit)], ['To‘lov muddati', c.kun ? `${c.kun} kun` : 'yetkazganda, naqd'], ['Menejer', UI.esc(Data.userById(c.mid).ism)]])}
				<div class="dsec"><h3>Qarz</h3><div class="kv"><span>Jami</span><b class="${a.over ? 'red-t' : ''}">${F.som(debt)}</b></div>
					${debt ? `${UI.bar([['Kelmagan', a.kel, 'br3'], ['1–7', a.d7, 'amb'], ['8–30', a.d30, 'org'], ['30+', a.d90, 'red']])}
					<div class="legend"><span>kelmagan <b>${F.num(a.kel)}</b></span><span>1–7 <b>${F.num(a.d7)}</b></span><span>8–30 <b>${F.num(a.d30)}</b></span><span>30+ <b>${F.num(a.d90)}</b></span></div>` : ''}</div>
				<div class="dsec"><h3>Xarid, 6 oy (t)</h3><div class="mbars">${mo.map((v, i) => `<div><i style="height:${Math.max(2, v / Math.max(...mo, 1) * 48).toFixed(0)}px"></i><b>${F.t(v)}</b><span>${MON3[Time.date(Time.monthStart(i - 5)).getMonth()]}</span></div>`).join('')}</div></div>
				<div class="acts mt16">${btns}</div></div>
				<div><h3>Buyurtmalar</h3>${os.length ? `<div class="tw"><table class="tbl cards hist-t"><thead><tr><th>Sana</th><th class="num">Summa</th><th>Mahsulot</th><th>Holat</th></tr></thead><tbody>${os.slice(0, 12).map(histRow).join('')}</tbody></table></div>` : '<p class="muted sm">Buyurtma yo‘q</p>'}
				<h3 class="mt16">To‘lovlar</h3>${ps.length ? `<table class="calc">${ps.slice(0, 8).map(p => `<tr class="x"><td>${F.when(p.t)} · ${USUL[p.usul]}${p.uid ? ` <span class="muted">· kiritdi ${F.short(Data.userById(p.uid).ism)}</span>` : ''}${p.izoh ? `<span class="sub">${UI.esc(p.izoh)}</span>` : ''}</td><td>${F.num(p.sum)}</td></tr>`).join('')}</table>` : '<p class="muted sm">To‘lov yo‘q</p>'}</div>
			</div>`;
	},
	// Qarz akti (sverka): namuna davri boshidan
	actBody(c) {
		const rows = [...Calc.sales(c).map(o => ({ t: Time.day0(o.sana) + 12 * HOUR, d: `Yetkazildi ${F.oid(o)}, ${Data.prod(o.prod).qisqa} ${F.kg(Calc.oKg(o))}`, deb: Calc.oSum(o), kre: 0 })),
			...db.pays.filter(p => p.cid === c.id).map(p => ({ t: p.t, d: `To‘lov, ${USUL[p.usul].toLowerCase()}`, deb: 0, kre: p.sum }))].sort((a, b) => a.t - b.t);
		let bal = 0;
		return `<div class="akt"><p><b>ALFIRDAVS TM</b> va <b>${UI.esc(c.nom)}</b> o‘rtasidagi o‘zaro hisob-kitob dalolatnomasi, ${F.dateLong(Time.today)} holatiga.</p>
			<div class="tw"><table class="tbl akt-t"><thead><tr><th>Sana</th><th>Hujjat</th><th class="num">Debet</th><th class="num">Kredit</th><th class="num">Qoldiq</th></tr></thead><tbody>
			${rows.map(r => { bal += r.deb - r.kre; return `<tr><td class="nowrap">${F.date(r.t)}</td><td>${r.d}</td><td class="num">${r.deb ? F.num(r.deb) : ''}</td><td class="num">${r.kre ? F.num(r.kre) : ''}</td><td class="num">${F.num(bal)}</td></tr>`; }).join('')}
			</tbody><tfoot><tr><td></td><td>Jami</td><td class="num">${F.num(Calc.sum(rows, r => r.deb))}</td><td class="num">${F.num(Calc.sum(rows, r => r.kre))}</td><td class="num">${F.num(bal)}</td></tr></tfoot></table></div>
			<p class="mt8">Qarz: <b>${F.som(Math.max(0, bal))}</b>. Imzolar: ______________ (ALFIRDAVS TM) &nbsp; ______________ (${UI.esc(c.nom)})</p></div>`;
	},

	/* --- Qarzlar --- */
	debts() {
		const mid = session.role === 'savdo' ? session.user : ui.debtMgr, ag = Calc.agingAll(mid), list = Calc.debtors(mid);
		const mgrs = db.users.filter(u => u.rol === 'savdo');
		const top = `<section class="card pad mb16"><div class="sums plain"><div><span class="l">Jami qarz</span><b>${UI.u(F.num(ag.total), 'so‘m')}</b></div><div><span class="l">Muddati o‘tgan</span><b class="red-t">${UI.u(F.num(ag.over), 'so‘m')}</b><small>${ag.n} xaridor</small></div></div>
			${UI.bar([['Kelmagan', ag.kel, 'br3'], ['1–7 kun', ag.d7, 'amb'], ['8–30 kun', ag.d30, 'org'], ['30+ kun', ag.d90, 'red']])}
			<div class="aging4">${[['Muddati kelmagan', ag.kel, 'br3'], ['1–7 kun', ag.d7, 'amb'], ['8–30 kun', ag.d30, 'org'], ['30 kundan ko‘p', ag.d90, 'red']].map(([n, v, c]) => `<div><i style="--c:var(--${c})"></i>${n}<b class="${c === 'red' && v ? 'red-t' : ''}">${F.num(v)}</b></div>`).join('')}</div></section>`;
		const z = v => v ? F.num(v) : '<span class="muted">—</span>';
		const cols = [
			['Xaridor', 'c-main', x => `${UI.esc(x.c.nom)}<span class="sub">${F.short(Data.userById(x.c.mid).ism)} · ${x.c.kun ? x.c.kun + ' kun' : 'naqd'}</span>`],
			['Jami', 'c-aside num strong', x => F.num(x.debt)],
			['Kelmagan', 'num m-hide', x => z(x.a.kel)], ['1–7', 'num m-hide', x => z(x.a.d7)], ['8–30', 'num m-hide', x => z(x.a.d30)], ['30+', 'num m-hide', x => x.a.d90 ? `<span class="red-t">${F.num(x.a.d90)}</span>` : z(0)],
			['', 'c-sub d-hide', x => x.a.over ? `<span class="red-t">muddati o‘tgan ${F.num(x.a.over)} · ${x.a.max} kun</span>` : `muddati kelmagan`],
			['Oxirgi to‘lov', 'nowrap', x => { const p = Calc.lastPayRec(x.c); return p ? `${F.day(p.t)}<span class="sub">${p.uid ? F.short(Data.userById(p.uid).ism) : ''}</span>` : '—'; }],
			['', 'c-acts', x => `<span class="cell-acts">${can('openPayment') ? `<button class="btn s" data-act="openPayment" data-id="${x.c.id}">To‘lov</button>` : ''}${can('openRemind') ? `<button class="btn s ic" data-act="openRemind" data-id="${x.c.id}" aria-label="Eslatma yuborish" title="Eslatma yuborish">${UI.icon('send')}</button>` : ''}</span>`]
		];
		const sup = db.lots.filter(p => Calc.supDebt(p) > 0);
		const supB = session.role === 'direktor' && sup.length ? `<div class="mt16">${UI.card('Yetkazib beruvchilarga majburiyat', `<table class="calc pad">${sup.map(p => `<tr><td>${UI.esc(Data.sup(p.sup).nom)}<span class="sub">${p.id} · ${Calc.holat(p).toLowerCase()} · oldindan to‘langan ${F.val(Calc.sum(p.tolov, x => x.sum), p.val)}</span></td><td>${F.val(Calc.supDebt(p), p.val)}${p.qolganTolov ? `<span class="sub">${F.date(p.qolganTolov)} gacha</span>` : ''}</td></tr>`).join('')}</table>`)}</div>` : '';
		return `${top}<div class="toolbar">${session.role === 'direktor' ? (UI.mobile() ? `<select class="in" data-filter="setDebtMgr" aria-label="Menejer">${UI.options([['', 'Hamma menejerlar'], ...mgrs.map(u => [u.id, u.ism])], ui.debtMgr)}</select>` : UI.seg('setDebtMgr', ui.debtMgr, [['', 'Hammasi'], ...mgrs.map(u => [u.id, F.short(u.ism)])])) : '<span class="hint">Faqat sizning xaridorlaringiz</span>'}<span class="grow"></span><span class="hint m-hide">To‘lov eng eski qarzdan boshlab yopiladi</span></div>

});

/* ===== Views: Hisobot, Sozlamalar, Omborchi va Haydovchi ekranlari, oynalar (manba: c4.js) ===== */

Object.assign(Views, {
	/* --- Hisobot --- */
	report() {

	},
	reportBody() {
		const R = Calc.report(ui.report), max = Math.max(...R.byDay.map(d => d.sum), 1), n = R.byDay.length, W = UI.mobile() ? 340 : 640, X = 36, w = (W - X) / n;
		const bars = R.byDay.map((d, i) => { const h = d.sum / max * 120; return `<rect class="b${d.d === Time.today ? ' hi' : ''}" x="${(X + i * w + w * 0.15).toFixed(1)}" y="${(140 - h).toFixed(1)}" width="${(w * 0.7).toFixed(1)}" height="${h.toFixed(1)}"><title>${F.date(d.d)}: ${F.som(d.sum)}, ${F.kg(d.kg)}</title></rect>`; }).join('');
		const lab = [0, Math.floor(n / 2), n - 1].map(i => `<text x="${(X + i * w + w / 2).toFixed(1)}" y="156" text-anchor="${i ? i === n - 1 ? 'end' : 'middle' : 'start'}">${F.date(R.byDay[i].d)}</text>`).join('');
		const chart = `<svg class="chart" viewBox="0 0 ${W} 160" role="img" aria-label="Kunlar bo‘yicha savdo">

			${bars}<line x1="${X}" x2="${W}" y1="140" y2="140" stroke="var(--line)"/>${lab}</svg>`;
		const lots = db.lots.filter(p => Calc.lotOrders(p).some(o => SOLD_ST.includes(o.holat))).map(p => ({ p, pf: Calc.profit(p), c: Calc.cost(p) }));
		const cut = (title, list) => UI.card(title, UI.table([
			['', 'c-main', x => UI.esc(x.nom)], ['Savdo', 'c-aside num', x => `${F.mln(x.sum)}<span class="sub">${F.tn(x.kg)}</span>`], ['Foyda', 'num', x => `${F.mln(x.foyda)}<span class="sub">${F.pct(x.marja, 1)}</span>`]
		], list, { empty: 'Bu davrda savdo yo‘q', icon: 'chart' }));
		return `<section class="card pad mb16"><div class="sums plain"><div><span class="l">Savdo</span><b>${UI.u(F.t(R.kg), 't')}</b></div><div><span class="l">Savdo summasi</span><b>${UI.u(F.num(Math.round(R.sum / 1e6)), 'mln so‘m')}</b></div>
			<div><span class="l">Yalpi foyda</span><b>${UI.u(F.num(Math.round(R.foyda / 1e6)), 'mln so‘m')}</b></div><div><span class="l">Marja</span><b>${UI.u(F.num(R.marja * 100, 1), '%')}</b></div><div><span class="l">Buyurtmalar</span><b>${R.n}</b></div></div>
			<div class="mt16">${chart}</div><p class="rule">Savdo — topshirilgan buyurtmalar. Yalpi foyda = sotuv − sotuv paytidagi partiya tannarxi.</p></section>
			${UI.card('Partiya bo‘yicha foyda', UI.table([
				['Partiya', 'c-main', x => `${x.p.id}<span class="sub">${Data.prod(x.p.prod).qisqa} · ${Calc.holat(x.p).toLowerCase()}</span>`],
				['Foyda', 'c-aside num strong', x => `${F.mln(x.pf.now)}<span class="sub">${Calc.closed(x.p) ? 'yakuniy' : 'hozirgacha'}</span>`],
				['Kutilgan', 'num', x => Calc.closed(x.p) ? '<span class="muted">—</span>' : `${F.mln(x.pf.exp)}<span class="sub">${F.tn(x.pf.restKg)} × ${F.num(x.pf.avg)}</span>`],
				['1 kg tannarx', 'num', x => F.num(x.c.perKg)],
				['Sotilgan', 'num', x => F.kg(x.pf.sold)],
				['Tushum', 'num m-hide', x => F.mln(x.pf.rev)]
			], lots), { cls: 'mb16' })}
			<div class="cols3">${cut('Mahsulot kesimi', R.byProd)}${cut('Menejer kesimi', R.byMgr)}${cut('Eng yirik 5 xaridor', R.top)}</div>`;
	},

	/* --- Sozlamalar --- */
	settings() { return `<div id="set-body">${Views.settingsBody()}</div>`; },
	settingsBody() {
		const ed = SETTINGS_ROLES.includes(session.role), inp = (key, v, unit, w = '') => ed ? UI.unit(`<input class="in" data-set="${key}" value="${v}" inputmode="decimal" ${w}>`, unit) : `${F.num(v)} ${unit}`;
		const prods = `<div class="tw"><table class="tbl set-t"><thead><tr><th>Mahsulot</th>${Object.values(NARX_TUR).map(t => `<th class="num">${t}</th>`).join('')}<th class="num">Minimal</th><th class="num">Boj</th></tr></thead><tbody>
			${db.prods.map(p => `<tr><td class="nowrap">${p.nom}<span class="sub">20 kg quti</span></td>${Object.keys(NARX_TUR).map(k => `<td class="num">${inp(`prod.${p.k}.narx.${k}`, p.narx[k], 'so‘m')}</td>`).join('')}<td class="num">${inp(`prod.${p.k}.min`, p.min, 'so‘m')}</td><td class="num">${inp(`prod.${p.k}.boj`, p.boj, '%')}<span class="sub">Rossiya (ST-1) — 0 %</span></td></tr>`).join('')}</tbody></table></div>`;
		const prodsM = db.prods.map(p => `<div class="pset"><h3>${p.nom}</h3><div class="grid2 duo">${Object.entries(NARX_TUR).map(([k, t]) => UI.field(t, inp(`prod.${p.k}.narx.${k}`, p.narx[k], 'so‘m'))).join('')}${UI.field('Minimal', inp(`prod.${p.k}.min`, p.min, 'so‘m'))}${UI.field('Boj', inp(`prod.${p.k}.boj`, p.boj, '%'), { hint: 'Rossiyadan (ST-1) — 0 %' })}</div></div>`).join('');
		const kurs = `<div class="grid3">${Object.keys(VAL).map(v => UI.field(`1 ${VAL[v]} (${v})`, inp(`kurs.${v}`, db.set.kurs[v], 'so‘m'))).join('')}</div>`;
		const rules = `<div class="grid3">${UI.field('Standart qarz chegarasi', inp('set.limit', db.set.limit / 1e6, 'mln'))}${UI.field('Standart to‘lov muddati', inp('set.kun', db.set.kun, 'kun'))}${UI.field('Usushka me’yori', inp('set.usushka', db.set.usushka, '%'))}${UI.field('Import QQS stavkasi', inp('set.qqs', db.set.qqs, '%'), { hint: 'yangi partiyalarga' })}</div>
			<label class="radio mt16"><input type="checkbox" class="cbx" data-set="set.qqsHisob" ${db.set.qqsHisob ? 'checked' : ''} ${ed ? '' : 'disabled'}>Import QQS hisobga olinadi (QQS tannarxga kirmaydi)</label>`;
		// Xodimlar: direktor ism, telefon, PIN ni tahrirlaydi va faolsizlantiradi; rol namunada qotgan
		const txt = (u, k, w) => `<input class="in sm-in" data-set="user.${u.id}.${k}" value="${UI.esc(u[k])}" ${w}>`;
		const staff = ed ? `<div class="tw"><table class="tbl staff-t"><thead><tr><th>Xodim</th><th>Telefon</th><th>PIN</th><th>Faol</th></tr></thead><tbody>${db.users.map(u => `<tr class="${u.faol === false ? 'off' : ''}">
				<td>${txt(u, 'ism', 'aria-label="Ism"')}<span class="sub">${u.lav}</span></td><td>${txt(u, 'tel', 'aria-label="Telefon" style="width:136px"')}</td>
				<td>${u.pin || u.rol !== 'xodim' ? txt(u, 'pin', 'inputmode="numeric" maxlength="4" aria-label="PIN" style="width:72px"') : '<span class="muted">—</span>'}</td>
				<td><input type="checkbox" class="cbx" data-set="user.${u.id}.faol" ${u.faol === false ? '' : 'checked'} aria-label="Faol"></td></tr>`).join('')}</tbody></table></div>`
			: UI.table([['Xodim', 'c-main', u => UI.esc(u.ism)], ['Rol', 'c-aside', u => u.lav], ['Telefon', 'c-sub nowrap', u => u.tel]], db.users);
		const sups = UI.table([['Yetkazib beruvchi', 'c-main', s => UI.esc(s.nom)], ['Mamlakat', 'c-aside', s => s.mam], ['Valyuta', 'c-sub', s => `${s.val}${s.mdh ? ' · boj 0 % (ST-1)' : ''}`]], db.sups);
		if (UI.mobile()) {
			const staffM = ed ? db.users.map(u => `<div class="ucard${u.faol === false ? ' off' : ''}"><div class="kv"><span class="strong">${u.lav}</span><label class="radio"><input type="checkbox" class="cbx" data-set="user.${u.id}.faol" ${u.faol === false ? '' : 'checked'}>Faol</label></div>
					${UI.field('Ism', txt(u, 'ism', ''))}<div class="grid2 duo">${UI.field('Telefon', txt(u, 'tel', 'inputmode="tel"'))}${u.pin || u.rol !== 'xodim' ? UI.field('PIN', txt(u, 'pin', 'inputmode="numeric" maxlength="4"')) : '<span></span>'}</div></div>`).join('') : staff;
			const sec = (t, sum, body) => `<details class="card acc"><summary><span><span class="t">${t}</span><span class="m">${sum}</span></span>${UI.icon('down')}</summary><div class="cb">${body}</div></details>`;
			const pr = db.prods.flatMap(p => [...Object.values(p.narx), p.min]), act = db.users.filter(u => u.faol !== false).length;
			return `${ed ? '' : `<p class="mb16">${UI.chip('Faqat ko‘rish')} <span class="hint">Sozlamani direktor o‘zgartiradi</span></p>`}
				${sec('Mahsulotlar va narxlar', `${db.prods.length} mahsulot · narxlar ${F.num(Math.min(...pr))}–${F.num(Math.max(...pr))}`, prodsM)}
				${sec('Valyuta kursi', Object.keys(VAL).map(v => `${VAL[v]} ${F.num(db.set.kurs[v])}`).join(' · '), kurs + '<p class="rule">Yangi partiyalarga ta’sir qiladi, ochilganlar kursi qotgan.</p>')}
				${sec('Qarz va soliq qoidalari', `chegara ${F.num(db.set.limit / 1e6)} mln · ${db.set.kun} kun · QQS ${F.num(db.set.qqs)} %`, rules)}${sec('Xodimlar', `${db.users.length} xodim · ${act} faol`, staffM + (ed ? '<p class="rule">Rol o‘zgarmaydi.</p>' : ''))}
				${sec('Boshqa', `${db.sups.length} yetkazib beruvchi · namuna`, sups + (can('resetData') ? `<button class="btn mt16" data-act="resetData">${UI.icon('refresh')}Namunani boshidan boshlash</button>` : ''))}`;
		}
		return `${ed ? '' : `<p class="mb16">${UI.chip('Faqat ko‘rish')} <span class="hint">Sozlamani direktor o‘zgartiradi</span></p>`}${UI.card('Mahsulotlar va narxlar (so‘m/kg)', UI.mobile() ? `<div class="cb">${prodsM}</div>` : prods, { right: '<span class="hint m-hide">Boj — Polshadan; Rossiyadan ST-1 bilan 0 %</span>', cls: 'mb16' })}
			<div class="cols"><div class="stack">${UI.card('Valyuta kursi', `<div class="cb">${kurs}<p class="rule mt8">Qo‘lda kiritiladi. Yangi partiyalarga ta’sir qiladi, ochilgan partiyalar kursi qotgan.</p></div>`)}
				${UI.card('Qarz, qabul va soliq qoidalari', `<div class="cb">${rules}</div>`)}</div>
			<div class="stack">${UI.card('Yetkazib beruvchilar', sups)}
				${can('resetData') ? `<section class="card pad"><h2>Namuna</h2><p class="note mt8">Barcha o‘zgarishlar o‘chadi, namuna bugungi 11:42 holatiga qaytadi.</p><button class="btn mt8" data-act="resetData">${UI.icon('refresh')}Namunani boshidan boshlash</button></section>` : ''}</div></div>
			<div class="mt16">${UI.card('Xodimlar va rollar', staff, { right: ed ? '<span class="hint">Rol o‘zgarmaydi</span>' : UI.chip('Faqat ko‘rish') })}</div>`;
	},

	/* --- Omborchi: Qabul --- */
	toReceive: () => db.lots.filter(p => !p.qabul && Calc.stage(p) === 3 && p.chiqdi),
	recPct: f => { const p = Data.lot(f.lot); return +f.kg > 0 ? (+f.kg - p.kgInv) / p.kgInv : 0; },
	// Sabab so‘raladi: quti invoysdan ko‘p; kg invoysdan +2 % dan ko‘p; quti mos, lekin kg kamligi usushka me’yoridan katta
	recOver: f => { const p = Data.lot(f.lot); return !!p && (+f.quti > p.quti || +f.kg > p.kgInv * 1.02); },
	recNeedReason(f) { const p = Data.lot(f.lot); return !!p && +f.kg > 0 && +f.quti > 0 && (Views.recOver(f) || (+f.quti >= p.quti && Views.recPct(f) < 0 && -Views.recPct(f) * 100 > db.set.usushka)); },
	receive() {
		const list = Views.toReceive(), f = ui.f.rec;
		if (!list.length || !f) return `<div class="bw">${UI.empty('Bugun qabul qilinadigan partiya yo‘q. Partiya bojxonadan chiqqanda shu yerda paydo bo‘ladi.', 'scale')}</div>`;
		const p = Data.lot(f.lot), s = Calc.stock(p);
		return `<div class="bw"><div class="bw-h"><h2>Kelgan partiya</h2><span class="sub">${list.length} ta</span></div>
			<section class="card job"><div class="jt"><span>${p.id}</span><span>${UI.esc(Data.sup(p.sup).nom)}</span></div><div class="jn">${Data.prod(p.prod).nom}</div>
			<ul class="jlist"><li><span>Invoys bo‘yicha</span><span>${F.num(p.quti)} quti · ${F.kg(p.kgInv)}</span></li>${s.pre ? `<li><span>Dastlabki bron</span><span>${F.kg(s.pre)}</span></li>` : ''}<li><span>Ishlab chiqarilgan</span><span>${F.date(p.ishlab)} · yaroqli ${F.date(p.yaroq)} gacha</span></li></ul>
			<form data-form="receive" autocomplete="off">
				<div class="grid2 duo mt16">${UI.field('Quti soni', UI.num('rec.quti', 'class="in big" placeholder="0"'), { key: 'rec.quti' })}${UI.field('Tarozi, kg', UI.num('rec.kg', 'class="in big" placeholder="0"'), { key: 'rec.kg' })}</div>
				<div class="fld mt16"><span>Kamera</span>${UI.seg('setCam', f.kamera, KAMERA.map(k => [k, k]), 'full4')}</div>
				<div id="rec-res">${Views.recResult()}</div>
			</form>
			<div class="jact"><button class="btn pri cta" data-act="saveReceive">${UI.icon('check')}Qabul qildim</button></div></section></div>`;
	},
	recResult() {
		const f = ui.f.rec, p = Data.lot(f.lot);
		if (!(+f.kg > 0) || !(+f.quti > 0)) return '<p class="hint mt16">Quti sonini sanab, fura tarozidan o‘tgan kg ni kiriting.</p>';
		const dk = +f.kg - p.kgInv, dq = +f.quti - p.quti, pc = Views.recPct(f), val = Calc.r1000(Math.max(0, -dk) * Calc.cost(p).perKg);
		const verdict = dq < 0 ? `<div class="vrd red">${UI.icon('alert')}<span><b>Kamomad: ${F.num(-dq)} quti kam.</b> Direktorga darhol xabar boradi, yetkazib beruvchiga da’vo ochiladi.</span></div>`
			: Views.recNeedReason(f) ? `<div class="vrd amb">${UI.icon('alert')}<span><b>${Views.recOver(f) ? `Invoysdan ortiq: ${F.diff(dq, dk)}.` : `Farq me’yordan katta (${F.num(db.set.usushka, 1)} %).`}</b> Sababini tanlang — direktorga ko‘rinadi.</span></div>${UI.field('Sabab', UI.select('rec.sabab', [['', 'Tanlang'], ...Object.entries(QABUL_SABAB)]), { key: 'rec.sabab', cls: 'mt8' })}`
				: `<div class="vrd grn">${UI.icon('check')}<span>${dk > 0 ? 'Ortiq, lekin +2 % ichida (quti og‘irligi farqi).' : `Usushka me’yorida (≤ ${F.num(db.set.usushka, 1)} %).`}</span></div>`;
		return `<div class="rres mt16"><div><span>Farq</span><b class="${dk < 0 ? 'red-t' : ''}">${F.diff(dq, dk)}</b></div><div><span>Foiz</span><b>${pc ? `${F.pct(Math.abs(pc), 2)} ${pc < 0 ? 'kam' : 'ortiq'}` : '0 %'}</b></div><div><span>Summa</span><b>${dk < 0 ? F.mln(val) : '—'}</b></div></div>${verdict}`;
	},

	/* --- Omborchi: Yig‘ish --- */
	toPick: () => db.orders.filter(o => o.sana <= Time.today && (o.holat === 'tasdiq' || (o.holat === 'yigildi' && o.sana === Time.today))).sort((a, b) => (a.holat === 'yigildi') - (b.holat === 'yigildi') || a.id - b.id),
	// Yig‘ishda buyurtmadan ko‘pi bilan +2 % (quti og‘irligi farqi) va partiyaning bo‘sh qoldig‘idan oshmaydi
	pickCap: f => { const o = Data.order(f.id), p = Data.lot(o.lot); return Math.min(Math.floor(o.kg * 1.02), o.kg + Math.max(0, Calc.stock(p).bosh)); },
	pick() {
		const list = Views.toPick(), f = ui.f.pick, o = ui.task && Data.order(ui.task);
		if (o && f && f.id === o.id && o.holat === 'tasdiq') {
			const p = Data.lot(o.lot), c = Data.client(o);
			return `<div class="bw"><button class="btn ghost back" data-act="closeTask">${UI.icon('back')}Ro‘yxat</button>
				<section class="card job"><div class="jt"><span>${F.oid(o)}</span><span>${F.day(o.sana)} · ${F.short(Data.userById(o.drv).ism)}</span></div><div class="jn">${UI.esc(c.nom)}</div>
				<div class="jbig"><div><span>Mahsulot</span><b>${Data.prod(o.prod).qisqa}</b></div><div><span>Partiya</span><b>${p.id}</b></div><div><span>Kamera</span><b>${p.kamera}</b></div></div>
				${o.fefo ? `<div class="vrd amb mt8">${UI.icon('alert')}<span><b>FEFO emas:</b> ${UI.esc(o.fefo)}</span></div>` : ''}
				<ul class="jlist"><li><span>Buyurtma</span><span>${F.kg(o.kg)} · ${F.quti(o.kg)}</span></li><li><span>Yaroqli</span><span>${F.date(p.yaroq)} gacha</span></li></ul>
				<form data-form="pick" autocomplete="off">${UI.field('Haqiqiy kg (tarozi)', UI.num('pick.kg', 'class="in big"'), { key: 'pick.kg', cls: 'mt16' })}<div id="pick-res">${Views.pickResult()}</div></form>
				<div class="jact"><button class="btn pri cta" data-act="savePick" data-id="${o.id}">${UI.icon('check')}Yig‘ildi</button></div></section></div>`;
		}
		const row = o => {
			const p = Data.lot(o.lot), ok = Calc.stage(p) === 5, done = o.holat === 'yigildi';
			return `<button class="card job mini${done ? ' done' : ''}" data-act="openTask" data-id="${o.id}"${done || !ok ? ' disabled' : ''}><span class="x"><span class="t">${UI.esc(Data.client(o).nom)}</span>
				<span class="m">${Data.prod(o.prod).qisqa} · ${p.id}${p.kamera ? ', ' + p.kamera : ''}</span>${!ok ? `<span class="m amb-t">Karantinda — laboratoriya xulosasi ${F.day(p.st[5].plan)}</span>` : ''}</span>
				<span class="tm">${F.num(o.kgFakt || o.kg)}<small>kg</small></span>${done ? UI.icon('check') : ok ? UI.icon('chev') : ''}</button>`;
		};
		return `<div class="bw"><div class="bw-h"><h2>Bugun yig‘ish</h2><span class="sub">${list.filter(o => o.holat === 'yigildi').length} / ${list.length} tayyor</span></div>
			${list.length ? list.map(row).join('') : UI.empty('Bugun yig‘iladigan buyurtma yo‘q', 'package')}<p class="last">Partiya FEFO bo‘yicha savdo menejeri tomonidan tanlangan</p></div>`;
	},
	pickResult() {
		const f = ui.f.pick, o = Data.order(f.id), d = (+f.kg || 0) - o.kg;
		return +f.kg > 0 && d ? `<p class="hint mt8">${d > 0 ? '+' : ''}${F.kg(d)} buyurtmadan farq — summa haqiqiy kg bo‘yicha hisoblanadi: ${F.som(Calc.r1000(+f.kg * o.narx))}</p>` : '';
	},

	/* --- Omborchi: Qoldiq --- */
	remain() {
		const rows = Calc.byProd(), canOff = can('openWriteOff');
		return `<div class="bw">${rows.map(r => `<section class="card pad mb16"><div class="kv"><h2>${r.pr.nom}</h2><b>${F.kg(r.jami)}</b></div>
			<p class="rline">sotish mumkin <b>${F.num(r.bosh)}</b> · bron ${F.num(r.bron)}${r.karantin ? ` · karantin ${F.num(r.karantin)}` : ''}</p>
			${r.lots.length ? `<ul class="jlist">${r.lots.map(p => { const s = Calc.stock(p), d = Calc.daysLeft(p); return `<li><span>${p.id} · ${p.kamera}<small class="sub">${Calc.stage(p) < 5 ? 'karantin' : `bron ${F.num(s.bron)} · ${d} kun qoldi`}</small>${(q => q ? `<small class="sub amb-t">qaytgan ${F.kg(q)} · bugun — tekshiring</small>` : '')(Calc.sum(db.moves.filter(m => m.lot === p.id && m.tur === 'qaytish' && Time.dayOf(m.t) === Time.today), m => m.kg))}${canOff && s.qoldiq - s.bron > 0 ? `<button class="link sm" data-act="openWriteOff" data-id="${p.id}">Hisobdan chiqarish</button>` : ''}</span><span class="${d <= 14 ? 'red-t' : ''}">${F.kg(s.qoldiq)}</span></li>`; }).join('')}</ul>` : '<p class="muted sm mt8">Qoldiq yo‘q</p>'}</section>`).join('')}</div>`;

	/* --- Haydovchi --- */
	myDeliv: () => db.orders.filter(o => o.drv === session.user && o.sana === Time.today && o.holat !== 'bekor').sort((a, b) => ['yolda', 'yigildi', 'tasdiq', 'yangi', 'topshirildi', 'muammo'].indexOf(a.holat) - ['yolda', 'yigildi', 'tasdiq', 'yangi', 'topshirildi', 'muammo'].indexOf(b.holat)),
	drvMax: f => { const o = Data.order(f.id); return Calc.debt(Data.client(o)) + Calc.r1000((+f.kg || 0) * o.narx); },
	driver() {
		const list = Views.myDeliv(), o = ui.task && Data.order(ui.task);

			else if (o.holat === 'yolda' && f) act = `<form data-form="drv" autocomplete="off">

			else if (OPEN_ST.includes(o.holat)) act = `<p class="done-l amb-t">${UI.icon('clock')}Omborda hali yig‘ilmagan</p>`;
			else act = `<p class="done-l">${UI.icon('check')}Topshirildi ${o.ts.topshirildi ? Time.hm(o.ts.topshirildi) : ''}${o.qaytdi ? ` · qaytdi ${F.kg(o.qaytdi)}` : ''}</p>`;
			return `<div class="bw"><button class="btn ghost back" data-act="closeTask">${UI.icon('back')}Ro‘yxat</button><section class="card job">${head}${act}</section></div>`;
		}
		const row = o => `<button class="card job mini${DONE_ST.includes(o.holat) ? ' done' : ''}" data-act="openTask" data-id="${o.id}"><span class="x"><span class="t">${UI.esc(Data.client(o).nom)}</span>
			<span class="m">${UI.esc(Data.client(o).manzil)}</span><span class="m">${Data.prod(o.prod).qisqa} · ${STATUS[o.holat].t}</span></span><span class="tm">${F.num(o.kgFakt || o.kg)}<small>kg</small></span>${UI.icon(DONE_ST.includes(o.holat) ? 'check' : 'chev')}</button>`;
		const cash = Calc.sum(db.pays.filter(p => p.uid === session.user && Time.dayOf(p.t) === Time.today), p => p.sum);
		return `<div class="bw"><div class="bw-h"><h2>${F.dateLong(Time.today)}</h2><span class="sub">${list.filter(o => DONE_ST.includes(o.holat)).length} / ${list.length} topshirildi</span></div>
			${list.length ? list.map(row).join('') : UI.empty('Bugun yetkazish yo‘q', 'truck')}
			<div class="cash"><span>Qo‘limdagi naqd (bugun)</span><b>${F.som(cash)}</b></div></div>`;
	},
	drvResult() {
		const f = ui.f.drv, o = Data.order(f.id), less = +f.kg < o.kgFakt && f.kg !== '';
		const sum = Calc.r1000((+f.kg || 0) * o.narx);

			<div class="pay-q"><span class="l">Topshirilgan tovar summasi</span><div class="v">${F.som(sum)}</div></div>
			<div class="fld mt16"><span>Naqd pul oldingizmi?</span>${UI.seg('setCash', f.cash, [['ha', 'Ha, oldim'], ['yoq', 'Yo‘q']], 'full2')}</div>
			${f.cash === 'ha' ? `${UI.field('Olingan naqd', UI.unit(`<input class="in big" data-f="drv.naqd" data-num data-fmt inputmode="numeric" autocomplete="off" value="${+f.naqd ? F.num(+f.naqd) : ''}">`, 'so‘m'), { key: 'drv.naqd', cls: 'mt8' })}<p class="naqd-t" id="drv-naqd-t">${Views.naqdText(f)}</p><p class="hint center" id="drv-split">${Views.naqdSplit(f)}</p>` : ''}`;
	},
	naqdText: f => +f.naqd > 0 ? `${F.num(+f.naqd / 1e6, 1)} mln so‘m` : '',
	// Naqd joriy yetkazishdan ko‘p bo‘lsa — ortig‘i eski qarzga
	naqdParts(f) { const o = Data.order(f.id), cur = Calc.r1000((+f.kg || 0) * o.narx), n = +f.naqd || 0; return { cur: Math.min(n, cur), old: Math.max(0, n - cur) }; },
	naqdSplit(f) { const x = Views.naqdParts(f); return x.old ? `Joriy yetkazish: ${F.mln(x.cur)} · eski qarzdan: ${F.mln(x.old)}` : ''; },

	/* --- Oynalar (forma ichi) --- */
	kpiForm: () => { const [t, body] = Views.kpiBody(ui.f.kpi); return `<p class="note">${t}</p>${body}`; },
	payForm() {
		const f = ui.f.pay, c = Data.client(f.cid), a = Calc.aging(c);
		return `<p class="note"><b>${UI.esc(c.nom)}</b> · qarz ${F.som(Calc.debt(c))}${a.over ? `, shundan muddati o‘tgan <span class="red-t">${F.som(a.over)}</span>` : ''}</p>
			${UI.field('Summa', UI.unit(UI.num('pay.sum', 'autofocus'), 'so‘m'), { key: 'pay.sum' })}
			${UI.field('Usul', UI.select('pay.usul', Object.entries(USUL)))}${UI.rule('To‘lov eng eski qarzdan boshlab yopiladi. Qarzdan ortiq summa qabul qilinmaydi.')}`;

	remindText(c) {
		const a = Calc.aging(c), u = Data.userById(c.mid);
		return `Assalomu alaykum, ${c.kontakt.split(' ')[0]} aka! ALFIRDAVS TM dan yozyapmiz. ${F.dateLong(Time.today)} holatiga jami qarzingiz ${F.som(Calc.debt(c))}${a.over ? `, shundan ${F.som(a.over)} muddati o‘tgan (${a.max} kun)` : ''}. To‘lov sanasini aytib yuborsangiz. Hurmat bilan, ${u.ism}, ${u.tel}.`;
	},
	remindForm() {
		const c = Data.client(ui.f.rem.cid), text = Views.remindText(c);
		return `<textarea class="in" rows="6" readonly id="remtext">${UI.esc(text)}</textarea>
			<div class="acts"><a class="btn pri" data-act="shareTg" href="https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${UI.icon('send')}Telegram orqali</a><button class="btn" data-act="copyText">${UI.icon('copy')}Nusxa olish</button></div>`;
	},
	stageForm() {
		const f = ui.f.stage, p = Data.lot(f.id), k = Calc.stage(p) + 1;
		return `<p class="note"><b>${p.id}</b>: ${STAGES[k - 1].toLowerCase()} → <b>${STAGES[k].toLowerCase()}</b> · reja ${F.date(p.st[k].plan)}</p>
			${f.force ? `<div class="note warn">Hujjatsiz o‘tkazilmoqda: ${f.force.map(d => DOCS.find(x => x[0] === d)[1]).join(', ')}. Jurnalga yoziladi.</div>` : ''}
			${UI.field('Amalda sana', UI.input('stage.sana', `type="date" max="${Time.today}"`), { key: 'stage.sana' })}
			${UI.field('Izoh', UI.input('stage.izoh', 'placeholder="Ixtiyoriy"'))}
			${k === 5 ? UI.rule('Laboratoriya xulosasi «bor» deb belgilanadi, tovar sotuvga ochiladi.') : ''}`;
	},
	costForm() {
		const f = ui.f.cost, p = Data.lot(f.id);
		return `${p.qot ? '<div class="note warn">Tannarx qotirilgan — bu «qo‘shimcha xarajat» bo‘lib qo‘shiladi va tannarxni qayta hisoblaydi. Oldingi sotuvlar marjasi o‘zgarmaydi.</div>' : ''}
			${UI.field('Xarajat turi', UI.select('cost.k', Object.entries(XARAJAT).filter(([k]) => k !== 'yol' || !p.qot)))}
			${UI.field('Summa', UI.unit(UI.num('cost.sum', 'autofocus'), 'so‘m'), { key: 'cost.sum', hint: `$ bo‘lsa: summa × ${F.num(db.set.kurs.USD)}` })}${UI.field('Izoh', UI.input('cost.izoh'))}`;
	},
	lotForm() {
		const f = ui.f.lot, s = Data.sup(f.sup);
		return `${UI.field('Yetkazib beruvchi', UI.select('lot.sup', db.sups.map(x => [x.id, `${x.nom} · ${x.mam}`])))}
			${UI.field('Mahsulot', UI.select('lot.prod', db.prods.map(x => [x.k, x.nom])))}
			<div class="grid2 duo">${UI.field('Quti (20 kg)', UI.num('lot.quti'), { key: 'lot.quti', hint: `= ${F.kg((+f.quti || 0) * 20)}` })}${UI.field(`Narx, ${VAL[s.val]}/kg`, UI.num('lot.narx'), { key: 'lot.narx' })}</div>
			<div class="grid2 duo">${UI.field('Oldindan to‘lov sanasi', UI.input('lot.tsana', `type="date" max="${Time.today}"`), { key: 'lot.tsana' })}${UI.field(`Kurs (shu kun), 1 ${VAL[s.val]}`, UI.unit(UI.num('lot.kurs'), 'so‘m'), { key: 'lot.kurs', hint: `Sozlamada: ${F.num(db.set.kurs[s.val])}` })}</div>
			${UI.rule(`Partiya kursi oldindan 30 % to‘lov kunida qotadi. Boj: ${Calc.bojOf(f.sup, f.prod)} %, QQS: ${F.num(db.set.qqs)} %. Bosqichlar rejasi: yuklash +7, chegara +13, bojxona +16, ombor +21 kun.`)}`;
	},
	offForm() {
		const f = ui.f.off, p = Data.lot(f.lot), s = Calc.stock(p);
		return `<p class="note"><b>${p.id}</b> · ${Data.prod(p.prod).nom} · bo‘sh qoldiq ${F.kg(s.qoldiq - s.bron)}</p>
			${UI.field('Kg', UI.unit(UI.num('off.kg', 'autofocus'), 'kg'), { key: 'off.kg' })}${UI.field('Sabab', UI.input('off.sabab', 'placeholder="Masalan: qadoq shikastlangan"'), { key: 'off.sabab' })}`;
	},
	claimForm() {
		const f = ui.f.claim, p = Data.lot(f.id), cl = Calc.claim(p);
		return `<p class="note"><b>${p.id}</b> · ${UI.esc(Data.sup(p.sup).nom)} · ${F.kg(cl.kg)} = ${F.num(cl.val, 2)} ${VAL[p.val]} (${F.som(cl.som)})</p>
			<p class="note">Holat: <b>${DAVO[f.v]}</b> · ${F.dateLong(Time.today)}</p>${UI.field('Izoh', UI.input('claim.izoh', 'placeholder="Masalan: keyingi partiyada qoplanadi" autofocus'))}`;
	},
	actForm: () => Views.actBody(Data.client(ui.f.act.cid))
});

/* ===== Steps — amallar ichida qayta ishlatiladigan qadamlar (manba: d.js) ===== */
const Steps = {
	closePops() {
		const open = ui.bell || ui.gs.q || ui.gs.open;
		Object.assign(ui, { bell: false, gs: { q: '', open: false } });
		return !!open;
	},
	drawer(type, id) {
		if (Steps.closePops()) Views.render();
		ui.drawer = { type, id, enter: true };
		UI.refresh('layer');
		ui.drawer.enter = false;
		Router.sync();
	},
	redraw() { Views.render(); },
	// Omborchi «Qabul» formasi: kelgan birinchi partiya
	prep() {
		if (session.role !== 'omborchi') return;
		const l = Views.toReceive();
		if (l.length && (!ui.f.rec || !l.some(p => p.id === ui.f.rec.lot))) ui.f.rec = { lot: l[0].id, quti: '', kg: '', kamera: 'K-1', sabab: '' };
		if (!l.length) ui.f.rec = null;
	},
	newOrder(cid) {
		ui.f.no = { cid: '', q: '', prod: 'mmo_pl', kg: '', lot: '', fefo: '', narx: '', kun: String(db.set.kun), day: 1, drv: 'u6', izoh: '' };
		if (cid) Steps.setClient(cid);
		Steps.defaultLot();
		return ui.f.no;
	},
	setClient(cid) {
		const f = ui.f.no, c = Data.client(cid);
		Object.assign(f, { cid, q: '', kun: String(c.kun) });
		if (f.prod) f.narx = Data.prod(f.prod).narx[c.narx];
	},
	defaultLot() { const f = ui.f.no, { sell, wait } = Calc.fefo(f.prod); f.lot = (sell[0] || wait[0] || {}).id || ''; f.fefo = ''; },
	// Ikki marta bosishdan himoya
	guard() { const now = Date.now(); if (now - (Steps.last || 0) < 700) return false; Steps.last = now; return true; },
	stageModal(p, force) {
		ui.f.stage = { id: p.id, sana: Time.today, izoh: '', force: force || null };
		ui.modalForm = 'stageForm';
		UI.modal('Keyingi bosqich', null, UI.buttons(force ? 'Baribir o‘tkazish' : 'Saqlash', 'saveStage'));
	},
	receive(p, f) {
		const quti = +f.quti, kg = +f.kg, pc = (kg - p.kgInv) / p.kgInv;
		const sabab = quti < p.quti ? 'kamomad' : Views.recOver(f) ? 'ortiq' : Views.recNeedReason(f) ? f.sabab : '';
		p.qabul = { quti, kg, kamera: f.kamera, t: Time.now(), uid: session.user, sabab, dava: ['kamomad', 'qadoq'].includes(sabab) ? 'yuborilmagan' : '' };
		p.kamera = f.kamera;
		p.st[4].fact = Time.today; p.st[4].izoh = 'Tarozidan o‘tdi, namuna olindi — laboratoriya xulosasi kutilmoqda'; p.st[4].uid = session.user;
		Data.move(p.id, 'kirim', kg, `${F.num(quti)} quti, ${f.kamera}`);
		Data.log(`${p.id} qabul qilindi: ${F.num(quti)} quti, ${F.num(p.kgInv)} kg → ${F.num(kg)} kg (${F.pct(pc, 1)})`, 'qabul', { lot: p.id });
		if (quti < p.quti) Data.log(`${p.id}: invoysdan ${F.num(p.quti - quti)} quti kam — yetkazib beruvchi kamomadi`, 'kamomad', { lot: p.id });
		else if (sabab) Data.log(`${p.id}: tarozi farqi ${F.pct(pc, 1)} — ${QABUL_SABAB[sabab].toLowerCase()}`, 'kamomad', { lot: p.id });
		const s = Calc.stock(p);
		if (s.short) Data.log(`${p.id}: dastlabki bron qabul qilingan kg dan ${F.kg(s.short)} ko‘p — savdo menejeri bronni kamaytirsin`, 'kamomad', { lot: p.id });
	}
};

/* ===== Actions — foydalanuvchi amallari (manba: d.js) =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */
const Actions = {
	/* navigatsiya */
	go(d) {
		Steps.closePops(); UI.closeModal();
		Object.assign(ui, { page: d.p, menu: false, drawer: null, task: null });
		Steps.prep();
		Views.render(); window.scrollTo(0, 0);
	},
	toggleMenu() { ui.menu = !ui.menu; ui.bell = false; Views.render(); },
	toggleBell() {
		ui.bell = !ui.bell; ui.menu = false;
		Views.render();
		if (ui.bell) Data.markSeen(Views.notices().map(n => n.key));
	},
	toggleSearch() { ui.gs.open = !ui.gs.open; ui.gs.q = ''; Views.render(); if (ui.gs.open) $('[data-gsearch]').focus(); },
	closePops() { if (Steps.closePops()) Views.render(); },
	openNotice(d) { Steps.closePops(); Views.render(); if (Actions[d.go] && d.go !== 'go') Actions[d.go]({ id: d.id }); },
	pickRole(d) { session = { pick: d.r }; Views.render(); },
	login() {
		const input = $('#pin'), user = db.users.find(u => u.rol === session.pick && u.pin && u.faol !== false && u.pin === input.value);
		if (user) {
			session = { role: user.rol, user: user.id };
			Data.saveSession();
			Object.assign(ui, { page: null, task: null, drawer: null, f: {} });
			Steps.prep();
			Views.render();
		} else {
			$('#pinerr').textContent = 'PIN noto‘g‘ri';
			input.value = '';
			input.focus();
		}
	},
	logout() { $('#toasts').innerHTML = ''; UI.closeModal(); session = {}; Data.saveSession(); Steps.closePops(); Object.assign(ui, { menu: false, drawer: null, page: null, task: null, f: {} }); Views.render(); Router.sync(); window.scrollTo(0, 0); },
	install() {
		ui.menu = false;
		Views.render();
		const steps = (title, a, b) => `<h3>${title}</h3><ol class="hint"><li>${a}</li><li>${b}</li></ol>`;
		const manual = () => UI.modal('Telefonga o‘rnatish', steps('iPhone, Safari', '«Ulashish» tugmasi', '«Ekranga qo‘shish»') + steps('Android, Chrome', 'Brauzer menyusi', '«Ilovani o‘rnatish»'), '<button class="btn" data-act="closeModal">Yopish</button>');
		if (!ui.install) return manual();
		ui.install.prompt().catch(manual);
		ui.install = null;
	},
	reloadApp() { location.reload(); },
	closeModal() { UI.closeModal(); },
	confirmOk() { const fn = UI.onConfirm; UI.onConfirm = null; UI.closeModal(); if (fn) fn(); },
	resetDemo() {
		UI.confirm('Namuna boshlang‘ich holatga qaytadi (bugun 11:42), barcha o‘zgarishlar o‘chadi.', 'Boshidan boshlash', () => { Data.seed(); session = {}; Data.saveSession(); Object.assign(ui, { f: {}, drawer: null, page: null, task: null }); Views.render(); UI.toast('Namuna boshidan boshlandi'); });
	},
	resetData() { Actions.resetDemo(); },

	/* ro‘yxat va kartalar */
	openLot(d) { Steps.drawer('lot', d.id); },
	openOrder(d) { Steps.drawer('order', +d.id); },
	openClient(d) { Steps.drawer('client', d.id); },
	closeDrawer() { ui.drawer = null; UI.refresh('layer'); Router.sync(); },
	setLotFilter(d) { ui.lotFilter = d.v; Data.savePrefs(); Views.render(); },
	setOrderFilter(d) { ui.orderFilter = { st: d.v, q: ui.orderFilter.q }; ui.orderLimit = 40; Data.savePrefs(); Views.render(); },
	moreOrders() { ui.orderLimit += 40; UI.refresh('list'); },
	toggleProd(d) {
		if (ui.page !== 'ombor') { ui.openProd = d.id; return Actions.go({ p: 'ombor' }); }
		ui.openProd = ui.openProd === d.id ? null : d.id; Views.render();
	},
	showFeed() { ui.feedAll = !ui.feedAll; Views.render(); },
	showAtt() { ui.attAll = !ui.attAll; Views.render(); },
	setDebtMgr(d) { ui.debtMgr = d.v; Data.savePrefs(); Views.render(); },
	showToday() { ui.orderFilter = { st: 'bugun', q: '' }; Actions.go({ p: 'buyurtmalar' }); },
	showApprovals() { ui.orderFilter = { st: 'tasdiq', q: '' }; Actions.go({ p: 'buyurtmalar' }); },
	kpi(d) {
		const t = { bosh: 'Sotish mumkin', yol: 'Yo‘lda va bojxonada', savdo: 'Bugungi savdo', qarz: 'Muddati o‘tgan qarz' }[d.v], go = Views.kpiBody(d.v);
		ui.f.kpi = d.v; ui.modalForm = 'kpiForm';
		UI.modal(t, null, `<button class="btn" data-act="closeModal">Yopish</button><button class="btn pri" data-act="go" data-p="${go[2]}">${go[3]}</button>`);
	},
	openAct(d) {
		ui.f.act = { cid: d.id }; ui.modalForm = 'actForm';

	saveNewLot() {

		const plan = [0, 7, 13, 16, 19, 21];
		const p = { id: 'P-' + n, sup: s.id, prod: f.prod, quti: +f.quti, kgInv: +f.quti * 20, narx: +f.narx, val: s.val, kurs, boj: Calc.bojOf(s.id, f.prod), qqs: db.set.qqs,
			st: plan.map((d, i) => ({ plan: Time.add(d + d0), fact: i ? null : f.tsana, izoh: '', uid: session.user })), kursSana: f.tsana,
			docs: Object.fromEntries(DOCS.map(([k]) => [k, k === 'shartnoma' ? 'bor' : k === 'ruxsat' && s.mdh ? 'yoq' : 'kut'])),
			xar: [['yol', (s.mam === 'Polsha' ? 5000 : 3200) * USD, `${s.mam === 'Polsha' ? '5 000' : '3 200'} $ × ${F.num(USD)}`], ['broker', 250 * USD, '250 $'], ['lab', 1500000, 'Veterinariya laboratoriyasi'], ['saqlash', 1800000, 'Bojxona terminali, 3 kun']]
				.map(([k, sum, izoh]) => ({ k, sum: Calc.r1000(sum), izoh, qosh: false, t: Time.now() })),
			qabul: null, qot: null, chiq: [], chiqdi: false, tolov: [], qolganTolov: Time.add(6), ishlab: null, yaroq: null, kamera: null };
		p.tolov.push({ t: Time.day0(f.tsana) + 11 * HOUR, sum: Math.round(Calc.buy(p) * 0.3 * 100) / 100 });
		db.lots.push(p);

	exportCsv() {

		const rows = [['Sana', 'Buyurtma', 'Xaridor', 'Mahsulot', 'Partiya', 'Kg', 'Narx', 'Summa', 'Tannarx', 'Foyda', 'Menejer'],
			...R.os.map(o => [o.sana, F.oid(o), Data.client(o).nom, Data.prod(o.prod).nom, o.lot, Calc.oKg(o), o.narx, Calc.oSum(o), o.tan, Calc.oSum(o) - Math.round(Calc.oKg(o) * o.tan), Data.userById(o.mid).ism])];
		const blob = new Blob(['\ufeff' + /* BOM: Excel UTF-8 ni taniydi */  rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
		const a = document.createElement('a');
		a.href = URL.createObjectURL(blob); a.download = `alfirdavs-hisobot-${ui.report}.csv`; a.click();

	drvGo(d) {
		const o = Data.order(d.id);
		if (!o || o.drv !== session.user || o.holat !== 'yigildi' || !Steps.guard()) return;
		o.holat = 'yolda'; o.ts.yolda = Time.now();
		Data.log(`${F.oid(o)} yo‘lga chiqdi — ${Data.client(o).nom}`, 'yol', { oid: o.id });
