	setCash(d) { ui.f.drv.cash = d.v; UI.refresh('drv-res'); },
	drvDone(d) {
		const o = Data.order(d.id), f = ui.f.drv;
		if (!o || o.drv !== session.user || o.holat !== 'yolda' || !Forms.valid('drv') || !Steps.guard()) return;
		const kg = +f.kg, c = Data.client(o);
		o.qaytdi = o.kgFakt - kg; o.holat = kg === 0 ? 'muammo' : 'topshirildi'; o.ts.topshirildi = Time.now(); o.foto = f.foto;
		if (o.qaytdi) {
			const kam = Data.lot(o.lot).kamera || 'omborga';
			o.sabab = f.sabab.trim();
			Data.move(o.lot, 'qaytish', o.qaytdi, `${o.sabab} — ${kam} ga qaytdi (omborchi tekshiradi)`, o.id);
			Data.log(`${F.oid(o)}: ${F.kg(o.qaytdi)} ${kam} ga qaytdi (omborchi tekshiradi) — ${o.sabab}`, 'qaytdi', { oid: o.id });
		}
		Data.log(`${F.oid(o)} topshirildi: ${F.kg(kg)} — ${c.nom}`, 'topshirildi', { oid: o.id });
		if (f.cash === 'ha') {
			const np = Views.naqdParts(f), izoh = np.old ? `joriy yetkazish ${F.mln(np.cur)} · eski qarzdan ${F.mln(np.old)}` : '';
			db.pays.push({ cid: c.id, t: Time.now(), sum: Calc.r1000(+f.naqd), usul: 'naqd', uid: session.user, oid: o.id, izoh });
			Data.log(`Naqd ${F.som(+f.naqd)} — ${c.nom} (haydovchi oldi${izoh ? '; ' + izoh : ''})`, 'tolov', { cid: c.id, oid: o.id });
		}
		Data.save(); ui.task = null; ui.f.drv = null; Views.render(); window.scrollTo(0, 0);
		UI.toast((o.qaytdi ? `${F.kg(o.qaytdi)} ${Data.lot(o.lot).kamera} ga qaytdi. ` : '') + (f.cash === 'ha' ? `Topshirildi, naqd ${F.som(+f.naqd)} yozildi` : 'Topshirildi'), 3500);
	}
};

/* ===== Fields — forma maydonlari o‘zgarishi (manba: d.js) =====
	 Maydon o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) — faqat bog‘liq bo‘laklar yangilanadi. */
const Fields = {
	live: {
		no(k) {
			if (k === 'q') UI.refresh('no-picks');
			if (['kg', 'narx'].includes(k)) { UI.refresh('no-sum', 'no-bar'); Forms.show('no.kg'); }
		},
		rec(k) { if (k !== 'sabab') UI.refresh('rec-res'); },
		pick() { UI.refresh('pick-res'); },
		drv(k) {
			const f = ui.f.drv;
			if (k === 'naqd') { f.naqdManual = true; const el = $('#drv-naqd-t'), sp = $('#drv-split'); if (el) el.textContent = Views.naqdText(f); if (sp) sp.textContent = Views.naqdSplit(f); }
			if (k === 'kg') { if (!f.naqdManual) f.naqd = String(Calc.r1000((+f.kg || 0) * Data.order(f.id).narx)); UI.refresh('drv-res'); }
		},
		lot(k) { if (k === 'sup' || k === 'prod') { if (k === 'sup') { const v = Data.sup(ui.f.lot.sup).val; ui.f.lot.narx = v === 'RUB' ? '32' : '0.46'; ui.f.lot.kurs = String(db.set.kurs[v]); } UI.refresh('mbody'); } }
	},
	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file' || t.type === 'date';
		if (e.type !== (discrete ? 'change' : 'input')) return;
		if (t.id === 'pin') {
			$('#pinerr').textContent = '';
			if (t.value.length === 4) Actions.login();
		} else if (data.f) {
			const [form, k] = data.f.split('.');
			if (!ui.f[form]) return;
			ui.f[form][k] = t.type === 'checkbox' ? t.checked : 'num' in data ? t.value.replace(/\s/g, '').replace(',', '.') : t.value;
			// pul maydoni: yozilayotganda ham minglik bo‘shliq bilan (kursor oxirida bo‘lsa)
			if ('fmt' in data && t.selectionStart === t.value.length) { const n = ui.f[form][k].replace(/\D/g, ''); ui.f[form][k] = n; t.value = n ? F.num(+n) : ''; }
			Forms.show(data.f);
			if (Fields.live[form]) Fields.live[form](k);
		} else if (data.filter) {
			if (can(data.filter)) Actions[data.filter]({ v: t.value });
		} else if (data.search) {
			if (data.search === 'orderFilter') { ui.orderFilter.q = t.value; ui.orderLimit = 40; UI.refresh('list'); }
			if (data.search === 'clientQ') { ui.clientQ = t.value; UI.refresh('clist'); }
		} else if ('gsearch' in data) {
			ui.gs.q = t.value;
			UI.refresh('gs-res');
		} else if (data.set) {
			Fields.setting(t);
		} else if (data.photo && t.files && t.files[0]) {
			Fields.photo(t);
		}
	},
	// Sozlamalar: narx, minimal narx, boj, kurs, qarz qoidalari, usushka, QQS. Faqat direktor.
	setting(t) {
		if (!SETTINGS_ROLES.includes(session.role)) return UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
		const path = t.dataset.set.split('.');
		if (path[0] === 'user') return Fields.staff(t, Data.userById(path[1]), path[2]);
		let v = t.type === 'checkbox' ? t.checked : +t.value.replace(/\s/g, '').replace(',', '.');
		if (t.type !== 'checkbox' && (t.value === '' || !isFinite(v) || v < 0)) return t.setAttribute('aria-invalid', '');
		t.removeAttribute('aria-invalid');
		if (path[0] === 'prod') { const p = Data.prod(path[1]); if (path[2] === 'narx') p.narx[path[3]] = v; else p[path[2]] = path[2] === 'boj' ? Math.min(100, v) : v; }
		else if (path[0] === 'kurs') db.set.kurs[path[1]] = v;
		else { if (path[1] === 'limit') v = v * 1e6; db.set[path[1]] = v; }
		const row = t.closest('tr'), fld = t.closest('.fld'), name = row ? row.cells[0].firstChild.textContent : fld ? fld.firstChild.textContent : 'QQS';
		Data.log(`Sozlama: ${name} — ${t.type === 'checkbox' ? (v ? 'QQS hisobga olinadi' : 'QQS tannarxga kiradi') : t.value}`, 'sozlama');
		Data.save();
	},
	staff(t, u, k) {
		const v = t.type === 'checkbox' ? t.checked : t.value.trim();
		const bad = k === 'pin' ? !/^\d{4}$/.test(v) || db.users.some(x => x !== u && x.pin === v) : k === 'ism' ? v.length < 3 : k === 'tel' ? F.telDigits(v).length !== 12 : false;
		if (bad) { t.setAttribute('aria-invalid', ''); if (k === 'pin' && /^\d{4}$/.test(v)) UI.toast('Bu PIN boshqa xodimda bor'); return; }
		t.removeAttribute('aria-invalid');
		if (k === 'faol' && !v && u.id === session.user) { t.checked = true; return UI.toast('O‘zingizni faolsizlantira olmaysiz'); }
		u[k] = v;
		Data.log(`Xodim: ${u.ism} — ${k === 'faol' ? (v ? 'faollashtirildi' : 'faolsizlantirildi') : k === 'pin' ? 'PIN almashtirildi' : (k === 'ism' ? 'ism' : 'telefon') + ' o‘zgardi'}`, 'sozlama');
		Data.save();
		if (k === 'faol') UI.refresh('set-body');
	},
	// Yuk xati surati: ≤ 1280 px, JPEG (0,7), qurilmada saqlanadi
	photo(t) {
		const file = t.files[0], f = ui.f.drv;
		if (!f || !can('drvDone')) return;
		const img = new Image(), url = URL.createObjectURL(file);
		img.onload = () => {
			const k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
			cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
			cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
			URL.revokeObjectURL(url);
			f.foto = Data.putPhoto(cv.toDataURL('image/jpeg', 0.7));
			if (!f.foto) UI.toast('Telefon xotirasida joy qolmadi — surat saqlanmadi');
			Views.render();
		};
		img.onerror = () => { URL.revokeObjectURL(url); UI.toast('Bu faylni surat sifatida ochib bo‘lmadi'); };
		img.src = url;
	}
};

/* ===== Hodisalar: bosish, yozish, klaviatura (manba: d.js) ===== */

// Har amal ruxsat jadvalidan o‘tadi (CAN): tugma yashirilgani yetarli emas.
const deny = name => {
	if ([...GUEST_ACTIONS, ...BASE_ACTIONS, ...Object.values(CAN).flat()].includes(name)) UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
};
Object.keys(Actions).forEach(name => {
	const run = Actions[name];
	Actions[name] = d => can(name) ? run(d) : deny(name);
});

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (Actions[name]) Actions[name](el.dataset);
	else deny(name);
});

/* ===== Router — manzil satri (manba: d.js) =====
	 #/sahifa yoki #/sahifa/karta/id. Brauzerning «orqaga» tugmasi sahifa va kartani qaytaradi. */
const Router = {
	hash: () => !ROLES[session.role] ? '' : '#/' + ui.page + (ui.drawer ? `/${ui.drawer.type}/${ui.drawer.id}` : '') + (ui.task ? `/vazifa/${ui.task}` : ''),
	sync() {
		const h = Router.hash();
		if (h !== location.hash && (h || location.hash)) history[location.hash ? 'pushState' : 'replaceState'](null, '', h || location.pathname + location.search);
	},
	read() {
		const [page, type, id] = decodeURIComponent(location.hash.slice(2)).split('/'), role = ROLES[session.role];
		if (!role || !pageOk(role, page)) return false;
		ui.page = page;
		ui.task = type === 'vazifa' && ui.task === +id ? ui.task : null;
		if (type === 'neworder' && !ui.f.no) Steps.newOrder();
		ui.drawer = !role.tor && ['lot', 'order', 'client', 'neworder'].includes(type) ? { type, id: type === 'order' ? +id : id } : null;
		return true;
	}
};
window.addEventListener('popstate', () => { UI.closeModal(); Steps.closePops(); ui.menu = false; if (Router.read() || !session.role) Views.render(); else Router.sync(); });
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { pin: Actions.login, newOrder: Actions.submitOrder, receive: Actions.saveReceive }[e.target.dataset.form];
	e.preventDefault();
	if (submit) submit();
});
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	if ($('#modal').innerHTML) UI.closeModal();
	else if (ui.bell || ui.gs.q || ui.gs.open) Actions.closePops();
	else if (ui.drawer) Actions.closeDrawer();
	else if (ui.menu) Actions.toggleMenu();
});
matchMedia('(max-width:820px)').addEventListener('change', () => { if (session.role) Views.render(); });
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; if (session.role) Views.render(); }));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; });

/* ===== Ishga tushirish (manba: d.js) ===== */

Data.load();
Router.read();
Steps.prep();
Views.render();

// Service worker faqat http(s) da; yangi versiya kelsa — yozilayotgan narsa bo‘lmasa bir marta o‘zi yangilanadi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
	const had = !!navigator.serviceWorker.controller;
	const typing = () => !!document.querySelector('.modal') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
	let reloaded = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (!had || reloaded) return;
		if (typing()) { UI.prompt('Yangi versiya bor', 'Yangilash', 'reloadApp'); return; }
		reloaded = true;
		location.reload();
	});
}

/* ===== Sinov rejimi (build.mjs yozadi): manzilda ?sinov bo‘lsa, modullar window ga chiqariladi ===== */
if (new URLSearchParams(location.search).has('sinov')) {
	Object.assign(window, { DAY, HOUR, MIN, MON3, MONTHS, DEMO_START, DEMO_END, Time, ROLES, pageOk, STAGES, STAGE_HOLAT, DOCS, DOC_ST, XARAJAT, VAL, NARX_TUR, XTUR, KAMERA, QABUL_SABAB, DAVO, DAVO_NEXT, DAVO_BTN, STATUS, OPEN_ST, SOLD_ST, DONE_ST, NEED, USUL, EVENTS, GUEST_ACTIONS, BASE_ACTIONS, DESK_ACTIONS, SALES_WORK, IMPORT_WORK, CAN, SETTINGS_ROLES, can, ui, Data, Calc, $, NB, F, LOGO, UI, pos, Forms, PAGES, ATT_KIND, Views, LOT_FILTERS, ORDER_FILTERS, TERMS, termText, Steps, Actions, Fields, deny, Router });
	Object.defineProperties(window, {
		db: { get: () => db, set: v => { db = v; } },
		session: { get: () => session, set: v => { session = v; } }
	});
}
})();
</script>
