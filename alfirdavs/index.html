		const navItem = (p, cls, label) => `<button class="${cls}" data-act="go" data-p="${p}"${p === ui.page ? ' aria-current="page"' : ''}>${UI.icon(PAGES[p].icon)}<span>${label}</span></button>`;
		const userButton = full => `<button class="user" data-act="toggleMenu" aria-haspopup="menu" aria-expanded="${ui.menu}" aria-label="Profil: ${UI.esc(user.ism)}"><span class="ava">${F.initials(user.ism)}</span>${full ? `<span><span class="n">${UI.esc(user.ism)}</span><span class="r">${user.lav}</span></span>` : ''}</button>`;
		const menu = !ui.menu ? '' : `<div class="scrim" data-act="toggleMenu"></div><div class="menu" role="menu">
			<div class="hd"><div class="strong">${UI.esc(user.ism)}</div><div class="muted sm">${user.lav}</div></div>
			<button role="menuitem" data-act="go" data-p="sozlamalar">${UI.icon('sliders')}Sozlamalar</button>
			<div class="til-m">${Til.tugma()}</div>
			<button role="menuitem" data-act="resetDemo">${UI.icon('refresh')}Namunani boshidan boshlash</button></div>`;
		const offline = ui.online ? '' : '<div class="offbar">Internet yo‘q — ma’lumot shu qurilmada saqlanmoqda</div>';
		// telefon: «+» profil bilan bitta yumaloq pill ichida (faqat belgi); 1280: yozuvli tugma
		const plus = prim ? `<button class="btn pri new" data-act="${prim.act}" aria-label="${prim.t}">${UI.icon('plus')}<span>${prim.t}</span></button>` : '';
		$('#app').innerHTML = `<div class="app">
			<div class="side">
				<div class="logo">${LOGO}<span>ALFIRDAVS TM<small>Import va ulgurji · Toshkent</small></span></div>
				<nav class="nav" aria-label="Bo‘limlar">${NAV.map(p => navItem(p, 'nav-i', PAGES[p].t)).join('')}</nav>
				<div class="side-foot">${userButton(true)}${mobile ? '' : menu}<div class="demo-note">Namuna — ma’lumotlar misol uchun</div></div>
			</div>
			<main class="main">
				<header class="topbar">
					<div class="tb-l">${sub ? `<button class="btn ic tb-btn" data-act="backSub" aria-label="Orqaga">${UI.icon('back')}</button>` : ''}</div>
					<h1>${sub ? sub.t : PAGES[ui.page].t}</h1>
					<div class="tb-r"><div class="pill">${userButton(false)}${plus}</div>${mobile ? menu : ''}</div>
				</header>${offline}
				<div class="page">${Views[PAGES[ui.page].view]()}</div>
			</main>
			<nav class="bnav" aria-label="Bo‘limlar">${NAV.map(p => navItem(p, '', PAGES[p].short || PAGES[p].t)).join('')}</nav>
		</div>`;
		UI.refresh('layer');
		Router.sync();
	},
	// Ochiq ichki ro‘yxat (Hujjatlar yoki Pul ichida): { k, t } yoki null
	sub() {
		const map = ui.page === 'hujjatlar' ? DOC_TUR : ui.page === 'pul' ? PUL_TUR : {}, k = ui.page === 'hujjatlar' ? ui.doc : ui.pul;
		return k && map[k] ? { k, t: map[k] } : null;
	},
	// Bo‘limdagi «+» (yangi qo‘shish) — amali bor bo‘lsagina chiqadi
	primary() {
		const p = {
			hujjatlar: { '': ['openNewOrder', 'Yangi sotuv'], sotuv: ['openNewOrder', 'Yangi sotuv'], xarid: ['openNewLot', 'Yangi partiya'] }[ui.doc || ''],
			tovarlar: ['openTovar', 'Yangi tovar'], kontragentlar: ['openKontr', 'Yangi kontragent'],
			// Pul ichki ro‘yxatlarida «+» yo‘q — amallar ro‘yxatning o‘zida (Kirim/Chiqim, To‘landi, To‘lash)
			pul: ui.pul ? null : ['openTolovTur', 'Yangi to‘lov']
		}[ui.page];
		return p && can(p[0]) ? { act: p[0], t: p[1] } : null;
	},

	// Qisman yangilanadigan bo‘laklar: element id → HTML (UI.refresh shu yerdan oladi)
	parts: {
		layer() {
			const d = ui.drawer;
			return !d ? '' : `<div class="ovl" data-act="closeDrawer"></div><div class="drawer${d.enter ? ' enter' : ''}" role="dialog" aria-modal="true">${Views[d.type + 'Card'](d.id)}</div>`;
		},
		mbody: () => Views[ui.modalForm](),
		list: 'ordersList', klist: 'kontrList', tvlist: 'tovarList', llist: 'lotsList', tlist: 'tolovList', 'ch-body': 'chBody', 'ch-som': 'chSom',
		'no-hit': 'noHit', 'no-lots': 'noLot', 'no-tol': 'noTol', 'no-picks': 'noPicks', 'pay-av': 'payAvans', 'no-bar': 'noBar', 'set-body': 'settingsBody', 'k-savdo': 'savdoPg', 'k-seg': 'kSeg'
	},
	part(id) { const p = Views.parts[id]; return typeof p === 'string' ? Views[p]() : p(); },
	drawerHead: (title, sub, extra = '') => `<div class="dh"><button class="btn ic ghost dh-back" data-act="closeDrawer" aria-label="Orqaga">${UI.icon('back')}</button><div class="x"><h2>${title}</h2>${sub ? `<div class="muted sm">${sub}</div>` : ''}</div>${extra}<button class="btn ic ghost dh-x" data-act="closeDrawer" aria-label="Yopish">${UI.icon('x')}</button></div>`,

	/* --- Guruhlangan ro‘yxat (Hujjatlar, Pul): guruh sarlavhasi + yumaloq rangli belgi + katta matn --- */
	glist: groups => groups.map(([h, rows]) => `${h ? `<h2 class="dgrp">${h}</h2>` : ''}<div class="dlist">${rows.map(r =>
		`<button class="drow" data-act="${r.act}" data-v="${r.v}"><span class="dic ${r.c}">${UI.icon(r.ic)}</span><span class="t">${r.t}</span></button>`).join('')}</div>`).join(''),

	/* --- Ko‘rsatkichlar (МойСклад «Показатели»): 4 sahifali rangli karta + Bugun · Hafta · Oy.
		 Telefonda karta suriladi (scroll-snap, nuqtalar ergashadi — d.js), 1280 da 2×2. Davr faqat SAVDO sahifasiga ta’sir qiladi. --- */
	home: () => `<div class="kk-wrap"><div class="kk">
			<div class="kk-dots">${KSAHIFA.map((t, i) => `<button type="button" data-act="kkPg" data-v="${i}" aria-label="${t}"${i ? '' : ' aria-current="true"'}></button>`).join('')}</div>
			<div class="kk-track" id="kk-track" tabindex="0" aria-label="Ko‘rsatkichlar">
				<section class="kk-pg" id="k-savdo">${Views.savdoPg()}</section>
				<section class="kk-pg">${Views.kPulPg()}</section>
				<section class="kk-pg">${Views.kQarzPg()}</section>
				<section class="kk-pg">${Views.kOmborPg()}</section>
			</div>
		</div>
		<div class="kk-bar" id="k-seg">${Views.kSeg()}</div></div>`,
	kSeg: () => UI.seg('setKDavr', ui.kDavr, KDAVR, 'kk-seg'),
	// SAVDO: grafik (summa), Soni va Summa — o‘tgan davrga nisbatan %, «Sotilgan tovarlar ›»
	savdoPg() {
		const k = Calc.korsat(ui.kDavr);
		// % o‘zgarish: o‘sish — yashil, kamayish — qizil, 0 — rangsiz; o‘tgan davrda sotuv bo‘lmasa — faqat «—»
		const chg = (d, prev) => `<span class="kk-c">${d == null ? '—' : `<b${d ? ` class="${d < 0 ? 'dn' : 'up'}"` : ''}>${d > 0 ? '+' : d < 0 ? '−' : ''}${F.num(Math.abs(d))}${NB}%</b> · <span>${prev}</span>`}</span>`;
		return `<h2 class="kk-h">Savdo</h2>${Views.kChart(k.bars, k.cut)}
			<div class="kk-two">
				<div><span class="l">Soni</span><b class="v">${F.num(k.n)}</b>${chg(k.dn, F.num(k.pn))}</div>
				<div><span class="l">Summa</span><b class="v">${k.sum ? F.mln(k.sum) : '0'}</b>${chg(k.ds, F.mln(k.psum))}</div>
			</div>
			<p class="kk-n">${KTAQQOS[ui.kDavr]}</p>
			<button type="button" class="kk-row" data-act="soldGoods"><span>Sotilgan tovarlar</span>${UI.icon('chev')}</button>`;
	},
	// Chiziqli grafik (inline SVG): soatlar (Bugun) yoki kunlar (Hafta, Oy) bo‘yicha sotuv summasi; chiziq cut nuqtagacha.
	// Telefonda viewBox kengligi ekran kengligidan — yozuv va chiziq har qanday kenglikda bir xil o‘lchamda.
	kChart(bars, cut = bars.length - 1) {
		const W = UI.mobile() ? Math.max(280, Math.min(720, innerWidth - 68)) : 540, H = UI.mobile() ? 190 : 170, L = 44, R = 8, T = 8, B = 24, n = bars.length;
		// Shkala: 3–5 chiziq, «yaxshi» qadam (1 · 2 · 2,5 · 5 × 10ⁿ) — cho‘qqi tepaga yaqin
		const max = Math.max(0, ...bars.map(b => b.sum)), nice = v => { const m = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map(s => s * m).find(s => s >= v); };
		const [step, cnt] = [3, 4, 5].map(c => [nice((max || 4e6) / c), c]).sort((a, b) => a[0] * a[1] - b[0] * b[1])[0], top = step * cnt;
		const x = i => L + (n > 1 ? i * (W - L - R) / (n - 1) : (W - L - R) / 2), y = v => T + (H - T - B) * (1 - v / top);
		const pts = bars.slice(0, cut + 1).map((b, i) => `${x(i).toFixed(1)},${y(b.sum).toFixed(1)}`), base = y(0).toFixed(1);
		const every = ui.kDavr === 'bugun' ? 3 : Math.ceil(n / 7);
		const grid = [...Array(cnt + 1)].map((_, k) => `<line class="g" x1="${L}" x2="${W - R}" y1="${y(k * step)}" y2="${y(k * step)}"/><text x="${L - 6}" y="${y(k * step) + 4}" text-anchor="end">${!k ? '0' : max ? F.mln(k * step) : ''}</text>`).join('');
		const xl = bars.map((b, i) => i % every ? '' : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${ui.kDavr === 'bugun' ? b.l + ':00' : b.l}</text>`).join('');
		const line = pts.length ? `<path class="ar" d="M${x(0).toFixed(1)},${base}L${pts.join('L')}L${x(pts.length - 1).toFixed(1)},${base}Z"/><path class="ln" d="M${pts.join('L')}"/>` : '';
		return `<svg class="kk-ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Savdo grafigi">${grid}
			${line}${n <= 7 ? pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5"/>`).join('') : ''}${xl}</svg>`;
	},
	// PUL: kassada (naqd · bank), shu oy menga qoldi, oxirgi 6 oy ustunchalari
	kPulPg() {
		const q = Calc.qoldiq(), s = Calc.sof(Calc.joriyOy()), oy = Calc.qoldiOylar(), m = Math.max(1, ...oy.map(r => Math.abs(r.qoldi)));
		const bar = r => `<div${r.oy === Calc.joriyOy() ? ' class="cur"' : ''}><span>${F.num(r.qoldi / 1e6, 1)}</span><i class="${r.qoldi < 0 ? 'neg' : ''}" style="height:${Math.max(3, Math.round(Math.abs(r.qoldi) / m * 70))}px"></i><small>${MON3[+r.oy.slice(5) - 1]}</small></div>`;
		return `<h2 class="kk-h">Pul</h2>
			<div><span class="l">Kassada</span><b class="v">${F.mln(q.jami)}</b><span class="s"><span${q.naqd < 0 ? ' class="kk-neg"' : ''}>Naqd ${F.mln(q.naqd)}</span> · <span${q.bank < 0 ? ' class="kk-neg"' : ''}>Bank ${F.mln(q.bank)}</span></span></div>
			<div><span class="l">Shu oy menga qoldi</span><b class="v">${F.mln(s.qoldi)}</b></div>
			<div><span class="s">Menga qoldi, mln so‘m</span><div class="kk-bars" style="grid-template-columns:repeat(${Math.max(3, oy.length)},minmax(0,1fr))">${oy.map(bar).join('')}</div></div>`;
	},
	// QARZLAR: menga qarzlar (muddati o‘tgani alohida), men qarzman (kimga; ma’lum bo‘lsa — eng yaqin muddat)
	kQarzPg() {
		const d = Calc.debitor(), k = Calc.kreditor(), y = k.yaqin;
		const oxiri = oy => { const [g, m] = oy.split('-').map(Number); return F.date(`${oy}-${Time.p2(new Date(g, m, 0).getDate())}`); };
		const kim = [['yetkazib beruvchi', k.yetk], ['investor', k.inv], ['avans', k.avans]].filter(r => r[1] > 0).map(([t, v]) => `<span>${t} ${F.mln(v)}</span>`).join(' · ');
		return `<h2 class="kk-h">Qarzlar</h2><div class="kk-st">
			<div><span class="l"><i class="kk-d up"></i>Menga qarzlar</span><b class="v">${F.mln(d.jami)}</b>
				<span class="s">${d.over ? `<span class="kk-red">muddati o‘tgan ${F.mln(d.over)}</span> · <span>${d.n} xaridor</span>` : 'muddati o‘tgan qarz yo‘q'}</span></div>
			<div><span class="l"><i class="kk-d dn"></i>Men qarzman</span><b class="v">${F.mln(k.jami)}</b><span class="s">${kim || '—'}</span>
				${y ? `<span class="s"><span>eng yaqini — ${oxiri(y.oy)} gacha</span> · <span>${UI.esc(y.i.nom)}</span> <span>${F.mln(y.qol)}</span></span>` : ''}</div></div>`;
	},
	// OMBOR: omborda, sotish mumkin, yo‘lda, muddati yaqin (kg)
	kOmborPg() {
		const o = Calc.ombor();
		return `<h2 class="kk-h">Ombor</h2><div class="kk-grid kk-st">
			<div><span class="l">Omborda</span><b class="v">${F.kg(o.omborda)}</b></div>
			<div><span class="l">Sotish mumkin</span><b class="v">${F.kg(o.sotish)}</b></div>
			<div><span class="l">Yo‘lda</span><b class="v">${F.kg(o.yolda)}</b><span class="s">${o.yolN} partiya</span></div>
			<div><span class="l">Muddati yaqin</span><b class="v">${F.kg(o.yaqinKg)}</b><span class="s">${o.yaqinN} partiya</span></div></div>`;
	},
	// «Sotilgan tovarlar» oynasi: tanlangan davrda tovarlar bo‘yicha kg, summa, o‘rtacha narx
	soldGoods() {
		const k = Calc.korsat(ui.kDavr), kun = s => `${+s.slice(8)}-${MONTHS[+s.slice(5, 7) - 1]}`;
		return `<p class="psum">${KDAVR.find(r => r[0] === ui.kDavr)[1]} · ${k.from === k.to ? kun(k.to) : `${kun(k.from)} – ${kun(k.to)}`}${k.n ? ` · Jami <b>${F.kg(k.kg)}</b> · <b>${F.mln(k.sum)}</b>` : ''}</p>` + UI.table([
			['Tovar', 'c-main', r => UI.esc(r.pr.nom)],
			['Kg', 'num c-sub', r => F.kg(r.kg)],
			['Summa', 'num c-aside', r => F.som(r.sum)],
			['O‘rtacha narx', 'num c-sub', r => `${F.num(r.narx)}${NB}so‘m/kg`]
		], k.tovar, { empty: 'Bu davrda sotuv yo‘q', icon: 'package' });
	},

	/* --- qolgan bo‘limlar --- */
	docs() {
		if (ui.doc === 'sotuv') return Views.orders();
		if (ui.doc === 'xarid') return Views.lots();
		if (ui.doc === 'tolov') return Views.tolovlar();
		return Views.glist(DOC_GRP.map(([h, c, ic, ks]) => [h, ks.map(k => ({ act: 'setDoc', v: k, c, ic, t: DOC_TUR[k] }))]));
	},
	money() {
		if (ui.pul) return Views[ui.pul + 'View']();   // c5.js: kassaView, xarajatView, investorView, foydaView
		const q = Calc.qoldiq(), s = Calc.sof(Calc.joriyOy());
		return `<p class="psum">Kassada <b>${F.mln(q.jami)}</b> · Shu oy menga qoldi <b>${F.mln(s.qoldi)}</b></p>`
			+ Views.glist([[null, Object.keys(PUL_TUR).map(k => ({ act: 'setPul', v: k, c: 'pul', ic: PUL_ICON[k], t: PUL_TUR[k] }))]]);
	}
};

/* ===== Views: Partiyalar, partiya kartasi, Tovarlar, tovar kartasi (manba: c2.js) ===== */

const LOT_FILTERS = [
	['hammasi', 'Hammasi', () => true],
	['yolda', 'Yo‘lda', p => !p.qabul],
	['ombor', 'Omborda', p => !!p.qabul]
];

Object.assign(Views, {
	/* --- Partiyalar --- */
	lots() {
		const list = LOT_FILTERS.map(([k, t, fn]) => [k, t, db.lots.filter(fn).length]), cur = (LOT_FILTERS.find(f => f[0] === ui.lotFilter) || LOT_FILTERS[0])[0];
		return `<div class="toolbar">${UI.filter('setLotFilter', cur, list, true)}<span class="grow"></span>${UI.search('lotQ', ui.lotQ || '', 'Qidirish')}</div>
			<section class="card" id="llist">${Views.lotsList()}</section>`;
	},
	lotsList() {
		const cur = LOT_FILTERS.find(f => f[0] === ui.lotFilter) || LOT_FILTERS[0], q = F.q(ui.lotQ);
		const hit = p => !q || [p.id, Data.sup(p.sup).nom, Data.prod(p.prod).nom].some(s => F.q(s).includes(q));
		const rows = db.lots.filter(p => cur[2](p) && hit(p)).sort((a, b) => Calc.closed(a) - Calc.closed(b) || (b.id < a.id ? -1 : 1));
		const tan = p => { const c = Calc.cost(p); return `${c.est ? '<span class="muted">~</span>' : ''}${F.num(c.perKg)}`; };
		const debt = p => { const d = Calc.supDebt(p); return d > 0 ? F.val(d, p.val) : '<span class="muted">to‘langan</span>'; };
		const cols = [
			['Partiya', 'c-main', p => `${p.id}${UI.mobile() ? ` · ${Data.prod(p.prod).qisqa}` : `<span class="sub">${UI.esc(Data.sup(p.sup).nom)} · ${Data.sup(p.sup).mam}</span>`}`],
			['Tovar', 'm-hide', p => Data.prod(p.prod).qisqa],
			['Kg', 'c-aside num', p => `${F.num(p.qabul ? p.qabul.kg : p.kgInv)}<small class="u m-only"> kg</small>`],
			['', 'c-sub d-hide sm-sub', p => `${UI.esc(Data.sup(p.sup).nom)} · ${Data.sup(p.sup).mam}`],
			['Holat', 'c-foot', p => `${UI.lotState(p)}${p.qabul && !Calc.closed(p) ? `<span class="muted m-only">kelgan ${F.date(p.st[LAST].fact)}</span>` : ''}`],
			['1 kg tannarx', 'num m-hide', tan],
			['Yetkazib beruvchiga qarz', 'num m-hide', debt]
		];
		return UI.table(cols, rows, { open: p => ['openLot', p.id], empty: 'Partiya topilmadi', icon: 'lot', cls: 'lots-t' });
	},

	lotCard(id) {
		const p = Data.lot(id);
		if (!p) return Views.drawerHead('Partiya topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'lot')}</div>`;
		const sup = Data.sup(p.sup), pr = Data.prod(p.prod), c = Calc.cost(p), s = Calc.stock(p), sp = Calc.soldPct(p), closed = Calc.closed(p);
		const tone = closed ? '' : p.qabul ? 'grn' : 'br';
		const trio = `<div class="trio"><div><span>${p.qabul ? 'Qabul qilingan' : 'Invoys'}</span><b>${UI.u(F.num(p.qabul ? p.qabul.kg : p.kgInv), 'kg')}</b></div>
			<div><span>1 kg tannarx</span><b>${UI.u(F.num(c.perKg), 'so‘m')}</b>${c.est ? UI.chip('taxminiy', 'amb') : UI.chip('tarozi kg', 'grn')}</div><div><span>Sotilgan</span><b>${UI.u(F.num(Math.round(sp.sot * 100)), '%')}</b></div></div>`;
		// Holat: faqat haqiqiy sanalar — partiya ochilgan kun va omborga kelgan kun
		const dates = UI.dl([['Ochilgan', F.date(p.st[0].fact)], p.qabul && ['Omborga kelgan', F.date(p.st[LAST].fact)]]);
		// Xarajatlar: nol summali qatorlar ko‘rsatilmaydi
		const costT = `<table class="calc">${c.rows.filter(r => r.sum).map(r => `<tr${r.qosh ? ' class="qo"' : ''}><td>${r.nom}${r.izoh ? `<span class="sub">${UI.esc(r.izoh)}</span>` : ''}</td><td>${F.num(r.sum)}</td></tr>`).join('')}
			<tr class="tot"><td>Jami xarajat</td><td>${F.som(c.sum)}</td></tr>
			<tr class="x"><td>÷ ${c.est ? 'invoys' : 'qabul qilingan'} kg</td><td>${F.num(c.base)}</td></tr>
			<tr class="tot big"><td>1 kg tannarx${c.est ? ' (taxminiy)' : ''}</td><td>${F.num(c.perKg)} so‘m</td></tr></table>
			${p.qot ? `<p class="rule">Tannarx tarozi kg bo‘yicha. Keyin qo‘shilgan xarajat 1 kg tannarxni oshiradi; oldingi sotuvlar o‘z sotuv paytidagi tannarxi bilan qoladi.</p>` : `<p class="rule">Partiya kursi: 1 ${VAL[p.val]} = ${F.num(p.kurs)} so‘m (partiya ochilgan kuni qotgan).</p>`}`;
		const q = p.qabul;
		const stockT = q && `<table class="calc"><tr><td>Qabul (tarozi)</td><td>${F.kg(s.qabul)}</td></tr><tr class="x"><td>Sotilgan</td><td>${s.sot ? `−${F.num(s.sot)}` : 0}</td></tr>
			<tr class="tot"><td>Qoldiq</td><td>${F.kg(s.qoldiq)}</td></tr>${s.muddati ? `<tr class="x"><td class="red-t">Muddati o‘tgan</td><td>${F.num(s.muddati)}</td></tr>` : ''}
			<tr class="x"><td><b>Sotish mumkin</b></td><td><b>${F.num(s.bosh)}</b></td></tr></table><p class="rule">${p.yaroq ? `Yaroqli ${F.dateLong(p.yaroq)} gacha — ${Calc.daysLeft(p)} kun qoldi.` : 'Yaroqlilik muddati kiritilmagan.'}</p>`;
		const os = Calc.lotOrders(p).sort((a, b) => b.id - a.id), shown = os.slice(0, 10);
		const sales = os.length ? `<table class="calc">${shown.map(o => `<tr><td><button class="link" data-act="openOrder" data-id="${o.id}">${UI.esc(Data.client(o).nom)}</button><span class="sub">${F.oid(o)} · ${F.day(o.sana)}</span></td><td>${F.kg(Calc.lotKg(o, p))}</td></tr>`).join('')}</table>${os.length > 10 ? `<p class="hint mt8">Yana ${os.length - 10} ta sotuv</p>` : ''}` : '<p class="muted sm">Hali sotuv yo‘q</p>';
		const pd = Calc.supDebt(p);
		const supT = `<table class="calc"><tr><td>Xarid summasi</td><td>${F.val(Calc.buy(p), p.val)}</td></tr>${p.tolov.map(t => `<tr class="x"><td>To‘landi ${F.date(t.t)}</td><td>${F.val(t.sum, p.val)}</td></tr>`).join('')}
			<tr class="tot"><td>Qoldiq</td><td>${pd > 0 ? `${F.val(pd, p.val)}<span class="sub">≈ ${F.som(Calc.supSom(p))}</span>` : 'yo‘q'}</td></tr></table>
			${pd > 0 ? `<button class="btn s mt8" data-act="openSupPay" data-id="${p.id}">${UI.icon('coin')}To‘lash</button>` : ''}`;
		const hist = db.events.filter(e => e.lot === p.id).slice().reverse();
		const acts = closed ? '' : [
			`<button class="btn" data-act="openCost" data-id="${p.id}">${UI.icon('plus')}Xarajat</button>`,
			p.qabul ? '' : `<button class="btn pri" data-act="openQabul" data-id="${p.id}">${UI.icon('scale')}Omborga qabul qilish</button>`
		].join('');
		return Views.drawerHead(`${p.id} ${UI.chip(Calc.holat(p), tone)}${closed ? ' <span class="muted sm">qoldiq 0</span>' : ''}`, [UI.esc(sup.nom), sup.mam, pr.nom].filter(Boolean).join(' · '))
			+ `<div class="dbody">${trio}
				<div class="dsec"><h3>Holat</h3>${dates}</div>
				<div class="dsec"><h3>Xarajatlar va 1 kg tannarx</h3>${costT}</div>
				${stockT ? `<div class="dsec"><h3>Qoldiq</h3>${stockT}</div>` : ''}
				<div class="dsec"><h3>Sotuvlar</h3>${sales}</div>
				<div class="dsec"><h3>Yetkazib beruvchiga to‘lov</h3>${supT}</div>
				${hist.length ? `<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}</span></li>`).join('')}</ul></div>` : ''}
			</div>${acts ? `<div class="dfoot">${acts}</div>` : ''}`;
	},

	/* --- Tovarlar (МойСклад «Товары»): halqa (2 harf) · «kod · nom», savatcha — sotish mumkin kg, quti — qoldiq kg --- */
	goods() {
		return `<div class="mbar">${UI.search('tovarQ', ui.tovarQ, 'Qidirish')}<button class="btn ic fbtn" data-act="setTovarF" aria-pressed="${ui.tovarF}" aria-label="Faqat qoldig‘i borlar" title="Faqat qoldig‘i borlar">${UI.icon('filter')}</button></div>
			<div id="tvlist">${Views.tovarList()}</div>`;
	},
	tovarList() {
		const q = F.q(ui.tovarQ);
		const rows = db.prods.map(Calc.tovar).filter(t => (!ui.tovarF || t.qoldiq > 0) && (!q || F.q(t.pr.nom).includes(q) || t.kod.includes(q)));
		if (!rows.length) return UI.empty('Tovar topilmadi', 'boxes');
		return `<div class="mlist">${rows.map(t => `<button class="mrow" data-act="openProd" data-id="${t.pr.k}">${Views.ring(t.pr.nom)}
			<span class="x"><b class="t">${t.kod} · ${UI.esc(t.pr.nom)}</b><span class="qty${t.qoldiq > 0 ? '' : ' nol'}"><span class="sot" title="Sotish mumkin">${UI.icon('cart')}${F.kg(t.bosh)}</span><span title="Qoldiq">${UI.icon('box')}${F.kg(t.qoldiq)}</span></span></span></button>`).join('')}</div>`;
	},
	// Kulrang halqa ichida nomning 2 harfi (ruschada — tarjima qilingan nomdan)
	ring: nom => `<span class="ring" aria-hidden="true" data-notr>${UI.esc((Til.lang === 'ru' ? Til.tr(nom) : nom).slice(0, 2))}</span>`,

	/* --- Tovar kartasi: qoldiq, partiyalar (omborda / yo‘lda, kg, 1 kg tannarx, yaroqlilik), narx --- */
	prodCard(k) {
		const pr = Data.prod(k);
		if (!pr) return Views.drawerHead('Tovar topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'boxes')}</div>`;
		const t = Calc.tovar(pr), lots = [...t.ombor, ...t.yolda];
		const trio = `<div class="trio"><div><span>Sotish mumkin</span><b>${UI.u(F.num(t.bosh), 'kg')}</b></div><div><span>Qoldiq</span><b>${UI.u(F.num(t.qoldiq), 'kg')}</b></div>
			<div><span>Yo‘lda</span><b>${UI.u(F.num(t.yoldaKg), 'kg')}</b></div></div>`;
		const yaroq = p => !p.yaroq ? '—' : `<span class="${Calc.daysLeft(p) < 0 || Calc.soon(p) ? 'red-t' : ''}">${F.date(p.yaroq)}</span>`;
		const lotT = UI.table([
			['Partiya', 'c-main', p => `${p.id} ${UI.chip(Calc.holat(p), p.qabul ? 'grn' : 'br')}`],
			['Kg', 'c-aside num', p => F.kg(p.qabul ? Calc.stock(p).qoldiq : p.kgInv)],
			['1 kg tannarx', 'num', p => { const c = Calc.cost(p); return `${F.num(c.perKg)}${c.est ? '<span class="sub">taxminiy</span>' : ''}`; }],
			['Yaroqli', '', yaroq]
		], lots, { open: p => ['openLot', p.id], empty: 'Partiya yo‘q', icon: 'lot', cls: 'tlot-t' });
		return Views.drawerHead(`${t.kod} · ${UI.esc(pr.nom)}`, '')
			+ `<div class="dbody">${trio}
				<div class="dsec"><h3>Partiyalar</h3>${lotT}</div>
				<div class="dsec">${UI.dl([['Narx, 1 kg', UI.u(F.num(pr.narx), 'so‘m')]])}</div>
			</div><div class="dfoot"><button class="btn" data-act="openNarx" data-id="${pr.k}">Narxni o‘zgartirish</button></div>`;
	}
});

/* ===== Views: Sotuvlar, yangi sotuv, Kontragentlar, kontragent kartalari (manba: c3.js) ===== */

const ORDER_FILTERS = [
	['hammasi', 'Hammasi', o => Calc.sold(o)],
	['bugun', 'Bugun', o => o.sana === Time.today && Calc.sold(o)],
	['bekor', 'Bekor qilingan', o => o.holat === 'bekor']
];
const termText = sh => sh.kun ? `${sh.kun} kun` : 'yetkazganda';
// Kontragentlar filtri va qator bosilganda ochiladigan karta
const KONTR_F = [['hammasi', 'Hammasi'], ['xaridor', 'Xaridorlar'], ['yetk', 'Yetkazib beruvchilar'], ['inv', 'Investorlar']];
const KONTR_ACT = { xaridor: 'openClient', yetk: 'openSup', inv: 'openInv' };

Object.assign(Views, {
	/* --- Sotuvlar --- */
	orders() {
		const f = ui.orderFilter, list = ORDER_FILTERS.map(([k, t, fn]) => [k, t, db.orders.filter(fn).length]);
		return `<div class="toolbar">${UI.filter('setOrderFilter', f.st, list, true)}<span class="grow"></span>${UI.search('orderFilter', f.q, 'Xaridor yoki raqam')}</div>
			<section class="card" id="list">${Views.ordersList()}</section>`;
	},
	// To‘lov holati: sotuv qarzi yopilganmi (sotuvga bog‘langan to‘lov, keyin eng eski qarzdan)
	payState(o) {
		if (!Calc.sold(o)) return '';
		const x = Calc.aging(Data.client(o)).list.find(r => r.o.id === o.id);
		if (!x) return UI.flag('To‘langan', 'grn');
		return x.over > 0 ? UI.chip(`${x.over} kun o‘tdi`, 'red') : UI.flag(`muddati ${F.date(Calc.due(o))}`, 'mute');
	},
	ordersList() {
		const f = ui.orderFilter, fn = (ORDER_FILTERS.find(x => x[0] === f.st) || ORDER_FILTERS[0])[2], q = F.q(f.q);
		const rows = db.orders.filter(o => fn(o) && (!q || String(o.id).includes(q) || F.q(Data.client(o).nom).includes(q))).sort((a, b) => b.id - a.id);
		const shown = rows.slice(0, ui.orderLimit);
		const cols = [
			['Xaridor', 'c-main', o => `${UI.esc(Data.client(o).nom)}<span class="sub">${F.oid(o)}</span>`],
			['Summa', 'c-aside num', o => F.num(Calc.oSum(o))],
			['Mahsulot', 'c-sub', o => `${Data.prod(o.prod).qisqa} · ${F.kg(o.kg)}${UI.mobile() ? '' : `<span class="sub">${Calc.parts(o).map(q => q.lot).join(' + ')}</span>`}`],
			['Sana', 'm-hide nowrap', o => F.day(o.sana)],
			['Holat', 'c-foot', o => `<span class="m-only">${F.day(o.sana)} · </span>${Calc.sold(o) ? Views.payState(o) : UI.sd(o)}`]
		];
		return UI.table(cols, shown, { open: o => ['openOrder', o.id], empty: 'Bu bo‘limda sotuv yo‘q', icon: 'list' })
			+ (rows.length > shown.length ? `<div class="more-row"><button class="link sm" data-act="moreOrders">Yana ${Math.min(40, rows.length - shown.length)} ta (jami ${rows.length})</button></div>` : '');
	},

	orderCard(id) {
		const o = Data.order(id);
		if (!o) return Views.drawerHead('Sotuv topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'list')}</div>`;
		const c = Data.client(o), p = Data.lot(o.lot), pr = Data.prod(o.prod), m = Calc.margin(o.narx, o.tan);
		const hist = db.events.filter(e => e.oid === o.id).slice().reverse();
		// Bekor qilish — faqat bugungi sotuv
		const cancel = Calc.sold(o) && o.sana === Time.today ? `<button class="btn ghost dng" data-act="cancelOrder" data-id="${o.id}">Bekor qilish</button>` : '';
		return Views.drawerHead(`${F.oid(o)} ${UI.status(o)}`, `${pr.qisqa}, ${F.kg(o.kg)} · ${F.day(o.sana)}`)
			+ `<div class="dbody">
				${UI.dl([
					['Xaridor', `<button class="link" data-act="openClient" data-id="${c.id}">${UI.esc(c.nom)}</button>`],
					Views.tel(c.tel),
					['Mahsulot', pr.nom],
					['Partiya', o.qism ? o.qism.map(q => `<button class="link" data-act="openLot" data-id="${q.lot}">${q.lot}</button> · ${F.kg(q.kg)}`).join('<br>') : `<button class="link" data-act="openLot" data-id="${p.id}">${p.id}</button> · ${Calc.holat(p).toLowerCase()}`],
					['Kg', F.kg(o.kg)],
					['Narx', `${F.num(o.narx)} so‘m/kg <span class="muted">· ro‘yxat ${F.num(pr.narx)}</span>`],
					['Summa', `<b>${F.som(Calc.oSum(o))}</b>`],
					['Tannarx', `${F.num(o.tan)} so‘m/kg${o.qism ? ' (o‘rtacha)' : ''} · marja <span class="${m < 0.05 ? 'red-t' : ''}">${F.pct(m, 1)}</span>`],
					['To‘lov', o.tol === 'hozir' ? 'Sotuvda to‘landi' : `Qarzga · ${termText(o.shart)}${Calc.sold(o) ? ` · ${Views.payState(o)}` : ''}`],
					['Sana', F.dateLong(o.sana)],
					o.izoh && ['Izoh', UI.esc(o.izoh)]
				])}
				${hist.length ? `<div class="dsec"><h3>Tarix</h3><ul class="hist">${hist.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}</span></li>`).join('')}</ul></div>` : ''}
			</div>${cancel ? `<div class="dfoot">${cancel}</div>` : ''}`;
	},

	/* --- Yangi sotuv (o‘ng panel) --- */
	noCap: f => f.lot ? Calc.taqsim(f.prod, 0).cap : 0,
	noOrderSum: f => Calc.r1000((+f.kg || 0) * (+f.narx || 0)),
	// Bitta forma: xaridor, tovar (partiya FEFO bo‘yicha avtomatik), kg, narx (narx ro‘yxatidan), To‘landi
	neworderCard() {
		const f = ui.f.no;
		if (!f) return '';
		return Views.drawerHead('Yangi sotuv')
			+ `<form class="dbody nof" data-form="newOrder" autocomplete="off">
				${UI.field('Xaridor', `<div id="no-hit">${Views.noHit()}</div>`, { key: 'no.cid' })}
				<div class="fld"><span>Tovar</span>${UI.seg('pickProd', f.prod, db.prods.map(p => [p.k, p.qisqa]), 'full3 wrap')}</div>
				<div class="fld"><span>Partiya (FEFO)</span><div id="no-lots">${Views.noLot()}</div><small class="ferr" data-err="no.lot"></small></div>
				<div class="grid2 duo">${UI.field('Kg', UI.unit(UI.num('no.kg', 'placeholder="0"'), 'kg'), { key: 'no.kg' })}
					${UI.field('Narx', UI.unit(UI.num('no.narx'), 'so‘m/kg'), { key: 'no.narx', hint: `Narx ro‘yxati: ${F.num(Data.prod(f.prod).narx)}` })}</div>
				<div class="fld"><span>To‘landi</span><div id="no-tol">${Views.noTol()}</div></div>
			</form><div class="dfoot" id="no-bar">${Views.noBar()}</div>`;
	},
	// Partiya FEFO bo‘yicha avtomatik tanlanadi va faqat ko‘rsatiladi
	// Kg birinchi partiyadan ko‘p bo‘lsa — keyingi partiyalar ham shu yerda ko‘rinadi (kg bo‘yicha)
	noLot() {
		const f = ui.f.no, p = f.lot && Data.lot(f.lot);
		if (!p) return '<p class="muted sm">Omborda bu tovar yo‘q</p>';
		const kg = +f.kg || 0, parts = kg > Calc.stock(p).bosh ? Calc.taqsim(f.prod, kg, f.lot).parts : [];
		if (parts.length > 1) return `<div class="hit"><span class="x"><span class="t">${parts.map(q => `<span>${q.lot} · ${F.kg(q.kg)}</span>`).join(' + ')}</span><span class="m">FEFO bo‘yicha ${parts.length} partiyadan</span></span></div>`;
		return `<div class="hit"><span class="x"><span class="t">${p.id}</span><span class="m">sotish mumkin ${F.kg(Calc.stock(p).bosh)} · ${p.yaroq ? `${Calc.daysLeft(p)} kun qoldi` : 'muddati kiritilmagan'}</span></span></div>`;
	},
	// To‘landi: Naqd / Bank — sotuv bilan birga to‘lov yoziladi; Qarzga — xaridor qarzi bo‘ladi
	noTol: () => UI.seg('setTol', ui.f.no.tol, [['naqd', 'Naqd'], ['bank', 'Bank'], ['qarz', 'Qarzga']], 'full3'),
	noHit() {
		const f = ui.f.no, c = f.cid && Data.client(f.cid);
		if (c) {
			const debt = Calc.debt(c), a = Calc.aging(c);
			return `<div class="hit"><span class="x"><span class="t">${UI.esc(c.nom)}</span>
				<span class="m">${debt ? `Qarz <b class="${a.over ? 'red-t' : ''}">${F.mln(debt)}</b>${a.over ? ` (o‘tgan ${F.mln(a.over)})` : ''}` : 'qarz yo‘q'} · chegara ${F.mln(c.limit)}</span></span>
				<button type="button" class="btn s ghost" data-act="clearClient" aria-label="Boshqa xaridor" title="Boshqa xaridor">${UI.icon('x')}<span class="m-hide">O‘zgartirish</span></button></div>`;
		}
		return `<div class="search wide">${UI.icon('search')}<input class="in" data-f="no.q" value="${UI.esc(f.q)}" placeholder="Nomi yoki mas’ul shaxs" autofocus></div><div id="no-picks">${Views.noPicks()}</div>`;
	},
	noPicks() {
		const q = F.q(ui.f.no.q), list = db.clients.filter(x => !q || F.q(x.nom).includes(q)).slice(0, q ? 6 : 4);
		return `<div class="picks">${list.map(x => `<button type="button" class="pick" data-act="pickClient" data-id="${x.id}"><span class="t">${UI.esc(x.nom)}</span><span class="m">${Calc.debt(x) ? `qarz ${F.mln(Calc.debt(x))}` : 'qarz yo‘q'} · chegara ${F.mln(x.limit)}</span></button>`).join('') || '<p class="muted sm">Topilmadi</p>'}</div>`;
	},
	noBar() {
		// Ogohlantirish faqat qarz chegarasi uchun, bitta qator, saqlashni to‘xtatmaydi
		const f = ui.f.no, over = f.cid && f.tol === 'qarz' && +f.kg > 0 ? Calc.limitOver(Data.client(f.cid), Views.noOrderSum(f)) : 0;
		return `${over > 0 ? `<div class="need-l">${UI.icon('alert')}<span>Qarz chegarasi ${F.mln(over)} ga oshadi</span></div>` : ''}
			<span class="grow tot-l">${F.som(Views.noOrderSum(f))}</span><button class="btn m-hide" data-act="closeDrawer">Bekor qilish</button><button class="btn pri" data-act="submitOrder">Saqlash</button>`;
	},

	/* --- Kontragentlar (МойСклад «Контрагенты»): xaridor, yetkazib beruvchi, investor — bitta ro‘yxat, ishorali qoldiq --- */
	parties() {
		const all = Calc.kontr(), list = KONTR_F.map(([v, t]) => [v, t, v === 'hammasi' ? all.length : all.filter(x => x.tur === v).length]);
		// Filtr tugmasi (Tovarlardagidek) 4 tanlovni ochadi; filtr tanlangan bo‘lsa — ochiq turadi
		const open = ui.kFiltOpen || ui.kFilter !== 'hammasi';
		return `<div class="mbar">${UI.search('kontrQ', ui.kontrQ, 'Qidirish')}<button class="btn ic fbtn" data-act="setKFiltOpen" aria-pressed="${open}" aria-expanded="${open}" aria-label="Filtr" title="Filtr">${UI.icon('filter')}</button></div>
			${open ? `<div class="kfil">${UI.filter('setKFilter', ui.kFilter, list, true)}</div>` : ''}
			<div id="klist">${Views.kontrList()}</div>`;
	},
	// Saralash: avval muddati o‘tganlar, keyin qoldiq (moduli) kamayishi bo‘yicha
	kontrList() {
		const q = F.q(ui.kontrQ), qd = q.replace(/\D/g, '');
		const rows = Calc.kontr().filter(x => (ui.kFilter === 'hammasi' || x.tur === ui.kFilter)
			&& (!q || F.q(x.nom).includes(q) || (qd.length >= 3 && String(x.tel || '').replace(/\D/g, '').includes(qd))))
			.sort((a, b) => (b.over > 0) - (a.over > 0) || Math.abs(b.bal) - Math.abs(a.bal));
		if (!rows.length) return UI.empty('Kontragent topilmadi', 'users');
		// 1280 da — bir qatorli jadval: nom | qoldiq | holat
		if (!UI.mobile()) return UI.table([['Nomi', 'c-main', x => UI.esc(x.nom)], ['Qoldiq', 'num', x => Views.bal(x.bal)], ['Holat', 'kst-c', Views.kontrChip]],
			rows, { open: x => [KONTR_ACT[x.tur], x.id], cls: 'kontr-t' });
		return `<div class="mlist">${rows.map(x => `<button class="mrow k" data-act="${KONTR_ACT[x.tur]}" data-id="${x.id}"><span class="x"><b class="t">${UI.esc(x.nom)}</b><span class="kl">${Views.bal(x.bal)}${Views.kontrChip(x)}</span></span></button>`).join('')}</div>`;
	},
	// Ishorali qoldiq: yashil «+» — bizga qarz, qizil «−» — biz qarzmiz, kulrang 0
	bal: (n, cls = '') => `<span class="bal ${n > 0 ? 'plus' : n < 0 ? 'minus' : 'nol'} ${cls}">${n > 0 ? '+' + NB : n < 0 ? '−' + NB : ''}${F.num(Math.abs(n))}</span>`,
	kontrChip: x => x.tur === 'yetk' ? '<span class="kst yetk">Yetkazib beruvchi</span>' : x.tur === 'inv' ? '<span class="kst inv">Investor</span>'
		: x.over > 0 ? '<span class="kst over">Muddati o‘tgan</span>' : x.yangi ? '<span class="kst yangi">Yangi</span>' : '',

	/* --- Kontragent kartasi: qoldiq, telefon, oxirgi hujjat va to‘lovlar, «To‘lov» --- */
	kcard({ nom, tur, k, note = '', dl, rows, btn }) {
		rows.sort((a, b) => (a.d < b.d) - (a.d > b.d) || b.t - a.t);
		const list = rows.length ? `<table class="calc">${rows.slice(0, 12).map(r => `<tr><td>${r.html}<span class="sub">${F.date(r.d)}</span></td><td class="${r.pay ? 'grn-t' : ''}">${r.sum}</td></tr>`).join('')}</table>` : '<p class="muted sm">Hozircha yozuv yo‘q</p>';
		return Views.drawerHead(UI.esc(nom), tur)
			+ `<div class="dbody"><div class="kbal"><span class="muted sm">Qoldiq</span>${Views.bal(k.bal, 'big')}<span class="muted sm">${k.bal > 0 ? 'bizga qarz' : k.bal < 0 ? 'biz qarzmiz' : 'qarz yo‘q'}</span></div>${note}
				${UI.dl(dl)}
				<div class="dsec"><h3>Oxirgi hujjat va to‘lovlar</h3>${list}</div>
			</div>${btn ? `<div class="dfoot">${btn}</div>` : ''}`;
	},
	kontrYoq: () => Views.drawerHead('Kontragent topilmadi') + `<div class="dbody">${UI.empty('Namuna qayta yaratilgan', 'users')}</div>`,
	kontrOf: (tur, id) => Calc.kontr().find(x => x.tur === tur && x.id === id),
	tel: tel => ['Telefon', tel ? `<span class="telrow">${UI.esc(tel)}${UI.call(tel)}</span>` : '—'],
	clientCard(id) {
		const c = Data.client(id), k = Views.kontrOf('xaridor', id);
		if (!k) return Views.kontrYoq();
		return Views.kcard({ nom: c.nom, tur: 'Xaridor', k,
			note: k.over > 0 ? `<p class="kover">Muddati o‘tgan: <b>${F.som(k.over)}</b></p>` : '',
			dl: [Views.tel(c.tel)],
			rows: [
				...Calc.sales(c).map(o => ({ d: o.sana, t: o.t || 0, html: `<button class="link" data-act="openOrder" data-id="${o.id}">${F.oid(o)}</button> · ${Data.prod(o.prod).qisqa} ${F.kg(o.kg)}`, sum: F.num(Calc.oSum(o)) })),
				...Calc.pays(c).map(p => ({ d: Time.dayOf(p.t), t: p.t, html: `To‘lov · ${USUL[p.usul]}`, sum: F.num(p.sum), pay: true }))
			],
			btn: `<button class="btn pri" data-act="openPayment" data-id="${c.id}">${UI.icon('coin')}To‘lov</button>` });
	},
	supCard(id) {
		const s = Data.sup(id), k = Views.kontrOf('yetk', id);
		if (!k) return Views.kontrYoq();
		const lots = db.lots.filter(p => p.sup === s.id);
		// Qoldiq so‘mda (partiya kursida), qatorlar — partiya valyutasida; ostida valyutadagi qoldiq
		const qv = Calc.supQol(s.id);
		return Views.kcard({ nom: s.nom, tur: ['Yetkazib beruvchi', s.mam].filter(Boolean).join(' · '), k,
			note: qv.length ? `<p class="muted sm kval">Valyutada (partiya kursida): <b>${qv.map(([v, n]) => F.val(n, v)).join(' + ')}</b></p>` : '',
			dl: [Views.tel(s.tel)],
			rows: [
				...lots.map(p => ({ d: p.st[0].fact, t: Number.MAX_SAFE_INTEGER, html: `<button class="link" data-act="openLot" data-id="${p.id}">${p.id}</button> · ${Data.prod(p.prod).qisqa} ${F.kg(p.kgInv)}`, sum: F.val(Calc.buy(p), p.val) })),
				...lots.flatMap(p => p.tolov.map(x => ({ d: Time.dayOf(x.t), t: x.t, html: `To‘lov · ${p.id}`, sum: F.val(x.sum, p.val), pay: true })))
			],
			btn: lots.some(p => Calc.supDebt(p) > 0) ? `<button class="btn pri" data-act="openChiqim" data-v="yetk" data-sup="${s.id}">${UI.icon('coin')}To‘lov</button>` : '' });
	},
	invCard(id) {
		const i = Data.inv(id), k = Views.kontrOf('inv', id);
		if (!k) return Views.kontrYoq();
		return Views.kcard({ nom: i.nom, tur: 'Investor', k,
			dl: [Views.tel(i.tel), ['Kiritgan', F.som(i.kap0)], ['Oylik to‘lov', F.som(Calc.tarix(i.tarix, Calc.joriyOy()))]],
			rows: db.kassa.filter(x => !x.bekor && x.tur === 'inv' && x.inv === i.id).map(x => ({ d: Time.dayOf(x.t), t: x.t, html: `To‘lov · ${USUL[x.hisob]}`, sum: F.num(x.sum), pay: true })),
			btn: `<button class="btn pri" data-act="openChiqim" data-v="inv" data-inv="${i.id}">${UI.icon('coin')}To‘lov</button>` });
	}
});

/* ===== Views: Sozlamalar, oynalar (manba: c4.js) ===== */

Object.assign(Views, {
	/* --- Sozlamalar --- */
	settings() { return `<div id="set-body">${Views.settingsBody()}</div>`; },
	// Faqat: til, Oylik va Ijara oylik summasi, investorlar, «Namunani boshidan boshlash» (KELISHUV_v3 §16.3)
	settingsBody() {
		const oy = Calc.joriyOy();
		const doim = db.doimiy.map(d => UI.field(UI.esc(d.nom), UI.unit(`<input class="in" data-set="doim.${d.id}" value="${F.num(Calc.tarix(d.tarix, oy))}" inputmode="numeric" autocomplete="off">`, 'so‘m'))).join('');
		const kv = (l, v) => `<span class="kl"><span class="muted">${l}</span><b>${Views.som(v)}</b></span>`;
		const invs = `<div class="mlist">${db.invs.map(i => `<button class="mrow k" data-act="openInvEdit" data-id="${i.id}"><span class="x"><b class="t">${UI.esc(i.nom)}</b>${kv('Kiritgan', i.kap0)}${kv('Oylik to‘lov', Calc.tarix(i.tarix, oy))}</span></button>`).join('')}</div>`;
		return `<div class="setw stack">
			${UI.card('Til', `<div class="cb">${Til.tugma()}</div>`)}
			${UI.card('Oylik va ijara', `<div class="cb"><div class="grid2">${doim}</div><p class="rule mt8">Har oy shu summa o‘z oyiga xarajat bo‘lib yoziladi. O‘zgarish shu oydan kuchga kiradi, o‘tgan oylar o‘zgarmaydi.</p></div>`)}
			${UI.card('Investorlar', `<div class="cb">${invs}<button class="btn mt8" data-act="openInvEdit">${UI.icon('plus')}Investor qo‘shish</button></div>`)}
			${UI.card('Namuna', `<div class="cb"><p class="note">Barcha o‘zgarishlar o‘chadi, namuna bugungi 11:42 holatiga qaytadi.</p><button class="btn mt8" data-act="resetData">${UI.icon('refresh')}Namunani boshidan boshlash</button></div>`)}
		</div>`;
	},

	/* --- Oynalar (forma ichi) --- */
	// Xaridordan to‘lov (Kirim). Kartadan ochilsa xaridor qotgan, To‘lovlar ro‘yxatidan — tanlanadi.
	payForm() {
		const f = ui.f.pay, c = f.cid && Data.client(f.cid), a = c && Calc.aging(c);
		const pick = f.pick ? UI.field('Xaridor', UI.select('pay.cid', [['', 'Tanlang'], ...db.clients.slice().sort((x, y) => Calc.debt(y) - Calc.debt(x)).map(x => [x.id, Calc.debt(x) ? `${x.nom} · qarz ${F.mln(Calc.debt(x))}` : x.nom])]), { key: 'pay.cid' }) : '';
		return `${pick}${c ? `<p class="note"><b>${UI.esc(c.nom)}</b> · qarz ${F.som(Calc.debt(c))}${a.over ? `, shundan muddati o‘tgan <span class="red-t">${F.som(a.over)}</span>` : ''}</p>` : ''}
			${UI.field('Summa', UI.unit(UI.num('pay.sum', 'autofocus'), 'so‘m'), { key: 'pay.sum' })}
			<div id="pay-av">${Views.payAvans()}</div>
			${UI.field('Usul', UI.select('pay.usul', Object.entries(USUL)))}${UI.rule('To‘lov eng eski qarzdan boshlab yopiladi. Ortig‘i avans bo‘lib keyingi yetkazishga o‘tadi.')}`;
	},
	payAvans() { const f = ui.f.pay; if (!f.cid) return ''; const x = (+f.sum || 0) - Calc.debt(Data.client(f.cid)); return x > 0 ? `<div class="vrd amb">${UI.icon('alert')}<span>Qarzdan ${F.mln(x)} ortiq — <b>avans</b> sifatida yoziladi</span></div>` : ''; },
	// Omborga qabul: bitta maydon — tarozi kg. Shu payt tannarx qotadi.
	qabForm() {
		const f = ui.f.qab, p = Data.lot(f.id);
		return `<p class="note"><b>${p.id}</b> · ${Data.prod(p.prod).nom} · invoys ${F.kg(p.kgInv)}</p>
			${UI.field('Tarozi kg', UI.unit(UI.num('qab.kg', 'autofocus'), 'kg'), { key: 'qab.kg' })}
			${(b => b && b.sum ? UI.rule(`Boj ${F.som(b.sum)} — ${USUL[p.hisob || 'bank']} hisobidan chiqadi`) : '')(Calc.cost(p).rows.find(r => r.k === 'boj'))}`;
	},
	costForm() {
		const f = ui.f.cost, p = Data.lot(f.id);
		return `${p.qot ? '<div class="note warn">Partiya omborda — bu «qo‘shimcha xarajat» bo‘lib qo‘shiladi va 1 kg tannarxni oshiradi. Oldingi sotuvlar o‘z sotuv paytidagi tannarxi bilan qoladi.</div>' : ''}
			${UI.field('Xarajat turi', UI.select('cost.k', Object.entries(XARAJAT).filter(([k]) => k !== 'yol' || !p.qot)))}
			${UI.field('Summa', UI.unit(UI.num('cost.sum', 'autofocus'), 'so‘m'), { key: 'cost.sum', hint: `$ bo‘lsa: summa × ${F.num(db.set.kurs.USD)}` })}${UI.field('Hisob', UI.select('cost.hisob', Object.entries(USUL)))}${UI.field('Izoh', UI.input('cost.izoh'))}`;
	},
	// Yangi xarid (partiya): yetkazib beruvchi, tovar, kg, narx (valyuta va kurs), yo‘l xarajati
	lotForm() {
		const f = ui.f.lot, v = VAL[f.val];
		return `${UI.field('Yetkazib beruvchi', UI.select('lot.sup', db.sups.map(x => [x.id, [x.nom, x.mam].filter(Boolean).join(' · ')])))}
			${UI.field('Tovar', UI.select('lot.prod', db.prods.map(x => [x.k, x.nom])))}
			<div class="grid2 duo">${UI.field('Kg', UI.unit(UI.num('lot.kg', 'placeholder="0"'), 'kg'), { key: 'lot.kg' })}${UI.field('Valyuta', UI.select('lot.val', Object.keys(VAL).map(k => [k, k])))}</div>
			<div class="grid2 duo">${UI.field(`Narx, ${v}/kg`, UI.num('lot.narx', 'placeholder="0,00"'), { key: 'lot.narx' })}${UI.field(`Kurs, 1 ${v}`, UI.unit(UI.num('lot.kurs'), 'so‘m'), { key: 'lot.kurs' })}</div>
			<div class="grid2 duo">${UI.field('Yo‘l xarajati', UI.unit(UI.num('lot.yol', 'placeholder="0"'), 'so‘m'), { key: 'lot.yol', hint: 'Ixtiyoriy' })}${UI.field('Hisob', UI.select('lot.hisob', Object.entries(USUL)), { hint: 'Yo‘l va boj shu hisobdan' })}</div>
			${UI.field('Yaroqli (gacha)', UI.input('lot.yaroq', `type="date" min="${Time.add(1)}"`), { key: 'lot.yaroq', hint: 'Ixtiyoriy' })}
			${UI.rule(`Partiya bugungi sana bilan yoziladi, kursi qotadi. Boj ${Calc.bojOf(f.sup, f.prod)} % tannarxga o‘zi qo‘shiladi. Boshqa xarajatlar — partiya kartasida «Xarajat».`)}`;
	},
	// Yangi tovar: nom va 1 kg narx (barcha xaridorlar uchun bir xil, keyin sotuvda o‘zgartirsa bo‘ladi). f.k — mavjud tovar narxini o‘zgartirish
	tovarForm() {
		const f = ui.f.tv;
		return `${f.k ? `<p class="note"><b>${UI.esc(f.nom)}</b></p>` : UI.field('Nomi', UI.input('tv.nom', 'autofocus autocomplete="off"'), { key: 'tv.nom' })}
			${UI.field('Narx, 1 kg', UI.unit(UI.num('tv.narx', `data-fmt placeholder="0"${f.k ? ' autofocus' : ''}`), 'so‘m'), { key: 'tv.narx' })}`;
	},
	// Investor (Sozlamalar): ism, kiritgan summa, qat’iy oylik to‘lov — har oy foydadan ayriladi
	invForm() {
		return `${UI.field('Ism', UI.input('iv.nom', 'autocomplete="off"'), { key: 'iv.nom' })}
			${UI.field('Kiritgan summa', UI.unit(UI.num('iv.kap', 'data-fmt placeholder="0"'), 'so‘m'), { key: 'iv.kap' })}
			${UI.field('Oylik to‘lov', UI.unit(UI.num('iv.oyiga', 'data-fmt placeholder="0"'), 'so‘m'), { key: 'iv.oyiga', hint: 'Har oy foydadan ayriladi. O‘zgarish shu oydan kuchga kiradi.' })}`;

	// Yangi kontragent: turi, nomi, telefon. Investor — Sozlamalarda (oylik to‘lov summasi bilan)
	kontrForm() {
		const f = ui.f.kt;
		return `<div class="fld"><span>Turi</span>${UI.seg('setKtTur', f.tur, [['xaridor', 'Xaridor'], ['yetk', 'Yetkazib beruvchi']], 'full')}<small>Investor — Sozlamalarda qo‘shiladi</small></div>

			${UI.field('Telefon', UI.input('kt.tel', `type="tel" inputmode="tel" autocomplete="off"${f.tur === 'xaridor' ? ' placeholder="+998 90 000 00 00"' : ''}`), { key: 'kt.tel', hint: 'Ixtiyoriy' })}`;

/* ===== Views: Hujjatlar › To‘lovlar — pul kirim/chiqim ro‘yxati, «Chiqim» oynasi (manba: c5.js) =====
	 Qatorlar Calc.kassa() dan: xaridor to‘lovlari (kirim), yetkazib beruvchiga, partiya xarajati, xarajat, investorga (chiqim). */

const TOL_FILTERS = [
	['hammasi', 'Hammasi', () => true],
	['kirim', 'Kirim', r => r.kirim > 0],
	['chiqim', 'Chiqim', r => r.chiqim > 0]
];
// Chiqim turlari (oyna tepasidagi tanlov)
const CH_TUR = { yetk: 'Yetkazib beruvchiga', xarajat: 'Xarajat', inv: 'Investorga' };

Object.assign(Views, {
	tolovlar() {
		const rows = Calc.kassa(), list = TOL_FILTERS.map(([k, t, fn]) => [k, t, rows.filter(fn).length]);
		return `<div class="toolbar">${UI.filter('setTolF', ui.tolF, list, true)}<span class="grow"></span>${UI.search('tolQ', ui.tolQ, 'Kim yoki izoh')}
				<span class="tl-acts"><button class="btn" data-act="openKirim">${UI.icon('plus')}Kirim</button><button class="btn" data-act="openChiqim">${UI.icon('plus')}Chiqim</button></span></div>
			<section class="card" id="tlist">${Views.tolovList()}</section>`;
	},
	tolovList() {
		const fn = (TOL_FILTERS.find(x => x[0] === ui.tolF) || TOL_FILTERS[0])[2], q = F.q(ui.tolQ);
		const rows = Calc.kassa().filter(r => fn(r) && (!q || [r.nom, r.izoh, KTUR[r.tur]].some(s => F.q(s).includes(q)))).reverse();
		const shown = rows.slice(0, ui.tolLimit);
		const sum = r => r.kirim ? `<span class="grn-t">+${F.num(r.kirim)}</span>` : `<span class="red-t">−${F.num(r.chiqim)}</span>`;
		const cols = [
			['Sana', 'm-hide nowrap', r => F.when(r.t)],
			['Kim', 'c-main', r => `${UI.esc(r.nom)}${r.tur === 'partiya' ? `<span class="sub">${r.ref.lot}</span>` : ''}${r.izoh ? `<span class="sub">${UI.esc(r.izoh)}</span>` : ''}`],
			['Summa', 'c-aside num', sum],
			['Turi', 'c-sub', r => `${KTUR[r.tur]} · ${USUL[r.hisob]}<span class="m-only"> · ${F.when(r.t)}</span>`]
		];
		return UI.table(cols, shown, { open: r => r.ref.cid ? ['openClient', r.ref.cid] : r.ref.lot ? ['openLot', r.ref.lot] : null, empty: 'To‘lov topilmadi', icon: 'coin' })
			+ (rows.length > shown.length ? `<div class="more-row"><button class="link sm" data-act="moreTol">Yana ${Math.min(40, rows.length - shown.length)} ta (jami ${rows.length})</button></div>` : '');
	},

	// «+» (To‘lovlar, Pul): ikki tanlov — Kirim yoki Chiqim
	tolovTur: () => Views.glist([['', [{ act: 'openKirim', v: '', c: 'pul', ic: 'plus', t: 'Kirim — xaridordan to‘lov' }, { act: 'openChiqim', v: '', c: 'pul', ic: 'minus', t: 'Chiqim — yetkazib beruvchi, xarajat, investor' }]]]),

	/* --- «Chiqim» oynasi: yetkazib beruvchiga, xarajat (Oylik, Ijara, Boshqa), investorga --- */
	chForm() {
		const f = ui.f.ch;
		return `${f.fix ? '' : `<div class="fld"><span>Kimga</span>${UI.seg('setChTur', f.tur, Object.entries(CH_TUR), 'full3 wrap')}</div>`}<div id="ch-body">${Views.chBody()}</div>`;
	},
	// Doimiy xarajat (oylik/ijara) yoki investor uchun ochiq oy holati
	chOy(f) {
		if (f.tur === 'inv') { const i = f.inv && Data.inv(f.inv); return i && Calc.invHolat(i, Calc.ochiqOy(oy => Calc.invHolat(i, oy))); }
		// Xarajatlar ekranidagi «To‘landi» — tanlangan oy (f.oy); aks holda to‘lanmagan eng eski oy
		if (f.tur === 'xarajat' && f.kat !== 'boshqa') { const d = db.doimiy.find(x => x.kat === f.kat); return d && Calc.doimHolat(d, f.oy || Calc.ochiqOy(oy => Calc.doimHolat(d, oy))); }
		return null;
	},
	chBody() {
		const f = ui.f.ch, hisob = UI.field('Hisob', UI.select('ch.hisob', Object.entries(USUL)));
		const oyNote = h => h ? `<p class="note">${F.month(h.oy + '-01')}: <b>${F.som(h.sum)}</b> · to‘langan ${F.som(h.tol)} · qoldi <b>${F.som(Math.max(0, h.qol))}</b></p>` : '';
		if (f.tur === 'yetk') {
			const p = f.lot && Data.lot(f.lot), lots = db.lots.filter(x => Calc.supDebt(x) > 0 && (!f.sup || x.sup === f.sup));
			const pick = f.fix && !f.sup ? '' : UI.field('Partiya', UI.select('ch.lot', [['', 'Tanlang'], ...lots.map(x => [x.id, `${x.id} · ${Data.sup(x.sup).nom}`])]), { key: 'ch.lot' });
			return `${pick}${p ? `<p class="note"><b>${p.id}</b> · ${UI.esc(Data.sup(p.sup).nom)} · qoldi <b>${F.num(Calc.supDebt(p), 2)}${NB}${VAL[p.val]}</b> · partiya kursi ${F.num(p.kurs)}</p>
				${UI.field('Summa', UI.unit(UI.num('ch.sum', 'autofocus'), VAL[p.val]), { key: 'ch.sum' })}<div id="ch-som">${Views.chSom()}</div>` : ''}${hisob}`;
		}
		if (f.tur === 'inv') {
			return `${UI.field('Investor', UI.select('ch.inv', [['', 'Tanlang'], ...db.invs.map(i => [i.id, i.nom])]), { key: 'ch.inv' })}${oyNote(Views.chOy(f))}
				${UI.field('Summa', UI.unit(UI.num('ch.sum'), 'so‘m'), { key: 'ch.sum' })}${hisob}`;
		}
		return `${f.fix ? '' : `<div class="fld"><span>Toifa</span>${UI.seg('setChKat', f.kat, Object.entries(XKAT), 'full3')}</div>`}${oyNote(Views.chOy(f))}
			${UI.field('Summa', UI.unit(UI.num('ch.sum', 'autofocus'), 'so‘m'), { key: 'ch.sum' })}
			${f.kat === 'boshqa' ? UI.field('Izoh', UI.input('ch.izoh', 'placeholder="Nima uchun"'), { key: 'ch.izoh' }) : ''}${hisob}`;
	},
	// Yetkazib beruvchiga to‘lov so‘mda — partiya kursida
	chSom() {
		const f = ui.f.ch, p = f.lot && Data.lot(f.lot);
		return p && +f.sum > 0 ? `<p class="note">= ${F.som(+f.sum * p.kurs)}</p>` : '';
	}
});

/* ===== Views: Pul › Kassa, Xarajatlar, Investorlar, Sof foyda (manba: c5.js) =====
	 KELISHUV_v3 §16.2: faqat Naqd/Bank qoldig‘i va jurnal; Oylik, Ijara, Boshqa; investorning qat’iy oylik to‘lovi; oyma-oy sof foyda. */

Object.assign(Views, {
	// Oy tanlagich (Xarajatlar, Sof foyda): hisob oylari; tanlanmagan bo‘lsa — joriy oy
	pulOy: () => Calc.oylar().includes(ui.pulOy) ? ui.pulOy : Calc.joriyOy(),
	oySeg: oy => UI.seg('setPulOy', oy, Calc.oylar().map(m => [m, F.month(m + '-01')]), 'oyseg'),
	som: n => UI.u(F.num(n), 'so‘m'),

	/* --- Kassa: Naqd va Bank qoldig‘i + hamma kirim/chiqim jurnali (To‘lovlar ro‘yxati bilan bir xil) --- */
	kassaView() {
		const q = Calc.qoldiq(), t = (l, n, cls = '') => `<div class="${cls}"><span>${l}</span><b${n < 0 ? ' class="red-t"' : ''}>${Views.som(n)}</b>${n < 0 && cls !== 'j' ? '<small class="red-t">Minusda</small>' : ''}</div>`;
		return `<div class="pbal">${t('Naqd', q.naqd)}${t('Bank', q.bank)}${t('Jami', q.jami, 'j')}</div>${Views.tolovlar()}`;
	},

	/* --- Xarajatlar: oy bo‘yicha Oylik, Ijara (oylik doimiy summa, «To‘landi») va Boshqa (bir martalik) --- */
	xarajatView() {
		const oy = Views.pulOy(), x = Calc.xarajat(oy);
		const doim = db.doimiy.map(d => {
			const h = Calc.doimHolat(d, oy);
			const st = h.qol <= 0 ? UI.flag('To‘langan', 'grn') : h.tol > 0 ? `<span class="muted">to‘langan ${F.num(h.tol)} · qoldi ${F.num(h.qol)}</span>` : UI.flag('To‘lanmagan', 'amb');
			return `<div class="prow"><span class="x"><b class="t">${UI.esc(d.nom)}</b><span class="s">${XKAT[d.kat]} · ${st}</span></span><span class="v">${F.num(h.sum)}</span>
				${h.qol > 0 ? `<button class="btn s" data-act="openXarTol" data-v="${d.kat}" data-oy="${oy}">To‘landi</button>` : ''}</div>`;
		}).join('');
		const rows = x.rows.slice().sort((a, b) => b.t - a.t);
		const boshqa = rows.length ? rows.map(k => `<div class="prow"><span class="x"><b class="t">${UI.esc(k.izoh || XKAT.boshqa)}</b><span class="s">${F.date(k.t)} · ${USUL[k.hisob]}</span></span><span class="v">${F.num(k.sum)}</span></div>`).join('')
			: `<p class="muted sm pempty">Bu oyda boshqa xarajat yo‘q</p>`;
		return `${Views.oySeg(oy)}<p class="psum">${F.month(oy + '-01')} · jami <b>${Views.som(x.jami)}</b></p>
			<div class="pcol">${UI.card('Oylik va ijara', `<div class="prows">${doim}</div>`)}
			${UI.card('Boshqa', `<div class="prows">${boshqa}</div>`, { right: `<button class="btn s" data-act="openBoshqa">${UI.icon('plus')}Boshqa xarajat</button>` })}</div>`;
	},

	/* --- Investorlar: kiritgan summa, qat’iy oylik to‘lov, oylar bo‘yicha to‘langan/to‘lanmagan, «To‘lash» --- */
	investorView() {
		const oyl = Calc.oylar(), kr = Calc.kreditor();
		const cards = db.invs.map(i => {
			const qarz = Math.max(0, -Calc.invBal(i));
			const oylar = oyl.map(oy => [oy, Calc.invHolat(i, oy)]).filter(([, h]) => h.sum > 0)
				.map(([oy, h]) => `<span class="oyc ${h.qol > 0 ? 'no' : 'ok'}">${UI.icon(h.qol > 0 ? 'clock' : 'check')}<b>${F.month(oy + '-01')}</b><span>${h.qol > 0 ? 'to‘lanmagan' : 'to‘langan'}</span></span>`).join('');
			return `<section class="card pinv"><div class="ph"><button class="link t" data-act="openInv" data-id="${i.id}">${UI.esc(i.nom)}</button>
					${qarz > 0 ? `<button class="btn pri s" data-act="openChiqim" data-v="inv" data-inv="${i.id}">${UI.icon('coin')}To‘lash</button>` : ''}</div>
				${UI.dl([['Kiritgan', Views.som(i.kap0)], ['Oylik to‘lov', Views.som(Calc.tarix(i.tarix, Calc.joriyOy()))], ['To‘lanmagan', qarz > 0 ? `<span class="red-t">${Views.som(qarz)}</span>` : '0']])}
				<div class="oyl">${oylar}</div></section>`;
		}).join('');
		return `<p class="psum">To‘lanmagan <b>${Views.som(kr.inv)}</b></p>
			<div class="pcol">${cards || UI.empty('Investor yo‘q — Sozlamalarda qo‘shiladi', 'boss')}</div>${UI.rule('Har oy qat’iy summa foydadan ayriladi. Investor Sozlamalarda qo‘shiladi va o‘zgartiriladi.')}`;
	},

	/* --- Sof foyda: Savdo − Tannarx = Yalpi foyda; − Oylik − Ijara − Boshqa = Xarajatlardan keyin; − Investorlar = Menga qoldi.
		 Har qator bosilsa — ortidagi qatorlar (ochiq holati ui.open da) --- */
	foydaView() {
		const oy = Views.pulOy(), s = Calc.sof(oy), open = k => (ui.open || {})['sf.' + k] ? ' open' : '';
		const val = v => `<b class="v${v < 0 ? ' red-t' : ''}">${F.num(v)}</b>`;
		const line = (k, sg, label, v, body) => `<details class="lad" data-acc="sf.${k}"${open(k)}><summary><span class="sg">${sg}</span><span class="l">${label}</span>${val(v)}${UI.icon('down')}</summary>
			<div class="lad-b">${body || '<p class="muted sm">Hozircha yozuv yo‘q</p>'}</div></details>`;
		const tot = (label, v, cls = '') => `<div class="lad tot ${cls}"><span class="sg">=</span><span class="l">${label}</span>${val(v)}</div>`;
		const tbl = rows => rows.length ? `<table class="calc">${rows.join('')}</table>` : '';
		const tr = (main, sub, v) => `<tr><td>${main}${sub ? `<span class="sub">${sub}</span>` : ''}</td><td>${F.num(v)}</td></tr>`;
		const os = s.os.slice().sort((a, b) => (b.t || 0) - (a.t || 0));
		const oid = o => `<button class="link" data-act="openOrder" data-id="${o.id}">${F.oid(o)}</button> · ${UI.esc(Data.client(o.cid).nom)}`;
		const doim = kat => tbl(db.doimiy.filter(d => d.kat === kat).map(d => { const h = Calc.doimHolat(d, oy); return tr(UI.esc(d.nom), h.qol > 0 ? 'to‘lanmagan' : 'to‘langan', h.sum); }));
		const yalpi = `<details class="lad tot" data-acc="sf.yalpi"${open('yalpi')}><summary><span class="sg">=</span><span class="l">Yalpi foyda</span>${val(s.yalpi)}${UI.icon('down')}</summary>
			<div class="lad-b">${tbl(s.tovar.map(r => tr(UI.esc(r.p.nom), `${F.kg(r.kg)} · savdo ${F.num(r.savdo)} · tannarx ${F.num(r.tannarx)}`, r.yalpi))) || '<p class="muted sm">Hozircha yozuv yo‘q</p>'}</div></details>`;
		return `${Views.oySeg(oy)}${oy === Calc.joriyOy() ? '<p class="psum">Oy hali tugamagan</p>' : ''}
			<section class="card ladder">
				${line('savdo', '', 'Savdo', s.savdo, tbl(os.map(o => tr(oid(o), `${F.date(o.sana)} · ${Data.prod(o.prod).qisqa} ${F.kg(o.kg)}`, Calc.oSum(o)))))}
				${line('tannarx', '−', 'Tannarx', s.tannarx, tbl(os.map(o => tr(oid(o), Calc.parts(o).map(q => `${q.lot} · ${F.kg(q.kg)} × ${F.num(q.tan)}`).join(' + '), Calc.oTan(o)))))}
				${yalpi}
				${line('oylik', '−', 'Oylik', s.oylik, doim('oylik'))}
				${line('ijara', '−', 'Ijara', s.ijara, doim('ijara'))}
				${line('boshqa', '−', 'Boshqa xarajatlar', s.boshqa, tbl(s.brows.slice().sort((a, b) => b.t - a.t).map(k => tr(UI.esc(k.izoh || XKAT.boshqa), F.date(k.t), k.sum))))}
				${tot('Xarajatlardan keyin', s.keyin)}
				${line('inv', '−', 'Investorlar', s.inv, tbl(s.invBy.filter(r => r.sum).map(r => tr(UI.esc(r.i.nom), Calc.invHolat(r.i, oy).qol > 0 ? 'to‘lanmagan' : 'to‘langan', r.sum))))}
				${tot('Menga qoldi', s.qoldi, 'big')}
			</section>${UI.rule('Hammasi so‘mda. Sotuv sotilgan kuni hisobga olinadi; oylik, ijara va investor to‘lovi — o‘z oyiga to‘liq.')}`;
	}
});

		yanvar: 'января', fevral: 'февраля', mart: 'марта', aprel: 'апреля', iyun: 'июня', iyul: 'июля', avgust: 'августа', sentabr: 'сентября', oktabr: 'октября', noyabr: 'ноября', dekabr: 'декабря',
		yan: 'янв', fev: 'фев', mar: 'мар', apr: 'апр', may: 'мая', iyn: 'июн', iyl: 'июл', avg: 'авг', sen: 'сен', okt: 'окт', noy: 'ноя', dek: 'дек'
	},
	// o‘lchov birliklari: bitta shakl yoki [1, 2–4, 5+] shakllari
	UNIT: {
		'mln so‘m': 'млн сум', 'ming so‘m': 'тыс. сум', 'so‘m': 'сум', mln: 'млн', ming: 'тыс.', kg: 'кг', t: 'т', km: 'км',
		kun: ['день', 'дня', 'дней'], soat: ['час', 'часа', 'часов'], daqiqa: ['минута', 'минуты', 'минут'],
		hafta: ['неделя', 'недели', 'недель'], oy: ['месяц', 'месяца', 'месяцев'], yil: ['год', 'года', 'лет'], dona: 'шт.'
	},
	SEP: /( · | • | — | – | \| | → |: |; |, | \/ |\(|\))/,
	SENT: /(?<=[.!?…]) (?=[A-Z«(\d])/,

	// rus tilidagi son kelishigi: 1 партия, 2 партии, 5 партий; kasr son — ikkinchi shakl
	plural(num, forms) {
		if (/,/.test(num)) return forms[1];
		const n = parseInt(num.replace(/\D/g, ''), 10) || 0, d = n % 10, h = n % 100;
		return forms[d === 1 && h !== 11 ? 0 : d >= 2 && d <= 4 && (h < 12 || h > 14) ? 1 : 2];
	},
	// matn → kalit + qiymatlar
	key(s) {
		const vals = [];
		const k = s.replace(Til.RX, (m, day, mon, qn, unit) => {
			if (mon) { vals.push({ t: day + ' ' + Til.MON[mon], n: day }); return '{d}'; }
			// son va o‘lchov orasida uzilmaydigan bo‘sh joy: «0 т» ikki qatorga bo‘linmaydi
			if (unit) { const u = Til.UNIT[unit]; vals.push({ t: qn + ' ' + (Array.isArray(u) ? Til.plural(qn, u) : u), n: qn }); return '{q}'; }
			vals.push({ t: m, n: m }); return '{n}';
		});
		return [k, vals];
	},
	// ruscha qolip + qiymatlar: {n}/{q}/{d} — navbat bilan, {2} — tartib raqami bilan, {1|партия|партии|партий} — kelishik
	fill(tpl, vals) {
		let i = 0;
		return tpl.replace(/\{(?:([ndq*])|(\d)(?:\|([^}]*))?)\}/g, (m, seq, idx, forms) => {
			const v = seq ? vals[i++] : vals[idx - 1];
			return !v ? m : forms ? Til.plural(v.n, forms.split('|')) : v.t;
		});
	},
	// {*} li kalitlar — erkin matnli qoliplar («{*} uchun buyurtma»): bir marta regexga aylantiriladi
	qoliplar() {
		const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), rx = { '*': '.+?', n: `(?:${Til.NUM})`, q: `(?:${Til.NUM}) (?:${Til.UNITS})`, d: `\\d{1,2}-(?:${Til.MONS})` };
		return Object.keys(RU).filter(k => k.includes('{*}')).map(k => {
			const types = [];
			const body = k.split(/(\{[*ndq]\})/).map(p => /^\{[*ndq]\}$/.test(p) ? (types.push(p[1]), `(${rx[p[1]]})`) : esc(p)).join('');
			return [new RegExp('^' + body + '$'), types, RU[k]];
		});
	},
	// bir xil so‘z ikki ma’noda kelsa («Chegara» — bosqich va qarz chegarasi), kalitga joy qo‘shiladi: 'Chegara@xaridorlar'
	joy: el => el && el.closest ? (el.closest('#layer') && ui.drawer ? ui.drawer.type : el.closest('#modal') ? 'oyna' : ui.page) : '',
	look(s) {
		if (Til.ctx && typeof RU[s + '@' + Til.ctx] === 'string') return RU[s + '@' + Til.ctx];
		if (typeof RU[s] === 'string') return RU[s];
		const [k, vals] = Til.key(s);
		if (typeof RU[k] === 'string') return Til.fill(RU[k], vals);
		// faqat son/sana/o‘lchovdan iborat bo‘lak: «12-okt», «1 240 kg»
		if (vals.length && !/[A-Za-z]/.test(k.replace(/\{[ndq]\}/g, ''))) return Til.fill(k, vals);
		for (const [re, types, tpl] of Til.QOLIP) {
			const m = re.exec(s);
			if (m) return Til.fill(tpl, types.map((t, i) => t === '*' ? { t: Til.one(m[i + 1], true), n: m[i + 1] } : Til.key(m[i + 1])[1][0]));
		}
		const end = /[:.…?!]$/.exec(s);
		if (end && s.length > 1) { const r = Til.look(s.slice(0, -1)); if (r != null) return r + end[0]; }
		return null;
	},
	// bitta bo‘lak: topilmasa o‘zi qaytadi va (tarjima kerak bo‘lsa) bad ga yoziladi
	leaf(p, bad) {
		if (!/[A-Za-z]/.test(p)) return p;
		const m = /^(\s*)(.*?)(\s*)$/.exec(p), hit = Til.look(m[2]);
		if (hit != null) return m[1] + hit + m[3];
		// tarjima kerak emas: saqlanadigan nomlar, raqamli belgi (P-2406), bosh harflar (FA), JS da kesilgan matn (…)
		if (/[A-Za-z‘’ʻ]{2}/.test(m[2]) && !RU_SAQLA.has(m[2]) && !/^[A-Z]{1,3}-\d+$|^[A-Z]{2}$|…$/.test(m[2]) && !Til.ism(m[2])) bad.push(Til.key(m[2])[0]);
		return p;
	},
	// atoqli nomlar tarjima qilinmaydi: xodim (to‘liq va qisqa), xaridor, uning vakili, yetkazib beruvchi, foydalanuvchi qo‘shgan tovar
	ism: s => db.users.some(u => u.ism === s || F.short(u.ism) === s) || db.clients.some(c => c.nom === s) || db.sups.some(x => x.nom === s) || db.prods.some(p => p.nom === s) || (db.invs || []).some(i => i.nom === s),
	// matn: butun → boshidagi belgi/vaqt ajratiladi → gaplar → ajratgichlar bo‘yicha bo‘laklar
	one(core, quiet) {
		const hit = Til.look(core);
		if (hit != null) return hit;
		const pre = /^([·•—–.,;:×÷+→]\s*|\d{1,2}:\d{2} )(.+)$/.exec(core);
		if (pre) return pre[1] + Til.one(pre[2], quiet);
		const suf = /^(.+?)(\s*[·•—–→])$/.exec(core);
		if (suf) return Til.one(suf[1], quiet) + suf[2];
		const sents = core.split(Til.SENT);
		if (sents.length > 1) return sents.map(s => Til.one(s, quiet)).join(' ');
		const bad = [], out = core.split(Til.SEP).map((p, i) => i % 2 ? p : Til.leaf(p, bad)).join('');
		if (bad.length && !quiet) { const k = Til.key(core)[0]; if (!Til.miss.has(k)) Til.miss.set(k, bad.length === 1 && bad[0] === k ? '' : bad.join(' | ')); }
		return out;
	},
	tr(s) {
		if (Til.lang !== 'ru' || !s || !/[A-Za-z]/.test(s)) return s;
		const m = /^([ \t\r\n]*)([\s\S]*?)([ \t\r\n]*)$/.exec(s), core = m[2].replace(/[ \t\r\n]+/g, ' ');
		const out = Til.one(core);
		return out === core ? s : m[1] + out + m[3];
	},

	skip: el => !el || el.nodeName === 'SCRIPT' || el.nodeName === 'STYLE' || !!(el.closest && el.closest('[data-notr]')),
	text(n) {
		if (Til.skip(n.parentNode)) return;
		const e = Til.seen.get(n), cur = n.data;
		if (e && e.out === cur) return;
		Til.ctx = Til.joy(n.parentNode);
		const out = Til.tr(cur);
		Til.seen.set(n, { src: cur, out });
		if (out !== cur) n.data = out;
	},
	attr(el, a) {
		const cur = el.getAttribute(a);
		if (cur == null || Til.skip(el)) return;
		const map = Til.seenA.get(el) || {}, e = map[a];
		if (e && e.out === cur) return;
		Til.ctx = Til.joy(el);
		const out = Til.tr(cur);
		map[a] = { src: cur, out }; Til.seenA.set(el, map);
		if (out !== cur) el.setAttribute(a, out);
	},
	each(root, fText, fEl) {
		if (root.nodeType === 3) return fText(root);
		if (root.nodeType !== 1) return;
		fEl(root);
		const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
		for (let n = w.nextNode(); n; n = w.nextNode()) (n.nodeType === 3 ? fText : fEl)(n);
	},
	// o‘zbekcha → ruscha (lang = ru bo‘lganda)
	apply(root) {
		if (Til.lang !== 'ru') return;
		Til.each(root, Til.text, el => Til.ATTRS.forEach(a => el.hasAttribute(a) && Til.attr(el, a)));
	},
	// ruscha → asl o‘zbekcha (til o‘zbekchaga qaytarilganda)
	back(root) {
		Til.each(root, n => { const e = Til.seen.get(n); if (e) { if (n.data === e.out) n.data = e.src; Til.seen.delete(n); } }, el => {
			const map = Til.seenA.get(el);
			if (map) { Object.keys(map).forEach(a => { if (el.getAttribute(a) === map[a].out) el.setAttribute(a, map[a].src); }); Til.seenA.delete(el); }
		});
	},
	set(l) {
		if (l !== 'ru' && l !== 'uz' || l === Til.lang) return;
		Til.lang = l;
		try { localStorage.setItem(Til.KEY, l); } catch (e) { /* saqlab bo‘lmasa — shu seans uchun */ }
		document.documentElement.lang = l;
		if (l === 'uz') Til.back(document.body);
		Views.render();
		Til.apply(document.body);
	},
	// til tugmasi: kirish oynasida va profil menyusida
	tugma: () => `<div class="seg til" role="group" aria-label="Til / Язык" data-notr>${[['uz', 'O‘zbekcha'], ['ru', 'Русский']].map(([l, t]) =>
		`<button type="button" data-til="${l}" aria-pressed="${Til.lang === l}" lang="${l}">${t}</button>`).join('')}</div>`,
	start() {
		const q = new URLSearchParams(location.search);
		let saved = null;
		try { saved = localStorage.getItem(Til.KEY); } catch (e) { /* yopiq saqlagich */ }
		const l = q.get('til') || (q.has('sinov') ? 'uz' : saved);
		Til.lang = l === 'ru' ? 'ru' : 'uz';
		document.documentElement.lang = Til.lang;
		Til.NUM = '\\d{1,3}(?: \\d{3})+(?:,\\d+)?|\\d+(?:,\\d+)?';
		Til.MONS = Object.keys(Til.MON).join('|');
		Til.UNITS = Object.keys(Til.UNIT).join('|') + ')(?![A-Za-z‘’ʻ]';
		Til.RX = new RegExp(`\\b(\\d{1,2})-(${Til.MONS})\\b|(${Til.NUM}) (${Til.UNITS})|(?:${Til.NUM})`, 'g');
		Til.QOLIP = Til.qoliplar();
		new MutationObserver(list => {
			if (Til.lang !== 'ru') return;
			list.forEach(m => {
				if (m.type === 'childList') m.addedNodes.forEach(Til.apply);
				else if (m.type === 'characterData') Til.text(m.target);
				else Til.attr(m.target, m.attributeName);
			});
		}).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: Til.ATTRS });
		document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-til]'); if (b) Til.set(b.dataset.til); });
		Til.apply(document.body);
	}
};
Til.start();

/* ===== Steps — amallar ichida qayta ishlatiladigan qadamlar (manba: d.js) ===== */
const Steps = {
	drawer(type, id) {
		if (ui.menu) { ui.menu = false; Views.render(); }
		ui.drawer = { type, id, enter: true };
		UI.refresh('layer');
		ui.drawer.enter = false;
		Router.sync();
	},
	// Ichki ro‘yxat (Hujjatlar/Pul): ochilganda tarixga yoziladi — telefondagi «Orqaga» bo‘lim ro‘yxatiga qaytaradi
	sub(page, key, map, v) {
		Object.assign(ui, { page, [key]: map[v] ? v : '', drawer: null, menu: false });
		if (ui[key]) history.pushState({ sub: 1 }, '', Router.hash()); else history.replaceState(null, '', Router.hash());
		Views.render(); window.scrollTo(0, 0);
	},
	newOrder(cid) {
		// Narx — tovarning bitta narxi (narx ro‘yxati), hamma xaridor uchun bir xil; sotuvda o‘zgartirsa bo‘ladi
		ui.f.no = { cid: '', q: '', prod: 'mmo_pl', kg: '', lot: '', narx: String(Data.prod('mmo_pl').narx), kun: String(db.set.kun), tol: 'qarz' };
		if (cid) Steps.setClient(cid);
		Steps.defaultLot();
		return ui.f.no;
	},
	setClient(cid) {
		const f = ui.f.no, c = Data.client(cid);
		Object.assign(f, { cid, q: '', kun: String(c.kun), tol: c.kun ? 'qarz' : 'naqd' });
	},
	defaultLot() { ui.f.no.lot = (Calc.fefo(ui.f.no.prod).sell[0] || {}).id || ''; },
	// Xaridor to‘lovi: standart summa — muddati o‘tgan qarz, bo‘lmasa butun qarz
	payClient(cid) {
		const f = ui.f.pay, c = cid && Data.client(cid);
		Object.assign(f, { cid: c ? c.id : '', sum: c ? String(Calc.aging(c).over || Calc.debt(c) || '') : '' });
	},
	// Chiqim: standart summa — yetkazib beruvchi qoldig‘i yoki ochiq oy qoldig‘i
	chSum() {
		const f = ui.f.ch, p = f.tur === 'yetk' && f.lot && Data.lot(f.lot), h = Views.chOy(f);
		f.sum = p ? String(Calc.supDebt(p)) : h && h.qol > 0 ? String(h.qol) : '';
	},
	// Oylik summa tarixi: joriy oydan yangi summa (shu oy yozuvi bo‘lsa — almashtiriladi)
	oySum(tarix, sum) {
		const oy = Calc.joriyOy(), x = tarix.find(r => r.dan === oy);
		if (x) x.sum = sum; else tarix.push({ dan: oy, sum });
	},
	// Ikki marta bosishdan himoya
	guard() { const now = Date.now(); if (now - (Steps.last || 0) < 700) return false; Steps.last = now; return true; },
};

/* ===== Actions — foydalanuvchi amallari (manba: d.js) =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */
const Actions = {
	/* navigatsiya */
	go(d) { Actions.goTo({ p: d.p }); },
	// Hamma o‘tishlar shu yerdan: bo‘lim, ichki ro‘yxat (doc/pul), filtrlar (kf — kontragent, of — sotuv holati)
	goTo(d) {
		UI.closeModal();
		Object.assign(ui, { page: d.p, doc: DOC_TUR[d.doc] ? d.doc : '', pul: PUL_TUR[d.pul] ? d.pul : '', menu: false, drawer: null });
		if (d.kf) ui.kFilter = d.kf;
		if (d.of) ui.orderFilter = { st: d.of, q: '' };
		Views.render(); window.scrollTo(0, 0);
	},
	setDoc(d) { Steps.sub('hujjatlar', 'doc', DOC_TUR, d.v); },
	setPul(d) { Steps.sub('pul', 'pul', PUL_TUR, d.v); },
	backSub() {
		if (history.state && history.state.sub) history.back();
		else if (ui.page === 'pul') Actions.setPul({ v: '' }); else Actions.setDoc({ v: '' });
	},
	setKFilter(d) { ui.kFilter = d.v; Views.render(); },
	// Filtr tugmasi: ochadi; ochiq bo‘lsa — yopadi va filtrni «Hammasi» ga qaytaradi
	setKFiltOpen() { const open = ui.kFiltOpen || ui.kFilter !== 'hammasi'; Object.assign(ui, { kFiltOpen: !open, kFilter: 'hammasi' }); Views.render(); },
	// Ko‘rsatkichlar: davr faqat SAVDO sahifasini yangilaydi; karta boshqa sahifada bo‘lsa — SAVDO ga suriladi
	setKDavr(d) {
		ui.kDavr = d.v; UI.refresh('k-savdo', 'k-seg');

	},
	kkPg(d) { const t = $('#kk-track'); if (t) t.scrollTo({ left: +d.v * t.clientWidth, behavior: 'smooth' }); },
	soldGoods() { UI.modal('Sotilgan tovarlar', Views.soldGoods(), '', true); },
	setPulOy(d) { ui.pulOy = d.v; Views.render(); },
	toggleMenu() { ui.menu = !ui.menu; Views.render(); },
	reloadApp() { location.reload(); },
	closeModal() { UI.closeModal(); },
	confirmOk() { const fn = UI.onConfirm; UI.onConfirm = null; UI.closeModal(); if (fn) fn(); },
	resetDemo() {
		UI.confirm('Namuna boshlang‘ich holatga qaytadi (bugun 11:42), barcha o‘zgarishlar o‘chadi.', 'Boshidan boshlash', () => { Data.seed(); Object.assign(ui, { f: {}, drawer: null, page: 'korsatkich', doc: '', pul: '', menu: false }); Views.render(); UI.toast('Namuna boshidan boshlandi'); });
	},
	resetData() { Actions.resetDemo(); },

	/* ro‘yxat va kartalar */
	openLot(d) { Steps.drawer('lot', d.id); },
	openOrder(d) { Steps.drawer('order', +d.id); },
	openClient(d) { Steps.drawer('client', d.id); },
	closeDrawer() { ui.drawer = null; UI.refresh('layer'); Router.sync(); },
	setLotFilter(d) { ui.lotFilter = d.v; Data.savePrefs(); Views.render(); },
	setOrderFilter(d) { ui.orderFilter = { st: d.v, q: ui.orderFilter.q }; ui.orderLimit = 40; Data.savePrefs(); Views.render(); },
	moreOrders() { ui.orderLimit += 40; UI.refresh('list'); },
	openSup(d) { Steps.drawer('sup', d.id); },
	openInv(d) { Steps.drawer('inv', d.id); },
	openProd(d) { Steps.drawer('prod', d.id); },
	setTovarF() { ui.tovarF = !ui.tovarF; Views.render(); },
	/* yangi tovar (nom, narx), tovar narxini o‘zgartirish va yangi kontragent (turi, nom, telefon) */
	openTovar() {
		ui.f.tv = { k: '', nom: '', narx: '' };
		ui.modalForm = 'tovarForm';
		UI.modal('Yangi tovar', null, UI.buttons('Saqlash', 'saveTovar'));
	},
	openNarx(d) {
		const pr = Data.prod(d.id);
		ui.f.tv = { k: pr.k, nom: pr.nom, narx: String(pr.narx) };
		ui.modalForm = 'tovarForm';
		UI.modal('Narxni o‘zgartirish', null, UI.buttons('Saqlash', 'saveTovar'));
	},
	saveTovar() {
		if (!Forms.valid('tv') || !Steps.guard()) return;
		const f = ui.f.tv, nom = f.nom.trim(), narx = Math.round(+f.narx);
		if (f.k) {
			const pr = Data.prod(f.k), was = pr.narx;
			pr.narx = narx;
			Data.log(`${pr.nom}: narx ${F.num(was)} → ${F.num(narx)}${NB}so‘m/kg`, 'tovar');
			Data.save(); UI.closeModal(); ui.f.tv = null; Views.render();
			return UI.toast('Narx saqlandi');
		}
		let n = db.prods.length + 1;
		while (Data.prod('t' + n)) n++;
		// Bitta narx (hamma xaridor uchun); boj — boshqa tovarlardagidek 10 % (MDH yetkazib beruvchisidan — 0 %)
		const pr = { k: 't' + n, nom, qisqa: nom, narx, boj: 10 };
		db.prods.push(pr);
		Data.log(`Yangi tovar: ${nom}, 1 kg ${F.num(narx)}${NB}so‘m`, 'tovar');
		Data.save(); UI.closeModal(); ui.f.tv = null; Views.render();
		UI.toast('Tovar qo‘shildi');
	},
	openKontr() {
		ui.f.kt = { tur: 'xaridor', nom: '', tel: '' };
		ui.modalForm = 'kontrForm';
		UI.modal('Yangi kontragent', null, UI.buttons('Saqlash', 'saveKontr'));
	},
	setKtTur(d) { ui.f.kt.tur = d.v; UI.refresh('mbody'); },
	saveKontr() {
		if (!Forms.valid('kt') || !Steps.guard()) return;
		const f = ui.f.kt, nom = f.nom.trim(), xar = f.tur === 'xaridor', tel = xar ? F.telUz(f.tel) : F.telDigits(f.tel) ? f.tel.trim() : '';
		const list = xar ? db.clients : db.sups, pre = xar ? 'c' : 's', n = Math.max(0, ...list.map(x => +x.id.slice(1) || 0)) + 1;
		// Xaridor: qarz chegarasi va to‘lov muddati — standart (Sozlamalar); yetkazib beruvchi: valyuta $ (partiyada o‘zgartirsa bo‘ladi)
		const x = xar ? { id: pre + n, nom, limit: db.set.limit, kun: db.set.kun, tel }
			: { id: pre + n, nom, mam: '', val: 'USD', mdh: false, tel };
		list.push(x);
		Data.log(`Yangi kontragent: ${nom} (${KONTR_TUR[f.tur].toLowerCase()})`, 'kontragent');
		Data.save(); UI.closeModal(); ui.f.kt = null;
		Object.assign(ui, { kFilter: 'hammasi', kontrQ: '' });
		Views.render();
		Steps.drawer(xar ? 'client' : 'sup', x.id);
		UI.toast('Kontragent qo‘shildi');
	},
	/* yangi sotuv: saqlanganda darhol sotilgan (Отгрузка) */
	openNewOrder(d) { Steps.newOrder(d && d.id); Steps.drawer('neworder', 1); const q = $('[data-f="no.q"]'); if (q && !UI.mobile()) q.focus(); },
	pickClient(d) { Steps.setClient(d.id); UI.refresh('layer'); },
	clearClient() { Object.assign(ui.f.no, { cid: '', q: '' }); UI.refresh('layer'); const q = $('[data-f="no.q"]'); if (q) q.focus(); },
	pickProd(d) { const f = ui.f.no; f.prod = d.v; Steps.defaultLot(); f.narx = String(Data.prod(f.prod).narx); UI.refresh('layer'); },
	setTol(d) { ui.f.no.tol = d.v; UI.refresh('no-tol', 'no-bar'); },
	submitOrder() {
		if (!Forms.valid('no') || !Steps.guard()) return;
		const f = ui.f.no, c = Data.client(f.cid), kg = +f.kg, parts = Calc.taqsim(f.prod, kg, f.lot).parts;
		// Bir partiyada yetmasa — FEFO bo‘yicha keyingilaridan (o.qism); tannarx — o‘rtacha, hisobda har bo‘lak alohida
		const o = { id: ++db.seq, cid: c.id, prod: f.prod, lot: parts[0].lot, kg, narx: +f.narx, tan: Math.round(Calc.sum(parts, q => q.kg * q.tan) / kg), sana: Time.today, holat: 'sotildi', tol: f.tol === 'qarz' ? 'qarz' : 'hozir', izoh: '',
			shart: { kun: Math.max(0, +f.kun) }, t: Time.now() };
		if (parts.length > 1) o.qism = parts;
		db.orders.push(o);
		parts.forEach(q => Data.move(q.lot, 'chiqim', q.kg, c.nom, o.id));
		Data.log(`${F.oid(o)}: ${c.nom}, ${Data.prod(o.prod).qisqa} ${F.kg(o.kg)}, ${F.som(Calc.oSum(o))}`, 'buyurtma', { oid: o.id });
		// To‘landi (naqd/bank): to‘lov shu sotuvga bog‘lanadi (oid) va avval shu sotuvni yopadi
		if (o.tol === 'hozir') {
			db.pays.push({ cid: c.id, t: Time.now(), sum: Calc.oSum(o), usul: f.tol, oid: o.id });
			Data.log(`${USUL[f.tol]} ${F.som(Calc.oSum(o))} — ${c.nom}`, 'tolov', { cid: c.id, oid: o.id });
		}
		Data.save();
		ui.f.no = null;
		Object.assign(ui, { page: 'hujjatlar', doc: 'sotuv', orderFilter: { st: 'hammasi', q: '' } });

	cancelOrder(d) {
		const o = Data.order(d.id);

		const paid = Calc.sum(db.pays.filter(x => x.oid === o.id && !x.bekor), x => x.sum);
		UI.confirm(`${F.oid(o)} bekor qilinsinmi? Tovar omborga qaytadi.${paid ? ` To‘langan ${F.som(paid)} ham bekor qilinadi.` : ''}`, 'Bekor qilish', () => {
			o.holat = 'bekor';
			db.pays.filter(x => x.oid === o.id && !x.bekor).forEach(x => { x.bekor = { t: Time.now() }; });
			Calc.parts(o).forEach(q => Data.move(q.lot, 'kirim', q.kg, 'Sotuv bekor qilindi', o.id));
