/* ===== Fields — forma maydonlari o‘zgarishi (manba: d.js) =====
	 Maydon o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) — faqat bog‘liq bo‘laklar yangilanadi. */
const Fields = {
	live: {
		no(k) {
			if (k === 'q') UI.refresh('no-picks');
			if (['kg', 'narx'].includes(k)) { UI.refresh('no-bar'); if (k === 'kg') UI.refresh('no-lots'); Forms.show('no.kg'); }
		},
		pay(k) { if (k === 'sum') UI.refresh('pay-av'); if (k === 'cid') { Steps.payClient(ui.f.pay.cid); UI.refresh('mbody'); } },
		// Yetkazib beruvchi o‘zgarsa — uning valyutasi; valyuta o‘zgarsa — standart kurs (db.set.kurs)
		lot(k) {
			const f = ui.f.lot;
			if (k === 'sup') f.val = Data.sup(f.sup).val;
			if (k === 'sup' || k === 'val') f.kurs = String(db.set.kurs[f.val]);
			if (['sup', 'prod', 'val'].includes(k)) UI.refresh('mbody');
		},
		ch(k) { if (k === 'lot' || k === 'inv') { Steps.chSum(); UI.refresh('mbody'); } if (k === 'sum') UI.refresh('ch-som'); }
	},
	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file' || t.type === 'date';
		// Sozlama maydoni — yozib bo‘lingach (change) bir marta saqlanadi va jurnalga yoziladi
		if (data.set) { if (e.type === 'change') Fields.setting(t); return; }
		if (e.type !== (discrete ? 'change' : 'input')) return;
		if (data.f) {
			const [form, k] = data.f.split('.');
			if (!ui.f[form]) return;
			ui.f[form][k] = t.type === 'checkbox' ? t.checked : 'num' in data ? t.value.replace(/\s/g, '').replace(',', '.') : t.value;
			// pul maydoni: yozilayotganda ham minglik bo‘shliq bilan (kursor oxirida bo‘lsa)
			if ('fmt' in data && t.selectionStart === t.value.length) { const n = ui.f[form][k].replace(/\D/g, ''); ui.f[form][k] = n; t.value = n ? F.num(+n) : ''; }
			Forms.show(data.f);
			if (Fields.live[form]) Fields.live[form](k);
		} else if (data.filter) {
			if (can(data.filter)) Actions[data.filter]({ v: t.value });
		} else if (data.search) {
			if (data.search === 'orderFilter') { ui.orderFilter.q = t.value; ui.orderLimit = 40; UI.refresh('list'); }
			if (data.search === 'kontrQ') { ui.kontrQ = t.value; UI.refresh('klist'); }
			if (data.search === 'tovarQ') { ui.tovarQ = t.value; UI.refresh('tvlist'); }
			if (data.search === 'lotQ') { ui.lotQ = t.value; UI.refresh('llist'); }
			if (data.search === 'tolQ') { ui.tolQ = t.value; ui.tolLimit = 40; UI.refresh('tlist'); }
		}
	},
	// Sozlamalar: Oylik va Ijara oylik summasi (data-set="doim.<id>") — joriy oydan kuchga kiradi, o‘tgan oylar o‘zgarmaydi
	setting(t) {
		const [kind, id] = t.dataset.set.split('.'), d = kind === 'doim' && Data.doim(id), v = Math.round(+t.value.replace(/\s/g, '').replace(',', '.'));
		if (!d) return;
		if (t.value.trim() === '' || !isFinite(v) || v <= 0) return t.setAttribute('aria-invalid', '');
		t.removeAttribute('aria-invalid');
		Steps.oySum(d.tarix, v);
		t.value = F.num(v);
		Data.log(`Sozlama: ${d.nom} — ${F.num(v)}${NB}so‘m (${F.month(Calc.joriyOy() + '-01').toLowerCase()} oyidan)`, 'sozlama');
		Data.save();
	}
};

/* ===== Hodisalar: bosish, yozish, klaviatura (manba: d.js) ===== */

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (Actions[name]) Actions[name](el.dataset);
});

/* ===== Router — manzil satri (manba: d.js) =====
	 #/bo‘lim[/ichki ro‘yxat][/karta/id]: #/hujjatlar/sotuv, #/pul/kassa, #/hujjatlar/sotuv/order/5071.
	 Brauzerning «orqaga» tugmasi bo‘lim, ichki ro‘yxat va kartani qaytaradi. */
const Router = {
	hash() {
		const sub = ui.page === 'hujjatlar' ? ui.doc : ui.page === 'pul' ? ui.pul : '';
		return '#/' + ui.page + (sub ? '/' + sub : '') + (ui.drawer ? `/${ui.drawer.type}/${ui.drawer.id}` : '');
	},
	sync() {
		const h = Router.hash();
		if (h !== location.hash && (h || location.hash)) history[location.hash ? 'pushState' : 'replaceState'](null, '', h || location.pathname + location.search);
	},
	read() {
		const parts = decodeURIComponent(location.hash.slice(2)).split('/'), page = parts.shift();
		if (!pageOk(page)) return false;
		const map = page === 'hujjatlar' ? DOC_TUR : page === 'pul' ? PUL_TUR : {}, sub = map[parts[0]] ? parts.shift() : '';
		const [type, id] = parts;
		Object.assign(ui, { page, doc: page === 'hujjatlar' ? sub : '', pul: page === 'pul' ? sub : '' });
		if (type === 'neworder' && !ui.f.no) Steps.newOrder();
		ui.drawer = ['lot', 'order', 'client', 'neworder', 'sup', 'inv', 'prod'].includes(type) && Views[type + 'Card'] ? { type, id: type === 'order' ? +id : id } : null;
		return true;
	}
};
window.addEventListener('popstate', () => { UI.closeModal(); ui.menu = false; if (Router.read()) Views.render(); else Router.sync(); });
// Ko‘rsatkichlar kartasi surilganda nuqtalar ergashadi (faqat ko‘rinish, holat o‘zgarmaydi)
document.addEventListener('scroll', e => {
	const t = e.target;
	if (t.id !== 'kk-track') return;
	const i = Math.round(t.scrollLeft / t.clientWidth);
	document.querySelectorAll('.kk-dots button').forEach((b, k) => k === i ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'));
}, true);
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.acc; if (k) { ui.open = ui.open || {}; ui.open[k] = e.target.open; } }, true);
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { newOrder: Actions.submitOrder }[e.target.dataset.form];
	e.preventDefault();
	if (submit) submit();
});
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	if ($('#modal').innerHTML) UI.closeModal();
	else if (ui.drawer) Actions.closeDrawer();
	else if (ui.menu) Actions.toggleMenu();
});
matchMedia('(max-width:820px)').addEventListener('change', () => Views.render());
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; Views.render(); }));

/* ===== Ishga tushirish (manba: d.js) ===== */

Data.load();
Router.read();
Views.render();

// Service worker faqat http(s) da; yangi versiya kelsa — yozilayotgan narsa bo‘lmasa bir marta o‘zi yangilanadi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
	const had = !!navigator.serviceWorker.controller;
	const typing = () => !!document.querySelector('.modal') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
	let reloaded = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (!had || reloaded) return;
		if (typing()) { UI.prompt('Yangi versiya bor', 'Yangilash', 'reloadApp'); return; }
		reloaded = true;
		location.reload();
	});
}
