<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>C.A. Wolves — тўловлар ҳисоби (намуна)</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(img/f_inter_cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(img/f_inter_latinext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(img/f_inter_latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#F3F4F6;--yuz:#fff;--pan:#11161F;--pan2:#1A212C;--m:#18202B;--m2:#5A6472;--m3:#8A93A0;--ch:#E2E5EA;--ch2:#EEF0F3;--ak:#C5202E;--akh:#A31824;--ya:#1A7F52;--og:#A8690F;--xa:#BF3644;--in:#2B6CB0;--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--m);font:400 14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.ik{width:18px;height:18px;flex:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* tuzilish */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.yon{background:var(--pan);color:#C9D0DA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:11px;padding:20px 20px 18px;border-bottom:1px solid #262E3A}
.logo .bg{width:36px;height:36px;border-radius:8px;background:var(--ak);color:#fff;display:grid;place-items:center}
.logo .bg .ik{width:22px;height:22px}
.logo b{display:block;color:#fff;font:800 15.5px/1.15 var(--f);letter-spacing:.03em}
.logo small{display:block;color:#8792A2;font-size:11.5px;margin-top:2px}
.yon nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.yon nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:7px;background:none;color:#B4BDC9;font-weight:600;font-size:14px;text-align:left}
.yon nav button:hover{background:#1D242E;color:#fff}
.yon nav button.on{background:#232C38;color:#fff;box-shadow:inset 3px 0 0 var(--ak)}
.yon nav button i{margin-left:auto;font-style:normal;font-weight:700;font-size:11.5px;color:#fff;background:var(--xa);border-radius:9px;min-width:20px;padding:1px 6px;text-align:center}
.yon .past{padding:14px 20px 18px;border-top:1px solid #262E3A;font-size:12px;color:#8792A2;line-height:1.45}
.yon .past button{border:0;background:none;color:#B4BDC9;padding:0;margin-top:6px;text-decoration:underline;font-size:12px}
.asos{min-width:0;display:flex;flex-direction:column}
.tep{display:flex;align-items:center;gap:12px;padding:12px 26px;background:var(--yuz);border-bottom:1px solid var(--ch);position:sticky;top:0;z-index:20}
.tep .nam{font-size:12px;color:var(--m2);border:1px solid var(--ch);border-radius:6px;padding:4px 9px;white-space:nowrap}
.tep .nam b{color:var(--m);letter-spacing:.06em}
.tep .bosh{flex:1}
.tep .kim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--m2);font-weight:600}
.tep .kim span{width:30px;height:30px;border-radius:50%;background:var(--ch2);display:grid;place-items:center;color:var(--m);font-weight:700;font-size:12px}
.tep .mlogo{display:none}
#ich{padding:24px 26px 70px;max-width:1280px;width:100%}

/* umumiy */
.sar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sar h1{font:800 23px/1.2 var(--f);letter-spacing:-.01em}
.sar p{color:var(--m2);font-size:13.5px;margin-top:3px}
.sar .amal{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border-radius:7px;border:1px solid var(--ch);background:var(--yuz);font-weight:600;font-size:14px;white-space:nowrap;color:var(--m)}
.btn:hover{border-color:#C5CAD2;background:#FAFBFC}
.btn.a{background:var(--pan);border-color:var(--pan);color:#fff}.btn.a:hover{background:#000;border-color:#000}
.btn.q{background:var(--pan);border-color:var(--pan);color:#fff}.btn.q:hover{background:#000}
.btn.k{min-height:32px;padding:0 11px;font-size:13px}
.btn.x{color:var(--xa)}
.btn[disabled]{opacity:.45;cursor:default}
.karta{background:var(--yuz);border:1px solid var(--ch);border-radius:8px}
.karta>.kh{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;padding:14px 18px;border-bottom:1px solid var(--ch)}
.karta>.kh h2{font:700 15px/1.3 var(--f)}
.karta>.kh span{color:var(--m2);font-size:12.5px}
.karta>.kb{padding:16px 18px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi>div{background:var(--yuz);border:1px solid var(--ch);border-radius:8px;padding:15px 17px;border-top:3px solid var(--ch)}
.kpi>div.y{border-top-color:var(--ya)}.kpi>div.o{border-top-color:var(--og)}.kpi>div.x{border-top-color:var(--xa)}.kpi>div.n{border-top-color:var(--pan)}
.kpi small{display:block;color:var(--m2);font-size:12.5px;font-weight:600}
.kpi b{display:block;font:800 23px/1.25 var(--f);margin-top:5px;letter-spacing:-.01em}
.kpi b em{font-style:normal;font-size:13px;font-weight:600;color:var(--m2)}
.kpi span{display:block;color:var(--m2);font-size:12.5px;margin-top:3px}
.ikki{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:5px;font-weight:600;font-size:12px;line-height:1.5;border:1px solid var(--ch);color:var(--m2);background:var(--yuz);white-space:nowrap}
.chip.y{border-color:#A9D8C2;color:var(--ya)}.chip.o{border-color:#E6CB95;color:var(--og)}.chip.x{border-color:#EBB3BA;color:var(--xa)}
.yol{height:7px;border-radius:4px;background:var(--ch2);overflow:hidden}
.yol i{display:block;height:100%;background:var(--ya);border-radius:4px}
.yol.o i{background:var(--og)}.yol.x i{background:var(--xa)}
.bosh0{padding:34px 18px;text-align:center;color:var(--m2)}
.filtr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,.sel{height:40px;border:1px solid var(--ch);border-radius:7px;background:var(--yuz);padding:0 12px;min-width:0;outline:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--pan);box-shadow:0 0 0 3px rgba(21,26,33,.08)}
.qid{position:relative;flex:1 1 220px;max-width:340px}
.qid .ik{position:absolute;left:11px;top:11px;color:var(--m3)}
.qid .inp{width:100%;padding-left:36px}
.tab{display:inline-flex;border:1px solid var(--ch);border-radius:7px;overflow:hidden;background:var(--yuz)}
.tab button{border:0;background:none;padding:0 13px;height:38px;font-weight:600;font-size:13.5px;color:var(--m2);border-right:1px solid var(--ch)}
.tab button:last-child{border-right:0}
.tab button.on{background:var(--pan);color:#fff}
.oyt{display:inline-flex;align-items:center;border:1px solid var(--ch);border-radius:7px;background:var(--yuz);height:40px}
.oyt button{border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--m2)}
.oyt button[disabled]{opacity:.3;cursor:default}
.oyt b{min-width:132px;text-align:center;font-weight:700;font-size:14px}
.xul{display:flex;gap:22px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--ch);font-size:13.5px;color:var(--m2)}
.xul b{color:var(--m);font-weight:700}

/* jadval */
table.j{width:100%;border-collapse:collapse}
table.j th{font-weight:600;font-size:12px;color:var(--m2);text-align:left;padding:10px 18px;border-bottom:1px solid var(--ch);background:#FAFBFC;white-space:nowrap}
table.j td{padding:11px 18px;border-bottom:1px solid var(--ch2);vertical-align:middle}
table.j tr:last-child td{border-bottom:0}
table.j .r{text-align:right}
table.j td.ism b{font-weight:600;display:block}
table.j td.ism small{color:var(--m2);font-size:12.5px}
table.j tr.bos{cursor:pointer}
table.j tr.bos:hover td{background:#FAFBFC}
table.j tr.bk td{color:var(--m3)}table.j tr.bk .sm{text-decoration:line-through}
.sur{overflow-x:auto;-webkit-overflow-scrolling:touch}
.qz{color:var(--xa);font-weight:700}
.kul{color:var(--m3)}
.hav{border:0;background:none;padding:0;color:var(--m);font-weight:600;text-align:left}
.hav:hover{text-decoration:underline}

/* jurnal (matritsa) */
table.mt{border-collapse:collapse;width:100%;min-width:640px}
table.mt th,table.mt td{border-bottom:1px solid var(--ch2);padding:8px 10px;text-align:center;font-size:13px}
table.mt th{font-weight:600;font-size:12px;color:var(--m2);background:#FAFBFC;border-bottom:1px solid var(--ch)}
table.mt th:first-child,table.mt td:first-child{text-align:left;position:sticky;left:0;background:var(--yuz);padding-left:18px;min-width:170px;z-index:1}
table.mt th:first-child{background:#FAFBFC}
table.mt td button{border:1px solid transparent;background:none;border-radius:5px;min-width:74px;height:30px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
table.mt td button:hover{border-color:var(--m3)}
table.mt .t{color:var(--ya)}table.mt .q{color:var(--og);border-color:#E6CB95}table.mt .y{color:var(--xa);border-color:#EBB3BA}table.mt .m{color:var(--in)}
table.mt .ik{width:16px;height:16px}

/* guruh kartalari */
.gk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gk button{text-align:left;background:var(--yuz);border:1px solid var(--ch);border-radius:8px;padding:16px 18px;display:block;width:100%}
.gk button:hover{border-color:var(--m3)}
.gk h3{font:700 16px/1.3 var(--f)}
.gk p{color:var(--m2);font-size:13px;margin-top:2px}
.gk .qt{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--m2)}
.gk .qt b{color:var(--m)}
.gk .yol{margin-top:7px}

/* diagramma */
.dg{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:22px}
.dg div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.dg i{display:block;width:100%;max-width:54px;background:#C9CED6;border-radius:4px 4px 0 0;min-height:3px}
.dg div.on i{background:var(--ak)}
.dg small{font-size:11.5px;color:var(--m2);font-weight:600;white-space:nowrap}
.dg span{font-size:12px;color:var(--m2)}
.us{display:grid;gap:11px}
.us div{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.us b{font-weight:600}
.mq{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ch2)}
.mq:last-child{border-bottom:0;padding-bottom:0}.mq:first-child{padding-top:0}
.mq b{display:block;font-weight:600}.mq small{color:var(--m2);font-size:12.5px}
.bug{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bug b{font:800 24px/1.2 var(--f)}.bug span{color:var(--m2);font-size:13px}

/* modal */
#mo{position:fixed;inset:0;background:rgba(15,19,25,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
#mo.on{display:flex}
.mb{background:var(--yuz);border-radius:10px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.mb.keng{max-width:720px}
.mb>.kh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ch)}
.mb>.kh h2{font:700 17px/1.3 var(--f)}
.mb>.kh button{border:0;background:none;color:var(--m2);width:34px;height:34px;display:grid;place-items:center;border-radius:6px}
.mb>.kh button:hover{background:var(--ch2)}
.mb>.kb{padding:18px 20px}
.mb>.kf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--ch);flex-wrap:wrap}
.maydon{margin-bottom:14px}
.maydon label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.maydon .inp,.maydon .sel{width:100%}
.maydon small{display:block;color:var(--m2);font-size:12.5px;margin-top:4px}
.maydon small.xa{color:var(--xa);font-weight:600}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.5;width:100%}
.qator2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{height:42px;border:1px solid var(--ch);border-radius:7px;background:var(--yuz);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--pan);border-color:var(--pan);color:#fff}
.kim-q{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FAFBFC;border:1px solid var(--ch);border-radius:8px;margin-bottom:16px}
.kim-q b{display:block;font-weight:700}
.kim-q small{color:var(--m2)}
.kim-q .qz{margin-left:auto;text-align:right;font-size:13px}
.tanla{border:1px solid var(--ch);border-radius:8px;max-height:300px;overflow:auto}
.tanla button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--ch2);background:none;text-align:left}
.tanla button:last-child{border-bottom:0}
.tanla button:hover{background:#FAFBFC}
.tanla b{font-weight:600;display:block}.tanla small{color:var(--m2)}
.chek{font-size:14px}
.chek h3{font:800 17px/1.2 var(--f);letter-spacing:.03em}
.chek .q{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--ch)}
.chek .q span{color:var(--m2)}
.chek .q b{font-weight:600;text-align:right}
.chek .jami{display:flex;justify-content:space-between;padding:12px 0 0;font:800 19px/1.3 var(--f)}
.tg{background:#EEF3F8;border:1px solid #D5E0EC;border-radius:10px;padding:13px 15px;white-space:pre-line;font-size:14px;line-height:1.5}
.mal{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
.mal div small{display:block;color:var(--m2);font-size:12.5px}
.mal div b{font-weight:600}
.mal a{color:var(--in);text-decoration:none}
.bh{font:700 13px/1.3 var(--f);color:var(--m2);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.ich-j{border:1px solid var(--ch);border-radius:8px;overflow:hidden}
.ich-j table.j th,.ich-j table.j td{padding:9px 13px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--pan);color:#fff;padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pmob{display:none}

@media (max-width:1100px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.ikki{grid-template-columns:minmax(0,1fr)}.gk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .yon{display:none}
  .tep{padding:10px 16px;gap:10px}
  .tep .mlogo{display:flex;align-items:center;gap:8px;font:800 14px/1 var(--f);letter-spacing:.03em}
  .tep .mlogo span{width:30px;height:30px;border-radius:7px;background:var(--ak);color:#fff;display:grid;place-items:center}
  .tep .kim,.tep .nam .uz,#tb .uz,.yc{display:none}
  .tep{justify-content:space-between}.tep .bosh{display:none}
  #ich{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .sar h1{font-size:20px}
  .kpi{gap:10px}.kpi>div{padding:12px 13px}.kpi b{font-size:19px}
  .gk{grid-template-columns:minmax(0,1fr)}
  .pmob{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--yuz);border-top:1px solid var(--ch);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
  .pmob button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-weight:600;font-size:10.5px;color:var(--m2);position:relative}
  .pmob button .ik{width:21px;height:21px}
  .pmob button.on{color:var(--ak)}
  .pmob button i{position:absolute;top:1px;left:54%;min-width:17px;height:17px;border-radius:9px;background:var(--xa);color:#fff;font:700 10px/17px var(--f);font-style:normal;padding:0 4px}
  table.j.mk thead{display:none}
  table.j.mk,table.j.mk tbody,table.j.mk tr,table.j.mk td{display:block;width:100%}
  table.j.mk tr{padding:11px 16px;border-bottom:1px solid var(--ch)}
  table.j.mk tr:last-child{border-bottom:0}
  table.j.mk td{padding:3px 0;border:0;display:flex;justify-content:space-between;gap:14px;text-align:right}
  table.j.mk td::before{content:attr(data-l);color:var(--m2);font-size:12.5px;text-align:left;flex:none}
  table.j.mk td.ism{display:block;text-align:left;padding-bottom:6px}
  table.j.mk td.ism::before,table.j.mk td.am::before{content:none}
  table.j.mk td.am{justify-content:flex-end;padding-top:8px;flex-wrap:wrap}
  table.j.mk td.am:empty{display:none}
  .xul{gap:8px 18px;padding:11px 16px}
  .karta>.kh,.karta>.kb{padding-left:16px;padding-right:16px}
  #mo{padding:0;align-items:flex-end}
  .mb,.mb.keng{max-width:none;border-radius:14px 14px 0 0;max-height:94vh;display:flex;flex-direction:column}
  .mb>.kb{overflow:auto}
  .mb>.kf .btn{flex:1}
  .seg{grid-template-columns:repeat(2,1fr)}
  .filtr .qid{max-width:none;flex-basis:100%}
  .tab{max-width:100%;overflow-x:auto}
  .oyt b{min-width:116px}
}
@media print{
  .app,#toast,.pmob{display:none!important}
  #mo{position:static;display:block;background:none;padding:0}
  .mb{box-shadow:none;max-width:420px}
  .mb>.kh button,.mb>.kf,.chopsiz{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="yon">
    <div class="logo"><div class="bg" id="lg1"></div><div><b>C.A. WOLVES</b><small>Баскетбол академияси</small></div></div>
    <nav id="nav"></nav>
    <div class="past">Намуна. Барча исм ва рақамлар ўйлаб топилган.<br><button data-a="tikla">Намунани қайта бошлаш</button></div>
  </aside>
  <div class="asos">
    <div class="tep">
      <div class="mlogo"><span id="lg2"></span>C.A. WOLVES</div>
      <div class="nam"><b>НАМУНА</b><span class="uz"> · маълумотлар ўйлаб топилган</span></div>
      <div class="bosh"></div>
      <button class="btn a" data-a="tolovOch" id="tb"></button>
      <div class="kim"><span>А</span>Администратор</div>
    </div>
    <main id="ich"></main>
  </div>
</div>
<div class="pmob" id="pmob"></div>
<div id="mo"></div>

/* ---------- oyna, xabar ---------- */
function modal(sar, ich, past, keng) {
  $('#mo').innerHTML = '<div class="mb' + (keng ? ' keng' : '') + '" role="dialog" aria-modal="true"><div class="kh"><h2>' + sar + '</h2><button data-a="yop" aria-label="Ёпиш">' + ik('x') + '</button></div><div class="kb">' + ich + '</div>' + (past ? '<div class="kf">' + past + '</div>' : '') + '</div>';
  $('#mo').classList.add('on'); document.body.style.overflow = 'hidden';
  var f = $('#mo [autofocus]'); if (f && window.innerWidth > 820) f.focus();
}
function yop() { $('#mo').classList.remove('on'); $('#mo').innerHTML = ''; document.body.style.overflow = ''; }
var tt;
function toast(m) { var e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('on'); }, 2800); }
function td(l, h, c) { return '<td data-l="' + l + '"' + (c ? ' class="' + c + '"' : '') + '>' + h + '</td>'; }
function oyTanla(max) {
  return '<div class="oyt"><button data-a="oy" data-d="-1" aria-label="Олдинги ой"' + (H.oy <= MINOY ? ' disabled' : '') + '>' + ik('chap') + '</button><b>' + oyNom(H.oy) + '</b><button data-a="oy" data-d="1" aria-label="Кейинги ой"' + (H.oy >= max ? ' disabled' : '') + '>' + ik('ong') + '</button></div>';
}
function gSel() { return '<select class="sel" data-i="g" aria-label="Филиал ва гуруҳ" style="max-width:100%"><option value="">Барча филиаллар</option>' + gOpt(H.g) + '</select>'; }
function qidir(ph) { return '<div class="qid">' + ik('qidir') + '<input class="inp" data-i="q" placeholder="' + ph + '" value="' + esc(H.q) + '" aria-label="Қидириш"></div>'; }
function tab(nom, tanl, v) { return '<div class="tab">' + v.map(function (x) { return '<button data-a="tab" data-n="' + nom + '" data-v="' + x[0] + '"' + (tanl === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div>'; }

/* ---------- bo'limlar ---------- */
var BOLIM = [['bosh', 'Бош саҳифа'], ['tolov', 'Тўловлар'], ['qarz', 'Қарздорлар'], ['guruh', 'Филиаллар'], ['bola', 'Болалар'], ['yigim', 'Қўшимча йиғимлар'], ['hisobot', 'Ҳисобот'], ['tarix', 'Тўловлар тарихи']];
var B = {}, R = {};

B.bosh = function () {
  var j = oyJami(JORIY), ks = kassa(JORIY), qd = qarzdorlar(), eski = qd.filter(function (x) { return x.q.e > 0; }), eJ = 0;
  eski.forEach(function (x) { eJ += x.q.e; });
  var h = '<div class="sar"><div><h1>Бош саҳифа</h1><p>' + oyNom(JORIY) + ' · бугун ' + sanaN(BUGUNK) + '</p></div></div>';
  h += '<div class="kpi">' +
    '<div class="y"><small>Шу ой учун йиғилди</small><b class="num">' + som(j.yig) + ' <em>сўм</em></b><span>кутилган ' + som(j.kut) + ' сўмдан ' + j.foiz + '%</span></div>' +
    '<div class="n"><small>Тўлаган болалар</small><b class="num">' + j.tol + ' <em>/ ' + j.soni + '</em></b><span>қисман тўлаган: ' + j.qis + '</span></div>' +
    '<div class="o"><small>Шу ой тўламаганлар</small><b class="num">' + (j.yoq + j.qis) + ' <em>бола</em></b><span>қолди: ' + som(j.qol) + ' сўм</span></div>' +
    '<div class="x"><small>Ўтган ойлардан қарз</small><b class="num">' + eski.length + ' <em>бола</em></b><span>жами: ' + som(eJ) + ' сўм</span></div></div>';
  var bg = kassa(BUGUNK);
  h += '<div class="ikki"><div class="karta"><div class="kh"><h2>Бугунги тушум</h2><span>' + sanaN(BUGUNK) + '</span></div><div class="kb"><div class="bug"><b class="num">' + som(bg.j) + ' сўм</b><span>' + bg.n + ' та тўлов</span></div>' + usulQator(bg) + '</div></div>' + murKarta() + '</div>';
  // filiallar bo'yicha
  var gr = S.fil.map(function (f) {
    var x = oyJami(JORIY, f.id);
    return '<tr class="bos" data-a="gOch" data-id="' + f.id + '">' + td('', '<b>' + esc(f.nom) + '</b><small>' + esc(f.tuman) + '</small>', 'ism') + td('Тўлади', '<span class="num">' + x.tol + ' / ' + x.soni + '</span>') + td('Йиғилди', '<span class="num">' + som(x.yig) + '</span>', 'r') + td('', '<div style="min-width:110px"><div class="yol' + (x.foiz < 50 ? ' x' : x.foiz < 80 ? ' o' : '') + '"><i style="width:' + x.foiz + '%"></i></div></div>', 'yc') + td('', '<span class="num">' + x.foiz + '%</span>', 'r') + '</tr>';
  }).join('');
  var oxir = S.pays.filter(function (p) { return !p.bekor; }).slice(-6).reverse().map(function (p) {
    var k = bola(p.kid);
    return '<tr>' + td('', '<b>' + esc(k ? k.ism : '—') + '</b><small>' + sanaN(p.sana) + ' · ' + esc(nima(p)) + '</small>', 'ism') + td('Усул', USUL[p.usul]) + td('Сумма', '<b class="num">' + som(p.sum) + '</b>', 'r') + '</tr>';
  }).join('');
  h += '<div class="ikki"><div class="karta"><div class="kh"><h2>Филиаллар бўйича — ' + oyNom(JORIY) + '</h2><span>қаторни босинг</span></div><div class="sur"><table class="j"><thead><tr><th>Филиал</th><th>Тўлади</th><th class="r">Йиғилди, сўм</th><th class="yc"></th><th></th></tr></thead><tbody>' + gr + '</tbody></table></div></div>' +
    '<div class="karta"><div class="kh"><h2>Ойлик тушум</h2><span>кассага тушган пул</span></div><div class="kb">' + diagramma() + '</div></div></div>';
  var qr = qd.slice(0, 6).map(function (x) {
    return '<tr>' + td('', '<button class="hav" data-a="kid" data-id="' + x.k.id + '">' + esc(x.k.ism) + '</button><small style="display:block">' + esc(gQ(x.k.gid)) + ' · ' + x.q.o.map(function (o) { return oyQisqa(o.oy); }).join(', ') + '</small>', 'ism') + td('Қарз', '<span class="qz num">' + som(x.q.j) + '</span>', 'r') + td('', '<button class="btn k" data-a="tolovOch" data-id="' + x.k.id + '">Тўлов</button>', 'am') + '</tr>';
  }).join('');
  h += '<div class="ikki"><div class="karta"><div class="kh"><h2>Энг катта қарздорлар</h2><button class="btn k" data-a="bol" data-b="qarz">Ҳаммаси (' + qd.length + ')</button></div>' + (qr ? '<table class="j mk"><tbody>' + qr + '</tbody></table>' : '<div class="bosh0">Қарздор йўқ</div>') + '</div>' +
    '<div class="karta"><div class="kh"><h2>Охирги тўловлар</h2><button class="btn k" data-a="bol" data-b="tarix">Тарих</button></div><table class="j"><tbody>' + oxir + '</tbody></table></div></div>';
  return h;
};
function diagramma() {
  var a = [], max = 1;
  for (var i = -5; i <= 0; i++) { var oy = oyQosh(JORIY, i), v = kassa(oy).j; a.push([oy, v]); if (v > max) max = v; }
  return '<div class="dg">' + a.map(function (x) { return '<div' + (x[0] === JORIY ? ' class="on"' : '') + '><small class="num">' + (x[1] ? mln(x[1]) : '—') + '</small><i style="height:' + Math.round(x[1] / max * 100) + '%"></i><span>' + oyQisqa(x[0]) + '</span></div>'; }).join('') + '</div>';
}

B.tolov = function () {
  return '<div class="sar"><div><h1>Тўловлар</h1><p>Ким тўлади, ким тўламади — ой бўйича</p></div><div class="amal"><button class="btn" data-a="csvOy">' + ik('yukla') + 'Excel учун юклаш</button></div></div>' +
    '<div class="filtr">' + oyTanla(oyQosh(JORIY, 1)) + gSel() + tab('f', H.f, [['', 'Ҳаммаси'], ['y', 'Тўламади'], ['q', 'Қисман'], ['t', 'Тўлади']]) + qidir('Бола исми') + '</div><div class="karta" id="ry"></div>';
};
R.tolov = function () {
  var oy = H.oy, q = H.q.toLowerCase(), j = oyJami(oy, H.g), kel = oy > JORIY, tr = { y: 0, q: 1, t: 2, m: 3 };
  var a = S.kids.filter(function (k) { return aktiv(k, oy) && mos(k, H.g) && (!q || k.ism.toLowerCase().indexOf(q) >= 0); })
    .map(function (k) { return { k: k, h: holat(k, oy) }; })
    .filter(function (x) { return !H.f || x.h.h === H.f; })
    .sort(function (x, y) { return tr[x.h.h] - tr[y.h.h] || (x.k.ism < y.k.ism ? -1 : 1); });
  var h = '<div class="xul"><span>Кутилган: <b class="num">' + som(j.kut) + '</b></span><span>Йиғилди: <b class="num">' + som(j.yig) + '</b> (' + j.foiz + '%)</span><span>Қолди: <b class="num">' + som(j.qol) + '</b></span><span>Тўлади: <b>' + j.tol + '</b> · қисман: <b>' + j.qis + '</b> · тўламади: <b>' + j.yoq + '</b></span></div>';
  if (!a.length) return h + '<div class="bosh0">Бу шартга мос бола топилмади</div>';
  return h + '<table class="j mk"><thead><tr><th>Бола</th><th class="r">Ойлик тўлов</th><th class="r">Тўланди</th><th class="r">Қолди</th><th>Ҳолат</th><th></th></tr></thead><tbody>' + a.map(function (x) {
    var k = x.k, s = k.oyN && k.oyN[oy] ? k.oyN[oy].s : (k.narx ? k.izoh || 'Алоҳида нарх' : '');
    return '<tr>' + td('', '<button class="hav" data-a="kid" data-id="' + k.id + '">' + esc(k.ism) + '</button><small style="display:block">' + esc(gQ(k.gid)) + (s ? ' · ' + esc(s) : '') + '</small>', 'ism') +
      td('Ойлик тўлов', '<span class="num">' + som(x.h.n) + '</span>', 'r') + td('Тўланди', '<span class="num">' + som(x.h.t) + '</span>', 'r') +
      td('Қолди', x.h.q ? '<span class="num' + (kel ? '' : ' qz') + '">' + som(x.h.q) + '</span>' : '<span class="kul">—</span>', 'r') + td('Ҳолат', hChip(x.h.h, kel)) +
      td('', x.h.q ? '<button class="btn k a" data-a="tolovOch" data-id="' + k.id + '" data-oy="' + oy + '">Тўлов</button>' : '', 'am') + '</tr>';
  }).join('') + '</tbody></table>';
};

B.qarz = function () {
  var qd = qarzdorlar(), j = 0, e = 0; qd.forEach(function (x) { j += x.q.j; e += x.q.e; });
  return '<div class="sar"><div><h1>Қарздорлар</h1><p>' + qd.length + ' бола · жами ' + som(j) + ' сўм, шундан ўтган ойлардан ' + som(e) + ' сўм</p></div><div class="amal"><button class="btn" data-a="csvQarz">' + ik('yukla') + 'Excel учун юклаш</button><button class="btn q" data-a="eslH">' + ik('qongiroq') + 'Ҳаммасига эслатма</button></div></div>' +
    '<div class="filtr">' + tab('qf', H.qf, [['', 'Ҳаммаси'], ['e', 'Эски қарз'], ['j', 'Фақат шу ой']]) + gSel() + qidir('Бола ёки ота-она') + '</div><div class="karta" id="ry"></div>';
};
function qarzRoyxat() {
  var q = H.q.toLowerCase();
  return qarzdorlar().filter(function (x) {
    if (!mos(x.k, H.g)) return false;
    if (H.qf === 'e' && !x.q.e) return false;
    if (H.qf === 'j' && x.q.e) return false;
    return !q || (x.k.ism + ' ' + x.k.ota).toLowerCase().indexOf(q) >= 0;
  });
}
R.qarz = function () {
  var a = qarzRoyxat();
  if (!a.length) return '<div class="bosh0">Қарздор йўқ</div>';
  return '<table class="j mk"><thead><tr><th>Бола</th><th>Ота-она</th><th>Қайси ойлар</th><th class="r">Қарз, сўм</th><th>Эслатма</th><th></th></tr></thead><tbody>' + a.map(function (x) {
    var k = x.k;
    return '<tr>' + td('', '<button class="hav" data-a="kid" data-id="' + k.id + '">' + esc(k.ism) + '</button><small style="display:block">' + esc(gQ(k.gid)) + '</small>', 'ism') +
      td('Ота-она', '<span>' + esc(k.ota) + '<br><small class="kul num">' + esc(k.tel) + '</small></span>') +
      td('Ойлар', '<span>' + x.q.o.map(function (o) { return '<span class="chip' + (o.oy < JORIY ? ' x' : ' o') + '">' + oyQisqa(o.oy) + '</span>'; }).join(' ') + '</span>') +
      td('Қарз', '<span class="qz num">' + som(x.q.j) + '</span>', 'r') +
      td('Эслатма', S.esl[k.id] ? '<span class="kul num">' + sanaN(S.esl[k.id]) + '</span>' : '<span class="kul">юборилмаган</span>') +
      td('', '<button class="btn k" data-a="esl" data-id="' + k.id + '">' + ik('qongiroq') + 'Эслатма</button> <button class="btn k a" data-a="tolovOch" data-id="' + k.id + '">Тўлов</button>', 'am') + '</tr>';
  }).join('') + '</tbody></table>';
};

B.guruh = function () {
  if (H.gid && filial(H.gid)) return filIchi(filial(H.gid));
  return '<div class="sar"><div><h1>Филиаллар</h1><p>' + S.fil.length + ' филиал · ' + S.groups.length + ' гуруҳ · ' + S.kids.filter(function (k) { return aktiv(k, JORIY); }).length + ' бола</p></div></div><div class="gk">' + S.fil.map(function (f) {
    var x = oyJami(JORIY, f.id), gs = S.groups.filter(function (g) { return g.fid === f.id; }), ms = [];
    gs.forEach(function (g) { if (ms.indexOf(g.mur) < 0) ms.push(g.mur); });
    return '<button data-a="gOch" data-id="' + f.id + '"><h3>' + esc(f.nom) + ' <span class="kul" style="font-weight:600">· ' + esc(f.tuman) + '</span></h3><p>' + esc(ms.join(', ')) + ' · ' + esc(f.kun) + '</p>' +
      '<div class="qt"><span>Гуруҳлар: <b>' + gs.length + '</b></span><span>Болалар: <b>' + x.soni + '</b></span></div>' +
      '<div class="qt"><span>' + oyNom(JORIY) + ': <b class="num">' + som(x.yig) + '</b> / ' + som(x.kut) + '</span><b>' + x.foiz + '%</b></div><div class="yol' + (x.foiz < 50 ? ' x' : x.foiz < 80 ? ' o' : '') + '"><i style="width:' + x.foiz + '%"></i></div></button>';
  }).join('') + '</div>';
};
function filIchi(f) {
  var oy = [], x = oyJami(JORIY, f.id);
  for (var i = -5; i <= 0; i++) oy.push(oyQosh(JORIY, i));
  var h = '<div class="sar"><div><button class="btn k" data-a="gOch" data-id="" style="margin-bottom:10px">' + ik('chap') + 'Филиаллар</button><h1>' + esc(f.nom) + ' · ' + esc(f.tuman) + '</h1><p>' + esc(f.joy) + ' · ' + esc(f.kun) + '</p></div></div>';
  h += '<div class="kpi"><div class="n"><small>Болалар</small><b>' + x.soni + '</b></div><div class="y"><small>Шу ой йиғилди</small><b class="num">' + som(x.yig) + '</b><span>' + x.foiz + '%</span></div><div class="o"><small>Шу ой қолди</small><b class="num">' + som(x.qol) + '</b></div><div class="x"><small>Тўламаганлар</small><b>' + (x.yoq + x.qis) + '</b></div></div>';
  S.groups.filter(function (g) { return g.fid === f.id; }).forEach(function (g) {
    var gx = oyJami(JORIY, g.id), kids = S.kids.filter(function (k) { return k.gid === g.id && !k.ket; }).sort(function (a, b) { return a.ism < b.ism ? -1 : 1; });
    h += '<div class="karta" style="margin-bottom:16px"><div class="kh"><h2>' + esc(g.nom) + ' · ' + esc(g.yosh) + '</h2><span>' + esc(g.mur) + ' · ' + esc(g.vaqt) + ' · ойлик ' + som(g.narx) + ' · йиғилди ' + gx.foiz + '%</span></div><div class="sur"><table class="mt"><thead><tr><th>Бола</th>' + oy.map(function (o) { return '<th>' + oyQisqa(o) + '</th>'; }).join('') + '</tr></thead><tbody>' + kids.map(function (k) {
      return '<tr><td><button class="hav" data-a="kid" data-id="' + k.id + '">' + esc(k.ism) + '</button></td>' + oy.map(function (o) {
        if (!aktiv(k, o)) return '<td class="kul">·</td>';
        var s = holat(k, o), a = ' data-a="tolovOch" data-id="' + k.id + '" data-oy="' + o + '"';
        if (s.h === 'm') return '<td><button class="m" data-a="kid" data-id="' + k.id + '" title="Муздатилган">' + ik('muz') + '</button></td>';
        if (s.h === 't') return '<td><button class="t" data-a="kid" data-id="' + k.id + '" title="Тўлади">' + ik('ok') + '</button></td>';
        if (s.h === 'q') return '<td><button class="q num"' + a + ' title="Қисман тўлади">' + som(s.t / 1000) + ' / ' + som(s.n / 1000) + '</button></td>';
        return '<td><button class="y num"' + a + ' title="Тўламади">' + som(s.n / 1000) + ' минг</button></td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div>';
  });
  return h + '<p class="kul" style="font-size:12.5px">Катакни босиб тўлов киритилади. Қизил — тўламаган, сариқ — қисман, яшил белги — тўлаган.</p>';
}

B.bola = function () {
  return '<div class="sar"><div><h1>Болалар</h1><p>Рўйхат, ота-она ва тўловлар тарихи</p></div><div class="amal"><button class="btn q" data-a="bolaOyna">' + ik('plus') + 'Бола қўшиш</button></div></div>' +
    '<div class="filtr">' + gSel() + tab('bf', H.bf || '', [['', 'Қатнашаётганлар'], ['k', 'Тўхтатганлар']]) + qidir('Исм ёки телефон') + '</div><div class="karta" id="ry"></div>';
};
R.bola = function () {
  var q = H.q.toLowerCase(), qr = q.replace(/\D/g, '');
  var a = S.kids.filter(function (k) {
    if (H.bf === 'k' ? !k.ket : !!k.ket) return false;
    if (!mos(k, H.g)) return false;
    return !q || (k.ism + ' ' + k.ota).toLowerCase().indexOf(q) >= 0 || (qr.length > 2 && k.tel.replace(/\D/g, '').indexOf(qr) >= 0);
  }).sort(function (x, y) { return x.ism < y.ism ? -1 : 1; });
  if (!a.length) return '<div class="bosh0">Бола топилмади</div>';
  return '<table class="j mk"><thead><tr><th>Бола</th><th>Гуруҳ</th><th>Ота-она</th><th class="r">Ойлик тўлов</th><th class="r">Қарз</th></tr></thead><tbody>' + a.map(function (k) {
    var qz = qarzi(k).j;
    return '<tr class="bos" data-a="kid" data-id="' + k.id + '">' + td('', '<b>' + esc(k.ism) + '</b><small>' + k.tug + ' й. · ' + oyNom(k.bosh) + 'дан</small>', 'ism') + td('Гуруҳ', esc(gQ(k.gid))) +
      td('Ота-она', '<span>' + esc(k.ota) + '<br><small class="kul num">' + esc(k.tel) + '</small></span>') + td('Ойлик тўлов', '<span class="num">' + som(asl(k)) + '</span>', 'r') +
      td('Қарз', qz ? '<span class="qz num">' + som(qz) + '</span>' : '<span class="chip y">йўқ</span>', 'r') + '</tr>';
  }).join('') + '</tbody></table>';
};

B.yigim = function () {
  if (H.yid && yigim(H.yid)) return yigIchi(yigim(H.yid));
  return '<div class="sar"><div><h1>Қўшимча йиғимлар</h1><p>Форма, турнир, сафар — ойлик тўловга аралашмайди, алоҳида ҳисобланади</p></div><div class="amal"><button class="btn q" data-a="yigOyna">' + ik('plus') + 'Янги йиғим</button></div></div>' +
    (S.yig.length ? '<div class="gk">' + S.yig.slice().reverse().map(function (y) {
      var x = yigJami(y);
      return '<button data-a="yigOch" data-id="' + y.id + '"><h3>' + esc(y.nom) + '</h3><p>' + sanaN(y.sana) + ' · ' + som(y.sum) + ' сўмдан</p><div class="qt"><span>Тўлади: <b>' + x.tol + ' / ' + x.soni + '</b></span><span>Қолди: <b class="num">' + som(x.qol) + '</b></span></div><div class="qt"><span>Йиғилди: <b class="num">' + som(x.yig) + '</b></span><b>' + x.foiz + '%</b></div><div class="yol' + (x.foiz < 50 ? ' x' : x.foiz < 80 ? ' o' : '') + '"><i style="width:' + x.foiz + '%"></i></div></button>';
    }).join('') + '</div>' : '<div class="karta"><div class="bosh0">Ҳали йиғим йўқ</div></div>');
};
function yigIchi(y) {
  var x = yigJami(y);

function tarixRoyxat() {
  var q = H.q.toLowerCase();
  return S.pays.filter(function (p) {
    if (H.tu && p.usul !== H.tu) return false;
    if (!q) return true;
    var k = bola(p.kid);
    return String(p.id).indexOf(q) >= 0 || (k && k.ism.toLowerCase().indexOf(q) >= 0);
  }).reverse();
}
R.tarix = function () {
