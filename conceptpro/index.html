<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONCEPT PRO — система управления производством (образец)</title>
<meta name="robots" content="noindex">
<meta name="description" content="Образец системы для CONCEPT PRO: заказы с размерной сеткой, этапы цеха (вязание, кеттель, ВТО, ОТК), склад пряжи, отгрузки, оплаты, сдельная оплата и брак.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--acc:#1f4e79;--acc2:#173d60;--accbg:#e8eef5;--bg:#f4f6f8;--card:#fff;--tx:#1b2533;--mut:#5f6b7a;--ln:#dfe4ea;--ok:#15803d;--okbg:#eef7f1;--wr:#b45309;--wrbg:#fdf6ec;--er:#b42318;--erbg:#fdf1f0;--side:#0f1b2b;--sidetx:#c3ccd8;--soft:#f4f6f8;--r:8px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.namuna{background:var(--soft);color:var(--mut);border-bottom:1px solid var(--ln);font-size:12px;text-align:center;padding:5px 12px}
.namuna b{color:var(--wr)}
.lay{display:flex;min-height:calc(100vh - 30px)}
.side{width:236px;flex:none;background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 30px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{color:#94a3b8;font-size:12px}
.logo{width:38px;height:38px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-left:2px solid transparent;background:none;color:var(--sidetx);padding:10px 12px;border-radius:0 6px 6px 0;text-align:left;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:#7fa7d6}
.nav .ic{width:20px;display:inline-flex;align-items:center;justify-content:center}
.nav .bdg,.mnav .bdg{margin-left:auto;background:var(--er);color:#fff;border-radius:3px;font-size:12px;padding:0 5px;font-weight:600}
.sidefoot{padding:12px 16px;font-size:12px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot button{background:none;border:1px solid rgba(255,255,255,.18);color:#94a3b8;border-radius:6px;padding:5px 9px;font-size:12px;margin-top:6px}
.rolsel{width:100%;background:rgba(255,255,255,.06);color:#dfe4ea;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:6px}
.rolsel option{color:var(--tx)}
.rolsel.m{width:auto;background:#fff;color:var(--tx);border-color:var(--ln);margin:0}
.main{flex:1;min-width:0;padding:22px 26px 90px}
.mhead{display:none;align-items:center;gap:10px;margin:-2px 0 14px}
.mhead b{font-size:15px}.mhead small{color:var(--mut);font-size:12px;display:block}
.mhead .logo{border-color:var(--acc);color:var(--acc)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800}
.top .sub{color:var(--mut);font-size:13px}
.top .sp{flex:1}
.btn{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cbd5e1}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc2)}
.btn.s{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k5{grid-template-columns:repeat(5,1fr)}.k2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
.card h3 .sp{flex:1}.card h3 small{font-weight:600;color:var(--mut);font-size:12px}
.card h3>svg.i{color:#475569}
.kpi{cursor:pointer;border-left:2px solid var(--ln);position:relative}
.kpi:hover{border-color:#cbd5e1}
.kpi .l{color:var(--mut);font-size:13px;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:600;color:var(--mut);margin-left:2px}
.kpi .d{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.35}
.kpi.er{border-left-color:var(--ln)}.kpi.er .d{color:var(--er);font-weight:700}
.kpi.wr{border-left-color:var(--ln)}.kpi.wr .d{color:var(--wr);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{border-color:#c9e3d2;color:var(--ok)}
.pill.wr{border-color:#f1dcc0;color:var(--wr)}
.pill.er{border-color:#f0c9c5;color:var(--er)}
.pill.mu{background:var(--soft);color:#475569}
.pill.ac{background:var(--accbg);color:var(--acc2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.stagebar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--soft)}
.stagebar div{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.leg span{display:flex;align-items:center;gap:6px;cursor:pointer;color:#475569}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.list .it:last-child{border:0}
.list .it:hover{background:#f4f6f8}
.list .it .m{flex:1;min-width:0}
.list .it .m b{display:block;font-size:14px}
.list .it .m.tx b{display:inline;font-size:inherit}
.list .it .m small{color:var(--mut);font-size:12px}
.list .it>svg.i{color:#94a3b8;flex:none}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:3px 3px 0 0}
.bars .b small{font-size:12px;color:var(--mut)}
.bars .b em{font-style:normal;font-size:12px;font-weight:700;color:#475569}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:8px 11px;min-width:0}
.inp:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.inp.big{font-size:18px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;padding-right:24px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.chip em{font-style:normal;opacity:.65;font-size:12px}
.seg{max-width:100%;overflow-x:auto;display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--accbg);color:var(--acc2)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#f4f6f8;border:1px solid var(--ln);border-radius:var(--r);padding:10px;min-height:120px}
.col>h4{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:7px}
.col>h4 em{margin-left:auto;font-style:normal;background:#fff;border-radius:4px;padding:0 7px;font-size:12px;color:var(--mut)}
.oc{background:#fff;border:1px solid var(--ln);border-left:2px solid var(--ln);border-radius:6px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.oc:hover{border-color:#cbd5e1}
.oc.late{border-left-color:var(--er)}.oc.soon{border-left-color:var(--wr)}
.oc .r1{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut);font-weight:700}
.oc b{display:block;margin:3px 0 2px;font-size:14px}
.oc .pr{font-size:13px;color:#475569}
.oc .r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:#f4f6f8}
.t td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:#f4f6f8}
.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:#fff}
.mod{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:#fff;border-radius:8px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 8px 14px rgba(0,0,0,.18);animation:up .18s}
@keyframes up{from{transform:translateY(10px);opacity:.6}}
.box .hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:2}
.box .hd h2{margin:0;font-size:18px;font-weight:800}
.box .hd .x{margin-left:auto;border:0;background:var(--soft);border-radius:6px;width:34px;height:34px;font-size:18px}
.box .bd{padding:16px 18px}
.ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:#fff}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.dl div small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.dl div b{font-size:14px}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center}
.prog{height:8px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
.hist{font-size:13px;border-left:2px solid var(--ln);margin-left:4px;padding-left:12px}
.hist div{margin-bottom:7px;position:relative}
.hist div:before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hist small{color:var(--mut)}
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.frm.f5{grid-template-columns:repeat(3,1fr)}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#475569}
.frm .w2{grid-column:span 2}.frm .inp{width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:80;box-shadow:0 6px 14px rgba(0,0,0,.2);display:flex;gap:9px;align-items:center;max-width:calc(100vw - 32px)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--wrbg);color:var(--wr);font-size:13px;margin-bottom:12px}
.alert.er{background:var(--erbg);color:var(--er)}
.note{font-size:12px;color:var(--mut)}
.zanjir{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.zn{flex:1 1 140px;display:flex;flex-direction:column;gap:1px;padding:9px 10px 9px 34px;border-radius:6px;background:#f4f6f8;border:1px solid var(--ln);border-left:2px solid #cbd5e1;position:relative;min-width:0}
.zn i{position:absolute;left:9px;top:10px;color:#94a3b8;font-style:normal}
.zn b{font-size:13px}.zn small{font-size:12px;color:var(--mut);line-height:1.3}
.zn.ok{border-left-color:var(--ok)}.zn.ok i{color:var(--ok)}
.zn.er{background:var(--erbg);border-left-color:var(--er)}.zn.er i{color:var(--er)}.zn.er small{color:var(--er)}
.zn.wr{background:var(--wrbg);border-left-color:var(--wr)}.zn.wr i{color:var(--wr)}
.verdict{margin-top:10px;padding:11px 13px;border-radius:6px;display:flex;flex-direction:column;gap:3px;font-size:13px;border-left:2px solid currentColor}
.verdict b{font-size:15px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.er{background:var(--erbg);color:var(--er)}
.wfc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.wfc>div{background:var(--soft);border-radius:6px;padding:8px 11px;flex:1 1 120px}
.wfc>div small{display:block;color:var(--mut);font-size:12px}
.wfc>div b{font-size:14px}
.wfc>div.last{background:var(--wrbg)}
.route{display:flex}
.rs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;color:var(--mut);position:relative}
.rs i{width:10px;height:10px;border-radius:50%;background:#cbd5e1;z-index:1}
.rs:before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:2px;background:#cbd5e1}
.rs:first-child:before{display:none}
.rs.on i,.rs.on:before{background:var(--acc)}
.rs.on span{color:var(--tx);font-weight:700}
.rs span{line-height:1.2;word-break:break-word}
.cc{display:inline-block;font-size:12px;font-weight:800;background:#dfe4ea;color:#475569;border-radius:3px;padding:0 4px;vertical-align:2px}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.nav .ic svg.i,.mnav .ic svg.i{width:19px;height:19px;vertical-align:middle}
.btn svg.i{width:16px;height:16px}
.alert svg.i,.pill svg.i{width:14px;height:14px}
.mnav{display:none}
.pnl{display:flex;flex-direction:column;gap:14px}
.k3{grid-template-columns:repeat(3,1fr)}
.mr{display:flex;gap:2px;margin:8px 0 3px}
.mr i{flex:1;height:4px;border-radius:1px;background:var(--ln)}
.mr i.d{background:var(--acc)}.mr i.c{background:#7fa7d6}.mr i.c.late{background:var(--er)}
.oc.late .prog i{background:var(--er)}
.prog i{background:var(--acc)}
.lkb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details.rd summary{cursor:pointer;list-style:none}details.rd summary::-webkit-details-marker{display:none}
details.rd summary h3{margin:0}details.rd[open] summary h3{margin-bottom:12px}
.top h1{font-weight:700}
/* --- поток производства --- */
.flow{display:grid;grid-template-columns:96px repeat(8,minmax(0,1fr));grid-template-rows:auto auto;gap:10px 16px}
.fl{font-size:13px;font-weight:700;color:var(--tx);align-self:center;line-height:1.3}
.fl small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.l1{grid-column:1;grid-row:1}.l2{grid-column:1;grid-row:2}.l3{display:none}
.a1{grid-column:2;grid-row:1}.a2{grid-column:3;grid-row:1}.a3{grid-column:4;grid-row:1}
.b1{grid-column:2;grid-row:2}.b2{grid-column:3;grid-row:2}.b3{grid-column:4;grid-row:2}
.c1{grid-column:5;grid-row:1/3}.c2{grid-column:6;grid-row:1/3}.c3{grid-column:7;grid-row:1/3}.c4{grid-column:8;grid-row:1/3}.c5{grid-column:9;grid-row:1/3}
.fb{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:96px;min-width:0}
.fb:hover{border-color:#94a3b8}
.fb .fn{font-size:12px;font-weight:700;color:#475569}
.fb b{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}.fb b small{font-size:12px;font-weight:600;color:var(--mut)}.nw{white-space:nowrap}
.fb small{font-size:12px;color:var(--mut);line-height:1.3}
.fb em{font-style:normal;font-size:12px;color:var(--ok);font-weight:700}
.fb .fx{font-style:normal;font-size:12px;font-weight:700;margin-top:3px;color:var(--er)}
.fb.bo{background:var(--soft)}.fb.bo b{color:#94a3b8}
.fb.tor{border-color:#f0c9c5}
.fb .fx.wr{color:var(--wr)}.fb .fx.hlt{color:var(--acc)}
.dhint{font-size:13px;color:var(--acc2);background:var(--accbg);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.fb.skl{border-style:dashed}
.fb.hl{outline:2px solid var(--acc);outline-offset:2px}
.fb:not(.end):not(.a3):not(.b3):after{content:"";position:absolute;right:-12px;top:calc(50% - 4px);width:7px;height:7px;border-top:1.5px solid #94a3b8;border-right:1.5px solid #94a3b8;transform:rotate(45deg)}
.a3:after,.b3:after{content:"";position:absolute;right:-12px;top:calc(50% - 4px);width:7px;height:7px;border-top:1.5px solid #94a3b8;border-right:1.5px solid #94a3b8;transform:rotate(45deg)}
/* --- как это работает --- */
.intro{background:#fff;border:1px solid var(--ln);border-left:2px solid var(--acc);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.intro{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.intro .it2{flex:1 1 420px;font-size:14px;line-height:1.45}.intro .it2 span{color:#475569}
.intro ol{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.intro li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.intro li b{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-size:12px}
.intro .ib{display:flex;gap:8px;flex-wrap:wrap}
.cta{margin-top:14px;padding:14px 16px;border:1px dashed #cbd5e1;border-radius:var(--r);background:var(--accbg);font-size:13px;color:#475569}
.cta b{display:block;font-size:14px;color:var(--tx);margin-bottom:2px}
/* --- требует внимания --- */
.att .it{border-left:2px solid transparent;padding-left:10px}
.att .it.er{border-left-color:var(--er)}.att .it.wr{border-left-color:var(--wr)}
.att .it .m .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.att .it .m .r b{font-size:14px}
.att .it .m small{display:block;margin-top:2px;font-size:13px}
/* --- цех: результат записи --- */
.linked{border-left:2px solid var(--ok);margin-bottom:14px}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lk>div{border:1px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lk>div:hover{border-color:#94a3b8}
.lk small{color:var(--mut);font-size:12px}.lk b{font-size:15px}
.btn.pulse{outline:3px solid var(--accbg);outline-offset:2px}
/* --- маршрут заказа --- */
.rs.cur i{background:#fff;border:2px solid var(--acc);width:12px;height:12px}
.rs.cur span{color:var(--acc);font-weight:700}
.rs.cur.late i{border-color:var(--er)}.rs.cur.late span{color:var(--er)}
.rs em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700}
/* --- размерная сетка: телефон --- */
.mx-m{display:none}
.mx-h{font-weight:700;margin-bottom:6px}
.mx-r{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 0;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}

 $('#tsv').onclick=()=>{const o=D.B.find(x=>x.id===$('#to').value),s=+$('#ts').value||0;if(!o||s<=0){toast(t('Введите сумму'));return}if(s>summa(o)-tol(o)+0.01){toast(L(`Больше остатка по заказу: ${vf(summa(o)-tol(o),o.val)}`,`Buyurtma qoldig‘idan ko‘p: ${vf(summa(o)-tol(o),o.val)}`));return}D.PAY.push({id:U.uid('p'),oid:o.id,mid:o.mid,sana:iso(T),summa:s,val:o.val,izoh:$('#ti').value});o.tarix.push({v:new Date().toISOString(),m:'Оплата: '+vf(s,o.val)});save();closeM();toast(t('Оплата сохранена')+': '+vf(s,o.val));APP.render()}}
function mijozKarta(mid){const m=D.mij.find(x=>x.id===mid),os=D.B.filter(o=>o.mid===mid);
 modal(`<h2>${esc(m.nom)}</h2>`,`<div class="dl"><div><small>${t('Город')}</small><b>${esc(m.shahar)}</b></div><div><small>${t('Валюта')}</small><b>${m.val==='USD'?'$':t('сум')}</b></div><div><small>${t('Срок оплаты, дн.')}</small><b>${m.kun}</b></div></div>
 <div class="sec"><h4>${t('Заказы')}</h4>${table([{t:t('Заказ'),f:o=>o.raqam},{t:t('Статус'),f:bpill},{t:t('Сумма'),n:1,f:o=>vf(summa(o),o.val)},{t:t('Долг'),n:1,f:o=>vf(qarz(o),o.val)}],os,{click:o=>`data-oo="${o.id}"`})}</div>`);

/* ================= СДЕЛЬНАЯ ОПЛАТА ================= */
function rIsh(a){const oy=iso(T).slice(0,7);const E=D.ISH.filter(e=>e.sana.slice(0,7)===oy);
 const R=ISHCHI.filter(w=>w.rol!=='otk').map(w=>{const es=E.filter(e=>e.w===w.id);return{w,es,miq:es.reduce((s,e)=>s+e.miq,0),brak:es.reduce((s,e)=>s+e.brak,0),sum:es.reduce((s,e)=>s+ishSumma(e),0),kun:new Set(es.map(e=>e.sana)).size}});
 const jamiS=R.reduce((s,r)=>s+r.sum,0);
 a.innerHTML=`<div class="top"><div><h1>${t('Сдельная оплата')}</h1><div class="sub">${U.OY[T.getMonth()]} ${T.getFullYear()} · ${t('считается из записей цеха, брак не оплачивается')}</div></div><span class="sp"></span><button class="btn" id="ex">${I('tushir')} ${t('Excel (бухгалтеру)')}</button></div>
 <div class="grid k4" style="margin-bottom:14px"><div class="card kpi"><div class="l">${t('Сдельная за месяц')}</div><div class="v">${mln(jamiS)}</div><div class="d">${t('сум')}, ${R.filter(r=>r.sum).length} ${PL(R.filter(r=>r.sum).length,'работник','работника','работников','ishchi')}</div></div><div class="card kpi"><div class="l">${L('Связано','To‘qildi')}</div><div class="v">${num(R.filter(r=>r.w.rol==='toqish').reduce((s,r)=>s+r.miq,0))} <small>${L('компл.','kompl.')}</small></div><div class="d">${L('комплектов деталей','detal komplekti')}</div></div><div class="card kpi"><div class="l">${t('Сшито и собрано')}</div><div class="v">${num(R.filter(r=>['kettel','tikish'].includes(r.w.rol)).reduce((s,r)=>s+r.miq,0))}</div><div class="d">${t('шт')}</div></div><div class="card kpi ${R.reduce((s,r)=>s+r.brak,0)?'wr':''}"><div class="l">${t('Брак')}</div><div class="v">${num(R.reduce((s,r)=>s+r.brak,0))}</div><div class="d">${L('не оплачен; брак, найденный на ОТК, — в разделе «Брак»','to‘lanmaydi; OTKda topilgani — «Brak» bo‘limida')}</div></div></div>
 ${table([{t:t('Работник'),f:r=>`<b>${esc(r.w.ism)}</b><br><small class="note">${t(ROLN[r.w.rol])}</small>`},{t:t('Дней'),n:1,m:1,f:r=>r.kun},{t:t('Сделано'),n:1,f:r=>num(r.miq)+' '+t('шт')},{t:t('Брак'),n:1,m:1,f:r=>r.brak?`<span style="color:var(--er)">${num(r.brak)}</span>`:'—'},{t:t('Сумма за месяц'),n:1,f:r=>`<b>${num(r.sum)} ${t('сум')}</b>`}],R,{click:r=>`data-w="${r.w.id}"`})}
 <details class="card rd" style="margin-top:14px" ${matchMedia('(max-width:860px)').matches?'':'open'}><summary><h3 style="display:inline-flex">${I('tarozi')} ${t('Расценки по моделям (сум за 1 шт)')}</h3></summary>${table([{t:t('Модель'),f:k=>`<b>${k}</b> <small class="note">${esc(K[k].nom.split(',')[0])}</small>`},...['toqish','kettel','bichish','tikish','vto','qadoq'].map(st=>({t:t(BOS[st]),n:1,f:k=>K[k].r[st]!=null?`<input class="inp" data-rk="${k}" data-rs="${st}" type="number" value="${K[k].r[st]}" style="width:86px;text-align:right">`:'—'}))],Object.keys(K))}<p class="note">${t('При изменении расценки оплата пересчитывается сразу. ОТК — на окладе')}.</p></details>`;
 $$('[data-w]',a).forEach(r=>r.onclick=()=>ishchiKarta(r.dataset.w));
 $$('[data-rk]',a).forEach(i=>i.onchange=()=>{const v=Math.max(0,+i.value||0);K[i.dataset.rk].r[i.dataset.rs]=v;S().rast=S().rast||{};S().rast[i.dataset.rk+'.'+i.dataset.rs]=v;save();rIsh(a);toast(t('Сохранено'))});
 $('#ex',a).onclick=()=>U.exportX({[t('Оплата труда')]:R.map(r=>({[t('Работник')]:r.w.ism,[t('Этап')]:t(ROLN[r.w.rol]),[t('Дней')]:r.kun,[t('Сделано')]:r.miq,[t('Брак')]:r.brak,[t('Сумма')+' ('+t('сум')+')']:Math.round(r.sum)})),[t('Цех')]:E.map(e=>({[t('Дата')]:e.sana,[t('Работник')]:ism(e.w),[t('Этап')]:t(BOS[e.st]),[t('Заказ')]:(D.B.find(o=>o.id===e.oid)||{}).raqam,[t('Модель')]:e.k,[t('Цвет')]:e.rang,[t('Размер')]:e.size,[t('Количество')]:e.miq,[t('Брак')]:e.brak,[t('Причина')]:t(e.sabab),[t('Сумма')+' ('+t('сум')+')']:Math.round(ishSumma(e))}))},'ConceptPro_'+t('Оплата труда')+'_'+oy+'.xlsx')}
function ishchiKarta(wid){const w=ISHCHI.find(x=>x.id===wid),oy=iso(T).slice(0,7),es=D.ISH.filter(e=>e.w===wid&&e.sana.slice(0,7)===oy).sort((x,y)=>y.sana.localeCompare(x.sana));
 modal(`<h2>${esc(w.ism)}</h2>`,`<p class="note">${t(ROLN[w.rol])} · ${U.OY[T.getMonth()]}</p>${table([{t:t('Дата'),f:e=>fd(e.sana)},{t:t('Заказ'),f:e=>((D.B.find(o=>o.id===e.oid)||{}).raqam||'')+` <small class="note">${e.k} · ${e.size}</small>`},{t:t('Сделано'),n:1,f:e=>num(e.miq)},{t:t('Брак'),n:1,f:e=>e.brak?`<span style="color:var(--er)">${num(e.brak)}</span> <small class="note">${t(e.sabab)}</small>`:'—'},{t:t('Сумма'),n:1,f:e=>num(ishSumma(e))}],es)}<p style="margin-top:10px"><b>${t('Итого')}: ${num(es.reduce((s,e)=>s+ishSumma(e),0))} ${t('сум')}</b></p><p class="note">${t('Работник видит свой расчёт в телефоне — споров в конце месяца меньше')}.</p>`)}

/* ================= БРАК / ОТК ================= */
let BR_ALL=false;
function rBrak(a){const oy=iso(T).slice(0,7);const E=D.ISH.filter(e=>e.sana.slice(0,7)===oy),B=E.filter(e=>e.brak>0);
 const jami=Math.max(1,...['toqish','kettel','bichish','tikish','vto','otk','qadoq'].map(st=>E.filter(e=>e.st===st).reduce((a,e)=>a+e.miq,0))),br=B.reduce((s,e)=>s+e.brak,0);
 const grp=(f)=>{const m={};B.forEach(e=>{const k=f(e);m[k]=(m[k]||0)+e.brak});return Object.entries(m).sort((x,y)=>y[1]-x[1])};
 const hol=h=>B.filter(e=>e.holat===h).reduce((s,e)=>s+e.brak,0);
 const bar=rows=>`<div class="list bars2">${rows.map(([k,n],i)=>`<div class="it" style="cursor:default"><div class="m"><b style="font-weight:600">${esc(k)}</b><div class="prog" style="margin:4px 0 0"><i style="width:${Math.round(n/Math.max(1,rows[0][1])*100)}%;background:${i?'#94a3b8':'var(--er)'}"></i></div></div><b style="min-width:40px;text-align:right">${num(n)}</b></div>`).join('')||`<div class="empty">${t('Нет данных')}</div>`}</div>`;
 a.innerHTML=`<div class="top"><div><h1>${t('Брак / ОТК')}</h1><div class="sub">${t('На каком этапе и у кого возникает брак, что с ним сделали')}</div></div></div>
 <div class="grid k4" style="margin-bottom:14px"><div class="card kpi ${br?'wr':''}"><div class="l">${t('За месяц')}</div><div class="v">${num(br)} <small>${t('шт')}</small></div><div class="d">${(jami?br/jami*100:0).toFixed(1).replace('.',',')} % ${L('от сданного','topshirilgandan')}</div></div><div class="card kpi ok"><div class="l">${t('Исправлено')}</div><div class="v">${num(hol('fix'))}</div><div class="d">${t('шт')}</div></div><div class="card kpi"><div class="l">${t('Во 2-й сорт')}</div><div class="v">${num(hol('sort2'))}</div><div class="d">${t('шт')}</div></div><div class="card kpi er"><div class="l">${t('Списано')}</div><div class="v">${num(hol('chiq'))}</div><div class="d">${t('шт')}</div></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px"><div class="card"><h3>${t('По этапам')}</h3>${bar(grp(e=>t(BOS[e.st])))}</div><div class="card"><h3>${t('По причинам')}</h3>${bar(grp(e=>t(e.sabab)))}</div><div class="card"><h3>${t('По работникам')} <small class="note">${LANG==='ru'?'без ОТК':'OTKsiz'}</small></h3>${bar(grp(e=>e.st==='otk'?'—':ism(e.w)).filter(x=>x[0]!=='—').slice(0,6))}</div></div>
 <div class="card"><h3>${I('hujjat')} ${t('Все записи с браком')}<span class="sp"></span><small>${B.length}</small></h3>${table([{t:t('Дата'),f:e=>fd(e.sana)},{t:t('Заказ'),f:e=>`<b>${(D.B.find(o=>o.id===e.oid)||{}).raqam||''}</b><br><small class="note">${e.k} · ${esc(e.rang)} · ${e.size}</small>`},{t:t('Этап'),f:e=>t(BOS[e.st])},{t:t('Работник'),m:1,f:e=>esc(ism(e.w))},{t:t('Брак'),n:1,f:e=>`<span style="color:var(--er)">${num(e.brak)}</span>`},{t:t('Причина'),f:e=>t(e.sabab)},{t:t('Что сделали'),f:e=>pill(e.holat==='fix'?'ok':e.holat==='sort2'?'wr':'er',t(HOLAT[e.holat]||'исправлен'))}],B.slice().sort((x,y)=>y.sana.localeCompare(x.sana)).slice(0,BR_ALL?999:10),{click:e=>`data-o="${e.oid}"`})}${B.length>10?`<button class="btn s" id="ball" style="margin-top:8px">${BR_ALL?L('Свернуть','Yig‘ish'):L(`Показать все (${B.length})`,`Hammasi (${B.length})`)}</button>`:''}<p class="note">${t('Брак фиксируется в цехе вместе со сдачей: партия + этап + работник. Так видно, где теряются деньги')}.</p></div>`;
 const bb=$('#ball',a);if(bb)bb.onclick=()=>{BR_ALL=!BR_ALL;rBrak(a)};
 bindCommon(a)}

/* «Ещё» — telefon menyusining qolgan bo‘limlari va sozlamalar */
function yana(rest){
 modal(`<h2>${L('Ещё','Yana')}</h2>`,`<div class="more">${rest.map(k=>{const n=APP.cfg.badge?APP.cfg.badge(k):0;return`<button data-mv="${k}"><span class="ic">${APP.cfg.mod[k][0]}</span>${APP.cfg.mod[k][1]}${n?`<span class="bdg">${n}</span>`:''}</button>`}).join('')}</div>
 <div class="frm" style="margin-top:14px"><label>${t('Смотреть как:')}<select class="inp" id="yrol">${Object.keys(APP.cfg.rollar).map(k=>`<option value="${k}" ${k===APP.rol?'selected':''}>${rolNom()[k]}</option>`).join('')}</select></label><label>${L('Язык','Til')}<select class="inp" id="ytil"><option value="ru" ${LANG==='ru'?'selected':''}>Русский</option><option value="uz" ${LANG==='uz'?'selected':''}>O‘zbekcha</option></select></label></div>
 <button class="btn s" id="yrst" style="margin-top:12px">${t('Сбросить данные образца')}</button>`);
 $$('#mo [data-mv]').forEach(b=>b.onclick=()=>{closeM();APP.go(b.dataset.mv)});
 $('#yrol').onchange=e=>{closeM();const s2=$('#rolsel');s2.value=e.target.value;s2.onchange()};
 $('#ytil').onchange=e=>{closeM();tilQoy(e.target.value)};

load();

if(D.S.rast)Object.keys(D.S.rast).forEach(k=>{const [m,s]=k.split('.');if(K[m])K[m].r[s]=D.S.rast[k]});
const mods=()=>({panel:[I('panel'),t('Сегодня'),t('Сегодня')],buyurtmalar:[I('kiyim'),t('Заказы'),t('Заказы')],sex:[I('zavod'),t('Цех'),t('Цех')],ombor:[I('baza'),t('Склад'),t('Склад')],jonatish:[I('yuk'),t('Отгрузка и оплата'),t('Отгрузка')],ishbay:[I('odamlar'),t('Сдельная оплата'),L('Сдельная','Ishbay')],brak:[I('ogoh'),t('Брак / ОТК'),t('Брак')]});
const rolNom=()=>({direktor:t('Директор'),buxgalter:t('Бухгалтер'),sex:t('Начальник цеха'),ombor:t('Кладовщик')});
U.OY=LANG==='ru'?OYRU:OYUZ;document.documentElement.lang=LANG;
const CFG={nom:'CONCEPT PRO',logo:'CP',shior:LANG==='ru'?'Трикотаж · Ташкент':'Trikotaj · Toshkent',rang:['#1f4e79','#173d60','#e8eef5'],
 bolimlar:['panel','buyurtmalar','sex','ombor','jonatish','ishbay','brak'],
 mod:mods(),
 rollar:{direktor:['panel','buyurtmalar','sex','ombor','jonatish','ishbay','brak'],buxgalter:['buyurtmalar','jonatish','ishbay'],sex:['sex','buyurtmalar','brak'],ombor:['ombor','jonatish']},
 rolNom:rolNom(),
 badge:k=>{plan();if(k==='buyurtmalar')return D.B.filter(o=>(xavf(o)||{}).t==='er').length;if(k==='jonatish')return D.B.filter(o=>o.bosqich==='tayyor').length;if(k==='ombor')return ipHolat().filter(x=>x.kam).length;return 0},
 onGo:(v,f)=>{f=f||{};if(v==='buyurtmalar')F={st:f.st||'',q:''};if(v==='ombor'&&f.t)OT=f.t;if(v==='jonatish'&&f.t)JT=f.t},
 mobil:['panel','buyurtmalar','sex','ombor'],moreIc:I('qatlam'),moreNom:()=>L('Ещё','Yana'),onMore:rest=>yana(rest),
 render:{panel:rPanel,buyurtmalar:rBuy,sex:rSex,ombor:rOmbor,jonatish:rJon,ishbay:rIsh,brak:rBrak}};
const APP=U.app(CFG);APP.cfg=CFG;
const _rs=$('#rolsel');if(_rs){const old=_rs.onchange;_rs.onchange=()=>{APP.rol=_rs.value;old()}}
window.APP=APP;
$('#rst').onclick=()=>{ST.clear();seed();Object.keys(K).forEach(m=>{K[m].r=JSON.parse(JSON.stringify(KR0[m]))});toast(t('Данные образца восстановлены'));APP.render()};
$('#til').onchange=e=>tilQoy(e.target.value);$('#til2').onchange=e=>tilQoy(e.target.value);
tilQoy(LANG);
})();
</script>
