<script>/* Umumiy yordamchilar: ikkala namuna (POLYPACK, UZ AVIA) uchun. window.U */
(function(){
const U={};
U.$=s=>document.querySelector(s);
U.$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
U.esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

U.iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
U.addD=(n,b)=>{const d=new Date(b||T);d.setDate(d.getDate()+n);return U.iso(d)};
U.addH=(h,b)=>new Date((b?new Date(b):new Date()).getTime()+h*36e5);
U.dd=s=>Math.round((new Date(String(s).slice(0,10))-T)/864e5);
U.OY=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
U.fd=s=>{if(!s)return'—';const d=new Date(s);return d.getDate()+'-'+U.OY[d.getMonth()]};
U.fdt=s=>{if(!s)return'—';const d=new Date(s);return U.fd(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
U.num=(n,k)=>{if(n==null||isNaN(n))return'—';const f=k?Number(n).toFixed(k):Math.round(n);return Number(f).toLocaleString('ru-RU',{minimumFractionDigits:k||0,maximumFractionDigits:k||0}).replace(/ /g,' ').replace(',',k?',':'')};
U.som=n=>U.num(n)+' so‘m';
U.mln=n=>Math.abs(n)>=1e9?(n/1e9).toFixed(2).replace('.',',')+' mlrd':Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mln':U.num(n);
U.val=(n,v)=>v==='USD'?'$'+U.num(n):v==='EUR'?'€'+U.num(n):v==='RUB'?U.num(n)+' ₽':U.num(n)+' so‘m';
U.vaqt=v=>{const d=new Date(v),m=Math.round((Date.now()-d)/6e4);return m<1?'hozir':m<60?m+' daq oldin':m<1440?Math.round(m/60)+' soat oldin':U.fd(d)};
U.rnd=seed=>{let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}};
U.pick=(r,a)=>a[Math.floor(r()*a.length)];
U.uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* saqlash */
U.store=key=>({load(){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}},save(d){try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}},clear(){try{localStorage.removeItem(key)}catch(e){}}});

/* toast */
U.toast=(m,tg)=>{const t=document.createElement('div');t.className='toast';t.innerHTML=(tg?'<span class="tg">'+(tg===true?'Telegram':U.esc(tg))+'</span>':'')+U.esc(m);document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};

/* modal */
U.closeM=()=>{const m=U.$('#mo');if(m)m.remove();document.body.style.overflow=''};
U.modal=(h,b,f,wide)=>{U.closeM();const m=document.createElement('div');m.className='mod';m.id='mo';m.innerHTML=`<div class="box" ${wide?'style="width:min(980px,100%)"':''}><div class="hd">${h}<button class="x" aria-label="Yopish">×</button></div><div class="bd">${b}</div>${f?'<div class="ft">'+f+'</div>':''}</div>`;document.body.appendChild(m);document.body.style.overflow='hidden';m.querySelector('.x').onclick=U.closeM;m.addEventListener('mousedown',e=>{if(e.target===m)U.closeM()});return m};

/* jadval */
U.table=(cols,rows,opt)=>{opt=opt||{};if(!rows.length)return'<div class="card empty">'+(opt.empty||'Ma‘lumot yo‘q')+'</div>';

U.csv=(rs,fn)=>{const h=Object.keys(rs[0]||{});const t=[h.join(';')].concat(rs.map(r=>h.map(k=>'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"').join(';'))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=fn.replace(/\.xlsx$/,'.csv');a.click()};
U.exportX=(sheets,fn)=>{U.toast('Excel fayl tayyorlanmoqda…');U.xls().then(X=>{const wb=X.utils.book_new();Object.keys(sheets).forEach(n=>{const ws=X.utils.json_to_sheet(sheets[n]);ws['!cols']=Object.keys(sheets[n][0]||{}).map(k=>({wch:Math.max(10,Math.min(32,k.length+4))}));X.utils.book_append_sheet(wb,ws,n.slice(0,30))});X.writeFile(wb,fn)}).catch(()=>U.csv(sheets[Object.keys(sheets)[0]],fn))};

U.mapCols=(keys,spec)=>{const M={};Object.keys(spec).forEach(k=>{M[k]=keys.find(h=>spec[k].some(s=>U.norm(h).includes(s)))||null});return M};
U.toNum=v=>+String(v==null?'':v).replace(/\s/g,'').replace(',','.')||0;

/* ilova karkasi: menyu, rollar, render */
U.app=cfg=>{
 const A={view:cfg.boshlang||cfg.bolimlar[0],rol:'direktor'};
 const bol=()=>cfg.bolimlar.filter(k=>!cfg.rollar||cfg.rollar[A.rol].includes(k));

  U.$('#nav').innerHTML=ks.map(k=>`<button data-v="${k}" class="${A.view===k?'on':''}"><span class="ic">${cfg.mod[k][0]}</span>${cfg.mod[k][1]}${b(k)}</button>`).join('');
  U.$('#mnav').innerHTML=ks.map(k=>`<button data-v="${k}" class="${A.view===k?'on':''}"><span class="ic">${cfg.mod[k][0]}</span>${cfg.mod[k][2]}${b(k)}</button>`).join('')};
 A.render=()=>{if(!bol().includes(A.view))A.view=bol()[0];A.navs();const a=U.$('#app');a.className='';void a.offsetWidth;a.className='fade';cfg.render[A.view](a);try{history.replaceState(null,'','#'+A.view)}catch(e){}};
 A.go=(v,f)=>{A.view=v;if(cfg.onGo)cfg.onGo(v,f);A.render();window.scrollTo(0,0)};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b&&(b.closest('#nav')||b.closest('#mnav')))A.go(b.dataset.v)});

 const r=document.documentElement.style;r.setProperty('--acc',cfg.rang[0]);r.setProperty('--acc2',cfg.rang[1]);r.setProperty('--accbg',cfg.rang[2]);

 const h=location.hash.slice(1);if(cfg.bolimlar.includes(h))A.view=h;
 return A};
window.U=U;
})();
</script>

function kartaO(o){const x=xavf(o),v=vazn(o),ty=tayyorlik(o);const pr=BI(o.bosqich)<=3?Math.min(100,Math.round(v.qadoq/o.kg*100)):null;return`<div class="oc ${x?(x.t==='er'?'late':'soon'):''}" data-o="${o.id}"><div class="r1"><span>${esc(o.raqam)} ${o.transport.tur==='avia'?'✈️':''}</span><span>📅 ${fd(o.oyna[0])}–${fd(o.oyna[1])}</span></div><b>${XRf(o).bayroq} ${esc(XRf(o).nom)}</b><div class="pr">${M(o).nom} · ${t_(o.kg)} · ${esc(o.kalibr)}</div>${pr!=null&&BI(o.bosqich)>=1?`<div class="prog" style="margin:7px 0 2px"><i style="width:${pr}%;background:var(--acc)"></i></div><div class="pr" style="font-size:11.5px">qadoqlangan ${pr}% · tayyorlik ${ty.n}/${ty.c.length}</div>`:''}${x?`<div class="pr" style="color:var(--${x.t});font-weight:700;margin-top:3px">${x.m}</div>`:''}</div>`}
function rYuk(a){const L=filt(),n=id=>D.B.filter(o=>o.bosqich===id).length,nx=D.B.filter(o=>(xavf(o)||{}).t==='er').length;
 a.innerHTML=`<div class="top"><div><h1>Eksport yuklari</h1><div class="sub">${D.B.length} ta · har biri: fermerlar → qadoq → hujjat → yo'l → DC → pul</div></div><span class="sp"></span><button class="btn p" id="nb">＋ Yangi buyurtma</button></div>
 <div class="tools"><input class="inp" id="q" placeholder="🔍 Raqam, xaridor, mahsulot, fura…" value="${esc(F.q)}" style="flex:1;min-width:180px"><div class="seg"><button data-kv="kanban" class="${KV==='kanban'?'on':''}">Bosqichlar</button><button data-kv="royxat" class="${KV==='royxat'?'on':''}">Ro'yxat</button></div></div>
 <div class="chips" style="margin-bottom:14px"><button class="chip ${!F.st&&!F.xavf?'on':''}" data-f="">Hammasi <em>${D.B.length}</em></button><button class="chip ${F.xavf?'on':''}" data-f="xavf" style="${nx&&!F.xavf?'color:var(--er)':''}">⚠ Xavfda <em>${nx}</em></button>${BOS.map(b=>`<button class="chip ${F.st===b.id?'on':''}" data-f="${b.id}"><i class="dot" style="background:${b.r}"></i>${b.nom} <em>${n(b.id)}</em></button>`).join('')}</div><div id="ol"></div>`;
 const ol=$('#ol');if(KV==='kanban'&&!F.st)ol.innerHTML=`<div class="kan">${BOS.map(b=>{const xs=L.filter(o=>o.bosqich===b.id);return`<div class="col"><h4><i class="dot" style="background:${b.r}"></i>${b.nom}<em>${xs.length}</em></h4>${xs.map(kartaO).join('')||'<div class="empty" style="padding:12px">—</div>'}</div>`}).join('')}</div>`;
 else ol.innerHTML=table([{t:'Yuk',f:o=>`<b>${esc(o.raqam)}</b> ${o.transport.tur==='avia'?'✈️':''}`},{t:'Xaridor',f:o=>XRf(o).bayroq+' '+esc(XRf(o).nom)},{t:'Mahsulot',m:1,f:o=>nomi(o)},{t:'Hajm',n:1,f:o=>t_(o.kg)},{t:'Bosqich',f:bpill},{t:'Oyna',m:1,f:o=>fd(o.oyna[0])+'–'+fd(o.oyna[1])},{t:'Foyda',n:1,m:1,f:o=>{const p=pul(o,BI(o.bosqich)>=5);return`<span style="color:${p.f>0?'var(--ok)':'var(--er)'}">${$u(p.f)}</span>`}},{t:'Holat',f:o=>{const x=xavf(o);return x?pill(x.t,x.m):pill('ok','Joyida')}}],L,{click:o=>`data-o="${o.id}"`});

function bosqichga(o,n,izoh){o.bosqich=n;o.tarix.push({v:new Date().toISOString(),m:'Bosqich: '+BN(n)+(izoh?' — '+izoh:'')});logla(`${o.raqam} · ${XRf(o).nom} → ${BN(n)}`,o);save()}
function keyingi(o){const i=BI(o.bosqich);
 if(o.bosqich==='xarid'){const v=vazn(o);if(v.qabul<o.kg*0.95)return toast(`Avval yetarli mahsulot qabul qiling: ${num(v.qabul)} / ${num(o.kg)} kg`);lots(o).forEach(l=>l.qadoq=false);bosqichga(o,'qadoq')}
 else if(o.bosqich==='qadoq'){const r=qadoqla(o);if(!r)return;o.huj.inv=o.huj.pl=true;bosqichga(o,'hujjat',`qadoqlandi: ${num(r.kg)} kg, ${num(r.q)} quti, ${r.p} paddon`);toast(`Qadoqlandi (FEFO): ${r.lots.join(', ')} · tara omboridan ${num(r.q)} quti va ${r.p} paddon chiqarildi`)}
 else if(o.bosqich==='hujjat'){const ty=tayyorlik(o);if(!ty.ok)return toast('Jo‘natishga tayyor emas: '+ty.c.filter(x=>!x[0]).map(x=>x[1].split(' (')[0]).join(', '));o.transport.yuklandi=new Date().toISOString();o.transport.eta=addH(o.transport.tur==='avia'?14:120).toISOString();o.transport.joy=0;o.transport.harorat=[o.transport.setpoint];o.jonKg=vazn(o).qadoq;if(XRf(o).edi)o.edi.desadv=true;bosqichga(o,'yolda');xabar('xaridor',`${XRf(o).nom}: «${o.raqam} jo‘natildi — ${t_(o.jonKg)}, ${o.transport.raqam}, ETA ${fd(o.transport.eta)}»`)}
 else if(o.bosqich==='yolda'){o.transport.joy=YOL[o.transport.tur].length-1;o.dcKg=Math.round(o.jonKg*0.996);o.dcSana=iso(T);if(XRf(o).edi)o.edi.akt=true;bosqichga(o,'dc','DC qabul qildi');toast(`DC qabul qildi: ${num(o.dcKg)} kg (yo‘ldagi qisqarish ${num(o.jonKg-o.dcKg)} kg)`)}
 else if(o.bosqich==='dc'){if(o.davo&&o.davo.holat!=='hal')return toast('Avval da‘voni hal qiling');if(xQol(o)>1)return toast('Xaridor to‘lovi hali to‘liq emas');bosqichga(o,'yopildi')}
 else if(o.bosqich==='kelishildi')bosqichga(o,'xarid','fermerlarga taqsimlanmoqda');
 APP.render();if($('#mo'))ochO(o.id)}

function qadoqla(o){const mh=M(o);const ls=lots(o).map(l=>({l,q:mh.kun*24-(Date.now()-new Date(l.sana))/36e5,bor:l.nav1+l.nav2-(l.qadoqKg!=null?l.qadoqKg:(l.qadoq?l.nav1+l.nav2:0))})).filter(x=>x.bor>0).sort((a,b)=>a.q-b.q);
 const kerak=Math.max(0,o.kg/0.985-lots(o).reduce((a,l)=>a+(l.qadoqKg!=null?l.qadoqKg:(l.qadoq?l.nav1+l.nav2:0)),0));let sum=0;const plan=[];for(const x of ls){if(sum>=kerak-1e-6)break;const t=Math.min(x.bor,kerak-sum);plan.push({l:x.l,kg:+t.toFixed(3)});sum+=t}
 const pk=Math.round(sum*0.985),q=Math.ceil(pk/qutiKg(o)),p=Math.ceil(q/mh.paddon);const tq=D.tara.find(t=>t.nom===o.qadoqTur)||D.tara.find(t=>t.nom===mh.qutiNom),tp=D.tara.find(t=>t.nom==='Yevro paddon'),tb=D.tara.find(t=>t.nom.startsWith('Burchak')),ts=D.tara.find(t=>t.nom.startsWith('Strech'));
 const need=[[tq,q],[tp,p],[tb,p*4],[ts,+(p*0.2).toFixed(1)]].filter(x=>x[0]);const kam=need.filter(([t,n])=>t.qoldiq<n);
 if(!plan.length){toast('Qadoqlash uchun qabul qilingan mahsulot yo\u2018q');return null}
 if(kam.length){toast('Tara yetmaydi: '+kam.map(([t,n])=>`${t.nom} — kerak ${num(n)}, bor ${num(t.qoldiq)}`).join('; ')+' — avval kirim qiling');return null}
 need.forEach(([t,n])=>t.qoldiq=+(t.qoldiq-n).toFixed(1));plan.forEach(({l,kg})=>{l.qadoqKg=(l.qadoqKg!=null?l.qadoqKg:(l.qadoq?l.nav1+l.nav2:0))+kg;l.qadoqKg=+l.qadoqKg.toFixed(3);l.qadoq=l.qadoqKg>=l.nav1+l.nav2-1e-6});
 const cost=need.reduce((a,[t,n])=>a+t.narx*n,0);o.fakt=o.fakt||{};o.fakt.qd=Math.round(cost);
 D.taraLog.unshift({v:new Date().toISOString(),m:`Sarf (${o.raqam}): `+need.map(([t,n])=>`${t.nom} −${num(n)}`).join(', ')+(tq&&tq.nom.includes('aylanma')?' (aylanma yashiklar DC dan qaytariladi)':'')});
 o.qadoqInfo={kg:pk,q,p,lots:plan.map(x=>x.l.id+': '+num(x.kg)+' kg')};return{kg:pk,q,p,lots:plan.map(x=>x.l.id+' ('+num(x.kg)+' kg)')}}
