
<dialog class="c-modal" data-server-modal aria-labelledby="m-title">
  <div class="c-modal__head"><h2 id="m-title">Yangi lid</h2>
    <button type="button" class="c-btn c-btn--ghost c-btn--icon" data-modal-close aria-label="Yopish"><svg class="icon" aria-hidden="true" focusable="false"><use href="/demo/atlantis-4/static/icons.svg#i-x"></use></svg></button></div>
  
<form class="c-modal__form-wrap" method="post" action="/demo/atlantis-4/r/owner/panel/lidlar/yangi/" hx-post="/demo/atlantis-4/r/owner/panel/lidlar/yangi/" hx-swap="none" novalidate>
  
  <div class="c-modal__body">
    
    <p class="muted">Majburiy — faqat ism va telefon. Qolganini keyin to'ldirish mumkin.</p>
    
<div class="c-form-section">
  <div class="c-grid-2">
<div class="c-field">
  
    <label class="c-field__label" for="id_full_name">Ismi<span class="req" aria-hidden="true">*</span></label>
    <input type="text" name="full_name" autocomplete="off" autofocus="" maxlength="120" class="c-input" required id="id_full_name">
  
  
  
</div>

<div class="c-field">
  
    <label class="c-field__label" for="id_phone">Telefon<span class="req" aria-hidden="true">*</span></label>
    <input type="text" name="phone" data-phone="" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel" maxlength="20" class="c-input" aria-describedby="id_phone-hint" required id="id_phone">
  
  <div class="c-field__hint" id="id_phone-hint">Shu raqam bilan ochiq lid bo&#x27;lsa — yangisi ochilmaydi, eskisiga izoh qo&#x27;shiladi</div>
  
</div>
</div>
  <div class="c-grid-2">
<div class="c-field">
  
    <label class="c-field__label" for="id_course">Qaysi kurs</label>
    <select name="course" class="c-select" id="id_course">
  <option value="" selected>— hali aniq emas —</option>

  <option value="1">Ingliz tili — A1 (Boshlang&#x27;ich)</option>

  <option value="2">Ingliz tili — A2 (Elementar)</option>

  <option value="3">Ingliz tili — B1 (O&#x27;rta)</option>

  <option value="4">Ingliz tili — B2 (O&#x27;rtadan yuqori)</option>

  <option value="5">Ingliz tili — C1 (Yuqori)</option>

  <option value="6">IELTS tayyorlov</option>

  <option value="7">Bolalar ingliz tili</option>

  <option value="8">Arab tili</option>

  <option value="9">Turk tili</option>

  <option value="10">Koreys tili (TOPIK)</option>

  <option value="11">Xitoy tili (HSK)</option>

  <option value="12">Yapon tili</option>

  <option value="13">Nemis tili</option>

  <option value="14">Fransuz tili</option>

  <option value="15">Ispan tili</option>

  <option value="16">Italyan tili</option>

  <option value="17">Polyak tili</option>

  <option value="18">Rus tili</option>

  <option value="19">Fors tili</option>

  <option value="20">Matematika (OTM)</option>

  <option value="21">Fizika</option>

  <option value="22">Kimyo</option>

  <option value="23">Biologiya</option>

  <option value="24">Tarix</option>

  <option value="25">Bolalar matematikasi</option>

  <option value="26">Kompyuter savodxonligi va Excel</option>

  <option value="27">AutoCAD va 3Ds Max</option>

  <option value="28">Grafik dizayn</option>

  <option value="29">Web dasturlash</option>

  <option value="30">Buxgalteriya 1C 8.3</option>

  <option value="31">Bojxona deklaratsiyasi</option>

  <option value="32">Kadrlar ish yuritishi (HR)</option>

</select>
  
  
  
</div>

<div class="c-field">
  
    <label class="c-field__label" for="id_preferred_time">Qulay vaqt</label>
    <input type="text" name="preferred_time" placeholder="Masalan: kechqurun, 18:00 dan keyin" maxlength="60" class="c-input" id="id_preferred_time">
  
  
  
</div>
</div>
  <div class="c-grid-2">
<div class="c-field">
  
    <label class="c-field__label" for="id_source">Qayerdan bildi<span class="req" aria-hidden="true">*</span></label>
    <select name="source" class="c-select" id="id_source">
  <option value="walkin" selected>O&#x27;zi keldi</option>

  <option value="phone">Qo&#x27;ng&#x27;iroq qildi</option>

  <option value="friend">Tanish-bilish</option>

  <option value="instagram">Instagram</option>

  <option value="telegram">Telegram</option>

  <option value="tg-kanal">Telegram kanal</option>

  <option value="banner">Banner/Reklama</option>

  <option value="site">Sayt</option>

  <option value="other">Boshqa</option>

</select>
  
  
  
</div>
</div>
  <input type="hidden" name="branch" value="1" id="id_branch">
  
<div class="c-field">
  
    <label class="c-check"><input type="checkbox" name="is_minor" id="id_is_minor"><span>Voyaga yetmagan (ota-ona yozilmoqda)</span></label>
  
  
  
</div>

</div>
<details class="c-form-section more">
  <summary>Izoh qo'shish</summary>
  
<div class="c-field">
  
    <label class="c-field__label" for="id_note">Izoh</label>
    <textarea name="note" cols="40" rows="2" maxlength="500" class="c-textarea" id="id_note">
</textarea>
  
  
  
</div>

</details>
<div class="c-form-section">
<div class="c-field">
  
    <label class="c-check"><input type="checkbox" name="consent" required id="id_consent"><span>Shaxsiy ma&#x27;lumotlarni qayta ishlashga rozilik olindi (og&#x27;zaki yoki yozma)<span class="req" aria-hidden="true">*</span></span></label>
  
  
  
</div>
</div>

    
  </div>
  <div class="c-modal__foot">
    <button type="button" class="c-btn c-btn--secondary" data-modal-close>Bekor qilish</button>
    <button type="submit" class="c-btn c-btn--primary">Qo'shish</button>
  </div>
</form>

</dialog>
