<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бошқарув — ALFIRDAVS TM</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF8F4">
<script src="js/tema.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/server.css">
<link rel="stylesheet" href="css/namuna.css">
</head>
<body class="pn">
<!-- Matnlar shu faylda YO'Q: har element `data-t` kaliti bo'yicha js/qatlam.js dagi lug'atdan (ЎЗ / RU) to'ldiriladi. -->
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15"/><path d="M15 6v15"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="m7 4-4 4h8Z"/><path d="M7 8v12"/><path d="m17 20 4-4h-8Z"/><path d="M17 16V4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>

<!-- KIRISH -->
<section class="pin" id="loginView" aria-labelledby="pin-h" hidden>
  <form class="pin__card" id="loginForm" novalidate>
    <button type="button" class="pbtn pbtn--tema pbtn--pin" data-tema-btn aria-pressed="false" data-ta="tema.tun"><svg class="ic tema__tun" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ic tema__kun" aria-hidden="true"><use href="#i-sun"/></svg></button>
    <div class="til til--pin" role="group" data-ta="til.aria"><button type="button" data-til="uzc" aria-pressed="true" lang="uz-Cyrl">ЎЗ</button><button type="button" data-til="ru" aria-pressed="false" lang="ru">RU</button></div>
    <img class="pin__logo" src="img/logo.svg" width="64" height="64" alt="">
    <h1 id="pin-h" data-t="kirish.h"></h1>
    <p>ALFIRDAVS TM</p>
    <label class="pin__lbl" for="lgLogin" data-t="kirish.login"></label>
    <input class="lg__in" id="lgLogin" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" required>
    <label class="pin__lbl" for="lgParol" data-t="kirish.parol"></label>
    <input class="lg__in" id="lgParol" name="password" type="password" autocomplete="current-password" maxlength="200" required aria-describedby="lgErr">
    <div id="lgKodW" hidden>
      <label class="pin__lbl" for="lgKod" data-t="kirish.kod"></label>
      <input class="lg__in num" id="lgKod" name="one-time-code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="12">
    </div>
    <p class="pin__err" id="lgErr" aria-live="polite"></p>
    <button class="btn btn--red btn--lg btn--block" type="submit" id="lgBtn"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span data-t="kirish.btn"></span></button>
  </form>
</section>

<!-- PANEL -->
<div class="app" id="app" hidden>
  <header class="ptop">
    <div class="ptop__in">
      <div class="brand"><img class="brand__mark" src="img/logo.svg" width="36" height="36" alt=""><span class="brand__txt"><span class="brand__name">ALFIRDAVS <b>TM</b></span><span class="ptop__sub" data-t="top.sub"></span></span></div>
      <div class="ptop__r">
        <div class="til" role="group" data-ta="til.aria"><button type="button" data-til="uzc" aria-pressed="true" lang="uz-Cyrl">ЎЗ</button><button type="button" data-til="ru" aria-pressed="false" lang="ru">RU</button></div>
        <a class="pbtn" id="siteLink" href="./" target="_blank" rel="noopener noreferrer" data-ta="top.sayt"><span data-t="top.sayt"></span><svg class="ic" aria-hidden="true"><use href="#i-ext"/></svg></a>
        <button type="button" class="pbtn pbtn--tema" data-tema-btn aria-pressed="false" data-ta="tema.tun"><svg class="ic tema__tun" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ic tema__kun" aria-hidden="true"><use href="#i-sun"/></svg></button>
        <button type="button" class="pbtn" id="logout"><svg class="ic" aria-hidden="true"><use href="#i-out"/></svg><span data-t="top.chiqish"></span></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" data-ta="nav.aria">
      <button type="button" role="tab" id="tab-p" data-och="p" aria-controls="v-p" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-box"/></svg><span data-t="nav.mahsulot"></span></button>
      <button type="button" role="tab" id="tab-m" data-och="m" aria-controls="v-m" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span data-t="nav.sozlama"></span></button>
    </nav>
  </header>

  <main class="pmain">
    <div class="pub" id="pub" hidden role="status">
      <p><b data-t="pub.h"></b> <span id="pubInfo"></span></p>
      <div class="pub__b">
        <button type="button" class="btn btn--line btn--sm" id="pubKor"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span data-t="pub.kor"></span></button>
        <button type="button" class="btn btn--red btn--sm" id="pubOk"><span data-t="pub.ok"></span></button>
        <button type="button" class="btn btn--line btn--sm pub__no" id="pubNo"><span data-t="pub.no"></span></button>
      </div>
    </div>
    <p class="ferr pub__err" id="pubErr" aria-live="assertive"></p>

    <!-- BOSH EKRAN: mahsulotlar va holati -->
    <section class="view" id="v-p" role="tabpanel" aria-labelledby="tab-p">
      <p class="note" id="note" data-t="p.note"></p>
      <div class="warn" id="tasdiqYoq" hidden><p data-t="p.tasdiqyoq"></p><button type="button" class="btn btn--line btn--sm" data-och="m" data-joy="sTasdiqBox"><span data-t="p.tasdiqbtn"></span></button></div>
      <div class="vhead">
        <h2><span data-t="p.h"></span> <small class="num" id="pCount"></small></h2>
        <button type="button" class="btn btn--red" id="pAdd"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-t="p.add"></span></button>
      </div>
      <div class="chips chips--scroll pfilter" id="pFilter" role="group" data-ta="p.filter"></div>
      <ul class="plist" id="pList"></ul>
      <div class="pfoot">
        <button type="button" class="linkbtn" id="pOrd" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-sort"/></svg><span data-t="p.ord"></span></button>
        <button type="button" class="linkbtn" id="pKor"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span data-t="kor.btn"></span></button>
      </div>
    </section>

    <!-- SOZLAMALAR: qolgan hamma narsa shu yerdan ochiladi -->
    <section class="view" id="v-m" role="tabpanel" aria-labelledby="tab-m" hidden>
      <div class="vhead"><h2 data-t="m.h"></h2></div>
      <div class="mlist">
        <button type="button" class="mrow" id="mKor"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></span><span class="mrow__t"><b data-t="kor.btn"></b><small data-t="m.kor.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-c" data-och="c"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg></span><span class="mrow__t"><b data-t="m.c"></b><small data-t="m.c.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-r" data-och="r"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg></span><span class="mrow__t"><b data-t="m.r"></b><small data-t="m.r.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-t" data-och="t"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-box"/></svg></span><span class="mrow__t"><b data-t="m.t"></b><small data-t="m.t.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-x" data-och="x"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-doc"/></svg></span><span class="mrow__t"><b data-t="m.x"></b><small data-t="m.x.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-h" data-och="h"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-hist"/></svg></span><span class="mrow__t"><b data-t="m.h2"></b><small data-t="m.h2.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
        <button type="button" class="mrow" id="tab-s" data-och="s"><span class="mrow__ic"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg></span><span class="mrow__t"><b data-t="m.s"></b><small data-t="m.s.d"></small></span><svg class="ic mrow__go" aria-hidden="true"><use href="#i-chev"/></svg></button>
      </div>
      <div class="box" id="sTasdiqBox">
        <h3 data-t="tas.h"></h3>
        <p class="box__p" data-t="tas.p"></p>
        <label class="chk"><input type="checkbox" id="sTasdiq"><span data-t="tas.chk"></span></label>
      </div>
      <div class="box">
        <h3 data-t="exp.h"></h3>
        <p class="box__p" data-t="exp.p"></p>
        <button type="button" class="btn btn--line btn--block" id="exportAll"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg><span data-t="exp.btn"></span></button>
      </div>
      <p class="kim"><span data-t="m.kim"></span> <b id="meLogin"></b></p>
    </section>

    <!-- Hududlar -->
    <section class="view" id="v-r" role="region" aria-labelledby="r-h" hidden>
      <button type="button" class="back" data-och="m"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span data-t="orqaga"></span></button>
      <div class="vhead"><h2 id="r-h" data-t="m.r"></h2></div>
      <form class="box" id="l2Form" novalidate>
        <h3 data-t="l2.h"></h3>
        <p class="l2__p" data-t="l2.p"></p>
        <div class="l2opts" id="l2Opts" role="radiogroup" aria-labelledby="l2-h">
          <label><input type="radio" name="l2" value="region"><span data-t="l2.region"></span></label>
          <label><input type="radio" name="l2" value="maker"><span data-t="l2.maker"></span></label>
          <label><input type="radio" name="l2" value="plant"><span data-t="l2.plant"></span></label>
          <label><input type="radio" name="l2" value="own"><span data-t="l2.own"></span></label>
        </div>
        <fieldset class="tg" data-tg="l2w" id="l2W" hidden><legend data-t="l2.oz"></legend>
          <div class="tg__row" data-l="uzc"><label for="l2Uzc">ЎЗ</label><input id="l2Uzc" type="text" maxlength="30"></div>
          <div class="tg__row" data-l="ru"><label for="l2Ru">RU</label><input id="l2Ru" type="text" maxlength="30"></div>
          <div class="tg__row" data-l="en"><label for="l2En">EN</label><input id="l2En" type="text" maxlength="30"></div>
        </fieldset>
        <p class="ferr" id="l2Err" aria-live="polite"></p>
        <button class="btn btn--line btn--block" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-t="saqlash"></span></button>
      </form>
      <form class="box" id="rForm" novalidate>
        <h3 data-t="r.yangi"></h3>
        <div class="fld"><label for="rCountry" data-t="f.davlat"></label><select id="rCountry"></select></div>
        <fieldset class="tg" data-tg="r"><legend data-t="r.nomi"></legend>
          <div class="tg__row" data-l="uzc"><label for="rUzc">ЎЗ</label><input id="rUzc" type="text" maxlength="40"></div>
          <div class="tg__row" data-l="ru"><label for="rRu">RU</label><input id="rRu" type="text" maxlength="40"></div>
          <div class="tg__row" data-l="en"><label for="rEn">EN</label><input id="rEn" type="text" maxlength="40"></div>
        </fieldset>
        <p class="ferr" id="rErr" aria-live="polite"></p>
        <button class="btn btn--red btn--block" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-t="r.add"></span></button>
      </form>
      <div id="rList"></div>
    </section>

    <!-- Sahifa matnlari: raqamlar, sertifikatlar, galereya, savol-javob, shartlar, mahsulot tavsifi -->
    <section class="view" id="v-x" role="region" aria-labelledby="x-h" hidden>
      <button type="button" class="back" data-och="m"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span data-t="orqaga"></span></button>
      <div class="vhead"><h2 id="x-h" data-t="m.x"></h2></div>
      <div class="box">
        <p class="box__p" data-t="x.p"></p>
        <div class="fld"><label for="xSec" data-t="x.sec"></label><select id="xSec">
          <option value="stats" data-t="x.stats"></option>
          <option value="certs" data-t="x.certs"></option>
          <option value="gallery" data-t="x.gallery"></option>
          <option value="faq" data-t="x.faq"></option>
          <option value="terms" data-t="x.terms"></option>
          <option value="spec" data-t="x.spec"></option>
        </select></div>
        <div class="fld" id="xTypeRow" hidden><label for="xType" data-t="f.tur"></label><select id="xType"></select></div>
      </div>
      <div id="xList"></div>
      <p class="ferr" id="xErr" aria-live="polite"></p>
      <div class="xbtns">
        <button type="button" class="btn btn--line" id="xAdd"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-t="x.add"></span></button>
        <button type="button" class="btn btn--red" id="xSave"><span data-t="saqlash"></span></button>
      </div>
    </section>

    <!-- Aloqa -->
    <section class="view" id="v-c" role="region" aria-labelledby="c-h" hidden>
      <button type="button" class="back" data-och="m"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span data-t="orqaga"></span></button>
      <div class="vhead"><h2 id="c-h" data-t="m.c"></h2></div>
      <form class="box" id="cForm" novalidate>
        <p class="box__p" data-t="c.p"></p>
        <div class="fld"><label for="cPhone" data-t="c.phone"></label><input id="cPhone" type="tel" inputmode="tel" maxlength="24" placeholder="+998 99 905 11 44" aria-describedby="e-cPhone"><small class="ferr" id="e-cPhone"></small></div>
        <div class="fld"><label for="cPhone2" data-t="c.phone2"></label><input id="cPhone2" type="tel" inputmode="tel" maxlength="24" placeholder="+998 99 784 11 44" aria-describedby="e-cPhone2"><small class="ferr" id="e-cPhone2"></small></div>
        <div class="fld"><label for="cTg">Telegram</label><input id="cTg" type="text" maxlength="60" data-tp="c.tg.ph" aria-describedby="e-cTg"><small class="ferr" id="e-cTg"></small></div>
        <div class="fld"><label for="cWa" data-t="c.wa"></label><input id="cWa" type="tel" inputmode="tel" maxlength="24" data-tp="c.wa.ph" aria-describedby="e-cWa"><small class="ferr" id="e-cWa"></small></div>
        <div class="fld"><label for="cMax" data-t="c.max"></label><input id="cMax" type="text" maxlength="200" data-tp="c.max.ph" aria-describedby="e-cMax"><small class="ferr" id="e-cMax"></small></div>
        <div class="fld"><label for="cIg">Instagram</label><input id="cIg" type="text" maxlength="100" data-tp="c.ig.ph" aria-describedby="e-cIg"><small class="ferr" id="e-cIg"></small></div>
        <fieldset class="tg" data-tg="cAddr"><legend data-t="c.addr1"></legend>
          <div class="tg__row" data-l="uzc"><label for="cAddrUzc">ЎЗ</label><input id="cAddrUzc" type="text" maxlength="140"></div>
          <div class="tg__row" data-l="ru"><label for="cAddrRu">RU</label><input id="cAddrRu" type="text" maxlength="140"></div>
          <div class="tg__row" data-l="en"><label for="cAddrEn">EN</label><input id="cAddrEn" type="text" maxlength="140"></div>
        </fieldset>
        <div class="fld"><label for="cMap" data-t="c.map1"></label><input id="cMap" type="url" maxlength="300" placeholder="https://yandex.uz/maps/..." aria-describedby="e-cMap"><small class="ferr" id="e-cMap"></small></div>
        <fieldset class="tg" data-tg="cAddr2"><legend data-t="c.addr2"></legend>
          <div class="tg__row" data-l="uzc"><label for="cAddr2Uzc">ЎЗ</label><input id="cAddr2Uzc" type="text" maxlength="140"></div>
