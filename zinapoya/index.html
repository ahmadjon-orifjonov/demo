    <!-- PWA: «Bosh ekranga qo'shish» — ilova kabi to'liq ekranda ochiladi (DEMO_APP.md §3). Ranglar = ilova foni (tokens.ts). -->
    <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zinapoya" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/demo/zinapoya/manifest.json" />
    <link rel="apple-touch-icon" href="/demo/zinapoya/icons/apple-touch-icon.png" />
    <script>
      // GitHub Pages: ichki manzil (masalan /demo/zinapoya/home) yangilansa sayt ildizidagi 404.html bu yerga «?p=/home» bilan
      // yo'naltiradi — ilova yuklanishidan oldin asl manzil tiklanadi (expo-router to'g'ri ekranni ochadi). Faqat shu sayt ichidagi yo'l.
      (function () {
        var m = /[?&]p=([^&]*)/.exec(location.search);
        if (!m) return;
        var p = decodeURIComponent(m[1]);
        if (p.charAt(0) !== '/' || p.charAt(1) === '/' || p.indexOf('\\') !== -1) return;
        try {
          history.replaceState(null, '', location.pathname.replace(/\/$/, '') + p + location.hash);
        } catch (e) {}
      })();
    </script>
    <script>
      // Kompyuterda (keng oyna + sichqoncha) ilova telefon ramkasida ochiladi: /ramka.html → shu sahifa iframe ichida,
      // shuning uchun Dimensions / Modal / varaqlar telefon o'lchamida ishlaydi (DEMO_APP.md §2).
      // ?ramka=0 — ramkasiz (shu tab uchun eslab qoladi), ?ramka=1 — majburan ramkada. Telefon, planshet, o'rnatilgan PWA — ramkasiz.
      (function () {
        var html = document.documentElement;
        if (window.self !== window.top) {
          html.className += ' ramkada';
          return;
        }
        var mode = null;
        var q = new URLSearchParams(location.search);
        try {
          if (q.has('ramka')) sessionStorage.setItem('zinapoya.ramka', q.get('ramka') === '0' ? '0' : '1');
          mode = sessionStorage.getItem('zinapoya.ramka');
        } catch (e) {
          mode = q.get('ramka');
        }
        var installed = window.matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches || navigator.standalone === true;
        var desktop = window.matchMedia('(min-width: 600px) and (hover: hover) and (pointer: fine)').matches && !navigator.webdriver;
        if (installed || mode === '0' || (mode !== '1' && !desktop)) return;
        q.delete('ramka');
        var rest = q.toString();
        location.replace('/demo/zinapoya/ramka.html#' + location.pathname + (rest ? '?' + rest : '') + location.hash);
      })();
      // Oflayn kesh — faqat yig'ilgan versiyada (dev serverda `.bundle?` skripti bor → ro'yxatdan o'tkazilmaydi, eskisi o'chiriladi).
      window.addEventListener('load', function () {
        if (!('serviceWorker' in navigator)) return;
        var dev = [].some.call(document.scripts, function (s) {
          return /\.bundle(\?|$)/.test(s.src);
        });
        if (dev) {
          navigator.serviceWorker.getRegistrations().then(function (list) {
            list.forEach(function (r) {
              r.unregister();
            });
          }, function () {});
          return;
        }
        navigator.serviceWorker.register('/demo/zinapoya/sw.js', { scope: '/demo/zinapoya/' }).catch(function () {});
      });
    </script>
    <!-- react-native-web tavsiya qilgan asos (expo shabloni) + ilova foni birinchi kadrdan (oq chaqnashsiz) -->
    <style id="expo-reset">
      html {
        background-color: #f7f7f8;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;

        html {
          background-color: #0f1115;
        }
      }
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Telefon ramkasi ichida — telefondagidek aylantirish chizig'isiz (g'ildirak / sensor panel bilan aylanadi) */
      html.ramkada,
      html.ramkada * {
        scrollbar-width: none;
      }
      html.ramkada ::-webkit-scrollbar {
        display: none;
      }
    </style>
