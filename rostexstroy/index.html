<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROSTEXSTROY — boshqaruv tizimi (namuna)</title>
<meta name="robots" content="noindex">
<meta name="description" content="ROSTEXSTROY uchun namuna: buyurtmalar, sex bosqichlari, ip va mato ombori, bo‘yoqxona, jo‘natma, to‘lov va ishbay oylik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--acc:#1f4e79;--acc2:#173d60;--accbg:#e8eef5;--bg:#f4f6f8;--card:#fff;--tx:#1b2533;--mut:#525e6d;--ln:#dfe4ea;--ok:#15803d;--okbg:#eef7f1;--wr:#b45309;--wrbg:#fdf6ec;--er:#b42318;--erbg:#fdf1f0;--side:#0f1b2b;--sidetx:#c3ccd8;--soft:#f4f6f8;--r:8px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.namuna{background:var(--soft);color:var(--mut);border-bottom:1px solid var(--ln);font-size:12px;text-align:center;padding:5px 12px}
.namuna b{color:var(--wr)}
.lay{display:flex;min-height:calc(100vh - 30px)}
.side{width:236px;flex:none;background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 30px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{color:#94a3b8;font-size:12px}
.logo{width:38px;height:38px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-left:2px solid transparent;background:none;color:var(--sidetx);padding:10px 12px;border-radius:0 6px 6px 0;text-align:left;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:#7fa7d6}
.nav .ic{width:20px;display:inline-flex;align-items:center;justify-content:center}
.nav .bdg,.mnav .bdg{margin-left:auto;background:var(--er);color:#fff;border-radius:3px;font-size:11px;padding:0 5px;font-weight:600}
.sidefoot{padding:12px 16px;font-size:12px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot button{background:none;border:1px solid rgba(255,255,255,.18);color:#94a3b8;border-radius:6px;padding:5px 9px;font-size:12px;margin-top:6px}
.rolsel{width:100%;background:rgba(255,255,255,.06);color:#dfe4ea;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:6px}
.rolsel option{color:var(--tx)}
.rolsel.m{width:auto;background:#fff;color:var(--tx);border-color:var(--ln);margin:0}
.main{flex:1;min-width:0;padding:22px 26px 90px}
.mhead{display:none;align-items:center;gap:10px;margin:-2px 0 14px}
.mhead b{font-size:15px}.mhead small{color:var(--mut);font-size:12px;display:block}
.mhead .logo{border-color:var(--acc);color:var(--acc)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800}
.top .sub{color:var(--mut);font-size:13px}
.top .sp{flex:1}
.btn{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cbd5e1}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc2)}
.btn.s{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k5{grid-template-columns:repeat(5,1fr)}.k2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
.card h3 .sp{flex:1}.card h3 small{font-weight:600;color:var(--mut);font-size:12px}
.card h3>svg.i{color:#475569}
.kpi{cursor:pointer;border-left:2px solid var(--ln)}
.kpi:hover{border-color:#cbd5e1}
.kpi .l{color:var(--mut);font-size:13px;font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .v small{font-size:14px;font-weight:700}
.kpi .d{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.er{border-left-color:var(--er)}.kpi.er .d{color:var(--er);font-weight:700}
.kpi.wr{border-left-color:var(--wr)}.kpi.wr .d{color:var(--wr);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{border-color:#c9e3d2;color:var(--ok)}
.pill.wr{border-color:#f1dcc0;color:var(--wr)}
.pill.er{border-color:#f0c9c5;color:var(--er)}
.pill.mu{background:var(--soft);color:#475569}
.pill.ac{background:var(--accbg);color:var(--acc2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.stagebar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--soft)}
.stagebar div{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.leg span{display:flex;align-items:center;gap:6px;cursor:pointer;color:#475569}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.list .it:last-child{border:0}
.list .it:hover{background:#f4f6f8}
.list .it .m{flex:1;min-width:0}
.list .it .m b{display:block;font-size:14px}
.list .it .m.tx b{display:inline;font-size:inherit}
.list .it .m small{color:var(--mut);font-size:12px}
.list .it>svg.i{color:#94a3b8;flex:none}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:3px 3px 0 0}
.bars .b small{font-size:11px;color:var(--mut)}
.bars .b em{font-style:normal;font-size:11px;font-weight:700;color:#475569}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:8px 11px;min-width:0}
.inp:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.inp.big{font-size:18px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.chip em{font-style:normal;opacity:.65;font-size:12px}
.seg{margin-bottom:14px;display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#f4f6f8;border:1px solid var(--ln);border-radius:var(--r);padding:10px;min-height:120px}
.col>h4{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:7px}
.col>h4 em{margin-left:auto;font-style:normal;background:#fff;border-radius:4px;padding:0 7px;font-size:12px;color:var(--mut)}
.oc{background:#fff;border:1px solid var(--ln);border-left:2px solid var(--ln);border-radius:6px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.oc:hover{border-color:#cbd5e1}
.oc.late{border-left-color:var(--er)}.oc.soon{border-left-color:var(--wr)}
.oc .r1{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut);font-weight:700}
.oc b{display:block;margin:3px 0 2px;font-size:14px}
.oc .pr{font-size:13px;color:#475569}
.oc .r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:#f4f6f8}
.t td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:#f4f6f8}
.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:#fff}
.mod{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:#fff;border-radius:8px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 8px 14px rgba(0,0,0,.18);animation:up .18s}
@keyframes up{from{transform:translateY(10px);opacity:.6}}
.box .hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:2}
.box .hd h2{margin:0;font-size:18px;font-weight:800}
.box .hd .x{margin-left:auto;border:0;background:var(--soft);border-radius:6px;width:34px;height:34px;font-size:18px}
.box .bd{padding:16px 18px}
.ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:#fff}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.dl div small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.dl div b{font-size:14px}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center}
.prog{height:8px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.prog.tam i{background:var(--ok)}.oc.late .prog i{background:var(--er)}.oc.soon .prog i{background:var(--wr)}
.hist{font-size:13px;border-left:2px solid var(--ln);margin-left:4px;padding-left:12px}
.hist div{margin-bottom:7px;position:relative}
.hist div:before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hist small{color:var(--mut)}
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.frm.f5{grid-template-columns:repeat(3,1fr)}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#475569}
.frm .w2{grid-column:span 2}.frm .inp{width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:80;box-shadow:0 6px 14px rgba(0,0,0,.2);display:flex;gap:9px;align-items:center;max-width:calc(100vw - 32px)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--wrbg);color:var(--wr);font-size:13px;margin-bottom:12px}
.alert.er{background:var(--erbg);color:var(--er)}
.note{font-size:12px;color:var(--mut)}
.zanjir{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.zn{flex:1 1 140px;display:flex;flex-direction:column;gap:1px;padding:9px 10px 9px 34px;border-radius:6px;background:#f4f6f8;border:1px solid var(--ln);border-left:2px solid #cbd5e1;position:relative;min-width:0}
.zn i{position:absolute;left:9px;top:10px;color:#94a3b8;font-style:normal}
.zn b{font-size:13px}.zn small{font-size:12px;color:var(--mut);line-height:1.3}
.zn.ok{border-left-color:var(--ok)}.zn.ok i{color:var(--ok)}
.zn.er{background:var(--erbg);border-left-color:var(--er)}.zn.er i{color:var(--er)}.zn.er small{color:var(--er)}
.zn.wr{background:var(--wrbg);border-left-color:var(--wr)}.zn.wr i{color:var(--wr)}
.verdict{margin-top:10px;padding:11px 13px;border-radius:6px;display:flex;flex-direction:column;gap:3px;font-size:13px;border-left:2px solid currentColor}
.verdict b{font-size:15px}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.er{background:var(--erbg);color:var(--er)}
.wfc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.wfc>div{background:var(--soft);border-radius:6px;padding:8px 11px;flex:1 1 120px}
.wfc>div small{display:block;color:var(--mut);font-size:11px}
.wfc>div b{font-size:14px}
.wfc>div.last{background:var(--wrbg)}
.route{display:flex}
.rs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;color:var(--mut);position:relative}
.rs i{width:10px;height:10px;border-radius:50%;background:#cbd5e1;z-index:1}
.rs:before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:2px;background:#cbd5e1}
.rs:first-child:before{display:none}
.rs.on i,.rs.on:before{background:var(--acc)}
.rs.on span{color:var(--tx);font-weight:700}
.rs span{line-height:1.2;white-space:nowrap}
.cc{display:inline-block;font-size:10px;font-weight:800;background:#dfe4ea;color:#475569;border-radius:3px;padding:0 4px;vertical-align:2px}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.nav .ic svg.i,.mnav .ic svg.i{width:19px;height:19px;vertical-align:middle}
.btn svg.i{width:16px;height:16px}
.alert svg.i,.pill svg.i{width:14px;height:14px}
.mnav{display:none}
.fade{animation:fd .2s}
@keyframes fd{from{opacity:0}}
@media (max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.k5{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr}}
@media (max-width:860px){
 .side{display:none}.main{padding:14px 14px 92px}.top h1{font-size:18px}
 .mhead{display:flex}
 .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom));overflow-x:auto}
 .mnav button{flex:1 0 58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--mut);padding:5px 2px;position:relative}
 .mnav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
 .mnav .bdg{position:absolute;top:1px;right:calc(50% - 20px);margin:0}
 .k5,.k4{grid-template-columns:repeat(2,1fr)}
 .dl{grid-template-columns:repeat(2,1fr)}
 .frm,.frm.f5{grid-template-columns:1fr}.frm .w2{grid-column:auto}
 .box{border-radius:8px 8px 0 0;max-height:94vh;align-self:flex-end}.mod{padding:0;align-items:flex-end}
 .kan{grid-auto-columns:minmax(76vw,1fr)}
 .hide-m{display:none}
}
@media print{body *{visibility:hidden}.box,.box *{visibility:visible}.box{position:absolute;left:0;top:0;box-shadow:none;max-height:none;width:100%}.mod{background:none}.ft,.x{display:none!important}}

/* v2 */
.sidefoot label,#rolsel,#rolsel2{display:none}
.blok{margin-top:14px}.mt{margin-top:6px}.mt2{margin-top:14px}
:is(b,span,small,em).er{color:var(--er)}:is(b,span,small,em).wr{color:var(--wr)}:is(b,span,small,em).ok{color:var(--ok)}.pr.mut{color:var(--mut)}
.wide{width:100%;justify-content:center}
.xulosa{font-size:15px;line-height:1.55;margin-bottom:14px}
.xulosa b{font-weight:800}
.kartalar{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-items:start}
.kartalar .oc{margin-bottom:0}
.stgs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.stg{background:#fff;border:1px solid var(--ln);border-left:2px solid var(--ln);border-radius:6px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stg:hover{border-color:#cbd5e1}
.stg b{font-size:22px;font-weight:800;line-height:1.1}
.stg span{font-size:12px;color:var(--mut);font-weight:600;line-height:1.2}
.stg em{font-style:normal;font-size:11px;color:var(--er);font-weight:700}
.stg.kech{border-left-color:var(--er)}
.stg.bosh{background:var(--soft);border-color:transparent}.stg.bosh b,.stg.bosh span{color:#94a3b8}
.grp{font-size:12px;font-weight:800;color:var(--mut);padding:10px 4px 2px}
.grp:first-of-type{padding-top:0}
.list .it .no{width:24px;height:24px;border-radius:6px;background:var(--accbg);color:var(--acc2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.list .it .m small{display:block}
.rolbtn{display:grid;gap:8px}
.rolbtn button{text-align:left;border:1px solid var(--ln);background:#fff;border-radius:6px;padding:10px 12px;font-weight:700}
.rolbtn button:hover{border-color:var(--acc)}
.rolbtn small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.rolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accbg);color:var(--acc2);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.rolbar span{flex:1}
.xv{font-size:13px;font-weight:700;margin-top:6px}
.xv.er{color:var(--er)}.xv.wr{color:var(--wr)}
.qp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;margin-top:6px}
.qp b,.qp em{flex:none;white-space:nowrap}
.qp span{flex:1 1 140px;min-width:0;color:#475569}
.kan .qp span{flex:1 1 100%}
.qp b{font-variant-numeric:tabular-nums}
.qp em{font-style:normal;font-size:11px;font-weight:700;color:var(--er);background:var(--erbg);border-radius:4px;padding:0 5px}
.qp+.prog{margin-top:3px}
.rs.cur i{box-shadow:0 0 0 4px var(--accbg)}
.alert.er{background:var(--erbg);color:var(--er)}
.tel{max-width:300px;margin:0 auto 6px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.tel-hd{background:var(--side);color:#fff;font-size:12px;font-weight:700;padding:6px 12px}
.tel-bd{padding:14px}
.tel-bd small{color:var(--mut);font-size:12px}
.tel-v{font-size:24px;font-weight:800;margin:4px 0 0}
.tel-r{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--ln);padding-top:8px;margin-top:10px;font-size:13px}
.pl .r1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.pl .o{text-align:right}
.card .r1{display:flex;justify-content:space-between;gap:8px}
@media (max-width:1100px){.stgs{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){
 body{font-size:15px}
 .namuna{font-size:11px;padding:4px 10px}
 .kpi{padding:12px}.kpi .v{font-size:22px}
 .kpi .d,.note,.list .it .m small,.t th{font-size:13px}
 .oc .pr,.qp{font-size:14px}
 .rs{font-size:12px}
 .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .seg button{padding:10px 8px;border-bottom:1px solid var(--ln)}
 .seg button.on{background:var(--acc);color:#fff}
 .t td,.t th{padding:9px 8px}.t td:first-child b{white-space:normal}
 .tools .inp{flex:1 1 100%}
 .xulosa{font-size:15px}
 .kartalar{grid-template-columns:1fr}
}

/* v3 */
.oc b{font-size:15px;font-weight:800}

<script>/* Umumiy yordamchilar: ikkala namuna (POLYPACK, UZ AVIA) uchun. window.U */
(function(){
const U={};
U.$=s=>document.querySelector(s);
U.$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
U.esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=new Date();T.setHours(0,0,0,0);U.TODAY=T;
U.iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
U.addD=(n,b)=>{const d=new Date(b||T);d.setDate(d.getDate()+n);return U.iso(d)};
U.addH=(h,b)=>new Date((b?new Date(b):new Date()).getTime()+h*36e5);
U.dd=s=>Math.round((new Date(String(s).slice(0,10))-T)/864e5);
U.OY=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
U.fd=s=>{if(!s)return'—';const d=new Date(s);return d.getDate()+'-'+U.OY[d.getMonth()]};
U.fdt=s=>{if(!s)return'—';const d=new Date(s);return U.fd(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
U.num=(n,k)=>{if(n==null||isNaN(n))return'—';const f=k?Number(n).toFixed(k):Math.round(n);return Number(f).toLocaleString('ru-RU',{minimumFractionDigits:k||0,maximumFractionDigits:k||0}).replace(/\s/g,' ').replace(',',k?',':'')};
U.som=n=>U.num(n)+' so‘m';
U.mln=n=>Math.abs(n)>=1e9?(n/1e9).toFixed(2).replace('.',',')+' mlrd':Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mln':U.num(n);
U.val=(n,v)=>v==='USD'?'$'+U.num(n):v==='EUR'?'€'+U.num(n):v==='RUB'?U.num(n)+' ₽':U.num(n)+' so‘m';
U.vaqt=v=>{const d=new Date(v),m=Math.round((Date.now()-d)/6e4);return m<1?'hozir':m<60?m+' daq oldin':m<1440?Math.round(m/60)+' soat oldin':U.fd(d)};
U.rnd=seed=>{let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}};
U.pick=(r,a)=>a[Math.floor(r()*a.length)];
U.uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* saqlash */
U.store=key=>({load(){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}},save(d){try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}},clear(){try{localStorage.removeItem(key)}catch(e){}}});

/* toast */
U.toast=(m,tg)=>{const t=document.createElement('div');t.className='toast';t.innerHTML=(tg?'<span class="tg">'+(tg===true?'Telegram':U.esc(tg))+'</span>':'')+U.esc(m);document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};

/* modal */
U.closeM=()=>{const m=U.$('#mo');if(m)m.remove();document.body.style.overflow=''};
U.modal=(h,b,f,wide)=>{U.closeM();const m=document.createElement('div');m.className='mod';m.id='mo';m.innerHTML=`<div class="box" ${wide?'style="width:min(980px,100%)"':''}><div class="hd">${h}<button class="x" aria-label="Yopish">×</button></div><div class="bd">${b}</div>${f?'<div class="ft">'+f+'</div>':''}</div>`;document.body.appendChild(m);document.body.style.overflow='hidden';m.querySelector('.x').onclick=U.closeM;m.addEventListener('mousedown',e=>{if(e.target===m)U.closeM()});return m};
document.addEventListener('keydown',e=>{if(e.key==='Escape')U.closeM()});

/* jadval */
U.table=(cols,rows,opt)=>{opt=opt||{};if(!rows.length)return'<div class="card empty">'+(opt.empty||'Ma‘lumot yo‘q')+'</div>';
return`<div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''} ${c.m?'hide-m':''}">${c.t}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${opt.click?'cl':''}" ${opt.click?opt.click(r):''}>${cols.map(c=>`<td class="${c.n?'n':''} ${c.m?'hide-m':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};

/* Excel */
U.xls=()=>window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)});
U.csv=(rs,fn)=>{const h=Object.keys(rs[0]||{});const t=[h.join(';')].concat(rs.map(r=>h.map(k=>'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"').join(';'))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=fn.replace(/\.xlsx$/,'.csv');a.click()};
U.exportX=(sheets,fn)=>{U.toast('Excel fayl tayyorlanmoqda…');U.xls().then(X=>{const wb=X.utils.book_new();Object.keys(sheets).forEach(n=>{const ws=X.utils.json_to_sheet(sheets[n]);ws['!cols']=Object.keys(sheets[n][0]||{}).map(k=>({wch:Math.max(10,Math.min(32,k.length+4))}));X.utils.book_append_sheet(wb,ws,n.slice(0,30))});X.writeFile(wb,fn)}).catch(()=>U.csv(sheets[Object.keys(sheets)[0]],fn))};
U.readX=(file,cb)=>{const rd=new FileReader();rd.onload=()=>{U.xls().then(X=>{const wb=X.read(new Uint8Array(rd.result),{type:'array',cellDates:true});cb(X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}).catch(()=>U.toast("Excel kutubxonasi yuklanmadi — internetni tekshiring"))};rd.readAsArrayBuffer(file)};
U.norm=s=>String(s).toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');
U.mapCols=(keys,spec)=>{const M={};Object.keys(spec).forEach(k=>{M[k]=keys.find(h=>spec[k].some(s=>U.norm(h).includes(s)))||null});return M};
U.toNum=v=>+String(v==null?'':v).replace(/\s/g,'').replace(',','.')||0;

/* ilova karkasi: menyu, rollar, render */
U.app=cfg=>{
 const A={view:cfg.boshlang||cfg.bolimlar[0],rol:'direktor'};
 const bol=()=>cfg.bolimlar.filter(k=>!cfg.rollar||cfg.rollar[A.rol].includes(k));
 A.navs=()=>{const ks=bol();const b=k=>{const n=cfg.badge?cfg.badge(k):0;return n?'<span class="bdg">'+n+'</span>':''};
  U.$('#nav').innerHTML=ks.map(k=>`<button data-v="${k}" class="${A.view===k?'on':''}"><span class="ic">${cfg.mod[k][0]}</span>${cfg.mod[k][1]}${b(k)}</button>`).join('');
  U.$('#mnav').innerHTML=ks.map(k=>`<button data-v="${k}" class="${A.view===k?'on':''}"><span class="ic">${cfg.mod[k][0]}</span>${cfg.mod[k][2]}${b(k)}</button>`).join('')};
 A.render=()=>{if(!bol().includes(A.view))A.view=bol()[0];A.navs();const a=U.$('#app');a.className='';void a.offsetWidth;a.className='fade';cfg.render[A.view](a);try{history.replaceState(null,'','#'+A.view)}catch(e){}};
 A.go=(v,f)=>{A.view=v;if(cfg.onGo)cfg.onGo(v,f);A.render();window.scrollTo(0,0)};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b&&(b.closest('#nav')||b.closest('#mnav')))A.go(b.dataset.v)});
 U.$('#lg1').textContent=U.$('#lg2').textContent=cfg.logo;U.$('#bn1').textContent=U.$('#bn2').textContent=cfg.nom;U.$('#bs1').textContent=U.$('#bs2').textContent=cfg.shior;
 const r=document.documentElement.style;r.setProperty('--acc',cfg.rang[0]);r.setProperty('--acc2',cfg.rang[1]);r.setProperty('--accbg',cfg.rang[2]);
 if(cfg.rollar){const s=U.$('#rolsel');s.innerHTML=Object.keys(cfg.rollar).map(k=>`<option value="${k}">${cfg.rolNom[k]}</option>`).join('');s.onchange=()=>{A.rol=s.value;U.$$('.rolnom').forEach(x=>x.textContent=cfg.rolNom[A.rol]);U.toast(cfg.rolNom[A.rol]+' sifatida: faqat o‘z bo‘limlari ko‘rinadi');A.render()};U.$('#rolsel2').innerHTML=s.innerHTML;U.$('#rolsel2').onchange=e=>{s.value=e.target.value;s.onchange()}}
 const h=location.hash.slice(1);if(cfg.bolimlar.includes(h))A.view=h;
 return A};
window.U=U;
})();
</script>

(function(){
const {$,$$,esc,iso,addD,dd,fd,fdt,num,mln,toast,modal,closeM,table}=U;

const ishBirlik=e=>e.st==='toquv'?'kg':K[e.k].b;
const nk=n=>Number.isInteger(n)?num(n):num(n,1);
const bitdimi=(o,st)=>st==='toquv'?(o.bajar.toquv||0)>=stJami(o,'toquv'):o.q.every(x=>((o.bq[st]||{})[x.k]||0)>=x.soni);
const BOSQ={toquv:'To‘quv',boyash:'Bo‘yash',bichish:'Bichish',tikish:'Tikish',sifat:'Sifat',qadoq:'Qadoq'};

/* ishlab chiqarish rejasi: hozir ishlanayotgan bosqichlar avval, keyin muddat tartibida, bo‘sh vaqt oralig‘iga joylash */
function joyTop(band,t,len){let s=t;for(const [a,b] of band){if(s+len<=a+1e-9)break;if(b>s)s=b}return s}
function bandQil(band,s,e){band.push([s,e]);band.sort((x,y)=>x[0]-y[0])}
function plan(cap){
 cap=cap||S().cap;const res={},band={};Object.keys(cap).forEach(k=>band[k]=[]);
 const qolBosq=o=>{const rt=route(o);return o.bosqich==='yangi'?rt.length+1:rt.length-rt.indexOf(o.bosqich)};
 const act=D.B.filter(o=>!['tayyor','jonatildi'].includes(o.bosqich)).sort((a,b)=>qolBosq(a)-qolBosq(b)||a.muddat.localeCompare(b.muddat));
 const yuk=(o,st,qol)=>qol*(st==='tikish'?ogAvg(o):1)/cap[st];
 const qolgan=(o,st,joriy)=>joriy?Math.max(0,stJami(o,st)-(o.bajar[st]||0)):stJami(o,st);
 const joriyTug={};
 act.filter(o=>cap[o.bosqich]).forEach(o=>{const st=o.bosqich,len=yuk(o,st,qolgan(o,st,true));const s=joyTop(band[st],0,len);bandQil(band[st],s,s+len);joriyTug[o.id]={st,bosh:s,tug:s+len,kut:s}});
 act.forEach(o=>{const rt=route(o);const ci=o.bosqich==='yangi'?-1:rt.indexOf(o.bosqich);let t=o.bosqich==='yangi'?1:0;const qad=[];let tor=null,torKut=0;
  rt.forEach((st,k)=>{if(k<ci)return;
   if(k===ci&&joriyTug[o.id]){const j=joriyTug[o.id];qad.push(j);if(j.kut>torKut){torKut=j.kut;tor=st}t=j.tug;return}
   if(st==='boyash'){const otgan=k===ci&&o.boyBer?-dd(o.boyBer):0;const kun=Math.max(1,S().boyashKun-otgan);qad.push({st,bosh:t,tug:t+kun,kut:0});t+=kun;return}
   const len=yuk(o,st,qolgan(o,st,false));const s=joyTop(band[st],t,len);bandQil(band[st],s,s+len);const kut=s-t;if(kut>torKut){torKut=kut;tor=st}qad.push({st,bosh:s,tug:s+len,kut});t=s+len});
  const kun=Math.ceil(t-1e-9);res[o.id]={kun,t,tayyor:addD(kun),kech:kun-dd(o.muddat),qad,tor,torKut}});
 return res}
function rejala(){P=plan();return P}
function xavf(o){

 if(o.bosqich==='tayyor')return dd(o.muddat)<0?{t:'er',m:'Tayyor, lekin jo‘natilmadi — muddatdan '+(-dd(o.muddat))+' kun o‘tdi'}:null;
 const p=P[o.id];if(!p)return null;
 if(o.bosqich==='boyash'&&o.boyBer&&-dd(o.boyBer)>S().boyashKun)return{t:'er',m:'Bo‘yoqxonada '+(-dd(o.boyBer))+' kun turibdi (me’yor '+S().boyashKun+' kun)'};
 if(p.kech>0)return{t:'er',m:'Muddatdan ~'+p.kech+' kun kech bitadi'+(p.tor&&p.torKut>=.5?' — '+SEXN[p.tor]+' band':'')};
 if(p.kech===0)return{t:'wr',m:'Aynan muddat kuni bitadi — zaxira yo‘q'};

/* ip yetadimi */
function ipHolat(){
 const kerak={},kim={};
 D.B.filter(o=>['yangi','toquv'].includes(o.bosqich)&&route(o).includes('toquv')).forEach(o=>{
  const qol=Math.max(0,stJami(o,'toquv')-(o.bajar.toquv||0))/(1-S().yoq.toquv/100);
  const rc=RETSEPT[K[o.q[0].k].ip]||{};
  Object.keys(rc).forEach(l=>{kerak[l]=(kerak[l]||0)+qol*rc[l];(kim[l]=kim[l]||[]).push(o.raqam)})});
 return D.IP.map(l=>({l,kerak:Math.round(kerak[l.id]||0),kam:Math.max(0,Math.round((kerak[l.id]||0)-l.kg)),kim:kim[l.id]||[]}))}
function ipSarfla(o,kg){const rc=RETSEPT[K[o.q[0].k].ip]||{};const ip=kg/(1-S().yoq.toquv/100);Object.keys(rc).forEach(l=>{const x=D.IP.find(z=>z.id===l);if(x)x.kg=Math.max(0,Math.round(x.kg-ip*rc[l]))})}
/* tannarx (taxminiy me’yorlar asosida) */
function tannarx(o){

 const boy$=route(o).includes('boyash')?kg*s.boyNarx:0,toq$=toq?kg*s.toqXar:0,mat$=o.q.reduce((a,x)=>a+x.soni*(K[x.k].mat||0),0);
 const n=jami(o),rt=route(o);
 const ish=(toq?kg*s.rast.toquv:0)+(rt.includes('bichish')?n*s.rast.bichish:0)+(rt.includes('tikish')?o.q.reduce((a,x)=>a+x.soni*stavka('tikish',x.k),0):0)+(rt.includes('qadoq')?n*s.rast.qadoq:0);
 const mat=(ip$+boy$+toq$+mat$)*s.kurs.USD,ust=(mat+ish)*s.ustama/100,jamiS=mat+ish+ust;
 const sot=somga(summa(o),o.val);
 return{ipKg:Math.round(ipKg),mat,ish,ustama:ust,jami:jamiS,birlik:jamiS/n,sotBirlik:sot/n,sot,foyda:sot-jamiS}}
/* bo‘yoqxonada me’yordan ortiq yo‘qotish */

function qatorProg(o){const st=o.bosqich;if(st==='toquv'||!o.bq[st]||o.q.length<2)return'';const ul=o.q.map(x=>(o.bq[st][x.k]||0)/x.soni);const mx=Math.max(...ul);

 if(st==='boyash')return`<div class="pr">Bo‘yoqxonaga berilgan: ${fd(o.boyBer)} · ${-dd(o.boyBer)} kun</div>`;

   const yx=act.filter(o=>p3[o.id]&&p3[o.id].kech<P[o.id].kech&&P[o.id].kech>0),ym=act.filter(o=>p3[o.id]&&p3[o.id].kech>Math.max(0,P[o.id].kech));
   const foyda=act.reduce((a,o)=>a+Math.max(0,(P[o.id].t||0)-(p3[o.id].t||0)),0);if(yx.length&&!ym.length&&foyda>=.5&&(!eng||foyda>eng.foyda))eng={sx,yx,p3,foyda}});

 <div class="sec"><h4>Kunlar bo‘yicha</h4>${table([{t:'Sana',f:e=>fd(e.sana)},{t:'Ish',f:e=>`${(D.B.find(o=>o.id===e.oid)||{}).raqam||''}<br><small class="note">${esc(mNom(e.k))}</small>`},{t:'Bajarildi',n:1,f:e=>nk(e.miq)+' '+ishBirlik(e)+(e.brak?`<br><small class="er">brak ${nk(e.brak)} ${ishBirlik(e)} · ${esc(e.sabab)}</small>`:'')},{t:'Summa',n:1,f:e=>num(ishSumma(e))+`<br><small class="note">${num(e.stavka)} × ${nk(e.miq)}</small>`}],es)}</div>`)}

 rollar:{direktor:['panel','buyurtmalar','sex','ombor','jonatish','ishbay'],buxgalter:['buyurtmalar','jonatish','ishbay'],sex:['sex','buyurtmalar'],ombor:['ombor','jonatish']},

 badge:k=>{rejala();if(k==='buyurtmalar')return D.B.filter(o=>(xavf(o)||{}).t==='er').length;if(k==='jonatish')return D.B.filter(o=>o.bosqich==='tayyor').length;if(k==='ombor')return ipHolat().filter(x=>x.kam).length+D.BOY.filter(b=>b.qayt==null&&-dd(b.sana)>S().boyashKun).length;return 0},
 onGo:(v,f)=>{f=f||{};if(v==='buyurtmalar')F={st:f.st||'',q:''};if(v==='ombor'&&f.t)OT=f.t;if(v==='jonatish'&&f.t)JT=f.t;if(v!=='sex')SEX_FORMA=false;if(v!=='panel')DIQ_HAMMA=false},
 render:{panel:rolQobiq(rPanel),buyurtmalar:rolQobiq(rBuy),sex:rolQobiq(rSex),ombor:rolQobiq(rOmbor),jonatish:rolQobiq(rJon),ishbay:rolQobiq(rIsh)}});
