<title>TIMTEX — boshqaruv tizimi (namuna)</title>

/* Shrift: Golos Text (SIL OFL 1.1), fonts\ papkasidan; kirill bo'laklari faqat kirill yozuvida yuklanadi. */
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-ext-wght-normal.woff2) format("woff2");unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
:root{
	--blue:#3447a8;--blue2:#283883;--bluet:#e6e9f8;--sky:#9aa8e8;
	--night:#161d42;--night2:#222c5e;--ink:#171a2b;--tx2:#474c66;--muted:#5f6480;
	--bg:#f3f4fa;--card:#fff;--line:#d9dcec;--line2:#e9ebf5;
	--grn:#17764a;--grnt:#e2f3ea;--amb:#925600;--ambt:#fcf1dc;--red:#b3261e;--redt:#fbe9e7;--vio:#5b3ea6;--viot:#eee9fa;
	--r:10px;--r2:14px;--sh:0 1px 2px rgba(22,29,66,.06),0 1px 1px rgba(22,29,66,.04);--elev:0 12px 32px rgba(22,29,66,.22);
	--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
	--yon:236px;--tepa:52px;--past:62px;--nam:26px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}

/* Namuna tasmasi */
.namuna{position:fixed;top:0;left:0;right:0;height:var(--nam);z-index:60;background:var(--ambt);color:var(--amb);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid #f0dcb4;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Kirish */
.kirish{min-height:100vh;padding:calc(var(--nam) + 28px) 16px 32px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--night) 0,var(--night2) 300px,var(--bg) 300px)}
.kirish .belgi{color:#fff;text-align:center;margin-bottom:22px}
.belgi b{display:block;font-size:26px;font-weight:800;letter-spacing:.02em}
.belgi span{display:block;color:#c9d0f2;font-size:14px;margin-top:2px}
.kirish .quti{width:100%;max-width:460px;background:var(--card);border-radius:var(--r2);box-shadow:var(--elev);padding:22px 20px}
.kirish h1{font-size:19px;font-weight:700;margin-bottom:4px}
.kirish .izoh{color:var(--muted);font-size:14px;margin-bottom:16px}
.rollar{display:grid;gap:10px}
.rol{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px}
.rol:hover{border-color:var(--blue);background:#f5f6fc}
.rol .dum{width:42px;height:42px;border-radius:10px;background:var(--bluet);color:var(--blue);display:grid;place-items:center;flex:none}
.rol .n{font-weight:650;display:block}
.rol .d{color:var(--muted);font-size:13px;display:block}
.rol .pin-t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.pinq{display:grid;gap:12px}
.pinq input{font-size:26px;letter-spacing:.5em;text-align:center;padding:10px 8px 10px calc(8px + .5em);height:56px}
.xato{color:var(--red);font-size:13.5px;min-height:20px}
.kirish .ost{margin-top:18px;text-align:center;color:var(--muted);font-size:13px;max-width:460px}
.til{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin:0 auto 18px}
.til button{background:transparent;border:0;color:#d3d7ee;padding:7px 14px;font-size:13.5px;font-weight:600;min-height:36px}
.til button[aria-pressed=true]{background:#fff;color:var(--night)}

/* Qobiq */
.yon{position:fixed;top:var(--nam);left:0;bottom:0;width:var(--yon);background:var(--night);color:#d3d7ee;display:flex;flex-direction:column;padding:16px 12px;z-index:40}
.yon .belgi{text-align:left;padding:4px 8px 16px}
.yon .belgi b{font-size:19px;color:#fff}
.yon .belgi span{font-size:12.5px}
.yon nav{display:grid;gap:2px}
.yon nav a{display:flex;align-items:center;gap:11px;color:#d3d7ee;padding:10px 10px;border-radius:8px;font-weight:550;font-size:14.5px}
.yon nav a:hover{background:rgba(255,255,255,.07);text-decoration:none}
.yon nav a[aria-current=page]{background:var(--blue);color:#fff}
.yon nav a .son{margin-left:auto;background:#fff;color:var(--night);border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.yon .oxir{margin-top:auto;display:grid;gap:10px;padding:8px}
.yon .kim{font-size:13.5px;line-height:1.3}
.yon .kim b{display:block;color:#fff;font-size:14.5px}
.yon .til{margin:0;justify-self:start}
.yon .chiq{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#d3d7ee;border-radius:8px;padding:8px 10px;font-size:14px}
.tepa,.past{display:none}
.sahifa{margin-left:var(--yon);padding:calc(var(--nam) + 22px) 28px 48px;max-width:1280px}
.bosh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bosh h1{font-size:24px;font-weight:750;line-height:1.2}
.bosh .ost{color:var(--muted);font-size:14px;margin-top:2px}
.bosh .ong{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.orqa{display:inline-flex;align-items:center;gap:4px;font-size:14px;margin-bottom:10px;min-height:32px}

/* Tugma */
.t{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap}
.t:hover{border-color:#b9bfdc;text-decoration:none}
.t.a{background:var(--blue);border-color:var(--blue);color:#fff}
.t.a:hover{background:var(--blue2)}
.t.x{color:var(--red)}
.t.k{min-height:34px;padding:5px 10px;font-size:13.5px}
.t.keng{width:100%;min-height:48px;font-size:16px}
.t[disabled]{opacity:.5;cursor:not-allowed}
.hav{background:none;border:0;padding:0;color:var(--blue);font-weight:600}

/* Karta */
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.k>h2,.k>.kb h2{font-size:16px;font-weight:700}
.kb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kb .ong{margin-left:auto;display:flex;gap:8px;align-items:center}
.kb .ost{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.qator2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.qator2>.k{margin-bottom:0}
.qator2{margin-bottom:16px}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:14px 16px;display:block;color:inherit}
a.kp:hover{border-color:var(--blue);text-decoration:none}
.kp .y{color:var(--muted);font-size:13px;font-weight:550}
.kp .q{font-size:25px;font-weight:750;line-height:1.2;margin-top:4px;white-space:nowrap}
.kp .q small{font-size:14px;font-weight:600;color:var(--tx2)}
.kp .p{font-size:13px;color:var(--tx2);margin-top:4px}
.kp .p.yom{color:var(--red);font-weight:600}
.kp .p.yax{color:var(--grn);font-weight:600}

/* Belgi (badge) */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;background:var(--line2);color:var(--tx2);white-space:nowrap}
.b.ko{background:var(--bluet);color:var(--blue)}
.b.ya{background:var(--grnt);color:var(--grn)}
.b.sa{background:var(--ambt);color:var(--amb)}
.b.qi{background:var(--redt);color:var(--red)}
.b.bi{background:var(--viot);color:var(--vio)}

/* E'tibor ro'yxati */
.et{display:grid}
.et a{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line2);color:inherit}
.et a:first-child{border-top:0}
.et a:hover{text-decoration:none;background:#f5f6fc}
.et .nuq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ambt);color:var(--amb)}
.et .nuq.qi{background:var(--redt);color:var(--red)}
.et .nuq.ko{background:var(--bluet);color:var(--blue)}
.et .nuq svg{width:17px;height:17px}
.et b{display:block;font-weight:650;font-size:14.5px}
.et span{color:var(--tx2);font-size:13.5px}
.et .uq{margin-left:auto;color:var(--muted);align-self:center}

/* Jadval */
.jw{overflow-x:auto;margin:0 -4px}
table.j{width:100%;border-collapse:collapse;font-size:14px}
.j th{font-size:12.5px;font-weight:650;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.j td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.j tr:last-child td{border-bottom:0}
.j .r{text-align:right;white-space:nowrap}
.j .kich{color:var(--muted);font-size:13px;display:block}
.j td b{font-weight:650}
.j tr.bos{cursor:pointer}
.j tr.bos:hover td{background:#f5f6fc}
.j tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.bosh-yoq{color:var(--muted);padding:18px 4px;text-align:center;font-size:14px}

/* Yorliqlar (tabs) */
.yor{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.yor::-webkit-scrollbar{display:none}
.yor a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;min-height:38px;font-weight:600;font-size:14px;color:var(--tx2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.yor a:hover{text-decoration:none;border-color:#b9bfdc}
.yor a[aria-current=true]{background:var(--night);border-color:var(--night);color:#fff}
.yor .son{background:var(--line2);color:var(--tx2);border-radius:999px;font-size:12px;padding:0 6px;font-weight:700}
.yor a[aria-current=true] .son{background:rgba(255,255,255,.2);color:#fff}
.yor .son.qi{background:var(--red);color:#fff}

/* Ro'yxat kartalari */
.ry{display:grid;gap:10px}
.el{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:inherit;box-shadow:var(--sh)}
a.el:hover{border-color:var(--blue);text-decoration:none}
.el .ust{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.el .id{font-weight:700;font-size:13.5px;color:var(--muted)}
.el .nom{font-weight:650;font-size:15.5px}
.el .mat{color:var(--tx2);font-size:14px;margin-top:2px}
.el .pas{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--tx2);align-items:center}
.el .pas .ong{margin-left:auto;font-weight:700;color:var(--ink);font-size:15px}
.el.shosh{border-left:4px solid var(--red)}
.el .amal{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.izl{position:relative;margin-bottom:14px;max-width:420px}
.izl input{width:100%;padding-left:38px}
.izl svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Maydon */
.in,select.in,textarea.in{width:100%;border:1px solid #c3c8de;background:#fff;border-radius:9px;padding:9px 11px;min-height:42px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--blue);outline:3px solid var(--bluet)}
.may{display:grid;gap:5px;margin-bottom:12px}
.may>span{font-size:13.5px;font-weight:600;color:var(--tx2)}
.may2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yord{font-size:13px;color:var(--muted)}
.tan{display:flex;align-items:center;gap:8px;min-height:40px}
.tan input{width:20px;height:20px}

/* Bosqichlar */
.qadam{display:flex;gap:4px;margin:4px 0 2px;overflow-x:auto}
.qadam span{flex:1;min-width:86px;text-align:center;font-size:12.5px;font-weight:650;padding:7px 6px;background:var(--line2);color:var(--muted);border-radius:6px;white-space:nowrap}
.qadam span.ot{background:var(--grnt);color:var(--grn)}
.qadam span.hoz{background:var(--blue);color:#fff}

/* Ta'rif ro'yxati */
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.tr div>span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.tr div>b{font-weight:600;font-size:15px}
.jami{display:grid;gap:6px;max-width:340px;margin-left:auto;margin-top:12px;font-size:14.5px}
.jami div{display:flex;justify-content:space-between;gap:16px}
.jami .kat{font-weight:750;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.eslat{background:var(--ambt);color:#6b4000;border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.eslat.qi{background:var(--redt);color:#7d1a14}
.eslat.ko{background:var(--bluet);color:var(--blue2)}
.eslat svg{margin-top:1px}
.tarix{display:grid;gap:8px;font-size:13.5px;color:var(--tx2)}
.tarix div{display:flex;gap:10px}
.tarix time{color:var(--muted);white-space:nowrap;min-width:78px}

/* Chiziqlar */
.grafik{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.grafik .oy{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.grafik .juft{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.grafik .juft i{display:block;width:42%;max-width:26px;border-radius:5px 5px 0 0;background:var(--blue);min-height:2px}
.grafik .juft i.x{background:#b3bce6}
.grafik .oy span{font-size:12px;color:var(--muted);white-space:nowrap}
.grafik .oy.hoz span{color:var(--ink);font-weight:700}
.afs{display:flex;gap:16px;font-size:13px;color:var(--tx2);margin-top:10px;flex-wrap:wrap}
.afs i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin-right:6px}
.afs i.x{background:#b3bce6}
.gor{display:grid;gap:10px}
.gor .q{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.gor .yol{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.gor .yol i{display:block;height:100%;background:var(--blue);border-radius:999px}
.gor .yol i.qi{background:var(--red)}.gor .yol i.sa{background:#d9951c}.gor .yol i.ya{background:var(--grn)}
.gor .q b{white-space:nowrap;font-weight:650}
.qold{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qold .yol{width:56px;height:6px;background:var(--line2);border-radius:999px;overflow:hidden}
.qold .yol i{display:block;height:100%;background:var(--grn)}
.qold.kam .yol i{background:#d9951c}.qold.yoq .yol i{background:var(--red)}
.qold.kam b,.qold.yoq b{color:var(--red)}

/* Oyna */
.parda{position:fixed;inset:0;background:rgba(22,29,66,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.oyna{background:#fff;border-radius:var(--r2);box-shadow:var(--elev);width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.oyna header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.oyna header h2{font-size:17px;font-weight:700}
.oyna header button{margin-left:auto;background:none;border:0;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.oyna .ich{padding:16px 18px;overflow-y:auto}
.oyna footer{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xabar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:550;z-index:90;box-shadow:var(--elev);max-width:calc(100vw - 32px);text-align:center}
.pastki{color:var(--muted);font-size:13px;margin-top:26px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}

.usta-sal{background:var(--night);color:#fff;border-radius:var(--r2);padding:16px 18px;margin-bottom:16px}
.usta-sal b{font-size:19px;display:block}
.usta-sal span{color:#c9d0f2;font-size:14px}
.yuk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.yuk div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.yuk b{display:block;font-weight:650}
.yuk span{font-size:13px;color:var(--tx2)}

@media (max-width:1100px){.kpi{grid-template-columns:repeat(2,1fr)}.qator2{grid-template-columns:1fr}}
@media (max-width:899px){
	.yon{display:none}
	.tepa{display:flex;position:fixed;top:var(--nam);left:0;right:0;height:var(--tepa);background:var(--night);color:#fff;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:40}
	.tepa b{font-size:16px;font-weight:750;white-space:nowrap}
	.tepa .rolb{font-size:12.5px;color:#c9d0f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
	.tepa .ong{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
	.tepa .tilb{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;font-size:12.5px;font-weight:650;padding:0 10px;height:32px;white-space:nowrap}
	.tepa .chiq{background:none;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center}

<script>
(() => {
'use strict';
/* ===== yozuv.js ===== */
/* Yozuv: lotin <-> kirill (o'zbekcha). Manba matnlar lotinda, oddiy ' bilan yoziladi.
   Yozuv.kir(s)  — lotin -> kirill;  Yozuv.lot(s) — tipografik lotin (o‘, g‘, ’);
   Yozuv.qid(s)  — qidiruv uchun bir xil ko'rinish (kirill ham lotinga keltiriladi);
   Yozuv.dom(el, til) — tugun ichidagi matn va yorliqlarni tanlangan yozuvga o'tkazadi. */
const Yozuv = (() => {
	// O'zgarmaydigan nomlar (brend, fayl turi)
	const SAQLA = new Set(['Excel', 'CSV', 'TIMTEX', 'OEM', 'USD', 'CMR', 'PP', 'XS', 'S', 'M', 'L', 'XL', 'XXL',
		'TAYGA', 'BASIC', 'VOLNA', 'KIDS', 'POLNOCH', 'STREET', 'ALTYN', 'DALA', 'BIALY', 'KOT', 'CHINOR', 'SPORT', 'SAMAL', 'WEAR', 'ZARBOF', 'UNIFORM']);
	// Yumshatish belgili o'zlashma so'zlar: [lotin o'zak, kirill o'zak, so'z aynan shu bo'lsa qo'shiladigan oxiri]
	const OZAK = [
		['panel', 'панель', ''], ['rol', 'роль', ''], ['filtr', 'фильтр', ''], ['tabel', 'табель', ''],
		['kalkulyatsiya', 'калькуляция', ''], ['deklaratsiya', 'декларация', ''], ['poliester', 'полиэстер', ''], ['penye', 'пенье', ''],
		['polsha', 'польша', ''], ['model', 'модель', ''], ['sex', 'цех', ''], ['sertifikat', 'сертификат', ''],
		['sentabr', 'сентябр', 'ь'], ['oktabr', 'октябр', 'ь'],
		['noyabr', 'ноябр', 'ь'], ['dekabr', 'декабр', 'ь'], ['fevral', 'феврал', 'ь'], ['aprel', 'апрел', 'ь'],
		['iyun', 'июн', 'ь'], ['iyul', 'июл', 'ь'], ['yanvar', 'январ', 'ь'],
	];
	const BIR = { a: 'а', b: 'б', d: 'д', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ', r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з' };
	const UNLI = 'aeiouAEIOU';
	const TIRNOQ = "'‘’ʻʼ`";
	const tq = c => c !== undefined && c !== '' && TIRNOQ.includes(c);
	const katta = c => c !== c.toLowerCase();
	const kat = (s, asl) => katta(asl) ? s.charAt(0).toUpperCase() + s.slice(1) : s;

	function soz(w) {
		const kich = w.toLowerCase().replace(/[‘’ʻʼ`]/g, "'");
		for (const [l, k, oxir] of OZAK) {
			if (kich.startsWith(l)) {
				const qol = w.slice(l.length);
				const bosh = kat(k, w[0]);
				return qol ? bosh + harf(qol, true) : bosh + oxir;
			}
		}
		return harf(w, false);
	}
	// ichkari=true: so'z o'rtasidan davom (boshidagi «e» qoidasi ishlamaydi)
	function harf(w, ichkari) {
		let out = '';
		for (let i = 0; i < w.length; i++) {
			const c = w[i], n = w[i + 1], n2 = w[i + 2], cl = c.toLowerCase(), nl = n ? n.toLowerCase() : '';
			const oldin = i > 0 ? w[i - 1] : (ichkari ? 'x' : '');
			if ((cl === 'o' || cl === 'g') && tq(n)) { out += kat(cl === 'o' ? 'ў' : 'ғ', c); i++; continue; }
			if (cl === 's' && nl === 'h') { out += kat('ш', c); i++; continue; }
			if (cl === 'c' && nl === 'h') { out += kat('ч', c); i++; continue; }
			if (cl === 'y' && nl === 'o' && !tq(n2)) { out += kat('ё', c); i++; continue; }
			if (cl === 'y' && nl === 'u') { out += kat('ю', c); i++; continue; }
			if (cl === 'y' && nl === 'a') { out += kat('я', c); i++; continue; }
			if (cl === 'y' && nl === 'e') { out += kat('е', c); i++; continue; }
			if (cl === 'e') { out += kat(oldin === '' || UNLI.includes(oldin) ? 'э' : 'е', c); continue; }
			if (tq(c)) { out += 'ъ'; continue; }
			if (BIR[cl]) { out += kat(BIR[cl], c); continue; }
			out += c;
		}
		return out;
	}
	const TOKEN = /[A-Za-z0-9'‘’ʻʼ`]+(?:-[A-Za-z0-9'‘’ʻʼ`]+)*/g;
	// Kod va model nomlari (raqam + katta harf: TY2-PK, S-1042) o'zgarmaydi
	const kodmi = t => /\d/.test(t) && /[A-Z]/.test(t);

	function kir(s) {
		if (!s || !/[A-Za-z]/.test(s)) return s;
		return s.replace(TOKEN, t => {
			if (SAQLA.has(t) || kodmi(t)) return t;
			return t.split('-').map(b => (SAQLA.has(b) ? b : soz(b))).join('-');
		});
	}
	function lot(s) {
		if (!s || s.indexOf("'") < 0) return s;
		return s.replace(/([oOgG])'/g, '$1‘').replace(/'/g, '’');
	}
	const QAYTA = { 'ў': "o'", 'ғ': "g'", 'ш': 'sh', 'ч': 'ch', 'ё': 'yo', 'ю': 'yu', 'я': 'ya', 'э': 'e', 'е': 'e', 'ҳ': 'h', 'қ': 'q', 'х': 'x', 'ж': 'j', 'й': 'y', 'ц': 'ts', 'ъ': '', 'ь': '', 'ы': 'i', 'щ': 'sh' };
	const TESK = {}; for (const k in BIR) TESK[BIR[k]] = k;
	function qid(s) {
		return String(s || '').toLowerCase().replace(/[Ѐ-ӿ]/g, c => QAYTA[c] !== undefined ? QAYTA[c] : (TESK[c] || c)).replace(/['‘’ʻʼ`]/g, '');

		if (!el || typeof document === 'undefined') return;
		const f = til === 'kir' ? kir : lot;
		const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
			acceptNode: n => (n.parentElement && n.parentElement.closest('[data-asl],script,style,textarea')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
		});
		const tugun = []; while (w.nextNode()) tugun.push(w.currentNode);
		for (const n of tugun) { const y = f(n.nodeValue); if (y !== n.nodeValue) n.nodeValue = y; }
		const sel = ATTR.map(a => '[' + a + ']').join(',');
		const els = [...el.querySelectorAll(sel)]; if (el.matches && el.matches(sel)) els.push(el);
		for (const e of els) { if (e.closest('[data-asl]')) continue; for (const a of ATTR) { const v = e.getAttribute(a); if (v) { const y = f(v); if (y !== v) e.setAttribute(a, y); } } }
	}
	return { kir, lot, qid, dom };
})();

/* ---------- E'tibor talab qiladigan ishlar ---------- */
function diqqat() {
	const r = [], q = (i, s, b, m, h) => r.push({ i, s, b, m, h });
	const bs = db.buyurtmalar.filter(b => ruxsat('buyurtma') && mening(b));
	for (const b of bs) {
		const c = topC(b.mijoz), k = bKech(b), x = xavf(b), h = '#/buyurtma/' + b.id;
		if (k) q('soat', 'qi', `${b.id}: muddatdan ${k} kun o'tdi`, `${c.nom} · ${b.nom} · ${BOS[bBos(b)].toLowerCase()} bosqichida, qadoqlangani ${foizB(hol(b).j.qadoq, bSoni(b))}`, h);
		else if (x) { const t = linTaklif(b); q('soat', 'sa', `${b.id}: kechikish xavfi ${x} kun`, `${c.nom} · bashorat ${sana(bashorat(b).sana)}, muddat ${sana(b.muddat)}${t ? ` · ${t.l.nom}ga o'tkazilsa ulguradi` : ''}`, h); }
		if (b.bos === 'ishlab' && (amalIshlab() || pulKorar())) {
			const sf = sarfFarq(b), t = tannarx(b);
			if (sf > 3) q('ogoh', 'sa', `${b.id}: mato me'yordan ${miq(sf)}% ortiq sarflandi`, `Reja ${miq(b.kalk.sarf * 1000, 'g')}, haqiqiy ${miq(t.sarf * 1000, 'g')} bir donaga${pulKorar() ? ` · foyda bir donada ${pul(t.reja.foyda - t.fakt.foyda)} ga kamaydi` : ''}`, h);
			if (t.brakU > 0.02) q('ogoh', 'sa', `${b.id}: brak ${foiz(t.brakU, 1)}`, `${dona(hol(b).brak)} sifat nazoratidan o'tmadi · ${c.nom}`, h);
		}
		if (pulKorar()) {
			const w = tasKutish(b), a = avansHolat(b);
			if (b.bos === 'namuna' && w && w.kun >= 4) q('hujjat', 'sa', `${b.id}: namuna tasdig'i ${w.kun} kundan beri kutilmoqda`, `${c.nom} · ${TAS[w.x.t]}`, h);
			if ((b.bos === 'namuna' || b.bos === 'sorov') && !a.yetar && c.avans) q('moliya', b.bos === 'namuna' ? 'sa' : 'ko', `${b.id}: oldindan to'lov kelmagan`, `${c.nom} · kerak ${cPul(c, a.kerak)}, kelgani ${cPul(c, a.keldi)} — to'lovsiz ishlab chiqarish boshlanmaydi`, h);
		}
	}
	if (ruxsat('brend')) { const u = umumiyHolat(true); if (u.kechSoni) q('moliya', 'qi', `Muddati o'tgan to'lov: ${qisqaPul(u.kech)}`, `${u.kechSoni} ta brend${u.eslat ? `, ${u.eslat} tasiga eslatish kerak` : ''}`, '#/brend?kech'); }
	if (ruxsat('jonat')) for (const j of db.jonatmalar.filter(x => x.holat === 'tayyor' && mening(topB(x.b)))) {
		const yoq = Object.keys(j.huj).filter(k => !j.huj[k]);
		q('yuk', yoq.length ? 'sa' : 'ko', yoq.length ? `${j.id}: hujjatlar to'liq emas (${Object.keys(j.huj).length - yoq.length}/${Object.keys(j.huj).length})` : `${j.id}: yuklashga tayyor`, `${topC(j.mijoz).nom} · ${dona(j.soni)} · ${yoq.length ? 'yetishmaydi: ' + yoq.map(k => HUJ[k]).join(', ') : 'hujjatlar to\'liq'}`, '#/jonat');
	}
	if (ruxsat('ombor') && ui.rol !== 'menejer') for (const m of kamlar()) {
		const e = ehtiyoj(m.id), yl = yolda(m.id);
		q('ombor', m.qoldiq < e ? 'qi' : 'sa', `${m.nom}: ${miq(m.qoldiq, m.birlik)} qoldi`, (e ? `Ochiq buyurtmalarga kerak: ${miq(e, m.birlik)}` : `Eng kam chegara: ${miq(m.min, m.birlik)}`) + (yl ? ` · yo'lda ${miq(yl, m.birlik)}` : ''), '#/ombor/' + m.id);
	}
	if (ruxsat('ishlab')) {
		const yoq = db.liniyalar.filter(l => l.op === 'tikuv' && navbat(l.id).some(x => x.bosh < 1) && !linBugun(l.id));
		if (yoq.length) q('ishlab', 'ko', `Bugungi chiqim kiritilmagan: ${yoq.length} ta liniya`, yoq.map(l => l.nom).join('; '), '#/ishlab?chiqim');
	}
	return r;
}

<div class="tr" style="margin-bottom:12px"><div><span>Bugun tikildi</span><b>${dona(bug)}${reja ? ` <span class="kich">kunlik reja ${guruhla(reja)}</span>` : ''}</b></div><div><span>Navbatda</span><b>${nv.length} ta buyurtma · ${dona(yig(nv, x => x.qol))}</b></div></div>
${nv.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Buyurtma</th><th class="r">Tikishga qoldi</th><th class="r">Ish kuni</th><th class="r">Tayyor bo'ladi</th><th></th></tr></thead><tbody>${nv.map(x => `<tr><td><b>${bYol(x.b)} · ${topC(x.b.mijoz).nom}</b><span class="kich">${x.b.nom}${x.bosh >= 1 ? ` · ${hol(x.b).j.bichuv ? 'navbatda' : 'mato kutilmoqda'}` : ''}</span></td><td class="r" data-y="Tikishga qoldi">${dona(x.qol)}</td><td class="r" data-y="Ish kuni">${miq(x.kun)}</td><td class="r" data-y="Tayyor bo'ladi">${x.kech ? `<span class="b sa">${sana(kunQosh(db.bugun, x.tk))} · +${x.kech} kun</span>` : `<span class="b ya">${sana(kunQosh(db.bugun, x.tk))}</span>`}</td><td class="r">${chiqimMumkin(x.b, 'tikuv') && Object.keys(x.b.mat).some(r => rMumkin(x.b, 'tikuv', r) > 0) ? tugma('chiqimR', 'Chiqim', { b: x.b.id, op: 'tikuv' }, 'k') : ''}</td></tr>`).join('')}</tbody></table></div>` : bosh_yoq('Liniya bo\'sh — yangi buyurtma berish mumkin.')}</div>`;
}
const kunChiqim = (op, iso, lid) => yig(db.chiqim.filter(y => y.op === op && y.sana === iso && (!lid || y.lin === lid)), ySoni);
const ortacha7 = lid => Math.round(yig(db.chiqim.filter(y => y.lin === lid && kunFarq(y.sana) < 0 && kunFarq(y.sana) >= -7), ySoni) / 6);
function vIshlab(y) {
	const ish = db.buyurtmalar.filter(b => b.bos === 'ishlab'), tl = db.liniyalar.filter(l => l.op === 'tikuv'), mat = db.matolar.filter(p => p.bos !== 'tayyor'), o = oqim();
	let ich;
	if (y.tab === 'navbat') ich = `<div class="ry">${ish.sort((a, b) => a.muddat < b.muddat ? -1 : 1).map(b => { const h = hol(b), n = bSoni(b); return `<div class="el${bKech(b) ? ' shosh' : ''}"><div class="ust"><span class="id">${bYol(b)}</span><span class="nom">${topC(b.mijoz).nom}</span>${bosBelgi(b)}${muddatBelgi(b)}</div><div class="mat">${b.nom} · ${dona(n)} · ${b.lin ? topL(b.lin).nom : ''}</div><div class="bajr">${opTartib(b).map(op => `<div><span>${OP[op]}</span>${bajarHTML(h.j[op], n, h.j[op] >= n ? 'ya' : '')}</div>`).join('')}</div></div>`; }).join('') || bosh_yoq('Ishlab chiqarishda buyurtma yo\'q.')}</div>`;
	else if (y.tab === 'chiqim') {
		const kn = []; for (let i = 13; i >= 0; i--) { const s = kunQosh(db.bugun, -i); if (new Date(kunMs(s)).getUTCDay() !== 0 || i === 0) kn.push(s); }
		const bugungi = db.chiqim.filter(x => x.sana === db.bugun);
		ich = `<div class="k"><div class="kb"><h2>Tikuv chiqimi, kunlar bo'yicha</h2><div class="ost">Uchala liniya birga, dona. Oxirgi ustun — bugun (kun hali tugamagan).</div></div>${grafik(kn.map(s => [qisqaSana(s), kunChiqim('tikuv', s)]), 'Tikilgan dona')}</div>
<div class="k"><div class="kb"><h2>Sexlar va liniyalar</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Sex yoki liniya</th><th class="r">Bugun</th><th class="r">Kecha</th><th class="r">Haftalik o'rtacha</th><th class="r">Kunlik quvvat</th></tr></thead><tbody>${db.liniyalar.map(l => `<tr><td><b>${l.nom}</b><span class="kich">Usta: ${esc(l.usta)}</span></td><td class="r" data-y="Bugun">${linBugun(l.id) ? dona(linBugun(l.id)) : '<span class="b sa">Kiritilmagan</span>'}</td><td class="r" data-y="Kecha">${dona(kunChiqim(l.op, kunQosh(db.bugun, -1), l.id))}</td><td class="r" data-y="Haftalik o'rtacha">${dona(ortacha7(l.id))}</td><td class="r" data-y="Kunlik quvvat">${guruhla(l.quvvat)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="k"><div class="kb"><h2>Bugungi yozuvlar</h2></div>${bugungi.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Buyurtma</th><th>Bosqich</th><th>Rang</th><th class="r">Dona</th></tr></thead><tbody>${bugungi.map(x => `<tr><td><b>${bYol(topB(x.b))}</b><span class="kich">${topL(x.lin).nom}</span></td><td data-y="Bosqich">${OP[x.op]}</td><td data-y="Rang">${esc(x.r)}</td><td class="r" data-y="Dona"><b>${guruhla(ySoni(x))}</b>${x.brak ? `<span class="kich">brak ${x.brak}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>` : bosh_yoq('Bugun hali chiqim kiritilmagan.')}</div>`;
	} else if (y.tab === 'mato') {
		const ipl = db.mollar.filter(m => m.tur === 'ip' && ehtiyoj(m.id) > 0);
		ich = (ipl.length ? `<div class="k"><div class="kb"><h2>Navbatdagi partiyalarga ip</h2><div class="ost">1 kg tayyor matoga ${String(IP_YOQ).replace('.', ',')} kg ip (to'quv va bo'yashdagi yo'qotish bilan)</div></div><div class="jw"><table class="j tel"><thead><tr><th>Ip</th><th class="r">Kerak</th><th class="r">Omborda</th><th class="r">Yo'lda</th></tr></thead><tbody>${ipl.map(m => `<tr><td><b>${m.nom}</b></td><td class="r" data-y="Kerak">${miq(ehtiyoj(m.id), 'kg')}</td><td class="r" data-y="Omborda"><b class="${m.qoldiq < ehtiyoj(m.id) ? 'qizil' : ''}">${miq(m.qoldiq, 'kg')}</b></td><td class="r" data-y="Yo'lda">${yolda(m.id) ? miq(yolda(m.id), 'kg') : '—'}</td></tr>`).join('')}</tbody></table></div></div>` : '') +
			`<div class="k"><div class="kb"><h2>Jarayondagi mato partiyalari</h2><div class="ost">Navbat → to'quv → bo'yash → pardoz → tayyor</div></div>${mat.length ? matoJadval(mat) : bosh_yoq('Jarayonda partiya yo\'q.')}</div>`;
	} else ich = `<div class="kpi">${kpi('Bugun tikildi', guruhla(kunChiqim('tikuv', db.bugun)), 'dona', `Kecha: ${dona(kunChiqim('tikuv', kunQosh(db.bugun, -1)))}`, '', '#/ishlab?chiqim')}${kpi('Ishlab chiqarishda', ish.length, 'ta buyurtma', dona(yig(ish, b => bSoni(b) - hol(b).j.qadoq)) + ' qadoqlanmagan', '', '#/ishlab?navbat')}${kpi('Kechikish xavfi', ish.filter(b => bKech(b) || xavf(b)).length, 'ta', 'Muddati o\'tgan yoki ulgurmaydigan', ish.some(b => bKech(b) || xavf(b)) ? 'yom' : 'yax', '#/ishlab?navbat')}${kpi('Jarayondagi mato', mat.length, 'ta partiya', miq(yig(mat, p => p.kg), 'kg'), '', '#/ishlab?mato')}</div>
<div class="k"><div class="kb"><h2>Dona qayerda turibdi</h2><div class="ost">Bosqichlar orasida to'planib qolgan dona — tor joy shu yerdan ko'rinadi</div></div>${oqimHTML()}</div>${tl.map(linKarta).join('')}`;
	return boshq('Ishlab chiqarish', `${tl.length} ta tikuv liniyasi · ${ish.length} ta buyurtma ishda`) +
		yorliq('#/ishlab', ['navbat', 'chiqim', 'mato'].includes(y.tab) ? y.tab : '', [['', 'Liniyalar', null], ['navbat', 'Buyurtmalar', ish.length], ['chiqim', 'Kunlik chiqim', null], ['mato', 'Mato partiyalari', mat.length]]) + ich;
}

/* ---------- Ombor ---------- */
function molJadval(ms) {
	const pk = pulKorar();
	return ms.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Nomi</th><th>Omborda</th><th class="r">Eng kam chegara</th><th class="r">Ochiq buyurtmalarga</th><th class="r">Yo'lda</th>${pk ? '<th class="r">Qiymati</th>' : ''}</tr></thead><tbody>${ms.map(m => { const e = ehtiyoj(m.id), yl = yolda(m.id); return `<tr class="bos" data-h="#/ombor/${m.id}"><td><b>${m.nom}</b><span class="kich">${OTUR[m.tur]}</span></td><td data-y="Omborda">${qoldiqHTML(m)}</td><td class="r" data-y="Eng kam chegara">${miq(m.min, m.birlik)}</td><td class="r" data-y="Ochiq buyurtmalarga">${e ? `<span class="${e > m.qoldiq ? 'qizil' : ''}">${miq(e, m.birlik)}</span>` : '—'}</td><td class="r" data-y="Yo'lda">${yl ? miq(yl, m.birlik) : '—'}</td>${pk ? `<td class="r" data-y="Qiymati">${qisqaPul(m.qoldiq * m.narx)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>` : bosh_yoq('Bu bo\'limda hech narsa yo\'q.');
}
function vOmbor(y) {
	if (y.arg) return vMol(y.arg);
	const pk = pulKorar(), kam = kamlar(), yl = db.kirimlar.filter(k => k.holat === 'yolda'), tay = db.buyurtmalar.filter(b => omborda(b) > 0 && b.bos !== 'jonatildi'), lot = db.matolar.filter(p => p.bos === 'tayyor' && p.qoldiq > 0);
	let ich;
	if (OTUR[y.tab]) ich = `<div class="k">${molJadval(db.mollar.filter(m => m.tur === y.tab))}</div>`;
	else if (y.tab === 'mato') ich = `<div class="k"><div class="kb"><h2>Tayyor mato</h2><div class="ost">Partiya, rang va buyurtma bo'yicha — bichuvga shu yerdan beriladi</div></div>${lot.length ? matoJadval(lot) : bosh_yoq('Omborda tayyor mato yo\'q.')}</div>`;
	else if (y.tab === 'tayyor') ich = `<div class="k"><div class="kb"><h2>Tayyor mahsulot</h2><div class="ost">Qadoqlangan, hali jo'natilmagan</div></div>${tay.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Buyurtma</th><th class="r">Qadoqlangan</th><th class="r">Jo'natilgan</th><th class="r">Omborda</th><th class="r">Jo'natmaga ajratilgan</th></tr></thead><tbody>${tay.map(b => `<tr><td><b>${bYol(b)} · ${topC(b.mijoz).nom}</b><span class="kich">${b.nom}</span></td><td class="r" data-y="Qadoqlangan">${dona(hol(b).j.qadoq)}</td><td class="r" data-y="Jo'natilgan">${dona(jonatilgan(b))}</td><td class="r" data-y="Omborda"><b>${dona(omborda(b))}</b></td><td class="r" data-y="Jo'natmaga ajratilgan">${jonRejada(b) ? dona(jonRejada(b)) : '—'}</td></tr>`).join('')}</tbody></table></div>` : bosh_yoq('Omborda tayyor mahsulot yo\'q.')}</div>`;
	else if (y.tab === 'yolda') ich = yl.length ? `<div class="ry">${yl.map(k => `<div class="el"><div class="ust"><span class="id">${k.id}</span><span class="nom">${esc(k.kim)}</span><span class="b ${kunFarq(k.kutiladi) < 0 ? 'qi' : 'ko'}">Kutilmoqda: ${nisbiy(k.kutiladi)}</span></div><div class="mat">${k.qatorlar.map(q => `${topM(q.m).nom} — ${miq(q.soni, topM(q.m).birlik)}`).join('; ')}</div>${pk ? `<div class="pas"><span class="ong">${qisqaPul(yig(k.qatorlar, q => q.soni * q.narx))}</span></div>` : ''}${amalOmbor() ? `<div class="amal">${tugma('kQabul', 'Omborga qabul qilish', { id: k.id }, 'a k')}</div>` : ''}</div>`).join('')}</div>` : bosh_yoq('Kutilayotgan kirim yo\'q.');
	else if (y.tab === 'jurnal') ich = `<div class="k"><div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Nomi</th><th class="r">Miqdor</th><th>Sabab</th><th>Kim</th></tr></thead><tbody>${db.harakatlar.slice(0, 40).map(h => { const m = topM(h.m); return `<tr><td data-y="Sana">${sana(h.sana)}</td><td><b>${m.nom}</b></td><td class="r" data-y="Miqdor"><b class="${h.soni < 0 ? '' : 'yashil'}">${h.soni > 0 ? '+' : ''}${miq(h.soni, m.birlik)}</b></td><td data-y="Sabab">${esc(h.sabab)}</td><td data-y="Kim">${esc(ism(h.kim))}</td></tr>`; }).join('')}</tbody></table></div></div>`;
	else ich = `<div class="kpi">${kpi('Kam qolganlar', kam.length, 'ta', kam.length ? 'To\'ldirish kerak' : 'Hammasi yetarli', kam.length ? 'yom' : 'yax')}${kpi('Kutilayotgan kirim', yl.length, 'ta', 'Yo\'lda', '', '#/ombor?yolda')}${kpi('Tayyor mato', guruhla(yig(lot, p => p.qoldiq)), 'kg', `${lot.length} ta partiya`, '', '#/ombor?mato')}${kpi('Tayyor mahsulot', guruhla(yig(tay, omborda)), 'dona', `${tay.length} ta buyurtma`, '', '#/ombor?tayyor')}</div>
<div class="k"><div class="kb"><h2>Kam qolganlar</h2><div class="ost">Eng kam chegaradan past yoki ochiq buyurtmalarga yetmaydiganlar</div></div>${kam.length ? molJadval(kam) : bosh_yoq('Hamma narsa yetarli.')}</div>`;
	const tabs = ['ip', 'kimyo', 'furn', 'mato', 'tayyor', 'yolda', 'jurnal'];
	return boshq('Ombor', `${db.mollar.length} ta nom · ${lot.length} ta mato partiyasi`, amalOmbor() ? tugma('yBuy', ik('qosh') + 'Xarid buyurtmasi', {}, 'a') : '') +
		yorliq('#/ombor', tabs.includes(y.tab) ? y.tab : '', [['', 'Kam qolganlar', kam.length, true], ['ip', 'Ip', null], ['mato', 'Mato', lot.length], ['furn', 'Furnitura', null], ['kimyo', 'Bo\'yoq va kimyo', null], ['tayyor', 'Tayyor mahsulot', tay.length], ['yolda', 'Kutilayotgan kirim', yl.length], ['jurnal', 'Jurnal', null]]) + ich;

function vMol(id) {

	const e = ehtiyoj(m.id), yl = yolda(m.id), hs = db.harakatlar.filter(h => h.m === id).slice(0, 20), pk = pulKorar();
	const kimga = m.tur === 'ip' ? db.matolar.filter(p => p.bos === 'navbat' && MATO[p.tur].ip === id).map(p => [`${p.id} · ${p.b || ''} · ${p.r}`, ipKerak(p)]) : m.tur === 'furn' ? db.buyurtmalar.filter(b => b.bos === 'ishlab').map(b => [`${b.id} · ${topC(b.mijoz).nom}`, yig(MODEL[b.model].furn.filter(f => f.m === id), f => Math.max(0, bSoni(b) - hol(b).j[f.op]) * f.n)]).filter(x => x[1] > 0) : [];
	return orqa('#/ombor?' + m.tur, OTUR[m.tur]) + boshq(m.nom, OTUR[m.tur], (amalOmbor() ? tugma('kirim', ik('tush') + 'Kirim', { m: m.id }, 'a') + tugma('yBuy', 'Xarid buyurtmasi', { m: m.id }) : '')) +
		(m.qoldiq < e ? `<div class="eslat qi">${ik('ogoh')}<div><b>Ochiq buyurtmalarga yetmaydi.</b> Kerak ${miq(e, m.birlik)}, omborda ${miq(m.qoldiq, m.birlik)}${yl ? `, yo'lda ${miq(yl, m.birlik)}` : ''}${m.qoldiq + yl < e ? ` — yana ${miq(e - m.qoldiq - yl, m.birlik)} buyurtma qilish kerak` : ' — yo\'ldagi yuk kelgach yetadi'}.</div></div>` : m.qoldiq < m.min ? `<div class="eslat">${ik('ogoh')}<div>Qoldiq eng kam chegaradan past: ${miq(m.qoldiq, m.birlik)} / ${miq(m.min, m.birlik)}.</div></div>` : '') +
		`<div class="k"><div class="tr"><div><span>Omborda</span><b>${miq(m.qoldiq, m.birlik)}</b></div><div><span>Eng kam chegara</span><b>${miq(m.min, m.birlik)}</b></div><div><span>Ochiq buyurtmalarga kerak</span><b>${e ? miq(e, m.birlik) : '—'}</b></div><div><span>Yo'lda</span><b>${yl ? miq(yl, m.birlik) : '—'}</b></div>${pk ? `<div><span>Xarid narxi</span><b>${pul(m.narx)}</b></div><div><span>Qiymati</span><b>${qisqaPul(m.qoldiq * m.narx)}</b></div>` : ''}</div></div>
${kimga.length ? `<div class="k"><div class="kb"><h2>Kimga kerak</h2></div>${gor(kimga.map(x => [x[0], x[1]]), v => miq(v, m.birlik))}</div>` : ''}
<div class="k"><div class="kb"><h2>Harakatlar</h2></div>${hs.length ? `<div class="tarix">${hs.map(h => `<div><time>${sana(h.sana)}</time><span><b class="${h.soni > 0 ? 'yashil' : ''}">${h.soni > 0 ? '+' : ''}${miq(h.soni, m.birlik)}</b> · ${esc(h.sabab)} · ${esc(ism(h.kim))}</span></div>`).join('')}</div>` : bosh_yoq('Harakat yo\'q.')}</div>`;
}

/* ---------- Kalkulyatsiya: buyurtmalar va brendlar bo'yicha ---------- */
function vTannarx(y) {
	const bs = db.buyurtmalar.filter(b => mening(b) && b.bos !== 'bekor').sort((a, b) => a.id < b.id ? 1 : -1);
	let ich;
	if (y.tab === 'brend') {
		const qs = db.mijozlar.filter(meningC).map(c => ({ c, f: brendFoyda(c.id) })).filter(x => x.f.buy).sort((a, b) => b.f.foyda - a.f.foyda);
		ich = `<div class="k"><div class="kb"><h2>Brendlar bo'yicha foyda</h2><div class="ost">Jo'natilgan buyurtmalar: tushum va haqiqiy tannarx</div></div><div class="jw"><table class="j tel"><thead><tr><th>Brend</th><th class="r">Jo'natilgan</th><th class="r">Tushum</th><th class="r">Foyda</th><th class="r">Rentabellik</th></tr></thead><tbody>${qs.map(({ c, f }) => `<tr class="bos" data-h="#/brend/${c.id}"><td><b>${c.nom}</b><span class="kich">${c.tur} · ${c.joy}</span></td><td class="r" data-y="Jo'natilgan">${dona(f.soni)}<span class="kich">${f.buy} ta buyurtma</span></td><td class="r" data-y="Tushum">${qisqaPul(f.tushum)}</td><td class="r" data-y="Foyda"><b class="${f.foyda < 0 ? 'qizil' : 'yashil'}">${qisqaPul(f.foyda)}</b></td><td class="r" data-y="Rentabellik">${foiz(f.foyda, f.tushum)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="k"><div class="kb"><h2>Rentabellik, %</h2></div>${gor(qs.map(({ c, f }) => [c.nom, Math.round(f.foyda / f.tushum * 1000) / 10, f.foyda / f.tushum < 0.14 ? 'sa' : 'ya']), v => String(v).replace('.', ',') + '%')}</div>`;
	} else ich = `<div class="eslat ko">${ik('kalk')}<div>Narx reja sarf bo'yicha beriladi. Haqiqiy tannarx bichuvda sarflangan mato va sifat nazoratidagi brakdan o'zi hisoblanadi — foyda qayerda yo'qolgani buyurtma ichida ko'rinadi.</div></div>
<div class="k"><div class="jw"><table class="j tel"><thead><tr><th>Buyurtma</th><th class="r">Narx</th><th class="r">Tannarx, reja</th><th class="r">Tannarx, haqiqiy</th><th class="r">Foyda, 1 dona</th><th class="r">Rentabellik</th></tr></thead><tbody>${bs.map(b => { const t = tannarx(b), sf = sarfFarq(b); return `<tr class="bos" data-h="#/buyurtma/${b.id}"><td><b>${b.id} · ${topC(b.mijoz).nom}</b><span class="kich">${b.nom}, ${dona(bSoni(b))} · ${BOS[bBos(b)].toLowerCase()}</span></td><td class="r" data-y="Narx">${pul(t.narx)}</td><td class="r" data-y="Tannarx, reja">${pul(t.reja.jami)}</td><td class="r" data-y="Tannarx, haqiqiy">${t.fakt ? `<span class="${t.fakt.jami > t.reja.jami * 1.01 ? 'qizil' : ''}">${pul(t.fakt.jami)}</span>${sf > 1 || t.brakU > 0.015 ? `<span class="kich">${[sf > 1 ? `mato +${miq(sf)}%` : '', t.brakU > 0.015 ? `brak ${foiz(t.brakU, 1)}` : ''].filter(Boolean).join(' · ')}</span>` : ''}` : '—'}</td><td class="r" data-y="Foyda, 1 dona"><b class="${t.joriy.foyda < 0 ? 'qizil' : 'yashil'}">${pul(t.joriy.foyda)}</b></td><td class="r" data-y="Rentabellik">${foiz(t.joriy.foyda, t.narx)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
	return boshq('Kalkulyatsiya', 'Har buyurtmaning reja va haqiqiy tannarxi, foydasi', amalSotuv() ? tugma('yangiBuy', ik('qosh') + 'Yangi so\'rov', {}, 'a') : '') + yorliq('#/tannarx', y.tab === 'brend' ? 'brend' : '', [['', 'Buyurtmalar', bs.length], ['brend', 'Brendlar', null]]) + ich;
}

/* ---------- Brendlar va to'lov holati ---------- */

/* ---------- Pul oqimi ---------- */
function vPul(y) {

	const tur = {}; for (const q of db.xarajatlar.filter(q => ichD(q.sana))) tur[q.tur] = (tur[q.tur] || 0) + q.summa;
	const ich = y.tab === 'xarajat' ? `<div class="qator2"><div class="k"><div class="kb"><h2>Xarajatlar</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Turi</th><th class="r">Summa</th></tr></thead><tbody>${xs.map(q => `<tr><td data-y="Sana">${sana(q.sana)}</td><td><b>${q.tur}</b><span class="kich">${esc(q.izoh)}</span></td><td class="r" data-y="Summa"><b>${qisqaPul(q.summa)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="k"><div class="kb"><h2>Turlar bo'yicha, ${DAVR} kun</h2></div>${gor(Object.keys(tur).sort((a, b) => tur[b] - tur[a]).map(k => [k, tur[k]]), qisqaPul)}</div></div>`
		: `<div class="k"><div class="kb"><h2>Brendlardan kelgan to'lovlar</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Brend</th><th class="r">Summa</th><th class="r">So'mda</th></tr></thead><tbody>${ts.map(q => { const c = topC(q.mijoz); return `<tr><td data-y="Sana">${sana(q.sana)}</td><td><b>${c.nom}</b><span class="kich">${q.b} · ${q.tur === 'avans' ? 'oldindan to\'lov' : 'to\'lov'}</span></td><td class="r" data-y="Summa"><b>${cPul(c, q.summa)}</b></td><td class="r" data-y="So'mda">${qisqaPul(som(c, q.summa))}</td></tr>`; }).join('')}</tbody></table></div></div>`;
	return boshq('Pul oqimi', `So'nggi ${DAVR} kun`, tugma('xarajat', ik('qosh') + 'Xarajat', {}, '') + tugma('tolov', ik('qosh') + 'To\'lov', {}, 'a')) +
		`<div class="kpi">${kpiPul('Tushum', t, `${db.tolovlar.filter(q => ichD(q.sana)).length} ta to'lov`)}${kpiPul('Xarajat', x, `${db.xarajatlar.filter(q => ichD(q.sana)).length} ta yozuv`)}${kpiPul('Farq', t - x, t - x >= 0 ? 'Tushum ko\'p' : 'Xarajat ko\'p', t - x < 0 ? 'yom' : 'yax')}${kpi('Namuna kursi', guruhla(db.kurs), 'so\'m', '1 USD uchun')}</div>` +
		yorliq('#/pul', y.tab === 'xarajat' ? 'xarajat' : '', [['', 'Tushumlar', null], ['xarajat', 'Xarajatlar', null]]) + ich;
}

function csvQatorlar(k) {

	if (k === 'buyurtma') return [['Buyurtma', 'Brend', 'Model', 'Dona', 'Bosqich', 'Muddat', 'Bashorat', 'Kechikish, kun', ...OPLAR.map(o => OP_Q[o]), 'Brak', 'Jo\'natilgan'], ...bs.map(b => { const h = hol(b), p = bashorat(b); return [b.id, topC(b.mijoz).nom, b.nom, bSoni(b), BOS[bBos(b)], sana(b.muddat), p ? sana(p.sana) : '', bKech(b) || (p ? p.kech : 0), ...OPLAR.map(o => h.j[o]), h.brak, jonatilgan(b)]; })];
	if (k === 'matritsa') { const r = [['Buyurtma', 'Brend', 'Rang', 'O\'lcham', 'Reja', 'Bichilgan', 'Tikilgan', 'Sifatdan o\'tgan', 'Qadoqlangan']]; for (const b of bs.filter(x => x.bos === 'ishlab' || x.bos === 'tayyor')) for (const rg of Object.keys(b.mat)) for (const o of b.olcham) r.push([b.id, topC(b.mijoz).nom, rg, o, b.mat[rg][o], bajar(b, 'bichuv', rg, o), bajar(b, 'tikuv', rg, o), bajar(b, 'sifat', rg, o), bajar(b, 'qadoq', rg, o)]); return r; }
	if (k === 'tannarx') return [['Buyurtma', 'Brend', 'Model', 'Dona', 'Narx, so\'m', 'Mato sarfi reja, g', 'Mato sarfi haqiqiy, g', 'Brak, %', 'Tannarx reja', 'Tannarx haqiqiy', 'Foyda 1 dona', 'Rentabellik, %'], ...bs.map(b => { const t = tannarx(b); return [b.id, topC(b.mijoz).nom, b.nom, bSoni(b), t.narx, b.kalk.sarf * 1000, t.sarf ? t.sarf * 1000 : '', t.fakt ? t.brakU * 100 : '', t.reja.jami, t.fakt ? t.fakt.jami : '', t.joriy.foyda, t.joriy.foyda / t.narx * 100]; })];
	if (k === 'chiqim') return [['Sana', 'Sex yoki liniya', 'Bosqich', 'Buyurtma', 'Rang', 'Dona', 'Brak', 'Mato, kg'], ...db.chiqim.filter(x => ichD(x.sana)).sort((a, b) => a.sana < b.sana ? 1 : -1).map(x => [sana(x.sana), topL(x.lin).nom, OP[x.op], x.b, x.r, ySoni(x), x.brak || '', x.kg || ''])];
	if (k === 'tolov') return [['Brend', 'Turi', 'Valyuta', 'Oldindan, %', 'Muddat, kun', 'Jo\'natilgan', 'To\'langan', 'To\'lanmagan', 'Muddati o\'tgan', 'Eng eski kechikish, kun', 'Oldindan to\'langan'], ...db.mijozlar.map(c => { const x = mHisob(c.id); return [c.nom, c.tur, c.val, c.avans, c.muddat, x.jon, x.tol, x.qol, x.kech, x.kun, x.avans]; })];
	if (k === 'ombor') return [['Nomi', 'Bo\'lim', 'Birlik', 'Qoldiq', 'Eng kam chegara', 'Ochiq buyurtmalarga kerak', 'Yo\'lda', 'Narx', 'Qiymat'], ...db.mollar.map(m => [m.nom, OTUR[m.tur], m.birlik, m.qoldiq, m.min, ehtiyoj(m.id), yolda(m.id), m.narx, m.qoldiq * m.narx]), [], ['Mato partiyasi', 'Buyurtma', 'Mato', 'Rang', 'Reja, kg', 'Bosqich', 'Omborda, kg'], ...db.matolar.map(p => [p.id, p.b || '', MATO[p.tur].q, p.r, p.kg, MBOS[p.bos], p.qoldiq])];
	if (k === 'haq') return [['Ishchi', 'Liniya', 'Lavozim', 'Hisoblash turi', 'Ulush', 'Hisoblandi', 'Avans', 'To\'lanadi'], ...db.ishchilar.map(w => [w.ism, w.lin ? topL(w.lin).nom : '', w.lavozim, w.tur === 'oylik' ? 'Oylik' : 'Ishbay', w.ulush, wHisob(w), w.avans, wQol(w)])];
	if (k === 'xarajat') return [['Sana', 'Yo\'nalish', 'Turi', 'Summa, so\'m', 'Izoh'], ...db.tolovlar.map(t => [sana(t.sana), 'Tushum', topC(t.mijoz).nom, som(topC(t.mijoz), t.summa), t.b]), ...db.xarajatlar.map(x => [sana(x.sana), 'Xarajat', x.tur, x.summa, x.izoh])];
	return [];
}

<div>${ik('ha')}<span><b>1C o'z joyida qoladi.</b> Buxgalteriya, soliq va rasmiy hisobot 1C da yuritiladi. Bu tizim sexda nima bo'lganini yig'adi: qaysi buyurtma qaysi bosqichda, qancha mato ketdi, kim qancha tikdi.</span></div>
<div>${ik('tush')}<span><b>Tizimdan 1C ga.</b> Jo'natmalar, ish haqi qaydnomasi va xarajatlar reyestri fayl bo'lib chiqadi — hisobchi qayta termaydi, solishtiradi.</span></div>

/* ===== ilova3.js ===== */
/* 3-qism: oynalar, amallar (holatni o'zgartiradi), chizish va ishga tushirish. */

function xabar(m) {
	const el = $('#xabar'); el.innerHTML = `<div class="xabar" role="status">${esc(m)}</div>`; Yozuv.dom(el, ui.til);
	clearTimeout(xabar.t); xabar.t = setTimeout(() => { el.innerHTML = ''; }, 4600);
}
function oyna(sarlavha, ich, o) {
	o = o || {};
	const el = $('#oyna');
	el.innerHTML = `<div class="parda"><form class="oyna" role="dialog" aria-modal="true" aria-label="${esc(sarlavha)}" ${o.forma ? `data-f="${o.forma}"` : 'data-bosh'}><header><h2>${esc(sarlavha)}</h2><button type="button" data-a="yop" aria-label="Yopish">${ik('yop')}</button></header><div class="ich">${ich}</div>${o.forma ? `<footer><button type="button" class="t" data-a="yop">Bekor qilish</button><button class="t a" type="submit">${o.tugma || 'Saqlash'}</button></footer>` : ''}</form></div>`;
	Yozuv.dom(el, ui.til);
	const b = el.querySelector('.ich input:not([type=hidden]),.ich select,.ich textarea,.ich button,.ich a'); if (b) b.focus();
}
const yop = () => { $('#oyna').innerHTML = ''; };
function yangila(m) { saqla(); yop(); chiz(); if (m) xabar(m); }
const borish = h => { if (location.hash === h) chiz(); else location.hash = h; };
const son = v => { const n = parseInt(String(v || '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? 0 : n; };
const kasr = v => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isNaN(n) || n < 0 ? 0 : Math.round(n * 100) / 100; };
const may = (yorliq, ich, yord) => `<label class="may"><span>${yorliq}</span>${ich}${yord ? `<span class="yord">${yord}</span>` : ''}</label>`;
const tanla = (nom, opt, joriy, qosh) => `<select class="in" name="${nom}" ${qosh || ''}>${opt.map(([v, n]) => `<option value="${esc(v)}" ${String(v) === String(joriy) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
const matn = (nom, q) => `<input class="in" name="${nom}" type="text" ${q || ''}>`;
const raqam = (nom, qiymat, q) => `<input class="in" name="${nom}" type="text" inputmode="decimal" value="${qiymat == null ? '' : qiymat}" ${q || ''}>`;
const yashirin = (nom, v) => `<input type="hidden" name="${nom}" value="${esc(v)}">`;
const vergul = n => String(n).replace('.', ',');
function eslatmaMatni(c, h) {
	const q = h.q.filter(x => x.qol >= 0.5 && x.farq < 0);
	return `Assalomu alaykum, ${c.masul}. TIMTEX nomidan eslatma: ${q.map(x => `${x.j.id} jo'natmasi (${sana(x.j.sana)}, ${x.b.id}) bo'yicha ${cPul(c, x.qol)}, muddati ${sana(x.j.muddat)} da o'tgan`).join('; ')}. Jami: ${cPul(c, h.kech)}. Iltimos, to'lov sanasini ma'lum qiling.`;
}
// Liniya tanlash ro'yxati: har liniyada shu buyurtma qachon tayyor bo'lishi bilan
const linTanlov = b => db.liniyalar.filter(l => l.op === 'tikuv').map(l => { const x = navbat(l.id, b).find(q => q.b === b); return [l.id, `${l.nom} — tayyor bo'ladi ${sana(kunQosh(db.bugun, x.tk))}${x.kech ? `, +${x.kech} kun` : ', ulguradi'}`]; });

/* ---------- Tugma amallari ---------- */
const AMAL = {
	til(d) { ui.til = d.t; saqla(); yop(); chiz(); },
	rolTanla(d) { ui.tanlov = d.r; ui.pinXato = false; chiz(); },
	rolOrqa() { ui.tanlov = null; ui.pinXato = false; chiz(); },
	chiqish() { ui.rol = null; ui.kim = null; ui.tanlov = null; ui.oxirgiYol = ''; saqla(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* fayldan ochilganda */ } yop(); chiz(); window.scrollTo(0, 0); },
	qayta() { oyna('Namunani boshidan boshlash', `<p>Namunada kiritilgan o'zgarishlar o'chadi va hammasi dastlabki holatiga qaytadi.</p>`, { forma: 'qayta', tugma: 'Boshidan boshlash' }); },
	yop() { yop(); },
	yana() { oyna('Bo\'limlar', `<nav class="et">${NAV[ui.rol].slice(4).map(k => { const b = BOLIM[k]; return `<a href="${b.h}"><span class="nuq ko">${ik(b.i)}</span><span><b>${b.n}</b></span><span class="uq">${ik('ong')}</span></a>`; }).join('')}</nav>`); },

	/* Buyurtma */
	yangiBuy() {
		if (!amalSotuv()) return;
		const cs = db.mijozlar.filter(meningC);
		oyna('Yangi buyurtma so\'rovi', may('Brend', tanla('mijoz', cs.map(c => [c.id, `${c.nom} — ${c.val === 'USD' ? 'narx dollarda' : 'narx so\'mda'}`]), cs[0].id)) + may('Model', tanla('model', Object.keys(MODEL).map(k => [k, `${MODEL[k].nom} — ${MATO[MODEL[k].mato].q}`]), 'fut'), 'Mato sarfi, furnitura va ishbay narxlari model andozasidan olinadi') +
			may('Ranglar', matn('ranglar', 'required placeholder="Masalan: Oq, Qora, Kulrang"'), 'Vergul bilan ajrating') +
			`<div class="may2">${may('Har rangdan (dona)', raqam('jami', '', 'required inputmode="numeric"'), 'O\'lchamlarga 1:2:2:2:1 nisbatda bo\'linadi')}${may('1 dona narxi', raqam('narx', ''), 'Bo\'sh qolsa — andoza narxi')}</div>
<div class="may2">${may('Jo\'natish muddati', `<input class="in" name="muddat" type="date" min="${kunQosh(db.bugun, 14)}" value="${kunQosh(db.bugun, 40)}" required>`)}${may('Artikul', matn('art', 'placeholder="Masalan: TB-OV-27"'))}</div>`, { forma: 'buy', tugma: 'So\'rovni saqlash' });
	},
	kalkOzgar(d) {
		const b = topB(d.b); if (!b || !amalSotuv() || !['sorov', 'namuna'].includes(b.bos)) return;
		const k = b.kalk, c = topC(b.mijoz);
		oyna(`Kalkulyatsiya: ${b.id}`, yashirin('b', b.id) + `<div class="may2">${may('Mato sarfi (1 donaga, g)', raqam('sarf', Math.round(k.sarf * 1000), 'required'))}${may('Mato narxi (1 kg, so\'m)', raqam('matoNarx', k.matoNarx, 'required'))}</div>
<div class="may2">${may('Furnitura va qadoq (so\'m)', raqam('furn', k.furn, 'required'))}${may('Bosma va kashta (so\'m)', raqam('bezak', k.bezak))}</div>
<div class="may2">${may('Tikuv ishbay narxi (so\'m)', raqam('tikuv', k.haq.tikuv, 'required'))}${may('Ustama xarajat (%)', raqam('ust', k.ust, 'required'))}</div>` +
			may(`1 dona sotuv narxi (${c.val === 'USD' ? 'dollar' : 'so\'m'})`, raqam('narx', vergul(b.narx), 'required'), 'Saqlangach tannarx va foyda qayta hisoblanadi'), { forma: 'kalk', tugma: 'Qayta hisoblash' });
	},
	sorovTasdiq(d) {
		const b = topB(d.b); if (!b || !amalSotuv() || b.bos !== 'sorov') return;
		b.bos = 'namuna'; voqea(b.id, `Narx kelishildi: ${narxMatn(topC(b.mijoz), b.narx)}. Namuna bosqichi boshlandi`);
		yangila(`${b.id}: narx kelishildi. Endi namunalar yuboriladi.`);
	},
	nYubor(d) { const b = topB(d.b), x = b && b.tasdiq.find(t => t.t === d.t); if (!x || !amalSotuv() || b.bos !== 'namuna') return; x.yub = db.bugun; x.tas = null; voqea(b.id, `${TAS[x.t]} mijozga yuborildi`); yangila('Yuborilgan deb belgilandi. Javob kutiladi.'); },
	nTasdiq(d) { const b = topB(d.b), x = b && b.tasdiq.find(t => t.t === d.t); if (!x || !x.yub || !amalSotuv()) return; x.tas = db.bugun; voqea(b.id, `${TAS[x.t]} tasdiqlandi`); yangila(tasTugadi(b) ? 'Hamma namuna tasdiqlandi — buyurtmani ishlab chiqarishga berish mumkin.' : 'Tasdiqlandi.'); },
	nRad(d) { const b = topB(d.b), x = b && b.tasdiq.find(t => t.t === d.t); if (!x || !amalSotuv()) return; x.yub = null; x.tas = null; voqea(b.id, `${TAS[x.t]} qayta ishlashga qaytdi`); yangila('Namuna qayta tayyorlanadi.'); },
	ruxsat(d) { const b = topB(d.b); if (!b || ui.rol !== 'rahbar') return; b.ruxsat = true; voqea(b.id, 'Rahbar oldindan to\'lovsiz ishlab chiqarishga ruxsat berdi'); yangila('Ruxsat berildi.'); },
	ishlabBer(d) {
		const b = topB(d.b); if (!b || !amalSotuv() || b.bos !== 'namuna') return;
		if (!tasTugadi(b)) { xabar('Avval hamma namuna tasdiqlanishi kerak.'); return; }
		if (!avansHolat(b).yetar) { xabar('Oldindan to\'lov to\'liq kelmagan.'); return; }
		const opt = linTanlov(b);
		oyna(`Ishlab chiqarishga berish: ${b.id}`, yashirin('b', b.id) + may('Tikuv liniyasi', tanla('lin', opt, (opt.find(o => o[1].includes('ulguradi')) || opt[0])[0]), 'Sana liniyadagi navbat va quvvatdan hisoblangan') +
			`<p class="yord">Har rang uchun mato partiyasi navbatga qo'yiladi: jami ${miq(yig(Object.keys(b.mat), r => Math.round(rSoni(b, r) * b.kalk.sarf * 1.04)), 'kg')} ${MATO[b.mato].q.toLowerCase()}.</p>`, { forma: 'ishlab', tugma: 'Ishlab chiqarishga berish' });
	},
	linAlmash(d) {
		const b = topB(d.b); if (!b || !amalIshlab() || b.bos !== 'ishlab' || hol(b).j.tikuv) return;
		oyna(`Liniyani almashtirish: ${b.id}`, yashirin('b', b.id) + may('Tikuv liniyasi', tanla('lin', linTanlov(b), b.lin), `Hozir: ${topL(b.lin).nom}`), { forma: 'lin', tugma: 'O\'tkazish' });
	},
	linOtkaz(d) { const b = topB(d.b), l = topL(d.l); if (!b || !l || !amalIshlab() || hol(b).j.tikuv) return; b.lin = l.id; voqea(b.id, `${l.nom}ga o'tkazildi`); kesh = {}; const p = bashorat(b); yangila(`${b.id} ${l.nom}ga o'tkazildi. Bashorat: ${sana(p.sana)}${p.kech ? '' : ' — muddatga ulguradi'}.`); },
	kamYop(d) { const b = topB(d.b); if (!b || !amalIshlab() || !kamYopish(b)) return; b.kam = bSoni(b) - hol(b).j.qadoq; b.bos = 'tayyor'; voqea(b.id, `Buyurtma ${b.kam} dona kam bilan yopildi (brak)`); yangila(`${b.id} jo'natishga tayyor: ${dona(hol(b).j.qadoq)}.`); },

	/* Mato partiyasi */
	matoKeyin(d) {
		const p = topP(d.id); if (!p || !amalIshlab() || p.bos === 'tayyor') return;
		if (p.bos === 'navbat') {
			const ip = topM(MATO[p.tur].ip), kerak = ipKerak(p);
			if (ip.qoldiq < kerak) { xabar(`${ip.nom} yetmaydi: kerak ${miq(kerak, 'kg')}, omborda ${miq(ip.qoldiq, 'kg')}.`); return; }
			harakat(ip.id, -kerak, `To'quvga berildi: ${p.id}${p.b ? ', ' + p.b : ''}, ${p.r.toLowerCase()}`);
		}
		p.bos = MBOS_T[MBOS_T.indexOf(p.bos) + 1]; p.sana = db.bugun;
		if (p.bos === 'tayyor') p.qoldiq = p.kg;
		if (p.b) voqea(p.b, `Mato partiyasi ${p.id} (${p.r.toLowerCase()}): ${MBOS[p.bos].toLowerCase()}`);
		yangila(p.bos === 'tayyor' ? `${p.id} tayyor: ${miq(p.kg, 'kg')} omborga kirdi, bichuvga berish mumkin.` : `${p.id}: ${MBOS[p.bos].toLowerCase()}.${p.bos === 'toquv' ? ' Ip ombordan chiqdi.' : ''}`);
	},

	/* Chiqim */
	chiqimR(d) {
		const b = topB(d.b); if (!b || !chiqimMumkin(b, d.op)) return;
		const rs = Object.keys(b.mat).filter(r => rMumkin(b, d.op, r) > 0);
		oyna(`${OP[d.op]}: ${b.id}`, `<p style="margin-bottom:12px">Rangni tanlang:</p><div class="rollar">${rs.map(r => `<button class="rol" type="button" data-a="chiqim" data-b="${b.id}" data-op="${d.op}" data-r="${esc(r)}"><span><span class="n">${esc(r)}</span><span class="d">Kiritish mumkin: ${dona(rMumkin(b, d.op, r))}</span></span></button>`).join('')}</div>`);
	},
	chiqim(d) {
		const b = topB(d.b), op = d.op, r = d.r; if (!b || !b.mat[r] || !chiqimMumkin(b, op)) return;
		const l = opLin(b, op);
		oyna(`${OP[op]}: ${b.id}, ${r}`, yashirin('b', b.id) + yashirin('op', op) + yashirin('r', r) + `<p class="yord" style="margin-bottom:10px">${l.nom} · ${b.nom}. Har o'lcham ostida — yana nechta kiritish mumkinligi.</p>
<div class="olch">${b.olcham.map((o, i) => `<label><span data-asl>${o}</span><input class="in" name="o${i}" type="text" inputmode="numeric" autocomplete="off" aria-label="${o}"><small>${guruhla(mumkin(b, op, r, o))}</small></label>`).join('')}</div>` +
			(op === 'bichuv' ? may('Sarflangan mato (kg)', raqam('kg', '', 'required'), `Omborda shu rang matosi: ${miq(matoBor(b, r), 'kg')} · me'yor: 1 donaga ${miq(b.kalk.sarf * 1000, 'g')}`) : '') +
			(op === 'sifat' ? may('Brak (dona)', raqam('brak', '', 'inputmode="numeric"'), 'Sifat nazoratidan o\'tmagan, tuzatib bo\'lmaydigan') : ''), { forma: 'chiqim', tugma: 'Chiqimni saqlash' });
	},
	chiqimBekor(d) {
		const i = +d.i, y = db.chiqim[i]; if (!y || y.sana !== db.bugun) return;
		const b = topB(y.b); if (!chiqimMumkin(b, y.op)) return;
		const t = opTartib(b), keyingi = t[t.indexOf(y.op) + 1];
		if (keyingi && Object.keys(y.q).some(o => bajar(b, y.op, y.r, o) - y.q[o] < bajar(b, keyingi, y.r, o))) { xabar('Bekor qilib bo\'lmaydi: bu dona keyingi bosqichda allaqachon qayd etilgan.'); return; }
		if (y.kg) { const p = db.matolar.find(x => x.b === b.id && x.r === y.r && x.bos === 'tayyor'); if (p) p.qoldiq = Math.round((p.qoldiq + y.kg) * 10) / 10; }
		for (const f of MODEL[b.model].furn) if (f.op === y.op) harakat(f.m, ySoni(y) * f.n, `Chiqim bekor qilindi: ${b.id}`);
		db.chiqim.splice(i, 1);
		if (b.bos === 'tayyor' && !jonatilgan(b)) b.bos = 'ishlab';
		yangila('Yozuv bekor qilindi.');
	},

	/* Jo'natma */
	jonYarat(d) {
		const b = topB(d.b); if (!b || !amalSotuv()) return;
		const bor = omborda(b) - jonRejada(b); if (bor <= 0) { xabar('Jo\'natishga tayyor dona yo\'q.'); return; }
		const c = topC(b.mijoz);
		oyna(`Jo'natma tayyorlash: ${b.id}`, yashirin('b', b.id) + `<p style="margin-bottom:10px"><b>${c.nom}</b> · ${c.joy}<br><span class="yord">Omborda tayyor: ${dona(bor)}</span></p>
<div class="may2">${may('Dona', raqam('soni', bor, 'required inputmode="numeric"'))}${may('Yuklash sanasi', `<input class="in" name="sana" type="date" min="${db.bugun}" value="${kunQosh(db.bugun, 2)}" required>`)}</div>` +
			may('Transport', tanla('transport', (c.val === 'USD' ? ['Avtomobil (fura)', 'Temir yo\'l konteyneri', 'Yig\'ma yuk'] : ['O\'z transporti', 'Mijoz olib ketadi', 'Yuk tashuvchi']).map(x => [x, x]), '')) +
			`<p class="yord">Hujjatlar ro'yxati brend davlatiga qarab qo'yiladi: ${(c.val === 'USD' ? ['invoys', 'qadoq', 'cmr', 'sert', 'dekl'] : ['faktura', 'yukxat']).map(k => HUJ[k]).join(', ')}.</p>`, { forma: 'jon', tugma: 'Jo\'natmani saqlash' });
	},
	hujBelgi(d) { const j = topJ(d.id); if (!j || !amalSotuv() || j.holat !== 'tayyor' || !(d.k in j.huj)) return; j.huj[d.k] = !j.huj[d.k]; saqla(); chiz(); },
	yukla(d) {
		const j = topJ(d.id); if (!j || j.holat !== 'tayyor' || !(amalOmbor() || ui.rol === 'rahbar')) return;
		if (Object.keys(j.huj).some(k => !j.huj[k])) { xabar('Hujjatlar to\'liq emas — yuk chiqmaydi.'); return; }
		const b = topB(j.b), c = topC(j.mijoz);
		j.holat = 'yolda'; j.sana = db.bugun; j.muddat = kunQosh(db.bugun, c.muddat); kesh = {};
		if (b.bos === 'tayyor' && jonatilgan(b) >= hol(b).j.qadoq) b.bos = 'jonatildi';
		voqea(b.id, `${j.id} yuklandi: ${j.soni} dona, ${j.transport.toLowerCase()}`);
		yangila(`${j.id} yuklandi. ${c.muddat ? `To'lov muddati: ${sana(j.muddat)}.` : ''}`);
	},
	yetdi(d) { const j = topJ(d.id); if (!j || j.holat !== 'yolda' || !amalSotuv()) return; j.holat = 'yetdi'; voqea(j.b, `${j.id} mijozga yetkazildi`); yangila(`${j.id} yetkazilgan deb belgilandi.`); },

	/* To'lov va eslatma */
	tolov(d) {
		if (!amalSotuv()) return;
		const bs = db.buyurtmalar.filter(b => mening(b) && b.bos !== 'bekor' && (!d.c || b.mijoz === d.c)).sort((a, b) => a.id < b.id ? 1 : -1);
		if (!bs.length) { xabar('Bu brendda buyurtma yo\'q.'); return; }
		oyna('To\'lov kiritish', may('Buyurtma', tanla('b', bs.map(b => { const c = topC(b.mijoz); return [b.id, `${b.id} · ${c.nom} — summa ${cPul(c, bJami(b))}, to'langan ${cPul(c, bTolandi(b))}`]; }), d.b || bs[0].id), 'To\'lov shu buyurtmaga yoziladi') +
			may('Summa', raqam('summa', '', 'required inputmode="numeric"'), 'Brend valyutasida: dollar yoki so\'m'), { forma: 'tolov', tugma: 'To\'lovni saqlash' });
	},
	eslatma(d) {
		const c = topC(d.c); if (!c || !amalSotuv()) return;
		oyna(`Eslatma: ${c.nom}`, yashirin('c', c.id) + may('Nima deyildi', `<textarea class="in" name="matn" required placeholder="Masalan: telefonda gaplashildi"></textarea>`) + may('Va\'da qilingan to\'lov sanasi', `<input class="in" name="vada" type="date" min="${db.bugun}">`, 'Bo\'sh qolsa — va\'da berilmagan'), { forma: 'eslatma' });
	},
	eslatMatn(d) {
		const c = topC(d.c); if (!c || !amalSotuv()) return;
		oyna(`Eslatma matni: ${c.nom}`, `<div class="xat">${esc(eslatmaMatni(c, mHisob(c.id)))}</div><p class="yord">Matn jo'natmalar va muddatlardan o'zi tuziladi. To'liq tizimda mijoz tilida va Telegram orqali yuboriladi.</p>`);
	},

	/* Ombor */
	kirim(d) {
		if (!amalOmbor()) return;
		const m = topM(d.m);
		oyna('Kirim', yashirin('m', m.id) + `<p style="margin-bottom:10px"><b>${esc(m.nom)}</b><br><span class="yord">Hozir omborda ${miq(m.qoldiq, m.birlik)}</span></p>` + may(`Miqdor (${m.birlik})`, raqam('soni', '', 'required')) + may('Izoh', matn('izoh', 'placeholder="Masalan: yuk xati raqami"')), { forma: 'kirim', tugma: 'Kirim qilish' });
	},
	kQabul(d) {
		if (!amalOmbor()) return;
		const k = db.kirimlar.find(x => x.id === d.id);
		if (!k || k.holat !== 'yolda') return;
		for (const q of k.qatorlar) harakat(q.m, q.soni, `Kirim: ${k.id}, ${k.kim.toLowerCase()}`);
		k.holat = 'qabul'; yangila(`${k.id} omborga qabul qilindi, qoldiq yangilandi.`);
	},
	yBuy(d) {
		if (!amalOmbor()) return;
		oyna('Xarid buyurtmasi', may('Yetkazib beruvchi', matn('kim', 'required placeholder="Masalan: ip ta\'minotchisi"')) + may('Nima', tanla('m', db.mollar.map(x => [x.id, `${x.nom} — omborda ${miq(x.qoldiq, x.birlik)}`]), d.m || 'ip_30p')) +
			`<div class="may2">${may('Miqdor', raqam('soni', '', 'required'))}${may('Necha kunda keladi', raqam('kun', 3, 'required'))}</div>`, { forma: 'ybuy', tugma: 'Buyurtmani saqlash' });
	},

	/* Ish haqi va xarajat */
	avans(d) {
		const w = topW(d.w); if (!w || ui.rol !== 'rahbar') return;
		oyna(`Avans: ${w.ism}`, yashirin('w', w.id) + `<p style="margin-bottom:10px" class="yord">Hisoblandi ${pul(wHisob(w))} · berilgan avans ${pul(w.avans)} · to'lanadi ${pul(wQol(w))}</p>` + may('Summa (so\'m)', raqam('summa', '', 'required inputmode="numeric"')), { forma: 'avans', tugma: 'Avans berish' });
	},
	xarajat() {
		if (ui.rol !== 'rahbar') return;
		oyna('Xarajat qo\'shish', may('Turi', tanla('tur', XTUR.map(x => [x, x]), 'Boshqa')) + may('Summa (so\'m)', raqam('summa', '', 'required inputmode="numeric"')) + may('Izoh', matn('izoh', '')), { forma: 'xarajat' });
	},
	csv(d) {
		if (ui.rol !== 'rahbar') return;
		const f = ui.til === 'kir' ? Yozuv.kir : Yozuv.lot;
		const q = csvQatorlar(d.h).map(r => r.map(c => { const s = typeof c === 'number' ? vergul(Math.round(c * 100) / 100) : f(String(c)); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
		try {
			const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + q], { type: 'text/csv;charset=utf-8' })); a.download = 'timtex-' + d.h + '.csv';
			document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
			xabar('Jadval Excel uchun yuklab olindi.');
		} catch (e) { xabar('Bu brauzerda yuklab olish ishlamadi.'); }
	},
};

/* ---------- Forma saqlash ---------- */
const FORMA = {
	pin(d) {
		const x = topX(KIMLAR[ui.tanlov]);
		if (d.pin !== x.pin) { ui.pinXato = true; chiz(); return; }
		ui.rol = ui.tanlov; ui.kim = x.id; ui.tanlov = null; ui.pinXato = false; ui.oxirgiYol = ''; saqla(); borish(boshSahifa());
	},
	qayta() { db = Malumot.urug(new Date()); saqla(); yop(); if (ui.rol) borish(boshSahifa()); else chiz(); xabar('Namuna dastlabki holatiga qaytdi.'); },
	buy(d) {
		const c = topC(d.mijoz), md = MODEL[d.model]; if (!c || !md || !amalSotuv() || !meningC(c)) return;
		const ranglar = [...new Set(String(d.ranglar || '').split(',').map(x => x.trim().slice(0, 20)).filter(Boolean).map(x => x.charAt(0).toUpperCase() + x.slice(1)))].slice(0, 8), jami = son(d.jami);
		if (!ranglar.length) { xabar('Kamida bitta rang yozing.'); return; }
		if (jami < 50) { xabar('Har rangdan kamida 50 dona kiriting.'); return; }
		const narx = kasr(d.narx) || (c.val === 'USD' ? md.narx : Math.round(md.narx * db.kurs / 500) * 500);
		const b = { id: yangiId('B'), mijoz: c.id, model: d.model, nom: md.nom, art: (d.art || '').trim().slice(0, 20), mato: md.mato, bezak: md.bezak, olcham: md.olcham, mat: Malumot.matritsa(ranglar, md.olcham, jami), narx, muddat: d.muddat || kunQosh(db.bugun, 40), sana: db.bugun, bos: 'sorov', lin: null, tasdiq: ['lab', 'fit', 'pp'].map(t => ({ t, yub: null, tas: null })), kalk: Malumot.kalk(d.model, db.mollar), ruxsat: false, izoh: '' };
		db.buyurtmalar.push(b); voqea(b.id, 'So\'rov qabul qilindi, kalkulyatsiya andozadan tuzildi');
		saqla(); yop(); const t = tannarx(b); xabar(`${b.id} saqlandi: ${dona(bSoni(b))}, tannarx ${pul(t.reja.jami)}, foyda ${foiz(t.reja.foyda, t.narx)}.`); borish('#/buyurtma/' + b.id);
	},
	kalk(d) {
		const b = topB(d.b); if (!b || !amalSotuv() || !['sorov', 'namuna'].includes(b.bos)) return;
		const sarf = kasr(d.sarf), narx = kasr(d.narx), mn = son(d.matoNarx);
		if (sarf < 20 || narx <= 0 || mn < 1000) { xabar('Mato sarfi, mato narxi va sotuv narxini to\'g\'ri kiriting.'); return; }
		Object.assign(b.kalk, { sarf: sarf / 1000, matoNarx: mn, furn: son(d.furn), bezak: b.kalk.bezak ? Math.max(1, son(d.bezak)) : 0, ust: Math.min(60, kasr(d.ust)) });
		b.kalk.haq.tikuv = son(d.tikuv); b.narx = narx;
		const t = tannarx(b); voqea(b.id, `Kalkulyatsiya o'zgartirildi: tannarx ${pul(t.reja.jami)}`);
		yangila(`Qayta hisoblandi: tannarx ${pul(t.reja.jami)}, foyda ${pul(t.reja.foyda)} (${foiz(t.reja.foyda, t.narx)}).`);
	},
	ishlab(d) {
		const b = topB(d.b), l = topL(d.lin); if (!b || !l || l.op !== 'tikuv' || !amalSotuv() || b.bos !== 'namuna' || !tasTugadi(b) || !avansHolat(b).yetar) return;
		b.bos = 'ishlab'; b.lin = l.id;
		for (const r of Object.keys(b.mat)) db.matolar.push({ id: yangiId('MP'), b: b.id, r, tur: b.mato, kg: Math.round(rSoni(b, r) * b.kalk.sarf * 1.04), qoldiq: 0, bos: 'navbat', sana: db.bugun });
		voqea(b.id, `Ishlab chiqarishga berildi: ${l.nom}. Mato partiyalari navbatga qo'yildi`);
		kesh = {}; const p = bashorat(b);
		yangila(`${b.id} ishlab chiqarishga berildi. Bashorat: ${sana(p.sana)}${p.kech ? `, muddatdan ${p.kech} kun kech` : ' — muddatga ulguradi'}.`);
	},
	lin(d) { AMAL.linOtkaz({ b: d.b, l: d.lin }); },
	chiqim(d) {
		const b = topB(d.b), op = d.op, r = d.r; if (!b || !b.mat[r] || !chiqimMumkin(b, op)) return;
		const q = {}; let s = 0;
		for (let i = 0; i < b.olcham.length; i++) {
			const o = b.olcham[i], v = son(d['o' + i]), eng = mumkin(b, op, r, o);
			if (v > eng) { xabar(`${o} o'lchamda eng ko'pi ${guruhla(eng)} dona kiritish mumkin.`); return; }
			if (v > 0) { q[o] = v; s += v; }
		}
		const brak = op === 'sifat' ? son(d.brak) : 0, kg = op === 'bichuv' ? Math.round(kasr(d.kg) * 10) / 10 : 0;
		if (!s && !brak) { xabar('Kamida bitta o\'lchamga son kiriting.'); return; }
		if (op === 'sifat' && s + brak > rMumkin(b, op, r)) { xabar(`Tikuvdan kelgan dona yetmaydi: eng ko'pi ${guruhla(rMumkin(b, op, r))} (brak bilan birga).`); return; }
		if (op === 'bichuv') {
			if (kg <= 0) { xabar('Sarflangan matoni kg da kiriting.'); return; }
			if (kg > matoBor(b, r) + 1e-9) { xabar(`Omborda shu rang matosi yetmaydi: ${miq(matoBor(b, r), 'kg')}.`); return; }
			let qol = kg; for (const p of db.matolar.filter(x => x.b === b.id && x.r === r && x.bos === 'tayyor')) { const ol = Math.min(p.qoldiq, qol); p.qoldiq = Math.round((p.qoldiq - ol) * 10) / 10; qol -= ol; }
		}
		const l = opLin(b, op), y = { sana: db.bugun, b: b.id, op, lin: l.id, r, q };
		if (kg) y.kg = kg; if (brak) y.brak = brak;
		db.chiqim.push(y);
		for (const f of MODEL[b.model].furn) if (f.op === op && s) harakat(f.m, -s * f.n, `${b.id}: ${OP[op].toLowerCase()}, ${dona(s)}`);
		kesh = {};
		let qosh = '';
		if (op === 'bichuv') { const g = kg / s * 1000, m = b.kalk.sarf * 1000; qosh = ` 1 donaga ${miq(g, 'g')} mato${g > m * 1.03 ? ` — me'yordan ${miq((g / m - 1) * 100)}% ortiq` : ', me\'yorda'}.`; }
		if (op === 'tikuv') qosh = ` Brigada jamg'armasiga ${pul(s * b.kalk.haq.tikuv)} qo'shildi.`;
		if (hol(b).j.qadoq >= bSoni(b)) { b.bos = 'tayyor'; voqea(b.id, 'Hamma dona qadoqlandi — jo\'natishga tayyor'); qosh = ' Buyurtma to\'liq qadoqlandi — jo\'natishga tayyor.'; }
		yangila(`Saqlandi: ${r}, ${dona(s)}${brak ? `, brak ${brak}` : ''}.${qosh}`);
	},
	jon(d) {
		const b = topB(d.b); if (!b || !amalSotuv()) return;
		const bor = omborda(b) - jonRejada(b), soni = son(d.soni), c = topC(b.mijoz);
		if (soni < 1 || soni > bor) { xabar(`Omborda tayyor: ${dona(bor)}.`); return; }
		const huj = {}; for (const k of (c.val === 'USD' ? ['invoys', 'qadoq', 'cmr', 'sert', 'dekl'] : ['faktura', 'yukxat'])) huj[k] = false;
		const j = { id: yangiId('J'), b: b.id, mijoz: c.id, sana: d.sana || db.bugun, soni, holat: 'tayyor', huj, transport: d.transport, muddat: null };
		db.jonatmalar.push(j); voqea(b.id, `Jo'natma ${j.id} tayyorlanmoqda: ${soni} dona`);
		saqla(); yop(); xabar(`${j.id} yaratildi. Hujjatlar belgilangach omborchi yuklaydi.`); borish('#/jonat');
	},
	tolov(d) {
		const b = topB(d.b), s = son(d.summa); if (!b || !amalSotuv() || !mening(b)) return;
		if (s < 1) { xabar('Summani kiriting.'); return; }
		const c = topC(b.mijoz), oldin = avansHolat(b).yetar;
		db.tolovlar.push({ id: 't' + (++db.sanoq.t), mijoz: c.id, b: b.id, sana: db.bugun, summa: s, tur: jonatilgan(b) ? 'tolov' : 'avans' });
		voqea(b.id, `To'lov keldi: ${cPul(c, s)}`); kesh = {};
		const h = mHisob(c.id);
		yangila(`To'lov saqlandi: ${cPul(c, s)}. ${c.nom}: to'lanmagan summa ${cPul(c, h.qol)}.${!oldin && avansHolat(b).yetar && b.bos === 'namuna' ? ' Oldindan to\'lov to\'liq keldi.' : ''}`);
	},
	eslatma(d) {
		const c = topC(d.c); if (!c || !amalSotuv() || !String(d.matn || '').trim()) return;
		db.eslatmalar.push({ mijoz: c.id, sana: db.bugun, kim: ui.kim, matn: d.matn.trim().slice(0, 300), vada: d.vada || null });
		yangila(`Eslatma saqlandi.${d.vada ? ` Va'da qilingan sana: ${sana(d.vada)}.` : ''}`);
	},
	kirim(d) {
		const m = topM(d.m), s = kasr(d.soni); if (!m || !amalOmbor()) return;
		if (s <= 0) { xabar('Miqdorni kiriting.'); return; }
		harakat(m.id, s, 'Kirim' + ((d.izoh || '').trim() ? ': ' + d.izoh.trim().slice(0, 60) : ''));
		yangila(`${m.nom}: +${miq(s, m.birlik)}. Omborda ${miq(m.qoldiq, m.birlik)}.`);
	},
	ybuy(d) {
		const m = topM(d.m), s = kasr(d.soni), kun = Math.max(1, son(d.kun)); if (!m || !amalOmbor()) return;
		if (s <= 0 || !String(d.kim || '').trim()) { xabar('Yetkazib beruvchi va miqdorni kiriting.'); return; }
		const k = { id: yangiId('K'), kim: d.kim.trim().slice(0, 60), kutiladi: kunQosh(db.bugun, kun), holat: 'yolda', qatorlar: [{ m: m.id, soni: s, narx: m.narx }] };
		db.kirimlar.unshift(k); saqla(); yop(); xabar(`${k.id} saqlandi: ${m.nom}, ${miq(s, m.birlik)}. Kutilmoqda: ${sana(k.kutiladi)}.`); borish('#/ombor?yolda');
	},
	avans(d) {
		const w = topW(d.w), s = son(d.summa); if (!w || ui.rol !== 'rahbar') return;
		if (s < 1) { xabar('Summani kiriting.'); return; }
		if (s > wQol(w)) { xabar(`Hisoblangandan ortiq: to'lanadigan summa ${pul(wQol(w))}.`); return; }
		w.avans += s; yangila(`${w.ism}: ${pul(s)} avans berildi. To'lanadi: ${pul(wQol(w))}.`);
	},
	xarajat(d) {
		const s = son(d.summa); if (ui.rol !== 'rahbar') return;
		if (s < 1) { xabar('Summani kiriting.'); return; }
		db.xarajatlar.push({ id: 'x' + (++db.sanoq.x), sana: db.bugun, tur: XTUR.includes(d.tur) ? d.tur : 'Boshqa', summa: s, izoh: (d.izoh || '').trim().slice(0, 80) });
		saqla(); yop(); xabar(`Xarajat saqlandi: ${pul(s)}.`); borish('#/pul?xarajat');
	},
};

/* ---------- Chizish ---------- */
function chiz() {
	const root = $('#ilova'); kesh = {};
	document.documentElement.lang = ui.til === 'kir' ? 'uz-Cyrl' : 'uz';
	const nomla = s => { document.title = BREND + ' — ' + (ui.til === 'kir' ? Yozuv.kir : Yozuv.lot)(s); };
	if (!ui.rol) { root.innerHTML = kirishHTML(); Yozuv.dom(root, ui.til); nomla('boshqaruv tizimi (namuna)'); const p = $('#pin'); if (p) p.focus(); return; }
	const y = yol();
	if (!RUXSAT[ui.rol].includes(y.bol)) { if (location.hash !== boshSahifa()) { location.replace(boshSahifa()); return; } }
	let ich = '';
	switch (y.bol) {
		case 'panel': ich = vPanel(); break;
		case 'ishim': ich = vIshim(); break;
		case 'buyurtma': ich = vBuyurtmalar(y); break;
		case 'ishlab': ich = vIshlab(y); break;
		case 'ombor': ich = vOmbor(y); break;
		case 'tannarx': ich = vTannarx(y); break;
		case 'brend': ich = vBrendlar(y); break;
		case 'jonat': ich = vJonat(y); break;
		case 'haq': ich = vHaq(y); break;
		case 'pul': ich = vPul(y); break;
		case 'hisobot': ich = vHisobot(); break;
		case 'usta': ich = vUsta(y); break;
		default: ich = bosh_yoq('Sahifa topilmadi.');
	}
	root.innerHTML = qobiq(ich, y); Yozuv.dom(root, ui.til);
	nomla((BOLIM[y.bol] ? BOLIM[y.bol].n : 'namuna') + ' (namuna)');
	if (location.hash !== ui.oxirgiYol) { window.scrollTo(0, 0); ui.oxirgiYol = location.hash; }
	// Telefonda tanlangan yorliq ko'rinadigan joyga suriladi
	const yr = root.querySelector('.yor'), fy = yr && yr.querySelector('[aria-current=true]');
	if (fy && fy.getBoundingClientRect) yr.scrollLeft += fy.getBoundingClientRect().left - yr.getBoundingClientRect().left - 12;
}

/* ---------- Hodisalar ---------- */
document.addEventListener('click', e => {
	const t = e.target.closest('[data-a]');
	if (t) { if (t.disabled) return; const f = AMAL[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset, t); } return; }
	if (e.target.classList && e.target.classList.contains('parda')) { yop(); return; }
	const tr = e.target.closest('tr[data-h]');
	if (tr && !e.target.closest('a,button,input,select')) location.hash = tr.dataset.h;
});
document.addEventListener('submit', e => {
	const f = e.target.closest('form');
	if (!f) return; e.preventDefault();
	if (!f.dataset.f) return;
	const d = {}; new FormData(f).forEach((v, k) => { d[k] = v; });
	const fn = FORMA[f.dataset.f]; if (fn) fn(d, f);
});
document.addEventListener('input', e => {
	const t = e.target;
	if (t.id === 'pin' && /^\d{4}$/.test(t.value) && t.form) { if (t.form.requestSubmit) t.form.requestSubmit(); return; }
	if (!t.matches || !t.matches('[data-q]')) return;
	const q = Yozuv.qid(t.value.trim()), ry = document.querySelector('[data-ry]'); if (!ry) return;
	let bor = 0;
	ry.querySelectorAll('[data-s]').forEach(el => { const k = !q || el.dataset.s.includes(q); el.hidden = !k; if (k) bor++; });
	let yoq = ry.parentNode.querySelector('[data-yoq]');
	if (!bor && !yoq) { yoq = document.createElement('div'); yoq.className = 'bosh-yoq'; yoq.dataset.yoq = '1'; yoq.textContent = 'Hech narsa topilmadi.'; (ry.tagName === 'TBODY' ? ry.closest('.jw') : ry).appendChild(yoq); Yozuv.dom(yoq, ui.til); }
	if (yoq) yoq.hidden = bor > 0;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#oyna').firstChild) yop(); });
window.addEventListener('hashchange', () => { yop(); chiz(); });
yukla();
