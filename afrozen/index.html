	dl: rows => `<dl class="dl">${rows.filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`,
	call: (tel, label = '') => tel ? `<a class="btn ${label ? 's' : 'ic s'} tel" href="${F.telHref(tel)}" aria-label="Qo‘ng‘iroq: ${UI.esc(tel)}" title="Qo‘ng‘iroq: ${UI.esc(tel)}">${UI.icon('phone')}${label}</a>` : '',
	// To‘ldirilganlik chizig‘i: «13,4 / 20 t»
	meter(v, max, label) { const p = Math.min(1, v / max); return `<span class="meter${p >= 1 ? ' full' : ''}" role="img" aria-label="${label}"><i style="width:${(p * 100).toFixed(1)}%"></i></span>`; },
	taxm: () => '<span class="taxm" title="Taxminiy — namuna uchun, aniqlashtiriladi">taxm.</span>',
	// Kichik chiziqli grafik (6 oy)
	spark(vals, w = 96, h = 24) {
		const max = Math.max(...vals, 1), step = w / (vals.length - 1), pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - (v / max) * (h - 4)).toFixed(1)}`).join(' ');
		return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}"/><circle cx="${w}" cy="${pts.split(' ').pop().split(',')[1]}" r="2"/></svg>`;
	},
	bar: (list) => { const tot = Calc.sum(list, x => x[1]) || 1; return `<div class="share">${list.filter(x => x[1] > 0).map(([n, v, c]) => `<i style="width:${(v / tot * 100).toFixed(2)}%;--c:var(--${c})" title="${UI.esc(n)}"></i>`).join('')}</div>`; },

	// Forma maydonlari ui.f.<forma>.<kalit> bilan data-f orqali bog‘lanadi
	field(label, inner, { hint, cls = '', key } = {}) {
		return `<label class="fld ${cls}"><span>${label}</span>${inner}${hint ? `<small>${hint}</small>` : ''}${key ? `<small class="ferr" data-err="${key}"></small>` : ''}</label>`;
	},
	unit: (html, unit) => `<div class="iu">${html}<b>${unit}</b></div>`,
	input: (key, attrs = '') => { const [form, k] = key.split('.'), m = attrs.match(/class="([^"]+)"/), v = String(ui.f[form][k] == null ? '' : ui.f[form][k]); return `<input class="${m ? m[1] : 'in'}" data-f="${key}" value="${UI.esc(/data-num/.test(attrs) ? v.replace('.', ',').replace(/^-/, '−') : v)}" ${attrs.replace(/class="[^"]+"/, '')}>`; },
	num: (key, attrs = '') => UI.input(key, `type="text" inputmode="decimal" autocomplete="off" data-num ${attrs}`),
	options: (list, current) => list.map(([v, t]) => `<option value="${UI.esc(v)}"${String(v) === String(current) ? ' selected' : ''}>${UI.esc(t)}</option>`).join(''),
	select: (key, list, attrs = '') => { const [form, k] = key.split('.'); return `<select class="in" data-f="${key}" ${attrs}>${UI.options(list, ui.f[form][k])}</select>`; },
	seg: (act, current, list, cls = '') => `<div class="seg ${cls}">${list.map(([v, t]) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(current)}">${t}</button>`).join('')}</div>`,
	filter(act, current, list, chips) {
		if (chips && UI.mobile()) return `<div class="chips wrap">${list.map(([v, t, n]) => `<button type="button" class="chip" aria-pressed="${v === current}" data-act="${act}" data-v="${v}">${t}<b>${n}</b></button>`).join('')}</div>`;
		if (UI.mobile()) return `<select class="in" data-filter="${act}" aria-label="Filtr">${UI.options(list.map(([v, t, n]) => [v, `${t} · ${n}`]), current)}</select>`;
		return `<div class="chips">${list.map(([v, t, n]) => `<button type="button" class="chip" aria-pressed="${v === current}" data-act="${act}" data-v="${v}">${t}<b>${n}</b></button>`).join('')}</div>`;
	},
	search: (name, value, placeholder) => `<div class="search">${UI.icon('search')}<input class="in" type="search" data-search="${name}" placeholder="${placeholder}" value="${UI.esc(value)}" aria-label="Qidirish"></div>`,

	// cols: [sarlavha, klass, katak funksiyasi]. Telefonda qator karta: c-main — sarlavha, c-aside — o‘ng burchak, c-sub — ikkinchi qator.
	table(cols, rows, opt = {}) {
		if (!rows.length) return UI.empty(opt.empty || 'Hozircha yozuv yo‘q', opt.icon);
		const td = ([t, c, k], r) => {
			const link = opt.open && c.includes('c-main') && opt.open(r);
			return `<td class="${c}" data-l="${t}">${link ? `<button class="rowlink" data-act="${link[0]}" data-id="${link[1]}">${k(r)}</button>` : `<span>${k(r)}</span>`}</td>`;
		};
		return `<div class="tw"><table class="tbl cards ${opt.cls || ''}"><thead><tr>${cols.map(([t, c]) => `<th class="${c}">${t}</th>`).join('')}</tr></thead>
			<tbody>${rows.map(r => `<tr class="${opt.open ? 'ck ' : ''}${opt.rowCls ? opt.rowCls(r) : ''}">${cols.map(c => td(c, r)).join('')}</tr>`).join('')}</tbody>${opt.foot || ''}</table></div>`;
	},

	// gorizontal chiplar: oxirigacha surilganda o‘ng chetdagi ishora yo‘qoladi
	toast(text, ms = 2600) {
		$('#toasts').innerHTML = `<div class="toast enter">${UI.esc(text)}</div>`;
		clearTimeout(UI.toastTimer);
		UI.toastTimer = setTimeout(() => { $('#toasts').innerHTML = ''; }, ms);
	},
	prompt(text, label, act) { clearTimeout(UI.toastTimer); $('#toasts').innerHTML = `<div class="toast act">${UI.esc(text)}<button class="link" data-act="${act}">${label}</button></div>`; },
	modal(title, body, foot, wide) {
		if (body == null) body = Views.part('mbody');
		$('#modal').innerHTML = `<div class="ovl" data-act="closeModal"></div><div class="mwrap"><div class="modal enter${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${UI.esc(title)}">
			<div class="mh"><h2>${title}</h2><button class="btn ic ghost" data-act="closeModal" aria-label="Yopish">${UI.icon('x')}</button></div>
			<div class="mb" id="mbody">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div></div>`;
		const first = $('#modal [autofocus]');
		if (first && !UI.mobile()) first.focus();
	},
	closeModal() { $('#modal').innerHTML = ''; ui.modalForm = null; },
	buttons: (ok, act, cancel = 'Bekor qilish') => `<button class="btn" data-act="closeModal">${cancel}</button><button class="btn pri" data-act="${act}">${ok}</button>`,
	confirm(text, ok, fn) {
		UI.onConfirm = fn;
		UI.modal('Tasdiqlang', `<p class="cf">${text}</p>`, UI.buttons(ok, 'confirmOk', 'Orqaga'));
	}
};

/* ===== Forms — maydon qoidalari (manba: b.js) =====
	 Har formaning tekshiruvi bitta joyda: maydon → [shart, xabar]. */
const pos = v => +v > 0 && isFinite(+v);
const Forms = {
	rules: {
		no: {
			cid: [v => !!v, 'Xaridorni tanlang'],
			t: [v => pos(v) && +v <= 200, 'Tonnani kiriting'],
			narx: [v => pos(v) && +v < 20, 'Narxni kiriting ($/kg)'],
			fefo: [(v, f) => !Views.noNeedReason(f) || v.trim().length > 2, 'FEFO dan boshqa lot — sababini yozing']
		},
		pay: { sum: [(v, f) => pos(v) && +v <= Calc.due(Data.order(f.id)) + 0.5, (v, f) => pos(v) ? `Qoldiqdan ko‘p bo‘lmasin: ${F.usd(Calc.due(Data.order(f.id)))}` : 'Summani kiriting'], doc: [v => v.trim().length > 2, 'To‘lov hujjati raqamini yozing'] },
		rec: {
			fid: [v => !!v, 'Fermerni tanlang'],
			brutto: [v => pos(v) && +v < 40000, 'Brutto kg ni kiriting'],
			tara: [(v, f) => v !== '' && +v >= 0 && +v < +f.brutto, 'Tara bruttodan kam bo‘lsin'],
			brak: [v => v !== '' && +v >= 0 && +v <= 50, '0 dan 50 % gacha'],
			sabab: [(v, f) => !(+f.brak > 0) || v.length > 0, 'Brak sababini tanlang']
		},
		sm: {
			qs: [v => v.length > 0, 'Kamida bitta qabul partiyasini tanlang'],
			saralash: [(v, f) => v !== '' && +v >= 0 && +v < Views.smXom(f), 'Saralash chiqindisi xomashyodan kam bo‘lsin'],
			tayyor: [(v, f) => pos(v) && +v <= Views.smXom(f) - (+f.saralash || 0) && Math.floor(+v / Data.prod(f.prod).net) > 0, 'Tayyor kg ishlab chiqarishga kirgandan (xomashyo − chiqindi) ko‘p bo‘lmasin'],
			sabab: [(v, f) => !Views.smLow(f) || v.trim().length > 2, 'Chiqish me’yordan past — sababini yozing']
		},
		load: {
			pals: [(v, f) => Views.loadAll(f), 'Hamma palletani belgilang'],
			harorat: [v => v !== '' && isFinite(+v) && +v <= -15 && +v >= -30, 'Mahsulot haroratini kiriting (masalan −18,5)'],
			plomba: [v => v.trim().length > 3, 'Plomba raqamini yozing']
		},
		fura: { mashina: [v => v.trim().length > 5, 'Mashina raqamini yozing'], sana: [v => !!v && v >= Time.today, 'Sana bugundan oldin bo‘lmasin'] },
		fpay: { sum: [v => pos(v), 'Summani kiriting'] },
		ext: { kun: [v => pos(v) && +v <= 14, '1 dan 14 kungacha'] },
		cat: { firma: [v => v.trim().length > 2, 'Kompaniya nomi / Название компании'], t: [v => pos(v), 'Tonna / Тонн'], aloqa: [v => v.trim().length > 5, 'Telefon yoki e-pochta / Телефон или e-mail'] },
		temp: { v: [v => v !== '' && isFinite(+v) && +v < 0 && +v > -40, 'Haroratni kiriting'] }
	},
	error(key) {
		const [form, k] = key.split('.'), rule = (Forms.rules[form] || {})[k];
		return rule && !rule[0](ui.f[form][k], ui.f[form]) ? (typeof rule[1] === 'function' ? rule[1](ui.f[form][k], ui.f[form]) : rule[1]) : '';
	},
	show(key) {
		const msg = Forms.error(key), slot = $(`[data-err="${key}"]`), input = $(`[data-f="${key}"]`);
		if (slot) slot.textContent = msg;
		if (input) input.toggleAttribute('aria-invalid', !!msg);
		return msg;
	},
	valid(form) {
		const bad = Object.keys(Forms.rules[form]).map(k => `${form}.${k}`).filter(Forms.show);
		if (!bad.length) return true;
		const input = $(`[data-f="${bad[0]}"]`);
		if (input) input.focus();
		if (!$(`[data-err="${bad[0]}"]`)) UI.toast(Forms.error(bad[0]));
		return false;
	}
};

		$('#app').innerHTML = `<div class="app${tor ? ' tor' : ''}${role.menu.length < 2 ? ' solo' : ''}">

	// Sahifaning bitta asosiy amali

	// Qisman yangilanadigan bo‘laklar: element id → HTML (UI.refresh shu yerdan oladi)
	parts: {
		layer() {
			const d = ui.drawer;
			return !d ? '' : `<div class="ovl" data-act="closeDrawer"></div><div class="drawer${d.enter ? ' enter' : ''}${['client', 'lot', 'neworder'].includes(d.type) ? ' wide' : ''}" role="dialog" aria-modal="true">${Views[d.type + 'Card'](d.id)}</div>`;
		},
		mbody: () => Views[ui.modalForm](),
		'gs-res': 'searchResults', list: 'ordersList', clist: 'clientsList', llist: 'lotsList', flist: 'farmersList',
		'no-hit': 'noHit', 'no-picks': 'noPicks', 'no-plan': 'noPlan', 'no-bar': 'noBar', 'rec-res': 'recResult', 'rec-picks': 'recPicks', 'sm-res': 'smResult',
		'pay-res': 'payResult', 'load-res': 'loadResult', 'rep-body': 'reportBody', 'set-body': 'settingsBody', 'map-body': 'mapBody', 'rc-body': 'recallBody', 'col-res': 'collectResult', 'cat-f': 'catForm'
	},
	part(id) { const p = Views.parts[id]; return typeof p === 'string' ? Views[p]() : p(); },
	drawerHead: (title, sub, extra = '') => `<div class="dh"><button class="btn ic ghost dh-back" data-act="closeDrawer" aria-label="Orqaga">${UI.icon('back')}</button><div class="x"><h2>${title}</h2>${sub ? `<div class="muted sm">${sub}</div>` : ''}</div>${extra}<button class="btn ic ghost dh-x" data-act="closeDrawer" aria-label="Yopish">${UI.icon('x')}</button></div>`,
	hist: list => list.length ? `<div class="dsec"><h3>Tarix</h3><ul class="hist">${list.map(e => `<li><span>${F.when(e.t)}</span><span>${UI.esc(e.m)}<small>${UI.esc(Views.actor(e))}</small></span></li>`).join('')}</ul></div>` : '',

	/* --- Qobiq: menyu belgilari, bildirishnomalar, qidiruv --- */
	badges() {
		const out = {};
		if (session.role === 'direktor') out.bugun = Views.attention().length;
		if (['direktor', 'savdo'].includes(session.role)) out.buyurtmalar = db.orders.filter(o => o.holat === 'sorov').length;
		if (session.role === 'savdo') out.sorovlar = db.reqs.filter(r => r.holat === 'yangi').length;
		if (session.role === 'omborchi') { out.yuklash = Views.toLoad().filter(o => o.yukSana <= Time.today).length; out.joylash = Views.toPlace().length; }
		if (session.role === 'hisobchi') out.tolovlar = db.orders.filter(o => o.holat === 'band').length;
		if (session.role === 'sex') out.ishlab = db.recs.filter(r => Calc.recLeft(r) > 0).length;
		Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
		return out;
	},

	/* «Diqqat»: hal qilinishi kerak bo‘lgan masalalar, pul bo‘yicha saralangan; har birida sabab, ta’sir summasi va bitta amal. */
	attention() {
		const out = [], c = o => Data.client(o).nom, pq = o => o.lines.map(ln => Data.prod(ln.prod).qisqa).join(' + ');
		db.orders.filter(o => o.holat === 'band' && Calc.bandLeft(o) <= 2).forEach(o => {
			const left = Calc.bandLeft(o), paid = Calc.paid(o);
			out.push({ key: `b:${o.id}:${o.bandGacha}:${paid}`, tone: left < 0 ? 'red' : 'amb', icon: 'hourglass', pul: Calc.due(o),
				t: `${c(o)} · ${pq(o)} · ${F.tn(Calc.oKg(o))} · ${F.usd(Calc.due(o))} · band ${left < 0 ? `muddati ${-left} kun oldin o‘tdi` : left === 0 ? 'bugun tugaydi' : `${left} kunda tugaydi`}`,
				m: `${F.oid(o)} · ${paid ? `qisman to‘langan ${F.usd(paid)}, yuklash yopiq` : 'oldindan to‘lov kelmagan'} · yuklash ${o.yukSana ? F.date(o.yukSana) : '—'}`, act: 'openRemind', id: o.id, btn: 'Eslatma' });
		});
		db.orders.filter(o => o.holat === 'tolandi').forEach(o => out.push({ key: `p:${o.id}`, tone: 'amb', icon: 'calendar', pul: Calc.oSum(o),
			t: `${c(o)}: to‘lov keldi (${F.usd(Calc.paid(o))}), yuklash sanasi belgilanmagan`, m: `${F.oid(o)} · ${pq(o)} ${F.tn(Calc.oKg(o))} · to‘landi ${F.day(o.pays.slice(-1)[0].t)}`, act: 'openFura', id: o.id, btn: 'Belgilash' }));
		db.orders.filter(o => o.holat === 'tayyor' && o.yukSana <= Time.add(1) && Calc.docsMissing(o).length).forEach(o => {
			const miss = Calc.docsMissing(o);
			out.push({ key: `h:${o.id}:${miss.join()}`, tone: 'amb', icon: 'file', pul: Calc.oSum(o), t: `${F.oid(o)} ${c(o)}: furaga hujjat yetishmayapti — ${miss.map(F.doc).join(', ')}`,
				m: `yuklash ${F.day(o.yukSana)} · fura ${o.fura && o.fura.mashina || '—'} · ${Data.client(o).mam}, ${o.shart}`, act: 'openShip', id: o.id, btn: 'Ochish' });
		});
		db.lots.filter(l => Calc.age(l) >= 18).forEach(l => {
			const s = Calc.lotStock(l), kg = s.qoldiq, pr = Data.prod(l.prod);
			if (kg <= 0) return;
			out.push({ key: `e:${l.id}:${kg}`, tone: Calc.leftMonths(l) <= 4 ? 'red' : 'amb', icon: 'clock', pul: kg * pr.narx, t: `${pr.qisqa}, ${l.id}: ${Calc.age(l)} oy, ${F.tn(kg)} — yaroqlilikka ${Calc.leftMonths(l)} oy`,
				m: `${F.zk(l.z, l.kam)} · taxminan ${F.usd(kg * pr.narx)} · narxni tushirib taklif qilish mumkin`, act: 'openLot', id: l.id, btn: 'Ochish' });
		});
		db.smenas.filter(s => s.sana >= Time.add(-7) && Calc.lowYield(s)).forEach(s => {
			const pr = Data.prod(s.prod), lost = Math.round(s.kirdi * pr.norma / 100 - s.tayyor);
			out.push({ key: `s:${s.id}`, tone: 'red', icon: 'alert', pul: lost * pr.narx, t: `${s.id} ${pr.qisqa}: chiqish ${F.pct(Calc.yieldOf(s), 1)}, me’yor ${pr.norma} %`,
				m: `me’yorga nisbatan ${F.kg(lost)} kam ≈ ${F.usd(lost * pr.narx)} · ${Data.line(s.line).nom}${s.sabab ? ' · ' + s.sabab : ''}`, act: 'openSmena', id: s.id, btn: 'Ochish' });
		});
		db.orders.filter(o => o.need && o.need.includes('narx') && !['bekor', 'yetdi'].includes(o.holat)).forEach(o => out.push({ key: `n:${o.id}`, tone: 'amb', icon: 'check', pul: Calc.oSum(o),
			t: `${F.oid(o)} ${c(o)}: narx minimaldan past — tasdig‘ingiz kerak`, m: o.lines.map(ln => `${Data.prod(ln.prod).qisqa} ${F.narx(ln.narx)}, minimal ${F.narx(Data.prod(ln.prod).min)}`).join(' · '), act: 'openOrder', id: o.id, btn: 'Ko‘rish' }));
		return out.sort((a, b) => b.pul - a.pul);
	},
	noticeTypes: { direktor: ['tolov', 'katalog', 'sorov', 'pastchiq', 'yuklandi', 'yetdi', 'band', 'bosh', 'ruxsat', 'recall'], savdo: ['katalog', 'sorov', 'tolov', 'ruxsat', 'yuklandi', 'band', 'bosh'],
		sifat: ['qabul', 'smena', 'pastchiq', 'recall'], hisobchi: ['band', 'tolov', 'qabul', 'fermer'] },
	notices() {
		const types = Views.noticeTypes[session.role] || [];
		return db.events.filter(e => e.t >= Time.at(0, 0, -1) && types.includes(e.tur)).slice(-14).reverse().map(e => {
			const go = e.oid ? ['openOrder', e.oid] : e.lot ? ['openLot', e.lot] : e.req ? ['openReq', e.req] : e.fid ? ['openFarmer', e.fid] : ['go', ''];

	bellPop(notices, seen) {

	searchHits() {
		const q = ui.gs.q.trim().toLowerCase(), digits = q.replace(/\D/g, '');
		if (q.length < 2) return [];
		const pal = db.pals.filter(p => p.id.toLowerCase().includes(q) || p.id.replace(/[-/]/g, '').toLowerCase().includes(q.replace(/[-/\s]/g, ''))).slice(0, 3);
		return [
			...db.lots.filter(l => l.id.toLowerCase().includes(q) || Data.prod(l.prod).nom.toLowerCase().includes(q)).sort((a, b) => Calc.lotStock(b).qoldiq - Calc.lotStock(a).qoldiq).slice(0, 4)
				.map(l => ({ go: 'openLot', id: l.id, icon: 'lot', t: `${l.id} · ${Data.prod(l.prod).qisqa}`, m: `${F.date(l.ishlab)} · omborda ${F.tn(Calc.lotStock(l).qoldiq)}` })),
			...(q.length >= 4 ? pal : []).map(p => ({ go: 'openLot', id: p.lot, icon: 'qr', t: `Palleta ${p.id}`, m: `${p.k ? F.cell(p.cell) : 'yuklangan'} · ${Data.prod(Data.lot(p.lot).prod).qisqa}` })),
			...db.clients.filter(c => c.nom.toLowerCase().includes(q) || c.kontakt.toLowerCase().includes(q) || (digits.length >= 3 && F.telDigits(c.tel).includes(digits))).slice(0, 4)
				.map(c => ({ go: 'openClient', id: c.id, icon: 'building', t: c.nom, m: `${MAMLAKAT[c.mam]} · ${c.kontakt}` })),
			...db.farmers.filter(f => f.ism.toLowerCase().includes(q) || f.tuman.toLowerCase().includes(q)).slice(0, 3)
				.map(f => ({ go: 'openFarmer', id: f.id, icon: 'sprout', t: f.ism, m: `${f.tuman}, ${f.vil} · fermer` })),
			...db.orders.filter(o => F.oid(o).toLowerCase().includes(q) || String(o.id).includes(q)).sort((a, b) => b.id - a.id).slice(0, 3)
				.map(o => ({ go: 'openOrder', id: o.id, icon: 'list', t: `${F.oid(o)} · ${Data.client(o).nom}`, m: `${F.tn(Calc.oKg(o))} · ${STATUS[o.holat].t}` }))
		].filter(h => can(h.go));
	},
	searchResults() {
		if (ui.gs.q.trim().length < 2) return '';
		const hits = Views.searchHits();
		return `<div class="pop">${hits.length ? hits.map((h, i) => `<button class="pop-i${i ? '' : ' on'}" data-act="${h.go}" data-id="${h.id}"><span class="ti">${UI.icon(h.icon)}</span><span class="x"><span class="t">${UI.esc(h.t)}</span><span class="m">${UI.esc(h.m)}</span></span></button>`).join('')
			: UI.empty('Topilmadi. Lot (AF-2608-195), palleta raqami, xaridor, fermer yoki buyurtma (B-0405) yozing', 'search')}</div>`;
	},
	actor(e) { if (!e.uid) return 'Katalog (xaridor)'; const u = Data.userById(e.uid); return `${F.short(u.ism)}, ${u.lav.toLowerCase()}`; },

		const kpis = `<div class="kpis">
			${kpi('bosh', 'Sotishga bo‘sh', F.t(all.bosh), 't', UI.mobile() ? `≈ ${Math.floor(all.bosh / db.set.fura)} fura hajmi (20 t)<br>to‘liq yuk bor: ${ld.full} mahsulot` : `≈ ${Math.floor(all.bosh / db.set.fura)} fura hajmi (20 t) · ${F.kusd(Calc.boshUsd(rows))}${UI.taxm()}<br>to‘liq yuk (20 t dan ortiq) bor: ${ld.full} mahsulot`)}

			${kpi('week', '7 kunda jo‘natma', wk.furas, 'fura', `${F.tn(wk.kg)} · bugun ${wk.today} ta<br>${[wk.noDoc ? `hujjatsiz ${wk.noDoc}` : '', wk.noPay ? `to‘lovsiz ${wk.noPay}` : ''].filter(Boolean).join(' · ') || 'hammasi tayyor'}`)}
			${kpi('oy', 'Shu oy yuklangan', F.num(Math.round(m0.usd / 1000)), 'ming $', `${F.tn(m0.kg)} · ${m0.n} fura<br>o‘tgan oy ${F.kusd(m1.usd)}`)}
			${kpi('eski', '12 oy va undan eski', F.t(old.kg), 't', `≈ ${F.kusd(old.usd)}${UI.taxm()}<br>${old.min ? `yaroqlilikka eng kami ${old.minLeft} oy` : 'yo‘q'}`)}

		const att = Views.attention(), shown = ui.attAll ? att : att.slice(0, 5);

			<button class="btn s${i ? '' : ' pri'}" data-act="${a.act}" data-id="${a.id}">${a.btn}</button></div>`;
		const attCard = UI.card(`Diqqat<span class="c">${att.length}</span>`, att.length ? `<div class="rows">${shown.map(attRow).join('')}</div>
			${att.length > 5 ? `<div class="more-row"><button class="link sm" data-act="showAtt">${ui.attAll ? 'Qisqartirish' : `Yana ${att.length - 5} ta: ${[...new Set(att.slice(5).map(a => ATT_KIND[a.key[0]]))].join(', ')}`}</button></div>` : ''}` : UI.empty('Hal qilinadigan masala yo‘q', 'check'), { id: 'diqqat' });

			<span class="eta"><span class="muted sm">yuklash</span><b>${F.day(o.yukSana)}</b></span></button>`;

		const shipBody = `<div class="rows">${ships.map(shipRow).join('') || '<p class="muted sm">7 kunda jo‘natma yo‘q</p>'}</div>`;
		const reqs = [...db.orders.filter(o => o.holat === 'sorov').map(o => ({ act: 'openOrder', id: o.id, t: `${Data.client(o).nom} — ${o.lines.map(ln => Data.prod(ln.prod).qisqa).join(', ')}, ${F.tn(Calc.oKg(o))}`, m: `${F.oid(o)} · so‘rov · ${F.when(o.ts.sorov || Time.day0(o.sana))}` })),
			...db.reqs.filter(r => r.holat === 'yangi').map(r => ({ act: 'openReq', id: r.id, t: `${r.firma} (${MAMLAKAT[r.mam] || r.mam}) — ${Data.prod(r.prod).qisqa}, ${F.num(r.t20)} t`, m: `katalogdan · ${F.when(r.t)}` }))];

		const mob = UI.mobile();
		const shipC = mob ? UI.acc('7 kunda jo‘natma', `${wk.furas} fura · ${F.tn(wk.kg)}`, shipBody, 'ship') : UI.card('7 kunda jo‘natma', shipBody, { right: `<button class="link sm" data-act="go" data-p="jonatmalar">Jo‘natmalar</button>` });

			<div class="cols"><div class="stack">${attCard}${prodCard}</div><div class="stack">${shipC}${reqC}${Views.feed()}</div></div>`;

	},

	/* --- Palleta yorlig‘i (A6) --- */
	qr(id) {
		// Ko‘rinish uchun QR shakli (namuna): uchta burchak belgisi + raqamdan olingan naqsh
		let h = 0; const N = 25, cells = [];
		for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
		const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="1"/><rect x="${x}" y="${y + 6}" width="7" height="1"/><rect x="${x}" y="${y}" width="1" height="7"/><rect x="${x + 6}" y="${y}" width="1" height="7"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
		for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
			if ((x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9)) continue;
			h = (h * 1103515245 + 12345) >>> 0;
			if ((h >>> 16) & 1) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
		}
		return `<svg class="qr" viewBox="-1 -1 ${N + 2} ${N + 2}" role="img" aria-label="QR: ${id}">${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}${cells.join('')}</svg>`;
	},
	labelForm() {
		const p = Data.pal(ui.f.lab.id), l = Data.lot(p.lot), pr = Data.prod(l.prod);
		return `<div class="plabel"><div><div class="ln">${pr.nom}</div><div class="lt">${l.id}</div><dl><dt>Palleta</dt><dd>${p.id}</dd><dt>Netto</dt><dd>${F.kg(p.k * pr.net)} · ${p.k} ${pr.guruh === 'pyure' ? 'bochka' : 'karton'} × ${pr.net} kg</dd>

			<div>${Views.qr(p.id)}<div class="sm center">${p.id}</div></div></div><p class="hint mt8">A6 yorliq. QR — namunadagi shakl; ulanishda palleta raqami QR kodga yoziladi.</p>`;

	/* --- Smena kartasi (oyna) --- */
	smenaForm() {

				<tr class="tot big"><td>Chiqish = tayyor ÷ kirdi</td><td class="${Calc.lowYield(s) ? 'red-t' : ''}">${F.pct(b.pct, 1)}</td></tr><tr class="x"><td>Me’yor (texnolog bilan aniqlanadi)</td><td>${pr.norma} %</td></tr></table>
			${s.sabab ? `<div class="note warn mt8"><b>Sabab:</b> ${UI.esc(s.sabab)}</div>` : ''}
			<h3 class="mt16">Qabul partiyalari</h3><ul class="lines">${s.inputs.map(x => { const r = Data.rec(x.q); return `<li><span>${r.id} · ${UI.esc(Data.farmer(r.fid).ism)}<span class="sub">${F.dateY(r.sana)} · brak ${F.num(r.brakP, 1)} %</span></span><b>${F.kg(x.kg)}</b></li>`; }).join('')}</ul>

	['yetdi', 'Yetib borgan', o => o.holat === 'yetdi'],
	['hammasi', 'Hammasi', () => true]
];
const lineTxt = o => o.lines.map(ln => Data.prod(ln.prod).qisqa).join(' + ');

Object.assign(Views, {
	/* --- Buyurtmalar --- */
	orders() {
		const f = ui.orderFilter, list = ORDER_FILTERS.map(([k, t, fn]) => [k, t, db.orders.filter(fn).length]);
		return `<div class="toolbar">${UI.filter('setOrderFilter', f.st, list)}<span class="grow"></span>${UI.search('orderFilter', f.q, 'Xaridor yoki raqam')}</div>

	payState(o) {

		const due = Calc.due(o), paid = Calc.paid(o);
		return due ? (paid ? UI.flag(`qisman · qoldiq ${F.usd(due)}`, 'amb') : UI.flag('kutilmoqda', 'amb')) : UI.flag('100 % to‘langan', 'grn');
	},
	ordersList() {
		const f = ui.orderFilter, fn = (ORDER_FILTERS.find(x => x[0] === f.st) || ORDER_FILTERS[0])[2], q = f.q.trim().toLowerCase();

		const rows = db.orders.filter(o => fn(o) && (!q || F.oid(o).toLowerCase().includes(q) || String(o.id).includes(q) || Data.client(o).nom.toLowerCase().includes(q)))
			.sort((a, b) => f.st === 'faol' ? rank(a) - rank(b) || b.id - a.id : b.id - a.id);

				${o.izoh ? `<p class="note mt8">${UI.esc(o.izoh)}</p>` : ''}
				<div class="dsec">${UI.dl([
					['Xaridor', can('openClient') ? `<button class="link" data-act="openClient" data-id="${c.id}">${UI.esc(c.nom)}</button>` : UI.esc(c.nom)],
					['Aloqa', `${UI.esc(c.kontakt)} · ${UI.esc(c.tel)} ${UI.call(c.tel)}`],
					['Shart', `${SHIRT[o.shart]} · 100 % oldindan to‘lov · USD`],
					['Band muddati', o.bandGacha && BAND_ST.includes(o.holat) ? `${F.dateLong(o.bandGacha)}${o.holat === 'band' ? ` (${F.kun(Calc.bandLeft(o))})` : ''}` : '—'],
					['Yuklash', o.yukSana ? F.dateLong(o.yukSana) : 'belgilanmagan'],
					['Menejer', UI.esc(Data.userById(o.mid).ism)],
					o.fefo && ['FEFO emas', UI.esc(o.fefo)]
				])}</div>
				<div class="dsec"><h3>Mahsulot va lotlar</h3>${lines}</div>
				${PRE_ST.includes(o.holat) ? '' : `<div class="dsec"><h3>To‘lovlar</h3>${pays}</div>`}
				${o.fura && !PRE_ST.includes(o.holat) ? `<div class="dsec"><h3>Fura va hujjatlar</h3><p class="note">${o.fura.mashina || '—'} · hujjat ${Calc.docsReq(o).length - Calc.docsMissing(o).length} / ${Calc.docsReq(o).length}${Calc.docsMissing(o).length ? ` · yetishmaydi: ${Calc.docsMissing(o).map(d => DOC_NOM[d].split(' (')[0]).join(', ')}` : ''}</p></div>` : ''}
				<div class="dsec"><h3>Holat</h3>${chain}</div>

			</div>${acts.length || left.length ? `<div class="dfoot">${left.join('')}<span class="grow"></span>${acts.join('')}</div>` : ''}`;
	},

	/* --- Band qilish / yangi buyurtma (o‘ng panel) --- */
	noLines(f) {
		const pr = Data.prod(f.prod), kg = Math.round((+f.t || 0) * 1000), r = Calc.fefo(f.prod, kg), out = [{ prod: f.prod, kg: Math.min(r.got, r.need), narx: +f.narx || 0, r }];
		if (f.extra && r.short) { const r2 = Calc.fefo(f.extra, r.short); out.push({ prod: f.extra, kg: r2.got, narx: Data.prod(f.extra).narx, r: r2, extra: true }); }
		return out.map(x => ({ ...x, sum: Math.round(x.kg * x.narx), pr: Data.prod(x.prod) })).filter(x => x.kg > 0 || x.prod === pr.k);
	},
	noAlt(f) {
		const pr = Data.prod(f.prod), r = Calc.fefo(f.prod, (+f.t || 0) * 1000);
		if (!r.short) return null;
		return db.prods.filter(p => p.k !== pr.k && p.xom === pr.xom && Calc.fefo(p.k, r.short).short === 0).sort((a, b) => b.narx - a.narx)[0] || null;
	},
	noNeedReason: () => false,
	neworderCard() {
		const f = ui.f.no;
		if (!f) return '';
		const from = f.from && Data.order(f.from);
		return Views.drawerHead(from ? `Band qilish · ${F.oid(from)}` : 'Yangi buyurtma', from ? `${UI.esc(Data.client(from).nom)} so‘rovi` : 'Lotlar FEFO bo‘yicha o‘zi tanlanadi')
			+ `<form class="dbody nof" data-form="newOrder" autocomplete="off">
				${UI.field('Xaridor', `<div id="no-hit">${Views.noHit()}</div>`, { key: 'no.cid' })}
				<div class="grid2 duo">${UI.field('Mahsulot', UI.select('no.prod', db.prods.map(p => [p.k, p.nom])))}${UI.field('Hajm', UI.unit(UI.num('no.t', 'placeholder="20"'), 't'), { key: 'no.t', hint: 'Minimal buyurtma 20 t' })}</div>
				<div class="grid2 duo">${UI.field('Narx', UI.unit(UI.num('no.narx'), '$/kg'), { key: 'no.narx', hint: `Narxlar ro‘yxati ${F.narx(Data.prod(f.prod).narx)}, minimal ${F.narx(Data.prod(f.prod).min)} · taxm.` })}
					<div class="fld"><span>Shart</span>${UI.seg('pickShart', f.shart, [['FCA', 'FCA'], ['DAP', 'DAP']], 'full2')}</div></div>
				<div class="grid2 duo">${UI.field('Band muddati', UI.unit(UI.num('no.kun'), 'kun'), { hint: 'Shu kungacha to‘lov kelmasa — Diqqatga chiqadi' })}${UI.field('Yuklash sanasi', UI.input('no.yuk', `type="date" min="${Time.today}"`))}</div>
				<div class="fld"><span>FEFO bo‘yicha lotlar</span><div id="no-plan">${Views.noPlan()}</div></div>
				${UI.field('Izoh', `<textarea class="in" data-f="no.izoh" rows="2" placeholder="Ixtiyoriy">${UI.esc(f.izoh)}</textarea>`)}
			</form><div class="dfoot" id="no-bar">${Views.noBar()}</div>`;
	},
	noHit() {
		const f = ui.f.no, c = f.cid && Data.client(f.cid);
		if (c) {
			const st = Calc.clientStat(c);
			return `<div class="hit"><span class="x"><span class="t">${UI.esc(c.nom)}</span><span class="m">${MAMLAKAT[c.mam]} · ${XTUR[c.tur]} · ${c.shart}</span>
				<span class="m">12 oyda ${F.tn(st.kg)}${st.lastNarx ? ` · oxirgi narx ${F.narx(st.lastNarx)} (${Data.prod(st.lastProd).qisqa})` : ''}</span></span>
				${f.from ? '' : `<button type="button" class="btn s ghost" data-act="clearClient" aria-label="Boshqa xaridor" title="Boshqa xaridor">${UI.icon('x')}<span class="m-hide">O‘zgartirish</span></button>`}</div>`;
		}
		return `<div class="search wide">${UI.icon('search')}<input class="in" data-f="no.q" value="${UI.esc(f.q)}" placeholder="Nomi, mamlakat yoki mas’ul shaxs" autofocus></div><div id="no-picks">${Views.noPicks()}</div>`;
	},
	noPicks() {
		const q = ui.f.no.q.trim().toLowerCase(), list = db.clients.filter(x => !q || x.nom.toLowerCase().includes(q) || x.kontakt.toLowerCase().includes(q) || MAMLAKAT[x.mam].toLowerCase().includes(q)).slice(0, q ? 6 : 4);
		return `<div class="picks">${list.map(x => { const st = Calc.clientStat(x); return `<button type="button" class="pick" data-act="pickClient" data-id="${x.id}"><span class="t">${UI.esc(x.nom)}</span><span class="m">${x.mam} · 12 oyda ${F.tn(st.kg)}${st.lastNarx ? ` · ${F.narx(st.lastNarx)}` : ''}</span></button>`; }).join('') || '<p class="muted sm">Topilmadi</p>'}</div>`;
	},
	noPlan() {
		const f = ui.f.no, pr = Data.prod(f.prod), kg = Math.round((+f.t || 0) * 1000);
		if (!(kg > 0)) return '<p class="hint">Hajmni kiriting — tizim FEFO bo‘yicha lotlarni tanlaydi.</p>';
		const r = Calc.fefo(f.prod, kg), z0 = r.plan[0] && r.plan[0].z, alt = Views.noAlt(f);
		const row = (x, p) => `<li><span>${x.lot} · ${F.zk(x.z, x.kam)}${x.z !== z0 ? ` <span class="sgn">${UI.icon('alert')}boshqa zavod</span>` : ''}<span class="sub">${p.qisqa} · yaroqli ${F.dateY(x.yaroq)} gacha · ${x.pals} palleta</span></span><b>${F.tn(x.kg)}</b></li>`;
		let extra = '';
		if (f.extra && r.short) { const r2 = Calc.fefo(f.extra, r.short), p2 = Data.prod(f.extra); extra = r2.plan.map(x => row(x, p2)).join(''); }
		return `<ul class="lines">${r.plan.map(x => row(x, pr)).join('') || '<li><span class="muted">Bo‘sh qoldiq yo‘q</span><b></b></li>'}${extra}</ul>
			${r.short && !f.extra ? `<div class="short"><p><b>${F.tn(r.short)} yetmaydi</b> — ${pr.qisqa} bo‘yicha ${r.zs.length > 1 ? 'ikki zavodda' : 'omborda'} faqat ${F.tn(r.got)} bo‘sh.</p>
				<div class="acts">${r.got ? `<button type="button" class="btn s" data-act="useShort" data-v="cut">${F.tn(r.got)} ga taklif</button>` : ''}${alt ? `<button type="button" class="btn s" data-act="useShort" data-v="${alt.k}">${alt.nom} dan ${F.tn(r.short)} qo‘shish</button>` : ''}</div></div>` : ''}
			${f.extra && r.short ? (ls => { const kg = Calc.sum(ls, x => x.kg), sum = Calc.sum(ls, x => x.sum), k = Calc.sum(ls, x => Math.round(x.kg / x.pr.net)), p = Calc.sum(ls, x => Calc.sum(x.r.plan, y => y.pals));
				return `<table class="calc mt8">${ls.map(x => `<tr class="x"><td>${x.pr.qisqa} · ${F.tn(x.kg)} × ${F.narx(x.narx)}</td><td>${F.usd(x.sum)}</td></tr>`).join('')}<tr class="tot"><td>Jami: ${F.tn(kg)} · ${F.num(k)} karton · ${p} palleta · o‘rtacha ${F.narx(sum / kg)}</td><td>${F.usd(sum)}</td></tr></table>`; })(Views.noLines(f)) : ''}
			${f.extra ? `<p class="hint mt8">${Data.prod(f.extra).qisqa} qo‘shildi — o‘z narxida (${F.narx(Data.prod(f.extra).narx)}). <button type="button" class="link" data-act="useShort" data-v="">Olib tashlash</button></p>` : ''}
			${r.zs.length > 1 ? '<p class="hint mt8">Lotlar ikki zavodda — bitta furaga yig‘ish uchun palletalar bitta zavodga ko‘chiriladi.</p>' : ''}`;
	},
	noBar() {
		const f = ui.f.no, ls = Views.noLines(f), kg = Calc.sum(ls, x => x.kg), sum = Calc.sum(ls, x => x.sum), pr = Data.prod(f.prod);
		const warn = [kg > 0 && kg < db.set.fura ? `20 t dan kam (${F.tn(kg)}) — baribir saqlash mumkin` : '', +f.narx && +f.narx < pr.min ? 'narx minimaldan past — direktor tasdig‘i belgisi qo‘yiladi' : ''].filter(Boolean);
		return `${warn.length ? `<div class="need-l">${UI.icon('alert')}<span>${warn.join('; ')}</span></div>` : ''}
			<span class="grow tot-l">${F.tn(kg)} · ${F.usd(sum)}</span><button class="btn m-hide" data-act="closeDrawer">Bekor qilish</button><button class="btn pri" data-act="submitOrder"${kg > 0 ? '' : ' disabled'}>${UI.icon('lock')}Band qilish</button>`;
	},

	/* --- Xaridorlar --- */
	clients() {
		return `<div class="toolbar">${UI.search('clientQ', ui.clientQ || '', 'Nomi, mamlakat yoki mas’ul shaxs')}<span class="grow"></span><span class="hint m-hide">Hajm — oxirgi 12 oy, yuklangan. 90 kundan ko‘p olmagan xaridor sariq bilan.</span></div>

	clientCard(id) {

			<td class="c-sub">${lineTxt(o)} · ${F.tn(Calc.oKg(o))}</td><td>${UI.chip(STATUS[o.holat].t, STATUS[o.holat].c)}</td></tr>`;

				<div class="dsec"><h3>12 oyda olgan</h3><div class="kv"><span>Jami</span><b>${F.tn(st.kg)} · ${F.usd(st.usd)}</b></div>${st.idle >= 90 ? `<p class="flag amb mt8">${st.last ? `${st.idle} kundan beri olmagan` : 'hali olmagan'}</p>` : ''}
					<table class="calc mt8">${Object.entries(byP).sort((a, b) => b[1].kg - a[1].kg).map(([k, v]) => `<tr><td>${Data.prod(k).nom}<span class="sub">o‘rtacha ${F.narx(v.usd / v.kg)}</span></td><td>${F.tn(v.kg)}</td></tr>`).join('') || '<tr><td class="muted">Yuklash yo‘q</td><td></td></tr>'}</table></div>
				${can('openNewOrder') ? `<div class="acts mt16"><button class="btn pri" data-act="openNewOrder" data-id="${c.id}">${UI.icon('plus')}Buyurtma</button></div>` : ''}</div>
				<div><h3>Buyurtmalar</h3>${os.length ? `<div class="tw"><table class="tbl cards hist-t"><thead><tr><th>Raqam</th><th class="num">Summa, $</th><th>Mahsulot</th><th>Holat</th></tr></thead><tbody>${os.slice(0, 14).map(histRow).join('')}</tbody></table></div>` : '<p class="muted sm">Buyurtma yo‘q</p>'}</div>

			: `Assalomu alaykum, ${c.kontakt.split(' ')[0]}!\nA Frozen Foods tijorat taklifi:\n${ls}\nJami: ${F.t(kg)} t, ${F.usd(Calc.oSum(o))}\nShart: ${o.shart}, 100 % oldindan to‘lov.\nYuklash: ${o.yukSana ? F.dateY(o.yukSana) : 'kelishiladi'}. IQF, −18 °C, saqlash muddati 24 oy.\nHurmat bilan, ${u.ism}, ${u.tel}`;
	},
	remindText(o) {

			: `Assalomu alaykum, ${c.kontakt.split(' ')[0]}! ${F.oid(o)} buyurtmangiz (${lineTxt(o)}, ${F.t(Calc.oKg(o))} t) ${F.dateY(o.bandGacha)} gacha band. Oldindan to‘lov ${F.usd(Calc.due(o))} kutilmoqda — kelishi bilan yuklashga qo‘yamiz. Hurmat bilan, ${u.ism}, ${u.tel}`;
	},
	textForm() {
		const f = ui.f.txt, o = Data.order(f.id), text = f.kind === 'offer' ? Views.offerText(o) : Views.remindText(o);

			${f.kind === 'offer' && o.holat === 'sorov' && can('markOffer') ? `<button class="btn" data-act="markOffer" data-id="${o.id}">Taklif yuborildi</button>` : ''}</div>`;
	},
	extForm() { const o = Data.order(ui.f.ext.id); return `<p class="note"><b>${F.oid(o)}</b> · ${UI.esc(Data.client(o).nom)} · hozir ${F.dateLong(o.bandGacha)} gacha</p>${UI.field('Necha kunga uzaytirish', UI.unit(UI.num('ext.kun', 'autofocus'), 'kun'), { key: 'ext.kun' })}${UI.field('Sabab', UI.input('ext.izoh', 'placeholder="Masalan: xaridor to‘lovni 8-oktabrga va’da qildi"'))}`; }

/* ===== Views: Jo‘natmalar, Hisobot, Sozlamalar, To‘lovlar, Fermerlar (manba: c4.js) ===== */

const docIcon = { bor: 'filecheck', kut: 'fileclock' };

Object.assign(Views, {
	/* --- Jo‘natmalar --- */
	ships() {
		const by = st => db.orders.filter(o => st.includes(o.holat));

		const way = by(OUT_ST).sort((a, b) => b.yukSana < a.yukSana ? -1 : 1), done = by(['yetdi']).sort((a, b) => b.yukSana < a.yukSana ? -1 : 1).slice(0, 8);
		const docs = o => { const req = Calc.docsReq(o), miss = Calc.docsMissing(o); return miss.length ? UI.flag(`hujjat ${req.length - miss.length}/${req.length}`, 'amb') : UI.flag('hujjatlar tayyor', 'grn'); };
		const cols = [
			['Fura', 'c-main', o => `${UI.esc(Data.client(o).nom)}<span class="sub">${F.oid(o)} · ${Data.client(o).mam} · ${o.shart} · ${o.fura && o.fura.mashina || 'fura belgilanmagan'}</span>`],
			['Yuk', 'c-aside num', o => F.tn(Calc.oKg(o))],
			['Mahsulot', 'c-sub', o => lineTxt(o)],
			['Yuklash', 'nowrap', o => o.yukSana ? F.day(o.yukSana) : '—'],
			['Harorat', 'num m-hide', o => o.fura && o.fura.harorat != null ? `<span class="${o.fura.harorat > -18 ? 'red-t' : ''}">${F.temp(o.fura.harorat)}</span>` : '<span class="muted">—</span>'],

		];

	shipCard(id) {

			+ `<div class="dbody">
				${!Calc.canLoad(o) ? `<div class="lock">${UI.icon('lock')}<span><b>Yuklash yopiq: 100 % oldindan to‘lov sharti.</b> Qoldiq ${F.usd(Calc.due(o))}. Omborchi ro‘yxatida ko‘rinmaydi.</span></div>` : ''}

					['Yuklash', o.yukSana ? F.dateLong(o.yukSana) : 'belgilanmagan'], ['Mashina', f.mashina || '—'], ['Shofyor', f.shofyor ? `${f.shofyor} ${UI.call(f.shofyor)}` : '—'],
					['Plomba', f.plomba || '—'], ['Yuklash harorati', f.harorat != null ? `<span class="${f.harorat > -18 ? 'red-t strong' : ''}">${F.temp(f.harorat)}</span>` : '—']])}
				<div class="dsec"><h3>Hujjatlar · ${req.length - Calc.docsMissing(o).length} / ${req.length}</h3>${docs}

			<div class="grid2 duo">${UI.field('Bank hisobi', UI.select('pay.bank', BANKS.map(b => [b, b])))}${UI.field('To‘lov hujjati', UI.input('pay.doc', 'placeholder="SWIFT / to‘lov topshiriqnomasi №"'), { key: 'pay.doc' })}</div>

	payResult() {

	},

	/* --- Fermerlar --- */
	farmers() {

		return `<section class="card pad mb16"><div class="sums plain"><div><span class="l">Mavsumda qabul (hisob kg)</span><b>${UI.u(F.num(Math.round(Calc.sum(all, x => x.kg) / 1000)), 't')}</b></div>
			<div><span class="l">Biz qarzmiz</span><b>${UI.u(F.mln(owe).replace(' mln', ''), 'mln so‘m')}</b></div><div><span class="l">Ortiqcha avans (fermer qarz)</span><b class="amb-t">${UI.u(F.mln(adv).replace(' mln', ''), 'mln so‘m')}</b></div></div>
			<p class="rule">Hisob kg = netto − brak (brak bir marta ayriladi). Summa = Σ (hisob kg × shartnoma narxi) − avans − to‘lovlar. Mavsum ${F.dateY(db.set.mavsum)} dan.</p></section>

	farmersList() {

		return UI.table([
			['Fermer', 'c-main', r => `${UI.esc(r.f.ism)}<span class="sub">${r.f.tuman}, ${r.f.vil} · ${r.f.raws.map(k => db.raws[k][0].toLowerCase()).join(', ')}</span>`],
			['Qoldiq', 'c-aside num', r => bal(r.x)],
			['Topshirgan', 'num', r => `${F.tn(r.x.kg)}<span class="sub">${r.x.rs.length} qabul</span>`],
			['Brak', 'num m-hide', r => F.pct(r.x.brakP, 1)],
			['Hisoblangan', 'num m-hide', r => F.mln(r.x.hisob)],

		], rows, { open: r => ['openFarmer', r.f.id], empty: 'Fermer topilmadi', icon: 'sprout' });
	},
	farmerCard(id) {
		const f = Data.farmer(id), x = Calc.farmer(f);
		const rs = x.rs.slice().sort((a, b) => b.t - a.t), ps = x.ps.slice().sort((a, b) => b.t - a.t);
		const acts = [can('openFPay') ? `<button class="btn pri" data-act="openFPay" data-id="${f.id}">${UI.icon('coin')}To‘lov / avans</button>` : '',
			can('openFarmerMsg') ? `<button class="btn" data-act="openFarmerMsg" data-id="${f.id}">${UI.icon('send')}Xabar</button>` : '', can('openAkt') ? `<button class="btn" data-act="openAkt" data-id="${f.id}">${UI.icon('printer')}Akt-sverka</button>` : ''].join('');
		return Views.drawerHead(UI.esc(f.ism), `${f.tuman}, ${f.vil} viloyati · ${f.raws.map(k => db.raws[k][0].toLowerCase()).join(', ')}`)
			+ `<div class="dbody"><div class="trio"><div><span>Topshirgan (hisob)</span><b>${UI.u(F.num(x.kg), 'kg')}</b><span>brak ${F.pct(x.brakP, 1)}</span></div><div><span>Hisoblangan</span><b>${UI.u(F.mln(x.hisob).replace(' mln', ''), 'mln')}</b><span>avans + to‘lov ${F.mln(x.avans + x.tolov)}</span></div>
				<div><span>Qoldiq</span><b class="${x.bal < 0 ? 'amb-t' : ''}">${UI.u(F.mln(Math.abs(x.bal)).replace(' mln', ''), 'mln')}</b><span>${x.bal >= 0 ? 'biz qarzmiz' : 'fermer qarz (avans)'}</span></div></div>
				${UI.dl([['Telefon', `${f.tel} ${UI.call(f.tel)}`], ['Shartnoma narxi', f.raws.map(k => `${db.raws[k][0]} ${F.num(db.raws[k][1])} so‘m/kg`).join(' · ')]])}
				<div class="dsec"><h3>Qabullar (mavsum)</h3>${rs.length ? `<table class="calc">${rs.map(r => `<tr><td>${r.id} · ${F.dateY(r.sana)} · ${db.raws[r.raw][0].toLowerCase()}<span class="sub">netto ${F.kg(r.netto)} − brak ${F.kg(r.brak)} (${F.num(r.brakP, 1)} %) = ${F.kg(r.netto - r.brak)} × ${F.num(r.narx)}</span></td><td>${F.som((r.netto - r.brak) * r.narx)}</td></tr>`).join('')}</table>` : '<p class="muted sm">Qabul yo‘q</p>'}</div>
				<div class="dsec"><h3>Avans va to‘lovlar</h3>${ps.length ? `<table class="calc">${ps.map(p => `<tr class="x"><td>${F.dateY(p.t)} · ${p.tur === 'avans' ? 'avans' : 'to‘lov'}<span class="sub">${UI.esc(p.izoh || '')} · ${F.short(Data.userById(p.uid).ism)}</span></td><td>${F.som(p.sum)}</td></tr>`).join('')}</table>` : '<p class="muted sm">To‘lov yo‘q</p>'}</div>
			</div>${acts ? `<div class="dfoot"><span class="grow"></span>${acts}</div>` : ''}`;
	},
	farmerMsg(f) {
		const x = Calc.farmer(f), r = x.rs.slice().sort((a, b) => b.t - a.t)[0];
		return `Assalomu alaykum, ${f.ism.split(' ')[0]} aka! ${r ? `Sizdan ${F.dateLong(r.sana)} kuni ${F.kg(r.netto)} ${db.raws[r.raw][0].toLowerCase()} qabul qilindi, brak ${F.num(r.brakP, 1)} %, hisoblandi ${F.mln((r.netto - r.brak) * r.narx)} so‘m. ` : ''}Mavsum bo‘yicha: topshirdingiz ${F.kg(x.kg)}, hisoblangan ${F.mln(x.hisob)} so‘m, avans va to‘lovlar ${F.mln(x.avans + x.tolov)} so‘m. Qoldiq: ${x.bal >= 0 ? `${F.mln(x.bal)} so‘m (bizdan)` : `${F.mln(-x.bal)} so‘m avans (keyingi topshirishdan ushlanadi)`}. A Frozen Foods, ${Data.userById('u7').ism}.`;
	},
	fmsgForm() { const f = Data.farmer(ui.f.fmsg.id), t = Views.farmerMsg(f); return `<textarea class="in" rows="7" readonly id="txt">${UI.esc(t)}</textarea><div class="acts mt8"><a class="btn pri" data-act="shareTg" href="https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(t)}" target="_blank" rel="noopener">${UI.icon('send')}Telegram orqali</a><button class="btn" data-act="copyText">${UI.icon('copy')}Nusxa olish</button></div>`; },
	fpayForm() {
		const f = Data.farmer(ui.f.fpay.id), x = Calc.farmer(f);
		return `<p class="note"><b>${UI.esc(f.ism)}</b> · qoldiq ${x.bal >= 0 ? `${F.som(x.bal)} (biz qarzmiz)` : `${F.som(-x.bal)} avans`}</p>
			<div class="fld mt8"><span>Turi</span>${UI.seg('setFPayTur', ui.f.fpay.tur, [['tolov', 'To‘lov'], ['avans', 'Avans']], 'full2')}</div>
			${UI.field('Summa', UI.unit(`<input class="in" data-f="fpay.sum" data-num data-fmt inputmode="numeric" autocomplete="off" value="${+ui.f.fpay.sum ? F.num(+ui.f.fpay.sum) : ''}" autofocus>`, 'so‘m'), { key: 'fpay.sum', cls: 'mt8' })}${UI.field('Izoh', UI.input('fpay.izoh', 'placeholder="Ixtiyoriy"'))}`;
	},
	aktForm() {
		const f = Data.farmer(ui.f.akt.id), x = Calc.farmer(f);
		const rows = [...x.rs.map(r => ({ t: r.t, d: `Qabul ${r.id}: ${db.raws[r.raw][0].toLowerCase()} ${F.kg(r.netto - r.brak)} × ${F.num(r.narx)}`, deb: Calc.r1000((r.netto - r.brak) * r.narx), kre: 0 })),
			...x.ps.map(p => ({ t: p.t, d: p.tur === 'avans' ? 'Avans' : 'To‘lov', deb: 0, kre: p.sum }))].sort((a, b) => a.t - b.t);
		let bal = 0;
		return `<div class="pdoc"><div class="ph2"><div><h2>Akt-sverka</h2><div>${F.dateY(db.set.mavsum)} — ${F.dateY(Time.today)}</div></div><div><b>A Frozen Foods</b> va <b>${UI.esc(f.ism)}</b><br>${f.tuman}, ${f.vil}</div></div>
			<div class="tw"><table><thead><tr><th>Sana</th><th>Hujjat</th><th class="num">Hisoblandi</th><th class="num">To‘landi</th><th class="num">Qoldiq</th></tr></thead><tbody>
			${rows.map(r => { bal += r.deb - r.kre; return `<tr><td>${F.dateY(r.t)}</td><td>${r.d}</td><td class="num">${r.deb ? F.num(r.deb) : ''}</td><td class="num">${r.kre ? F.num(r.kre) : ''}</td><td class="num">${F.num(bal)}</td></tr>`; }).join('')}
			<tr><th colspan="2">Jami</th><th class="num">${F.num(Calc.sum(rows, r => r.deb))}</th><th class="num">${F.num(Calc.sum(rows, r => r.kre))}</th><th class="num">${F.num(bal)}</th></tr></tbody></table></div>
			<p>Qoldiq: <b>${bal >= 0 ? `${F.som(bal)} — A Frozen Foods fermerga qarz` : `${F.som(-bal)} — fermer avans bo‘yicha qarz`}</b>.</p><div class="sig"><span>A Frozen Foods: ______________</span><span>${UI.esc(f.ism)}: ______________</span></div></div>`;
	}
});

/* ===== Views: Qabul, Ishlab chiqarish, Omborchi (yuklash, joylash, xarita) (manba: c5.js) ===== */

Object.assign(Views, {
	/* --- Qabul (qabul va sifat, telefon) --- */
	recCalc(f) {
		const netto = Math.max(0, (+f.brutto || 0) - (+f.tara || 0)), brak = Math.round(netto * (+f.brak || 0) / 1000) * 10, kg = netto - brak, narx = f.raw ? db.raws[f.raw][1] : 0;
		return { netto, brak, kg, narx, sum: Calc.r1000(kg * narx) };
	},
	receive() {
		const f = ui.f.rec || (ui.f.rec = { fid: '', q: '', raw: '', brutto: '', tara: '', brak: '', sabab: [], harorat: '', foto: false });
		const today = db.recs.filter(r => r.sana === Time.today).sort((a, b) => b.t - a.t), next = `Q-${db.seq.q + 701}`;
		const fr = f.fid && Data.farmer(f.fid);
		return `<div class="bw"><div class="bw-h"><h2>Yangi qabul</h2><span class="sub">${next} · ${Time.hm(Time.now())}</span></div>
			<section class="card job"><form data-form="receive" autocomplete="off" class="nof">
				${UI.field('Fermer', `<div id="rec-picks">${Views.recPicks()}</div>`, { key: 'rec.fid' })}
				${fr ? `<div class="fld"><span>Xomashyo</span><div class="bchips">${fr.raws.map(k => `<button type="button" class="chip" data-act="pickRaw" data-v="${k}" aria-pressed="${f.raw === k}">${db.raws[k][0]}</button>`).join('')}</div></div>` : ''}
				<div class="grid2 duo">${UI.field('Brutto, kg', UI.num('rec.brutto', 'class="in big" placeholder="0"'), { key: 'rec.brutto' })}${UI.field('Tara, kg', UI.num('rec.tara', 'class="in big" placeholder="0"'), { key: 'rec.tara', hint: 'yashiklar' })}</div>
				<div class="grid2 duo">${UI.field('Brak, %', UI.num('rec.brak', 'class="in big" placeholder="0"'), { key: 'rec.brak' })}${UI.field('Harorat, °C', UI.num('rec.harorat', 'class="in big" placeholder="—"'), { hint: 'ixtiyoriy' })}</div>
				<div class="fld"><span>Brak sababi</span><div class="bchips">${Object.entries(BRAK_SABAB).map(([k, t]) => `<button type="button" class="chip" data-act="toggleBrak" data-v="${k}" aria-pressed="${f.sabab.includes(k)}">${t}</button>`).join('')}</div><small class="ferr" data-err="rec.sabab"></small></div>
				<label class="shot">${UI.icon('camera')}<span>${f.foto ? 'Surat olindi' : 'Surat (ixtiyoriy)'}</span><input type="file" accept="image/*" capture="environment" data-photo="rec"></label>
				<div id="rec-res">${Views.recResult()}</div>
			</form>
			<div class="jact"><button class="btn pri cta" data-act="saveReceipt">${UI.icon('check')}Qabul qildim</button></div></section>
			<div class="bw-h mt16"><h2>Bugungi qabullar</h2><span class="sub">${today.length} ta · ${F.kg(Calc.sum(today, r => r.netto))}</span></div>
			${today.map(r => `<div class="card job mini"><span class="x"><span class="t">${r.id} · ${UI.esc(Data.farmer(r.fid).ism)}</span><span class="m">${db.raws[r.raw][0]} · netto ${F.kg(r.netto)} · brak ${F.num(r.brakP, 1)} %</span><span class="m">${Calc.recLeft(r) > 0 ? 'ishlab chiqarishni kutmoqda' : 'smenaga berildi'}</span></span><span class="tm">${Time.hm(r.t)}</span></div>`).join('') || UI.empty('Bugun qabul yo‘q', 'scale')}
			<p class="last">Qabul fermer hisobiga avtomatik yoziladi: (netto − brak) × shartnoma narxi</p></div>`;
	},
	recPicks() {
		const f = ui.f.rec;
		if (f.fid) { const x = Data.farmer(f.fid); return `<div class="hit"><span class="x"><span class="t">${UI.esc(x.ism)}</span><span class="m">${x.tuman}, ${x.vil} · qoldiq ${F.mln(Calc.farmer(x).bal)}</span></span><button type="button" class="btn s ghost" data-act="clearFarmer" aria-label="Boshqa fermer">${UI.icon('x')}</button></div>`; }
		const q = f.q.trim().toLowerCase(), list = db.farmers.filter(x => !q || x.ism.toLowerCase().includes(q) || x.tuman.toLowerCase().includes(q)).slice(0, q ? 6 : 4);
		return `<div class="search wide">${UI.icon('search')}<input class="in" data-f="rec.q" value="${UI.esc(f.q)}" placeholder="Ism yoki tuman"></div><div class="picks">${list.map(x => `<button type="button" class="pick" data-act="pickFarmer" data-id="${x.id}"><span class="t">${UI.esc(x.ism)}</span><span class="m">${x.tuman} · ${x.raws.map(k => db.raws[k][0].toLowerCase()).join(', ')}</span></button>`).join('')}</div>`;
	},
	recResult() {
		const f = ui.f.rec, c = Views.recCalc(f);
		return `<div class="netto"><div><span>Netto</span><b>${F.num(c.netto)}</b></div><div><span>Brak</span><b>${F.num(c.brak)}</b></div><div><span>Hisob kg</span><b>${F.num(c.kg)}</b></div></div>
			${c.narx && c.kg ? `<p class="hint center mt8">Fermer hisobiga: ${F.num(c.kg)} × ${F.num(c.narx)} = <b>${F.som(c.sum)}</b></p>` : ''}`;
	},

	/* --- Ishlab chiqarish (ishlab chiqarish boshlig‘i) --- */
	smRecs: f => db.recs.filter(r => Calc.recLeft(r) > 0 && r.raw === Data.prod(f.prod).xom),
	smXom: f => Calc.sum(f.qs.map(Data.rec).filter(Boolean), Calc.recLeft),
	smLow: f => { const kir = Views.smXom(f) - (+f.saralash || 0); return +f.tayyor > 0 && kir > 0 && +f.tayyor / kir * 100 < Data.prod(f.prod).norma - 3; },
	prod() {
		const f = ui.f.sm || (ui.f.sm = Steps.newSmena());
		const line = Data.line(f.line), prods = db.prods.filter(p => line.guruh.includes(p.guruh)), recs = Views.smRecs(f);
		const list = db.smenas.slice().sort((a, b) => b.t - a.t).slice(0, 14);
		const waitAll = db.recs.filter(r => Calc.recLeft(r) > 0);
		const form = `<section class="card pad"><div class="sec-h"><h2>Smena partiyasi</h2><span class="hint">${Time.hm(Time.now())}</span></div>
			<div class="nof mt8">${UI.field('Liniya', UI.select('sm.line', db.lines.map(l => [l.k, `${l.nom} · ${Data.zav(l.z).nom}`])))}
			${UI.field('Mahsulot', UI.select('sm.prod', prods.map(p => [p.k, p.nom])))}
			<div class="fld"><span>Qabul partiyalari (${db.raws[Data.prod(f.prod).xom][0].toLowerCase()})</span><div class="qsel">${recs.map(r => `<button type="button" class="pck" data-act="toggleQ" data-id="${r.id}" aria-pressed="${f.qs.includes(r.id)}"><span class="box">${UI.icon('check')}</span><span class="x"><span class="t">${r.id} · ${UI.esc(Data.farmer(r.fid).ism)}</span><span class="m">${F.when(r.t)} · brak ${F.num(r.brakP, 1)} %</span></span><span class="kg">${F.kg(Calc.recLeft(r))}</span></button>`).join('') || '<p class="muted sm">Bu xomashyodan kutayotgan qabul yo‘q</p>'}</div><small class="ferr" data-err="sm.qs"></small></div>
			<div class="grid3">${UI.field('Saralash chiqindisi, kg', UI.num('sm.saralash'), { key: 'sm.saralash' })}${UI.field('Tayyor, kg', UI.num('sm.tayyor'), { key: 'sm.tayyor' })}${UI.field('Harorat, °C', UI.num('sm.harorat'))}</div>
			<div id="sm-res">${Views.smResult()}</div>
			<div class="acts"><button class="btn pri" data-act="saveSmena">${UI.icon('check')}Smenani yopish — lot ochish</button></div></div></section>`;
		const tbl = UI.table([
			['Smena', 'c-main', s => `${s.id} · ${Data.prod(s.prod).qisqa}<span class="sub">${F.dateY(s.sana)} · ${Data.line(s.line).nom}</span>`],
			['Chiqish', 'c-aside num', s => `<span class="${Calc.lowYield(s) ? 'red-t strong' : ''}">${F.pct(Calc.yieldOf(s), 1)}</span><span class="sub">me’yor ${Data.prod(s.prod).norma} %</span>`],
			['Kirdi → tayyor', 'c-sub', s => `${F.kg(s.kirdi)} → ${F.kg(s.tayyor)}`],
			['Farq', 'num m-hide', s => { const d = Calc.yieldOf(s) * 100 - Data.prod(s.prod).norma; return `<span class="${d < -3 ? 'red-t' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${F.num(Math.abs(d), 1)} p.</span>`; }],
			['Lot', 'm-hide', s => s.lot]
		], list, { open: s => ['openSmena', s.id], cls: 'sm-t' });
		return `<div class="cols"><div class="stack">${form}</div><div class="stack">${UI.card(`Ishlab chiqarishni kutayotgan qabullar<span class="c">${waitAll.length}</span>`, waitAll.length ? `<div class="rows">${waitAll.map(r => `<div class="lrow"><span class="x"><span class="t">${r.id} · ${db.raws[r.raw][0]}</span><span class="m">${UI.esc(Data.farmer(r.fid).ism)} · ${F.when(r.t)}</span></span><b>${F.kg(Calc.recLeft(r))}</b></div>`).join('')}</div>` : UI.empty('Hammasi ishlab chiqarildi', 'check'))}
			<section class="card pad"><h2>Me’yor</h2><p class="note mt8">Chiqish = tayyor ÷ ishlab chiqarishga kirgan (xomashyo − saralash chiqindisi). Me’yordan 3 punktdan ko‘p past bo‘lsa — sabab yoziladi va direktorga Diqqat bo‘lib chiqadi.</p><ul class="lines mt8">${db.prods.filter(p => line.guruh.includes(p.guruh)).map(p => `<li><span>${p.nom}</span><span class="muted">${p.norma} %${UI.taxm()}</span></li>`).join('')}</ul></section></div></div>
			<div class="mt16">${UI.card('Oxirgi smenalar', tbl)}</div>`;
	},
	smResult() {
		const f = ui.f.sm, pr = Data.prod(f.prod), xom = Views.smXom(f), kir = xom - (+f.saralash || 0), t = +f.tayyor || 0, pct = kir > 0 && t ? t / kir : 0, k = Math.floor(t / pr.net);
		return `<table class="calc"><tr><td>Xomashyo (tanlangan qabullar)</td><td>${F.kg(xom)}</td></tr><tr class="x"><td>Saralash chiqindisi</td><td>${+f.saralash ? '−' + F.num(+f.saralash) : '0'}</td></tr>

/* ===== Steps — amallar ichida qayta ishlatiladigan qadamlar (manba: d.js) ===== */
const Steps = {
	closePops() {
		const open = ui.bell || ui.gs.q || ui.gs.open;
		Object.assign(ui, { bell: false, gs: { q: '', open: false } });
		return !!open;
	},
	drawer(type, id) {
		if (Steps.closePops()) Views.render();
		UI.closeModal();
		ui.drawer = { type, id, enter: true };
		UI.refresh('layer');
		ui.drawer.enter = false;
		Router.sync();
	},
	redraw() { Views.render(); UI.refresh('layer'); },
	// Ikki marta bosishdan himoya
	guard() { const now = Date.now(); if (now - (Steps.last || 0) < 700) return false; Steps.last = now; return true; },
	newOrder(x = {}) {
		const c = x.cid && Data.client(x.cid), prod = x.prod || 'm9', st = c && Calc.clientStat(c);
		ui.f.no = { from: x.from || null, cid: x.cid || '', q: '', prod, t: x.t != null ? String(x.t) : '20', narx: String(x.narx || (st && st.lastProd === prod ? st.lastNarx : Data.prod(prod).narx).toFixed(2)),
			shart: x.shart || (c ? c.shart : 'FCA'), kun: String(db.set.bandKun), yuk: Time.add(5), izoh: '', fefo: '', extra: '' };
		return ui.f.no;
	},
	newSmena() {
		const r = db.recs.find(x => Calc.recLeft(x) > 0), pr = r ? db.prods.find(p => p.xom === r.raw) : db.prods[0], line = db.lines.find(l => l.guruh.includes(pr.guruh) && (pr.guruh !== 'sabzavot' || l.k === (['bq', 'pk', 'qv'].includes(pr.k) ? 'cab' : 'pigo')));
		return { line: line.k, prod: pr.k, qs: r ? [r.id] : [], saralash: '', tayyor: '', harorat: '-18.6', sabab: '' };
	},
	initDocs(o) {
		o.fura = o.fura || { mashina: '', shofyor: '', plomba: '', harorat: null, docs: {} };
		Calc.docsReq(o).forEach(k => { if (!o.fura.docs[k]) o.fura.docs[k] = ['invoice', 'packing', 'coa', 'ttn'].includes(k) ? 'bor' : 'kut'; });
	},
	// Hisoblangan FEFO rejasi bo‘yicha palletalar band qilinadi (bo‘shdan ortiq emas)
	allocate(o, lines) {
		const res = Calc.palRes(o.id);
		o.lines = lines.map(x => {
			const plan = Calc.fefo(x.prod, x.kg).plan, pr = Data.prod(x.prod);
			return { prod: x.prod, narx: x.narx, alloc: plan.map(p => ({ lot: p.lot, kg: p.kg, pal: Data.reserve(Data.lot(p.lot), p.karton, res) })).map(a => ({ ...a, kg: Calc.sum(a.pal, y => y[1]) * pr.net })) };
		});
	},
	textSent() {
		const f = ui.f.txt;
		if (!f) return;
		if (f.kind === 'remind') { const o = Data.order(f.id); Data.log(`Eslatma yuborildi — ${Data.client(o).nom} (${F.oid(o)}, ${F.usd(Calc.due(o))})`, 'eslatma', { oid: o.id }); }
		if (f.kind === 'fmsg') { const fr = Data.farmer(f.id); Data.log(`Fermerga xabar: ${fr.ism} — qoldiq ${F.mln(Calc.farmer(fr).bal)} so‘m`, 'fermer', { fid: fr.id }); }
		Data.save();
	},
	modal(form, title, foot, wide) { ui.modalForm = form; UI.modal(title, null, foot, wide); },
	printFoot: v => `<button class="btn" data-act="closeModal">Yopish</button><button class="btn pri" data-act="printDoc" data-v="now">${UI.icon('printer')}Chop etish</button>`
};

/* ===== Actions — foydalanuvchi amallari (manba: d.js) =====
	 Bosish — data-act (qiymati data-v / data-id), forma maydoni — data-f. */
const Actions = {
	/* navigatsiya */
	go(d) {
		Steps.closePops(); UI.closeModal();
		Object.assign(ui, { page: d.p, menu: false, drawer: null, task: null });
		Views.render(); window.scrollTo(0, 0);
	},
	toggleMenu() { ui.menu = !ui.menu; ui.bell = false; Views.render(); },
	toggleBell() {
		ui.bell = !ui.bell; ui.menu = false;
		Views.render();
		if (ui.bell) Data.markSeen(Views.notices().map(n => n.key));
	},
	toggleSearch() { ui.gs.open = !ui.gs.open; ui.gs.q = ''; Views.render(); if (ui.gs.open) $('[data-gsearch]').focus(); },
	closePops() { if (Steps.closePops()) Views.render(); },
	openNotice(d) { Steps.closePops(); Views.render(); if (Actions[d.go] && d.go !== 'go') Actions[d.go]({ id: d.id }); },
	pickRole(d) { session = { pick: d.r }; Views.render(); },
	login() {
		const input = $('#pin'), user = db.users.find(u => u.rol === session.pick && u.pin && u.faol !== false && u.pin === input.value);
		if (user) {
			session = { role: user.rol, user: user.id };
			Data.saveSession();
			Object.assign(ui, { page: null, task: null, drawer: null, f: {} });
			Views.render();
		} else {
			$('#pinerr').textContent = 'PIN noto‘g‘ri';
			input.value = '';
			input.focus();
		}
	},
	logout() { $('#toasts').innerHTML = ''; UI.closeModal(); session = {}; Data.saveSession(); Steps.closePops(); Object.assign(ui, { menu: false, drawer: null, page: null, task: null, f: {} }); Views.render(); Router.sync(); window.scrollTo(0, 0); },
	install() {
		ui.menu = false;
		Views.render();
		const steps = (title, a, b) => `<h3>${title}</h3><ol class="hint"><li>${a}</li><li>${b}</li></ol>`;
		const manual = () => UI.modal('Telefonga o‘rnatish', steps('iPhone, Safari', '«Ulashish» tugmasi', '«Ekranga qo‘shish»') + steps('Android, Chrome', 'Brauzer menyusi', '«Ilovani o‘rnatish»'), '<button class="btn" data-act="closeModal">Yopish</button>');
		if (!ui.install) return manual();
		ui.install.prompt().catch(manual);

	// Palleta QR: kamera va BarcodeDetector bo‘lsa — skaner, bo‘lmasa raqam qo‘lda kiritiladi
	scanQr() {
		if (!('BarcodeDetector' in window) || !navigator.mediaDevices) return UI.toast('Bu brauzerda QR skaner yo‘q — palleta raqamini qo‘lda kiriting', 3500);
		UI.modal('Palleta QR', '<video id="qrv" playsinline muted style="display:block;width:100%;border-radius:6px;background:var(--bg3)"></video><p class="hint mt8">QR kodni ramkaga keltiring</p>', '<button class="btn" data-act="closeModal">Yopish</button>');
		navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(st => {
			const v = $('#qrv'), det = new BarcodeDetector({ formats: ['qr_code'] }), stop = () => st.getTracks().forEach(t => t.stop());
			v.srcObject = st; v.play();
			const tick = () => {
				if (!document.body.contains(v)) return stop();
				det.detect(v).then(r => { if (!r[0]) return setTimeout(tick, 300); stop(); ui.f.audit.lot = r[0].rawValue; UI.closeModal(); Views.render(); }).catch(() => setTimeout(tick, 500));
			};
			tick();
		}).catch(() => { UI.closeModal(); UI.toast('Kameraga ruxsat berilmadi — raqamni qo‘lda kiriting', 3500); });
	},

	exportCsv() {

		const blob = new Blob(['\ufeff' + /* BOM: Excel UTF-8 ni taniydi */ rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });

	/* ishlab chiqarish (sex) */
	toggleQ(d) { const f = ui.f.sm; f.qs = f.qs.includes(d.id) ? f.qs.filter(x => x !== d.id) : [...f.qs, d.id]; Views.render(); },
	saveSmena() {
		if (!Forms.valid('sm') || !Steps.guard()) return;
		const f = ui.f.sm, pr = Data.prod(f.prod), line = Data.line(f.line), now = Time.now();
		// Avval hammasi tekshiriladi, keyin o‘zgartiriladi: xato bo‘lsa ma’lumot o‘zgarmaydi
		const recs = f.qs.map(Data.rec);
		if (recs.some(r => !r || r.raw !== pr.xom || Calc.recLeft(r) <= 0) || !line.guruh.includes(pr.guruh)) return UI.toast('Qabul partiyasi bu mahsulotga mos emas yoki allaqachon ishlatilgan');
		const xom = Calc.sum(recs, Calc.recLeft), saralash = +f.saralash || 0, karton = Math.floor(+f.tayyor / pr.net), kg = karton * pr.net;
		if (saralash >= xom || kg <= 0 || kg > xom - saralash) return UI.toast('Tayyor kg ishlab chiqarishga kirgandan (xomashyo − chiqindi) ko‘p bo‘lmasin');
		const inputs = recs.map(r => { const k = Calc.recLeft(r); r.used += k; return { q: r.id, kg: k }; });
		const id = `AF-${Time.today.slice(2, 4)}${Time.today.slice(5, 7)}-${++db.seq.lot}`, sid = `S-0${++db.seq.s + 300}`;
		const s = { id: sid, sana: Time.today, t: now, line: line.k, prod: pr.k, inputs, xom, saralash, kirdi: xom - saralash, tayyor: kg, karton, harorat: +f.harorat || -18.5, uid: session.user, lot: id, sabab: Views.smLow(f) ? f.sabab.trim() : '' };
		const l = { id, prod: pr.k, smena: sid, ishlab: Time.today, yaroq: Time.addMonths(pr.oy, Time.today), karton, kg, namunaK: 1, chiq: [], z: line.z, kam: null, placed: false, hold: '' };
		db.smenas.push(s); db.lots.push(l); Data.palletize(l);
		Data.log(`${sid}: ${pr.qisqa} — ${F.kg(kg)}, chiqish ${F.pct(Calc.yieldOf(s), 1)} (me’yor ${pr.norma} %) → ${id}, joylash kutilmoqda${s.sabab ? ' · ' + s.sabab : ''}`, Calc.lowYield(s) ? 'pastchiq' : 'smena', { lot: id });
		Data.save();
		ui.f.sm = Steps.newSmena(); Views.render(); window.scrollTo(0, 0);
		UI.toast(`${id} ochildi: ${F.kg(kg)}, ${Calc.lotPals(l).length} palleta — omborchiga joylash`, 3500);
	},

	saveLoad(d) {
		const o = Data.order(d.id);
		if (!o || o.holat !== 'tayyor') return;
		if (!Calc.canLoad(o)) return UI.toast('To‘lov to‘liq kelmagan — yuklash yopiq');
		if (!Forms.valid('load') || !Steps.guard()) return;
		const f = ui.f.load, n = Views.loadPals(o).length, miss = Calc.docsMissing(o).filter(k => k !== 'termo');
		if (miss.length && !f.force) return UI.confirm(`${miss.length} ta hujjat yetishmaydi: <b>${miss.map(k => DOC_NOM[k]).join(', ')}</b>. Fura chegarada to‘xtab qolishi mumkin. Baribir yuklash?`, 'Baribir yuklash', () => { f.force = miss; Steps.last = 0; Actions.saveLoad(d); });
		Data.consume(o);
		Steps.initDocs(o);
		Object.assign(o.fura, { harorat: +f.harorat, plomba: f.plomba.trim().toUpperCase() });
		if (o.fura.docs.termo) o.fura.docs.termo = 'bor';
		o.holat = 'yuklandi'; o.ts.yuklandi = Time.now();
		Data.log(`${F.oid(o)} yuklandi: ${Data.client(o).nom}, ${n} palleta, ${F.tn(Calc.oKg(o))}, ${F.temp(+f.harorat)}, plomba ${o.fura.plomba}${f.force ? ` · hujjatsiz yuklandi (omborchi tasdiqladi): ${f.force.map(k => DOC_NOM[k]).join(', ')}` : ''}`, 'yuklandi', { oid: o.id });
		Data.save(); ui.task = null; ui.f.load = null; Views.render(); window.scrollTo(0, 0);
		UI.toast(`Yuklandi — ${n} palleta ombordan chiqdi`, 3500);
	},
	pickZav(d) { ui.f.pl.z = d.v; ui.f.pl.kam = ''; Views.render(); },
	pickKam(d) { ui.f.pl.kam = d.v; Views.render(); },
	savePlace() {
		const f = ui.f.pl, l = Data.lot(f.lot);
		if (!l || l.placed || !Steps.guard()) return;
		if (!Data.place(l, f.z, f.kam)) return UI.toast('Kamerada joy yetmaydi');
		Data.log(`${l.id} joylandi: ${F.zk(l.z, l.kam)}, ${Calc.lotPals(l).length} palleta — sotuvga ochiq`, 'joylash', { lot: l.id });
		Data.save(); ui.f.pl = null; Views.render();
		UI.toast(`${l.id} joylandi — endi sotishga bo‘sh`);
	},
	setMapZ(d) { ui.mapZ = d.v; ui.cell = null; Data.savePrefs(); Views.render(); },
	pickCell(d) { ui.cell = ui.cell === d.id ? null : d.id; UI.refresh('map-body'); },
	openTemp(d) { ui.f.temp = { k: d.id, v: '' }; Steps.modal('tempForm', 'Kamera harorati', UI.buttons('Saqlash', 'saveTemp')); },
	saveTemp() {
		if (!Forms.valid('temp') || !Steps.guard()) return;
		const c = Data.kam(ui.mapZ, ui.f.temp.k); c.temp = +ui.f.temp.v; c.tt = Time.now();
		Data.log(`${F.zk(ui.mapZ, c.k)}: harorat ${F.temp(c.temp)} (qo‘lda)`, 'sozlama');
		Data.save(); UI.closeModal(); Views.render();
	},

	/* fermerlar (hisobchi, sifat) */
	openFPay(d) { ui.f.fpay = { id: d.id, tur: 'tolov', sum: '', izoh: '' }; Steps.modal('fpayForm', 'Fermerga to‘lov', UI.buttons('Saqlash', 'saveFPay')); },
	setFPayTur(d) { ui.f.fpay.tur = d.v; UI.refresh('mbody'); },
	saveFPay() {
		if (!Forms.valid('fpay') || !Steps.guard()) return;
		const f = ui.f.fpay, fr = Data.farmer(f.id);
		db.fpays.push({ fid: fr.id, t: Time.now(), sum: Calc.r1000(+f.sum), tur: f.tur, uid: session.user, izoh: f.izoh.trim() });
		Data.log(`${f.tur === 'avans' ? 'Avans' : 'To‘lov'} ${F.som(+f.sum)} — ${fr.ism}; qoldiq ${F.mln(Calc.farmer(fr).bal)} so‘m`, 'fermer', { fid: fr.id });
		Data.save(); UI.closeModal(); Steps.redraw();
	},
	openFarmerMsg(d) { ui.f.txt = { id: d.id, kind: 'fmsg' }; ui.f.fmsg = { id: d.id }; Steps.modal('fmsgForm', 'Fermerga xabar', '<button class="btn" data-act="closeModal">Yopish</button>'); },
	openAkt(d) { ui.f.akt = { id: d.id }; Steps.modal('aktForm', 'Akt-sverka', Steps.printFoot(), true); }
};

/* ===== Fields — forma maydonlari o‘zgarishi (manba: d.js) =====
	 Maydon o‘zgarganda sahifa to‘liq qayta chizilmaydi (kursor joyida qoladi) — faqat bog‘liq bo‘laklar yangilanadi. */
const Fields = {
	live: {
		no(k) {
			const f = ui.f.no;
			if (k === 'q') UI.refresh('no-picks');
			if (k === 'prod') { const c = f.cid && Data.client(f.cid), st = c && Calc.clientStat(c); f.narx = (st && st.lastProd === f.prod ? st.lastNarx : Data.prod(f.prod).narx).toFixed(2); f.extra = ''; UI.refresh('layer'); }
			if (['t', 'narx'].includes(k)) UI.refresh('no-plan', 'no-bar');
		},
		col() { UI.refresh('col-res'); },
		rec(k) { if (k === 'q') UI.refresh('rec-picks'); if (['brutto', 'tara', 'brak'].includes(k)) UI.refresh('rec-res'); },
		sm(k) {
			const f = ui.f.sm;
			if (k === 'line') { const l = Data.line(f.line); f.prod = (db.prods.find(p => l.guruh.includes(p.guruh) && Views.smRecs({ prod: p.k }).length) || db.prods.find(p => l.guruh.includes(p.guruh))).k; f.qs = []; Views.render(); }
			if (k === 'prod') { f.qs = []; Views.render(); }
			if (['saralash', 'tayyor'].includes(k)) { const had = !!$('[data-f="sm.sabab"]'); UI.refresh('sm-res'); if (had !== Views.smLow(f)) Forms.show('sm.sabab'); }
		},
		pay(k) { if (k === 'sum') UI.refresh('pay-res'); },
		load(k) { if (k === 'harorat') UI.refresh('load-res'); }
	},
	change(e) {
		const t = e.target, data = t.dataset, discrete = t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file' || t.type === 'date';
		if (e.type !== (discrete ? 'change' : 'input')) return;
		if (t.id === 'pin') {
			$('#pinerr').textContent = '';
			if (t.value.length === 4) Actions.login();
		} else if (data.f) {
			const [form, k] = data.f.split('.');
			if (!ui.f[form]) return;
			ui.f[form][k] = t.type === 'checkbox' ? t.checked : 'num' in data ? t.value.replace(/\s/g, '').replace(',', '.').replace('−', '-') : t.value;
			// pul maydoni: yozilayotganda ham minglik bo‘shliq bilan (kursor oxirida bo‘lsa)
			if ('fmt' in data && t.selectionStart === t.value.length) { const n = ui.f[form][k].replace(/\D/g, ''); ui.f[form][k] = n; t.value = n ? F.num(+n) : ''; }
			Forms.show(data.f);
			if (Fields.live[form]) Fields.live[form](k);
		} else if (data.filter) {
			if (can(data.filter)) Actions[data.filter]({ v: t.value, k: data.k });
		} else if (data.search) {
			if (data.search === 'orderFilter') { ui.orderFilter.q = t.value; ui.orderLimit = 40; UI.refresh('list'); }
			if (data.search === 'clientQ') { ui.clientQ = t.value; UI.refresh('clist'); }
			if (data.search === 'lotQ') { ui.lotQ = t.value; UI.refresh('llist'); }
			if (data.search === 'farmQ') { ui.farmQ = t.value; UI.refresh('flist'); }
		} else if ('gsearch' in data) {
			ui.gs.q = t.value;
			UI.refresh('gs-res');
		} else if (data.set) {
			Fields.setting(t);
		} else if (data.photo && t.files && t.files[0] && ui.f.rec) {
			ui.f.rec.foto = true; Views.render();
		}
	},
	// Sozlamalar: narx, minimal narx, chiqish me’yori, kurs, band muddati. Faqat tijorat direktori.
	setting(t) {
		if (!SETTINGS_ROLES.includes(session.role)) return UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
		const path = t.dataset.set.split('.');
		let v = +t.value.replace(/\s/g, '').replace(',', '.');
		if (t.value === '' || !isFinite(v) || v <= 0) return t.setAttribute('aria-invalid', '');
		t.removeAttribute('aria-invalid');
		if (path[0] === 'prod') Data.prod(path[1])[path[2]] = path[2] === 'norma' ? Math.min(100, v) : Math.round(v * 100) / 100;
		else { if (path[1] === 'fura') v = v * 1000; db.set[path[1]] = v; }
		const row = t.closest('tr'), fld = t.closest('.fld'), name = row ? row.cells[0].firstChild.textContent : fld ? fld.firstChild.textContent : path.join('.');
		Data.log(`Sozlama: ${name} — ${t.value}`, 'sozlama');
		Data.save();
	}
};

/* ===== Hodisalar: bosish, yozish, klaviatura (manba: d.js) ===== */

// Har amal ruxsat jadvalidan o‘tadi (CAN): tugma yashirilgani yetarli emas.
const deny = name => {
	if ([...GUEST_ACTIONS, ...BASE_ACTIONS, ...Object.values(CAN).flat()].includes(name)) UI.toast('Bu amal sizning rolingizga ruxsat etilmagan');
};
Object.keys(Actions).forEach(name => {
	const run = Actions[name];
	Actions[name] = d => can(name) ? run(d) : deny(name);
});

document.addEventListener('click', e => {
	const el = e.target.closest('[data-act]');
	if (!el || el.disabled) return;
	const name = el.dataset.act;
	if (el.tagName === 'A' && el.getAttribute('href') === '#katalog') e.preventDefault();
	if (Actions[name]) Actions[name](el.dataset);
	else deny(name);
});

/* ===== Router — manzil satri (manba: d.js) =====
	 #/sahifa yoki #/sahifa/karta/id; #katalog — xaridor katalogi. Brauzerning «orqaga» tugmasi sahifa va kartani qaytaradi. */
const Router = {
	hash: () => ui.cat ? '#katalog' : !ROLES[session.role] ? '' : '#/' + ui.page + (ui.drawer ? `/${ui.drawer.type}/${ui.drawer.id}` : '') + (ui.task ? `/vazifa/${ui.task}` : ''),
	sync() {
		const h = Router.hash();
		if (h !== location.hash && (h || location.hash)) history[location.hash ? 'pushState' : 'replaceState'](null, '', h || location.pathname + location.search);
	},
	read() {
		if (location.hash === '#katalog') { if (!ui.cat) { ui.cat = { lang: 'uz', sent: '' }; ui.f.cat = { firma: '', mam: 'RU', prod: 'm9', t: '20', aloqa: '', izoh: '' }; } return true; }
		ui.cat = null;
		const [page, type, id] = decodeURIComponent(location.hash.slice(2)).split('/'), role = ROLES[session.role];
		if (!role || !pageOk(role, page)) return false;
		ui.page = page;
		ui.task = type === 'vazifa' && ui.task === +id ? ui.task : null;
		if (type === 'neworder' && !ui.f.no) Steps.newOrder();
		ui.drawer = !role.tor && ['lot', 'order', 'client', 'ship', 'farmer', 'neworder'].includes(type) ? { type, id: ['order', 'ship'].includes(type) ? +id : id } : null;
		return true;
	}
};
window.addEventListener('popstate', () => { UI.closeModal(); Steps.closePops(); ui.menu = false; if (Router.read() || !session.role) Views.render(); else Router.sync(); });
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.acc; if (k) { ui.open = ui.open || {}; ui.open[k] = e.target.open; } }, true);
document.addEventListener('input', Fields.change);
document.addEventListener('change', Fields.change);
document.addEventListener('submit', e => {
	const submit = { pin: Actions.login, newOrder: Actions.submitOrder, receive: Actions.saveReceipt }[e.target.dataset.form];
	e.preventDefault();
	if (submit) submit();
});
document.addEventListener('keydown', e => {
	if (e.key !== 'Escape') return;
	if ($('#modal').innerHTML) UI.closeModal();
	else if (ui.bell || ui.gs.q || ui.gs.open) Actions.closePops();
	else if (ui.drawer) Actions.closeDrawer();
	else if (ui.menu) Actions.toggleMenu();
});
matchMedia('(max-width:820px)').addEventListener('change', () => { if (session.role || ui.cat) Views.render(); });
['online', 'offline'].forEach(type => window.addEventListener(type, () => { ui.online = navigator.onLine; if (session.role) Views.render(); }));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; });

/* ===== Ishga tushirish (manba: d.js) ===== */

Data.load();
Router.read();
Views.render();

// Service worker faqat http(s) da; yangi versiya kelsa — yozilayotgan narsa bo‘lmasa bir marta o‘zi yangilanadi.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
	window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* oflayn rejimsiz ham ishlaydi */ }));
	const had = !!navigator.serviceWorker.controller;
	const typing = () => !!document.querySelector('.modal') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
	let reloaded = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (!had || reloaded) return;
		if (typing()) { UI.prompt('Yangi versiya bor', 'Yangilash', 'reloadApp'); return; }
		reloaded = true;
		location.reload();
	});
}

/* ===== Sinov rejimi (build.mjs yozadi): manzilda ?sinov bo‘lsa, modullar window ga chiqariladi ===== */
if (new URLSearchParams(location.search).has('sinov')) {
	Object.assign(window, { DAY, HOUR, MIN, MON3, MONTHS, DEMO_START, DEMO_END, Time, ROLES, pageOk, STATUS, FLOW, PRE_ST, BAND_ST, OUT_ST, SHIP_ST, DOCS, DOC_NOM, MDH, MAMLAKAT, XTUR, GURUH, BRAK_SABAB, BANKS, SHIRT, EVENTS, GUEST_ACTIONS, BASE_ACTIONS, DESK_ACTIONS, SALES_WORK, CAN, SETTINGS_ROLES, can, ui, Data, Calc, $, NB, F, LOGO, UI, pos, Forms, PAGES, ATT_KIND, Views, LOT_FILTERS, lotHolat, ORDER_FILTERS, lineTxt, docIcon, Steps, Actions, Fields, deny, Router });
	Object.defineProperties(window, {
		db: { get: () => db, set: v => { db = v; } },
		session: { get: () => session, set: v => { session = v; } }
	});
}
})();
</script>
