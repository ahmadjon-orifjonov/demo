<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RADIKS — Farmatsevtika Boshqaruv Tizimi</title>
  <meta name="description" content="RADIKS farmatsevtika zavodi uchun tezkor rahbar va boshqaruv paneli">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <style>
/* RADIKS Boshqaruv Tizimi - Dizayn Tizimi (Golos Text / Professional Pharma UI) */

/* GOLOS TEXT FONTS (Latin, Latin-ext, Cyrillic, Cyrillic-ext) */
@font-face {
  font-family: "Golos Text";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/golos-text-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
}
@font-face {
  font-family: "Golos Text";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/golos-text-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2018-2019, U+201C-201D;
}
@font-face {
  font-family: "Golos Text";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/golos-text-cyrillic-wght-normal.woff2") format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: "Golos Text";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/golos-text-cyrillic-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0460-052F, U+1C80-1C88, U+2DE0-2DFF, U+A640-A69F;
}

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --primary-light: #e0f2fe;
  --primary-text: #0369a1;
  --success: #059669;
  --success-light: #ecfdf5;
  --warning: #d97706;
  --warning-light: #fffbeb;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  --karantin: #7c3aed;
  --karantin-light: #f5f3ff;
  --sidebar-bg: #0f172a;
  --sidebar-text: #cbd5e1;
  --sidebar-hover: #1e293b;
  --sidebar-active: #0284c7;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  overflow-x: hidden;
}

body {
  font-family: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.tabular {
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* APP SHELL */
#app {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* DESKTOP SIDEBAR */
.sidebar {
  width: 250px;
  background-color: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid #1e293b;
}

.sidebar-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #1e293b;
}

.brand-badge {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.brand-info h1 {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  line-height: 1.2;
}

.brand-info p {
  font-size: 11px;
  color: #94a3b8;
}

.sidebar-nav {
  flex: 1;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  color: var(--sidebar-text);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
  cursor: pointer;
}

.nav-item:hover {
  background-color: var(--sidebar-hover);
  color: #fff;
}

.nav-item.active {
  background-color: var(--sidebar-active);
  color: #fff;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.nav-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 10px;
  background: #334155;
  color: #f1f5f9;
}

.nav-badge.danger {
  background: var(--danger);
  color: #fff;
}

.nav-badge.karantin {
  background: var(--karantin);
  color: #fff;
}

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid #1e293b;
  font-size: 11px;
  color: #64748b;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.role-switcher-btn {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  width: 100%;
}

.role-switcher-btn:hover {
  background: #334155;
  color: #fff;
}

/* MAIN CONTENT */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow-x: hidden;
}

/* HEADER */
.top-header {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.header-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sample-tag {
  font-size: 11px;
  background: var(--surface-alt);
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.lang-toggle-btn {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 36px;
}

.lang-toggle-btn:hover {
  border-color: var(--border-strong);
  background: #e2e8f0;
}

.active-role-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  background: var(--primary-light);
  color: var(--primary-text);
  border: 1px solid #bae6fd;
  min-height: 36px;
  cursor: pointer;
}

/* CONTENT CONTAINER */
.content-area {
  flex: 1;
  padding: 20px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}

/* CARDS & GRIDS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}

.stat-card.alert-karantin {
  border-left: 4px solid var(--karantin);
}

.stat-card.alert-danger {
  border-left: 4px solid var(--danger);
}

.stat-card.alert-success {
  border-left: 4px solid var(--success);
}

.stat-card.alert-primary {
  border-left: 4px solid var(--primary);
}

.stat-card-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stat-card-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-card-sub {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.3;
}

/* ALERTS & NOTIFICATIONS */
.alert-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}

.alert-box-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 6px;
}

.alert-box-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.alert-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-alt);
  margin-bottom: 8px;
  font-size: 13px;
  gap: 12px;
}

.alert-item:last-child {
  margin-bottom: 0;
}

.alert-item.danger {
  background: var(--danger-light);
  border-left: 3px solid var(--danger);
}

.alert-item.karantin {
  background: var(--karantin-light);
  border-left: 3px solid var(--karantin);
}

.alert-item.warning {
  background: var(--warning-light);
  border-left: 3px solid var(--warning);
}

.alert-action-btn {
  background: #fff;
  border: 1px solid var(--border-strong);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  min-height: 36px;
  text-decoration: none;
  flex-shrink: 0;
}

.alert-action-btn:hover {
  background: var(--surface-alt);
}

/* TABLES (Horizontal Scroll on Mobile) */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 20px;
}

.table-header-bar {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 8px;
}

.table-title {
  font-size: 14px;
  font-weight: 600;
}

.table-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-input {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 13px;
  outline: none;
  background: var(--bg);
  min-height: 38px;
}

.search-input:focus {
  border-color: var(--primary);
  background: #fff;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
  min-width: 600px; /* Jadval ustunlari torayib ketmasligi uchun */
}

.data-table th {
  background: var(--surface-alt);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background: #f8fafc;
}

/* BADGES & CHIPS */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.chip.karantin {
  background: var(--karantin-light);
  color: var(--karantin);
  border: 1px solid #ddd6fe;
}

.chip.ruxsat {
  background: var(--success-light);
  color: var(--success);
  border: 1px solid #a7f3d0;
}

.chip.rad {
  background: var(--danger-light);
  color: var(--danger);
  border: 1px solid #fecaca;
}

.chip.blok {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}

.chip.jarayonda {
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid #bae6fd;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  min-height: 40px;
  white-space: nowrap;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: #fff;
  border-color: var(--border-strong);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--surface-alt);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-danger:hover {
  background: #b91c1c;
}

.btn-success {
  background: var(--success);
  color: #fff;
}

.btn-success:hover {
  background: #047857;
}

/* CASH FLOW / PUL XARITASI */
.cash-flow-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}

.cash-flow-bar {
  display: flex;
  height: 22px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 10px 0 14px 0;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
}

.cash-flow-segment {
  height: 100%;
  transition: width 0.3s;
}

.cash-flow-legend {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
}

.legend-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 4px;
}

/* STEP PROGRESS */
.step-progress {
  display: flex;
  align-items: center;
  gap: 3px;
}

.step-node {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  background: var(--border);
  color: var(--text-muted);
  flex-shrink: 0;
}

.step-node.done {
  background: var(--success);
  color: #fff;
}

.step-node.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 0 3px var(--primary-light);
}

.step-line {
  flex: 1;
  height: 2px;
  background: var(--border);
  min-width: 8px;
}

.step-line.done {
  background: var(--success);
}

/* MODAL */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-dialog {
  background: #fff;
  border-radius: var(--radius-lg);
  max-width: 500px;
  width: 100%;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 90vh;
}

.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
}

.modal-body {
  padding: 18px;
  overflow-y: auto;
}

.modal-footer {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  background: var(--surface-alt);
}

/* FORM CONTROLS */
.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.form-input, .form-select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  outline: none;
  background: #fff;
  min-height: 40px;
}

.form-input:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}

/* LOGIN SCREEN */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  padding: 16px;
}

.login-card {
  background: #fff;
  border-radius: var(--radius-lg);
  max-width: 440px;
  width: 100%;
  padding: 28px 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

.login-header {
  text-align: center;
  margin-bottom: 22px;
}

.login-header h2 {
  font-size: 19px;
  font-weight: 700;
  color: #0f172a;
}

.login-header p {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

.role-select-grid {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 18px;
}

.role-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-height: 52px;
}

.role-btn:hover {
  border-color: var(--primary);
  background: var(--surface-alt);
}

.role-btn.active {
  border-color: var(--primary);
  background: var(--primary-light);
}

.role-btn-title {
  font-size: 13.5px;
  font-weight: 600;
  color: #0f172a;
}

.role-btn-desc {
  font-size: 11px;
  color: #64748b;
}

.role-pin-hint {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: #f0f9ff;
  padding: 3px 7px;
  border-radius: 4px;
  border: 1px solid #bae6fd;
}

/* MOBILE BOTTOM NAVIGATION BAR (FIXED AT BOTTOM FOR PHONES) */
.bottom-nav {
  display: none;
}

/* ============================================================
   TELEFON FORMATI (MOBILE PHONE VIEWPORTS: 360px - 820px)
   ============================================================ */
@media (max-width: 820px) {
  #app {
    flex-direction: column;
  }

  /* Desktop sidebar telefon ekranida yashiriladi */
  .sidebar {
    display: none;
  }

  /* Telefon tepasi: ixcham, qulay sticky header */
  .top-header {
    height: 52px;
    padding: 0 12px;
    gap: 8px;
  }

  .header-title {
    font-size: 14px;
  }

  .sample-tag {
    display: none; /* Telefonda joy tejash */
  }

  /* Kontent maydoni: pastki navigatsiya uchun bo'sh joy qoldiriladi */
  .content-area {
    padding: 12px 12px calc(76px + env(safe-area-inset-bottom)) 12px;
  }

  /* Mobil 4 raqamli indikator: 2 ustunli toza to'r */
  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat-card {
    padding: 10px 12px;
  }

        preparat: p,
        tannarx: jami_tannarx,

        rentabel: marja_som > 0 && parseFloat(marja_foiz) > 5.0

(function(window) {

  // 1. FORMATLASH FUNKSIYALARI (F)
  const F = {
    som: function(n) {
      if (typeof n !== 'number' || isNaN(n)) return '0 so\'m';
      if (Math.abs(n) >= 1000000000) {
        return (n / 1000000000).toFixed(2).replace('.', ',') + ' mlrd so\'m';
      }
      if (Math.abs(n) >= 1000000) {
        return (n / 1000000).toFixed(1).replace('.', ',') + ' mln so\'m';
      }
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' so\'m';
    },

    son: function(n) {
      if (typeof n !== 'number' || isNaN(n)) return '0';
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    },

    sana: function(str) {
      if (!str) return '—';
      const parts = str.split('T')[0].split('-');
      if (parts.length === 3) {
        return parts[2] + '.' + parts[1] + '.' + parts[0];
      }
      return str;
    },

    seriya: function(kod) {
      return '<span class="tabular" style="font-family:monospace;font-weight:700;background:#f1f5f9;padding:2px 6px;border-radius:3px;border:1px solid #cbd5e1;">' + (kod || '—') + '</span>';
    }

  let JORIY_YOZUV = 'lotin'; // 'lotin' yoki 'kirill'

  const LOTIN_TO_KIRILL_MAP = {
    'sh': 'ш', 'Sh': 'Ш', 'SH': 'Ш',
    'ch': 'ч', 'Ch': 'Ч', 'CH': 'Ч',
    'yo': 'ё', 'Yo': 'Ё', 'YO': 'Ё',
    'yu': 'ю', 'Yu': 'Ю', 'YU': 'Ю',
    'ya': 'я', 'Ya': 'Я', 'YA': 'Я',

    'o\'': 'ў', 'O\'': 'Ў', 'g\'': 'ғ', 'G\'': 'Ғ',
    'a': 'а', 'A': 'А', 'b': 'б', 'B': 'Б', 'd': 'д', 'D': 'Д',
    'e': 'е', 'E': 'Е', 'f': 'ф', 'F': 'Ф', 'g': 'г', 'G': 'Г',
    'h': 'ҳ', 'H': 'Ҳ', 'i': 'и', 'I': 'И', 'j': 'ж', 'J': 'Ж',
    'k': 'к', 'K': 'К', 'l': 'л', 'L': 'Л', 'm': 'м', 'M': 'М',
    'n': 'н', 'N': 'Н', 'o': 'о', 'O': 'О', 'p': 'п', 'P': 'П',

    't': 'т', 'T': 'Т', 'u': 'у', 'U': 'У', 'v': 'в', 'V': 'В',
    'x': 'х', 'X': 'Х', 'y': 'й', 'Y': 'Й', 'z': 'з', 'Z': 'З',
    'ts': 'ц', 'Ts': 'Ц', 'TS': 'Ц'
  };

  // Maxsus farmatsevtika atamalari
  const FARMA_SOZLAR = [
    { lotin: 'tsex', kirill: 'цех' },
    { lotin: 'Tsex', kirill: 'Цех' },
    { lotin: 'substansiya', kirill: 'субстанция' },
    { lotin: 'Substansiya', kirill: 'Субстанция' },
    { lotin: 'distribyutor', kirill: 'дистрибьютор' },
    { lotin: 'Distribyutor', kirill: 'Дистрибьютор' },
    { lotin: 'seriya', kirill: 'серия' },
    { lotin: 'Seriya', kirill: 'Серия' },
    { lotin: 'karantin', kirill: 'карантин' },

    { lotin: 'dorixona', kirill: 'дорихона' },

  ];

  function T(matn) {
    if (!matn || typeof matn !== 'string') return matn;
    if (JORIY_YOZUV === 'lotin') return matn;

    let res = matn;
    // Maxsus atamalarni almashtirish
    FARMA_SOZLAR.forEach(item => {
      res = res.split(item.lotin).join(item.kirill);
    });

    // Ikki harfli birikmalar
    const ikkitalik = ['sh', 'Sh', 'SH', 'ch', 'Ch', 'CH', 'yo', 'Yo', 'YO', 'yu', 'Yu', 'YU', 'ya', 'Ya', 'YA', 'ye', 'Ye', 'YE', 'o‘', 'O‘', 'g‘', 'G‘', 'o\'', 'O\'', 'g\'', 'G\'', 'ts', 'Ts', 'TS'];

      const v = LOTIN_TO_KIRILL_MAP[k];
      res = res.split(k).join(v);
    });

    // Bittalik harflar
    let out = '';
    for (let i = 0; i < res.length; i++) {
      const ch = res[i];
      out += LOTIN_TO_KIRILL_MAP[ch] || ch;
    }

          xomashyo_seriya: 'K-0612',
          sterillik_kuni: 0,
          tahlil_holati: 'kutilmoqda'
        });
        Storage.save(db);
        alert(T('Yangi seriya ' + seriyaRaqam + ' 1-bosqichda (Xomashyo qorish) muvaffaqiyatli boshlandi!'));
        this.modalYop();
        render();
      }
    },

    modalJonatishOch: function() {
      const modal = document.getElementById('modal-container');
      if (!modal) return;
      modal.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)RadiksApp.Actions.modalYop()">
          <div class="modal-dialog">
            <div class="modal-header">
              <span class="modal-title">${T('Mijozga Tovar Jo\'natish (FEFO bo\'yicha)')}</span>
              <button class="btn btn-secondary" style="padding:4px;" onclick="RadiksApp.Actions.modalYop()">&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">${T('Mijozni tanlang')}</label>
                <select id="jonatish-mijoz-id" class="form-select">
                  ${db.mijozlar.map(m => `<option value="${m.id}">${m.nom} ${m.bloklangan ? '(' + T('BLOKLANGAN') + ')' : ''}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">${T('Preparat')}</label>
                <select id="jonatish-prep-id" class="form-select">
                  ${db.preparatlar.map(p => `<option value="${p.id}">${p.nom}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">${T('Miqdor (dona)')}</label>
                <input type="number" id="jonatish-miqdor" class="form-input" placeholder="Masalan: 10000">
              </div>
              <div style="font-size:11px;color:var(--success);background:var(--success-light);padding:8px;border-radius:4px;">
                ${T('FEFO Kafolati: Tizim faqat OKK ruxsat bergan va yaroqlilik muddati eng yaqin bo\'lgan seriyadan yuklaydi.')}
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="RadiksApp.Actions.modalYop()">${T('Bekor qilish')}</button>
              <button class="btn btn-primary" onclick="RadiksApp.Actions.saqlashJonatish()">${T('Yuklash va Jo\'natish')}</button>
            </div>
          </div>
        </div>
      `;
    },

    saqlashJonatish: function() {
      const mijozId = document.getElementById('jonatish-mijoz-id')?.value;
      const prepId = document.getElementById('jonatish-prep-id')?.value;
      const miqdor = parseFloat(document.getElementById('jonatish-miqdor')?.value);

      const m = db.mijozlar.find(x => x.id === mijozId);
      if (m && m.bloklangan) {
        alert(T('DIQQAT! ' + m.nom + ' da muddati o\'tgan qarzdorlik bor! Jo\'natish qat\'iyan bloklangan. Faqat Bosh direktor (Abdurasul aka) ruxsat bera oladi.'));
        return;
      }

      const fefoSeriyalar = Calc.fefoSeriyalar(prepId, db);
      if (!fefoSeriyalar || fefoSeriyalar.length === 0) {
        alert(T('Ushbu preparat bo\'yicha omborda sotuvga ruxsat berilgan erkin zaxira mavjud emas! (Karantindagi tovarlarni sotish taqiqlanadi).'));
        return;
      }

      const engYaqinSeriya = fefoSeriyalar[0];
      if (engYaqinSeriya.qoldiq < miqdor) {
        alert(T('FEFO bo\'yicha birinchi seriyada (' + engYaqinSeriya.seriya + ') faqat ' + engYaqinSeriya.qoldiq + ' dona bor!'));
        return;
      }

      engYaqinSeriya.qoldiq -= miqdor;
      const p = db.preparatlar.find(x => x.id === prepId);
      const summa = miqdor * (p ? p.narx_sotuv : 5000);

      db.buyurtmalar.unshift({
        id: 'B-' + Math.floor(1085 + Math.random() * 50),
        mijoz_id: m.id,
        mijoz_nom: m.nom,
        prep_id: prepId,
        miqdor: miqdor,
        summa: summa,
        sana: '2026-11-12',
        holat: 'jonatildi',
        izoh: 'FEFO: ' + engYaqinSeriya.seriya + ' seriyadan yuklandi'
      });

      m.qarz += summa;
      Storage.save(db);
      alert(T('Tovar muvaffaqiyatli yuklandi! FEFO seriyasi: ' + engYaqinSeriya.seriya));
      this.modalYop();
      render();
    },

    modalYop: function() {
      const modal = document.getElementById('modal-container');
      if (modal) modal.innerHTML = '';
    }
  };

  // 2. ROUTER VA RENDER
  function render() {
    const root = document.getElementById('root');
    if (!root) return;

    if (!joriyRol) {
      root.innerHTML = viewKirish(db);
      return;
    }

    let hash = location.hash.replace('#', '') || 'bugun';
    const ruxsatlar = CAN[joriyRol] || CAN.rahbar;

    // Ruxsatni tekshirish
    if (!ruxsatlar.includes(hash) && !ruxsatlar.includes('hammasi')) {
      hash = ruxsatlar[0] || 'bugun';
    }

    let contentHtml = '';
    switch (hash) {
      case 'bugun':
        contentHtml = viewBugun(db);
        break;
      case 'xomashyo':
        contentHtml = viewXomashyo(db);
        break;
      case 'ishlab':
        contentHtml = viewIshlab(db);
        break;
      case 'okk':
        contentHtml = viewOkk(db);
        break;
      case 'ombor':
        contentHtml = viewOmbor(db);
        break;
      case 'sotuv':
        contentHtml = viewSotuv(db);
        break;
      case 'moliya':
        contentHtml = viewMoliya(db);
        break;
      case 'izi':
        contentHtml = viewIzi(db);
        break;
      default:
        contentHtml = viewBugun(db);
    }

    root.innerHTML = viewShell(contentHtml, hash, db, joriyRol);
  }

  // Hash o'zgarganda qayta render qilish
  window.addEventListener('hashchange', render);

  // Dastlabki ishga tushirish
  document.addEventListener('DOMContentLoaded', function() {
    render();
  });

  // Eksport
  window.RadiksApp = window.RadiksApp || {};
  window.RadiksApp.Actions = Actions;
  window.RadiksApp.render = render;
  window.RadiksApp.getDb = () => db;

})(window);

  </script>
</body>
</html>
