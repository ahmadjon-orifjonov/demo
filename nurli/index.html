<title>Nurli Diyor Agro — boshqaruv tizimi (namuna)</title>
<link rel="manifest" href="manifest.webmanifest">

/* Shrift: Golos Text (SIL OFL 1.1), fonts\ papkasidan; kirill bo'laklari faqat kirill yozuvida yuklanadi. */
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text-cyrillic-ext-wght-normal.woff2) format("woff2");unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
:root{
	--blue:#2c6e36;--blue2:#215429;--bluet:#e3f1e2;--sky:#86c98a;
	--night:#17301c;--night2:#20452a;--ink:#17241a;--tx2:#46584a;--muted:#5c6f60;
	--bg:#f3f7f1;--card:#fff;--line:#d8e4d6;--line2:#e8f0e6;
	--grn:#17764a;--grnt:#e2f3ea;--amb:#925600;--ambt:#fcf1dc;--red:#b3261e;--redt:#fbe9e7;--vio:#5b3ea6;--viot:#eee9fa;
	--r:10px;--r2:14px;--sh:0 1px 2px rgba(23,48,28,.06),0 1px 1px rgba(23,48,28,.04);--elev:0 12px 32px rgba(23,48,28,.22);
	--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
	--yon:236px;--tepa:52px;--past:62px;--nam:26px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}

/* Namuna tasmasi */
.namuna{position:fixed;top:0;left:0;right:0;height:var(--nam);z-index:60;background:var(--ambt);color:var(--amb);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid #f0dcb4;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Kirish */
.kirish{min-height:100vh;padding:calc(var(--nam) + 28px) 16px 32px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--night) 0,var(--night2) 300px,var(--bg) 300px)}
.kirish .belgi{color:#fff;text-align:center;margin-bottom:22px}
.belgi b{display:block;font-size:26px;font-weight:800;letter-spacing:.02em}
.belgi span{display:block;color:#c5e6c2;font-size:14px;margin-top:2px}
.kirish .quti{width:100%;max-width:460px;background:var(--card);border-radius:var(--r2);box-shadow:var(--elev);padding:22px 20px}
.kirish h1{font-size:19px;font-weight:700;margin-bottom:4px}
.kirish .izoh{color:var(--muted);font-size:14px;margin-bottom:16px}
.rollar{display:grid;gap:10px}
.rol{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px}
.rol:hover{border-color:var(--blue);background:#f6faf5}
.rol .dum{width:42px;height:42px;border-radius:10px;background:var(--bluet);color:var(--blue);display:grid;place-items:center;flex:none}
.rol .n{font-weight:650;display:block}
.rol .d{color:var(--muted);font-size:13px;display:block}
.rol .pin-t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.pinq{display:grid;gap:12px}
.pinq input{font-size:26px;letter-spacing:.5em;text-align:center;padding:10px 8px 10px calc(8px + .5em);height:56px}
.xato{color:var(--red);font-size:13.5px;min-height:20px}
.kirish .ost{margin-top:18px;text-align:center;color:var(--muted);font-size:13px;max-width:460px}
.til{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin:0 auto 18px}
.til button{background:transparent;border:0;color:#d3e9d0;padding:7px 14px;font-size:13.5px;font-weight:600;min-height:36px}
.til button[aria-pressed=true]{background:#fff;color:var(--night)}

/* Qobiq */
.yon{position:fixed;top:var(--nam);left:0;bottom:0;width:var(--yon);background:var(--night);color:#d2e3d0;display:flex;flex-direction:column;padding:16px 12px;z-index:40}
.yon .belgi{text-align:left;padding:4px 8px 16px}
.yon .belgi b{font-size:19px;color:#fff}
.yon .belgi span{font-size:12.5px}
.yon nav{display:grid;gap:2px}
.yon nav a{display:flex;align-items:center;gap:11px;color:#d2e3d0;padding:10px 10px;border-radius:8px;font-weight:550;font-size:14.5px}
.yon nav a:hover{background:rgba(255,255,255,.07);text-decoration:none}
.yon nav a[aria-current=page]{background:var(--blue);color:#fff}
.yon nav a .son{margin-left:auto;background:#fff;color:var(--night);border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.yon .oxir{margin-top:auto;display:grid;gap:10px;padding:8px}
.yon .kim{font-size:13.5px;line-height:1.3}
.yon .kim b{display:block;color:#fff;font-size:14.5px}
.yon .til{margin:0;justify-self:start}
.yon .chiq{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#d2e3d0;border-radius:8px;padding:8px 10px;font-size:14px}
.tepa,.past{display:none}
.sahifa{margin-left:var(--yon);padding:calc(var(--nam) + 22px) 28px 48px;max-width:1280px}
.bosh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bosh h1{font-size:24px;font-weight:750;line-height:1.2}
.bosh .ost{color:var(--muted);font-size:14px;margin-top:2px}
.bosh .ong{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.orqa{display:inline-flex;align-items:center;gap:4px;font-size:14px;margin-bottom:10px;min-height:32px}

/* Tugma */
.t{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap}
.t:hover{border-color:#b5ccb3;text-decoration:none}
.t.a{background:var(--blue);border-color:var(--blue);color:#fff}
.t.a:hover{background:var(--blue2)}
.t.x{color:var(--red)}
.t.k{min-height:34px;padding:5px 10px;font-size:13.5px}
.t.keng{width:100%;min-height:48px;font-size:16px}
.t[disabled]{opacity:.5;cursor:not-allowed}
.hav{background:none;border:0;padding:0;color:var(--blue);font-weight:600}

/* Karta */
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.k>h2,.k>.kb h2{font-size:16px;font-weight:700}
.kb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kb .ong{margin-left:auto;display:flex;gap:8px;align-items:center}
.kb .ost{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.qator2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.qator2>.k{margin-bottom:0}
.qator2{margin-bottom:16px}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:14px 16px;display:block;color:inherit}
a.kp:hover{border-color:var(--blue);text-decoration:none}
.kp .y{color:var(--muted);font-size:13px;font-weight:550}
.kp .q{font-size:25px;font-weight:750;line-height:1.2;margin-top:4px;white-space:nowrap}
.kp .q small{font-size:14px;font-weight:600;color:var(--tx2)}
.kp .p{font-size:13px;color:var(--tx2);margin-top:4px}
.kp .p.yom{color:var(--red);font-weight:600}
.kp .p.yax{color:var(--grn);font-weight:600}

/* Belgi (badge) */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;background:var(--line2);color:var(--tx2);white-space:nowrap}
.b.ko{background:var(--bluet);color:var(--blue)}
.b.ya{background:var(--grnt);color:var(--grn)}
.b.sa{background:var(--ambt);color:var(--amb)}
.b.qi{background:var(--redt);color:var(--red)}
.b.bi{background:var(--viot);color:var(--vio)}

/* E'tibor ro'yxati */
.et{display:grid}
.et a{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line2);color:inherit}
.et a:first-child{border-top:0}
.et a:hover{text-decoration:none;background:#f6faf5}
.et .nuq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ambt);color:var(--amb)}
.et .nuq.qi{background:var(--redt);color:var(--red)}
.et .nuq.ko{background:var(--bluet);color:var(--blue)}
.et .nuq svg{width:17px;height:17px}
.et b{display:block;font-weight:650;font-size:14.5px}
.et span{color:var(--tx2);font-size:13.5px}
.et .uq{margin-left:auto;color:var(--muted);align-self:center}

/* Jadval */
.jw{overflow-x:auto;margin:0 -4px}
table.j{width:100%;border-collapse:collapse;font-size:14px}
.j th{font-size:12.5px;font-weight:650;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.j td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.j tr:last-child td{border-bottom:0}
.j .r{text-align:right;white-space:nowrap}
.j .kich{color:var(--muted);font-size:13px;display:block}
.j td b{font-weight:650}
.j tr.bos{cursor:pointer}
.j tr.bos:hover td{background:#f6faf5}
.j tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.bosh-yoq{color:var(--muted);padding:18px 4px;text-align:center;font-size:14px}

/* Yorliqlar (tabs) */
.yor{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.yor::-webkit-scrollbar{display:none}
.yor a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;min-height:38px;font-weight:600;font-size:14px;color:var(--tx2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.yor a:hover{text-decoration:none;border-color:#b5ccb3}
.yor a[aria-current=true]{background:var(--night);border-color:var(--night);color:#fff}
.yor .son{background:var(--line2);color:var(--tx2);border-radius:999px;font-size:12px;padding:0 6px;font-weight:700}
.yor a[aria-current=true] .son{background:rgba(255,255,255,.2);color:#fff}
.yor .son.qi{background:var(--red);color:#fff}

/* Ro'yxat kartalari */
.ry{display:grid;gap:10px}
.el{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:inherit;box-shadow:var(--sh)}
a.el:hover{border-color:var(--blue);text-decoration:none}
.el .ust{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.el .id{font-weight:700;font-size:13.5px;color:var(--muted)}
.el .nom{font-weight:650;font-size:15.5px}
.el .mat{color:var(--tx2);font-size:14px;margin-top:2px}
.el .pas{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--tx2);align-items:center}
.el .pas .ong{margin-left:auto;font-weight:700;color:var(--ink);font-size:15px}
.el.shosh{border-left:4px solid var(--red)}
.el .amal{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.izl{position:relative;margin-bottom:14px;max-width:420px}
.izl input{width:100%;padding-left:38px}
.izl svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Maydon */
.in,select.in,textarea.in{width:100%;border:1px solid #c0d1be;background:#fff;border-radius:9px;padding:9px 11px;min-height:42px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--blue);outline:3px solid var(--bluet)}
.may{display:grid;gap:5px;margin-bottom:12px}
.may>span{font-size:13.5px;font-weight:600;color:var(--tx2)}
.may2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yord{font-size:13px;color:var(--muted)}
.tan{display:flex;align-items:center;gap:8px;min-height:40px}
.tan input{width:20px;height:20px}

/* Bosqichlar */
.qadam{display:flex;gap:4px;margin:4px 0 2px;overflow-x:auto}
.qadam span{flex:1;min-width:86px;text-align:center;font-size:12.5px;font-weight:650;padding:7px 6px;background:var(--line2);color:var(--muted);border-radius:6px;white-space:nowrap}
.qadam span.ot{background:var(--grnt);color:var(--grn)}
.qadam span.hoz{background:var(--blue);color:#fff}

/* Ta'rif ro'yxati */
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.tr div>span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.tr div>b{font-weight:600;font-size:15px}
.jami{display:grid;gap:6px;max-width:340px;margin-left:auto;margin-top:12px;font-size:14.5px}
.jami div{display:flex;justify-content:space-between;gap:16px}
.jami .kat{font-weight:750;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.eslat{background:var(--ambt);color:#6b4000;border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.eslat.qi{background:var(--redt);color:#7d1a14}
.eslat.ko{background:var(--bluet);color:var(--blue2)}
.eslat svg{margin-top:1px}
.tarix{display:grid;gap:8px;font-size:13.5px;color:var(--tx2)}
.tarix div{display:flex;gap:10px}
.tarix time{color:var(--muted);white-space:nowrap;min-width:78px}

/* Chiziqlar */
.grafik{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.grafik .oy{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.grafik .juft{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.grafik .juft i{display:block;width:42%;max-width:26px;border-radius:5px 5px 0 0;background:var(--blue);min-height:2px}
.grafik .juft i.x{background:#adc9a8}
.grafik .oy span{font-size:12px;color:var(--muted);white-space:nowrap}
.grafik .oy.hoz span{color:var(--ink);font-weight:700}
.afs{display:flex;gap:16px;font-size:13px;color:var(--tx2);margin-top:10px;flex-wrap:wrap}
.afs i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin-right:6px}
.afs i.x{background:#adc9a8}
.gor{display:grid;gap:10px}
.gor .q{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.gor .yol{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.gor .yol i{display:block;height:100%;background:var(--blue);border-radius:999px}
.gor .yol i.qi{background:var(--red)}.gor .yol i.sa{background:#d9951c}.gor .yol i.ya{background:var(--grn)}
.gor .q b{white-space:nowrap;font-weight:650}
.qold{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qold .yol{width:56px;height:6px;background:var(--line2);border-radius:999px;overflow:hidden}
.qold .yol i{display:block;height:100%;background:var(--grn)}
.qold.kam .yol i{background:#d9951c}.qold.yoq .yol i{background:var(--red)}
.qold.kam b,.qold.yoq b{color:var(--red)}

/* Oyna */
.parda{position:fixed;inset:0;background:rgba(23,48,28,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.oyna{background:#fff;border-radius:var(--r2);box-shadow:var(--elev);width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.oyna header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.oyna header h2{font-size:17px;font-weight:700}
.oyna header button{margin-left:auto;background:none;border:0;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.oyna .ich{padding:16px 18px;overflow-y:auto}
.oyna footer{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xabar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:550;z-index:90;box-shadow:var(--elev);max-width:calc(100vw - 32px);text-align:center}
.pastki{color:var(--muted);font-size:13px;margin-top:26px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}

.usta-sal{background:var(--night);color:#fff;border-radius:var(--r2);padding:16px 18px;margin-bottom:16px}
.usta-sal b{font-size:19px;display:block}
.usta-sal span{color:#c5e6c2;font-size:14px}
.yuk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.yuk div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.yuk b{display:block;font-weight:650}
.yuk span{font-size:13px;color:var(--tx2)}

@media (max-width:1100px){.kpi{grid-template-columns:repeat(2,1fr)}.qator2{grid-template-columns:1fr}}
@media (max-width:899px){
	.yon{display:none}
	.tepa{display:flex;position:fixed;top:var(--nam);left:0;right:0;height:var(--tepa);background:var(--night);color:#fff;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:40}
	.tepa b{font-size:16px;font-weight:750;white-space:nowrap}
	.tepa .rolb{font-size:12.5px;color:#c5e6c2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
	.tepa .ong{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
	.tepa .tilb{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;font-size:12.5px;font-weight:650;padding:0 10px;height:32px;white-space:nowrap}
	.tepa .chiq{background:none;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center}

<script>
(() => {
'use strict';
/* ===== yozuv.js ===== */
/* Yozuv: lotin <-> kirill (o'zbekcha). Manba matnlar lotinda, oddiy ' bilan yoziladi.
   Yozuv.kir(s)  — lotin -> kirill;  Yozuv.lot(s) — tipografik lotin (o‘, g‘, ’);

   Yozuv.dom(el, til) — tugun ichidagi matn va yorliqlarni tanlangan yozuvga o'tkazadi. */
const Yozuv = (() => {
	// O'zgarmaydigan nomlar (brend, fayl turi)
	const SAQLA = new Set(['Excel', 'CSV']);
	// Yumshatish belgili o'zlashma so'zlar: [lotin o'zak, kirill o'zak, so'z aynan shu bo'lsa qo'shiladigan oxiri]
	const OZAK = [
		['panel', 'панель', ''], ['rol', 'роль', ''], ['filtr', 'фильтр', ''], ['dizel', 'дизель', ''], ['tabel', 'табель', ''],
		['gerbitsid', 'гербицид', ''], ['fungitsid', 'фунгицид', ''], ['insektitsid', 'инсектицид', ''], ['ratsion', 'рацион', ''], ['laktatsiya', 'лактация', ''],
		['kultivatsiya', 'культивация', ''], ['brutsellyoz', 'бруцеллёз', ''], ['vaksina', 'вакцина', ''],
		['sentabr', 'сентябр', 'ь'], ['oktabr', 'октябр', 'ь'],
		['noyabr', 'ноябр', 'ь'], ['dekabr', 'декабр', 'ь'], ['fevral', 'феврал', 'ь'], ['aprel', 'апрел', 'ь'],
		['iyun', 'июн', 'ь'], ['iyul', 'июл', 'ь'], ['yanvar', 'январ', 'ь'],
	];
	const BIR = { a: 'а', b: 'б', d: 'д', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ', r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з' };

	const TIRNOQ = "'‘’ʻʼ`";
	const tq = c => c !== undefined && c !== '' && TIRNOQ.includes(c);
	const katta = c => c !== c.toLowerCase();
	const kat = (s, asl) => katta(asl) ? s.charAt(0).toUpperCase() + s.slice(1) : s;

	function soz(w) {
		const kich = w.toLowerCase().replace(/[‘’ʻʼ`]/g, "'");
		for (const [l, k, oxir] of OZAK) {
			if (kich.startsWith(l)) {
				const qol = w.slice(l.length);
				const bosh = kat(k, w[0]);
				return qol ? bosh + harf(qol, true) : bosh + oxir;
			}

		return harf(w, false);
	}
	// ichkari=true: so'z o'rtasidan davom (boshidagi «e» qoidasi ishlamaydi)
	function harf(w, ichkari) {
		let out = '';
		for (let i = 0; i < w.length; i++) {
			const c = w[i], n = w[i + 1], n2 = w[i + 2], cl = c.toLowerCase(), nl = n ? n.toLowerCase() : '';
			const oldin = i > 0 ? w[i - 1] : (ichkari ? 'x' : '');
			if ((cl === 'o' || cl === 'g') && tq(n)) { out += kat(cl === 'o' ? 'ў' : 'ғ', c); i++; continue; }
			if (cl === 's' && nl === 'h') { out += kat('ш', c); i++; continue; }
			if (cl === 'c' && nl === 'h') { out += kat('ч', c); i++; continue; }
			if (cl === 'y' && nl === 'o' && !tq(n2)) { out += kat('ё', c); i++; continue; }
			if (cl === 'y' && nl === 'u') { out += kat('ю', c); i++; continue; }
			if (cl === 'y' && nl === 'a') { out += kat('я', c); i++; continue; }
			if (cl === 'y' && nl === 'e') { out += kat('е', c); i++; continue; }
			if (cl === 'e') { out += kat(oldin === '' || UNLI.includes(oldin) ? 'э' : 'е', c); continue; }
			if (tq(c)) { out += 'ъ'; continue; }

	// Kod va model nomlari (raqam + katta harf: TY2-PK, S-1042) o'zgarmaydi
	const kodmi = t => /\d/.test(t) && /[A-Z]/.test(t);

	function kir(s) {
		if (!s || !/[A-Za-z]/.test(s)) return s;
		return s.replace(TOKEN, t => {
			if (SAQLA.has(t) || kodmi(t)) return t;
			return t.split('-').map(b => (SAQLA.has(b) ? b : soz(b))).join('-');
		});

		if (!s || s.indexOf("'") < 0) return s;

	}

	function qid(s) {
		return String(s || '').toLowerCase().replace(/[Ѐ-ӿ]/g, c => QAYTA[c] !== undefined ? QAYTA[c] : (TESK[c] || c)).replace(/['‘’ʻʼ`]/g, '');

	}

	return `<div class="yor" role="tablist">${royxat.map(([k, n, s, q]) => `<a role="tab" href="${asos}${k ? '?' + k : ''}" aria-current="${joriy === k}">${n}${s != null ? `<span class="son${q && s ? ' qi' : ''}">${s}</span>` : ''}</a>`).join('')}</div>`;
}

const bosh_yoq = m => `<div class="bosh-yoq">${m}</div>`;
const qadam = (tart, nom, hoz) => { const i = tart.indexOf(hoz); return `<div class="qadam" aria-label="Bosqich">${tart.map((k, j) => `<span class="${j < i ? 'ot' : j === i ? 'hoz' : ''}">${nom[k]}</span>`).join('')}</div>`; };
const kpi = (y, q, birlik, p, sinf, h) => `<${h ? `a href="${h}"` : 'div'} class="kp"><div class="y">${y}</div><div class="q">${q}${birlik ? ` <small>${birlik}</small>` : ''}</div>${p ? `<div class="p ${sinf || ''}">${p}</div>` : ''}</${h ? 'a' : 'div'}>`;
const kpiPul = (y, n, p, sinf, h) => Math.abs(n) >= 1e6 ? kpi(y, mln(n).replace(' mln', ''), `mln so'm`, p, sinf, h) : kpi(y, guruhla(n), `so'm`, p, sinf, h);
function gor(qatorlar, shakl) { // [nom, qiymat, sinf?]
	const eng = Math.max(1, ...qatorlar.map(q => Math.abs(q[1])));
	return `<div class="gor">${qatorlar.map(q => `<div class="q"><span>${q[0]}</span><div class="yol"><i class="${q[2] || ''}" style="width:${Math.max(q[1] ? 2 : 0, Math.round(Math.abs(q[1]) / eng * 100))}%"></i></div><b>${shakl(q[1])}</b></div>`).join('')}</div>`;
}
// Ustma-ust chiziq va izohi: [nom, qiymat, rang, kichik izoh?, havola?]
function stek(qism, shakl) {
	const j = Math.max(1, yig(qism, q => q[1]));
	return `<div class="stek" role="img" aria-label="${qism.map(q => `${q[0]}: ${shakl(q[1])}`).join(', ')}">${qism.filter(q => q[1] > 0).map(q => `<i class="rang-${q[2]}" style="width:${q[1] / j * 100}%"></i>`).join('')}</div>
<div class="izohr">${qism.map(q => `<${q[4] ? `a href="${q[4]}"` : 'div'}><i class="rang-${q[2]}"></i><span>${q[0]}${q[3] ? `<small>${q[3]}</small>` : ''}</span><b>${shakl(q[1])}</b></${q[4] ? 'a' : 'div'}>`).join('')}</div>`;
}
// Ustunli grafik: [yorliq, qiymat1, qiymat2?]

function grafik(qator, nom1, nom2, asos) {
	asos = asos || 0;
	const eng = Math.max(1, ...qator.map(q => Math.max(q[1], q[2] || 0))) - asos, b = v => Math.max(0, (v - asos) / eng * 100);
	return `<div class="grafik" role="img" aria-label="${nom1}${nom2 ? ' va ' + nom2 : ''}">${qator.map((q, i) => `<div class="oy${i === qator.length - 1 ? ' hoz' : ''}"><div class="juft"><i style="height:${b(q[1])}%"></i>${nom2 ? `<i class="x" style="height:${b(q[2])}%"></i>` : ''}</div><span>${q[0]}</span></div>`).join('')}</div>
<div class="afs"><span><i></i>${nom1}</span>${nom2 ? `<span><i class="x"></i>${nom2}</span>` : ''}</div>`;
}

function diqqat() {
	const r = [], q = (i, s, b, m, h) => r.push({ i, s, b, m, h });
	if (ruxsat('sotuv')) { const u = umumiyHolat(); if (u.kechSoni) q('moliya', 'qi', `Muddati o'tgan to'lov: ${qisqaPul(u.kech)}`, `${u.kechSoni} ta mijoz${u.eslat ? `, ${u.eslat} tasiga eslatish kerak` : ''}`, '#/sotuv?kech'); }
	if (ruxsat('dala')) {
		for (const i of db.ishlar.filter(iKech)) q('dala', 'qi', `${ishNom(i)} ${iKech(i)} kun kechikdi`, `Reja: ${sana(i.sana)}, ${miq(i.ga, 'ga')}`, '#/dala/' + i.dala);
		const bug = db.ishlar.filter(i => i.holat === 'reja' && kunFarq(i.sana) === 0);
		if (bug.length) q('dala', 'ko', `Bugungi dala ishlari: ${bug.length} ta`, bug.map(ishNom).join('; '), '#/dala?reja');
		const ort = db.ishlar.filter(i => ortiqcha(i) && ich(i.sana) && kunFarq(i.sana) > -60);
		if (ort.length) q('ogoh', 'sa', `Me'yordan ortiq sarf: ${ort.length} ta ishda`, ort.map(ishNom).join('; '), '#/dala?bajarildi');
	}
	if (ruxsat('ferma')) {
		if (!sogBugun()) q('sut', 'sa', 'Bugungi sog\'im kiritilmagan', `Kecha: ${miq(sogJami(kunQosh(db.bugun, -1)), 'l')}`, '#/ferma?sogim');
		if (!yemBugun()) q('yem', 'sa', 'Bugungi yem tarqatilgani belgilanmagan', 'Belgilangach, ombor qoldig\'i ratsion bo\'yicha kamayadi', '#/ferma?yem');
		for (const g of ['g1', 'g2']) { const o = sogOzgar(g); if (o <= -5) q('sut', 'qi', `${topG(g).nom}: sog'im ${Math.round(-o)}% pasaydi`, 'So\'nggi 3 kun oldingi haftaga nisbatan', '#/ferma?sogim'); }
		const yq = sRoyxat('yaqin').length, qo = sRoyxat('qochir').length;
		if (yq) q('ferma', 'ko', `Buzoqlashi yaqin: ${yq} ta sigir`, '14 kun ichida kutilmoqda', '#/ferma?kopayish');
		if (qo) q('ferma', 'sa', `Qochirish kerak: ${qo} ta sigir`, 'Buzoqlaganiga 60 kundan oshgan', '#/ferma?kopayish');
		for (const v of db.vet.filter(v => v.holat === 'reja' && kunFarq(v.sana) <= 4)) { const d = vDori(v); q('vet', vKech(v) ? 'qi' : 'ko', `${v.nom}${vKech(v) ? ` ${vKech(v)} kun kechikdi` : ` — ${nisbiy(v.sana)}`}`, `${vGuruh(v)}, ${vBosh(v)} bosh${d && !d.yetar ? ` · dori yetmaydi: kerak ${miq(d.kerak, d.m.birlik)}, omborda ${miq(d.m.qoldiq, d.m.birlik)}` : ''}`, '#/ferma?vet'); }
	}
	const kam = ruxsat('ombor') ? kamlar() : ui.rol === 'ferma' ? kamlar('yem') : [];
	for (const m of kam) {
		const yl = yolda(m.id);
		q('ombor', mHolat(m) === 'yoq' ? 'qi' : 'sa', m.tur === 'yem' ? `${m.nom} ${yemKun(m)} kunga yetadi` : `${m.nom}: ${miq(m.qoldiq, m.birlik)} qoldi`,
			(m.tur === 'yem' ? `Omborda ${miq(m.qoldiq, m.birlik)}, kuniga ${miq(yemEhtiyoj(m.id), 'kg')} ketadi` : `Eng kam chegara: ${miq(m.min, m.birlik)}`) + (yl ? ` · yo'lda ${miq(yl, m.birlik)}` : ''), ruxsat('ombor') ? '#/ombor/' + m.id : '#/ferma?yem');
	}
	if (ruxsat('xodim')) { const kb = kbQol(); if (kb) q('mijoz', 'sa', `Mavsumiy ishchilarga to'lanmagan: ${qisqaPul(kb)}`, `${db.kunbay.filter(x => !x.tolandi).length} kunlik ish`, '#/xodim?kunbay'); }
	return r;
}

<div class="k"><div class="kb"><h2>Qaysi guruhga qancha ketadi</h2><div class="ost">Kunlik ratsion bo'yicha</div></div>${ys.map(m => `<h3 class="kich">${m.nom} — omborda ${miq(m.qoldiq, 't')}, ${yemKun(m)} kunga yetadi</h3>` + gor(db.guruhlar.filter(g => g.ratsion[m.id]).map(g => [g.nom, g.ratsion[m.id] * gBosh(g)]), v => miq(v, 'kg'))).join('')}</div></div>`;
	}
	const h = yHisob(id);
	if (yn.t === 'umumiy') return bosh + `<div class="kpi">${kpiPul('Umumiy xarajatlar', h.xar, 'Yo\'nalishlarga bo\'linmaydigan')}${kpi('Tushumga nisbatan', foiz(h.xar, jamiHisob().tushum), '', 'Jami tushumdan')}</div>
<div class="qator2"><div class="k"><div class="kb"><h2>Xarajat tarkibi</h2></div>${moddaGor(h.m)}</div><div class="k"><div class="kb"><h2>Davrlar bo'yicha</h2><div class="ost">Har ustun — 30 kun</div></div>${grafik([5, 4, 3, 2, 1, 0].map(i => [qisqaSana(kunQosh(db.bugun, -30 * i)), yHisob(id, davrI(i)).xar]), 'Umumiy xarajat')}</div></div>`;
	const birlik = { t: '1 tonna', l: '1 litr', kg: '1 kg tirik vazn', bosh: '1 bosh' }[yn.b];
	const sotuvlar = db.sotuvlar.filter(s => ich(s.sana) && s.qatorlar.some(q => mahs(q.m).yon === id)).sort((a, b) => a.sana < b.sana ? 1 : -1).slice(0, 6);
	const sotuvK = `<div class="k"><div class="kb"><h2>So'nggi sotuvlar</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Mijoz</th><th class="r">Miqdor</th><th class="r">Summa</th></tr></thead><tbody>${sotuvlar.map(s => `<tr class="bos" data-h="#/sotuv/${s.mijoz}"><td data-y="Sana">${sana(s.sana)}</td><td><b>${esc(topC(s.mijoz).nom)}</b>${s.izoh ? `<span class="kich">${esc(s.izoh)}</span>` : ''}</td><td class="r" data-y="Miqdor">${s.qatorlar.map(q => miq(q.soni, mahs(q.m).birlik)).join(', ')}</td><td class="r" data-y="Summa">${qisqaPul(sSumma(s))}</td></tr>`).join('')}</tbody></table></div></div>`;
	const kp = `<div class="kpi">${kpiPul('Tushum', h.tushum, `Sotildi: ${miq(h.miq, yn.b)}`)}${kpiPul(yn.t === 'ekin' ? 'Sotilgan hosil tannarxi' : 'Xarajat', h.xar, `Tushumning ${foiz(h.xar, h.tushum)}`)}${kpiPul('Foyda', h.foyda, `Rentabellik ${foiz(h.foyda, h.tushum)}`, h.foyda < 0 ? 'yom' : 'yax')}${h.miq ? kpi(`${birlik} tannarxi`, guruhla(h.xar / h.miq), 'so\'m', `O'rtacha sotuv narxi: ${pul(h.tushum / h.miq)}`, h.xar > h.tushum ? 'yom' : '') : ''}</div>`;
	if (yn.t === 'ekin') {
		const m = db.mollar.find(x => x.yon === id), dala = yig(ds, d => dXar(d).jami - dHosilXar(d));
		return bosh + kp + `<div class="k"><div class="kb"><h2>Hosil va zaxira</h2></div><div class="tr">
<div><span>Omborda</span><b><a href="#/ombor/${m.id}">${miq(m.qoldiq, 't')}</a></b></div><div><span>Ombordagi hosil qiymati</span><b>${qisqaPul(m.qoldiq * m.narx)}</b></div>
<div><span>Hozirgi tannarx, 1 tonna</span><b>${pul(m.narx)}</b></div><div><span>Sotuv narxi, 1 tonna</span><b>${pul(m.sot)}</b></div>
<div><span>Dalada (hosil kutilmoqda)</span><b>${qisqaPul(dala)}</b></div><div><span>Ekin maydoni</span><b>${miq(yig(ds, d => d.ga), 'ga')}</b></div></div></div>
<div class="k"><div class="kb"><h2>Dalalar — joriy mavsum</h2><div class="ost">Yig'ilmagan maydon xarajati foydaga kirmaydi: u hosil kelguncha dalada turgan mablag'.</div></div>${dalaJadval(ds)}</div>
<div class="qator2"><div class="k"><div class="kb"><h2>Joriy mavsum xarajati tarkibi</h2></div>${moddaGor(dalalarModda(ds))}</div>${sotuvK}</div>`;
	}
	const gs = db.guruhlar.filter(g => g.yon === id);
	const guruhK = `<div class="k"><div class="kb"><h2>Guruhlar va yem xarajati</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Guruh</th><th class="r">Bosh</th><th class="r">1 bosh, 1 kun yem</th><th class="r">Kuniga jami</th>${id === 'sut' ? '<th class="r">1 litr sutga yem</th>' : id === 'gosht' ? '<th class="r">1 kg o\'sishga yem</th>' : ''}</tr></thead><tbody>${gs.map(g => {
		const yn1 = gYemNarx(g), lt = g.tur === 'sogin' ? sogOrt(g.id, -7, -1) : 0, vz = g.tur === 'bordoqi' ? vaznHisob(g.id) : null;
		return `<tr><td><b>${g.nom}</b></td><td class="r" data-y="Bosh">${gBosh(g)}</td><td class="r" data-y="1 bosh, 1 kun yem">${pul(yn1)}</td><td class="r" data-y="Kuniga jami">${qisqaPul(yn1 * gBosh(g))}</td>${id === 'sut' ? `<td class="r" data-y="1 litr sutga yem">${lt ? pul(yn1 * gBosh(g) / lt) : '—'}</td>` : id === 'gosht' ? `<td class="r" data-y="1 kg o'sishga yem">${vz.kgNarx ? pul(vz.kgNarx) : '—'}</td>` : ''}</tr>`;
	}).join('')}</tbody></table></div></div>`;
	return bosh + kp + (id === 'nasl' ? eslat('ko', 'ferma', 'Bu yo\'nalish xarajati — kelajak podaga sarmoya: g\'unajinlar buzoqlagach sog\'in guruhga o\'tadi. Tushum faqat sotilgan naslli moldan keladi, shuning uchun yo\'nalish foydasi past yoki manfiy ko\'rinishi tabiiy.') : '') +
		`<div class="qator2"><div class="k"><div class="kb"><h2>Xarajat tarkibi</h2></div>${moddaGor(h.m)}</div><div class="k"><div class="kb"><h2>Davrlar bo'yicha</h2><div class="ost">Har ustun — 30 kun</div></div>${davrGrafik(s => yHisob(id, s))}</div></div>` + guruhK + sotuvK;
}

/* ---------- Dalalar va ishlar ---------- */
function dalaKarta(d) {
	const kech = dIshlar(d.id).filter(iKech), key = tartib(dIshlar(d.id).filter(i => i.holat === 'reja'), i => i.sana)[0];
	return `<a class="el${kech.length ? ' shosh' : ''}" href="#/dala/${d.id}" data-s="${Yozuv.qid(d.nom + ' ' + d.ekin)}"><div class="ust"><span class="nom">${d.nom}</span><span class="b ko">${d.ekin}</span><span class="b">${DBOS[d.bosqich]}</span>${kech.length ? `<span class="b qi">Kechikkan ish</span>` : ''}</div>
<div class="mat">${miq(d.ga, 'ga')} · ${d.nav}${d.hosil ? ` · hosil ${miq(d.hosil, 't')} (${miq(d.hosil / d.yigGa, 't/ga')})` : ` · reja ${miq(d.rejaH, 't/ga')}`}</div>
<div class="pas"><span>${key ? `Keyingi ish: ${iTur(key).toLowerCase()}, ${nisbiy(key.sana)}` : 'Rejada ish yo\'q'}</span>${pulKorar() ? `<span class="ong">${qisqaPul(dXar(d).jami)}</span>` : ''}</div></a>`;
}
function ishKarta(i) {

	return `<div class="el${k ? ' shosh' : ''}"><div class="ust"><span class="id">${i.id}</span><span class="nom">${iTur(i)}</span>${k ? `<span class="b qi">${k} kun kechikdi</span>` : kunFarq(i.sana) === 0 ? `<span class="b ko">Bugun</span>` : `<span class="b">${nisbiy(i.sana)}</span>`}</div>
<div class="mat"><a href="#/dala/${d.id}">${d.nom}</a> · ${d.ekin} · ${miq(i.ga, 'ga')}${iIzoh(i) ? ' · ' + esc(iIzoh(i)) : ''}</div>
${ker.length ? `<div class="pas">${ker.map(x => `<span${x.yetar ? '' : ' class="qizil"'}>${x.m.nom}: ${miq(x.kerak, x.m.birlik)}${x.yetar ? '' : ' — omborda yetmaydi'}</span>`).join('')}</div>` : ''}
<div class="pas"><span>Reja: ${sana(i.sana)} · mas'ul: ${esc(ism(i.masul))}</span></div>
${amalDala() ? `<div class="amal">${tugma('ishBajar', 'Bajarildi', { id: i.id }, 'a k')}</div>` : ''}</div>`;
}
function ishQator(i, dalaKor) {
	const my = meyor(i);
	return `<tr><td data-y="Sana">${sana(i.sana)}</td><td><b>${iTur(i)}</b><span class="kich">${dalaKor ? `<a href="#/dala/${i.dala}">${topD(i.dala).nom}</a> · ` : ''}${miq(i.ga, 'ga')}${i.mex ? ` · ${esc(ism(i.mex))}` : ''}</span>${iIzoh(i) ? `<span class="kich">${esc(iIzoh(i))}</span>` : ''}${i.hosil ? `<span class="kich yashil">Hosil: ${miq(i.hosil, 't')}</span>` : ''}</td>
<td${my.length ? ` data-y="Me'yor → amalda"` : ''}>${my.length ? qatorlar(my.map(x => `${x.m.nom}: ${miq(x.n)} → <b class="${x.farq > 10 ? 'qizil' : ''}">${miq(x.f, x.m.birlik)}</b>${x.farq > 10 ? ` <span class="b qi">+${Math.round(x.farq)}%</span>` : ''}`)) : ''}</td>${pulKorar() ? `<td class="r" data-y="Xarajat">${qisqaPul(ishX(i))}</td>` : ''}</tr>`;
}
const ishJadval = (a, dalaKor) => a.length ? `<div class="jw"><table class="j tel"><thead><tr><th>Sana</th><th>Ish</th><th>1 gektarga: me'yor → amalda</th>${pulKorar() ? '<th class="r">Xarajat</th>' : ''}</tr></thead><tbody>${a.map(i => ishQator(i, dalaKor)).join('')}</tbody></table></div>` : bosh_yoq('Bajarilgan ish yo\'q.');

function vDalalar(y) {
	const rj = rejaIshlar(), kech = rj.filter(iKech).length, baj = db.ishlar.filter(i => i.holat === 'bajarildi' && kunFarq(i.sana) > -60).sort((a, b) => a.sana < b.sana ? 1 : -1);
	const ort = baj.filter(ortiqcha).length;
	let ich;
	if (y.tab === 'reja') ich = rj.length ? `<div class="ry">${rj.map(ishKarta).join('')}</div>` : bosh_yoq('Rejada ish yo\'q.');
	else if (y.tab === 'bajarildi') ich = (ort ? eslat('', 'ogoh', `So'nggi 60 kunda ${ort} ta ishda sarf me'yordan 10 foizdan ko'p oshgan — qizil bilan belgilangan.`) : '') + `<div class="k">${ishJadval(baj, true)}</div>`;
	else ich = `<div class="kpi">${kpi('Jami maydon', miq(yig(db.dalalar, d => d.ga)), 'ga', `${db.dalalar.length} ta dala`)}${kpi('Bugungi ishlar', rj.filter(i => kunFarq(i.sana) === 0).length, 'ta', 'Rejada', '', '#/dala?reja')}${kpi('Kechikkan ishlar', kech, 'ta', kech ? 'Muddati o\'tgan' : 'Hammasi muddatida', kech ? 'yom' : 'yax', '#/dala?reja')}${kpi('Me\'yordan ortiq sarf', ort, 'ta ish', 'So\'nggi 60 kun', ort ? 'yom' : 'yax', '#/dala?bajarildi')}</div>` +
		izlash('Dala yoki ekin bo\'yicha qidirish') + `<div class="ry" data-ry>${db.dalalar.map(dalaKarta).join('')}</div>`;
	return boshq('Dalalar va ishlar', `${db.dalalar.length} ta dala · ${miq(yig(db.dalalar, d => d.ga), 'ga')}`, amalDala() ? tugma('ishQosh', ik('qosh') + 'Ish rejalashtirish', {}, 'a') : '') +
		yorliq('#/dala', y.tab, [['', 'Dalalar', db.dalalar.length], ['reja', 'Ishlar rejasi', rj.length, kech > 0], ['bajarildi', 'Bajarilgan ishlar', baj.length]]) + ich;
}

function vDala(id) {
	const d = topD(id);
	if (!d) return bosh_yoq('Dala topilmadi.');
	const x = dXar(d), hamma = dIshlar(id), rj = tartib(hamma.filter(i => i.holat === 'reja'), i => i.sana), baj = hamma.filter(i => i.holat === 'bajarildi').sort((a, b) => a.sana < b.sana ? 1 : -1);
	const m = topM(d.mahsulot);
	return orqa('#/dala', 'Dalalar') + boshq(`${d.nom} — ${d.ekin}`, `${miq(d.ga, 'ga')} · ${d.nav}`, amalDala() ? tugma('ishQosh', ik('qosh') + 'Ish rejalashtirish', { d: id }, 'a') : '') +
		`<div class="k">${qadam(DBOS_T, DBOS, d.bosqich)}<div class="tr" style="margin-top:14px">
<div><span>Maydon</span><b>${miq(d.ga, 'ga')}</b></div><div><span>Ekilgan</span><b>${kunFarq(d.ekilgan) < -400 ? 'Ko\'p yillik' : sana(d.ekilgan)}</b></div>
<div><span>Kutilayotgan hosil</span><b>${miq(d.rejaH * d.ga, 't')} (${miq(d.rejaH, 't/ga')})</b></div>
<div><span>Olingan hosil</span><b>${d.hosil ? `${miq(d.hosil, 't')} (${miq(d.hosil / d.yigGa, 't/ga')})` : '—'}</b></div>
${d.hosil && d.yigGa < d.ga ? `<div><span>Yig'ilgan maydon</span><b>${miq(d.yigGa, 'ga')} / ${miq(d.ga, 'ga')}</b></div>` : ''}
<div><span>Hosil qayerga</span><b>${m.tur === 'yem' ? 'Fermaga (yem)' : 'Omborga, sotuvga'}</b></div></div></div>` +
		(pulKorar() ? `<div class="qator2"><div class="k"><div class="kb"><h2>Mavsum xarajati</h2></div><div class="tr" style="margin-bottom:14px"><div><span>Jami</span><b>${qisqaPul(x.jami)}</b></div><div><span>1 gektarga</span><b>${qisqaPul(x.jami / d.ga)}</b></div><div><span>1 tonna tannarxi</span><b>${d.hosil ? pul(dTannarx(d)) : 'Hosildan keyin'}</b></div>${m.sot && d.hosil ? `<div><span>Sotuv narxi, 1 tonna</span><b>${pul(m.sot)}</b></div>` : ''}</div>${moddaGor(x.m)}</div>
<div class="k"><div class="kb"><h2>Rejadagi ishlar</h2></div>${rj.length ? `<div class="ry">${rj.map(ishKarta).join('')}</div>` : bosh_yoq('Rejada ish yo\'q.')}</div></div>` :
			`<div class="k"><div class="kb"><h2>Rejadagi ishlar</h2></div>${rj.length ? `<div class="ry">${rj.map(ishKarta).join('')}</div>` : bosh_yoq('Rejada ish yo\'q.')}</div>`) +
		`<div class="k"><div class="kb"><h2>Bajarilgan ishlar</h2><div class="ost">Har bir ishda 1 gektarga me'yor va amaldagi sarf solishtiriladi.</div></div>${ishJadval(baj, false)}</div>`;
}

/* ---------- Ferma ---------- */
const sigirQator = s => { const h = sHolat(s); return `<tr class="bos" data-h="#/ferma/${s.id}" data-s="${s.n} ${Yozuv.qid(s.zot)}"><td><b>${sNom(s)}</b><span class="kich">${s.zot}</span></td><td data-y="Guruh">${topG(s.g).nom}</td><td class="r" data-y="Laktatsiya">${s.lak}</td><td class="r" data-y="Kunlik sog'im">${s.sog ? miq(s.sog, 'l') : '—'}</td><td data-y="Holati"><span class="b ${h.r}">${h.n}</span></td></tr>`; };
function fPoda() {
	const ox = sogOxirgi(), sogin = yig(db.guruhlar.filter(g => g.tur === 'sogin'), gBosh), sg = yig(sogKun(ox), x => x.bosh);
	const har = g => { const k = yig(db.podaHar.filter(x => x.g === g.id && x.tur === 'kirim'), x => x.bosh), c = yig(db.podaHar.filter(x => x.g === g.id && x.tur === 'chiqim'), x => x.bosh); return { k, c, bosh: gBosh(g) - k + c }; };
	return `<div class="kpi">${kpi('Podada', jamiBosh(), 'bosh', `${db.guruhlar.length} ta guruh`)}${kpi('Sog\'in sigirlar', sogin, 'bosh', `Quruq davrda: ${gBosh(topG('g3'))}`)}${kpi(`${sogBugun() ? 'Bugungi' : 'Kechagi'} sog'im`, guruhla(sogJami(ox)), 'l', `1 sigirga ${miq(sogJami(ox) / Math.max(1, sg), 'l')}`, '', '#/ferma?sogim')}${kpi('Ko\'payish ishlari', kopaySoni(), 'ta', 'Buzoqlash, qochirish, tekshiruv', '', '#/ferma?kopayish')}</div>` +
		(sogBugun() ? '' : eslat('', 'sut', 'Bugungi sog\'im hali kiritilmagan.', amalFerma() ? tugma('sogim', 'Sog\'imni kiritish', {}, 'a k') : '')) +
		(yemBugun() ? '' : eslat('', 'yem', 'Bugungi yem tarqatilgani belgilanmagan.', amalFerma() ? tugma('yemTarqat', 'Yem tarqatildi', {}, 'a k') : '')) +
		`<div class="k"><div class="kb"><h2>Guruhlar va 30 kunlik harakat</h2></div><div class="jw"><table class="j tel"><thead><tr><th>Guruh</th><th class="r">30 kun oldin</th><th class="r">Qo'shildi</th><th class="r">Chiqdi</th><th class="r">Hozir</th></tr></thead><tbody>${db.guruhlar.map(g => { const h = har(g); return `<tr><td><b>${g.nom}</b><span class="kich">${YON[g.yon].n}</span></td><td class="r" data-y="30 kun oldin">${h.bosh}</td><td class="r" data-y="Qo'shildi">${h.k ? '+' + h.k : '—'}</td><td class="r" data-y="Chiqdi">${h.c ? '−' + h.c : '—'}</td><td class="r" data-y="Hozir"><b>${gBosh(g)}</b></td></tr>`; }).join('')}</tbody>
<tfoot><tr><td>Jami</td><td class="r" data-y="30 kun oldin">${yig(db.guruhlar, g => har(g).bosh)}</td><td class="r" data-y="Qo'shildi">+${yig(db.guruhlar, g => har(g).k)}</td><td class="r" data-y="Chiqdi">−${yig(db.guruhlar, g => har(g).c)}</td><td class="r" data-y="Hozir">${jamiBosh()}</td></tr></tfoot></table></div></div>
<div class="k"><div class="kb"><h2>Harakat jurnali</h2></div><div class="tarix">${db.podaHar.slice(0, 12).map(x => `<div><time>${sana(x.sana)}</time><span>${topG(x.g).nom}: ${x.sabab.toLowerCase()} — ${x.tur === 'kirim' ? '+' : '−'}${x.bosh} bosh</span></div>`).join('')}</div></div>`;
}
function fSigirlar() {
	return izlash('Sigir raqami yoki zoti bo\'yicha qidirish') + `<div class="k" data-ry><div class="jw"><table class="j tel"><thead><tr><th>Sigir</th><th>Guruh</th><th class="r">Laktatsiya</th><th class="r">Kunlik sog'im</th><th>Holati</th></tr></thead><tbody>${db.sigirlar.map(sigirQator).join('')}</tbody></table></div></div>`;
}
function fSogim() {
	const ox = sogOxirgi(), kunlar = [...Array(14)].map((_, i) => kunQosh(ox, i - 13)), j = sogJami(ox), sg = yig(sogKun(ox), x => x.bosh), taq = sutTaqiq();
	const buz = topG('g5').bosh * db.buzoqSut, sot = sutSotildi(ox), asos = Math.floor(Math.min(...kunlar.map(sogJami)) * 0.9 / 100) * 100;
	return (sogBugun() ? '' : eslat('', 'sut', 'Bugungi sog\'im hali kiritilmagan. Quyida kechagi ko\'rsatkichlar.', amalFerma() ? tugma('sogim', 'Sog\'imni kiritish', {}, 'a k') : '')) +
		`<div class="kpi">${kpi(`${sogBugun() ? 'Bugungi' : 'Kechagi'} sog'im`, guruhla(j), 'l', sana(ox))}${kpi('1 sigirga', miq(j / Math.max(1, sg)), 'l', `Sog'ildi: ${sg} bosh`)}${kpi('7 kunlik o\'rtacha', guruhla(yig(kunlar.slice(7), sogJami) / 7), 'l', 'Kuniga')}${kpi('Zavodga topshirildi', guruhla(sot), 'l', pulKorar() ? qisqaPul(sot * db.sutNarx) : `Sog'imning ${foiz(sot, j)}`)}</div>
<div class="qator2"><div class="k"><div class="kb"><h2>Kunlik sog'im, 14 kun</h2><div class="ost">Ustun ostida — oyning kuni. Farq ko'rinishi uchun ustunlar ${miq(asos, 'l')} dan boshlanadi.</div></div>${grafik(kunlar.map(k => [k.slice(8), sogJami(k)]), 'Kunlik sog\'im', '', asos)}</div>

	},

	/* Xodimlar */
	tabel(d) { if (!pulKorar()) return; const w = topW(d.w); w.bugun = d.h; yangila(`${w.ism}: ${d.h === 'keldi' ? 'ishda' : 'kelmadi'} deb belgilandi.`); },
	avans(d) {
		if (!pulKorar()) return;
		const w = topW(d.w);
		oyna(`Avans: ${w.ism}`, yashirin('w', w.id) + eslat('ko', 'moliya', `Hisoblandi <b>${pul(wHisob(w))}</b> · avans berilgan ${pul(w.avans)} · to'lanadi ${pul(wQol(w))}`) + may('Summa (so\'m)', raqam('summa', '', 'required inputmode="numeric"')), { forma: 'avans', tugma: 'Avansni saqlash' });
	},
	kunbayQosh() {
		if (!pulKorar()) return;
		oyna('Mavsumiy ishchilar: kunlik ish', `<div class="may2">${may('Dala', tanla('dala', db.dalalar.map(x => [x.id, `${x.nom} — ${x.ekin}`]), 'd8'))}${may('Ish', matn('ish', 'required value="Kartoshka terimi"'))}</div><div class="may2">${may('Necha kishi ishladi', raqam('kishi', '', 'required inputmode="numeric"'))}${may('Kunlik haq (so\'m)', raqam('stavka', guruhla(150000), 'required inputmode="numeric"'))}</div><p class="yord">Summa shu dalaning mavsum xarajatiga qo'shiladi va to'lanmaguncha «to'lanmagan» bo'lib turadi.</p>`, { forma: 'kunbay', tugma: 'Saqlash' });
	},
	kunbayTola(d) { if (!pulKorar()) return; const x = db.kunbay.find(k => k.id === d.id); x.tolandi = true; yangila(`${sana(x.sana)} kungi ish to'landi: ${pul(kbSumma(x))}.`); },
	xarajat() {
		if (!pulKorar()) return;
		oyna('Xarajat', `<div class="may2">${may('Yo\'nalish', tanla('yon', ['sut', 'gosht', 'nasl', 'umumiy'].map(y => [y, YON[y].n]), 'umumiy'))}${may('Modda', tanla('modda', XMODDA.filter(x => x !== 'Yem').map(x => [x, x]), 'Boshqa'))}</div>` + may('Summa (so\'m)', raqam('summa', '', 'required inputmode="numeric"')) + may('Izoh', matn('izoh')) + `<p class="yord">Dala xarajati dala ishlari orqali, yem xarajati kunlik ratsion orqali o'zi yoziladi.</p>`, { forma: 'xarajat', tugma: 'Xarajatni saqlash' });
	},
	csv(d) {
		if (!pulKorar()) return;
		const f = ui.til === 'kir' ? Yozuv.kir : Yozuv.lot;
		const q = csvQatorlar(d.h).map(r => r.map(c => { const s = typeof c === 'number' ? String(Math.round(c * 10) / 10).replace('.', ',') : f(String(c)); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
		try {
			const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + q], { type: 'text/csv;charset=utf-8' })); a.download = 'nurli-' + d.h + '.csv';
			document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
			xabar('Jadval Excel uchun yuklab olindi.');
		} catch (e) { xabar('Bu brauzerda yuklab olish ishlamadi.'); }
	},
};

/* ---------- Forma saqlash ---------- */
const FORMA = {
	pin(d) {
		const x = topX(KIMLAR[ui.tanlov]);
		if (d.pin !== x.pin) { ui.pinXato = true; chiz(); return; }
		ui.rol = ui.tanlov; ui.kim = x.id; ui.tanlov = null; ui.pinXato = false; ui.oxirgiYol = ''; saqla(); borish(boshSahifa());
	},
	qayta() { db = Malumot.urug(new Date()); saqla(); yop(); if (ui.rol) borish(boshSahifa()); else chiz(); xabar('Namuna dastlabki holatiga qaytdi.'); },
	ish(d) {
		const dl = topD(d.dala), ga = Math.min(dl.ga, kasr(d.ga) || dl.ga), n = kasr(d.n);
		const i = { id: yangiId('I'), dala: dl.id, tur: d.tur, sana: d.sana || db.bugun, holat: 'reja', ga, masul: ui.rol === 'agronom' ? ui.kim : 'a1', mex: null, norma: d.m && n > 0 ? [{ m: d.m, n }] : [], haqN: 30000, xizN: 0, sarf: [], haq: 0, xizmat: 0, hosil: 0, yigim: d.tur === 'O\'rim' || d.tur === 'Kovlash', izoh: (d.izoh || '').trim() };
		db.ishlar.push(i); saqla(); yop(); xabar(`${ishNom(i)} rejaga qo'shildi: ${sana(i.sana)}.`); borish('#/dala/' + dl.id);
	},
	bajar(d) {
		const i = topI(d.id), dl = topD(i.dala), ga = Math.min(dl.ga, kasr(d.ga)), hosil = kasr(d.hosil);
		if (!i || i.holat !== 'reja') return;
		if (ga <= 0) { xabar('Bajarilgan maydonni kiriting.'); return; }
		if (i.yigim && hosil <= 0) { xabar('Yig\'ilgan hosilni kiriting.'); return; }
		const sarf = i.norma.map((x, n) => ({ m: x.m, soni: kasr(d['s' + n]), narx: topM(x.m).narx }));
		const yetmas = sarf.filter(s => topM(s.m).qoldiq + 1e-9 < s.soni);
		if (yetmas.length) { xabar(`Omborda yetarli emas: ${yetmas.map(s => `${topM(s.m).nom} — omborda ${miq(topM(s.m).qoldiq, topM(s.m).birlik)}`).join('; ')}.`); return; }
		for (const s of sarf) if (s.soni > 0) harakat(s.m, -s.soni, `Dala ishi: ${dl.nom}, ${i.tur.toLowerCase()}`);
		Object.assign(i, { holat: 'bajarildi', sana: db.bugun, ga, sarf, mex: d.mex || null, haq: Math.round(i.haqN * ga), xizmat: Math.round(i.xizN * ga), hosil: i.yigim ? hosil : 0 });
		let qosh = '';
		if (i.yigim) {
			const m = topM(dl.mahsulot);
			if (dl.yigGa >= dl.ga) { dl.yigGa = 0; dl.hosil = 0; } // yangi mavsum hosili
			dl.hosil = Math.round((dl.hosil + hosil) * 10) / 10; dl.yigGa = Math.min(dl.ga, Math.round((dl.yigGa + ga) * 10) / 10); dl.bosqich = dl.yigGa >= dl.ga ? 'yigildi' : 'yigim';
			harakat(m.id, hosil, `Hosil: ${dl.nom}, ${i.tur.toLowerCase()}`); tannarxYangila(m.id);
			qosh = ` Hosil ${miq(hosil, 't')} omborga kirim qilindi${pulKorar() ? `; 1 tonna tannarxi ${pul(m.narx)}` : ''}.`;
		} else if (i.tur === 'Ekish') { dl.bosqich = 'ekildi'; dl.ekilgan = db.bugun; } else if (i.tur === 'Shudgor' && dl.bosqich === 'yigildi') dl.bosqich = 'shudgor';
		yangila(`${ishNom(i)} bajarildi.${sarf.filter(s => s.soni > 0).length ? ` Ombordan chiqdi: ${sarf.filter(s => s.soni > 0).map(s => `${topM(s.m).nom.toLowerCase()} ${miq(s.soni, topM(s.m).birlik)}`).join(', ')}.` : ''}${ortiqcha(i) ? ' Sarf me\'yordan 10 foizdan ko\'p oshdi — rahbarga ko\'rinadi.' : ''}${qosh}`);
	},
	sogim(d) {
		if (sogBugun()) return;
		const taq = sutTaqiq();
		for (const g of ['g1', 'g2']) { const e = son(d['e_' + g]), k = son(d['k_' + g]); if (e + k < 1) { xabar('Har ikki guruh uchun sog\'imni kiriting.'); return; } }
		for (const g of ['g1', 'g2']) db.sogim.push({ sana: db.bugun, g, bosh: gBosh(topG(g)) - taq.filter(t => topS(t.s).g === g).length, e: son(d['e_' + g]), k: son(d['k_' + g]) });
		const jami = sogJami(db.bugun), sot = sutSotildi(db.bugun), c = topC('c1');
		if (sot > 0) db.sotuvlar.push({ id: yangiId('YX'), mijoz: c.id, sana: db.bugun, muddat: kunQosh(db.bugun, c.muddat), qatorlar: [{ m: 'sut', soni: sot, narx: db.sutNarx, tn: 0 }], izoh: 'Kunlik topshirish' });
		yangila(`Sog'im saqlandi: ${miq(jami, 'l')}. Zavodga topshirildi: ${miq(sot, 'l')}${pulKorar() ? ` (${qisqaPul(sot * db.sutNarx)})` : ''}.`);
	},
	buzoq(d) {
		const s = topS(d.id), g5 = topG('g5');
		s.g = 'g1'; s.lak++; s.buz = db.bugun; s.qoch = null; s.bogoz = false; s.kutil = null; s.sog = 18;
		g5.bosh++; db.podaHar.unshift({ sana: db.bugun, g: 'g5', tur: 'kirim', sabab: 'Tug\'ildi', bosh: 1 });
		voqea(s.id, `Buzoqladi: ${String(d.jins).toLowerCase()} buzoq, ${miq(kasr(d.vazn), 'kg')}`);
		saqla(); yop(); xabar(`Sigir ${sNom(s)} buzoqladi. ${s.lak}-laktatsiya boshlandi, buzoqlar guruhida ${g5.bosh} bosh.`); borish('#/ferma/' + s.id);
	},
	davo(d) {
		const s = db.sigirlar.find(x => x.n === son(d.n));
		if (!s) { xabar('Bunday raqamli sigir topilmadi.'); return; }
		const kun = Math.max(1, son(d.kun)), taq = son(d.taqiq);
		db.davo.unshift({ id: yangiId('T'), s: s.id, sana: db.bugun, tashxis: d.tashxis.trim(), dori: d.dori.trim(), tugaydi: kunQosh(db.bugun, kun), sutTaqiq: kunQosh(db.bugun, kun + taq), holat: 'davolanmoqda' });
		voqea(s.id, `${d.tashxis.trim()}: davolash boshlandi`);
		yangila(`Sigir ${sNom(s)}: davolash yozildi. Suti ${sana(kunQosh(db.bugun, kun + taq))} gacha topshirilmaydi.`);
	},
	vazn(d) {
		const ort = kasr(d.ort);
		if (ort <= 0) { xabar('O\'rtacha vaznni kiriting.'); return; }
		db.vazn = db.vazn.filter(x => !(x.g === d.g && x.sana === db.bugun)); db.vazn.push({ sana: db.bugun, g: d.g, ort });
		const v = vaznHisob(d.g);
		yangila(`Tortish saqlandi: o'rtacha ${miq(ort, 'kg')}, kunlik o'sish ${guruhla(v.osish * 1000)} g.`);
	},
	kirim(d) {
		const m = topM(d.m), n = kasr(d.soni);
		if (n <= 0) { xabar('Miqdorni kiriting.'); return; }
		harakat(m.id, n, 'Kirim' + (d.izoh && d.izoh.trim() ? ': ' + d.izoh.trim() : ''));
		yangila(`${m.nom}: +${miq(n, m.birlik)}. Omborda ${miq(m.qoldiq, m.birlik)}.`);
	},
	ybuy(d) {
		const n = kasr(d.soni), kun = Math.max(1, son(d.kun) || 3), m = topM(d.m);
		if (n <= 0) { xabar('Miqdorni kiriting.'); return; }
		const k = { id: yangiId('K'), kim: d.kim.trim(), kutiladi: kunQosh(db.bugun, kun), holat: 'yolda', qatorlar: [{ m: m.id, soni: n, narx: m.narx }] };
		db.kirimlar.push(k); saqla(); yop(); xabar(`Buyurtma saqlandi: ${k.id}. «Kutilayotgan kirim» ro'yxatida ko'rinadi.`); borish('#/ombor?yolda');
	},
	sotuv(d) {
		const c = topC(d.mijoz), m = mahs(d.m), n = kasr(d.soni), nx = son(d.narx), bosh = son(d.bosh);
		if (!c || !m || !SOTILADI.includes(d.m)) return;
		if (n <= 0 || nx < 1) { xabar('Miqdor va narxni kiriting.'); return; }
		const ombordan = m.qoldiq != null;
		if (ombordan && m.qoldiq + 1e-9 < n) { xabar(`Omborda yetarli emas: ${m.nom} — ${miq(m.qoldiq, m.birlik)}.`); return; }
		const s = { id: yangiId('YX'), mijoz: c.id, sana: db.bugun, muddat: kunQosh(db.bugun, c.muddat), qatorlar: [{ m: d.m, soni: n, narx: nx, tn: ombordan ? m.narx : 0 }], izoh: '' };
		if (ombordan) harakat(d.m, -n, `Sotildi: ${c.nom}`);
		const kamay = d.m === 'mol_n' ? Math.round(n) : d.m === 'mol_g' ? bosh : 0;
		if (kamay > 0) {
			const g = d.m === 'mol_n' ? topG('g4') : topG('g6').bosh >= kamay ? topG('g6') : topG('g7'), b = Math.min(g.bosh, kamay);
			g.bosh -= b; db.podaHar.unshift({ sana: db.bugun, g: g.id, tur: 'chiqim', sabab: 'Sotildi', bosh: b }); s.izoh = `${b} bosh`;
		}
		db.sotuvlar.push(s); saqla(); yop();
		xabar(`Sotuv saqlandi: ${s.id}, ${qisqaPul(sSumma(s))}. ${c.muddat ? `To'lov muddati — ${sana(s.muddat)}` : 'Oldindan to\'lov hisobidan yopiladi'}.${ombordan ? ` Foyda: ${qisqaPul(n * (nx - m.narx))}.` : ''}`); borish('#/sotuv/' + c.id);
	},
	tolov(d) {
		const c = topC(d.c), s = son(d.summa);
		if (s < 1) { xabar('Summani kiriting.'); return; }
		db.tolovlar.push({ id: 't' + (++db.sanoq.t), mijoz: c.id, sana: db.bugun, summa: s, usul: d.usul });
		const h = mHisob(c.id);
		yangila(`${pul(s)} qabul qilindi. ${h.qol >= 1 ? `Qoldi: ${pul(h.qol)}${h.kech >= 1 ? `, shundan muddati o'tgani ${pul(h.kech)}` : ''}.` : h.avans >= 1 ? `To'lanmagan summa yo'q, oldindan to'lov: ${pul(h.avans)}.` : 'To\'lanmagan summa qolmadi.'}`);
	},
	eslatma(d) {
		const c = topC(d.c), mt = (d.matn || '').trim();
		if (!mt) { xabar('Mijoz javobini yozing.'); return; }
		db.eslatmalar.push({ mijoz: c.id, sana: db.bugun, kim: ui.kim, usul: d.usul, matn: mt, vada: d.vada || null });
		yangila(`Eslatma saqlandi.${d.vada ? ` Va'da qilingan sana: ${sana(d.vada)}.` : ''}`);
	},
	avans(d) {
		const w = topW(d.w), s = son(d.summa);
		if (s < 1) { xabar('Summani kiriting.'); return; }
		w.avans += s; yangila(`${w.ism}: ${pul(s)} avans berildi. To'lanadi: ${pul(wQol(w))}.`);
	},
	kunbay(d) {
		const kishi = son(d.kishi), stavka = son(d.stavka), dl = topD(d.dala);
		if (kishi < 1 || stavka < 1) { xabar('Kishi soni va kunlik haqni kiriting.'); return; }
		const x = { id: yangiId('M'), sana: db.bugun, dala: dl.id, ish: (d.ish || '').trim() || 'Mavsumiy ish', kishi, stavka, tolandi: false };
		db.kunbay.push(x); tannarxYangila(dl.mahsulot);
		yangila(`Saqlandi: ${kishi} kishi × ${pul(stavka)} = ${pul(kbSumma(x))}. ${dl.nom} xarajatiga qo'shildi.`);
	},
	xarajat(d) {
		const s = son(d.summa); if (s < 1) { xabar('Summani kiriting.'); return; }
		db.xarajatlar.push({ id: 'h' + (++db.sanoq.h), sana: db.bugun, yon: d.yon, modda: d.modda, summa: s, izoh: (d.izoh || '').trim(), qolda: true });
		yangila(`Xarajat saqlandi: ${pul(s)} — ${YON[d.yon].n.toLowerCase()}.`);
	},
};

/* ---------- Chizish ---------- */
function chiz() {
	const root = $('#ilova');
	document.documentElement.lang = ui.til === 'kir' ? 'uz-Cyrl' : 'uz';
	const nomla = s => { document.title = BREND + ' — ' + (ui.til === 'kir' ? Yozuv.kir : Yozuv.lot)(s); };
	if (!ui.rol) { root.innerHTML = kirishHTML(); Yozuv.dom(root, ui.til); nomla('boshqaruv tizimi (namuna)'); const p = $('#pin'); if (p) p.focus(); return; }
	const y = yol();
	if (!RUXSAT[ui.rol].includes(y.bol)) { if (location.hash !== boshSahifa()) { location.replace(boshSahifa()); return; } }
	let ich = '';
	switch (y.bol) {
		case 'panel': ich = vPanel(); break;
		case 'ishim': ich = vIshim(); break;
		case 'yonalish': ich = y.arg ? vYonalish(y.arg) : vYonalishlar(); break;
		case 'dala': ich = y.arg ? vDala(y.arg) : vDalalar(y); break;
		case 'ferma': ich = vFerma(y); break;
		case 'ombor': ich = vOmbor(y); break;
		case 'sotuv': ich = vSotuv(y); break;
		case 'xodim': ich = vXodim(y); break;
		case 'hisobot': ich = vHisobot(); break;
		default: ich = bosh_yoq('Sahifa topilmadi.');
	}
	root.innerHTML = qobiq(ich, y); Yozuv.dom(root, ui.til);
	nomla((BOLIM[y.bol] ? BOLIM[y.bol].n : 'namuna') + ' (namuna)');
	if (location.hash !== ui.oxirgiYol) { window.scrollTo(0, 0); ui.oxirgiYol = location.hash; }
	// Telefonda tanlangan yorliq ko'rinadigan joyga suriladi
	const yr = root.querySelector('.yor'), fy = yr && yr.querySelector('[aria-current=true]');
	if (fy && fy.getBoundingClientRect) yr.scrollLeft += fy.getBoundingClientRect().left - yr.getBoundingClientRect().left - 12;
}

/* ---------- Hodisalar ---------- */
document.addEventListener('click', e => {
	const t = e.target.closest('[data-a]');
	if (t) { if (t.disabled) return; const f = AMAL[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset, t); } return; }
	if (e.target.classList && e.target.classList.contains('parda')) { yop(); return; }
	const tr = e.target.closest('tr[data-h]');
	if (tr && !e.target.closest('a,button,input,select')) location.hash = tr.dataset.h;
});
document.addEventListener('submit', e => {
	const f = e.target.closest('form');
	if (!f) return; e.preventDefault();
	if (!f.dataset.f) return;
	const d = {}; new FormData(f).forEach((v, k) => { d[k] = v; });
	const fn = FORMA[f.dataset.f]; if (fn) fn(d, f);
});
document.addEventListener('change', e => {
	const t = e.target; // sotuv oynasida mahsulot almashsa, narx o'sha mahsulotnikiga o'zgaradi
	if (t.name === 'm' && t.form && t.form.dataset.f === 'sotuv' && t.form.elements.narx) t.form.elements.narx.value = guruhla(mahs(t.value).sot);
});
document.addEventListener('input', e => {
	const t = e.target;
	if (t.id === 'pin' && /^\d{4}$/.test(t.value) && t.form) { if (t.form.requestSubmit) t.form.requestSubmit(); return; }
	if (!t.matches || !t.matches('[data-q]')) return;
	const q = Yozuv.qid(t.value.trim()), ry = document.querySelector('[data-ry]'); if (!ry) return;
	let bor = 0;
	ry.querySelectorAll('[data-s]').forEach(el => { const k = !q || el.dataset.s.includes(q); el.hidden = !k; if (k) bor++; });
	let yoq = ry.querySelector('[data-yoq]');
	if (!bor && !yoq) { yoq = document.createElement('div'); yoq.className = 'bosh-yoq'; yoq.dataset.yoq = '1'; yoq.textContent = 'Hech narsa topilmadi.'; ry.appendChild(yoq); Yozuv.dom(yoq, ui.til); }
	if (yoq) yoq.hidden = bor > 0;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#oyna').firstChild) yop(); });
window.addEventListener('hashchange', () => { yop(); chiz(); });
yukla();
chiz();

})();
</script>
