<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sahifa topilmadi</title>
    <script>
      // GitHub Pages faqat sayt ildizidagi 404.html ni ishlatadi. Bir sahifali ilovalarning ichki manzili (masalan
      // /demo/zinapoya/home) yangilansa — ilovaning o'ziga «?p=/home» bilan qaytaramiz, ilova asl manzilni tiklaydi.
      (function () {
        var apps = ['/demo/zinapoya/'];
        var path = location.pathname;
        for (var i = 0; i < apps.length; i++) {
          var a = apps[i];
          if (path.indexOf(a) === 0 && path !== a) {
            location.replace(a + '?p=' + encodeURIComponent(path.slice(a.length - 1) + location.search) + location.hash);
            return;
          }
        }
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f3f5f4; color: #17324d; }
      main { text-align: center; padding: 24px; }
      a { color: #2b3f8c; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #e8ecf2; } a { color: #8fb0ff; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Sahifa topilmadi</h1>
      <p><a href="/demo/ilovalar/">Barcha namunalar</a></p>
    </main>
  </body>
</html>
