<style>@font-face{font-family:"Geologica";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}

<style>:root{--acc:#2A6F97;--acc2:#225A7B;--accbg:#E4EEF5;--ink:#1F2328;--paper:#F4F3EF;--card:#FFFFFF;--soft:#EDECE7;--ln:#DCDAD3;--tx:var(--ink);--mut:#636B74;--mut2:#858C94;
--st-calc:#6A7380;--st-ok:#1F7A74;--st-queue:#5D6B8A;--st-print:var(--acc);--st-post:#7A4E6B;--st-done:#237A3C;--st-out:#3C4650;--er:#B3261E;--wr:#A35E07;
--m-black:#1A1A1A;--m-white:#F2F2F2;--m-red:#B9382B;--m-blue:#2B4F8E;--m-orange:#D9731E;--m-gray:#8A8F94;--m-clear:#CFE3EA;--m-natural:#E8DCC3;
--sans:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
--r:4px;--r2:6px;--r3:8px;--shadow:0 4px 12px rgba(31,35,40,.12);--side:216px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--tx);font-size:14px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
b,strong{font-weight:500}h1,h2,h3,h4{font-weight:500}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.er{color:var(--er)}.wr{color:var(--wr)}.ok{color:var(--st-done)}.mu{color:var(--mut)}
.sp{flex:1}
.namuna{background:var(--soft);color:var(--mut);border-bottom:1px solid var(--ln);font-size:12px;text-align:center;padding:4px 12px;line-height:1.4}
.namuna b{color:var(--wr);font-weight:500}
.offbar{background:color-mix(in srgb,var(--wr) 12%,white);color:var(--wr);border:1px solid color-mix(in srgb,var(--wr) 30%,white);border-radius:var(--r2);padding:6px 12px;font-size:13px;margin-bottom:12px}
/* kirish */
body.kirish .lay,body.kirish .mnav{display:none}
.login{max-width:1040px;margin:0 auto;padding:40px 24px 60px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - 28px)}
.lbrand h1{font-size:28px;line-height:1.1;margin:14px 0 8px;font-weight:500}
.lbrand p{color:var(--mut);font-size:15px;margin:0 0 18px;max-width:420px}
.lbrand .lg{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.lfeat{display:grid;gap:10px;margin-top:22px;font-size:14px}
.lfeat div{display:flex;gap:10px;align-items:flex-start;color:var(--tx)}.lfeat svg.i{color:var(--acc);margin-top:3px}
.lfeat small{display:block;color:var(--mut);font-size:13px}
.lbox h2{font-size:18px;margin:0 0 10px}
.roles,.pin-box{border:1px solid var(--ln);border-radius:var(--r3);background:var(--card);overflow:hidden}
.role{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;transition:background-color .12s}
.role:first-child{border-top:0}.role:hover{background:var(--soft)}
.role .ti{width:36px;height:36px;border-radius:var(--r2);background:var(--soft);display:grid;place-items:center;color:var(--acc);flex:none}
.role .x{flex:1;min-width:0}.role .n{display:block;font-weight:500}.role .d{display:block;color:var(--mut);font-size:13px}
.role .pin-t{flex:none;font-family:var(--mono);font-size:12px;color:var(--mut2)}
.pin-box{padding:20px}
.pin-box .back{border:0;background:none;color:var(--mut);padding:0;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
.pin-box .nm{font-size:16px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.pin{height:52px;font-size:24px;letter-spacing:0;text-align:center;font-family:var(--mono);width:100%;border:1px solid var(--ln);border-radius:var(--r2);background:var(--card)}
.pin:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:48px;border:1px solid var(--ln);border-radius:var(--r2);background:var(--card);font-family:var(--mono);font-size:18px;transition:background-color .12s}
.pad button:hover{background:var(--soft)}
.pin-box .err{color:var(--er);font-size:13px;min-height:20px;margin-top:8px}
.pin-box .hint{color:var(--mut2);font-size:12px;margin:8px 0 0}
/* qobiq */
.lay{display:flex;min-height:calc(100vh - 28px)}
.side{width:var(--side);flex:none;background:var(--paper);border-right:1px solid var(--ln);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 28px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--mut);font-size:12px}
.logo{width:36px;height:36px;border-radius:var(--r2);background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:13px;flex:none}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--mut);padding:9px 12px;border-radius:var(--r2);text-align:left;font-weight:400;transition:background-color .12s,color .12s}
.nav button:hover{background:var(--soft);color:var(--tx)}
.nav button.on{background:var(--card);color:var(--tx);font-weight:500;box-shadow:inset 0 0 0 1px var(--ln)}
.nav .ic{width:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}
.nav button.on .ic{color:var(--acc)}
.nav .bdg,.mnav .bdg,.more .bdg{margin-left:auto;background:var(--ink);color:var(--paper);border-radius:3px;font-size:12px;padding:0 5px;font-weight:500;line-height:18px;font-family:var(--mono)}
.sidefoot{padding:12px 16px 14px;font-size:12px;color:var(--mut);border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:6px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.who .ic{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--ln);display:grid;place-items:center;color:var(--acc);flex:none}
.who b{display:block;font-size:13px;color:var(--tx)}.who small{font-size:12px}
.sidefoot button{background:none;border:1px solid var(--ln);color:var(--mut);border-radius:var(--r2);padding:6px 9px;font-size:12px;text-align:left;transition:background-color .12s}
.sidefoot button:hover{background:var(--card)}
.sidefoot .ver{font-family:var(--mono);color:var(--mut);font-size:12px;margin-top:4px}
.main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1240px}
.mhead{display:none;align-items:center;gap:10px;margin:-2px 0 12px}
.mhead .mh{flex:1;min-width:0}.mhead b{font-size:15px;display:block}.mhead small{color:var(--mut);font-size:12px;display:block}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0 0 2px;line-height:1.3}
.top .sub{color:var(--mut);font-size:15px;max-width:780px;line-height:1.45}
.top .sub b{color:var(--tx)}.top .sub b.er{color:var(--er)}.top .sub b.wr{color:var(--wr)}
.top .dt{color:var(--mut);font-size:13px;margin-left:8px;font-weight:400}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:var(--r2);padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .12s,border-color .12s;color:var(--tx);line-height:1.3}
.btn:hover{border-color:var(--mut2);background:var(--soft)}
.btn.p{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.p:hover{background:#3C4650;border-color:#3C4650}
.btn.a{background:var(--acc);border-color:var(--acc);color:#FFFFFF}.btn.a:hover{background:var(--acc2)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.d{color:var(--er)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1.4fr 1fr}.k22{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r3);padding:16px}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
.card h3 small{font-weight:400;color:var(--mut);font-size:13px}
.card h3>svg.i{color:var(--mut)}
.card.p0{padding:0}.card.p0 h3{padding:14px 16px 0}
.pnl{display:flex;flex-direction:column;gap:12px}
/* KPI — bitta ramka, ajratgichlar */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--ln);cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;transition:background-color .12s}
.kpi:first-child{border-left:0}.kpi:hover{background:var(--soft)}
.kpi .l{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--mut);margin-left:4px}
.kpi .v.er{color:var(--er)}.kpi .v.wr{color:var(--wr)}
.kpi .d{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4}
/* holat yorliqlari */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r);padding:0 8px;height:22px;font-size:12px;font-weight:500;white-space:nowrap;--st:var(--st-calc);color:var(--st);background:color-mix(in srgb,var(--st) 12%,white)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st);flex:none}
.pill.nd::before{display:none}
.pill.raschet{--st:var(--st-calc)}.pill.podtv{--st:var(--st-ok)}.pill.ochered{--st:var(--st-queue)}.pill.pechat{--st:var(--st-print)}.pill.post{--st:var(--st-post)}.pill.gotov{--st:var(--st-done)}.pill.vydan{--st:var(--st-out)}
.pill.er{--st:var(--er)}.pill.wr{--st:var(--wr)}.pill.mu{--st:var(--mut)}.pill.ac{--st:var(--acc)}.pill.ok{--st:var(--st-done)}
.pill svg.i{width:13px;height:13px}
.mdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(31,35,40,.25);vertical-align:-1px}
/* ro‘yxat */
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer;transition:background-color .12s}
.list .it:last-child{border:0}.list .it:hover{background:var(--soft)}
.list .it .m{flex:1;min-width:0}
.list .it .m b{display:block;font-size:14px;font-weight:500}
.list .it .m small{color:var(--mut);font-size:13px;display:block}
.list .it>svg.i{color:var(--mut2);flex:none}
.list .it .code{font-family:var(--mono);font-size:13px;color:var(--mut);flex:none;width:72px}
.att .it{align-items:flex-start}
.att .it .btn{flex:none;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:26px 8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg.i{width:40px;height:40px;color:var(--mut2);stroke-width:1.2}
/* bosqich zanjiri 7 nuqta */
.chain{display:flex;align-items:center;gap:0;margin:4px 0}
.chain i{width:10px;height:10px;border-radius:50%;border:1px solid var(--mut2);background:var(--card);flex:none;display:grid;place-items:center}
.chain i.d{background:var(--ink);border-color:var(--ink)}
.chain i.c{background:var(--st,var(--acc));border-color:var(--st,var(--acc));width:12px;height:12px}
.chain i.c.late{background:var(--er);border-color:var(--er)}
.chain s{flex:1;height:1px;background:var(--ln);min-width:6px;text-decoration:none}
.chain s.d{background:var(--ink)}
.chain small{flex:none;font-size:12px;color:var(--mut);margin-left:8px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.st{font-size:12px;color:var(--mut);padding:6px 6px;border-radius:var(--r);background:var(--soft);border:1px solid var(--ln);min-width:0;display:flex;flex-direction:column;gap:1px}
.st b{font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.d{background:var(--card)}.st.d b{color:var(--mut)}
.st.c{border-color:var(--st,var(--acc));background:color-mix(in srgb,var(--st,var(--acc)) 10%,white)}.st.c b{color:var(--st,var(--acc))}
.st.c.late{--st:var(--er)}
/* jadval */
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--soft);position:sticky;top:0;z-index:1}
.t td{padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{border-top:1px solid var(--ink);font-weight:500;background:var(--card)}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:var(--soft)}
.t tr.grp td{background:var(--paper);color:var(--mut);font-size:12px;padding:5px 10px;font-weight:500;border-top:1px solid var(--ln)}
.t .n{text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.t th.n{font-family:var(--sans)}
.sm{display:block;color:var(--mut);font-size:12px;font-weight:400;font-family:var(--sans)}
.t td b{font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r3);background:var(--card)}
.card .tw{border:0;border-top:1px solid var(--ln);border-radius:0;margin:0 -16px -16px}
.card.p0 .tw{margin:0;border-radius:0 0 var(--r3) var(--r3)}
/* modal */
.mod{position:fixed;inset:0;background:rgba(31,35,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--card);border-radius:var(--r3);width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.box.w{width:min(980px,100%)}
.box .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--card);z-index:2}
.box .hd h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box .hd h2 small{font-size:13px;color:var(--mut);font-weight:400}
.box .hd .x{margin-left:auto;border:0;background:var(--soft);border-radius:var(--r2);width:34px;height:34px;font-size:18px;flex:none}
.box .bd{padding:16px 18px}
.ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:var(--card)}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.dl div small{display:block;color:var(--mut);font-size:12px}
.dl div b{font-size:14px;font-weight:500}
.dl div b.num{display:block;text-align:left}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.hist{font-size:13px;border-left:1px solid var(--ln);margin-left:4px;padding-left:14px}
.hist div{margin-bottom:7px;position:relative}
.hist div:before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.hist div.er:before{background:var(--er)}
.hist small{color:var(--mut);font-family:var(--mono);font-size:12px}
.hidden-rol{color:var(--mut2);font-size:13px;font-style:normal}
/* forma */
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.frm.f3{grid-template-columns:repeat(3,1fr)}
.frm label,.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--mut)}
.frm .w2{grid-column:span 2}.frm .wf{grid-column:1/-1}.frm .inp{width:100%}
.inp{border:1px solid var(--ln);background:var(--card);border-radius:var(--r2);padding:8px 11px;min-width:0;font-weight:400;color:var(--tx);height:38px}
textarea.inp{height:auto}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.inp.num{text-align:right}
.inp[readonly]{background:var(--soft);color:var(--mut)}
.unit{display:flex;align-items:center;gap:6px}.unit .inp{flex:1}.unit span{color:var(--mut);font-size:13px;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
